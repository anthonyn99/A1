      // tab — and a thumb sized for the old content is worse than none.
      if (window.ResizeObserver){
        try { new ResizeObserver(sync).observe(document.body); } catch(err){}
      }
      sync();
    },

  };
})();

/* Events the agent pushes up. The tray menu and the global hotkeys run entirely

var _agentWired = false;

   actually enforcing it, and it re-arms from disk at logon long before this
   page exists. If the page thinks it is locked down and the agent does not,
   nothing is enforcing anything — showing the takeover screen over a wide-open
   machine would be exactly the fake security this app refuses to provide. */
/* Ask the agent who this device is, BEFORE anything registers.

   Chrome on the same PC despite the identical origin — so a page-generated id

    // app already owns, and a label for a dead shortcut is worse than none.

    } else {
      return;
    }

    //
    // The agent is authoritative for THIS device, and it can start and end a
    // lockdown with no window open — the tray, a hotkey, the remote poller. In
    // all of those the page was not there to write `devices.<id>.local`, so the
    // Devices tab kept showing this PC as LOCKED long after its applications
    // were open again. Correcting only localStorage fixed what this device
    // renders and left every OTHER device lied to.
    //

    writeMine('local', { active: !!e.active, at: e.at || now(), source: e.source || 'local' }, true)
      .catch(function(){});
  }).catch(function(){});
}

/* Capabilities are PROBED, never hardcoded, so an OS update that breaks a
   mechanism shows up as "unavailable" rather than as a silent failure. */
function caps(){
  var agent = Agent.present();
  return {
    agent: agent,
    kill: agent,
    watchdog: agent,
    hideIcons: agent,
    lockWorkstation: agent,
    tray: agent,
    a1lock: true,          // always available: it is this device's own state
    remoteWhileClosed: agent

}

/* ── Emergency state, local half ──────────────────────────────────────────
   Kept in localStorage so a reload — or a phone restart — comes straight back
   into the locked screen before any network is available. */
function emgKey(){ return 'sh_emg_' + S.profile; }
function localEmg(){ return jGet(emgKey(), { active:false, at:0, source:'local', v:0 }); }
function setLocalEmg(o){ jSet(emgKey(), o); }

function globalState(){ return (S.doc && S.doc.global) || { active:false, v:0 }; }
function myDev(){ return (S.doc && S.doc.devices && S.doc.devices[S.devId]) || null; }

/* A device may step out of a GLOBAL emergency on its own (passcode required)
   without lifting it for everyone. It records the global version it opted out
   of; a newer global command re-arms it. */
function optedOut(){
  var d = myDev(), g = globalState();
  return !!(d && d.optOutV && g.v && d.optOutV >= g.v);
}
function globalOn(){ return !!globalState().active; }

/* Does this device's own lockdown belong to the profile-wide one?
   Recorded when it starts. Older records predate the field, and there `remote`
   is decisive: a lockdown this device did not start can only have come from a
   global command. */
function localIsGlobal(le){
  if (le.scope) return le.scope === 'global';
  return le.source === 'remote';
}

/* Is this device locked down?
   A lockdown entered as part of an ALL-DEVICES command belongs to that command
   and ends with it — on the device that raised it just as much as on the ones
   that received it. Without that, `localEmg().active` stayed true after the
   global was lifted anywhere else and the device sat on the takeover screen
   forever, which is exactly what happened in both directions between the PC and
   the phone. Only a genuinely device-local lockdown outlives the global one. */
function emgOn(){
  var le = localEmg();
  var g  = globalOn() && !optedOut();
  if (le.active && localIsGlobal(le)) return g;
  return le.active || g;
}
function emgSource(){
  if (globalOn() && !optedOut()) return 'global';
  var le = localEmg();
  return (le.active && !localIsGlobal(le)) ? 'local' : null;
}

/* ── Config accessors ─────────────────────────────────────────────────────── */
function devRec(id){ return (S.doc && S.doc.devices && S.doc.devices[id]) || null; }
function activeDevId(){ return S.viewDev || S.devId; }
function isReadOnly(){ return !!(S.viewDev && S.viewDev !== S.devId); }
function cfgCloser(id){ var d=devRec(id); return (d && d.closer) || { targets:[] }; }
function cfgEmg(id){
  var d=devRec(id);
  return (d && d.emergency) || { targets:[], lockWorkstation:false, watchdog:true, lockA1Apps:true };
}

/* ── Persistence ──────────────────────────────────────────────────────────
   Every write is FIELD-SCOPED (dotted paths), never a whole-document setDoc.
   Multiple devices share this document, so a whole-doc write would silently
   drop whatever another device saved in between. This is a deliberate
   divergence from MyList's whole-doc pattern, and it removes the lost-update
   problem rather than guarding against it. */
/* The sync indicator.
   "Synced" is confirmation, not status — it says something that has already
   finished, so it shows briefly and goes. "Sync failed" is status: it stays
   until a later write actually succeeds, because a failure that fades looks
   exactly like a success from two seconds later. */
var _syncFade = 0;
function syncState(s){
  var e=$('sync'); if (!e) return;
  clearTimeout(_syncFade);
  e.className = 'sync' + (s==='ok'?' ok':(s==='err'?' err':''));
  e.textContent = s==='saving' ? 'Saving…' : (s==='ok' ? 'Synced' : (s==='err' ? 'Sync failed' : '·'));
  if (s === 'ok'){
    _syncFade = setTimeout(function(){
      // Guard against a newer state having landed while the timer ran — only
      // fade the "Synced" this call put there.
      if (e.textContent === 'Synced') e.classList.add('fade');
    }, 1600);
  }
}
/* Pending writes MERGE rather than replace. Restarting the debounce timer and
   letting the newer call's payload win would silently drop the older one — add
   a target, immediately toggle an option, and the target is gone — and would
   leave the first caller's promise pending forever. Everything queued between
   flushes is coalesced into a single field-scoped update instead, which is also
   one write instead of two. */
/* ── Write circuit breaker ────────────────────────────────────────────────
   A feedback loop between a write and its own snapshot once burned 18,000
   writes and 43,000 reads in a single hour — most of a day's free quota, from
   one wrong comparison. The bug is fixed, but the CLASS of bug is easy to
   reintroduce: any future code that writes in response to a snapshot can do it
   again, and Firestore will happily bill for it until the quota is gone.

   So this caps writes at a rate no legitimate use can reach. Real usage is a
   registration, a few config edits, and one heartbeat every fifteen minutes; a
   runaway does ten a second. Once tripped it stays tripped for the session and
   says so loudly — losing edits is far cheaper than losing the database. */
var WRITE_LIMIT = 40, WRITE_WINDOW = 60000;
var _wrTimes = [], _wrTripped = false;
function writeAllowed(){
  if (_wrTripped) return false;
  var t = now();
  _wrTimes = _wrTimes.filter(function(x){ return x > t - WRITE_WINDOW; });
  if (_wrTimes.length >= WRITE_LIMIT){
    _wrTripped = true;
    console.error('[Shield] Write rate limit tripped: ' + _wrTimes.length + ' writes in '
      + (WRITE_WINDOW/1000) + 's. Refusing further writes this session — this is a runaway loop, '
      + 'not normal use. Reload to reset once the cause is fixed.');
    syncState('err');
    toast('Sync stopped — too many writes. Reload Shield.', true);
    return false;
  }
  _wrTimes.push(t);
  return true;
}

var _pendFlat = null, _pendWaiters = [];
function flushWrite(){
  var flat = _pendFlat, waiters = _pendWaiters;
  _pendFlat = null; _pendWaiters = [];
  if (!flat) return;
  var settle = function(err){
    syncState(err ? 'err' : 'ok');
    if (err) console.warn('[Shield] write failed', err);
    waiters.forEach(function(w){ err ? w.rej(err) : w.res(); });
  };
  if (!window._shUpdate){ settle(new Error('no-firebase')); return; }
  if (!writeAllowed()){ settle(new Error('rate-limited')); return; }
  try { window._shUpdate(S.profile, flat).then(function(){ settle(null); }, settle); }
  catch (e){ settle(e); }
}
function write(flat, immediate){
  flat.savedAt = now();
  syncState('saving');
  _pendFlat = Object.assign(_pendFlat || {}, flat);
  return new Promise(function(res, rej){
    _pendWaiters.push({ res:res, rej:rej });
    if (S.saveTimer){ clearTimeout(S.saveTimer); S.saveTimer = null; }
    if (immediate) flushWrite();
    else S.saveTimer = setTimeout(function(){ S.saveTimer = null; flushWrite(); }, SAVE_DEBOUNCE);
  });
}
function writeMine(field, value, immediate){
  var f = {}; f['devices.' + S.devId + '.' + field] = value;
  return write(f, immediate);
}

/* ══ HISTORY ══════════════════════════════════════════════════════════════
   Every Close Apps run and every Emergency activation records exactly what it
   closed — and, critically, HOW TO START IT AGAIN. The agent captures each
   process's full image path and command line BEFORE terminating it, because
   once the process is gone there is nowhere left to read them from.

   Storage is split on purpose:
     · The full manifest (paths, command lines) stays in localStorage. Restore
       only ever happens on the machine that did the closing — you cannot
       relaunch a PC application from a phone — and executable paths are noise
       on every other device, as well as the bulkiest part of the record.
     · A trimmed summary (labels, counts, outcomes, timestamps) is mirrored
       into the device's Firestore record so the Devices view can show what
       another device did, without paying for the manifest.
   That keeps the shared document small and the write cost at one write per
   user action, which is what the whole sync budget here is built around. */
function histKey(){ return 'sh_hist_' + S.profile + '_' + S.devId; }
function history(){ var h = jGet(histKey(), []); return Array.isArray(h) ? h : []; }
function histSet(list){ jSet(histKey(), list.slice(0, HIST_LOCAL_MAX)); }
function histGet(hid){ var l = history(); for (var i=0;i<l.length;i++) if (l[i].id===hid) return l[i]; return null; }

// What a history entry can still do for you. An entry is restorable only if
// something was actually captured — "not running" targets leave nothing behind.
function histRestorable(e){
  if (!e || e.reverted) return false;
  return (e.items || []).some(function(i){ return (i.launch || []).length; });
}
/* What Reopen would actually start.
   This has to mirror the agent's launch() exactly, or the button lies: it
   prefers the processes that owned a visible window, then dedupes by image
   path. Counting raw manifest entries instead said "Reopen 19 apps" for two
   applications, because a folder target captures every renderer, helper and
   crash handler an app spawns. */
function launchPaths(items){
  var withWin = {}, all = {}, nWin = 0, nAll = 0;
  (items || []).forEach(function(i){
    (i.launch || []).forEach(function(l){
      if (!l || !l.path) return;
      var k = String(l.path).toLowerCase();
      if (!all[k]) { all[k] = 1; nAll++; }
      if (l.hadWindow && !withWin[k]) { withWin[k] = 1; nWin++; }
    });
  });
  return nWin ? Object.keys(withWin) : Object.keys(all);
}
function histCounts(e){
  var closed = 0;
  (e.items || []).forEach(function(i){
    if (i.status === 'closed' || i.status === 'partial') closed += (i.count || 0);
  });
  return { closed: closed, launch: launchPaths(e.items).length };
}

function histAdd(kind, items, extra){
  var d = myDev();
  var e = Object.assign({
    kind: kind,                       // 'closer' | 'emergency'
    at: now(),
    deviceId: S.devId,
    deviceName: (d && d.name) || defaultName(),
    items: items || [],
    hidden: [],                       // shortcuts moved aside, restored on revert
    reverted: false, revertedAt: 0
  }, extra || {});
  // The AGENT mints the id when there is one, because the tray menu and the
  // global hotkeys close applications with no window open — those entries are
  // created agent-side and pulled in later. Sharing the id is what stops the
  // same action appearing twice once the page catches up.
  if (!e.id) e.id = 'h_' + uid();
  var list = history().filter(function(x){ return x.id !== e.id; });
  list.unshift(e); histSet(list);
  syncHistory();
  return e;
}

/* Merge anything the agent recorded while this page was closed. */
function pullAgentHistory(){
  if (!caps().kill) return Promise.resolve(0);
  var newest = history().reduce(function(m, e){ return Math.max(m, e.at || 0); }, 0);
  return Agent.invoke('sh_pull_history', { args: { since: newest } })
    .then(function(res){
      var got = (res && res.entries) || [];
      if (!got.length) return 0;
      var d = myDev(), mine = history();
      var known = {}; mine.forEach(function(e){ known[e.id] = true; });
      var add = got.filter(function(e){ return !known[e.id]; }).map(function(e){
        return Object.assign({ deviceId: S.devId, deviceName: (d && d.name) || defaultName() }, e);
      });
      if (!add.length) return 0;
      var merged = add.concat(mine).sort(function(a, b){ return (b.at||0) - (a.at||0); });
      histSet(merged);
      syncHistory();
      return add.length;
    })
    .catch(function(){ return 0; });
}

/* Push this device's configuration into the agent.
   Without it the tray menu and the hotkeys would have nothing to act on — and
   those are the paths that must keep working with no window and no internet,
   which is the entire reason the agent exists. */
function pushConfig(){
  if (!caps().agent) return Promise.resolve();
  var e = cfgEmg(S.devId);
  return Agent.invoke('sh_set_config', { cfg: {
    profile: S.profile,
    // The agent polls the same guarded endpoint, so it needs the token too.
    // Pushed with the rest of the config rather than fetched separately — the
    // agent has no passcode to prove and should never need one.
    guardKey: guardKey(),
    // So a global emergency raised from the tray or a hotkey names this machine
    // on the other devices' takeover screens.
    deviceName: (devRec(S.devId) && devRec(S.devId).name) || defaultName(),
    closer: cfgCloser(S.devId).targets || [],
    triggers: cfgCloser(S.devId).triggers || [],
    emergency: {
      targets: e.targets || [],
      lockWorkstation: !!e.lockWorkstation,
      watchdog: e.watchdog !== false
    }
  }}).catch(function(){});
}
function histMark(hid, patch){
  var list = history().map(function(e){ return e.id === hid ? Object.assign({}, e, patch) : e; });
  histSet(list);
  syncHistory();
}

// The trimmed mirror. Deliberately drops `launch` (paths + command lines) and
// `hidden` (filesystem locations) — neither is meaningful off-device.
function syncHistory(){
  var slim = history().slice(0, HIST_SYNC_MAX).map(function(e){
    var c = histCounts(e);
    return {
      id: e.id, kind: e.kind, at: e.at, scope: e.scope || 'local',
      source: e.source || 'local', reverted: !!e.reverted, revertedAt: e.revertedAt || 0,
      closed: c.closed, restorable: c.launch,
      items: (e.items || []).slice(0, 20).map(function(i){
        return { label: i.label, status: i.status, count: i.count || 0 };
      })
    };
  });
  writeMine('history', slim).catch(function(){});
}

/* ── Device registration + heartbeat ─────────────────────────────────────── */
/* ── Device claim ─────────────────────────────────────────────────────────
   A device belongs to exactly ONE profile. Without this, switching profiles on
   a machine registered it under both, so T's device list and V's both showed
   the same PC — and an "Emergency — all my devices" from either would reach it.

   Two rules, and the second is structural rather than a check:
     1. Once claimed, the other profile cannot register this device. Releasing
        it requires the OWNER's passcode, so a device cannot be taken over by
        someone who only knows the other profile's.
     2. A device can only ever be claimed from the device itself. Every write
        this app makes to a device record is scoped to `devices.<S.devId>` —
        this page's own id — so there is no code path that creates a record for
        a machine you are not sitting at. Revoking someone else's device is the
        single exception, and that is deliberate. */
function claimedBy(){ return lsGet('sh_claim', ''); }
function setClaim(p){ lsSet('sh_claim', p); }
function clearClaim(){ lsDel('sh_claim'); }
function otherProfile(){ return S.profile === 'veda' ? 'tony' : 'veda'; }

/* Erase this device from the profile that does NOT own it.
   Claiming stops a device being registered twice from now on, but it cannot
   undo what already happened: this machine was registered under a profile
   before claiming existed, so its record still sits in that document and shows
   up in that profile's device list, its "all my devices" count, and its
   emergency screen. Owning one profile has to mean being absent from the other
   everywhere, not merely inactive.

   Runs once per session and only ever touches THIS device's own id — never
   another machine's. */
var _purged = false;
function purgeFromOtherProfile(){
  if (_purged || !S.profile || !S.devId) return Promise.resolve();
  if (!window._shGetOnce || !window._shDeleteDevice) return Promise.resolve();
  _purged = true;
  var other = otherProfile();
  return window._shGetOnce(other).then(function(d){
    if (!d || !d.devices || !d.devices[S.devId]) return;
    return window._shDeleteDevice(other, S.devId).then(function(ok){
      if (ok) console.info('[Shield] removed this device from the "' + other
        + '" profile — a device belongs to one profile only.');
    });
  }).catch(function(){});
}

async function releaseDevice(owner){
  var ok = await window.uiConfirm(
    'This device is claimed by profile ' + (owner === 'veda' ? 'V' : 'T') + '.\n\n'
    + 'Releasing it removes it from that profile and lets the other one claim it. '
    + 'Its configuration and close history on this device are cleared.',
    { title:'Release this device', okLabel:'Release', danger:true });
  if (!ok) return false;

  // The OWNER's passcode, not the profile you are trying to switch to.
  var id = owner + '_shield';
  if (window.AL.isLocked(id)){
    for (var i = 0; i < 3; i++){
      var pw = await window.uiPrompt('Enter the passcode for profile ' + (owner==='veda'?'V':'T') + ' to release this device.',
        { title:'Release this device', password:true, okLabel:'Release' });
      if (pw === null || pw === undefined) return false;
      var r = await window.AL.verifyNow(id, String(pw).trim());
      if (r.ok) break;
      if (i === 2) return false;
      await window.uiAlert('Wrong password.');
    }
  }

  // Erase the record from the owning profile, not just flag it — a released
  // device must not linger in that profile's list, counts or emergency screen.
  try {
    if (window._shDeleteDevice) await window._shDeleteDevice(owner, S.devId);
  } catch(e){}
  _purged = false;   // it may now legitimately need purging from the new side
  lsDel('sh_hist_' + owner + '_' + S.devId);
  lsDel('sh_emg_' + owner);
  clearClaim();
  toast('Device released.');
  return true;
}

function ensureRegistered(){
  var d = myDev();
  var c = caps();
  // Never create a record under a profile that does not own this device.
  if (!d && claimedBy() && claimedBy() !== S.profile) return Promise.resolve();
  if (!d){
    var rec = {
      name: defaultName(), platform: platform(), type: deviceType(),
      ver: '1.0.0', caps: c, lastSeen: now(),
      local: { active:false, at:0, source:'local' },
      closer: { targets: [] },
      emergency: { targets: [], lockWorkstation:false, watchdog:true, lockA1Apps:true },
      optOutV: 0
    };
    var f = {}; f['devices.' + S.devId] = rec;
    return write(f, true).then(function(){ setClaim(S.profile); }).catch(function(){});
  }
  // Already registered here — make the claim explicit for devices that
  // registered before claiming existed.
  if (!claimedBy()) setClaim(S.profile);
  // Refresh the things that legitimately change between sessions.
  var patch = {};
  if (!sameCaps(d.caps, c)) patch['devices.'+S.devId+'.caps'] = c;
  if (d.platform !== platform()) patch['devices.'+S.devId+'.platform'] = platform();
  if (!d.lastSeen || now() - d.lastSeen > 10*60*1000) patch['devices.'+S.devId+'.lastSeen'] = now();
  if (Object.keys(patch).length) return write(patch, true).catch(function(){});
  return Promise.resolve();
}

/* Compare capability maps by VALUE, never by JSON.stringify.
   Firestore returns map keys sorted alphabetically; caps() builds them in
   insertion order. Stringifying the two therefore produced different strings
   for identical data, so ensureRegistered() wrote on every snapshot — and each
   write produced another snapshot. That infinite loop is what burned thousands
   of reads and writes, made the sync indicator strobe, and rebuilt the DOM
   often enough to swallow clicks. Never compare Firestore maps as strings. */
function sameCaps(a, b){
  a = a || {}; b = b || {};
  var ka = Object.keys(a), kb = Object.keys(b);
  if (ka.length !== kb.length) return false;
  for (var i = 0; i < kb.length; i++){
    if (!!a[kb[i]] !== !!b[kb[i]]) return false;
  }
  return true;
}
function heartbeat(){
  var d = myDev();
  if (!d) return;
  if (d.lastSeen && now() - d.lastSeen < 10*60*1000) return;   // still fresh — don't spend a write
  writeMine('lastSeen', now(), true).catch(function(){});
}
function startHeartbeat(){
  if (S.hbTimer) clearInterval(S.hbTimer);
  S.hbTimer = setInterval(function(){ if (!document.hidden) heartbeat(); }, HEARTBEAT_MS);
}

/* ══ ENFORCEMENT ══════════════════════════════════════════════════════════
   Ordering matters. The instant, always-available action runs FIRST and never
   waits on the network; Firestore is written afterwards. In an emergency the
   thing that must not be slow is the closing, not the bookkeeping. ═════════ */

function lockA1Apps(){
  // Clears THIS device's unlock markers for every lock the profile owns that
  // actually has a password on it. Purely local — no version bump, so no other
  // device is disturbed and nothing needs re-setting afterwards.
  var ids = A1_IDS[S.profile] || [], n = 0;
  ids.forEach(function(id){ if (window.AL.isLocked(id)){ window.AL.markLocked(id); n++; } });
  return n;
}

function targetsFor(kind, id){
  if (kind === 'emergency') return cfgEmg(id).targets || [];
  if (kind === 'trigger') return cfgCloser(id).triggers || [];
  return cfgCloser(id).targets || [];
}

/* Tauri rejects an invoke with a plain STRING, not an Error, so reading
   `.message` off it yielded undefined and every failure surfaced as the
   useless word "error". On a tool whose whole job is to be honest about what
   it could not do, that was the worst possible way to fail. */
function errText(e){
  if (e == null) return 'unknown error';
  if (typeof e === 'string') return e;
  if (e.message) return String(e.message);
  try { return JSON.stringify(e); } catch(_){ return String(e); }
}

/* The agent returns one typed result per target, each carrying the launch
   manifest it captured BEFORE terminating anything — full image path, working
   directory and command line per process. That capture has to happen first:
   once the process is gone, there is nothing left to read the path from, and
   without the path there is no way to open it again. */
function resultItems(res){
  return ((res && res.results) || []).map(function(r){
    return {
      label:  r.label || r.match || 'target',
      match:  r.match || '',
      status: r.status || 'failed',
      count:  r.count || 0,
      error:  r.error || '',
      // hadWindow must survive this mapping: it is what tells Reopen which of
      // an app's many processes was the one the user could actually see.
      launch: ((r.launch || []).map(function(l){
        return { path:l.path||'', cmd:l.cmd||'', dir:l.dir||'', name:l.name||'', hadWindow: !!l.hadWindow };
      })).filter(function(l){ return l.path; })
    };
  });
}

// Anything the agent could not do is reported as such — "blocked, needs admin"
// is a different outcome from "closed", and collapsing them would be exactly
// the fake reassurance this app must not give.
function reportLines(items){
  if (!items || !items.length) return [{ kind:'skip', text:'Agent returned no results.' }];
  return items.map(function(r){
    if (r.status === 'closed')     return { kind:'ok',   text: r.label + ' — closed' + (r.count>1 ? ' ('+r.count+' processes)' : '') };
    if (r.status === 'partial')    return { kind:'warn', text: r.label + ' — ' + (r.error || 'partly closed') };
    if (r.status === 'wouldclose') return { kind:'ok',   text: r.label + ' — would close ' + r.count + ' process' + (r.count===1?'':'es') };
    if (r.status === 'notrunning') return { kind:'skip', text: r.label + ' — not running' };
    if (r.status === 'denied')     return { kind:'bad',  text: r.label + ' — ' + (r.error || 'blocked, needs admin') };
    if (r.status === 'notfound')   return { kind:'skip', text: r.label + ' — not found on this device' };
    if (r.status === 'launched')   return { kind:'ok',   text: r.label + ' — reopened' };
    return { kind:'bad', text: r.label + ' — ' + (r.error || 'failed') };
  });
}

/* Runs the local Program Closer, records what it closed, and returns a report
   the UI can show verbatim — per-target, never a single "done" that hides a
   failure. */
function runCloser(){
  var tg = targetsFor('closer', S.devId);
  if (!tg.length) return Promise.resolve({ lines:[{ kind:'skip', text:'No Program Closer targets configured.' }] });
  if (!caps().kill){
    return Promise.resolve({ lines:[{ kind:'bad',
      text:'No Shield agent on this device — a web page cannot close applications. ' + tg.length + ' target(s) untouched.' }] });
  }
  return Agent.invoke('sh_kill', { args: { targets: tg } })
    .then(function(res){
      var items = resultItems(res);
      var entry = histAdd('closer', items, { id: res && res.entryId, scope:'local', source:'local' });
      return { lines: reportLines(items), items: items, entry: entry };
    })
    .catch(function(e){ return { lines:[{ kind:'bad', text:'Agent did not respond: ' + errText(e) }] }; });
}

/* ── Revert ───────────────────────────────────────────────────────────────
   Reopens everything a history entry closed, from the manifest captured at
   close time. Only ever available on the device that owns the entry: the paths
   are that machine's, and no other device can start a process on it.

   Reverting an EMERGENCY entry while that emergency is still live is refused
   rather than attempted — the watchdog would re-close each app the instant it
   appeared, which would look like Shield failing at both jobs at once. Turn
   Emergency Mode off first (which needs the passcode), then revert. */
async function revert(hid){
  var e = histGet(hid);
  if (!e) return;
  if (e.kind === 'emergency' && emgOn()){
    await window.uiAlert('Emergency Mode is still active on this device. Disable it first — otherwise Shield would immediately close these applications again.',
      { title:'Disable Emergency first' });
    return;
  }
  if (!caps().kill){
    await window.uiAlert('This device has no Shield agent, so it cannot start applications.', { title:'Cannot reopen' });
    return;
  }
  var items = (e.items || []).filter(function(i){ return (i.launch || []).length; });
  var total = launchPaths(e.items).length;   // what the agent will actually start
  if (!total){ toast('Nothing recorded to reopen.'); return; }

  var ok = await window.uiConfirm(
    'Reopen ' + total + ' application' + (total===1?'':'s') + ' closed at ' + clock(e.at) + '?',
    { title:'Reopen closed apps', okLabel:'Reopen' });
  if (!ok) return;

  S.busy = true;
  try {
    var lines = [];
    // Emergency entries also stashed shortcuts away; put those back first so
    // the desktop is whole again before anything relaunches.
    if (e.kind === 'emergency'){
      try { await Agent.invoke('sh_restore_icons', { args: { entryId: e.id } }); lines.push({ kind:'ok', text:'Desktop and Start-menu shortcuts restored' }); }
      catch (err){ lines.push({ kind:'bad', text:'Could not restore shortcuts: ' + errText(err) }); }
    }
    var res = await Agent.invoke('sh_launch', { args: { entryId: e.id, items: items } });
    lines = lines.concat(reportLines(resultItems(res)));
    histMark(hid, { reverted:true, revertedAt: now() });
    S.report = lines;
    var bad = lines.filter(function(l){ return l.kind==='bad'; }).length;
    toast(bad ? 'Reopened with ' + bad + ' problem(s).' : 'Reopened.', !!bad);
  } catch (err){
    S.report = [{ kind:'bad', text:'Agent did not respond: ' + errText(err) }];
    toast('Could not reopen — the agent did not respond.', true);
  } finally {
    S.busy = false;
    render();
  }
}

/* Local Emergency Mode. */
/* `scope` is what this lockdown belongs to, not where it came from.
   "global" means it is part of an all-devices command and ends when that
   command does — true both for a device that received one and for the device
   that raised it. Defaults from the source for callers that do not care. */
function runEmergency(source, byName, scope){
  scope = scope || (source === 'remote' ? 'global' : 'local');
  var cfg = cfgEmg(S.devId);
  var lines = [];

  // 1. Instant, offline, always available.
  if (cfg.lockA1Apps !== false){
    var n = lockA1Apps();
    lines.push({ kind:'ok', text: n ? (n + ' A1 app(s) re-locked on this device') : 'No A1 apps have a password set' });
  }

  // 2. Local state first, so a reload during the next step still comes back locked.
  setLocalEmg({ active:true, at:now(), source:source, scope:scope, by:byName||'', v: globalState().v || 0 });
  renderEmergency();

  // 3. Agent work, if there is an agent.
  var tg = cfg.targets || [];
  var p, items = [], hidden = [], agentId = '';
  if (!caps().kill){
    if (tg.length) lines.push({ kind:'bad', text:'No Shield agent on this device — ' + tg.length + ' application target(s) could not be closed.' });
    p = Promise.resolve();
  } else {
    p = Agent.invoke('sh_emergency_on', { args: {
      targets: tg,
      watchdog: cfg.watchdog !== false,
      lockWorkstation: !!cfg.lockWorkstation,
      source: source
    }}).then(function(res){
      agentId = (res && res.entryId) || '';
      items   = resultItems(res);
      hidden  = (res && res.hidden) || [];
      lines   = lines.concat(reportLines(items));
      if (hidden.length) lines.push({ kind:'ok', text: hidden.length + ' shortcut(s) hidden' });
      if (cfg.lockWorkstation) lines.push({ kind:'ok', text:'Workstation locked' });
    }).catch(function(e){
      lines.push({ kind:'bad', text:'Agent did not respond: ' + errText(e) });
    });
  }

  return p.then(function(){
    S.report = lines;
    // Record what was closed and how to start it again, so the lockdown is
    // fully reversible once the passcode has lifted it. The id comes from the
    // agent when there is one, so this entry and the agent's are the same entry.
    histAdd('emergency', items, {
      id: agentId, scope: scope,
      source: source, by: byName || '', hidden: hidden
    });
    renderEmergency();
    // 4. Bookkeeping last.
    writeMine('local', { active:true, at:now(), source:source }, true).catch(function(){});
  });
}

function exitEmergency(){
  setLocalEmg({ active:false, at:now(), source:'local', scope:'local', v:0 });
  S.report = null;
  var p = caps().kill
    ? Agent.invoke('sh_emergency_off', {}).catch(function(){})
    : Promise.resolve();
  return p.then(function(){
    writeMine('local', { active:false, at:now(), source:'local' }, true).catch(function(){});
    render();
  });
}

/* ── Passcode challenge ───────────────────────────────────────────────────
   Always a LIVE verification, deliberately ignoring the per-device unlock
   marker. "This device already opened Shield once" must never be enough to
   lift a lockdown — that is the whole point of the passcode on this path. */
function lockId(){ return S.profile + '_shield'; }
/* Returns { ok, password }.
   The password comes back because lifting a GLOBAL emergency is now verified
   server-side by the Worker — it will not accept an OFF without it — so the
   caller has to be able to forward what the user typed. */
async function challenge(title, message){
  var id = lockId();
  if (!window.AL.isLocked(id)){
    var ok = await window.uiConfirm(
      message + '\n\nNo Shield passcode is set for this profile, so this cannot be passcode-protected. Set one in Configure ▸ Security.',
      { title:title, okLabel:'Continue anyway', danger:true });
    return { ok: !!ok, password: '' };
  }
  for (var i = 0; i < 3; i++){
    var pw = await window.uiPrompt(message, { title:title, password:true, okLabel:'Confirm' });
    if (pw === null || pw === undefined) return { ok:false, password:'' };
    pw = String(pw).trim();
    if (!pw) continue;
    var r = await window.AL.verifyNow(id, pw);
    if (r.ok){
      if (r.offline) toast('Verified offline — the Worker was unreachable.');
      return { ok:true, password: pw };
    }
    if (r.offlineUnavailable){ await window.uiAlert('Offline, and this device has no local verifier. Reconnect and try again.'); return { ok:false, password:'' }; }
    await window.uiAlert('Wrong password.' + (i < 2 ? ' Try again.' : ''));
  }
  return { ok:false, password:'' };
}

/* Publish the profile-wide emergency signal.

   This is what actually reaches a device whose browser is shut. Firestore still
   holds the state the UI reads; this is the channel the desktop agent polls,
   because a Firestore poll would be a billed read per device per poll and this
   project has already nearly exhausted that quota once.

   Failure is reported, never swallowed: if the signal does not land, devices
   that are not looking at Firestore will not react, and the user has to know
   that rather than assume everything locked. */
var SHIELD_WORKER = 'https://taskhub-reminders.av1.workers.dev';

/* ── Guard token ──────────────────────────────────────────────────────────
   An opaque per-profile secret that gates the emergency endpoint. It exists
   because the iOS guard puts that URL into an Apple Shortcut and prints it in
   the setup wizard — at which point an unauthenticated endpoint means anyone
   holding the URL could close every application on every device of the
   profile. Minted by the Worker only on proof of the Shield passcode.

   Cached per device. It is not a password and never unlocks anything; it only
   makes the endpoint addressable by its owner. */
function guardKey(){ return lsGet('sh_guardkey_' + S.profile, ''); }
function setGuardKey(k){ lsSet('sh_guardkey_' + S.profile, k); }

/* Fetch (minting if needed) the profile's guard token.
   `password` is required whenever the profile has a Shield passcode set. */
function fetchGuardKey(password, rotate){
  return fetch(SHIELD_WORKER + '/shield/key', {
    method:'POST', headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ profile: S.profile, password: password || '', rotate: !!rotate })
  }).then(function(r){ return r.json(); })
    .then(function(j){
      if (!j || !j.ok || !j.k) return null;
      setGuardKey(j.k);
      pushConfig();
      // Share it with the profile's other devices. Minting happens on whichever
      // device ran the wizard — most likely the phone — but the DESKTOP agent
      // polls the same guarded endpoint, and a token it never receives means it
      // silently starts getting 403s and stops hearing about remote
      // emergencies. That is the failure this write exists to prevent.
      //
      // The document is a reasonable place for it: anyone who can read this doc
      // can already read AND set the emergency state directly, so the token
      // grants them nothing new. Its job is to stop people who have merely seen
      // the URL — in the wizard, in a Shortcut, over someone's shoulder — and
      // against that it is unaffected by living here.
      if (guardOf(S.doc) !== j.k) write({ guard: j.k }, true).catch(function(){});
      return j.k;
    })
    .catch(function(){ return null; });
}

function guardOf(d){ return (d && typeof d.guard === 'string') ? d.guard : ''; }

/* Keep this device's token and the profile's token in step.
   Runs on every snapshot, and is what makes minting on the phone reach the PC
   in about a second instead of at its next unlock.

   The document is the authority when the two disagree, because that is where a
   rotation lands and there has to be exactly one winner. The other direction —
   we hold a token the document does not — covers a mint whose write failed, and
   retries it. Both branches are no-ops in the normal case, so this costs nothing
   per snapshot. */
function syncGuardKey(){
  var theirs = guardOf(S.doc), mine = guardKey();
  if (theirs && theirs !== mine){ setGuardKey(theirs); pushConfig(); return; }
  if (mine && !theirs) write({ guard: mine }, true).catch(function(){});
}

function publishGlobal(active, v, password){
  var d = myDev();
  return fetch(SHIELD_WORKER + '/shield/emergency', {
    method:'POST', headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({
      profile: S.profile, active: !!active, v: v,
      byId: S.devId, byName: (d && d.name) || defaultName(),
      password: password || '', k: guardKey()
    })
  }).then(function(r){ return r.json(); })
    .then(function(j){ return !!(j && j.ok); })
    .catch(function(){ return false; });
}

/* ══ ACTIONS ══════════════════════════════════════════════════════════════ */
async function actCloseApps(){
  if (S.busy) return;
  S.busy = true;
  try {
    var r = await runCloser();
    var bad  = r.lines.filter(function(l){ return l.kind==='bad'; }).length;
    var warn = r.lines.filter(function(l){ return l.kind==='warn'; }).length;
    var ok   = r.lines.filter(function(l){ return l.kind==='ok'; }).length;
    var problems = bad + warn;
    toast(problems ? (ok + ' closed, ' + problems + ' problem(s)')
                   : (ok ? ok + ' closed' : 'Nothing to close'), !!bad);
    if (problems) S.report = r.lines;
    // Always repaint: the "Last closed" card and its Reopen button have to be
    // there the instant the close finishes, not whenever the Firestore echo
    // happens to come back.
    renderHome(); renderHistory();
  } finally { S.busy = false; }
}

async function actEmergencyLocal(){
  if (S.busy) return;
  S.busy = true;
  try { await runEmergency('local', ''); }
  finally { S.busy = false; }
}

async function actEmergencyGlobal(){
  if (S.busy) return;
  S.busy = true;
  try {
    var d = myDev();
    var v = now();
    // Local enforcement first — the device in the user's hand must not wait on
    // a round trip. The fan-out follows.
    //
    // Scope "global" even though this device raised it: the lockdown is part of
    // the all-devices command, so lifting that command from the phone has to
    // release this machine too.
    await runEmergency('local', '', 'global');
    // Two channels, deliberately. Firestore is what the UI reads on devices
    // with Shield open; the Worker signal is what a device with its browser
    // CLOSED polls for. Neither alone reaches everything.
    var sent = await publishGlobal(true, v, '');
    await write({
      'global.active': true, 'global.v': v, 'global.at': v,
      'global.byId': S.devId, 'global.byName': (d && d.name) || defaultName(),
      'global.scope': 'all'
    }, true).catch(function(e){
      toast('Locked this device, but the all-device command did not reach Firebase.', true);
    });
    if (!sent){
      toast('Locked, but devices with Shield closed may not have been reached.', true);
    }
    setLocalEmg(Object.assign(localEmg(), { v:v }));
  } finally { S.busy = false; }
}

async function actDisableLocal(){
  var c = await challenge('Disable on this device',
    globalOn()
      ? 'Enter the Shield passcode to release THIS device. The all-device emergency stays active everywhere else.'
      : 'Enter the Shield passcode to disable Emergency Mode on this device.');
  if (!c.ok) return;
  if (globalOn()){
    // Step out of the current global command without lifting it for anyone
    // else. A newer global command re-arms this device automatically.
    await writeMine('optOutV', globalState().v || now(), true).catch(function(){});
  }
  await exitEmergency();
  toast('Emergency Mode disabled on this device.');
}

async function actDisableGlobal(){
  var c = await challenge('Disable on all devices',
    'Enter the Shield passcode to lift Emergency Mode on EVERY device on this profile. Offline devices will exit when they reconnect.');
  if (!c.ok) return;
  var v = now();
  // The Worker re-verifies the passcode server-side before it will accept an
  // OFF — the UI check alone used to be the only thing standing between a
  // client and clearing everyone's lockdown.
  var sent = await publishGlobal(false, v, c.password);
  await write({
    'global.active': false, 'global.v': v, 'global.at': v,
    'global.byId': S.devId, 'global.byName': (myDev() && myDev().name) || defaultName()
  }, true).catch(function(){ toast('Could not reach Firebase — other devices still locked.', true); });
  await exitEmergency();
  toast(sent ? 'Emergency Mode lifted on all devices.'
             : 'Lifted here, but the all-device signal did not send — other devices may stay locked.', !sent);
}

/* ══ RENDER ═══════════════════════════════════════════════════════════════ */
function svg(body, cls){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"'
       + (cls?(' class="'+cls+'"'):'') + '>' + body + '</svg>';
}
var GLYPH = {
  shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/>',
  x:      '<path d="M18 6 6 18M6 6l12 12"/>',
  plus:   '<path d="M12 5v14M5 12h14"/>',
  eye:    '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',
  back:   '<path d="m15 18-6-6 6-6"/>',
  pencil: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  trash:  '<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  lock:   '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  unlock: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/>',
  alert:  '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="M12 8v5"/><path d="M12 16.5h.01"/>',
  check:  '<path d="m20 6-11 11-5-5"/>',
  down:   '<path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>'
};

/* Render ONLY the view the user is looking at.
   Rebuilding all four on every snapshot threw away the DOM the user was
   interacting with — a button replaced between mousedown and mouseup never
   fires its click, which is why some presses had to be repeated, and the
   constant reflow is what made hover states flicker. The other views are
   rendered lazily by go() when they become visible. */
function render(){
  if (!S.profile) return;
  if (emgOn()){ renderEmergency(); return; }
  $('emg-screen').classList.remove('on');
  renderLockBtn();
  renderView(S.view);
}
function renderView(v){
  if (v === 'config') renderConfig();
  else if (v === 'devices') renderDevices();
  else if (v === 'history') renderHistory();
  else renderHome();
}
function renderLockBtn(){
  var b = $('lock-btn'); if (!b) return;
  var locked = window.AL.isLocked(lockId());
  b.innerHTML = svg(locked ? GLYPH.lock : GLYPH.unlock);
  b.title = locked ? 'Shield is locked — manage lock' : 'Set a Shield passcode';
}

/* ── Home ─────────────────────────────────────────────────────────────────── */
function renderHome(){
  var c = caps(), me = myDev();
  var closerN = targetsFor('closer', S.devId).length;
  var emgN    = targetsFor('emergency', S.devId).length;
  var devs    = devList();

  var h = '';
  // The global hotkeys, shown quietly in the corner of the button they fire.
  // They work from anywhere in Windows, so the button is the one place someone
  // is guaranteed to look for them — but they only exist with the agent, and
  // only when Windows let Shield have the key.
  function kbd(which){
    var k = S.hotkeys && S.hotkeys[which];
    return k ? '<span class="kbd">' + esc(k) + '</span>' : '';
  }

  h += '<div class="qa">';
  h +=   '<button class="big close" id="a-close"' + (closerN ? '' : ' disabled') + '>'
      +    kbd('close')
      +    '<span class="lbl">Close Apps</span>'
      +    '<span class="sub">' + (closerN ? closerN + ' target' + (closerN===1?'':'s') + ' on this device' : 'No targets configured yet') + '</span>'
      +  '</button>';
  h +=   '<button class="big emg" id="a-emg">'
      +    kbd('emergency')
      +    '<span class="lbl">Emergency</span>'
      +    '<span class="sub">Lock down this device' + (emgN ? ' · ' + emgN + ' target' + (emgN===1?'':'s') : '') + '</span>'
      +  '</button>';
  h +=   '<button class="hold" id="a-emg-all"><span class="fill"></span>'
      +    kbd('all')
      +    '<span class="lbl">Emergency — All My Devices</span>'
      +    '<span class="sub">Hold to activate on all ' + devs.length + ' device' + (devs.length===1?'':'s') + '</span>'
      +  '</button>';
  h += '</div>';

  // The honest capability line. If this device cannot enforce anything, that is
  // the single most important thing on the screen — not a footnote.
  if (!c.agent){
    h += '<div class="sec"><div class="card" style="border-color:var(--errl)">'
      +  '<div class="cap no"><span class="mk">✕</span><span class="tx"><b>No Shield agent on this device.</b> '
      +  'A web page cannot close, hide or block other applications — there is no browser API for it. '
      +  'Shield can still re-lock your A1 apps here and command your other devices.</span></div>'
      +  '</div></div>';
  }

  if (S.report && S.report.length){
    h += '<div class="sec"><div class="sec-head"><span class="sec-title">Last action</span>'
      +  '<button class="btn sm" id="a-clear-report">Dismiss</button></div>'
      +  '<div class="emg-report">' + reportHtml(S.report) + '</div></div>';
  }

  // The most recent close, with its Reopen button. "I closed the wrong thing"
  // is the common case and should cost one tap, not a trip through a tab.
  var last = history()[0];
  if (last){
    h += '<div class="sec"><div class="sec-head"><span class="sec-title">Last closed</span>'
      +  '<button class="btn sm" data-goto="history">All history</button></div>'
      +  histCardHtml(last, { own:true }) + '</div>';
  }

  h += '<div class="sec"><div class="sec-head"><span class="sec-title">Devices</span>'
    +  '<button class="btn sm" data-goto="devices">Manage</button></div>';
  h += devs.map(function(d){ return devRowHtml(d, true); }).join('') || '<div class="empty">No devices registered yet.</div>';
  h += '</div>';

  // Two-column only when there is something to put in the second column.
  // A lone actions block beside empty space reads worse than one centred one.
  $('v-home').className = 'view active' + ((last || devs.length > 1) ? ' two-col' : '');
  $('v-home').innerHTML = h;

  var cb = $('a-close'); if (cb) cb.onclick = actCloseApps;
  var eb = $('a-emg'); if (eb) eb.onclick = actEmergencyLocal;
  wireHold($('a-emg-all'), actEmergencyGlobal);
  var cr = $('a-clear-report'); if (cr) cr.onclick = function(){ S.report=null; renderHome(); };
  wireGoto($('v-home'));
  wireRevert($('v-home'));
}
function wireRevert(root){
  Array.prototype.forEach.call(root.querySelectorAll('[data-revert]'), function(b){
    b.onclick = function(){ revert(b.getAttribute('data-revert')); };
  });
}

// Hold-to-fire. Pointer events cover mouse, touch and pen with one path, and
// the CSS fill doubles as the progress indicator so there is nothing extra to
// read under pressure.
function wireHold(btn, fn){
  if (!btn) return;
  var t = null;
  function start(e){
    if (e.button != null && e.button !== 0) return;
    btn.classList.add('holding');
    t = setTimeout(function(){ stop(); fn(); }, HOLD_MS);
  }
  function stop(){ if (t){ clearTimeout(t); t=null; } btn.classList.remove('holding'); }
  btn.addEventListener('pointerdown', start);
  btn.addEventListener('pointerup', stop);
  btn.addEventListener('pointerleave', stop);
  btn.addEventListener('pointercancel', stop);
}
function wireGoto(root){
  Array.prototype.forEach.call(root.querySelectorAll('[data-goto]'), function(b){
    b.onclick = function(){ go(b.getAttribute('data-goto')); };
  });
}

function reportHtml(lines){
  return lines.map(function(l){
    var m = l.kind==='ok' ? '✓' : (l.kind==='bad' ? '✕' : (l.kind==='warn' ? '!' : '·'));
    return '<div class="ln"><span class="m ' + l.kind + '">' + m + '</span><span>' + esc(l.text) + '</span></div>';
  }).join('');
}

/* ── Devices ──────────────────────────────────────────────────────────────── */
function devList(){
  var d = (S.doc && S.doc.devices) || {};
  return Object.keys(d).filter(function(k){ return !d[k].revoked; }).map(function(k){
    return Object.assign({ id:k }, d[k]);
  }).sort(function(a,b){
    if (a.id === S.devId) return -1;
    if (b.id === S.devId) return 1;
    return (b.lastSeen||0) - (a.lastSeen||0);
  });
}
function devOnline(d){ return !!(d.lastSeen && now() - d.lastSeen < ONLINE_WINDOW); }
function devLocked(d){
  var g = globalState();
  if (g.active && !(d.optOutV && g.v && d.optOutV >= g.v)) return true;
  return !!(d.local && d.local.active);
}
function devRowHtml(d, compact){
  var me = d.id === S.devId, on = devOnline(d), locked = devLocked(d);
  var h = '<div class="dev' + (me?' me':'') + '">';
  h += '<span class="dot' + (on?' on':'') + '"></span>';
  h += '<div class="dev-main"><div class="dev-name">' + esc(d.name || 'Device');
  if (me) h += '<span class="tag me">This device</span>';
  if (locked) h += '<span class="tag locked">Locked</span>';
  h += '</div><div class="dev-meta">' + platLabel(d.platform) + ' · ' + (on ? 'Active' : 'Last seen ' + ago(d.lastSeen))
    +  ((d.caps && d.caps.agent) ? ' · Agent' : ' · No agent') + '</div></div>';
  if (!compact){
    h += '<button class="btn sm" data-dev-view="' + esc(d.id) + '">' + (me ? 'Edit' : 'View') + '</button>';
    if (!me) h += '<button class="iconbtn danger" data-dev-remove="' + esc(d.id) + '" title="Remove device">' + svg(GLYPH.trash) + '</button>';
    if (me)  h += '<button class="iconbtn" data-dev-rename="' + esc(d.id) + '" title="Rename">' + svg(GLYPH.plus) + '</button>';
  }
  h += '</div>';
  return h;
}
function renderDevices(){
  var devs = devList();
  var h = '<div class="sec"><div class="sec-head"><span class="sec-title">Devices on this profile</span></div>';
  h += devs.map(function(d){ return devRowHtml(d, false); }).join('');
  h += '</div>';
  // Install on another PC. Sits in Devices because that is where you go when
  // you are thinking about a machine that is not this one.
  h += '<div class="sec"><div class="sec-head"><span class="sec-title">Add a Windows PC</span></div>'
    +  '<div class="card">'
    +  '<div class="opt"><div class="opt-main"><div class="opt-name">Shield agent for Windows</div>'
    +  '<div class="opt-sub" id="dl-sub">Without it a browser cannot close, hide or block anything. '
    +  'Install it on any PC, then choose a profile on that PC.</div></div>'
    +  '<button class="btn sm ac" id="a-download">' + svg(GLYPH.down) + 'Download</button></div>'
    +  '<div class="hint" style="padding-top:10px">Always the newest build: it is compiled from the '
    +  'repository every time Shield changes, and this button fetches whatever came out of that. '
    +  'Unsigned, so Windows will say <b>\"Windows protected your PC\"</b> — <b>More info</b> → '
    +  '<b>Run anyway</b>. Installs for your user only and never asks for admin.</div>'
    +  '</div></div>';

  Array.prototype.forEach.call($('v-devices').querySelectorAll('[data-dev-view]'), function(b){

/* ── Download the Windows agent ────────────────────────────────────────────
   The agent is a Rust binary, so unlike Vault's extension this page cannot
   package it: nothing in a browser can compile one. A GitHub Actions workflow
   builds it on every change to desktop/shield and publishes it to a single
   ROLLING release tag, and this asks for that tag — so there is exactly one URL
   and no way to be served an older build because a version was not bumped.

   The release body carries the commit and build time; both are shown, because
   "is this actually the latest?" is the only question worth answering here. */
var SHIELD_REPO = 'anthonyn99/A1';
var SHIELD_RELEASE_TAG = 'shield-latest';

function relTime(iso){
  var t = Date.parse(iso); if (!t) return '';
  var mins = Math.round((Date.now() - t) / 60000);
  if (mins < 60) return mins + ' min ago';
  var hrs = Math.round(mins / 60);
  if (hrs < 24) return hrs + ' hour' + (hrs===1?'':'s') + ' ago';
  var d = Math.round(hrs / 24);
  return d + ' day' + (d===1?'':'s') + ' ago';
}

async function downloadAgent(){
  var btn = $('a-download'), sub = $('dl-sub');
  if (!btn || btn.disabled) return;
  var label = btn.innerHTML;
  btn.disabled = true; btn.textContent = 'Finding build…';
  try {
    var r = await fetch('https://api.github.com/repos/' + SHIELD_REPO + '/releases/tags/' + SHIELD_RELEASE_TAG,
                        { headers: { Accept: 'application/vnd.github+json' } });
    if (r.status === 404){
      // The workflow has never completed. Say exactly that rather than
      // "download failed", which would send someone hunting the wrong problem.
      await window.uiAlert(
        'No installer has been published yet.\n\nThe build runs automatically when Shield changes; the first one takes a few '
        + 'minutes. Check the Actions tab of the repository, then try again.',
        { title:'Not built yet' });
      return;
    }
    if (!r.ok) throw new Error('GitHub returned ' + r.status);
    var rel = await r.json();
    var asset = (rel.assets || []).filter(function(a){ return /\.exe$/i.test(a.name); })[0];
    if (!asset) throw new Error('that build published no .exe');

    // No `download` attribute: the asset is on a different origin, where the
    // browser ignores it. GitHub sends Content-Disposition: attachment, so a
    // plain navigation saves the file instead of trying to render it.
    var a = document.createElement('a');
    a.href = asset.browser_download_url;
    a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();

    var mb = (asset.size / 1048576).toFixed(1);
    var when = relTime(asset.updated_at || rel.published_at);
    toast('Downloading Shield-Setup.exe (' + mb + ' MB)');
    if (sub){
      sub.innerHTML = 'Latest build, published ' + esc(when) + ' · ' + mb + ' MB. '
        + 'Run it on the PC you want to add, then choose a profile there.';
    }
  } catch(e){
    await window.uiAlert('Could not reach the build service: ' + errText(e)
      + '\n\nCheck your connection and try again.', { title:'Download failed' });
  } finally {
    btn.disabled = false; btn.innerHTML = label;
  }
}

async function removeDevice(id){
  var d = devRec(id); if (!d) return;
  var locked = devLocked(d);
  var msg = 'Remove “' + (d.name||'Device') + '” from this profile? It will stop syncing and has to re-register with the passcode.';
  if (locked) msg += '\n\nNote: that device is currently in Emergency Mode. Removing it does NOT unlock it — revoking a device must never be a way around the passcode. It stays locked until someone disables Emergency Mode on the device itself.';
  var ok = await window.uiConfirm(msg, { title:'Remove device', okLabel:'Remove', danger:true });
  if (!ok) return;
  if (!(await challenge('Remove device', 'Enter the Shield passcode to remove this device.')).ok) return;
  var f = {}; f['devices.' + id + '.revoked'] = true;
  await write(f, true).catch(function(){ toast('Could not remove the device.', true); });
  if (S.viewDev === id) S.viewDev = null;
  toast('Device removed.');
}

function histCardHtml(e, opts){

/* How a typed value should be matched.

  return /\.[a-z0-9]{1,5}$/i.test(value) ? 'path' : 'folder';

/* ── iOS guard: local state ───────────────────────────────────────────────
   The list of guarded apps and the setup progress are per-device and never
   leave it. They describe what the person built in the Shortcuts app on THIS
   phone; syncing them would say nothing true about any other device, and the
   app names themselves are the sort of thing worth keeping off a server. */
function iosApps(){
  try { var a = JSON.parse(lsGet('sh_ios_apps_' + S.profile, '[]')); return Array.isArray(a) ? a : []; }
  catch(e){ return []; }
}
function setIosApps(a){ lsSet('sh_ios_apps_' + S.profile, JSON.stringify(a.slice(0, 40))); }
function iosStep(n){ return lsGet('sh_ios_step_' + S.profile + '_' + n, '') === '1'; }
function setIosStep(n, on){ lsSet('sh_ios_step_' + S.profile + '_' + n, on ? '1' : '0'); }

/* The URL the Shortcut fetches. Token only — no profile name. The Worker looks
   the profile up from the token, precisely so this string can be shown on
   screen and pasted into Shortcuts without naming anybody. */
function guardUrl(){
  var k = guardKey();
  return k ? SHIELD_WORKER + '/shield/emergency?k=' + k : '';
}

function stepHtml(n, title, body, extra){
  return '<div class="wiz' + (iosStep(n) ? ' done' : '') + '">'
       + '<button class="wiz-tick" data-step="' + n + '" aria-label="Mark step done">' + svg(GLYPH.check) + '</button>'
       + '<div class="wiz-body"><div class="wiz-title"><span class="wiz-n">' + n + '</span>' + title + '</div>'
       + '<div class="wiz-text">' + body + '</div>' + (extra || '') + '</div></div>';
}

/* ── Phones and tablets: the closest thing that is actually possible ───────
   A web app cannot hide, close or block another app on iOS or Android. There
   is no API, and it is not a permission that can be requested — so Shield does
   not pretend.

   On iOS there is exactly one free mechanism that does real work, and it runs
   backwards from what you would expect. Shield cannot PUSH a lockdown to the
   phone; iOS gives a web app no background execution, and even a native app's
   silent pushes are throttled and dropped after a force-quit. But an iOS 17+
   personal automation can run with no confirmation prompt when a chosen app is
   opened — so the phone can ASK Shield, at the only moment that matters. Open
   Instagram, the automation fires, it reads the emergency state from the same
   Worker the desktop agent polls, and locks the screen if one is live. Pull,
   not push, because pull is what Apple permits.

   Android gets no equivalent here by choice — see below. */
function tabPhoneHandoff(id){
  var p = (devRec(id) && devRec(id).platform) || platform();
  if (p !== 'ios' && p !== 'android') return '';
  var mine = id === S.devId;

  if (p === 'ios') return iosGuardHtml(mine);

  var h = '<div class="sec"><div class="sec-head"><span class="sec-title">On this ' + (deviceType()==='tablet'?'tablet':'phone') + '</span></div><div class="card">';
  {
    h += '<div class="opt"><div class="opt-main"><div class="opt-name">Focus mode</div>'
      +  '<div class="opt-sub">Android\'s own app blocker. Add its Quick Settings tile and it is one swipe from anywhere '
      +  '— faster than opening Shield.</div></div></div>';
    h += '<div class="hint" style="padding-top:10px">'
      +  '<b>Setting it up, once:</b><br>'
      +  '1. Settings → <b>Digital Wellbeing &amp; parental controls</b> → <b>Focus mode</b><br>'
      +  '2. Tick the apps to block — Instagram, Discord, whatever matters<br>'
      +  '3. Swipe down twice → pencil → drag <b>Focus mode</b> into your Quick Settings<br><br>'
      +  'A blocked app is greyed out and its notifications held. Android gives no way for another app to turn this on for '
      +  'you, so it is a swipe rather than a button here.</div>';
  }

  h += '<div class="hint" style="padding-top:10px;border-top:1px solid var(--bd);margin-top:4px">'
    +  '<b>What Shield does do here:</b> EMERGENCY re-locks every A1 app instantly and offline, and <b>All My Devices</b> '
    +  'reaches your PC with its browser closed. The limit is other people\'s apps, not yours.</div>';
  h += '</div></div>';
  return h;
}

/* The iOS guard setup surface. Read on a phone, by someone who is not going to
   enjoy it — so it is a numbered checklist with its progress remembered, not a
   wall of prose. Almost all the work in this feature is here rather than in the
   mechanism, because the mechanism is six actions and the setup is where a

function iosGuardHtml(mine){

    +  'is, the screen locks about a second later. Raise it anywhere — here, your PC, <b>All My Devices</b> — and these apps '
    +  'stop opening until you lift it.'
    +  '<br><br>All of it is Apple\'s own Shortcuts app. Nothing installed, nothing to pay, and you can take it apart the '
    +  'same way you put it together.</div></div></div>';

  /* Guarded apps. Kept above the steps because step 3 is per-app and reads far
     better once the list is already on screen. */
  h += '<div class="sec"><div class="sec-head"><span class="sec-title">Guarded apps</span>'
    +  (mine ? '<button class="btn sm ac" id="a-ios-add">' + svg(GLYPH.plus) + 'Add</button>' : '') + '</div>';
  h += apps.length
    ? '<div class="card">' + apps.map(function(a){
        return '<div class="opt"><div class="opt-main"><div class="opt-name">' + esc(a) + '</div>'
             + '<div class="opt-sub">Needs one automation — step 3.</div></div>'
             + (mine ? '<button class="iconbtn danger" data-iosdel="' + esc(a) + '" title="Remove">' + svg(GLYPH.x) + '</button>' : '')
             + '</div>';
      }).join('') + '</div>'
    : '<div class="empty">No guarded apps yet. Add the ones that should refuse to open during an emergency.</div>';
  h += '</div>';

  // Another device's phone: the list is all that is meaningful here. The steps
  // are actions taken in the Shortcuts app on the device itself.
  if (!mine) return h;

  /* ── The five steps ─────────────────────────────────────────────────── */
  h += '<div class="sec"><div class="sec-head"><span class="sec-title">Setup</span></div>';

  h += stepHtml(1, 'Get your guard link',
    'A private link that answers one question: is an emergency running? It cannot read your data, change anything, or start '
    + 'one. Shield asks for your passcode once to create it.',
    url
      ? '<div class="guard-url"><code id="guard-url-txt">' + esc(url) + '</code></div>'
        + '<div class="wiz-btns"><button class="btn sm ac" id="a-guard-copy">Copy link</button>'
        + '<button class="btn sm" id="a-guard-rotate">Replace link</button></div>'

        + 'the new one into the shortcut in step 2.</div>'
      : '<div class="wiz-btns"><button class="btn sm ac" id="a-guard-get">Create guard link</button></div>');

  h += stepHtml(2, 'Build the <b>Shield Guard</b> shortcut',
    'Shortcuts app → <b>+</b> → rename it exactly <code>Shield Guard</code>, then add these four actions in order:'
    + '<ol class="wiz-ol">'
    + '<li><b>Get Contents of URL</b> — paste the link from step 1.</li>'
    + '<li><b>Get Dictionary Value</b> — key <code>active</code>.</li>'
    + '<li><b>If</b> — <i>Dictionary Value</i> <b>is</b> <code>true</code>.</li>'
    + '<li>Inside the If: <b>Lock Screen</b>. Leave <i>Otherwise</i> empty.</li>'
    + '</ol>'
    + 'Run it once from the Shortcuts app. With no emergency running it should do nothing at all.');

  h += stepHtml(3, 'One automation per guarded app',
    'Shortcuts → <b>Automation</b> → <b>+</b> → <b>App</b> → choose it → tick <b>Is Opened</b> → <b>Next</b> → '
    + '<b>Shield Guard</b> → <b>Run Immediately</b>.'
    + '<div class="wiz-note"><b>Run Immediately matters.</b> The other setting asks permission every time, which makes the '
    + 'whole thing useless. Needs iOS 17 or newer.</div>'
    + (apps.length
        ? '<div class="wiz-note">One each for: <b>' + apps.map(esc).join('</b>, <b>') + '</b>.</div>'
        : '<div class="wiz-note">Add your apps above first, so you know how many to make.</div>'));

  h += stepHtml(4, 'Two automations for reconnecting',
    'The check only runs when an app is <i>opened</i>, so an app already open when the internet returns is never '
    + 're-checked. These two cover that. Made once, shared by every guarded app:'
    + '<ol class="wiz-ol">'
    + '<li><b>Airplane Mode</b> → <b>Is Turned Off</b> → Shield Guard → Run Immediately.</li>'
    + '<li><b>Wi-Fi</b> → <b>Any Network</b> → Shield Guard → Run Immediately.</li>'
    + '</ol>'
    + 'Aeroplane mode is the one-tap way to dodge the guard, so both are worth having.');

  h += stepHtml(5, 'Hide the icons too',
    'Blocking stops an app opening; it does not take it off the Home Screen. Make a second shortcut named exactly '
    + '<code>Shield Emergency</code>: <b>Set Focus</b> → a Focus whose Home Screen leaves those apps out → <b>Lock '
    + 'Screen</b>. The button below runs it.'
    + '<div class="wiz-note">For anything that should never be casually opened — Wallet, Photos, banking — iOS 18 beats '
    + 'this: long-press → <b>Require Face ID</b> → <b>Hide and Require Face ID</b>. Free, built in, stronger than a '
    + 'Focus.</div>',
    '<div class="wiz-btns"><a class="btn sm ac" href="shortcuts://run-shortcut?name=Shield%20Emergency">Run Shield Emergency</a></div>');

  h += '</div>';

  /* ── The limits. Not a footnote — this is the part that keeps the feature
     honest, and it says the same things the Windows capability panel does. */
  h += '<div class="sec"><div class="sec-head"><span class="sec-title">What this does not do</span></div><div class="card">'
    +  '<div class="cap part"><span class="mk">~</span><span class="tx"><b>The app flashes before it closes.</b> It opens, '
    +  'asks Shield, then the screen locks — about a second. The same limit as the desktop\'s "flashes then dies".</span></div>'
    +  '<div class="cap part"><span class="mk">~</span><span class="tx"><b>With no internet, apps open normally.</b> '
    +  'Shortcuts has no error handling — a failed fetch stops it dead, so nothing can run afterwards to fall back on. '
    +  'Step 4 covers most of this. What it cannot cover is coming back on <b>cellular only</b>, with a guarded app left '
    +  'open throughout: Apple exposes no cellular trigger, so nothing re-checks until you reopen the app.</span></div>'
    +  '<div class="cap no"><span class="mk">✕</span><span class="tx"><b>Nothing is pushed here.</b> The phone reacts when '
    +  'you act on it. A phone on a table does not lock itself.</span></div>'
    +  '<div class="cap no"><span class="mk">✕</span><span class="tx"><b>Hidden is not blocked.</b> A Focus hides Home '
    +  'Screen pages; the app is still in Spotlight and the App Library. Only an app with its own automation is stopped.</span></div>'
    +  '<div class="cap no"><span class="mk">✕</span><span class="tx"><b>You can switch the automations off.</b> Your phone, '
    +  'two taps away — exactly like ending the agent in Task Manager. Shield raises the cost of a careless moment; it does '
    +  'not defeat you.</span></div>'
    +  '</div></div>';

  h += '<div class="sec"><div class="hint">Blocking that survives all of that needs Apple\'s Family Controls entitlement '
    +  '(paid account, case-by-case approval) or a supervised device (needs a Mac, erases the phone). Both were ruled out, '
    +  'so this is the strongest free version — described exactly as it behaves.</div></div>';

  return h;
}

function optHtml(key, on, name, sub, disabled){

       + '<div class="opt-sub">' + sub + '</div></div>'

/* The capability panel. Written from what the device actually reports, and
   phrased so nothing here can be mistaken for a promise the OS will not keep. */
function capsHtml(d){
  var c = (d && d.caps) || {}, p = (d && d.platform) || 'browser';
  function row(kind, txt){ return '<div class="cap ' + kind + '"><span class="mk">' + (kind==='yes'?'✓':(kind==='part'?'~':'✕')) + '</span><span class="tx">' + txt + '</span></div>'; }
  var h = '';
  h += row('yes', '<b>Re-lock A1 apps</b> — always available, works offline.');
  if (c.agent){
    h += row('yes',  '<b>Close applications</b> — same-user processes. Elevated and service processes need Shield running as admin.');
    h += row('part', '<b>Keep them closed</b> — killed on sight, about once a second. Windows 11 Home has no AppLocker, so there is no true launch block: a target flashes on screen before it closes.');
    h += row('part', '<b>Hide launch points</b> — desktop and Start-menu shortcuts hide <b>in place</b>, so every icon returns to the square it left, and they are matched by what they point at rather than their name. Two limits: with Explorer set to show hidden <i>and</i> protected system files, Shield moves them instead and positions are lost; Store apps and pinned tiles have no shortcut to hide.');
    h += row('no',   '<b>Unpin from the taskbar</b> — not automatable on Windows 11; the pin is an undocumented registry blob that needs Explorer restarted. Do not pin anything you would need Shield to hide.');
    h += row('yes',  '<b>Lock the workstation</b> — instant and completely reliable.');
    h += row('part', '<b>Reopen what was closed</b> — paths and command lines are recorded before termination, so History can start them again. Apps open fresh; unsaved work is not recovered, and anything unreadable before closing cannot be reopened.');
    h += row('part', '<b>Survives a restart</b> — Shield re-arms at logon. Ending the agent in Task Manager stops enforcement until you sign in again; a self-restarting watchdog would behave like malware.');
  } else {
    h += row('no', '<b>Close applications</b> — needs the Shield desktop agent. A web page cannot terminate a process.');
    h += row('no', '<b>Hide or block applications</b> — needs the Shield desktop agent.');
  }
  if (p === 'ios'){
    // Deliberately specific about which of the three layers is doing the work,
    // because they fail in completely different ways and "iOS blocking works"
    // would be the wrong thing to remember during an emergency.
    var n = iosApps().length;
    h += row(n ? 'part' : 'no', '<b>Block other apps</b> — ' + (n
      ? n + ' app' + (n===1?'' : 's') + ' set up. Opening one during an emergency locks the screen about a second later. '
        + 'The phone asks Shield rather than the other way round, so it only fires on open — and with no internet the app '
        + 'opens normally.'
      : 'nothing set up yet. iOS can be made to ask Shield whether an emergency is running each time a chosen app opens. '
        + 'See <b>Block apps on this iPhone</b> above.'));
    h += row('part', '<b>Hide app icons</b> — a Focus keeps sensitive apps off your Home Screen, one tap from here. They stay '
       + 'reachable from Spotlight and the App Library; hidden is not blocked. For the ones that matter most, iOS 18\'s own '
       + '<b>Hide and Require Face ID</b> is stronger than anything Shield can offer.');
    h += row('no', '<b>Anything pushed to this device</b> — iOS gives a web app no background execution, so nothing happens '
       + 'while the phone sits untouched. Every check runs because you opened something.');
  } else if (p === 'android'){
    h += row('no', '<b>Block Instagram, Discord, Photos, Wallet…</b> — impossible from a web app on Android. It needs a '
       + 'native build with usage access and an overlay service, which Shield does not ship. Use Digital Wellbeing\'s Focus '
       + 'mode for those.');
  }
  h += row('yes', '<b>Command your other devices</b> — Emergency reaches every device on this profile'
     + (c.remoteWhileClosed ? '.' : ', though a device without the agent only reacts while Shield is open on it.'));
  return h;
}
