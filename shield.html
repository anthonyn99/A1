<!-- ── Single-tab handoff ──────────────────────────────────────────────────────
     Keeps exactly one tab per program. TaskHub can only focus an existing tab
     inside the browsing context group that opened it, so a PWA relaunch lands
     here in a new tab beside the old one. Chrome forbids focusing the old tab
     (WindowClient.focus() throws outside a notification click), so instead the
     newest tab wins: each tab announces itself and older tabs for the same page
     close themselves. Full rationale in tradehub.html; keep these copies
     identical. Opt out of being closed with window.__a1BlockTabHandoff = true. -->
<script>
(function(){
  if (typeof BroadcastChannel !== 'function') return;
  var PAGE = (location.pathname.split('/').pop() || 'index.html').toLowerCase();
  var BORN = Date.now() + Math.random();   // random breaks ties on same-ms opens
  var bc; try { bc = new BroadcastChannel('a1-single-tab'); } catch(e){ return; }
  function announce(){ try { bc.postMessage({ type:'claim', page:PAGE, born:BORN }); } catch(e){} }
  bc.onmessage = function(e){
    var d = e.data || {};
    if (!d || d.type !== 'claim' || d.page !== PAGE) return;
    if (d.born > BORN) {
      if (window.__a1BlockTabHandoff) return;
      try { window.close(); } catch(_){}
    } else {
      announce();   // older tab was still loading when we announced — retell it
    }
  };
  announce();
})();
</script>

<style>
/* ══════════════════════════════════════════════════════════════════════════
   SHIELD — emergency application closer and lockdown system
   --------------------------------------------------------------------------
   ONE component set, TWO palettes. Rather than fork the whole stylesheet per
   profile (which is how the suite's older dual-profile pages drifted apart),
   every component reads profile-scoped custom properties set on <body> — the
   same technique mylist.html uses. Switching profile re-themes the entire app
   by changing one attribute.

   Token names follow vault.html's short form (--bg/--s1/--ac/--tx…) because
   the App Lock overlay CSS is lifted verbatim from there and already speaks it.

   Suite rules inherited:
     · Never introduce a new hue. --ac for emphasis, --err/--grn for meaning.
     · Tony: gold #e0b874 on #1a1a1d, radius 9/6, Manrope + Inter.
     · Veda: purple #8D769A on #1B1C1E, radius 5 everywhere, Playfair + Plex Mono.
       (V1/shared/tokens.css says 10/14/20px radii — that doc is stale, ships at 5.)
   ══════════════════════════════════════════════════════════════════════════ */

/* Suite tokens — mirrored verbatim from index.html:47. */
:root{
  --gold-primary:#e0b874;
  --suite-display:'Manrope',system-ui,-apple-system,sans-serif;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
}

/* ── TONY (also the neutral default, so the profile chooser and any overlay
      shown before a profile is picked have a complete palette) ────────────── */
body,body[data-profile="tony"]{
  --bg:#1a1a1d; --s1:#232327; --s2:#2c2c31; --s3:#37373d;
  --bd:#34343a; --bdl:#45454c;
  --tx:#f4f3f0; --txd:#adadb2; --txm:#8d8d94;
  --ac:#e0b874; --acs:#e0b874; --acl:rgba(224,184,116,.36); --acbg:rgba(224,184,116,.10);
  --err:#d68a7c; --errl:rgba(214,138,124,.40); --errbg:rgba(214,138,124,.10);
  --grn:#a4b986; --amber:#d9b38f;
  --shadow:rgba(0,0,0,.42);
  --radius:9px; --radius-sm:6px;
  --display:'Manrope',system-ui,-apple-system,sans-serif;
  --sans:'Inter',system-ui,-apple-system,sans-serif;
  --head-tr:none; --head-ls:-.3px; --head-wt:700;
  --base-size:15px;
  --transition:.18s cubic-bezier(.4,0,.2,1);
}
/* ── VEDA ─────────────────────────────────────────────────────────────────── */
body[data-profile="veda"]{
  --bg:#1B1C1E; --s1:#26272A; --s2:#303135; --s3:#3A3B40;
  --bd:#3D3E43; --bdl:#4A4B52;
  --tx:#ECECEE; --txd:#AFB0B5; --txm:#76777C;
  --ac:#8D769A; --acs:#A892B0; --acl:rgba(141,118,154,.45); --acbg:#2E2535;
  --err:#E74C3C; --errl:rgba(231,76,60,.45); --errbg:rgba(231,76,60,.12);
  --grn:#5DAF6D; --amber:#D9A33A;
  --shadow:rgba(0,0,0,.55);
  --radius:5px; --radius-sm:5px;
  --display:'Playfair Display',Georgia,serif;
  --sans:'IBM Plex Mono',ui-monospace,monospace;
  --head-tr:uppercase; --head-ls:1px; --head-wt:900;
  --base-size:13px;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;height:100%;overflow-x:clip}
@supports (-webkit-touch-callout:none){ html{height:-webkit-fill-available} }
body{
  background:var(--bg); color:var(--tx);
  font-family:var(--sans); font-size:var(--base-size); line-height:1.55;
  min-height:100vh; min-height:100dvh;
  overflow-x:clip; -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:contain;
  transition:background var(--transition),color var(--transition);
}
/* Scrollbars are hidden globally across the suite. Shield draws its own
   instead — see #scroller. */
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
a{color:var(--acs);text-decoration:none}
button,a,label,select,[role="button"]{touch-action:manipulation}
button:focus:not(:focus-visible){outline:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,select,textarea,button{font-family:var(--sans)}

/* ── Boot gate ─────────────────────────────────────────────────────────────
   Nothing paints until we know which screen is legitimate. Same contract as
   applock.js's body[data-sos-gate]: no configuration or device list may flash
   on screen before the profile gate has resolved. */
#app{display:none}
body[data-gate="app"] #app{display:block}
body[data-gate="app"] #profile-overlay{display:none}

/* ══ PROFILE CHOOSER — letterforms only. The brief is explicit: T and V, never
      the full names, anywhere in the Shield UI. ══════════════════════════════ */
#profile-overlay{
  position:fixed;inset:0;z-index:1000;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:34px;
  /* Full-screen overlays have to respect the cutout too. This one is centred,
     so it usually clears the Dynamic Island by luck — but on a short screen in
     landscape it did not. */
  padding:calc(var(--safe-t) + 24px) calc(var(--safe-r) + 24px)
          calc(var(--safe-b) + 24px) calc(var(--safe-l) + 24px);
}
.pf-mark{display:flex;flex-direction:column;align-items:center;gap:10px}
.pf-mark svg{width:52px;height:52px}
.pf-word{font-family:var(--suite-display);font-size:26px;font-weight:750;letter-spacing:-.5px;color:var(--gold-primary)}
.pf-sub{font-size:10px;font-weight:600;letter-spacing:2.4px;text-transform:uppercase;color:#8d8d94}
.pf-cards{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.pf-card{
  position:relative;width:132px;height:150px;background:#232327;
  border:1px solid #34343a;border-radius:12px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  transition:border-color .18s,box-shadow .18s,transform .06s;
}
.pf-card:hover{transform:translateY(-2px)}
.pf-card:active{transform:translateY(0)}
.pf-card .glyph{font-size:60px;line-height:1;font-weight:800}
.pf-card.t{border-color:rgba(224,184,116,.28)}
.pf-card.t .glyph{font-family:'Manrope',sans-serif;color:#e0b874}
.pf-card.t:hover{border-color:#e0b874;box-shadow:0 0 14px rgba(224,184,116,.22)}
.pf-card.v{background:#26272A;border-color:rgba(141,118,154,.30)}
.pf-card.v .glyph{font-family:'Playfair Display',serif;font-weight:900;color:#8D769A}
.pf-card.v:hover{border-color:#8D769A;box-shadow:0 0 14px rgba(141,118,154,.26)}
.pf-lock{position:absolute;top:9px;right:9px;line-height:0;color:#8d8d94}
.pf-lock svg{width:15px;height:15px}
.pf-card.v .pf-lock{color:#76777C}
.pf-emg{
  position:absolute;bottom:9px;left:9px;right:9px;text-align:center;
  font-size:8.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;
  color:#d68a7c;
}
.pf-claim{
  position:absolute;bottom:9px;left:9px;right:9px;text-align:center;
  font-size:8.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;
  color:#8d8d94;
}
/* A profile that does not own this device stays visible and clickable — it
   leads to the release flow — but reads as unavailable rather than normal. */
.pf-card.foreign{opacity:.42}
.pf-card.foreign:hover{transform:none;box-shadow:none}
.pf-star{
  position:absolute;top:7px;left:9px;font-size:15px;line-height:1;
  color:#5a5a61;cursor:pointer;transition:color .15s,transform .06s;
}
.pf-star:hover{transform:scale(1.15)}
.pf-card.t .pf-star.on{color:#e0b874}
.pf-card.v .pf-star.on{color:#8D769A}

/* ══ SHELL ══════════════════════════════════════════════════════════════════ */
.topbar{
  position:sticky;top:0;z-index:60;background:var(--bg);
  border-bottom:1px solid var(--bd);
  /* The status-bar style is black-translucent, so the page renders UNDER the
     Dynamic Island and `safe-area-inset-top` is what clears it (~59px on an
     island iPhone, 0 in a desktop window). Only a small gap is added on top of
     that — the inset already includes the island's own clearance, so anything
     larger leaves a dead band under it rather than sitting right below. */
  padding:calc(var(--safe-t) + 6px) calc(14px + var(--safe-r)) 9px calc(14px + var(--safe-l));
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.brand{
  font-family:var(--display);font-size:20px;font-weight:var(--head-wt);
  letter-spacing:var(--head-ls);text-transform:var(--head-tr);
  color:var(--ac);display:flex;align-items:center;gap:8px;white-space:nowrap;
}
.brand svg{width:20px;height:20px;flex-shrink:0;color:var(--ac)}
.spacer{flex:1;min-width:8px}
.pf-badge{
  width:26px;height:26px;border-radius:var(--radius-sm);flex-shrink:0;
  border:1px solid var(--acl);color:var(--ac);background:transparent;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
  font-family:var(--display);font-size:14px;font-weight:var(--head-wt);line-height:1;
  transition:border-color var(--transition);
}
.pf-badge:hover{border-color:var(--ac)}
.sync{
  font-size:9.5px;font-weight:600;letter-spacing:1px;text-transform:uppercase;
  color:var(--txm);white-space:nowrap;opacity:1;transition:opacity .5s ease;
}
.sync.ok{color:var(--grn)} .sync.err{color:var(--err)}
/* Only ever applied to "Synced" — see syncState(). A failure has to stay put. */
.sync.fade{opacity:0}

/* NOTE: left/right were swapped here — safe-l was padding the right edge. On a
   notched phone in landscape the nav slid under the cutout on one side only. */
.nav{
  display:flex;gap:6px;padding:10px calc(14px + var(--safe-r)) 0 calc(14px + var(--safe-l));
  max-width:900px;margin:0 auto;overflow-x:auto;
}
.wrap{
  max-width:900px;margin:0 auto;
  padding:14px calc(clamp(12px,3vw,24px) + var(--safe-r))
          calc(var(--safe-b) + 48px) calc(clamp(12px,3vw,24px) + var(--safe-l));
}
.view{display:none} .view.active{display:block}

/* ── Buttons ───────────────────────────────────────────────────────────────
   Rest is quiet; emphasis is a glowing outline, never a filled wash. The one
   exception is .pill.on, which is Veda's canonical "active = filled accent". */
.btn{
  appearance:none;background:transparent;color:var(--tx);
  border:1px solid var(--bdl);border-radius:var(--radius-sm);
  font-size:10.5px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase;
  padding:0 14px;height:32px;cursor:pointer;line-height:1;white-space:nowrap;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:border-color var(--transition),color var(--transition),box-shadow var(--transition),transform .05s;
}
.btn:hover{border-color:var(--txd)}
.btn:active{transform:translateY(1px)}
.btn.ac{border-color:var(--acl);color:var(--ac)}
.btn.ac:hover{border-color:var(--ac);box-shadow:0 0 8px var(--acbg)}
.btn.danger{border-color:var(--errl);color:var(--err)}
.btn.danger:hover{border-color:var(--err);background:var(--errbg)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn[disabled]:hover{border-color:var(--bdl);box-shadow:none}
.btn svg{width:14px;height:14px;flex-shrink:0}
.btn.sm{height:26px;padding:0 10px;font-size:9.5px}
.iconbtn{
  appearance:none;background:transparent;border:none;color:var(--txm);cursor:pointer;
  padding:5px;border-radius:var(--radius-sm);line-height:0;
  display:inline-flex;align-items:center;justify-content:center;transition:color var(--transition);
}
.iconbtn:hover{color:var(--tx)}
.iconbtn.danger:hover{color:var(--err)}
.iconbtn svg{width:15px;height:15px}
.pill{
  appearance:none;background:transparent;color:var(--ac);
  border:1px solid var(--bdl);border-radius:var(--radius-sm);
  height:28px;padding:0 11px;font-size:10px;font-weight:700;
  letter-spacing:1px;text-transform:uppercase;cursor:pointer;white-space:nowrap;
  display:inline-flex;align-items:center;gap:5px;flex-shrink:0;
  transition:all var(--transition);
}
.pill:hover{border-color:var(--ac)}
.pill.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
body[data-profile="tony"] .pill.on{background:transparent;color:var(--ac);box-shadow:inset 0 0 0 1px var(--acl),0 0 6px var(--acbg)}
/* Configure's sub-tabs are a second level of navigation sitting directly under
   the accent-coloured main nav. Painting both in the accent made the screen
   read as two competing rows; neutral grey here keeps the hierarchy legible and
   leaves the accent to mean "primary". */
.pill.sub{color:var(--txd);border-color:var(--bd)}
.pill.sub:hover{color:var(--tx);border-color:var(--bdl)}
.pill.sub.on,
body[data-profile="tony"] .pill.sub.on,
body[data-profile="veda"] .pill.sub.on{
  background:transparent;color:var(--tx);border-color:var(--txd);box-shadow:none;
}

input[type=text],input[type=password],select{
  width:100%;background:var(--s2);color:var(--tx);
  border:1px solid var(--bd);border-radius:var(--radius-sm);
  font-size:13px;padding:9px 11px;outline:none;transition:border-color var(--transition);
}
input:focus,select:focus{border-color:var(--acl)}
input::placeholder{color:var(--txm)}
/* Edge/WebView2 draws its own "reveal password" eye inside password fields, as
   a solid BLACK glyph — invisible against every surface in this app. It cannot
   be recoloured directly, so invert it to a light tone that matches the muted
   text around it. Hiding it outright would cost a genuinely useful control. */
input[type=password]::-ms-reveal,
input[type=password]::-ms-clear{
  filter:invert(1) brightness(1.6);
  opacity:.5;cursor:pointer;transition:opacity .15s;
}
input[type=password]::-ms-reveal:hover,
input[type=password]::-ms-clear:hover{opacity:.95}
label.fld{display:block;font-size:9.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--txm);margin-bottom:5px}

/* ── Cards / sections ─────────────────────────────────────────────────────── */
.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--radius);padding:14px 16px}
.sec{margin-bottom:22px}
.sec-head{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding-bottom:7px;margin-bottom:11px;border-bottom:1px solid var(--bd);
}
.sec-title{font-size:9.5px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--txd)}
.hint{font-size:11.5px;color:var(--txm);line-height:1.5}
.hint.warn{color:var(--amber)}
.empty{
  border:1px dashed var(--bd);border-radius:var(--radius);
  padding:20px 16px;text-align:center;color:var(--txm);font-size:11.5px;line-height:1.6;
}

/* ══ QUICK ACTIONS — the screen that matters in an emergency. Both primary
      buttons sit above the fold on a phone and take one tap. ══════════════════ */
.qa{display:flex;flex-direction:column;gap:10px;margin-bottom:22px}
.big{
  position:relative;
  appearance:none;width:100%;background:transparent;cursor:pointer;
  border:1px solid var(--bdl);border-radius:var(--radius);
  padding:20px 16px;display:flex;flex-direction:column;align-items:center;gap:5px;
  transition:border-color var(--transition),box-shadow var(--transition),transform .05s;
}
/* Keyboard hint. Deliberately quiet — it should be findable when looked for and
   invisible when not, so it never competes with the action itself. */
.kbd{
  position:absolute;top:8px;right:10px;
  font-family:ui-monospace,'Cascadia Mono',Consolas,monospace;
  font-size:9px;letter-spacing:.3px;line-height:1;
  color:var(--txm);opacity:.55;
  border:1px solid var(--bd);border-radius:4px;padding:3px 5px;
  pointer-events:none;white-space:nowrap;
  transition:opacity var(--transition),color var(--transition);
}
.big:hover .kbd{opacity:.95;color:var(--txd)}
/* On the hold button the label sits above the sliding fill, and its border
   picks up the danger colour so the chord reads as the same weight as the
   action it fires. */
.hold .kbd{z-index:1;border-color:var(--errl)}
.hold:hover .kbd{opacity:.95;color:var(--err)}
.big[disabled] .kbd{opacity:.3}
@media(max-width:400px){ .kbd{display:none} }
.big:active{transform:translateY(1px)}
.big .lbl{
  font-family:var(--display);font-size:19px;font-weight:var(--head-wt);
  letter-spacing:2px;text-transform:uppercase;color:var(--tx);line-height:1;
}
.big .sub{font-size:10.5px;letter-spacing:.6px;color:var(--txm);text-align:center}
.big.close{border-color:var(--acl)}
.big.close .lbl{color:var(--ac)}
.big.close:hover{border-color:var(--ac);box-shadow:0 0 12px var(--acbg)}
.big.emg{border-color:var(--errl)}
.big.emg .lbl{color:var(--err)}
.big.emg:hover{border-color:var(--err);box-shadow:0 0 12px var(--errbg)}
.big[disabled]{opacity:.42;cursor:not-allowed}
.big[disabled]:hover{box-shadow:none}

/* Hold-to-fire. The global action has a much larger blast radius than the local
   one, so it costs a deliberate 800ms press instead of a tap. The fill is the
   progress indicator — no separate spinner to read under pressure. */
.hold{
  position:relative;overflow:hidden;
  appearance:none;width:100%;background:transparent;cursor:pointer;
  border:1px dashed var(--errl);border-radius:var(--radius);
  padding:13px 16px;display:flex;flex-direction:column;align-items:center;gap:3px;
  transition:border-color var(--transition);
}
.hold:hover{border-color:var(--err)}
.hold .lbl{position:relative;z-index:1;font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--err)}
.hold .sub{position:relative;z-index:1;font-size:10px;color:var(--txm);text-align:center}
.hold .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--errbg);z-index:0;pointer-events:none}
.hold.holding .fill{transition:width .8s linear;width:100%}
.hold[disabled]{opacity:.42;cursor:not-allowed}

/* ── Device rows ──────────────────────────────────────────────────────────── */
.dev{
  display:flex;align-items:center;gap:10px;
  background:var(--s1);border:1px solid var(--bd);border-radius:var(--radius);
  padding:10px 13px;margin-bottom:8px;
}
.dev.me{border-color:var(--acl)}
.dev-main{flex:1;min-width:0}
.dev-name{font-size:12.5px;font-weight:600;color:var(--tx);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.dev-meta{font-size:10px;color:var(--txm);letter-spacing:.4px;margin-top:2px}
.tag{
  font-size:8.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;
  padding:2px 6px;border-radius:3px;border:1px solid var(--bdl);color:var(--txm);white-space:nowrap;
}
.tag.me{border-color:var(--acl);color:var(--ac)}
.tag.on{border-color:var(--grn);color:var(--grn)}
.tag.locked{border-color:var(--err);color:var(--err)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--txm);flex-shrink:0}
.dot.on{background:var(--grn)}

/* ── Target rows ──────────────────────────────────────────────────────────── */
.tgt{
  display:flex;align-items:center;gap:9px;
  background:var(--s1);border:1px solid var(--bd);border-radius:var(--radius);
  padding:9px 12px;margin-bottom:7px;
}
.tgt-main{flex:1;min-width:0}
.tgt-label{font-size:12.5px;font-weight:600;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tgt-match{font-size:10px;color:var(--txm);font-family:ui-monospace,monospace;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toggle{
  width:34px;height:18px;border-radius:9px;background:var(--bd);position:relative;
  cursor:pointer;transition:background .25s;border:none;padding:0;flex-shrink:0;
}
.toggle.on{background:var(--ac)}
.toggle i{position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--tx);transition:left .25s;display:block}
.toggle.on i{left:18px}
.toggle[disabled]{opacity:.4;cursor:not-allowed}
.tgt-opt{display:flex;align-items:center;gap:7px;flex-shrink:0}
.tgt-opt-l{
  font-size:8.5px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;
  color:var(--txm);line-height:1.15;text-align:right;white-space:nowrap;
}
.opt{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--bd)}
.opt:last-child{border-bottom:none}
.opt-main{flex:1;min-width:0}
.opt-name{font-size:12px;font-weight:600;color:var(--tx)}
.opt-sub{font-size:10.5px;color:var(--txm);line-height:1.45;margin-top:1px}

/* ── Read-only banner ─────────────────────────────────────────────────────── */
.ro-bar{
  display:none;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--acbg);border:1px solid var(--acl);border-radius:var(--radius);
  padding:10px 13px;margin-bottom:14px;
}
.ro-bar.on{display:flex}
.ro-txt{flex:1;min-width:160px;font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--ac)}
.ro fieldset{border:none}
/* A read-only pane must LOOK inert, not just refuse writes. */
.ro .tgt,.ro .opt{opacity:.72}

/* ── Scrollbar ──────────────────────────────────────────────────────────────
   Drawn rather than native, for two reasons. The suite hides native scrollbars
   everywhere, and on a phone the native one is a passive indicator that cannot
   be dragged at all — it only tells you where you are. History and the iOS
   wizard both run several screens long, where "how much is left" and "get me to
   the bottom" are real questions, so this one is grabbable with a cursor and a
   thumb identically. It appears only when there is something to scroll. */
#scroller{
  position:fixed;z-index:120;
  right:max(3px,var(--safe-r));width:15px;
  /* Clear of the sticky topbar, so the thumb is never hidden behind it. */
  top:calc(var(--safe-t) + 54px);bottom:calc(var(--safe-b) + 10px);
  display:none;touch-action:none;
  -webkit-user-select:none;user-select:none;
}
#scroller.on{display:block}
#scroller .track{position:absolute;left:6px;top:0;bottom:0;width:3px;border-radius:2px;background:var(--bd)}
#scroller .thumb{
  position:absolute;left:4px;width:7px;min-height:34px;border-radius:4px;
  background:var(--txm);opacity:.45;cursor:grab;
  transition:opacity .15s,background .15s,width .12s,left .12s;
}
#scroller:hover .thumb{opacity:.9}
#scroller.drag .thumb{opacity:1;background:var(--ac);cursor:grabbing;width:11px;left:2px}
/* A 15px-wide target is a cursor target. A finger needs the whole strip, so the
   hit area widens while the drawn parts stay the same size. */
/* Not drawn on touch at all.
   A finger already scrolls the page directly and iOS draws its own indicator,
   so a custom bar competes with both: it fights momentum scrolling, and the
   viewport it measures keeps moving under it as the URL bar collapses. It was
   never adding anything a thumb could not already do. Cursor-only from here. */
@media (pointer: coarse){
  #scroller{display:none !important}
}

/* ── Capability panel — the honest one. Never claim more than the OS allows. ── */
.cap{display:flex;align-items:flex-start;gap:9px;padding:7px 0;font-size:11.5px;line-height:1.45}
.cap .mk{flex-shrink:0;width:14px;text-align:center;font-weight:700;line-height:1.45}
.cap.yes .mk{color:var(--grn)} .cap.part .mk{color:var(--amber)} .cap.no .mk{color:var(--err)}
.cap .tx{color:var(--txd)}
.cap .tx b{color:var(--tx);font-weight:600}

/* ── iOS guard wizard. A numbered checklist, read on a phone by someone who is
      about to build six Shortcuts actions by hand. Ticks persist, so it can be
      put down halfway through and picked up later. ─────────────────────────── */
.wiz{
  display:flex;gap:11px;align-items:flex-start;
  border:1px solid var(--bd);border-radius:var(--radius);
  padding:12px 13px;margin-bottom:8px;background:var(--s1);
}
.wiz.done{border-color:var(--acl);background:var(--acbg)}
.wiz-tick{
  flex-shrink:0;width:24px;height:24px;margin-top:1px;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--bd);border-radius:var(--radius);
  background:transparent;color:transparent;cursor:pointer;transition:.14s;
}
.wiz-tick:hover{border-color:var(--txd);color:var(--txm)}
.wiz-tick svg{width:14px;height:14px}
.wiz.done .wiz-tick{border-color:var(--ac);color:var(--ac)}
.wiz-body{flex:1;min-width:0}
.wiz-title{
  display:flex;align-items:baseline;gap:8px;
  font-size:12px;font-weight:600;color:var(--tx);margin-bottom:5px;
}
.wiz.done .wiz-title{color:var(--txd)}
.wiz-n{
  flex-shrink:0;font-size:10px;font-weight:700;color:var(--ac);
  font-variant-numeric:tabular-nums;
}
.wiz-text{font-size:11.5px;line-height:1.6;color:var(--txd)}
.wiz-text b{color:var(--tx);font-weight:600}
.wiz-text code{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;
  background:var(--bg);border:1px solid var(--bd);border-radius:4px;padding:1px 5px;color:var(--tx);
}
.wiz-ol{margin:7px 0;padding-left:18px}
.wiz-ol li{margin-bottom:4px}
.wiz-note{
  margin-top:8px;padding-left:9px;border-left:2px solid var(--bd);
  font-size:11px;line-height:1.55;color:var(--txm);
}
.wiz-btns{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
/* The guard link is a long opaque token that has to be read and copied
   accurately. It wraps rather than truncating — a link cut off at the edge of a
   phone screen is a link that gets pasted wrong. */
.guard-url{
  margin-top:9px;padding:9px 10px;background:var(--bg);
  border:1px solid var(--bd);border-radius:var(--radius);
}
.guard-url code{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;line-height:1.5;
  color:var(--ac);word-break:break-all;user-select:all;-webkit-user-select:all;
}

/* ══ EMERGENCY SCREEN — full takeover. Unmistakable at a glance, from across
      the room, with the two exits as the only interactive things on it. ══════ */
#emg-screen{
  display:none;position:fixed;inset:0;z-index:900;
  background:var(--bg);
  background-image:radial-gradient(120% 60% at 50% -10%,var(--errbg),transparent 72%);
  overflow-y:auto;
}
#emg-screen.on{display:block}
.emg-wrap{
  min-height:100%;max-width:520px;margin:0 auto;
  padding:calc(var(--safe-t) + 22px) calc(var(--safe-r) + 22px)
          calc(var(--safe-b) + 34px) calc(var(--safe-l) + 22px);
  display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;
}
.emg-icon{line-height:0;color:var(--err)}
.emg-icon svg{width:46px;height:46px}
.emg-title{
  font-family:var(--display);font-size:clamp(38px,13vw,60px);font-weight:var(--head-wt);
  letter-spacing:5px;text-transform:uppercase;color:var(--err);line-height:1;
}
.emg-scope{font-size:10.5px;font-weight:700;letter-spacing:2.4px;text-transform:uppercase;color:var(--txd)}
.emg-meta{
  width:100%;background:var(--s1);border:1px solid var(--bd);border-radius:var(--radius);
  padding:13px 15px;display:flex;flex-direction:column;gap:7px;text-align:left;
}
.emg-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:11.5px}
.emg-row .k{font-size:9.5px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--txm);white-space:nowrap}
.emg-row .v{color:var(--tx);text-align:right;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.emg-devs{width:100%;display:flex;flex-direction:column;gap:5px;text-align:left}
.emg-dev{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:8px 12px;border:1px solid var(--bd);border-radius:var(--radius-sm);font-size:11.5px;
}
.emg-dev .n{color:var(--tx);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.emg-actions{width:100%;display:flex;flex-direction:column;gap:9px;margin-top:4px}
.emg-note{font-size:10.5px;color:var(--txm);line-height:1.55;max-width:400px}
.emg-report{
  width:100%;text-align:left;font-size:11px;color:var(--txd);line-height:1.6;
  background:var(--s1);border:1px solid var(--bd);border-radius:var(--radius);padding:11px 13px;
}
.emg-report .ln{display:flex;gap:8px}
.emg-report .ln .m{flex-shrink:0;width:12px;text-align:center;font-weight:700}
.emg-report .ok{color:var(--grn)} .emg-report .bad{color:var(--err)} .emg-report .skip{color:var(--txm)}
.emg-report .warn{color:var(--amber)}

/* ── Toast ────────────────────────────────────────────────────────────────── */
#toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(var(--safe-b) + 20px);z-index:2147482000;
  background:var(--s2);border:1px solid var(--bdl);border-radius:var(--radius);
  padding:10px 16px;font-size:12px;color:var(--tx);
  box-shadow:0 12px 34px var(--shadow);
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
  max-width:calc(100vw - 32px);text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
#toast.bad{border-color:var(--errl);color:var(--err)}

/* ── App Lock overlay ── lifted from vault.html:98-124, retokenised ────────── */
#applock-overlay{position:fixed;inset:0;z-index:2147483000;background:var(--bg);display:none;align-items:center;justify-content:center;font-family:var(--sans);padding:calc(var(--safe-t) + 20px) calc(var(--safe-r) + 20px) calc(var(--safe-b) + 20px) calc(var(--safe-l) + 20px);overflow-y:auto}
#applock-box{display:flex;flex-direction:column;align-items:center;gap:18px;padding:34px 30px 22px;background:var(--s1);border:1px solid var(--acl);border-radius:18px;width:350px;max-width:calc(100vw - 32px);box-shadow:0 32px 80px rgba(0,0,0,.7);position:relative}
#applock-head{text-align:center;display:flex;flex-direction:column;gap:5px}
#applock-form{width:100%;display:flex;flex-direction:column;gap:10px}
#applock-links{display:flex;flex-direction:column;align-items:center;gap:5px}
#applock-foot{width:100%;padding-top:14px;border-top:1px solid var(--bd);display:flex;justify-content:center}
@keyframes applock-shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#applock-box.shake{animation:applock-shake .4s ease}
#applock-icon{line-height:0;color:var(--ac)}
#applock-icon svg{width:30px;height:30px;display:block}
#applock-title{font-family:var(--display);font-size:25px;font-weight:var(--head-wt);letter-spacing:var(--head-ls);text-transform:var(--head-tr);color:var(--tx)}
#applock-sub{font-size:10.5px;letter-spacing:2.4px;text-transform:uppercase;color:var(--txm);text-align:center;line-height:1.6}
#applock-pw{background:var(--s1);border:1px solid var(--bdl);border-radius:var(--radius-sm);color:var(--tx);font-size:15px;font-weight:500;padding:14px 16px;font-family:var(--sans);outline:none;width:100%;text-align:center;letter-spacing:4px;box-sizing:border-box;transition:border-color .18s}
#applock-pw:focus{border-color:var(--ac)}
#applock-pw.error{border-color:var(--err)}
#applock-err{font-size:12.5px;color:var(--err);font-weight:500;text-align:center;min-height:16px}
#applock-submit{background:transparent;color:var(--acs);border:1px solid var(--acl);border-radius:var(--radius-sm);padding:14px 0;font-size:13.5px;font-weight:500;cursor:pointer;font-family:var(--sans);width:100%;transition:border-color .18s,opacity .18s}
#applock-submit:hover:not(:disabled){border-color:var(--ac)}
#applock-submit:disabled{opacity:.4;cursor:default}
#applock-cancel{background:transparent;border:none;color:var(--txm);font-size:13px;cursor:pointer;font-family:var(--sans);padding:2px 10px;text-decoration:underline;text-underline-offset:3px;transition:color .15s}
#applock-forgot,#applock-reset{background:transparent;border:none;color:var(--txm);font-size:12px;cursor:pointer;font-family:var(--sans);padding:2px 0 0;text-decoration:underline;text-underline-offset:3px;width:100%;text-align:center;transition:color .15s}
#applock-cancel:hover,#applock-forgot:hover,#applock-reset:hover{color:var(--txd)}
#applock-bio button svg,#al-menu-btns button svg{width:15px;height:15px;display:block;flex-shrink:0}

/* ── Lock-screen hover ──────────────────────────────────────────────────────
   These buttons are built in JS with an inline `border` shorthand, which no
   stylesheet rule can override without !important — so the old hover here was
   dead on arrival and the menu gave no feedback at all. The glow is what makes
   the target obvious; the colours are profile tokens, so T reads gold and V
   reads purple with nothing profile-specific written here.

   --acl / --errl rather than --acbg for the shadow: both are translucent in
   BOTH profiles, whereas V's --acbg is an opaque swatch that would paint a
   solid block instead of a halo. */
#applock-bio button,#al-menu-btns button{
  transition:border-color .18s,box-shadow .18s,color .18s;
}
#applock-bio button:hover,#al-menu-btns button:hover{
  border-color:var(--acl) !important;box-shadow:0 0 11px var(--acl);
}
#al-menu-btns button.al-ac:hover{border-color:var(--ac) !important;box-shadow:0 0 12px var(--acl)}
#al-menu-btns button.al-dg:hover{border-color:var(--err) !important;box-shadow:0 0 12px var(--errl)}
#applock-submit:hover:not(:disabled){box-shadow:0 0 12px var(--acl)}
#applock-pw:focus{box-shadow:0 0 11px var(--acl)}
#applock-submit,#applock-pw{transition:border-color .18s,box-shadow .18s,opacity .18s}

@media(max-width:520px){
  .pf-card{width:118px;height:136px}
  .pf-card .glyph{font-size:52px}
  .nav{padding-left:12px;padding-right:12px}
}

/* ══════════════════════════════════════════════════════════════════════════
   TOUCH — phones and tablets
   --------------------------------------------------------------------------
   Keyed on `pointer: coarse` rather than a width, because a finger needs the
   same room on a 6" phone and an 11" tablet, and a narrow desktop window needs
   none of it. Two things here are correctness, not polish:

     · 44px minimum on anything tappable. The icon buttons were ~25px and the
       toggles 34x18 — fine for a cursor, a coin-toss for a thumb, and this is
       an app people reach for in a hurry.
     · 16px on every input. Below that iOS ZOOMS the page when a field takes
       focus and leaves it zoomed — so tapping the passcode box during an
       emergency threw the layout out and needed a pinch to recover.
   ══════════════════════════════════════════════════════════════════════════ */
@media (pointer: coarse){
  .btn{min-height:44px;padding:0 18px;font-size:11px}
  /* "Small" is about visual weight, not hit area — a secondary button still
     gets a thumb-sized target. */
  .btn.sm{min-height:44px;padding:0 15px;font-size:10.5px}
  .btn svg{width:16px;height:16px}
  .iconbtn{min-width:44px;min-height:44px;padding:10px}
  .iconbtn svg{width:19px;height:19px}
  /* The wizard tick is the control most used on a phone, since the wizard only
     appears on one. It stays visually small but grows its hit area sideways. */
  .wiz-tick{width:34px;height:34px;position:relative}
  .wiz-tick svg{width:17px;height:17px}
  /* Same trick as .toggle: a 44px box next to a two-line heading looks wrong,
     so the visible tick stays 34 and an invisible overlay takes the taps. */
  .wiz-tick::after{content:'';position:absolute;left:-5px;right:-5px;top:-5px;bottom:-5px}
  .pill{height:40px;padding:0 15px;font-size:11px}
  .nav{gap:8px;padding-bottom:2px}

  /* A bigger switch, and a bigger area around it to actually hit.
     A pill switch cannot simply be made 44px tall without looking absurd, so
     the visible switch stays 26px and an invisible overlay carries the hit
     area out to 44. Padding would not work here: the knob is positioned
     against the padding box, so it would drift off the switch. */
  .toggle{width:46px;height:26px;border-radius:13px}
  .toggle i{width:20px;height:20px;top:3px;left:3px}
  .toggle.on i{left:23px}
  .toggle::after{content:'';position:absolute;left:-6px;right:-6px;top:-9px;bottom:-9px}
  .tgt-opt{gap:10px}

  input[type=text],input[type=password],select{font-size:16px;padding:12px 13px}
  #applock-pw{font-size:17px;padding:16px}
  #applock-submit{padding:16px 0;font-size:15px}
  .uim-input{font-size:16px !important;padding:12px 13px !important}
  #uim-btns button{min-height:44px;padding:0 18px !important}

  /* Rows get more vertical room so neighbouring controls are not adjacent. */
  .tgt,.dev{padding:12px 13px}
  .opt{padding:13px 0}
  .locklinks span,#applock-forgot,#applock-reset,#applock-cancel{padding:10px 0;display:inline-block}

  /* Hover states are meaningless on touch and leave controls looking stuck
     "lit" after a tap. */

<!-- ══ In-UI modal system (replaces native alert/confirm/prompt so dialogs live

        Copied from vault.html:2324, re-tokenised so it themes per profile. ══ -->
<script>
(function(){
  if (window.uiModal) return;
  var CSS =
    '#uim-overlay{position:fixed;inset:0;z-index:2147483600;display:none;align-items:center;justify-content:center;background:rgba(14,14,16,.66);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);padding:20px;box-sizing:border-box;}'
  + '#uim-overlay.show{display:flex;}'
  + '#uim-box{width:100%;max-width:370px;background:var(--s2);border:1px solid var(--bdl);border-radius:var(--radius);padding:24px 22px;box-shadow:0 30px 70px rgba(0,0,0,.5);box-sizing:border-box;font-family:var(--sans);animation:uimIn .16s ease;}'
  + '@keyframes uimIn{from{transform:translateY(8px) scale(.98);opacity:0}to{transform:none;opacity:1}}'
  + '#uim-title{font-family:var(--display);font-size:19px;font-weight:var(--head-wt);letter-spacing:var(--head-ls);text-transform:var(--head-tr);color:var(--tx);margin-bottom:8px;line-height:1.25;}'
  + '#uim-msg{font-size:13px;color:var(--txd);line-height:1.55;white-space:pre-wrap;margin-bottom:16px;}'
  + '.uim-field{display:block;margin-bottom:14px;}'
  + '.uim-label{display:block;font-size:9.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--txm);margin:0 0 7px;}'
  + '.uim-input{width:100%;box-sizing:border-box;background:var(--s1);border:1px solid var(--bdl);border-radius:var(--radius-sm);color:var(--tx);font-size:13.5px;padding:10px 13px;outline:none;font-family:inherit;transition:border-color .18s;}'
  + '.uim-input{transition:border-color .18s,box-shadow .18s;}'
  // The passcode prompt runs through this modal, so it is a lock screen too and
  // gets the same hover treatment as the App Lock menu. Everything is a profile
  // token, so T glows gold and V purple with nothing per-profile written here.
  + '.uim-input:focus{border-color:var(--ac);box-shadow:0 0 11px var(--acl);}'
  + '#uim-err{font-size:12.5px;color:var(--err);font-weight:500;min-height:15px;margin-bottom:4px;}'
  + '#uim-btns{display:flex;gap:10px;margin-top:18px;justify-content:flex-end;}'
  + '#uim-btns button{border:1px solid var(--bdl);background:transparent;border-radius:var(--radius-sm);padding:9px 16px;font-size:10.5px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase;cursor:pointer;font-family:inherit;transition:border-color .18s,color .18s,box-shadow .18s;}'
  + '#uim-btns button:hover{border-color:var(--acl);box-shadow:0 0 11px var(--acl);}'
  + '#uim-ok:hover{border-color:var(--ac);box-shadow:0 0 12px var(--acl);}'
  + '#uim-cancel{color:var(--tx);}'
  + '#uim-cancel:hover{border-color:var(--txd);box-shadow:0 0 10px var(--acl);}';
  var queue=[], active=null;
  function el(id){ return document.getElementById(id); }
  function inject(){
    if (el('uim-overlay')) return;
    var st=document.createElement('style'); st.id='uim-style'; st.textContent=CSS; document.head.appendChild(st);
    var ov=document.createElement('div'); ov.id='uim-overlay';
    ov.innerHTML='<form id="uim-box" autocomplete="off">'
      +'<div id="uim-title"></div><div id="uim-msg"></div><div id="uim-fields"></div>'
      +'<div id="uim-err"></div>'
      +'<div id="uim-btns"><button type="button" id="uim-cancel"></button><button type="submit" id="uim-ok"></button></div></form>';
    document.body.appendChild(ov);
    el('uim-cancel').addEventListener('click', function(){ close(active&&active.kind==='confirm'?false:null); });
    el('uim-box').addEventListener('submit', function(e){ e.preventDefault(); submit(); });
    document.addEventListener('keydown', function(e){ if(active && e.key==='Escape'){ close(active.kind==='confirm'?false:null); } });
  }
  function render(cfg){
    inject(); active=cfg;
    el('uim-title').textContent=cfg.title||''; el('uim-title').style.display=cfg.title?'':'none';
    el('uim-msg').textContent=cfg.message||''; el('uim-msg').style.display=cfg.message?'':'none';
    var fw=el('uim-fields'); fw.innerHTML='';
    (cfg.fields||[]).forEach(function(f){
      var lab=document.createElement('label'); lab.className='uim-field';
      if(f.label){ var sp=document.createElement('span'); sp.className='uim-label'; sp.textContent=f.label; lab.appendChild(sp); }
      var inp=document.createElement('input'); inp.className='uim-input'; inp.type=f.type||'text';
      inp.value=(f.value!=null?f.value:''); if(f.placeholder) inp.placeholder=f.placeholder; inp.setAttribute('data-name',f.name);
      if(f.autocap===false){ inp.autocapitalize='off'; inp.setAttribute('autocorrect','off'); inp.spellcheck=false; }
      lab.appendChild(inp); fw.appendChild(lab);
    });
    el('uim-err').textContent='';
    var ok=el('uim-ok'), ca=el('uim-cancel');
    ok.textContent=cfg.okLabel||'OK';
    ok.style.color=cfg.danger?'var(--err)':'var(--ac)';
    ok.style.borderColor=cfg.danger?'var(--errl)':'var(--acl)';
    ca.textContent=cfg.cancelLabel||'Cancel'; ca.style.display=(cfg.kind==='alert')?'none':'';
    el('uim-overlay').classList.add('show');
    setTimeout(function(){ var fi=fw.querySelector('input'); if(fi){ fi.focus(); try{fi.select();}catch(e){} } else ok.focus(); }, 40);
  }
  function collect(){ var o={}; var ins=el('uim-fields').querySelectorAll('input'); Array.prototype.forEach.call(ins,function(i){ o[i.getAttribute('data-name')]=i.value; }); return o; }
  function submit(){
    if(!active) return; var cfg=active;
    if(cfg.fields && cfg.fields.length){
      var vals=collect(), ins=el('uim-fields').querySelectorAll('input');
      for(var i=0;i<cfg.fields.length;i++){ var f=cfg.fields[i];
        if(f.required && !String(vals[f.name]||'').trim()){ el('uim-err').textContent=(f.label||'This field')+' is required.'; if(ins[i]) ins[i].focus(); return; } }
      close(cfg.kind==='prompt' ? String(vals[cfg.fields[0].name]) : vals);
    } else { close(cfg.kind==='confirm'?true:undefined); }
  }
  function close(result){
    var cfg=active; active=null;
    var ov=el('uim-overlay'); if(ov) ov.classList.remove('show');
    if(cfg && cfg.resolve) cfg.resolve(result);
    if(queue.length){ render(queue.shift()); }
  }
  function open(cfg){ return new Promise(function(res){ cfg.resolve=res; if(active) queue.push(cfg); else render(cfg); }); }
  window.uiModal=open;
  window.uiAlert=function(m,o){ o=o||{}; return open({kind:'alert',message:String(m==null?'':m),title:o.title,okLabel:o.okLabel||'OK'}); };
  window.uiConfirm=function(m,o){ o=o||{}; return open({kind:'confirm',message:String(m==null?'':m),title:o.title,okLabel:o.okLabel||'OK',cancelLabel:o.cancelLabel||'Cancel',danger:o.danger}); };
  window.uiPrompt=function(m,o){ o=o||{}; return open({kind:'prompt',message:String(m==null?'':m),title:o.title,okLabel:o.okLabel||'OK',cancelLabel:o.cancelLabel||'Cancel',
    fields:[{name:'value',type:o.password?'password':'text',value:(o.default!=null?o.default:''),placeholder:o.placeholder||'',autocap:o.autocap}]}); };
  window.uiForm=function(cfg){ cfg=cfg||{}; return open({kind:'form',title:cfg.title,message:cfg.message,okLabel:cfg.okLabel||'Save',cancelLabel:cfg.cancelLabel||'Cancel',danger:cfg.danger,fields:cfg.fields||[]}); };
  try { window.alert=function(m){ window.uiAlert(m==null?'':String(m)); }; } catch(e){}
})();
</script>

<!-- ══ Biometrics (WebAuthn platform authenticator) ═════════════════════════
        Copied from mylist.html:727. The app never sees or stores biometric
        data — WebAuthn returns only a public-key credential handle, and unlock
        is scoped to that credential id alone via allowCredentials, so one
        profile's biometric can never satisfy the other's. ══════════════════ -->
<script>
window.Bio = (function(){
  var NS='bio_cred_';
  function u8(b){ return new Uint8Array(b); }
  function b64u(buf){ var b=u8(buf),s=''; for(var i=0;i<b.length;i++) s+=String.fromCharCode(b[i]); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
  function unb64u(str){ str=String(str).replace(/-/g,'+').replace(/_/g,'/'); while(str.length%4) str+='='; var bin=atob(str),b=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i); return b.buffer; }
  function rand(n){ var a=new Uint8Array(n); crypto.getRandomValues(a); return a; }
  function keyOf(app,id){ return NS+app+'_'+id; }
  function supported(){ return !!(window.isSecureContext && window.PublicKeyCredential && navigator.credentials && navigator.credentials.create); }
  function available(){
    if(!supported()) return Promise.resolve(false);
    if(!PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable) return Promise.resolve(false);
    return PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().then(function(v){return !!v;}).catch(function(){return false;});
  }
  function stored(app,id){ try{ return JSON.parse(localStorage.getItem(keyOf(app,id))||'null'); }catch(e){ return null; } }
  function isRegistered(app,id){ var r=stored(app,id); return !!(r&&r.id); }
  function unregister(app,id){ try{ localStorage.removeItem(keyOf(app,id)); }catch(e){} }
  function label(){
    var ua=navigator.userAgent||'';
    if(/iPhone|iPad|iPod/.test(ua)) return 'Face ID';
    if(/Android/.test(ua)) return 'fingerprint';
    if(/Windows/.test(ua)) return 'Windows Hello';
    if(/Mac/.test(ua)) return 'Touch ID';
    return 'biometrics';
  }
  function register(app,id,opts){
    opts=opts||{};
    if(!supported()) return Promise.resolve({ok:false,error:'unsupported'});
    return navigator.credentials.create({publicKey:{
      challenge:rand(32),
      rp:{name:opts.rpName||'Shield', id:location.hostname||undefined},
      user:{id:rand(16), name:app+':'+id, displayName:opts.label||id},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},
      timeout:60000, attestation:'none'
    }}).then(function(cred){
      if(!cred) return {ok:false,error:'cancelled'};
      localStorage.setItem(keyOf(app,id), JSON.stringify({id:b64u(cred.rawId),created:Date.now(),label:opts.label||id}));
      return {ok:true};
    }).catch(function(e){ return {ok:false,error:(e&&e.name)||'error'}; });
  }
  function authenticate(app,id){
    if(!supported()) return Promise.resolve({ok:false,error:'unsupported'});
    var rec=stored(app,id);
    if(!rec||!rec.id) return Promise.resolve({ok:false,error:'notregistered'});
    return navigator.credentials.get({publicKey:{
      challenge:rand(32),
      allowCredentials:[{type:'public-key',id:unb64u(rec.id)}],
      userVerification:'required', timeout:60000, rpId:location.hostname||undefined
    }}).then(function(a){ return a?{ok:true}:{ok:false,error:'cancelled'}; })
      .catch(function(e){ return {ok:false,error:(e&&e.name)||'error'}; });
  }
  return {supported:supported,available:available,isRegistered:isRegistered,register:register,authenticate:authenticate,unregister:unregister,label:label};
})();
</script>

<!-- ══ FIREBASE ═════════════════════════════════════════════════════════════
     Two documents matter here:
       dashboards/applock          — the suite-wide lock registry (shared)
       dashboards/shield_<profile> — Shield's own per-profile doc

     Read/write budget is deliberately tiny. One listener per open surface, and
     writes only on a real user edit (debounced) or a 15-minute heartbeat, so a
     device idling in Shield costs about four writes an hour. There is no
     presence system and no polling — "online" is derived from lastSeen. ══════ -->
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js';
import { initializeAppCheck, ReCaptchaV3Provider } from 'https://www.gstatic.com/firebasejs/12.12.0/firebase-app-check.js';
import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js';
import { initializeFirestore, memoryLocalCache, doc, getDoc, getDocFromServer, setDoc, updateDoc, deleteField, onSnapshot }
  from 'https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyC2aKunOKj5WS8NpgZhpyMzOYecBr5t2_4",
  authDomain: "task-dashboard-d2b53.firebaseapp.com",
  projectId: "task-dashboard-d2b53",
  storageBucket: "task-dashboard-d2b53.firebasestorage.app",
  messagingSenderId: "982539604706",
  appId: "1:982539604706:web:e93da1aef499fcee2044bb"
};
const fbApp = initializeApp(firebaseConfig);
// The SAME reCAPTCHA site key every A1 app uses. Do not register a new one:
// the key is shared, and re-registering it breaks every app in the suite at
// once — about an hour later, while Auth carries on working.
initializeAppCheck(fbApp, { provider: new ReCaptchaV3Provider('6LeUyAstAAAAAEciRypd1i4Akq6ueFUYfXLaLaUX'), isTokenAutoRefreshEnabled: true });
const fbAuth = getAuth(fbApp);
let _authResolve; const authReady = new Promise(res => { _authResolve = res; });
onAuthStateChanged(fbAuth, u => { if (u) _authResolve(); });
signInAnonymously(fbAuth).catch(e => console.warn('[Shield] Anon auth failed:', e));

// memoryLocalCache, deliberately. Every page in the suite shares ONE Firestore
// IndexedDB cache (same origin, same projectId) and index.html is its single
// forced owner; a satellite that took a persistent lease could rip it away
// mid-flight. Shield's documents are tiny and always want the freshest copy
// anyway. tests/sync-guard.test.js fails the commit if forceOwnership appears.
const db = initializeFirestore(fbApp, { localCache: memoryLocalCache() });

/* ── Shield documents ─────────────────────────────────────────────────────── */
const shRef = p => doc(db, 'dashboards/shield_' + p);

// Write barrier. Every write here is field-scoped, so a device can never
// clobber another device's config — but registration creates the document, and
// creating one we were merely unable to READ would fork the profile in two.
// This flag is the only thing that authorises the first write.
window._shLoadOk = false;

// Turn {'devices.abc.closer': v} into {devices:{abc:{closer:v}}} for the
// setDoc-merge path, which is the only way to write a doc that does not exist
// yet (updateDoc throws not-found).
function expand(flat){
  const out = {};
  for (const k in flat){
    const parts = k.split('.');
    let cur = out;
    for (let i = 0; i < parts.length - 1; i++){ cur[parts[i]] = cur[parts[i]] || {}; cur = cur[parts[i]]; }
    cur[parts[parts.length - 1]] = flat[k];
  }
  return out;
}

window._shUpdate = async (profile, flat) => {
  if (!window._shLoadOk) { console.warn('[Shield] write BLOCKED — never read the server copy.'); throw new Error('barrier'); }
  await authReady;
  const ref = shRef(profile);
  try {
    await updateDoc(ref, flat);
  } catch (e) {
    if (e && e.code === 'not-found') await setDoc(ref, expand(flat), { merge: true });
    else throw e;
  }
};

/* One-shot read of a profile document.
   Used to check whether this device is lingering in the OTHER profile — a
   listener would be wrong here, since we neither want to watch it nor keep a
   second subscription open on a document that is not ours. */
window._shGetOnce = async (profile) => {
  try {
    await authReady;
    const snap = await getDoc(shRef(profile));
    return snap.exists() ? (snap.data() || {}) : null;
  } catch (e) { return null; }
};

/* Remove a device record outright.
   `deleteField()` rather than a `revoked` flag: a device that belongs to the
   other profile was never this profile's to list, and a flag still leaves it
   sitting in the document to be counted or rendered by any future code path
   that forgets to filter. Gone is gone. */
window._shDeleteDevice = async (profile, devId) => {
  try {
    await authReady;
    const f = {};
    f['devices.' + devId] = deleteField();
    f.savedAt = Date.now();
    await updateDoc(shRef(profile), f);
    return true;
  } catch (e) { return false; }
};

window._shWatch = (profile, onData, onErr) => {
  const ref = shRef(profile);
  return onSnapshot(ref, snap => {
    // A delivered snapshot proves reads work, so it lifts the barrier — even an
    // "does not exist" answer, which is a real answer and means we may create it.
    window._shLoadOk = true;
    onData(snap.exists() ? (snap.data() || {}) : null);
  }, err => { console.warn('[Shield] snapshot error', err); if (onErr) onErr(err); });
};

/* ── Suite app-lock registry (dashboards/applock) ──────────────────────────
   Shield holds the WHOLE lock map, exactly as index.html does, and only ever
   mutates its own two ids. _alLoadOk stops a denied read from writing back a
   map that is missing every other app's lock. */
const AL_DOC = doc(db, 'dashboards/applock');
let _alLastOwnSaveAt = 0, _alTimer = null;
window._alLoadOk = false;

window._fbLoadAppLocks = async () => {
  try {
    await authReady;
    // Server-forced: a cached copy here would decide the gate from stale state.
    const snap = await getDocFromServer(AL_DOC);
    window._alLoadOk = true;
    return snap.exists() ? ((snap.data() || {}).locks || {}) : {};
  } catch (e) { console.warn('[Shield] applock load failed:', e); window._alLoadOk = false; return null; }
};

window._fbSaveAppLocks = (locks) => {
  if (!window._alLoadOk) { console.warn('[Shield] applock save BLOCKED — never read the suite registry.'); return; }
  _alLastOwnSaveAt = Date.now();
  if (_alTimer) clearTimeout(_alTimer);
  _alTimer = setTimeout(async () => {
    try {
      _alLastOwnSaveAt = Date.now();
      await setDoc(AL_DOC, { locks, savedAt: Date.now() });
      _alLastOwnSaveAt = Date.now();
    } catch (e) { console.warn('[Shield] applock save failed:', e); }
  }, 400);
};

onSnapshot(AL_DOC, snap => {
  window._alLoadOk = true;
  if (Date.now() - _alLastOwnSaveAt < 2000) return;   // our own echo
  if (snap.exists() && window._alApplyRemoteLocks) window._alApplyRemoteLocks((snap.data() || {}).locks || {});
}, err => console.warn('[Shield] applock snapshot err', err));

/* ── Local-launch links (dashboards/navorder) ────────────────────────────────
   TaskHub's per-profile External Links list (tonyLinks/vedaLinks) can hold a
   local file path instead of a URL — TaskHub runs in a plain browser tab with
   no way to launch a program on this PC, so a button like that hands off to
   this agent via the shieldopen:<id> protocol instead of opening a tab (see
   index.html's _isLocalPath / _doOpen). This is what teaches the agent which
   id maps to which path. Read-only and best-effort: no write barrier needed
   (Shield never writes this doc), and a mapping that hasn't synced yet just
   means that one button does nothing until it does. Regex MUST match
   index.html's _isLocalPath exactly, or a button that TaskHub itself treats as
   a local path silently does nothing here. */
function isLocalPath(u){
  return typeof u === 'string' && !/^https?:\/\//i.test(u) && (/^[A-Za-z]:[\\/]/.test(u) || /^\\\\/.test(u));
}
// Only with an agent. This listener exists for exactly one purpose: handing
// local-link paths down to the desktop agent (see sh_set_links below). On a
// phone or a plain browser tab there is no agent to hand them to, so it was a
// live Firestore subscription that did nothing but cost a read on every change
// and hold a slot in the account's concurrent-listener count. Shield opens
// three listeners per surface; this removes one from every device that cannot
// use it, which is most of them.
function _navorderListen(){ return onSnapshot(doc(db, 'dashboards/navorder'), snap => {
  if (!snap.exists()) return;
  var d = snap.data() || {};
  var links = {};
  (d.tonyLinks || []).concat(d.vedaLinks || []).forEach(l => {
    if (l && l.id && isLocalPath(l.url)) links[l.id] = l.url;
  });
  if (window.SH && window.SH.Agent) {
    window.SH.Agent.invoke('sh_set_links', { args: { links: links } }).catch(() => {});
  }
}, err => console.warn('[Shield] navorder snapshot err', err)); }

// Attach only where there is an agent to hand the paths to.
//
// Deferred rather than decided inline: this is a module script, and whether
// Tauri has injected window.__TAURI__ by the time it runs is not something to
// bet local links on. Checking now AND once more after load costs nothing and
// removes the ordering question entirely.
(function attachNavorder(){
  var done = false;
  function go(){
    if (done || !window.__TAURI__) return;
    done = true;
    _navorderListen();
  }
  go();
  if (!done) {
    if (document.readyState === 'complete') setTimeout(go, 0);
    else window.addEventListener('load', function(){ setTimeout(go, 0); }, { once: true });
  }
})();

authReady.then(() => {
  window._fbReady = true;
  window.dispatchEvent(new CustomEvent('fb-ready'));
});
</script>

<!-- ══ APP LOCK ═════════════════════════════════════════════════════════════
     Ported from V1/js/applock.js — the clean, host-free extraction of the
     suite's lock — and re-widened to handle more than one lock id, the way
     index.html:40464 does.

     SECURITY MODEL, unchanged: the password is NEVER stored in the browser and
     never reaches Firestore. It goes to the taskhub-reminders Worker, which
     keeps only a PBKDF2-SHA256 hash (100k iterations, random 16-byte salt) in
     KV. Firestore holds only WHICH lock is on and at what version, so a new
     device knows to prompt.

     Shield adds ONE thing to the original: a local PBKDF2 verifier, written
     alongside the Worker record, used only when the Worker is unreachable.
     Without it an internet outage during Emergency Mode would be a lockout.
     ═══════════════════════════════════════════════════════════════════════ -->
<script>

var AL_FORM  = { tony:'https://formspree.io/f/xeedkebo', veda:'https://formspree.io/f/xzdlwaqg' };
var AL_LABELS = {
  tony_shield: { label:'Shield', profile:'tony', accent:'#e0b874' },

function I(b){ return '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+b+'</svg>'; }

  lock:   I('<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>'),
  unlock: I('<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/>'),
  key:    I('<circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.7 12.3 8.5-8.5"/><path d="m17 6 3 3"/><path d="m14 9 3 3"/>'),

  trash:  I('<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>')
};

/* ── Lock state ───────────────────────────────────────────────────────────
   _locks holds the WHOLE suite registry (every app's lock), not just Shield's.
   Shield mutates only its own ids, but it must carry the rest untouched or a
   save would erase every other app's lock. */
var _locks = {};
try { _locks = JSON.parse(localStorage.getItem('al_locks')||'{}'); } catch(e){}
var _pendingPush = false;

function saveLocks(){
  try { localStorage.setItem('al_locks', JSON.stringify(_locks)); } catch(e){}
  if (window._fbSaveAppLocks) { window._fbSaveAppLocks(_locks); _pendingPush = false; }
  else _pendingPush = true;
}
function isLocked(id){ return !!(_locks[id] && _locks[id].locked); }
function lockVersion(id){ var e=_locks[id]; return (e && e.v) || 0; }
function setLock(id, v){ _locks[id] = { locked:true, v: v || Date.now() }; saveLocks(); }
function removeLock(id){ delete _locks[id]; saveLocks(); }
function allLockIds(){ return Object.keys(_locks); }

/* ── Per-device unlock ────────────────────────────────────────────────────
   Records the lock VERSION this device unlocked at and compares MONOTONICALLY
   (unlocked-at >= current), which is index.html's fixed behaviour rather than
   MyList's exact-match variant. The version replicates through Firestore, so a
   device can briefly observe a stale, missing or zero version (a cached
   snapshot before the server one lands, a legacy record with no v, an offline
   start). Exact matching treated every one of those as "password changed →
   prompt again". Monotonic treats them as "not newer than what I already
   unlocked" and stays open; only a real password change, which stamps a
   strictly greater Date.now(), locks this device out again.

   Keys are the suite-standard al_unlockedat_* so an unlock done in index.html
   and one done here mean the same thing on the same device. */
var _unlockedMem = {};
function readUnlockAt(id){
  var best = -1;
  function read(store, key){
    try {
      var raw = store.getItem(key);
      if (raw === null) return;
      var n = parseInt(String(raw).charAt(0)==='v' ? String(raw).slice(1) : raw, 10);
      if (!isNaN(n) && n > best) best = n;
    } catch(e){}
  }
  if (_unlockedMem[id] !== undefined) best = _unlockedMem[id];
  read(localStorage, 'al_unlockedat_'+id);
  read(localStorage, 'al_unlockedv_'+id);
  try { if (localStorage.getItem('al_unlocked_'+id)==='1' && best < 0) best = 0; } catch(e){}
  read(sessionStorage, 'al_unlockedat_'+id);
  return best;
}
function isUnlocked(id){
  if (!isLocked(id)) return true;
  var at = readUnlockAt(id);
  if (at < 0) return false;
  return at >= lockVersion(id);
}
function markUnlocked(id){
  var v = lockVersion(id);
  var prev = readUnlockAt(id);
  if (prev > v) v = prev;
  _unlockedMem[id] = v;
  try { localStorage.setItem('al_unlockedat_'+id, String(v)); } catch(e){}
  try { sessionStorage.setItem('al_unlockedat_'+id, String(v)); } catch(e){}
  try { localStorage.setItem('al_unlockedv_'+id, 'v'+v); } catch(e){}
}
function markLocked(id){
  delete _unlockedMem[id];
  try { localStorage.removeItem('al_unlockedat_'+id); localStorage.removeItem('al_unlockedv_'+id); localStorage.removeItem('al_unlocked_'+id); } catch(e){}
  try { sessionStorage.removeItem('al_unlockedat_'+id); } catch(e){}
}
function mustBlock(id){ return isLocked(id) && !isUnlocked(id); }

/* ── Worker API ───────────────────────────────────────────────────────────── */
function api(id, path, body){
  return fetch(AL_WORKER + path, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(Object.assign({ journal:AL_JOURNAL, entryId:id }, body||{}))
  }).then(function(r){ return r.json(); });
}

/* ── Offline verifier ─────────────────────────────────────────────────────
   Written alongside every successful Worker set/change, read ONLY when the
   Worker cannot be reached. Same PBKDF2-SHA256 / 100k / random-16-byte-salt
   shape as the KV record. This does put a brute-forceable verifier on disk —
   but anyone with disk access can already stop Shield's agent, so it does not
   widen the real attack surface, and without it a dead connection during
   Emergency Mode would be an unbreakable lockout. */
var PBKDF2_ITER = 100000;
function b64(buf){ var b=new Uint8Array(buf),s=''; for(var i=0;i<b.length;i++) s+=String.fromCharCode(b[i]); return btoa(s); }
function unb64(str){ var bin=atob(str), b=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i); return b; }
async function pbkdf2(pw, salt, iter){
  var key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  var bits = await crypto.subtle.deriveBits({ name:'PBKDF2', salt:salt, iterations:iter, hash:'SHA-256' }, key, 256);
  return b64(bits);
}
async function writeOffline(id, pw){
  try {
    var salt = crypto.getRandomValues(new Uint8Array(16));
    var hash = await pbkdf2(pw, salt, PBKDF2_ITER);
    localStorage.setItem('sh_offline_'+id, JSON.stringify({ hash:hash, salt:b64(salt), iter:PBKDF2_ITER }));
  } catch(e){ console.warn('[Shield] offline verifier not written', e); }
}
function clearOffline(id){ try { localStorage.removeItem('sh_offline_'+id); } catch(e){} }
async function verifyOffline(id, pw){
  var rec = null;
  try { rec = JSON.parse(localStorage.getItem('sh_offline_'+id)||'null'); } catch(e){}
  if (!rec || !rec.hash) return { ok:false, error:'norecord' };
  try {
    var got = await pbkdf2(pw, unb64(rec.salt), rec.iter || PBKDF2_ITER);
    // Constant-time-ish compare: always walk the whole string.
    var a = got, b = rec.hash, diff = a.length ^ b.length;
    for (var i = 0; i < Math.max(a.length, b.length); i++) diff |= (a.charCodeAt(i)||0) ^ (b.charCodeAt(i)||0);
    return { ok: diff === 0, offline:true };
  } catch(e){ return { ok:false, error:'crypto' }; }
}

/* Live verification used by every security-critical action (disabling
   Emergency Mode especially). It deliberately IGNORES the per-device unlock
   marker: "this device already opened Shield once" must never be enough to
   lift a lockdown. */
async function verifyNow(id, pw){
  try {
    var d = await api(id, '/auth/journal/verify', { password: pw });
    if (d && d.noLock) return { ok:true, noLock:true };
    return { ok: !!(d && d.ok) };
  } catch(e){
    var off = await verifyOffline(id, pw);
    if (off.error === 'norecord') return { ok:false, offlineUnavailable:true };
    return off;
  }
}

/* ── Reset by emailed code ────────────────────────────────────────────────── */
async function resetFlow(id){
  var m = meta(id);

  var email = AL_EMAIL[m.profile] || AL_EMAIL.tony;
  function post(path, obj){
    return fetch(AL_WORKER+path, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(obj) })
      .then(function(r){ return r.json(); });
  }
  // entryId carries the owner (tony_shield / veda_shield), so the worker mails
  // the code to the right person. It is never returned here — that is what stops
  // a stranger starting a reset and reading the code off the reply.
  var reqBody = { journal:AL_JOURNAL, entryId:id, appName:'Shield', label:'Shield' };
  var rq;
  try { rq = await post('/auth/reset/request', reqBody); }
  catch(e){ await window.uiAlert('Network error while starting the reset. Check your connection and try again.'); return; }
  if (rq && rq.noLock){ await window.uiAlert('There is no password set on the server for Shield.'); return; }
  if (rq && rq.error==='throttled'){ await window.uiAlert('Too many reset emails have gone out just now. Wait a few minutes and try again.'); return; }
  if (rq && rq.error==='email-failed'){ await window.uiAlert('Could not send the reset email. Please try again in a moment.'); return; }
  if (!rq || !rq.ok){ await window.uiAlert('Could not start the reset. Please try again.'); return; }

  var vals = await window.uiForm({
    title:'Reset password',
    message:'A 6-character code was emailed to '+email+'. Enter it below (check spam if it does not arrive within a minute), then choose a new password.',
    okLabel:'Reset password',
    fields:[
      { name:'code', label:'Security code from email', placeholder:'6-character code', autocap:false, required:true },
      { name:'password', label:'New password', type:'password', required:true },
      { name:'hint', label:'New password hint (optional)' }
    ]
  });
  if (!vals) return;
  var code=String(vals.code||'').trim(), np=String(vals.password||'').trim();
  if (!code){ await window.uiAlert('No code entered.'); return; }
  if (!np){ await window.uiAlert('Password cannot be empty.'); return; }

  var cf;
  try { cf = await post('/auth/reset/confirm', Object.assign({ code:code, password:np, hint:vals.hint||'' }, reqBody)); }
  catch(e){ await window.uiAlert('Network error while confirming the reset. Please try again.'); return; }

  if (cf && cf.ok){
    setLock(id); markUnlocked(id); await writeOffline(id, np);
    hideOverlay();
    if (window.SH && window.SH.onLockChange) window.SH.onLockChange();
    await window.uiAlert('Password reset. It now syncs to all your devices — this one is unlocked, others will ask for the new password once.');
    return;
  }
  if (cf && cf.error==='badcode') await window.uiAlert('That code is not correct.'+(cf.remaining!=null?(' '+cf.remaining+' attempt(s) left before it expires.'):''));
  else if (cf && cf.error==='expired') await window.uiAlert('That code has expired or was already used. Start the reset again for a fresh code.');
  else if (cf && cf.error==='locked') await window.uiAlert('Too many incorrect attempts. Start the reset again for a fresh code.');

/* ── Wiring ───────────────────────────────────────────────────────────────── */

                hideOverlay();

                await window.uiAlert('Password changed. Other devices will ask for the new password once.');
              } else el('applock-err').textContent='Failed to set the new password.';
            } else el('applock-err').textContent='Error removing the old lock. Try again.';
          }

  });

  el('applock-pw').addEventListener('keydown', function(e){

    var btn=el('applock-forgot'), id=_id, m=meta(id);
    var form = AL_FORM[m.profile] || AL_FORM.tony, email = AL_EMAIL[m.profile] || AL_EMAIL.tony;

      // so `owner` matters here more than anywhere: it is what keeps Veda's

/* Remote lock changes pushed from another device. */
window._alApplyRemoteLocks = function(remote){
  remote = remote || {};
  // Nothing here erases this device's unlock marker. Re-locking is decided by
  // isUnlocked()'s monotonic comparison against the version below: a genuinely
  // NEWER version (password changed elsewhere) locks this device out, an
  // older/equal/absent one leaves it open. Markers are only ever removed by an
  // explicit user action.
  _locks = {};
  Object.keys(remote).forEach(function(id){
    var e = remote[id];
    _locks[id] = (e && typeof e === 'object') ? { locked: !!e.locked, v: e.v || 0 } : { locked: !!e, v: 0 };
  });
  try { localStorage.setItem('al_locks', JSON.stringify(_locks)); } catch(e){}
  if (window.SH && window.SH.onRemoteLocks) window.SH.onRemoteLocks();
};

function flushPending(){
  if (_pendingPush && window._fbSaveAppLocks){ window._fbSaveAppLocks(_locks); _pendingPush=false; }
  if (!window._fbLoadAppLocks) return;
  window._fbLoadAppLocks().then(function(remote){ if (remote) window._alApplyRemoteLocks(remote); }).catch(function(){});
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', wire);
else wire();
if (window._fbReady) flushPending();
else window.addEventListener('fb-ready', flushPending, { once:true });

/* Gate helper: run cb if this lock is open on this device, otherwise prompt. */
function gate(id, cb, onCancel){
  if (!mustBlock(id)) { cb(); return; }
  showOverlay(id, 'unlock', cb, onCancel);
}

return {
  isLocked:isLocked, isUnlocked:isUnlocked, mustBlock:mustBlock,
  markLocked:markLocked, markUnlocked:markUnlocked,
  allLockIds:allLockIds, lockVersion:lockVersion,
  gate:gate, manage:manage, verifyNow:verifyNow,
  hasOffline:function(id){ try{ return !!localStorage.getItem('sh_offline_'+id); }catch(e){ return false; } },
  ICON:ICON
};
})();
</script>

<script>
window.SH = (function(){
'use strict';

//
// These two are a pair: the window MUST be comfortably longer than the cadence
// or a device goes dark in the gap between check-ins and reads as offline while
// it is sitting right there. Every heartbeat is a write, and every write echoes
// a snapshot to each other open surface, so it costs a read on those too -
// stretching it from 15 to 25 minutes takes about 40% off both.
var HEARTBEAT_MS   = 25 * 60 * 1000;   // how often a foreground device stamps lastSeen
var ONLINE_WINDOW  = 35 * 60 * 1000;   // lastSeen fresher than this reads as "active"
var SAVE_DEBOUNCE  = 1200;
var HOLD_MS        = 800;
var HIST_LOCAL_MAX = 25;               // full entries kept on this device
var HIST_SYNC_MAX  = 10;               // trimmed entries mirrored to Firestore

// by the "lock A1 apps" emergency action, which clears THIS device's unlock
// markers for the profile. That is a purely local operation: no version bump,
// so no other device is disturbed and nothing needs a password reset after.

  tony: ['profile_tony','tony_taskhub','tony_tradehub','tony_solace','tony_keychain',

  veda: ['profile_veda','veda_taskhub','veda_gita','veda_journal','veda_links','veda_shield']

  profile: null,
  devId: null,
  doc: null,        // latest snapshot of dashboards/shield_<profile>
  view: 'home',
  tab: 'closer',
  viewDev: null,    // device id being VIEWED (null = this device, editable)
  unsub: null,
  saveTimer: null,
  hbTimer: null,
  report: null,     // last enforcement result, shown on the emergency screen
  busy: false,
  lastSig: null,    // signature of the last snapshot applied, to skip echoes
  registered: false,
  hotkeys: {}       // labels reported by the agent, only for keys that registered

/* ── Small helpers ────────────────────────────────────────────────────────── */
function $(id){ return document.getElementById(id); }

  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

function now(){ return Date.now(); }

function lsDel(k){ try { localStorage.removeItem(k); } catch(e){} }

  if (d < 3600000) return Math.floor(d/60000)+'m ago';

/* ── Device identity ──────────────────────────────────────────────────────
   The id is an IDENTIFIER, not a credential — it is client-generated and
   freely forgeable. What actually authorises a device is the profile passcode
   it had to clear to get here (and, from Phase 4, the anon uid the Worker adds

function deviceId(){

function platform(){
  var ua = navigator.userAgent || '';
  if (/iPhone|iPad|iPod/.test(ua)) return 'ios';
  if (/Android/.test(ua)) return 'android';
  if (/Windows/.test(ua)) return 'windows';
  if (/Mac OS X/.test(ua)) return 'mac';

}
function platLabel(p){

/* ── Agent bridge ─────────────────────────────────────────────────────────
   Phase 2 ships the Tauri tray agent; this is the seam it plugs into. Until
   it exists, every enforcement call fails honestly and the UI says so. A page
   cannot terminate, hide or block an operating-system application — there is
   no browser API for it, and pretending otherwise would be fake security. */
var Agent = (function(){
  function core(){
    var T = window.__TAURI__;
    if (!T) return null;
    return T.core || T.tauri || null;
  }
  function present(){ var c=core(); return !!(c && c.invoke); }
  function invoke(cmd, args){
    var c = core();
    if (!c || !c.invoke) return Promise.reject(new Error('no-agent'));
    return c.invoke(cmd, args || {});

  return { present:present, invoke:invoke };
})();

/* ══ SCROLLBAR ════════════════════════════════════════════════════════════
   A drawn scrollbar for the page, because the native one is hidden across the
   suite and, on a phone, is not draggable even when visible.

   Pointer events rather than mouse/touch pairs: one code path covers a mouse, a
   finger and a pen, and setPointerCapture keeps the drag alive when the finger
   leaves the 30px strip — which it will, because nobody drags in a straight
   line. */
var Scroll = (function(){
  var el, thumb, dragging = false, grabOff = 0, raf = 0;

  function doc(){ return document.scrollingElement || document.documentElement; }
  function metrics(){
    var d = doc();
    return { max: d.scrollHeight - d.clientHeight, pos: d.scrollTop, view: el.clientHeight };
  }

  function paint(){
    raf = 0;
    var m = metrics();
    // Nothing to scroll: the control would be a lie, so it is not drawn at all.
    if (m.max <= 4){ el.classList.remove('on'); return; }
    el.classList.add('on');
    var d = doc();

    // Set the proportional height, then MEASURE what actually rendered before
    // working out where the thumb goes.
    //
    // This is the bug that made it drift on phones: the height has a CSS floor
    // (34px for a cursor, 44px for a thumb), and computing the travel from the
    // number we ASKED for rather than the one we GOT meant that whenever the
    // proportional height fell between the two, the thumb was told to travel
    // further than the track allows. It ran past the end and misreported the
    // position, worse the longer the page — so History and the iOS wizard, the
    // two places long enough to need it, were the two places it lied.
    thumb.style.height = Math.round(m.view * (d.clientHeight / d.scrollHeight)) + 'px';
    var h = thumb.offsetHeight;
    var span = Math.max(0, m.view - h);
    // Clamped because iOS rubber-band overscroll reports scrollTop below zero
    // and above max, which would otherwise push the thumb outside the track at
    // both ends of every flick.
    var frac = Math.min(1, Math.max(0, m.pos / m.max));
    thumb.style.top = Math.round(span * frac) + 'px';
  }
  // Scroll fires far more often than the screen refreshes; coalescing to a frame
  // keeps a flick from queueing dozens of identical layout reads.
  function sync(){ if (!raf) raf = requestAnimationFrame(paint); }

  function scrollToThumbTop(top){
    var m = metrics(), h = thumb.offsetHeight;
    var span = m.view - h;
    if (span <= 0) return;
    doc().scrollTop = Math.max(0, Math.min(1, top / span)) * m.max;
  }

  function onDown(e){
    var r = thumb.getBoundingClientRect(), inThumb = e.clientY >= r.top && e.clientY <= r.bottom;
    var elTop = el.getBoundingClientRect().top;

    // near the bottom is one gesture rather than a tap followed by a drag.
    grabOff = inThumb ? e.clientY - r.top : thumb.offsetHeight / 2;
    if (!inThumb) scrollToThumbTop(e.clientY - elTop - grabOff);

    el.classList.add('drag');
    try { el.setPointerCapture(e.pointerId); } catch(err){}
    e.preventDefault();
  }
  function onMove(e){
    if (!dragging) return;
    scrollToThumbTop(e.clientY - el.getBoundingClientRect().top - grabOff);
    e.preventDefault();
  }
  function onUp(e){
    if (!dragging) return;
    dragging = false;
    el.classList.remove('drag');
    try { el.releasePointerCapture(e.pointerId); } catch(err){}
  }

  return {
    init: function(){
      el = $('scroller'); if (!el) return;
      // Touch devices scroll fine on their own — see the CSS note. Bailing here
      // means no scroll/resize listeners run on a phone at all.
      try { if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) return; } catch(e){}

      el.addEventListener('pointerdown', onDown);
      el.addEventListener('pointermove', onMove);
      el.addEventListener('pointerup', onUp);
      el.addEventListener('pointercancel', onUp);
      window.addEventListener('scroll', sync, { passive:true });
      window.addEventListener('resize', sync);

      // resizes the track without any scroll event firing. Without this the
      // thumb keeps its old scale until you happen to scroll again.
      if (window.visualViewport){
        window.visualViewport.addEventListener('resize', sync);
        window.visualViewport.addEventListener('scroll', sync);
      }
