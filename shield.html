/* ── Config wiring ────────────────────────────────────────────────────────── */
function wireConfig(id, ro){
  var root = $('v-config');

  Array.prototype.forEach.call(root.querySelectorAll('[data-add]'), function(b){
    b.onclick = function(){ addTarget(b.getAttribute('data-add')); };
  });
  Array.prototype.forEach.call(root.querySelectorAll('[data-preview]'), function(b){
    b.onclick = function(){ previewTargets(b.getAttribute('data-preview')); };
  });
  Array.prototype.forEach.call(root.querySelectorAll('[data-del]'), function(b){
    b.onclick = function(){
      var parts = b.getAttribute('data-del').split(':');
      delTarget(parts[0], parts.slice(1).join(':'));
    };
  });
  Array.prototype.forEach.call(root.querySelectorAll('[data-edit]'), function(b){
    b.onclick = function(){
      var parts = b.getAttribute('data-edit').split(':');
      editTarget(parts[0], parts.slice(1).join(':'));
    };
  });
  Array.prototype.forEach.call(root.querySelectorAll('[data-hide]'), function(b){
    if (ro) return;
    b.onclick = function(){ toggleHide(b.getAttribute('data-hide')); };
  });
  Array.prototype.forEach.call(root.querySelectorAll('[data-opt]'), function(b){
    if (ro || b.disabled) return;
    b.onclick = function(){ toggleOpt(b.getAttribute('data-opt')); };
  });

  wireIosGuard(root, ro);

  var ml = $('a-manage-lock'); if (ml) ml.onclick = function(){ window.AL.manage(lockId()); };
  var rn = $('a-rename'); if (rn) rn.onclick = async function(){
    var d = devRec(S.devId);
    var n = await window.uiPrompt('Name for this device', { title:'Rename device', default:(d&&d.name)||defaultName() });
    if (n === null || n === undefined) return;
    n = String(n).trim(); if (!n) return;
    await writeMine('name', n, true).catch(function(){});
  };
  var rl = $('a-relock'); if (rl) rl.onclick = function(){
    window.AL.markLocked(lockId()); toast('Shield will ask for the passcode next time.'); renderConfig();
  };
}

/* The iOS guard's own controls. Split out of wireConfig because it is the one
   part of the config screen that only exists on one platform. */
function wireIosGuard(root, ro){
  Array.prototype.forEach.call(root.querySelectorAll('[data-step]'), function(b){
    b.onclick = function(){
      var n = b.getAttribute('data-step');
      setIosStep(n, !iosStep(n));
      renderConfig();
    };
  });

  var add = $('a-ios-add');
  if (add && !ro) add.onclick = async function(){
    var n = await window.uiPrompt(
      'The app\'s name as it appears on the Home Screen — this is just a reminder of what you set up in Shortcuts, so '
      + 'spell it however you like.',
      { title:'Guard an app', placeholder:'Instagram', okLabel:'Add' });
    if (n === null || n === undefined) return;
    n = String(n).trim(); if (!n) return;
    var apps = iosApps();
    if (apps.some(function(a){ return a.toLowerCase() === n.toLowerCase(); })){ toast('Already on the list.'); return; }
    apps.push(n); setIosApps(apps); renderConfig();
  };

  Array.prototype.forEach.call(root.querySelectorAll('[data-iosdel]'), function(b){
    if (ro) return;
    b.onclick = async function(){
      var name = b.getAttribute('data-iosdel');
      var ok = await window.uiConfirm(
        'Remove ' + name + ' from the list?\n\nThis only edits the list here. The automation on your phone keeps running '
        + 'until you delete it in the Shortcuts app too.',
        { title:'Remove app', okLabel:'Remove', danger:true });
      if (!ok) return;
      setIosApps(iosApps().filter(function(a){ return a !== name; }));
      renderConfig();
    };
  });

  var get = $('a-guard-get');
  if (get) get.onclick = function(){ mintGuardKey(false); };

  var rot = $('a-guard-rotate');
  if (rot) rot.onclick = async function(){
    var ok = await window.uiConfirm(
      'Create a new link and kill the old one?\n\nEvery shortcut using the old link stops working the moment you do '
      + 'this — you will have to paste the new one into Shield Guard before it checks anything again.',
      { title:'Replace guard link', okLabel:'Replace', danger:true });
    if (ok) mintGuardKey(true);
  };

  var cp = $('a-guard-copy');
  if (cp) cp.onclick = async function(){
    var u = guardUrl(); if (!u) return;
    // A phone is exactly where clipboard permission is most likely to be
    // refused, and a silent failure here means pasting a blank URL into a
    // shortcut that then fails in a way nobody could diagnose.
    try { await navigator.clipboard.writeText(u); toast('Guard link copied.'); }
    catch(e){ await window.uiAlert(u, { title:'Copy this link' }); }
  };
}

async function mintGuardKey(rotate){
  var c = await challenge('Guard link', rotate
    ? 'Enter your Shield passcode to create a replacement guard link.'
    : 'Enter your Shield passcode. The link is created once and stays on this device.');
  if (!c.ok) return;
  var k = await fetchGuardKey(c.password, rotate);
  if (!k){ await window.uiAlert('Could not reach the Shield service. Check your connection and try again.', { title:'Guard link' }); return; }
  toast(rotate ? 'New guard link created. The old one no longer works.' : 'Guard link created.');
  renderConfig();
}

/* Show what a target set would close, without closing it.
   Exact-name and folder matching are both easy to get subtly wrong — a path
   that no longer exists, a folder one level too high — and finding that out
   during an actual emergency is the worst possible time. */
async function previewTargets(kind){
  if (!caps().kill){ toast('Needs the Shield agent on this device.', true); return; }
  var tg = targetsFor(kind, S.devId);
  if (!tg.length) return;
  try {
    var res = await Agent.invoke('sh_kill', { args: { targets: tg, dryRun: true } });
    var items = resultItems(res);
    var total = items.reduce(function(n, i){ return n + (i.status === 'wouldclose' ? i.count : 0); }, 0);
    await window.uiAlert(
      items.map(function(i){
        if (i.status === 'wouldclose') return '• ' + i.label + ' — ' + i.count + ' process' + (i.count===1?'':'es');
        if (i.status === 'notrunning') return '• ' + i.label + ' — not running';
        if (i.status === 'denied') return '• ' + i.label + ' — refused: ' + (i.error || 'protected');
        return '• ' + i.label + ' — ' + i.status + (i.error ? ' (' + i.error + ')' : '');
      }).join('\n') + '\n\n' + total + ' process' + (total===1?'':'es') + ' would close. Nothing was closed.',
      { title:'Preview' });
  } catch(e){
    await window.uiAlert('Agent did not respond: ' + errText(e), { title:'Preview failed' });
  }
}

async function addTarget(kind){
  if (isReadOnly()) return;
  var c = caps();
  var suggestions = null;
  // On a device with the agent, offer what is actually running rather than
  // making the user guess an executable name.
  if (c.agent){
    try { suggestions = await Agent.invoke('sh_enumerate', {}); } catch(e){ suggestions = null; }
  }
  var msg = TARGET_HELP;
  if (!c.agent){
    msg += '\n\nThis device has no Shield agent, so nothing here can actually be closed — targets are saved and apply once the agent is installed.';
  }
  if (suggestions && suggestions.running && suggestions.running.length){
    msg += '\n\nRunning now: ' + suggestions.running.slice(0, 12).join(', ');
  }
  var vals = await window.uiForm({
    title: kind === 'emergency' ? 'Add emergency target'
         : (kind === 'trigger' ? 'Close apps when this opens' : 'Add target'),
    message: msg,
    okLabel: 'Add',
    fields: [
      { name:'value', label:'Executable or path', placeholder:'discord.exe', autocap:false, required:true },
      { name:'label', label:'Display name (optional)', placeholder:'Discord' }
    ]
  });
  if (!vals) return;
  var value = String(vals.value||'').trim().replace(/[\\\/]+$/, '');
  if (!value) return;
  var t = {
    id: uid(),
    label: String(vals.label||'').trim() || value.split(/[\\\/]/).pop() || value,
    match: { type: matchKindFor(value), value: value },
    hideIcons: false
  };
  var list = targetsFor(kind, S.devId).slice();
  if (list.some(function(x){ return x.match && x.match.value.toLowerCase() === value.toLowerCase(); })){
    toast('That target is already in the list.'); return;
  }
  list.push(t);
  await saveTargets(kind, list);
}
/* Edit an existing target in place.
   Keeps its id, so its history entries and its hide-icons toggle survive the
   edit — and re-derives the match type, because changing ".../Riot.exe" to
   "C:\Riot Games" has to switch from an exact file to a whole folder. */
async function editTarget(kind, tid){
  if (isReadOnly()) return;
  var list = targetsFor(kind, S.devId);
  var cur = null;
  for (var i = 0; i < list.length; i++) if (list[i].id === tid) cur = list[i];
  if (!cur) return;

  var vals = await window.uiForm({
    title: 'Edit target',
    message: TARGET_HELP,
    okLabel: 'Save',
    fields: [
      { name:'value', label:'Executable, folder or full path',
        value: (cur.match && cur.match.value) || '', autocap:false, required:true },
      { name:'label', label:'Display name (optional)', value: cur.label || '' }
    ]
  });
  if (!vals) return;
  var value = String(vals.value||'').trim().replace(/[\\\/]+$/, '');
  if (!value) return;

  var clash = list.some(function(x){
    return x.id !== tid && x.match && x.match.value.toLowerCase() === value.toLowerCase();
  });
  if (clash){ toast('Another target already uses that.', true); return; }

  var updated = list.map(function(x){
    if (x.id !== tid) return x;
    return Object.assign({}, x, {
      label: String(vals.label||'').trim() || value.split(/[\\\/]/).pop() || value,
      match: { type: matchKindFor(value), value: value }
    });
  });
  await saveTargets(kind, updated);
  toast('Target updated.');
}

async function delTarget(kind, tid){
  if (isReadOnly()) return;
  var all = targetsFor(kind, S.devId);
  var t = null;
  for (var i = 0; i < all.length; i++) if (all[i].id === tid) t = all[i];
  if (!t) return;

  // Deletion is one click next to an edit pencil, and there is no undo — a
  // trigger removed by a misclick is silently gone and only noticed when it
  // stops firing. Cheap to confirm, expensive not to.
  var where = kind === 'emergency' ? 'Emergency targets'
            : (kind === 'trigger' ? 'the auto-close triggers' : 'Program Closer targets');
  var ok = await window.uiConfirm(
    'Remove "' + (t.label || (t.match && t.match.value) || 'this target') + '" from ' + where + '?\n\n'
    + ((t.match && t.match.value) || ''),
    { title:'Remove target', okLabel:'Remove', danger:true });
  if (!ok) return;

  await saveTargets(kind, all.filter(function(x){ return x.id !== tid; }));
  toast('Removed.');
}
async function toggleHide(tid){
  var list = targetsFor('emergency', S.devId).map(function(t){
    return t.id === tid ? Object.assign({}, t, { hideIcons: !t.hideIcons }) : t;
  });
  await saveTargets('emergency', list);
}
async function saveTargets(kind, list){
  var field = kind === 'emergency' ? 'emergency.targets'
            : (kind === 'trigger' ? 'closer.triggers' : 'closer.targets');
  // Optimistic local update so the list redraws instantly; the snapshot
  // confirms moments later.
  var d = S.doc && S.doc.devices && S.doc.devices[S.devId];
  if (d){
    if (kind === 'emergency'){ d.emergency = d.emergency || {}; d.emergency.targets = list; }
    else if (kind === 'trigger'){ d.closer = d.closer || {}; d.closer.triggers = list; }
    else { d.closer = d.closer || {}; d.closer.targets = list; }
  }
  renderConfig(); renderHome();
  pushConfig();
  await writeMine(field, list).catch(function(){ toast('Could not save. Check the connection.', true); });
}
async function toggleOpt(key){
  var cfg = cfgEmg(S.devId);
  var cur = key === 'lockWorkstation' ? !!cfg.lockWorkstation : (cfg[key] !== false);
  var val = !cur;
  var d = S.doc && S.doc.devices && S.doc.devices[S.devId];
  if (d){ d.emergency = d.emergency || {}; d.emergency[key] = val; }
  renderConfig();
  pushConfig();
  await writeMine('emergency.' + key, val).catch(function(){ toast('Could not save.', true); });
}

/* ── Emergency screen ─────────────────────────────────────────────────────── */
function renderEmergency(){
  var g = globalState(), le = localEmg(), src = emgSource();
  var isGlobal = src === 'global';
  var devs = devList();
  var lockedN = devs.filter(devLocked).length;

  var h = '';
  h += '<div class="emg-icon">' + svg(GLYPH.alert) + '</div>';
  h += '<div class="emg-title">Locked</div>';
  h += '<div class="emg-scope">' + (isGlobal ? 'Global emergency — all devices' : 'Emergency — this device') + '</div>';

  h += '<div class="emg-meta">';
  if (isGlobal){
    h += metaRow('Activated from', esc(g.byName || 'Unknown device') + (g.byId === S.devId ? ' (this device)' : ''));
    h += metaRow('Time', clock(g.at));
    h += metaRow('Devices affected', lockedN + ' / ' + devs.length);
  } else {
    h += metaRow('Activated', clock(le.at) + ' on this device');
    h += metaRow('Scope', 'This device only');
  }
  h += '</div>';

  if (devs.length > 1){
    h += '<div class="emg-devs">';
    h += devs.map(function(d){
      var mine = d.id === S.devId;
      return '<div class="emg-dev"><span class="n">' + esc(d.name || 'Device') + (mine ? ' · this device' : '') + '</span>'
           + '<span class="tag ' + (devLocked(d) ? 'locked' : '') + '">' + (devLocked(d) ? 'Locked' : (devOnline(d) ? 'Open' : 'Offline')) + '</span></div>';
    }).join('');
    h += '</div>';
  }

  if (S.report && S.report.length){
    h += '<div class="emg-report">' + reportHtml(S.report) + '</div>';
  }

  h += '<div class="emg-actions">';
  h += '<button class="btn danger" id="e-off-local" style="height:44px">Disable on this device</button>';
  if (isGlobal) h += '<button class="btn danger" id="e-off-global" style="height:44px">Disable on all my devices</button>';
  h += '</div>';

  h += '<div class="emg-note">The Shield passcode is required either way — being already signed in on this device is not enough.'
    +  (isGlobal ? ' Releasing this device leaves the rest of your devices locked.' : '')
    +  ' Everything closed here is recorded, and Shield can reopen all of it once the lockdown is lifted.</div>';

  $('emg-wrap').innerHTML = h;
  $('emg-screen').classList.add('on');

  var a = $('e-off-local'); if (a) a.onclick = actDisableLocal;
  var b = $('e-off-global'); if (b) b.onclick = actDisableGlobal;
}
function metaRow(k, v){ return '<div class="emg-row"><span class="k">' + esc(k) + '</span><span class="v">' + v + '</span></div>'; }

/* ── Navigation ───────────────────────────────────────────────────────────── */
function go(view){
  S.view = view;
  // Route state stays in localStorage, never in the URL. A hash breaks the
  // single-tab handoff at the top of this file and leaves an installed PWA
  // sitting on two tabs forever.
  lsSet('sh_view', view);
  Array.prototype.forEach.call(document.querySelectorAll('.nav > .pill[data-view]'), function(b){
    b.classList.toggle('on', b.getAttribute('data-view') === view);
  });
  ['home','config','devices','history'].forEach(function(v){
    $('v-' + v).classList.toggle('active', v === view);
  });
  if (view !== 'config') S.viewDev = null;
  // Views are rendered lazily, on the way in — see render().
  if (S.profile) renderView(view);
  window.scrollTo(0, 0);
}

/* ══ SNAPSHOT HANDLING ════════════════════════════════════════════════════ */
function onSnap(data){
  var prevGlobalV = globalState().v || 0;
  var prevOn = emgOn();

  // Skip the whole pass when the document is byte-identical to the one already
  // on screen. Firestore re-delivers a snapshot for our own writes, and
  // re-rendering on those replaces every button in the DOM — including the one
  // under the cursor, which is why clicks were being dropped.
  var sig = JSON.stringify(data || null);
  var unchanged = (sig === S.lastSig);
  S.lastSig = sig;

  S.doc = data || { global:{ active:false, v:0 }, devices:{} };
  syncState('ok');
  // Before the early return: a token minted on another device must land here
  // even when nothing else about the doc changed for us.
  syncGuardKey();
  if (unchanged && S.registered) return;

  ensureRegistered().then(function(){
    S.registered = true;
    // This device now belongs to this profile — make sure it is gone from the
    // other one rather than merely inactive there.
    purgeFromOtherProfile();
    // Keep the agent's copy of the config current, so the tray and the hotkeys
    // act on what the user last configured even after the window is closed.
    pushConfig();
    reconcile(prevGlobalV, prevOn);
    render();
  });
}

/* Conflict resolution. global.v is a monotonic Date.now(): the higher version
   wins, and on a tie ON beats OFF so the system fails toward locked. A local
   emergency is never cleared by a snapshot older than the local one. */
function reconcile(prevGlobalV, prevOn){
  var g = globalState();
  var le = localEmg();
  var nowOn = emgOn();

  if (nowOn && !prevOn){
    // Arrived locked. Either a remote command landed while we were open, or we
    // just started up into a live emergency. Enforce before anything else
    // paints — the config and device list must not be reachable first.
    var byName = (g.byId === S.devId) ? '' : (g.byName || 'another device');
    runEmergency(g.active ? 'remote' : 'local', byName, g.active ? 'global' : 'local');
    return;
  }
  if (!nowOn && prevOn){
    // Global was lifted elsewhere (or our opt-out took effect).
    exitEmergency();
    return;
  }
  if (nowOn && g.active && g.v > prevGlobalV && le.v && g.v > le.v){
    // A NEWER global command arrived while already locked — re-run enforcement
    // so a device that had opted out of the previous one re-arms.
    runEmergency('remote', g.byName || 'another device');
  }
}

/* ══ BOOT ═════════════════════════════════════════════════════════════════ */
function themeFor(p){
  document.body.setAttribute('data-profile', p);
  var m = $('meta-theme');
  if (m) m.setAttribute('content', p === 'veda' ? '#1B1C1E' : '#1a1a1d');
  var b = $('pf-badge'); if (b) b.textContent = p === 'veda' ? 'V' : 'T';
}

function enterProfile(p){
  S.profile = p;
  S.devId = deviceId();
  // Reset the echo-suppression state. Carrying it across a profile switch made
  // the first snapshot of the new profile look like an unchanged echo, so
  // registration, the config push to the agent and the first render were all
  // skipped — the app came up looking connected and did nothing.
  S.lastSig = null;
  S.registered = false;
  lsSet('sh_profile', p);
  themeFor(p);
  document.body.setAttribute('data-gate', 'app');

  // Come back into the locked screen from local state immediately, before
  // Firestore answers. A phone that restarted mid-emergency must not show the
  // configuration for even one frame.
  if (localEmg().active){ S.report = null; renderEmergency(); }

  if (S.unsub){ try { S.unsub(); } catch(e){} S.unsub = null; }
  syncState('saving');
  if (window._shWatch){
    S.unsub = window._shWatch(p, onSnap, function(){ syncState('err'); });
  } else {
    window.addEventListener('fb-ready', function(){
      if (window._shWatch && !S.unsub) S.unsub = window._shWatch(p, onSnap, function(){ syncState('err'); });
    }, { once:true });
  }

  startHeartbeat();
  wireAgentEvents();
  // Identity first — registering under a page-minted id and then switching
  // would leave the duplicate behind that this is meant to prevent. Then adopt
  // whatever the agent is actually enforcing, and pick up anything it closed
  // from the tray while this page was shut.
  adoptAgentDeviceId()
    .then(syncAgentState)
    .then(pullAgentHistory)
    .then(function(){ render(); });

  go(lsGet('sh_view', 'home'));
  render();
}

function goProfileSelect(){
  if (S.unsub){ try { S.unsub(); } catch(e){} S.unsub = null; }
  if (S.hbTimer){ clearInterval(S.hbTimer); S.hbTimer = null; }
  S.profile = null; S.doc = null; S.viewDev = null; S.report = null;
  S.lastSig = null; S.registered = false;
  S._skipFav = true;   // deliberately leaving a profile: do not auto-re-enter it
  $('emg-screen').classList.remove('on');
  document.body.setAttribute('data-gate', 'boot');
  document.body.setAttribute('data-profile', 'tony');
  renderProfileCards();
}

function renderProfileCards(){
  var owner = claimedBy(), fav = favProfile();
  [['tony','pf-t'],['veda','pf-v']].forEach(function(pair){
    var p = pair[0], card = $(pair[1]);
    if (!card) return;
    ['.pf-lock','.pf-emg','.pf-star','.pf-claim'].forEach(function(sel){
      var el = card.querySelector(sel); if (el) el.remove();
    });
    card.classList.toggle('foreign', !!(owner && owner !== p));

    if (window.AL.isLocked(p + '_shield')){
      var s = document.createElement('span');
      s.className = 'pf-lock';
      s.innerHTML = window.AL.isUnlocked(p + '_shield') ? window.AL.ICON.unlock : window.AL.ICON.lock;
      card.appendChild(s);
    }

    // Favourite star — click it without entering the profile.
    var star = document.createElement('span');
    star.className = 'pf-star' + (fav === p ? ' on' : '');
    star.textContent = fav === p ? '★' : '☆';
    star.title = fav === p ? 'Opens straight to this profile — click to unset' : 'Open Shield straight to this profile';
    star.onclick = function(ev){ ev.stopPropagation(); toggleFav(p); };
    card.appendChild(star);

    if (owner && owner !== p){
      var c = document.createElement('span');
      c.className = 'pf-claim'; c.textContent = 'Claimed by ' + (owner==='veda'?'V':'T');
      card.appendChild(c);
    } else {
      // Surface a live emergency on the chooser, visible before you pick.
      var le = jGet('sh_emg_' + p, null);
      if (le && le.active){
        var e = document.createElement('span');
        e.className = 'pf-emg'; e.textContent = 'Locked down';
        card.appendChild(e);
      }
    }
  });
}

async function chooseProfile(p){
  var owner = claimedBy();
  if (owner && owner !== p){
    // Claimed by the other profile. Offer the release path rather than a flat
    // refusal — but releasing costs the OWNER's passcode.
    var released = await releaseDevice(owner);
    renderProfileCards();
    if (!released) return;
  }
  themeFor(p);   // theme the lock screen to the profile being entered
  window.AL.gate(p + '_shield', function(){ enterProfile(p); }, function(){
    document.body.setAttribute('data-profile', 'tony');
    renderProfileCards();
  });
}

/* ── Favourite profile ────────────────────────────────────────────────────
   Same idea as MyList's ml_fav_profile: mark one profile on this device and
   Shield opens straight into it, which for an emergency tool is the difference
   between one tap and two. Per device, never synced — the favourite is a
   property of the machine, not the account. */
function favProfile(){ return lsGet('sh_fav_profile', ''); }
function toggleFav(p){
  if (favProfile() === p) lsDel('sh_fav_profile');
  else lsSet('sh_fav_profile', p);
  renderProfileCards();
}

function boot(){
  $('pf-t').onclick = function(){ chooseProfile('tony'); };
  $('pf-v').onclick = function(){ chooseProfile('veda'); };
  $('pf-badge').onclick = goProfileSelect;
  $('lock-btn').onclick = function(){ window.AL.manage(lockId()); };
  Scroll.init();

  Array.prototype.forEach.call(document.querySelectorAll('.nav > .pill[data-view]'), function(b){
    b.onclick = function(){ go(b.getAttribute('data-view')); };
  });

  renderProfileCards();

  // A device that restarted while locked down comes straight back to the
  // emergency screen for its last profile — no network needed to decide that.
  var last = lsGet('sh_profile', '');
  if (last && jGet('sh_emg_' + last, { active:false }).active){
    chooseProfile(last);
    return;
  }

  document.body.setAttribute('data-gate', 'boot');

  // Favourite profile: skip the chooser entirely. `_skipFav` is set by the
  // profile-switch button, so switching profiles does not immediately bounce
  // you back into the favourite.
  var fav = favProfile();
  if (fav && !S._skipFav && (!claimedBy() || claimedBy() === fav)){
    chooseProfile(fav);
    return;
  }

  document.addEventListener('visibilitychange', function(){
    if (!document.hidden && S.profile) heartbeat();
  });
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

/* Public surface — the App Lock module calls back into these. */
return {
  onLockChange: function(){ renderProfileCards(); if (S.profile) { renderLockBtn(); renderConfig(); } },
  onRemoteLocks: function(){
    renderProfileCards();
    if (!S.profile) return;
    renderLockBtn();
    // Shield's own lock changed elsewhere and this device no longer qualifies:
    // drop back to the chooser rather than sitting on an open configuration.
    if (window.AL.mustBlock(lockId())) goProfileSelect();
    else renderConfig();
  },
  onDeviceRelock: function(){ goProfileSelect(); },
  _state: S,
  _caps: caps,
  // Debug/test seam. `_write` exists so the write circuit breaker can be
  // exercised against a real runaway rather than a mock of one.
  _write: write,
  // The iOS guard's internals. The wizard only appears when the page believes
  // it is on iOS, so it cannot be reached from a desktop browser at all — these
  // are what let the headless harness drive it without faking the whole DOM.
  _ios: { platform: platform, apps: iosApps, setApps: setIosApps,
          step: iosStep, url: guardUrl, setKey: setGuardKey, render: renderConfig },
  // Exposed so the navorder listener (Firebase module script, loaded earlier
  // in the page) can push local-link paths into the agent without duplicating
  // the __TAURI__ presence check Agent already does.
  Agent: Agent
};
})();
</script>
</body>
</html>
