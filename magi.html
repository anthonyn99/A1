   prose and prose in a fixed pitch reads like a log file. Manrope carries the
   headings. IBM Plex Mono is reserved for things where the character grid is
   the point: latencies, char counts, CSS selectors, codenames, table data.
   Mixing them at random would just look inconsistent, so the rule is that
   mono means "this is a value, not a sentence". */
.node-meta, .core-count, .verdict-quorum, .chip-unit, .node-sub,
.slide-count, .bs-council-meta,
.studio-raw, .verdict-body code, .sheet-note code, .bs-hint code,
table.doctor, table.doctor code, .v-table,
.quiz-opt-letter, .side-tag, .bs-chip {
  font-family: var(--font-mono);
}

/* Headings take the display face. */
.wordmark, .mtop-title, .verdict-title, .bs-title, .studio-view-title,
.sheet-hd, .core-status, .drawer-hd, .side-sec-hd, .v-h, .verdict-body .sec,
.slide-title, .bs-questions-hd, .badge {
  font-family: var(--font-display);
}

/* Prose gets a touch more line-height now it is no longer monospaced --
   Inter's x-height is larger, so the old 1.55 read tight. */
.verdict-body p, .verdict-body .v-list li, .node-body { line-height: 1.65; }

/* ══ STUDIO ═══════════════════════════════════════════════════════════ */
/* ── history / doctor drawers ─────────────────────────────────────────── */
/* The two lists are capped and centred, like the accounts column -- a row of
   history spanning 1,400px puts the date a hand's width from the question it
   belongs to. 900px rather than the accounts' 720 so each aligns with the
   composer directly above it and the pair reads as one column. */
#historyDrawer, .bs .drawer {
  width: 100%; max-width: 900px; margin-left: auto; margin-right: auto;
}
.drawer { background: var(--s1); border: 1px solid var(--bd); border-radius: 2px; margin-bottom: 16px; }
.drawer-hd {
  padding: 8px 12px; border-bottom: 1px solid var(--bd);
  font-size: 9.5px; font-weight: 700; letter-spacing: 1.6px;
  text-transform: uppercase; color: var(--txd);
}
/* The way out of a deliberation you opened, in the header of the verdict
   itself -- see renderVerdict. Pushed to the end of the row, beside Copy. */
.verdict-acts { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; }
.verdict-close {
  display: inline-flex; align-items: center; gap: 6px;
  background: transparent; border: 1px solid var(--bdl); border-radius: 9px;
  color: var(--txm); font-family: inherit; font-size: 10.5px; font-weight: 600;
  letter-spacing: .4px; padding: 4px 10px; cursor: pointer;
  transition: border-color .15s, color .15s;
}
.verdict-close:hover { border-color: var(--ac); color: var(--ac); }
.verdict-close-x { font-size: 11px; line-height: 1; }
@media (max-width: 720px) {
  .verdict-close { padding: 7px 12px; font-size: 11px; }
}

/* A verdict that did not land. Not styled as a catastrophe: the answers it
   was built from are still on the screen above it. */
.verdict-failed { display: flex; flex-direction: column; gap: 7px; }
.vf-head { color: var(--amber); font-size: 14px; font-weight: 600; }
.vf-sub { color: var(--txm); font-size: 12.5px; line-height: 1.55; max-width: 70ch; }
.vf-why {
  color: var(--txd); font-size: 11.5px; line-height: 1.5; max-width: 80ch;
  border-left: 2px solid var(--bdl); padding-left: 10px;
}


/* The question a verdict answers, above the answer. Quiet and clamped: it is
   here to identify the block below it, not to be read twice. */
.verdict-q {
  display: flex; gap: 10px; align-items: baseline;
  padding: 9px 14px; border-bottom: 1px solid var(--bdl);
  background: color-mix(in srgb, var(--s2) 55%, transparent);
}
.verdict-q-tag {
  flex: 0 0 auto; color: var(--txd); font-size: 9px; font-weight: 700;
  letter-spacing: 1.4px; text-transform: uppercase;
}
.verdict-q-text {
  flex: 1 1 auto; min-width: 0; color: var(--txm); font-size: 12.5px;
  line-height: 1.5;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; cursor: pointer; white-space: pre-wrap;
}
.verdict-q-text.open { -webkit-line-clamp: unset; display: block; }
@media (max-width: 720px) {
  .verdict-q { padding: 8px 12px; gap: 8px; }
  .verdict-q-text { font-size: 12px; -webkit-line-clamp: 4; }
}

/* The prompt on the wire. Quiet -- it is a label, not an alert -- but with
   the accent and a live dot so it reads as happening now rather than as
   something that happened. */
.run-now {
  display: flex; align-items: baseline; gap: 10px;
  max-width: 900px; margin: 0 auto 10px; padding: 8px 12px;
  background: color-mix(in srgb, var(--ac) 7%, transparent);
  border: 1px solid color-mix(in srgb, var(--ac) 22%, transparent);
  border-left-width: 3px; border-radius: var(--r-card);
}
.run-now[hidden] { display: none; }
.run-now.elsewhere { border-style: dashed; }
.run-now-tag {
  display: inline-flex; align-items: center; gap: 6px; flex: 0 0 auto;
  color: var(--ac); font-size: 9px; font-weight: 700; letter-spacing: 1.4px;
  text-transform: uppercase;
}
.run-now-dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--ac);
  animation: runNowPulse 1.6s ease-in-out infinite;
}
@keyframes runNowPulse {
  0%, 100% { opacity: .35; transform: scale(.85); }
  50%      { opacity: 1;   transform: scale(1.15); }
}
@media (prefers-reduced-motion: reduce) {
  .run-now-dot { animation: none; opacity: .9; }
}
/* Two lines at most: this is a caption for the grid, not the prompt box. */
.run-now-q {
  flex: 1 1 auto; min-width: 0; color: var(--tx); font-size: 12.5px;
  line-height: 1.5;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden;
}
.run-now-show {
  flex: 0 0 auto; background: transparent; border: 1px solid var(--bdl);
  border-radius: 8px; color: var(--txm); font-family: inherit;
  font-size: 10.5px; font-weight: 600; padding: 3px 9px; cursor: pointer;
}
.run-now-show:hover { border-color: var(--ac); color: var(--ac); }
@media (max-width: 720px) {
  .run-now { max-width: none; gap: 8px; padding: 8px 10px; flex-wrap: wrap; }
  .run-now-q { flex: 1 1 100%; font-size: 12px; }
  .run-now-show { padding: 6px 11px; }
}

/* ── the queue ──────────────────────────────────────────────────────────── */
.queue { max-width: 720px; margin: 10px auto 0; }
.queue-hd { display: flex; align-items: center; gap: 8px; }
.queue-count {
  color: var(--txm); font-weight: 600; letter-spacing: .6px;
  text-transform: none; font-size: 10px;
}
.queue-acts { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.queue-act { padding: 3px 9px; font-size: 10px; }
.q-row {
  display: flex; align-items: flex-start; gap: 8px; padding: 8px 12px;
  border-bottom: 1px solid var(--bdl);
}
.q-row:last-child { border-bottom: 0; }
.q-row.running { background: color-mix(in srgb, var(--ac) 9%, transparent); }
.q-row.done { opacity: .62; }
.q-row.failed { background: color-mix(in srgb, var(--red) 8%, transparent); }
.q-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
/* Two lines of prompt, never more: a queue is a list you scan, and one long
   prompt should not push the next five off the screen. */
.q-text {
  font-size: 12.5px; color: var(--tx); line-height: 1.45;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden;
}
.q-meta {
  display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
  font-size: 10px; color: var(--txd);
}
.q-units { display: inline-flex; gap: 3px; }
/* The units as their own colours, small -- the same identity the chips above
   use, so a row reads as "these ones" without naming them. */
.q-unit {
  width: 7px; height: 7px; border-radius: 2px;
  display: inline-block; flex: 0 0 auto;
}
.q-att { color: var(--txm); }
.q-err { color: var(--red); }
.q-acts { display: flex; align-items: center; gap: 2px; flex: 0 0 auto; }
.q-act {
  width: 26px; height: 26px; border-radius: 7px; padding: 0;
  background: transparent; border: 1px solid transparent; color: var(--txd);
  cursor: pointer; font-family: inherit; font-size: 12px; line-height: 1;
  display: inline-flex; align-items: center; justify-content: center;
}
.q-act:hover { border-color: var(--bdl); color: var(--tx); }
.q-act.danger:hover { border-color: var(--red); color: var(--red); }
/* The one control on a failed row that fixes it. */
.q-act.retry { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 40%, transparent); }
.q-act.retry:hover:not(:disabled) { border-color: var(--amber); color: var(--amber); }
#queueRetryBtn { color: var(--amber); }
/* The one control on a running row that does something right now. */
.q-act.watching { color: var(--ac); border-color: color-mix(in srgb, var(--ac) 45%, transparent); }
.q-act.watching:hover { border-color: var(--ac); }
.q-act:disabled { opacity: .3; cursor: default; }
.q-state {
  font-size: 9px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
}
.q-state.queued { color: var(--txd); }
.q-state.running { color: var(--ac); }
.q-state.done { color: var(--grn); }
.q-state.failed { color: var(--red); }
@media (max-width: 720px) {
  .queue { max-width: none; }
  .q-row { padding: 10px; gap: 6px; }
  .q-text { -webkit-line-clamp: 2; font-size: 12px; }
  /* 34px, and the row's controls wrap under the prompt rather than squeezing
     it into a column three words wide. A 26px target between two others is a
     tap you have to aim. */
  .q-row { flex-wrap: wrap; }
  .q-main { flex: 1 1 100%; }
  .q-acts { flex: 1 1 100%; justify-content: flex-end; gap: 4px; }
  .q-act { width: 34px; height: 34px; border-color: var(--bdl); }
  .queue-hd { flex-wrap: wrap; row-gap: 8px; }
  .queue-acts { flex: 1 1 100%; margin-left: 0; justify-content: flex-end; }
  .queue-act { padding: 5px 11px; font-size: 11px; }
  /* The sheet's buttons too: this is where a delete is confirmed. */
  .sheet-bar .btn { padding: 9px 16px; }
}

/* The model a run is going out under, next to the heading that names it. */
.row {
  display: flex; align-items: center; gap: 10px; padding: 7px 12px;
  border-bottom: 1px solid var(--bd); cursor: pointer; font-size: 12px;
}
.row:last-child { border-bottom: none; }
.row:hover { background: var(--s2); }
.row .q { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .meta { color: var(--txm); font-size: 10.5px; white-space: nowrap; }

/* The in-progress state of a doctor pass, carrying its own Stop control so
   cancelling does not depend on finding the sidebar row again. */
.doctor-running {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 12px 14px; color: var(--txd); font-size: 11.5px; line-height: 1.5;
}
.doctor-running > .spin { color: var(--ac); flex-shrink: 0; }

/* ── accounts ─────────────────────────────────────────────────────────────
   One card per unit, in the same language as the doctor's report: an accent
   stripe for identity, a status chip for the answer, and the actions at the
   bottom where they cannot be hit by accident while reading. */
.acc-note {
  color: var(--txd); font-size: 11.5px; line-height: 1.65;
  padding: 11px 13px; margin-bottom: 12px;
  background: var(--s1); border: 1px solid var(--bd); border-radius: var(--r-card);
}
.acc-note b { color: var(--tx); }
.acc-topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.acc-topbar .acc-busy { margin-top: 0; font-size: 11px; }
/* Seven cards of the same size, the same colour and the same four rows run
   together into one striped wall -- the 10px gap and a hairline were not
   enough to say where one unit ended and the next began. Three things fix it,
   and they work together rather than any one of them being the answer: real
   space between cards, a card surface that stands off the page instead of
   matching it, and a full-height accent edge that ties every row of a card to
   the unit it belongs to. */
/* Narrower than the panel. At full width the label input ran the length of
   the screen for a phrase like "personal gmail", and the buttons ended up a
   forearm away from the name they act on. */
/* Centred, not left-hugging. A 720px column pinned to the left edge of a
   1400px panel reads as an unfinished layout rather than a deliberate
   measure -- and every other panel in this console centres. */
.acc-note, .acc-topbar, .acc-card { max-width: 720px; margin-left: auto; margin-right: auto; }
.acc-card {
  border: 1px solid var(--bdl); border-left: 4px solid var(--pa, var(--ac));
  border-radius: var(--r-card); background: var(--s2);
  padding: 14px 16px; margin-bottom: 18px;
  box-shadow: 0 1px 3px var(--shadow);
  transition: border-color .15s, box-shadow .15s;
}
.acc-card:last-child { margin-bottom: 0; }
/* The whole card lifts on hover, so which one you are about to act on is
   never in question when three "Check" buttons are stacked down the page. */
.acc-card:hover {
  border-color: color-mix(in srgb, var(--pa, var(--ac)) 45%, var(--bdl));
  box-shadow: 0 3px 12px var(--shadow);
}
/* The name row is the card's header, separated from its controls the way a
   card's title should be. */
.acc-card .acc-hd { padding-bottom: 10px; border-bottom: 1px solid var(--bd); }
.acc-card .acc-row { margin-top: 11px; }
.acc-card .acc-actions { margin-top: 12px; padding-top: 11px; border-top: 1px solid var(--bd); }
/* Outlined. `.navitem` is borderless by design -- it is the flat control used
   inside panels -- but a row of three flat words reads as body text, and
   "Sign out" in particular should look like something you press on purpose. */
.acc-actions .navitem, .acc-topbar .navitem {
  border: 1px solid var(--bdl); border-radius: 8px; padding: 6px 12px;
}
.acc-actions .navitem:hover:not(:disabled),
.acc-topbar .navitem:hover:not(:disabled) { border-color: var(--ac); }
.acc-actions .navitem.danger { border-color: color-mix(in srgb, var(--red) 40%, transparent); }
.acc-actions .navitem.danger:hover:not(:disabled) { border-color: var(--red); }
.acc-actions .navitem.active { border-color: var(--ac); }
.acc-hd { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.acc-names { min-width: 0; }
.acc-name {
  font-family: var(--font-display); font-size: 13px; font-weight: 800;
  color: var(--tx); letter-spacing: .2px;
}
/* The codename stays monospaced -- it is an identifier, and MELCHIOR·01 is
   the one place this console's Evangelion flavour belongs. It was just set
   too small and too widely tracked to read: 8.5px with 1.3px of letter-spacing
   is a smear at arm's length. */
.acc-sub {
  font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .55px;
  color: var(--txm); margin-top: 2px;
}
.acc-flags { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.acc-detail { color: var(--txd); font-size: 11.5px; line-height: 1.55; margin-top: 6px; }
.acc-row { margin-top: 9px; }
.acc-input {
  width: 100%; background: var(--bg); color: var(--tx);
  border: 1px solid var(--bd); border-radius: 7px;
  padding: 8px 10px; font-family: inherit; font-size: 12px; outline: none;
}
.acc-input:focus { border-color: var(--ac); }
.acc-input::placeholder { color: var(--txm); }
.acc-actions { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-top: 10px; }
/* "87 MB · used 1m ago" is a sentence about the profile, not a reading off a
   gauge, so it sets in the body face like one. */
.acc-meta { color: var(--txm); font-size: 10.5px; letter-spacing: .1px; }
.acc-busy {
  display: flex; align-items: center; gap: 9px; margin-top: 10px;
  color: var(--txd); font-size: 11.5px; line-height: 1.5;
}
.acc-busy .spin { color: var(--ac); flex-shrink: 0; }

/* ── the doctor's report ──────────────────────────────────────────────────
   A verdict, then one card per unit, then the full field table folded away.
   It was previously one flat table of every field of every unit -- about
   thirty rows, almost all of them OK -- which answered "what matched?" when
   the question being asked is "is anything broken, and what do I do?". */
.doc-summary {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px; margin: 0 0 12px;
  border: 1px solid var(--bd); border-radius: var(--r-card);
  background: var(--s1); font-size: 12.5px; font-weight: 600; color: var(--tx);
}
.doc-sum-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; background: var(--txm); }
.doc-summary.good .doc-sum-dot { background: var(--grn); }
.doc-summary.warn .doc-sum-dot { background: var(--amber); }
.doc-summary.bad  .doc-sum-dot { background: var(--red); }
.doc-summary.good { border-color: color-mix(in srgb, var(--grn) 35%, var(--bd)); }
.doc-summary.warn { border-color: color-mix(in srgb, var(--amber) 40%, var(--bd)); }
.doc-summary.bad  { border-color: color-mix(in srgb, var(--red) 45%, var(--bd)); }

.doc-card {
  border: 1px solid var(--bd); border-left: 3px solid var(--bd);
  border-radius: var(--r-card); background: var(--s1);
  padding: 11px 13px; margin-bottom: 10px;
}
.doc-card.good { border-left-color: var(--grn); }
.doc-card.warn { border-left-color: var(--amber); }
.doc-card.bad  { border-left-color: var(--red); }
.doc-hd { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.doc-name {
  font-family: var(--font-display); font-size: 13px; font-weight: 800;
  color: var(--tx); letter-spacing: .2px;
}
.doc-flags { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
/* A status chip is a short phrase, not a machine token.
   Mono at 9px with letter-spacing and forced uppercase made "SIGNED IN" and
   "CHECKED 1M AGO" read as log output -- cramped, hard to scan, and shouting
   the least important line on the card. Sentence case in the body face at a
   legible size says the same thing and gets out of the way. */
.doc-flag {
  font-family: var(--font); font-size: 10.5px; font-weight: 600;
  letter-spacing: .1px; padding: 3px 9px; border-radius: 999px;
  border: 1px solid var(--bd); color: var(--txm); white-space: nowrap;
}
.doc-flag.ok   { color: var(--grn); border-color: color-mix(in srgb, var(--grn) 40%, transparent); }
.doc-flag.miss { color: var(--red); border-color: color-mix(in srgb, var(--red) 45%, transparent); }
.doc-note { color: var(--txd); font-size: 11.5px; line-height: 1.55; margin-top: 7px; }
/* The actionable line. Says the file, the key and both selectors, because the
   fix is a reorder and a reorder needs to name what moves and what it moves
   above. */
.doc-fix {
  margin-top: 8px; padding: 9px 11px; border-radius: 8px;
  background: color-mix(in srgb, var(--red) 8%, var(--s2));
  border: 1px solid color-mix(in srgb, var(--red) 30%, transparent);
  color: var(--txd); font-size: 11.5px; line-height: 1.7;
}
.doc-fix.warn {
  background: color-mix(in srgb, var(--amber) 8%, var(--s2));
  border-color: color-mix(in srgb, var(--amber) 30%, transparent);
}
.doc-fix b { color: var(--tx); font-family: var(--font-mono); font-size: 11px; }
.doc-fix code {
  background: var(--bg); color: var(--acl); padding: 1px 5px; border-radius: 3px;
  font-size: 10.5px; word-break: break-all;
}
/* A usage limit: amber, not red. Nothing is broken; there is a wait. */
.doc-fix.doc-limit {
  background: color-mix(in srgb, var(--amber) 9%, var(--s2));
  border-color: color-mix(in srgb, var(--amber) 38%, transparent);
}
.doc-limit b { color: var(--amber); font-family: var(--font); font-size: 11.5px; }
.doc-limit-said { color: var(--tx); overflow-wrap: anywhere; }
.doc-limit-when { margin-top: 3px; color: var(--txm); }

.doc-recent { margin-top: 10px; border-top: 1px solid var(--bdl); padding-top: 8px; }
.doc-recent-hd {
  font-size: 10px; font-weight: 700; letter-spacing: .9px; text-transform: uppercase;
  color: var(--txm); margin-bottom: 4px;
}
.doc-recent-row { padding: 6px 0; border-bottom: 1px dashed var(--bdl); }
.doc-recent-row:last-child { border-bottom: 0; }
.doc-recent-top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; font-size: 11.5px; }
.doc-recent-kind { color: var(--amber); font-weight: 700; }
.doc-recent-at { color: var(--txm); }
.doc-recent-state { margin-left: auto; color: var(--txd); font-size: 10.5px; }
.doc-recent-row.cleared .doc-recent-kind { color: var(--txm); }
.doc-recent-row.cleared .doc-recent-state { color: var(--grn); }
.doc-recent-detail {
  color: var(--txd); font-size: 11px; line-height: 1.5; margin-top: 2px;
  overflow-wrap: anywhere;
}
.doc-recent-row.cleared .doc-recent-detail { opacity: .7; }

.doc-details { margin-top: 10px; }
.doc-details summary {
  cursor: pointer; color: var(--txm); font-size: 10.5px;
  letter-spacing: .4px; padding: 3px 0;
}
.doc-details summary:hover { color: var(--ac); }
/* Selectors are long strings; they scroll sideways in their own box rather
   than widening the page. */
.doc-tablewrap { overflow-x: auto; overflow-y: hidden; margin-top: 6px; }

table.doctor { width: 100%; border-collapse: collapse; font-size: 11.5px; }
table.doctor th {
  text-align: left; color: var(--txm); font-size: 9px; font-weight: 700;
  letter-spacing: 1.4px;
  padding: 6px 12px; border-bottom: 1px solid var(--bd);
}
table.doctor td { padding: 5px 12px; border-bottom: 1px solid var(--bd); color: var(--txd); }
table.doctor td.ok    { color: var(--grn); }
table.doctor td.stale { color: var(--amber); }
table.doctor td.miss  { color: var(--red); }
/* Fields that could not have matched in this page state. Deliberately the
   dimmest row in the table: they are normal, and colouring them like faults
   is what made a working install read as broken. */
table.doctor td.na    { color: var(--txm); opacity: .65; }
table.doctor code { color: var(--txd); font-size: 11px; }

.empty-state {
  color: color-mix(in srgb, var(--txm) 68%, transparent);
  text-align: center; padding: 36px 20px; font-size: 12px; letter-spacing: .4px;
}
.spin { display: inline-flex; align-items: center; }
.spin-svg { animation: spin .9s linear infinite; transform-origin: 50% 50%; }
@keyframes spin { to { transform: rotate(360deg) } }


   the content area, as one full-width panel. Same hard-edged block language
   as .node and .verdict (2px radius, coloured left accent) so it reads as
   part of this console rather than a pasted-in widget. */
/* The header is a neutral graphite bar for every card. It was tinted with
   each card's accent (8% gold for Report, amber for Quiz...), which on this
   palette read as a muddy yellow rather than as a colour. The accent now lives
   only in the icon chip, where it identifies the card without staining it. */
.studio-view {
  background: var(--s1);
  border: 1px solid var(--bd);
  border-radius: var(--r-card);
  margin-bottom: 14px;
  /* clip, not hidden: hidden makes this a scroll container, and the Report's
     sticky contents rail would then stick to a box that never scrolls. */
  overflow: hidden;
  overflow: clip;
  animation: rise .3s ease-out;
}
.studio-view-hd {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 12px 10px 14px; border-bottom: 1px solid var(--bd);
  background: var(--s2);
}
.studio-view-ic {
  display: inline-flex; align-items: center; justify-content: center;
  width: 26px; height: 26px; border-radius: 7px; flex-shrink: 0; font-size: 14px;
  color: var(--sa, var(--ac));
  background: color-mix(in srgb, var(--sa, var(--ac)) 13%, transparent);
}
.studio-view-title {
  font-size: 11px; font-weight: 700; letter-spacing: 2.2px;
  text-transform: uppercase; color: var(--tx);
}
.studio-view-status { color: var(--txm); font-size: 11px; letter-spacing: .3px; }
.studio-view-sp { flex: 1 1 auto; }
/* The shared copy button, restated as a Studio pill when it sits in a card's
   toolbar, so a row of actions is one family rather than two. */
.st-bar .copybtn, .au-opts .copybtn {
  height: 30px; padding: 0 12px; border-radius: 999px; gap: 6px;
  background: var(--s2); border: 1px solid var(--bd); color: var(--txd);
  font-family: var(--font); font-size: 11.5px; font-weight: 500;
  letter-spacing: 0; text-transform: none;
}
.st-bar .copybtn:hover, .au-opts .copybtn:hover { background: var(--s3); color: var(--tx); border-color: var(--bd); }
.st-bar .copybtn.done, .au-opts .copybtn.done { color: var(--grn); }
/* A forward button reads with its arrow AFTER the label. */
.st-btn.ic-end { flex-direction: row-reverse; }
/* The slide stage never outgrows the screen it is on. */
.sd { max-width: min(1100px, calc((100vh - 290px) * 16 / 9)); min-width: min(100%, 560px); }
.studio-view-body { padding: 18px 20px 22px; }

.studio-regen {
  margin-top: 10px; background: transparent; color: var(--txm); border: 1px solid var(--bd);
  border-radius: 4px; padding: 4px 10px; font-family: inherit; font-size: 10px;
  letter-spacing: .5px; text-transform: uppercase; cursor: pointer; transition: all .15s;
}
.studio-regen:hover { border-color: var(--ac); color: var(--ac); }

.studio-raw {
  white-space: pre-wrap; word-break: break-word; font-size: 11.5px;
  color: var(--txd); margin: 8px 0 0; max-height: 300px; overflow-y: auto;
}

/* ── shared Studio chrome ─────────────────────────────────────────────────
   Every card opens with the same toolbar (what it is, then its actions) and
   uses the same pill buttons, so seven formats read as one tool. */
.st-bar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  margin-bottom: 14px;
}
.st-bar-end { justify-content: flex-end; }
.st-meta {
  display: inline-flex; align-items: center; gap: 8px;
  color: var(--txm); font-size: 11.5px; letter-spacing: .2px; margin-right: auto;
}
.st-dot { width: 3px; height: 3px; border-radius: 50%; background: var(--txm); opacity: .6; }
.st-good { color: var(--grn); }
.st-grow { flex: 1 1 auto; }
.st-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.st-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 30px; padding: 0 12px; border-radius: 999px;
  background: var(--s2); border: 1px solid var(--bd); color: var(--txd);
  font-size: 11.5px; font-weight: 500; white-space: nowrap;
  transition: background .15s, color .15s, border-color .15s, transform .1s;
}
.st-btn:hover:not(:disabled) { background: var(--s3); color: var(--tx); }
.st-btn:active:not(:disabled) { transform: scale(.97); }
.st-btn:disabled { opacity: .35; cursor: not-allowed; }
.st-btn-ic { display: inline-flex; font-size: 13px; }
.st-btn.primary { background: var(--ac); border-color: var(--ac); color: #1a1a1d; font-weight: 600; }
.st-btn.primary:hover:not(:disabled) { background: var(--acl); color: #1a1a1d; }
.st-btn.round { width: 36px; height: 36px; padding: 0; }
.st-btn.round .st-btn-ic { font-size: 16px; }
.st-bar .copybtn { margin: 0; }
.st-track { height: 3px; border-radius: 3px; background: var(--s2); overflow: hidden; margin-bottom: 16px; }
.st-track-fill { height: 100%; background: var(--ac); border-radius: 3px; transition: width .35s ease; }
.st-keys { text-align: center; color: var(--txm); font-size: 10.5px; letter-spacing: .3px; margin-top: 12px; opacity: .8; }
@media (hover: none) { .st-keys { display: none; } }
.st-report .st-bar { margin-bottom: 8px; }

/* ── Data Table card ── */
.st-search {
  height: 30px; min-width: 0; width: 200px; padding: 0 12px;
  background: var(--s2); border: 1px solid var(--bd); border-radius: 999px;
  color: var(--tx); font-size: 12px; outline: none;
}
.st-search:focus { border-color: var(--acd); }
.st-tbl-wrap {
  border: 1px solid var(--bd); border-radius: var(--r-card);
  overflow-x: auto; background: var(--bg);
}
.st-tbl { width: 100%; border-collapse: collapse; font-size: 13px; line-height: 1.5; }
.st-tbl thead th {
  position: sticky; top: 0; z-index: 1;
  background: var(--s2); text-align: left; padding: 0;
  border-bottom: 1px solid var(--bdl);
}
.st-th {
  display: flex; align-items: center; gap: 6px; width: 100%;
  padding: 11px 14px; background: none; border: 0; text-align: left;
  color: var(--txd); font-family: var(--font-display);
  font-size: 11px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase;
}
.st-th:hover { color: var(--tx); }
.st-sort { display: inline-flex; font-size: 12px; opacity: 0; transition: opacity .15s, transform .15s; }
.st-th:hover .st-sort, th.sorted .st-sort { opacity: 1; }
th.sorted .st-th { color: var(--acl); }
th.sorted.desc .st-sort { transform: scaleY(-1); }
.st-tbl td {
  padding: 11px 14px; vertical-align: top; color: var(--txd);
  border-bottom: 1px solid var(--bd);
}
.st-tbl tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--s1) 55%, transparent); }
.st-tbl tbody tr:hover td { background: var(--s1); }
.st-tbl tbody tr:last-child td { border-bottom: 0; }
.st-tbl td:first-child { color: var(--tx); font-weight: 600; }
.st-tbl td strong { color: var(--tx); font-weight: 600; }
.st-tbl tr.st-empty td { text-align: center; color: var(--txm); font-weight: 400; padding: 24px; }
.st-table > .md { margin-top: 12px; color: var(--txm); font-size: 12px; }

/* ── Flashcards card ── */
.fc { max-width: 760px; margin: 0 auto; }
.fc-stage { perspective: 1600px; }
.fc-card {
  display: block; width: 100%; padding: 0; border: 0; background: none;
  text-align: left; color: inherit; perspective: 1600px;
}
.fc-inner {
  display: grid; position: relative;
  transform-style: preserve-3d;
  transition: transform .55s cubic-bezier(.3, .7, .2, 1);
}
.fc-card.flipped .fc-inner { transform: rotateY(180deg); }
.fc-face {
  grid-area: 1 / 1; display: flex; flex-direction: column;
  min-height: clamp(240px, 38vh, 340px); padding: 20px 26px 18px;
  border-radius: 14px; border: 1px solid var(--bdl);
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  box-shadow: 0 10px 30px -12px var(--shadow);
}
.fc-front { background: linear-gradient(160deg, var(--s2), var(--s1)); }
.fc-back {
  background: linear-gradient(160deg, color-mix(in srgb, var(--ac) 12%, var(--s2)), var(--s1));
  border-color: color-mix(in srgb, var(--ac) 35%, var(--bdl));
  transform: rotateY(180deg);
}
.fc-face-hd { display: flex; justify-content: space-between; align-items: center; }
.fc-tag {
  font-family: var(--font-display); font-size: 10px; font-weight: 700;
  letter-spacing: 1.6px; text-transform: uppercase; color: var(--txm);
}
.fc-back .fc-tag { color: var(--acl); }
.fc-num { font-family: var(--font-mono); font-size: 10.5px; color: var(--txm); }
.fc-text { margin: auto 0; padding: 14px 0; }
.fc-text-front {
  font-family: var(--font-display); font-size: clamp(19px, 2.4vw, 26px);
  font-weight: 700; line-height: 1.3; color: var(--tx); text-align: center;
  text-wrap: balance;
}
.fc-text-back { font-size: 15.5px; line-height: 1.65; color: var(--tx); text-align: center; text-wrap: pretty; }
.fc-text-back.long { font-size: 14px; text-align: left; }
.fc-back-q { font-size: 11.5px; color: var(--txm); margin-top: 6px; text-align: center;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fc-hint { text-align: center; font-size: 10.5px; color: var(--txm); letter-spacing: .4px; }
.fc-card.known .fc-front { border-color: color-mix(in srgb, var(--grn) 40%, var(--bdl)); }
.fc-card.in-next { animation: fcInNext .32s ease-out; }
.fc-card.in-prev { animation: fcInPrev .32s ease-out; }
@keyframes fcInNext { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
@keyframes fcInPrev { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
.fc-ctl { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 18px; }
.fc-ctl .st-btn:not(.round) { height: 38px; padding: 0 18px; font-size: 12.5px; }
.fc-learn:hover:not(:disabled) { color: var(--red); border-color: color-mix(in srgb, var(--red) 45%, transparent); }
.fc-know { color: var(--grn); border-color: color-mix(in srgb, var(--grn) 35%, transparent); }
.fc-know:hover:not(:disabled) { color: var(--grn); background: color-mix(in srgb, var(--grn) 12%, var(--s2)); }
.fc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.fc-mini .fc-face { min-height: 190px; padding: 14px 16px; border-radius: 12px; }
.fc-mini .fc-text-front { font-size: 16px; }
.fc-mini .fc-text-back, .fc-mini .fc-text-back.long { font-size: 13px; text-align: left; }
.fc-mini .fc-hint, .fc-mini .fc-back-q { display: none; }
.fc-done {
  display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px;
  padding: 44px 20px; border: 1px solid var(--bdl); border-radius: 14px;
  background: linear-gradient(160deg, var(--s2), var(--s1));
}
.fc-done-ic {
  display: inline-flex; align-items: center; justify-content: center;
  width: 46px; height: 46px; border-radius: 50%; font-size: 22px; margin-bottom: 6px;
  color: var(--grn); background: color-mix(in srgb, var(--grn) 14%, transparent);
}
.fc-done-title { font-family: var(--font-display); font-size: 20px; font-weight: 700; color: var(--tx); }
.fc-done-sub { color: var(--txd); font-size: 13px; }
.fc-done-acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 14px; }
.fc-done-acts .st-btn { height: 36px; padding: 0 16px; }

/* ── Quiz card ── */
.qz { max-width: 760px; margin: 0 auto; }
.qz-segs { display: flex; gap: 4px; margin-bottom: 16px; }
.qz-seg {
  flex: 1; height: 6px; padding: 0; border: 0; border-radius: 3px;
  background: var(--s3); transition: background .2s, box-shadow .2s;
}
.qz-seg.ok { background: var(--grn); }
.qz-seg.bad { background: var(--red); }
.qz-seg.cur { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--ac); }
.qz-card {
  padding: 22px 24px; border-radius: 14px; border: 1px solid var(--bdl);
  background: linear-gradient(160deg, var(--s2), var(--s1));
}
.qz-kicker {
  font-family: var(--font-display); font-size: 10px; font-weight: 700;
  letter-spacing: 1.6px; text-transform: uppercase; color: var(--acl); margin-bottom: 8px;
}
.qz-q {
  font-family: var(--font-display); font-size: 18px; font-weight: 700;
  line-height: 1.4; color: var(--tx); margin-bottom: 18px; text-wrap: pretty;
}
.qz-opts { display: flex; flex-direction: column; gap: 8px; }
.qz-opt {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  padding: 12px 14px; border-radius: 10px; border: 1px solid var(--bdl);
  background: var(--bg); color: var(--txd); font-size: 13.5px; line-height: 1.5;
  transition: border-color .15s, background .15s, color .15s, opacity .2s;
}
.qz-opt:hover:not(:disabled) { border-color: var(--acd); color: var(--tx); background: var(--s1); }
.qz-opt:disabled { cursor: default; }
.qz-letter {
  flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center;
  width: 26px; height: 26px; border-radius: 50%;
  font-family: var(--font-mono); font-size: 11.5px; font-weight: 600;
  background: var(--s3); color: var(--acl); transition: background .15s, color .15s;
}
.qz-opt-txt { flex: 1 1 auto; min-width: 0; }
.qz-mark { flex: 0 0 auto; display: inline-flex; font-size: 17px; }
.qz-opt.correct { border-color: color-mix(in srgb, var(--grn) 60%, transparent); background: color-mix(in srgb, var(--grn) 10%, var(--bg)); color: var(--tx); }
.qz-opt.correct .qz-letter { background: var(--grn); color: #1a1a1d; }
.qz-opt.correct .qz-mark { color: var(--grn); }
.qz-opt.wrong { border-color: color-mix(in srgb, var(--red) 60%, transparent); background: color-mix(in srgb, var(--red) 10%, var(--bg)); color: var(--tx); }
.qz-opt.wrong .qz-letter { background: var(--red); color: #1a1a1d; }
.qz-opt.wrong .qz-mark { color: var(--red); }
.qz-opt.dim { opacity: .5; }
.qz-fb {
  margin-top: 14px; padding: 12px 14px; border-radius: 10px;
  border: 1px solid var(--bd); animation: rise .25s ease-out;
}
.qz-fb.ok { background: color-mix(in srgb, var(--grn) 8%, transparent); border-color: color-mix(in srgb, var(--grn) 30%, transparent); }
.qz-fb.bad { background: color-mix(in srgb, var(--red) 8%, transparent); border-color: color-mix(in srgb, var(--red) 30%, transparent); }
.qz-fb-hd { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; }
.qz-fb.ok .qz-fb-hd { color: var(--grn); }
.qz-fb.bad .qz-fb-hd { color: var(--red); }
.qz-fb-ic { display: inline-flex; font-size: 15px; }
.qz-why { margin-top: 6px; color: var(--txd); font-size: 13px; line-height: 1.6; }
.qz-nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 16px; }
.qz-nav .st-btn { height: 38px; padding: 0 18px; font-size: 12.5px; }
.qz-results {
  padding: 24px; border-radius: 14px; border: 1px solid var(--bdl);
  background: linear-gradient(160deg, var(--s2), var(--s1));
}
.qz-res-hd { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; }
.qz-ring { position: relative; width: 96px; height: 96px; flex: 0 0 auto; }
.qz-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.qz-ring circle { fill: none; stroke-width: 8; }
.qz-ring-bg { stroke: var(--s3); }
.qz-ring-fg { stroke: var(--ac); stroke-linecap: round; transition: stroke-dashoffset .8s ease; }
.qz-ring-num {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-size: 21px; font-weight: 800; color: var(--tx);
}
.qz-res-title { font-family: var(--font-display); font-size: 20px; font-weight: 700; color: var(--tx); }
.qz-res-sub { color: var(--txd); font-size: 13px; margin-top: 2px; }
.qz-review { display: flex; flex-direction: column; gap: 6px; }
.qz-rv {
  display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left;
  padding: 10px 12px; border-radius: 10px; border: 1px solid var(--bd);
  background: var(--bg); color: var(--txd); transition: border-color .15s, background .15s;
}
.qz-rv:hover { border-color: var(--bdl); background: var(--s1); }
.qz-rv-ic {
  flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 50%; font-size: 13px; margin-top: 1px;
  background: var(--s3); color: var(--txm);
}
.qz-rv.ok .qz-rv-ic { background: color-mix(in srgb, var(--grn) 18%, transparent); color: var(--grn); }
.qz-rv.bad .qz-rv-ic { background: color-mix(in srgb, var(--red) 18%, transparent); color: var(--red); }
.qz-rv-body { min-width: 0; }
.qz-rv-q { color: var(--tx); font-size: 13px; line-height: 1.45; }
.qz-rv-a { color: var(--txm); font-size: 11.5px; margin-top: 2px; font-family: var(--font-mono); }

/* ── Mind Map card ── */
.mindmap { position: relative; display: flex; align-items: center; gap: 34px; padding: 14px 6px; overflow-x: auto; }
.mm-links { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: visible; }
.mm-link { stroke: var(--bdl); stroke-width: 1.4; fill: none; }
.mm-root {
  position: relative; z-index: 1; flex-shrink: 0;
  background: color-mix(in srgb, var(--ac) 16%, var(--s2)); border: 1px solid var(--ac);
  border-radius: 10px; padding: 11px 15px; font-family: var(--font-display);
  font-size: 13px; font-weight: 700; color: var(--tx); max-width: 180px;
}
.mm-branches { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 12px; }
.mm-col { display: flex; align-items: center; gap: 26px; }
.mm-node {
  background: var(--s2); border: 1px solid var(--bdl); border-radius: 8px;
  padding: 7px 11px; font-size: 12px; color: var(--txd); max-width: 190px; white-space: normal;
}
.mm-branches > .mm-col > .mm-node { color: var(--tx); font-weight: 600; }
.mm-children { display: flex; flex-direction: column; gap: 8px; }

/* ── Slide Deck card ──
   A slide is laid out in container units (cqw), so the stage, the filmstrip
   and the presenter overlay all draw the SAME slide at different sizes. */
.sd { max-width: 1100px; margin: 0 auto; }
.sd-slide { container-type: inline-size; width: 100%; }
.sd-inner {
  position: relative; aspect-ratio: 16 / 9; overflow: hidden;
  display: flex; flex-direction: column;
  padding: 4.2cqw 5.2cqw 3.4cqw;
  border-radius: 1.4cqw; border: 1px solid var(--bdl);
  background:
    radial-gradient(120% 90% at 100% 0%, color-mix(in srgb, var(--ac) 14%, transparent), transparent 60%),
    linear-gradient(160deg, #2a2a30, #1d1d21);
  color: var(--tx);
}
.sd-inner::before {
  content: ""; position: absolute; left: 5.2cqw; top: 0; width: 7cqw; height: .5cqw;
  background: var(--ac); border-radius: 0 0 .4cqw .4cqw;
}
.sd-top { display: flex; justify-content: space-between; align-items: center; }
.sd-brand {
  font-family: var(--font-display); font-weight: 800; letter-spacing: .5cqw;
  font-size: 1.25cqw; color: var(--acl); opacity: .8;
}
.sd-no { font-family: var(--font-mono); font-size: 1.3cqw; color: var(--txm); }
.sd-body { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; min-height: 0; }
.sd-title {
  font-family: var(--font-display); font-weight: 800; font-size: 4.1cqw;
  line-height: 1.15; letter-spacing: -.05cqw; color: var(--tx); text-wrap: balance;
  margin-bottom: 2.6cqw;
}
.sd-bullets { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1.5cqw; }
.sd-bullets li {
  position: relative; padding-left: 2.8cqw;
  font-size: 2.15cqw; line-height: 1.45; color: var(--txd); text-wrap: pretty;
}
.sd-bullets li::before {
  content: ""; position: absolute; left: 0; top: .72em;
  width: 1.1cqw; height: 1.1cqw; margin-top: -.55cqw; border-radius: 50%;
  background: var(--ac); opacity: .9;
}
.sd-bullets li strong { color: var(--tx); }
.sd-foot {
  display: flex; justify-content: space-between; font-size: 1.2cqw;
  color: var(--txm); letter-spacing: .15cqw; text-transform: uppercase;
}
/* title slide: centred, larger */
.sd-inner.is-title .sd-body { align-items: center; text-align: center; }
.sd-inner.is-title .sd-title { font-size: 5.2cqw; }
.sd-inner.is-title .sd-bullets { align-items: center; }
.sd-inner.is-title .sd-bullets li { padding-left: 0; color: var(--txd); font-size: 2cqw; }
.sd-inner.is-title .sd-bullets li::before { display: none; }
.sd-inner.is-title::before { left: 50%; transform: translateX(-50%); }
/* closing slide: accent wash */
.sd-inner.is-end {
  background:
    radial-gradient(110% 110% at 0% 100%, color-mix(in srgb, var(--ac) 22%, transparent), transparent 65%),
    linear-gradient(160deg, #2a2a30, #1d1d21);
}
/* Narrow screens: a 16:9 slide 340px wide is 8px text. The main slide gives
   up the aspect ratio and takes readable fixed sizes instead; thumbnails keep
   theirs, since they are pictures of slides rather than something to read. */
@container (max-width: 560px) {
  .sd-slide:not(.sd-mini) > .sd-inner {
    aspect-ratio: auto; min-height: 72cqw; padding: 22px 20px 16px; border-radius: 12px;
  }
  .sd-slide:not(.sd-mini) > .sd-inner::before { left: 20px; width: 36px; height: 3px; }
  .sd-slide:not(.sd-mini) > .sd-inner.is-title::before { left: 50%; }
  .sd-slide:not(.sd-mini) .sd-brand { font-size: 9px; letter-spacing: 2px; }
  .sd-slide:not(.sd-mini) .sd-no, .sd-slide:not(.sd-mini) .sd-foot { font-size: 10px; letter-spacing: .5px; }
  .sd-slide:not(.sd-mini) .sd-body { padding: 16px 0; }
  .sd-slide:not(.sd-mini) .sd-title { font-size: 21px; margin-bottom: 14px; }
  .sd-slide:not(.sd-mini) .is-title .sd-title { font-size: 24px; }
  .sd-slide:not(.sd-mini) .sd-bullets { gap: 10px; }
  .sd-slide:not(.sd-mini) .sd-bullets li { font-size: 14.5px; padding-left: 18px; }
  .sd-slide:not(.sd-mini) .is-title .sd-bullets li { font-size: 13.5px; padding-left: 0; }
  .sd-slide:not(.sd-mini) .sd-bullets li::before { width: 6px; height: 6px; margin-top: -3px; }
}
.sd-stage { position: relative; border-radius: 12px; box-shadow: 0 18px 40px -18px var(--shadow); }
.sd-stage.in-next { animation: fcInNext .3s ease-out; }
.sd-stage.in-prev { animation: fcInPrev .3s ease-out; }
.sd-zone {
  position: absolute; top: 0; bottom: 0; width: 22%; z-index: 2;
  display: flex; align-items: center; padding: 0 14px;
  background: none; border: 0; color: var(--tx); opacity: 0; transition: opacity .2s;
}
.sd-zone-l { left: 0; justify-content: flex-start; }
.sd-zone-r { right: 0; justify-content: flex-end; }
.sd-zone-ic {
  display: inline-flex; align-items: center; justify-content: center;
  width: 38px; height: 38px; border-radius: 50%; font-size: 18px;
  background: rgba(20, 20, 23, .7); border: 1px solid var(--bdl);
}
.sd-stage:hover .sd-zone { opacity: 1; }
@media (hover: none) { .sd-zone { opacity: 0 !important; } }
.sd-nav { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 14px; }
.sd-dots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.sd-dot {
  width: 7px; height: 7px; padding: 0; border: 0; border-radius: 4px;
  background: var(--s3); transition: width .25s, background .25s;
}
.sd-dot.on { width: 22px; background: var(--ac); }
.sd-count { font-family: var(--font-mono); font-size: 11px; color: var(--txm); min-width: 42px; text-align: center; }
.sd-strip {
  display: flex; gap: 10px; overflow-x: auto; padding: 14px 2px 4px; margin-top: 4px;
  scroll-snap-type: x proximity;
}
.sd-thumb {
  flex: 0 0 150px; padding: 0; border: 0; background: none; border-radius: 6px;
  opacity: .55; transition: opacity .2s, transform .2s; scroll-snap-align: center;
}
.sd-thumb:hover { opacity: .85; }
.sd-thumb.active { opacity: 1; }
.sd-thumb.active .sd-inner { border-color: var(--ac); box-shadow: 0 0 0 1px var(--ac); }
.sd-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.sd-grid .sd-thumb { flex: none; opacity: 1; }
.sd-grid .sd-thumb:hover { transform: translateY(-2px); }
/* presenting: fills the screen (true fullscreen where the platform allows) */
body.sd-presenting { overflow: hidden; }
.sd-present {
  position: fixed; inset: 0; z-index: 10000; background: #0e0e10;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  animation: rise .2s ease-out;
}
.sd-present-stage { width: min(100%, calc((100vh - 110px) * 16 / 9)); cursor: pointer; }
.sd-present-stage .sd-inner { box-shadow: 0 30px 80px -30px #000; }
.sd-present-hud { display: flex; align-items: center; gap: 12px; margin-top: 18px; }
.sd-present-count { font-family: var(--font-mono); font-size: 12px; color: var(--txm); min-width: 52px; text-align: center; }

/* ── Audio Overview card ── */
.au { max-width: 860px; margin: 0 auto; }
.au-player {
  padding: 20px 22px 16px; border-radius: 16px; border: 1px solid var(--bdl);
  background:
    radial-gradient(90% 120% at 50% 0%, color-mix(in srgb, var(--ac) 12%, transparent), transparent 70%),
    linear-gradient(160deg, var(--s2), var(--s1));
}
.au-hosts { display: flex; justify-content: space-between; gap: 12px; }
.au-host { display: flex; align-items: center; gap: 10px; min-width: 0; }
.au-host.host-b { flex-direction: row-reverse; text-align: right; }
.au-avatar {
  position: relative; flex: 0 0 auto; width: 40px; height: 40px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-weight: 800; font-size: 14px; color: #1a1a1d;
  transition: box-shadow .3s;
}
.host-a .au-avatar { background: var(--ac); }
.host-b .au-avatar { background: var(--blue); }
.au-host.talking.host-a .au-avatar { box-shadow: 0 0 0 4px color-mix(in srgb, var(--ac) 30%, transparent), 0 0 24px color-mix(in srgb, var(--ac) 45%, transparent); }
.au-host.talking.host-b .au-avatar { box-shadow: 0 0 0 4px color-mix(in srgb, var(--blue) 30%, transparent), 0 0 24px color-mix(in srgb, var(--blue) 45%, transparent); }
.au-host-meta { min-width: 0; }
.au-host-name { font-family: var(--font-display); font-weight: 700; font-size: 13px; color: var(--tx); }
.au-host-voice { font-size: 11px; color: var(--txm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
.au-eq { display: flex; align-items: flex-end; gap: 2px; height: 16px; opacity: 0; transition: opacity .2s; }
.au-eq i { display: block; width: 3px; height: 30%; border-radius: 2px; }
.host-a .au-eq i { background: var(--ac); }
.host-b .au-eq i { background: var(--blue); }
.au-host.talking .au-eq { opacity: 1; }
.au-host.talking .au-eq i { animation: auEq .9s ease-in-out infinite; }
.au-eq i:nth-child(2) { animation-delay: -.3s !important; }
.au-eq i:nth-child(3) { animation-delay: -.6s !important; }
.au-eq i:nth-child(4) { animation-delay: -.15s !important; }
@keyframes auEq { 0%, 100% { height: 25%; } 50% { height: 100%; } }
.au-main { display: flex; align-items: center; justify-content: center; gap: 18px; margin: 10px 0 14px; }
.au-play {
  width: 60px; height: 60px; border-radius: 50%; border: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--ac); color: #1a1a1d; font-size: 22px;
  box-shadow: 0 8px 24px -8px color-mix(in srgb, var(--ac) 70%, transparent);
  transition: transform .12s, background .15s;
}
.au-play:hover:not(:disabled) { background: var(--acl); }
.au-play:active:not(:disabled) { transform: scale(.95); }
.au-play:disabled { opacity: .4; cursor: not-allowed; }
.au-play-ic { display: inline-flex; }
.au-play:not(.on) .au-play-ic { margin-left: 3px; }
.au-play .au-play-ic svg { fill: currentColor; }
.au-skip .st-btn-ic svg { fill: currentColor; }
.au-segs { display: flex; gap: 3px; height: 8px; }
.au-seg {
  min-width: 4px; padding: 0; border: 0; border-radius: 3px; height: 100%;
  background: var(--s3); transition: background .2s, transform .15s;
}
.au-seg:hover { transform: scaleY(1.5); }
.au-seg.done.host-a, .au-seg.cur.host-a { background: var(--ac); }
.au-seg.done.host-b, .au-seg.cur.host-b { background: var(--blue); }
.au-seg.done { opacity: .55; }
.au-seg.cur { animation: auPulse 1.4s ease-in-out infinite; }
@keyframes auPulse { 50% { opacity: .55; } }
.au-times { display: flex; justify-content: space-between; margin-top: 6px;
  font-family: var(--font-mono); font-size: 10.5px; color: var(--txm); }
.au-opts { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.au-speeds { display: inline-flex; padding: 3px; gap: 2px; border-radius: 999px; background: var(--bg); border: 1px solid var(--bd); }
.au-speed {
  height: 24px; padding: 0 9px; border: 0; border-radius: 999px; background: none;
  color: var(--txm); font-family: var(--font-mono); font-size: 11px;
}
.au-speed:hover { color: var(--tx); }
.au-speed.on { background: var(--s3); color: var(--tx); }
.au-opts .copybtn { margin: 0; }
.au-vpanel {
  margin-top: 12px; padding: 12px; border-radius: 10px; background: var(--bg);
  border: 1px solid var(--bd); display: flex; flex-direction: column; gap: 8px;
}
.au-vrow { display: flex; align-items: center; gap: 10px; }
.au-vtag { flex: 0 0 60px; font-size: 11.5px; font-weight: 600; }
.au-vtag.host-a { color: var(--ac); }
.au-vtag.host-b { color: var(--blue); }
.au-vsel {
  flex: 1 1 auto; min-width: 0; height: 32px; padding: 0 10px; border-radius: 8px;
  background: var(--s2); border: 1px solid var(--bdl); color: var(--tx); font-size: 12px;
}
.au-vpanel .st-btn { align-self: flex-start; }
.au-vnote { font-size: 11px; color: var(--txm); line-height: 1.5; }
.au-note { color: var(--txm); font-size: 11.5px; text-align: center; margin: 10px 0 0; }
.au-note:empty { display: none; }
.au-transcript { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
.au-line {
  display: block; width: fit-content; max-width: min(640px, 86%); text-align: left;
  padding: 11px 14px; border-radius: 14px; border: 1px solid var(--bd);
  background: var(--s1); color: var(--txd);
  transition: background .2s, border-color .2s, color .2s, opacity .2s;
}
.au-line.host-a { border-top-left-radius: 4px; }
.au-line.host-b { align-self: flex-end; border-top-right-radius: 4px; }
.au-line:hover { border-color: var(--bdl); }
.au-line-hd { display: flex; align-items: center; gap: 7px; margin-bottom: 3px; }
.au-line-dot { width: 7px; height: 7px; border-radius: 50%; }
.host-a .au-line-dot { background: var(--ac); }
.host-b .au-line-dot { background: var(--blue); }
.au-line-name { font-family: var(--font-display); font-size: 11px; font-weight: 700; letter-spacing: .4px; color: var(--tx); }
.au-line-time { font-family: var(--font-mono); font-size: 10px; color: var(--txm); margin-left: auto; padding-left: 12px; }
.au-line-txt { font-size: 13.5px; line-height: 1.6; }
.au-line.current { color: var(--tx); }
.au-line.current.host-a { border-color: color-mix(in srgb, var(--ac) 45%, transparent); background: color-mix(in srgb, var(--ac) 9%, var(--s1)); }
.au-line.current.host-b { border-color: color-mix(in srgb, var(--blue) 45%, transparent); background: color-mix(in srgb, var(--blue) 9%, var(--s1)); }
.au.playing .au-line.past { opacity: .6; }

@media (max-width: 760px) {
  .st-bar { gap: 6px; }
  .st-meta { flex: 1 1 100%; }
  .st-search { flex: 1 1 100%; width: auto; order: 5; height: 38px; }
  .st-btn { height: 36px; }
  .st-btn.round { width: 44px; height: 44px; }
  /* Data table: every row becomes a card, each cell labelled with its column,
     rather than a table the phone has to scroll sideways through. */
  .st-tbl-wrap { border: 0; background: none; overflow: visible; }
  .st-tbl, .st-tbl tbody, .st-tbl tr, .st-tbl td { display: block; width: 100%; }
  .st-tbl thead { display: none; }
  .st-tbl tbody { display: flex; flex-direction: column; gap: 10px; }
  .st-tbl tbody tr { border: 1px solid var(--bdl); border-radius: 12px; overflow: hidden; background: var(--s1); }
  .st-tbl tbody tr td, .st-tbl tbody tr:nth-child(even) td, .st-tbl tbody tr:hover td { background: none; }
  .st-tbl td { padding: 9px 14px; border-bottom: 1px solid var(--bd); }
  .st-tbl td::before {
    content: attr(data-label); display: block; margin-bottom: 2px;
    font-family: var(--font-display); font-size: 10px; font-weight: 700;
    letter-spacing: .8px; text-transform: uppercase; color: var(--txm);
  }
  .st-tbl td:first-child { background: var(--s2) !important; font-size: 14px; }
  .st-tbl tr td:last-child { border-bottom: 0; }
  .st-tbl tr.st-empty { border-style: dashed; }
  .st-tbl tr.st-empty td::before { display: none; }

  .fc-face { padding: 16px 18px 14px; border-radius: 12px; min-height: 280px; }
  .fc-text-back, .fc-text-back.long { font-size: 14.5px; }
  .fc-ctl { gap: 8px; }
  .fc-ctl .st-btn:not(.round) { flex: 1 1 0; height: 44px; padding: 0 10px; }
  .fc-hint { font-size: 0; }
  .fc-hint::after { content: "Tap to flip · swipe to move"; font-size: 10.5px; }
  .fc-grid { grid-template-columns: 1fr; }

  .qz-card, .qz-results { padding: 16px; border-radius: 12px; }
  .qz-q { font-size: 16.5px; }
  .qz-opt { padding: 12px; min-height: 52px; font-size: 14px; }
  .qz-nav .st-btn { flex: 1 1 0; height: 44px; }
  .qz-res-hd { gap: 14px; }
  .qz-ring { width: 78px; height: 78px; }

  .sd-nav { gap: 8px; }
  .sd-dots { display: none; }
  .sd-thumb { flex-basis: 112px; }
  .sd-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .sd-present { padding-left: 8px; padding-right: 8px; }
  .sd-present-stage { width: 100%; }

  .au-player { padding: 16px 14px 14px; border-radius: 14px; }
  .au-host-voice { max-width: 110px; }
  .au-eq { display: none; }
  .au-play { width: 64px; height: 64px; }
  .au-segs { height: 10px; }
  .au-speeds { order: 5; flex: 1 1 100%; justify-content: space-between; }
  .au-speed { flex: 1; height: 32px; }
  .au-line { max-width: 94%; }
}
@media (prefers-reduced-motion: reduce) {
  .fc-inner { transition: none; }
  .fc-card.in-next, .fc-card.in-prev, .sd-stage.in-next, .sd-stage.in-prev { animation: none; }
  .au-host.talking .au-eq i, .au-seg.cur { animation: none; }
}

/* ── brainstorm ───────────────────────────────────────────────────────────
   The planning session. Keyed to --gold rather than the council's --ac so a
   glance at the screen says which mode is running: the two look similar by
   design (same panels, same grid) and the accent is what tells them apart. */
.bs { display: flex; flex-direction: column; gap: 16px; margin-bottom: 16px; }

.bs-hd { display: flex; flex-direction: column; gap: 4px; }
/* The exit sits with the heading, on the same centred measure as everything
   else in this panel. */
.bs-backbar {
  display: flex; width: 100%; max-width: 900px;
  margin-left: auto; margin-right: auto;
}
.bs-backbar .navitem { border: 1px solid var(--bd); border-radius: 8px; padding: 6px 12px; }
.bs-backbar .navitem:hover:not(:disabled) { border-color: var(--ac); }
/* Centred over the centred composer, and the blurb dimmed to match the
   council's idle hint -- it is context, not content. */
/* EVERY brainstorm heading, not only the start screen's. A round's title and
   topic sat hard against the left edge while the reply box they belong to was
   centred 900px away -- two halves of one screen laid out by different rules. */
.bs .bs-hd { align-items: center; text-align: center; max-width: 900px; margin: 0 auto; }
.bs .bs-sub { color: color-mix(in srgb, var(--txm) 78%, transparent); }
.bs-backbar { justify-content: center; }
/* Sits above the grid on the council view, on the same centred measure as the
   composer -- it belongs to the screen, not to the answers. */
.view-backbar { margin-bottom: 12px; }
/* Big enough to be a page title. At 11px with 2.2px of tracking it read as a
   label on the panel below it rather than as the name of the screen. */
.bs-title {
  font-family: var(--font-display);
  font-size: 15px; font-weight: 800; letter-spacing: 1.4px;
  text-transform: uppercase; color: var(--gold);
}
.council-title { color: var(--acl); }
.bs-sub { color: var(--txd); font-size: 12.5px; line-height: 1.55; }

/* The council's heading lives outside .bs, so it centres on its own. */
.view-hd {
  width: 100%; max-width: 900px; margin: 0 auto 12px;
  align-items: center; text-align: center;
}
.view-hd .bs-sub { color: color-mix(in srgb, var(--txm) 82%, transparent); }
/* Shown only above an EMPTY council composer -- once there are answers below,
   a title explaining what a deliberation is takes space from the thing you
   asked for -- and never on the brainstorm screen, which has its own. That is
   two conditions, so it is decided in syncCouncilIdle rather than in CSS;
   this pair just makes `hidden` win over the flex display. */
.view-hd { display: flex; }
.view-hd[hidden] { display: none; }
/* A hint with nothing in it should not hold 36px of padding open. */
.empty-state:empty { display: none; }

/* The brainstorm composer is the council composer: same centred column, same
   width, same units row underneath. They are the two ways of asking the same
   council a question, and there was no reason for one to be a centred card
   and the other a full-bleed bar. */
.bs-start, .bs-reply, .bs-plan-bar, .bs-round-hd {
  /* width: 100% is load-bearing. .bs is a flex COLUMN, and auto side margins
     on a flex item turn off the stretch that would otherwise fill the line --
     so the composer shrank to the width of its own buttons (299px) while
     claiming a 900px cap it never reached. Same fix .qbar needed. */
  width: 100%; max-width: 900px; margin-left: auto; margin-right: auto;
}
.bs-start { text-align: center; }
.bs-start .bs-topic { text-align: left; }
.bs-start .bs-note { text-align: center; }
.bs-start-bar { justify-content: center; }
/* Only while there is nothing below it, exactly as the council does -- and
   applied to the HEADING, which sits directly above the box: putting it on
   the box left the title stranded at the top of the page while the thing it
   labelled sat in the middle. */
.council-idle .bs:has(.bs-start) .bs-hd { margin-top: clamp(0px, calc(26vh - 170px), 190px); }
.bs:has(.bs-start) { gap: 12px; }
@media (max-width: 760px) {
  .council-idle .bs:has(.bs-start) .bs-hd { margin-top: 2vh; }
  .bs-start, .bs-reply, .bs-plan-bar, .bs-round-hd { max-width: none; }
}

/* The same card as the council's composer: same surface, same 16px radius,
   same focus ring. It was a hard-edged panel with a gold rule down its left
   side, which said "log entry" where the council's says "type here" -- and
   they are the same act. The gold stays on the heading, which is what
   actually distinguishes the two modes. */
.bs-start {
  position: relative;   /* the frame the corner grip is pinned to */
  background: var(--s2); border: 1px solid var(--bd);
  border-radius: 16px; padding: 10px 10px 8px;
  transition: border-color .15s, box-shadow .15s, background .15s;
}
/* The same cue the council's composer gives: the card itself lights up, so
   there is no doubt about where the file is going to land. */
.bs-start.drag {
  border-color: var(--ac); border-style: dashed;
  background: color-mix(in srgb, var(--ac) 6%, var(--s2));
}
.bs-start:focus-within {
  /* The council's accent, not brainstorm's gold. The gold belongs on the
     heading, which is what distinguishes the two modes; on the composer it
     made the same control look like a different one. */
  border-color: var(--ac);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--ac) 16%, transparent);
}
.bs-topic {
  /* Grows with what you type and stops at the same cap the council's does.
     It was a fixed 92px box with a drag handle in the corner: three empty
     lines before you have typed anything, and a control asking you to resize
     a box that should never have needed resizing. */
  width: 100%; min-height: 26px; max-height: 45vh; resize: none;
  background: transparent;
  border: 0; outline: 0; color: var(--tx); font-family: var(--font);
  font-size: 13px; line-height: 1.6; overflow-y: auto;
}
/* The global focus ring is `textarea:focus-visible`, which outranks a bare
   class -- so `.bs-topic { outline: 0 }` never applied and clicking into the
   box drew a purple rectangle INSIDE the purple ring the card already draws
   with :focus-within. Two rings for one focus. The card's is the right one;
   this selector is specific enough to win. */
textarea.bs-topic:focus, textarea.bs-topic:focus-visible { outline: none; }
.bs-topic::placeholder { color: color-mix(in srgb, var(--txm) 62%, transparent); }
.bs-topic:disabled { color: var(--txd); }
.bs-start-bar { display: flex; align-items: center; gap: 8px;
                padding: 8px 30px 0 0; }   /* right: the grip's seat */
.bs-note { color: var(--txm); font-size: 10px; letter-spacing: .5px; }

.bs-phase {
  display: flex; align-items: center; gap: 9px;
  color: var(--txd); font-size: 11px; letter-spacing: .5px;
  background: var(--s1); border: 1px solid var(--bd);
  border-left: 3px solid var(--gold); border-radius: 2px; padding: 11px 14px;
}

/* Questions are the thing the user has to act on, so they get the loudest
   treatment on the page -- louder than the plan draft above them, which is
   there to be read rather than answered. */
.bs-questions {
  background: var(--s1); border: 1px solid var(--bd);
  border-left: 3px solid var(--amber); border-radius: 2px; overflow: hidden;
  animation: rise .35s ease-out;
}
.bs-questions-hd {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 12px; flex-wrap: wrap; padding: 9px 14px;
  border-bottom: 1px solid var(--bd);
  background: color-mix(in srgb, var(--amber) 8%, transparent);
  font-size: 11px; font-weight: 700; letter-spacing: 2.2px;
  text-transform: uppercase; color: var(--amber);
}
.bs-qcount {
  color: var(--txm); font-size: 10px; letter-spacing: .6px;
  font-weight: 400; text-transform: none;
}
/* Question cards. These are the primary controls on the page once a round
   lands, so they get real hit targets and visible focus -- the option rows are
   what the user is here to click. */
.bs-cards { display: grid; gap: 10px; padding: 12px; }

.bs-card {
  background: var(--bg); border: 1px solid var(--bd);
  border-radius: var(--r-card); padding: 11px 12px 12px;
  transition: border-color .15s ease;
}
.bs-card.answered { border-color: color-mix(in srgb, var(--grn) 45%, var(--bd)); }

.bs-card-hd { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
.bs-chip {
  background: color-mix(in srgb, var(--amber) 16%, transparent);
  color: var(--amber); border: 1px solid color-mix(in srgb, var(--amber) 35%, transparent);
  border-radius: 3px; padding: 1px 7px;
  font-size: 9px; letter-spacing: 1.3px; text-transform: uppercase; font-weight: 700;
}
/* A question whose answer changes the plan's structure rather than its
   detail. Deliberately a different hue from the neutral header chip: the
   person skimming which questions to answer needs these to stand out, since
   leaving one unanswered is what makes the finished plan provisional. */
.bs-chip-blocking {
  background: color-mix(in srgb, var(--red, #d9534f) 16%, transparent);
  color: var(--red, #d9534f);
  border-color: color-mix(in srgb, var(--red, #d9534f) 38%, transparent);
  margin-left: 6px;
}

.bs-skip {
  margin-left: auto; background: none; border: 0; cursor: pointer;
  color: var(--txm); font-family: var(--font); font-size: 10px; letter-spacing: .6px;
  padding: 2px 4px; border-radius: 3px;
}
.bs-skip:hover { color: var(--tx); }

.bs-card-q { color: var(--tx); font-size: 13px; line-height: 1.55; margin-bottom: 10px; }

.bs-opts { display: grid; gap: 5px; }
.bs-opt {
  display: flex; align-items: flex-start; gap: 9px; width: 100%;
  text-align: left; cursor: pointer;
  background: var(--s1); border: 1px solid var(--bd);
  border-radius: var(--r-sm); padding: 8px 10px;
  color: var(--txd); font-family: var(--font);
  transition: border-color .12s ease, background .12s ease;
}
.bs-opt:hover:not(:disabled) { border-color: var(--bdl); background: var(--s2); }
.bs-opt:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
.bs-opt:disabled { opacity: .55; cursor: not-allowed; }
.bs-opt.selected {
  border-color: var(--amber);
  background: color-mix(in srgb, var(--amber) 10%, var(--s1));
}
.bs-opt-mark { color: var(--txm); font-size: 11px; line-height: 1.5; }
.bs-opt.selected .bs-opt-mark { color: var(--amber); }
.bs-opt-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.bs-opt-label { color: var(--tx); font-size: 12px; line-height: 1.45; }
.bs-opt.selected .bs-opt-label { font-weight: 700; }
.bs-opt-desc { color: var(--txm); font-size: 11px; line-height: 1.45; }

.bs-open-input {
  width: 100%; margin-top: 7px;
  background: var(--s1); border: 1px solid var(--bd); border-radius: var(--r-sm);
  padding: 8px 10px; color: var(--tx);
  font-family: var(--font); font-size: 12px;
}
.bs-open-input::placeholder { color: var(--txm); }
.bs-open-input:focus { outline: 0; border-color: var(--amber); }
.bs-open-input:disabled { opacity: .55; }

.bs-qlist { margin: 0; padding: 14px 20px 16px 38px; display: grid; gap: 10px; }
.bs-qlist li { color: var(--tx); font-size: 13px; line-height: 1.6; }
.bs-qlist li::marker { color: var(--amber); font-weight: 700; }
.bs-qlist.small li { color: var(--txd); font-size: 12px; }
.bs-qlist.small { padding: 8px 16px 10px 32px; gap: 6px; }

.bs-reply { border-left: 3px solid var(--gold); }
.bs-ready { color: var(--grn); font-size: 10px; letter-spacing: .5px; }
.bs-halt { padding: 0; }

.bs-split, .bs-history {
  background: var(--s1); border: 1px solid var(--bd);
  border-radius: 2px; overflow: hidden;
}
.bs-split > summary, .bs-history > summary {
  cursor: pointer; padding: 9px 14px; color: var(--txd);
  font-size: 10px; letter-spacing: 1.4px; text-transform: uppercase;
  list-style: none; user-select: none;
}
.bs-split > summary::-webkit-details-marker,
.bs-history > summary::-webkit-details-marker { display: none; }
.bs-split > summary::before, .bs-history > summary::before {
  content: "▶ "; color: var(--txm); font-size: 8px;
}
.bs-split[open] > summary::before, .bs-history[open] > summary::before {
  content: "▼ ";
}
.bs-split > summary:hover, .bs-history > summary:hover { color: var(--tx); }

/* Full council answers, kept collapsed. Four answers of ~3000 chars each
   would bury the questions, but they are the evidence behind every merge and
   are never thrown away. */
.bs-council {
  background: var(--bg); border: 1px solid var(--bd);
  border-radius: var(--r-sm); margin-top: 9px; overflow: hidden;
}
.bs-council > summary {
  cursor: pointer; padding: 7px 11px; color: var(--txm);
  font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase;
  list-style: none; user-select: none;
}
.bs-council > summary::-webkit-details-marker { display: none; }
.bs-council > summary::before { content: "▶ "; font-size: 8px; }
.bs-council[open] > summary::before { content: "▼ "; }
.bs-council > summary:hover { color: var(--tx); }

.bs-council-answer { border-top: 1px solid var(--bd); padding: 9px 12px 11px; }
.bs-council-hd {
  display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
  margin-bottom: 5px;
}
.bs-council-name {
  color: var(--acl); font-size: 11px; letter-spacing: 1.1px;
  text-transform: uppercase; font-weight: 700;
}
.bs-council-meta { color: var(--txm); font-size: 10px; }
.bs-council-bad { color: var(--amber); font-size: 10px; }
.bs-council-body {
  color: var(--txd); font-size: 11.5px; line-height: 1.6;
  white-space: pre-wrap; max-height: 320px; overflow-y: auto;
  border-left: 2px solid var(--bd); padding-left: 10px;
}

.bs-hist-round { border-top: 1px solid var(--bd); padding: 10px 14px 12px; }
/* A superseded attempt stays visible but recedes -- it happened, and it is
   not what the session ended up building on. */
.bs-hist-round.superseded { opacity: .62; }
.bs-hist-note { color: var(--amber); text-transform: none; letter-spacing: .3px; }
.bs-hist-hd {
  color: var(--gold); font-size: 10px; letter-spacing: 1.4px;
  text-transform: uppercase; margin-bottom: 6px;
}
.bs-hist-reply {
  color: var(--txd); font-size: 12px; line-height: 1.6;
  border-left: 2px solid var(--bdl); padding: 4px 0 4px 12px; margin-top: 8px;
  white-space: pre-wrap;
}
.bs-hist-label {
  display: block; color: var(--txm); font-size: 10px;
  letter-spacing: 1.2px; text-transform: uppercase; margin-bottom: 3px;
}

/* The finished plan. The path is the payload here -- it is what gets pasted
   into a coding agent -- so it is selectable and given room to wrap. */
.bs-plan-bar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  background: var(--s1); border: 1px solid var(--bd);
  border-left: 3px solid var(--grn); border-radius: 2px; padding: 9px 12px;
}
.bs-path {
  color: var(--grn); font-size: 11px; word-break: break-all;
  user-select: all; font-family: var(--font);
}
.bs-save-state {
  color: var(--txm); font-size: 11px; letter-spacing: .3px;
  display: flex; align-items: center; gap: 5px; flex-wrap: wrap;
}
.bs-save-state code { color: var(--grn); user-select: all; }
.bs-saved-tick { color: var(--grn); }
.bs-hint { color: var(--txm); font-size: 11px; letter-spacing: .4px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* The offline explanation. Three short blocks rather than one paragraph: what
   is wrong, the rule that explains it, and what still works. */
.offline-rule { color: var(--txd); font-size: 11.5px; line-height: 1.65; margin-top: 8px; }
.offline-rule b { color: var(--tx); }
.offline-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

.row-cloud { color: var(--ac); }

/* Pin, rename, delete. ALWAYS VISIBLE -- they used to appear on hover, which
   on a touch screen means never, and a control you cannot see is a control
   that does not exist. Outlined and evenly weighted, so a row reads as "a
   deliberation, and three things you can do to it". */
.row-acts { display: flex; gap: 5px; flex-shrink: 0; align-items: center; }
.row-act {
  flex-shrink: 0; width: 30px; height: 30px; border-radius: 7px;
  display: inline-flex; align-items: center; justify-content: center;
  background: transparent; border: 1px solid var(--bd);
  color: var(--txm); font-size: 13px; cursor: pointer;
  transition: color .15s, border-color .15s, background .15s;
}
.row-act svg { width: 15px; height: 15px; }
.row-act:hover { color: var(--ac); border-color: var(--ac); background: var(--s2); }
/* Pinned and named both have to read as a switch that is ON, or nothing says
   that pressing again is what turns it off. */
.row-act.on {
  color: var(--ac);
  border-color: color-mix(in srgb, var(--ac) 55%, transparent);
  background: color-mix(in srgb, var(--ac) 14%, transparent);
}
.row-act.danger:hover {
  color: var(--red); border-color: var(--red);
  background: color-mix(in srgb, var(--red) 12%, transparent);
}
/* A named row shows a name, not a prompt, so it gets to look deliberate. */
.row .q.named { color: var(--tx); font-weight: 600; }
.row.pinned { background: color-mix(in srgb, var(--ac) 8%, transparent); }

.history-note {
  padding: 9px 12px; color: var(--txm); font-size: 10.5px;
  border-top: 1px solid var(--bd);
}

/* ══ THE GATE — profile picker and app lock, one screen ════════════════════
   The same lock every other A1 program has, on the same backend: the PBKDF2
   record lives in taskhub-reminders' KV under jlock:applock:<profile>_magi,
   set and reset through the endpoints index.html already uses, with hints and
   reset codes mailed through the same Formspree form.

   It matters more here than in most of the suite, for two reasons. A verdict
   transcript is the full text of everything you have asked several models, and
   the console can START runs against paid accounts -- so an unlocked MAGI on a
   borrowed laptop is both a diary and a spending surface. And since profiles,
   the person it keeps out might be the other person using this machine.

   The cards are index.html's profile cards in MAGI's clothes: same two people,
   same colours, same emoji, so the two programs read as one product. What is
   different is that choosing and unlocking happen in ONE step -- the card you
   pick expands in place into its password field rather than handing you off to
   a second screen. */
.gate {
  position: fixed; inset: 0; z-index: 300;
  display: flex; align-items: center; justify-content: center;
  padding: 20px; background: var(--bg);
  overflow-y: auto;
}
.gate-wrap {
  width: 100%; max-width: 760px;
  display: flex; flex-direction: column; align-items: center;
  padding: 24px 0;
}
.gate-mark { display: flex; justify-content: center; }
.gate-mark svg { width: 54px; height: 54px; }
.gate-brand {
  font-family: var(--font-display); font-size: 15px; font-weight: 800;
  letter-spacing: 1.6px; text-transform: uppercase; color: var(--tx);
  margin-top: 12px;
}
.gate-lede { color: var(--txd); font-size: 12px; margin-top: 8px; }

/* Two cards side by side on a desktop, stacked on a phone. `align-items:
   flex-start` matters: the expanded card must be free to grow downwards
   without dragging its sibling's height with it, which is what made the
   collapsed card look broken at every step of the animation. */
.gate-cards {
  display: flex; gap: 14px; align-items: flex-start; justify-content: center;
  width: 100%; margin-top: 26px; flex-wrap: wrap;
}
/* Portrait tiles: taller than they are wide, so two of them sit as a pair of
   plates rather than a stack of toolbars. The open one grows sideways to fit
   a password field and stays taller than it is wide. */
.gate-card {
  position: relative;
  flex: 0 0 auto; width: 186px; min-height: 218px;
  display: flex; flex-direction: column; align-items: center;
  background: var(--s1); border: 1px solid var(--bd);
  border-radius: var(--r-card); padding: 26px 16px 18px;
  /* No drop shadow. Two siblings each casting `0 24px 60px` means the later
     one paints over the earlier: Veda's shadow darkened Tony's adjacent edge
     while his was hidden beneath her card, so hers read as floating above
     his. Their backgrounds were identical the whole time. On a flat backdrop
     with a visible border the shadow was buying nothing anyway. */
  transition: border-color .15s, transform .15s, width .18s ease;
}
.gate-card.open { width: 284px; }
.gate-card.open { border-color: var(--pc); }
/* The shut card stays legible rather than being dimmed into a decoration --
   it is a button, and half of what this screen is for is pressing it. */
.gate-card.tappable { cursor: pointer; justify-content: center; padding-top: 18px; }
.gate-card.tappable:hover, .gate-card.tappable:focus-visible {
  border-color: var(--pc); transform: translateY(-2px); outline: 0;
}
/* Stacked and centred: the avatar reads as a portrait rather than a bullet. */
.gate-head {
  display: flex; flex-direction: column; align-items: center; gap: 11px;
  width: 100%;
}
/* Outline only. A tinted disc reads as a filled state -- "selected", or
   "active" -- which is not what it means; it is just whose card this is. */
.gate-av {
  width: 68px; height: 68px; flex: 0 0 68px;
  display: flex; align-items: center; justify-content: center;
  font-size: 31px; line-height: 1;
  border-radius: 50%;
  background: none;
  border: 1.5px solid var(--pc);
}
.gate-name {
  max-width: 100%;
  font-family: var(--font-display); font-size: 19px; font-weight: 700;
  color: var(--tx); letter-spacing: .3px; text-align: center;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
/* The favourite. Outlined until it is set, then filled in that profile's
   colour -- the one place on this screen where a fill means something. */
.gate-fav {
  position: absolute; top: 7px; right: 7px;
  width: 30px; height: 30px; padding: 0;
  display: flex; align-items: center; justify-content: center;
  background: none; border: 0; border-radius: 50%;
  color: var(--txm); cursor: pointer; opacity: .55;
  transition: opacity .15s, color .15s;
}
.gate-fav svg { width: 18px; height: 18px; fill: none; }
.gate-fav:hover { opacity: 1; color: var(--pc); }
.gate-fav.on { opacity: 1; color: var(--pc); }
.gate-fav.on svg { fill: var(--pc); }
.gate-body { margin-top: 16px; width: 100%; }
.gate-blurb {
  color: var(--txd); font-size: 12px; line-height: 1.55; margin-bottom: 14px;
}

/* The password field. The input keeps .lock-in so it matches every other text
   box on the screen; the eye sits inside its right edge, and the field's own
   padding is widened to make room rather than the eye overlapping the text. */
.gate-pw { position: relative; }
.gate-pw .lock-in { padding-right: 40px; }
.gate-eye {
  position: absolute; top: 0; right: 0; width: 38px; height: 41px;
  display: flex; align-items: center; justify-content: center;
  background: none; border: 0; padding: 0; cursor: pointer;
  color: var(--txm);
}
.gate-eye:hover { color: var(--ac); }
.gate-eye svg { width: 16px; height: 16px; display: block; }
.gate-caps {
  font-size: 11px; color: var(--amber);
  margin: -4px 0 9px 2px;
}
/* The primary action wears the profile's colour rather than MAGI's accent.
   A gold-bordered card with a purple Unlock button in it reads as two
   unrelated pieces of UI; this way the whole card says "Tony" at a glance,
   which is the one thing this screen exists to make unambiguous. */
.gate-card.open .btn.active {
  background: var(--pc); border-color: var(--pc); color: var(--bg);
}
.gate-card.open .btn.active:not(:disabled):hover {
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--pc) 22%, transparent);
}
.gate-card.open .lock-in:focus { border-color: var(--pc); }

@media (max-width: 760px) {
  .gate { padding: 14px; align-items: flex-start; }
  .gate-wrap { padding: 28px 0 24px; }
  /* Stacked, full width. The expanded card is what you came for, so it goes
     first and the other sits under it rather than above the fold it needs. */
  /* Two tiles at 168px plus the gap still fit a 390px phone, so the pair
     stays side by side and only the OPEN one needs the full width. */
  .gate-cards { gap: 10px; margin-top: 20px; align-items: stretch; }
  .gate-card.open { width: 100%; flex: 1 1 100%; order: -1; }
}
@media (max-width: 430px) {
  .gate-card { padding: 22px 12px 16px; width: 168px; min-height: 204px; }
