/* ══ link ══════════════════════════════════════════════════════════════════
   Where the engine is, and how this page reaches it.

   MAGI's council cannot leave Tony's PC: it drives real Chrome profiles
   holding live logins. So this page is static and the engine is local, which
   gives three deployments:

     same-origin   opened at http://127.0.0.1:8000 — the backend is serving
                   this very file, so the API is "" and no token is needed.
     hosted, home  opened from GitHub Pages while sitting at the PC. Chrome
                   allows an https page to call http://127.0.0.1 (a
                   "potentially trustworthy" origin), provided the server
                   answers the Private Network Access preflight — the backend
                   does. Fastest path, no tunnel involved.
     hosted, away  the PC is reachable only through a Cloudflare quick tunnel,
                   whose url changes on every cloudflared restart. `magi cloud`
                   PUBLISHES that url to the magi-link worker on account 2, and
                   this asks for it.

   The React build handled only the third and did it at BUILD time — the url
   was inlined by Vite, so every PC restart meant rewrite .env.production,
   rebuild, redeploy. Discovering it at load time is what removes that cycle,
   and is the reason this file never needs rebuilding. */
const LINK_API = "https://magi-link.av1-2.workers.dev/link";
const LOCAL_API = "http://127.0.0.1:8000";
const TOKEN_KEY = lsKey("token");
/* The last token that actually reached the engine.
 *
 * The setup sheet is a text box holding a 43-character secret with no
 * feedback until you press Save, so one stray keystroke in it takes the
 * console offline with nothing on screen explaining why. This is the way
 * back: written only when a token has been PROVEN -- the engine handed it
 * over, or it opened the tunnel -- never merely when it was typed. */
const GOOD_TOKEN_KEY = lsKey("token.ok");

const link = {
  api: null,        // origin to call, "" meaning same-origin
  token: "",
  where: "seeking", // seeking | local | remote | down
  detail: "",
};

/* ══ engines ═══════════════════════════════════════════════════════════════
   A profile can have an engine on more than one machine.

   MAGI's engine cannot move -- it drives real Chrome profiles holding live
   logins -- so "where is the engine?" used to have exactly one answer and the
   console only ever had to find it. That stops being true the moment a second
   machine runs one: a desktop and a laptop, or Tony's PC and Veda's, each with
   its own signed-in accounts and its own history.

   An engine is identified by a record it writes itself (magi/data/<profile>/
   engine.json) and reports on /api/health: a stable id that survives restarts,
   a label you can read, and the port it listens on. `instance` is NOT that --
   it is fresh per process, which is exactly right for tunnel adoption and
   exactly wrong for "is this the same laptop as yesterday?".

   ── Each engine has its OWN token ─────────────────────────────────────────
   Not a nicety. `magi-link` keys its KV records by the SHA-256 of the token,
   so two engines sharing one would overwrite each other's "where am I" record
   and the phone would follow whichever published last. Separate tokens also
   keep the security boundary honest: Tony's token cannot reach Veda's engine
   and the logged-in accounts sitting behind it.

   That is why the registry stores a token per engine rather than one for the
   profile. Discovery then runs the same three steps it always did -- same
   origin, then loopback, then the tunnel -- once per engine, and the first one
   that answers wins. */
const ENGINES_KEY = lsKey("engines");

const ENG = {
  list: [],        // [{ id, label, token, port, lastSeen, url }]
  activeId: "",    // the one currently connected, once one answers
  probing: false,
};

const engFind = (id) => ENG.list.find((e) => e.id === id) || null;
const engActive = () => engFind(ENG.activeId) || ENG.list[0] || null;

function engLoad() {
  let list = [];
  try {
    const raw = JSON.parse(localStorage.getItem(ENGINES_KEY) || "[]");
    if (Array.isArray(raw)) list = raw.filter((e) => e && typeof e === "object");
  } catch {}
  // Before this registry existed there was one token in one key, and it is
  // this profile's engine. Carried in as an unnamed entry rather than being
  // asked for again; it gets its real id and label the first time it answers.
  if (!list.length) {
    const t = loadToken();
    list = [{ id: "", label: "", token: t, port: 8000 }];
  }
  ENG.list = list;
  return list;
}

let _engT = 0;
function engSave({ sync = true } = {}) {
  try { localStorage.setItem(ENGINES_KEY, JSON.stringify(ENG.list)); } catch {}
  if (!sync) return;
  // Debounced, like every other write on this page. Adding an engine is rare;
  // relabelling one is a burst of keystrokes.
  clearTimeout(_engT);
  _engT = setTimeout(() => cloudSaveEngines(), 900);
}

/** Record what an engine told us about itself when it answered. */
function engSeen(token, health, url) {
  if (!health || !health.engine || !health.engine.id) return null;
  const { id, label, port } = health.engine;
  let e = engFind(id);
  if (!e) {
    // The unnamed legacy entry becomes this engine rather than a duplicate of
    // it -- otherwise the first connection after an upgrade leaves you with
    // two rows for one machine, one of which never answers again.
    e = ENG.list.find((x) => !x.id && x.token === token);
    if (e) e.id = id;
    else { e = { id, token, label: "", port: port || 8000 }; ENG.list.push(e); }
  }
  e.token = token || e.token;
  if (port) e.port = port;
  // A label the user typed wins over the machine's own guess: they wrote it
  // because the default was not the thing they wanted to read.
  if (!e.label) e.label = label || "";
  e.lastSeen = Date.now();
  if (url != null) e.url = url;
  ENG.activeId = id;
  engSave();
  return e;
}

function engLabel(e) {
  if (!e) return "";
  if (e.label) return e.label;
  // An entry with no id has never answered, so we do not know what machine it
  // is -- it was added by pasting a key. Calling it "this PC" was a guess that
  // is wrong for exactly the case the registry exists to support.
  if (!e.id) return "Unnamed engine";
  return e.id.replace(/^eng_/, "engine ");
}

function engRename(id, label) {
  const e = engFind(id);
  if (!e) return;
  e.label = (label || "").trim();
  engSave();
  syncEngineBtn();
}

function engForget(id) {
  ENG.list = ENG.list.filter((e) => e.id !== id);
  if (ENG.activeId === id) ENG.activeId = "";
  engSave();
  syncEngineBtn();
}

/** Add an engine by its token. The rest it tells us when it first answers. */
function engAdd(token) {
  const t = (token || "").trim();
  if (!t) return null;
  const dup = ENG.list.find((e) => e.token === t);
  if (dup) return dup;
  const e = { id: "", label: "", token: t, port: 8000 };
  ENG.list.push(e);
  engSave();
  return e;
}

/** True when this page is being served by the backend itself. */
const sameOrigin = /^(127\.0\.0\.1|localhost)$/.test(location.hostname) && location.protocol !== "file:";

function loadToken() {
  try { return localStorage.getItem(TOKEN_KEY) || ""; } catch { return ""; }
}
function loadGoodToken() {
  try { return localStorage.getItem(GOOD_TOKEN_KEY) || ""; } catch { return ""; }
}
function rememberGoodToken(t) {
  if (!t) return;
  try { localStorage.setItem(GOOD_TOKEN_KEY, t); } catch {}
}

function saveToken(t) {
  try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch {}
  link.token = t;
}

/** fetch() options carrying the token header. Merges with any existing init. */
function authed(init = {}) {
  if (!link.token) return init;
  return { ...init, headers: { ...(init.headers || {}), "X-MAGI-Token": link.token } };
}

/** EventSource url with the token as a query param.
 *
 *  SSE cannot send custom headers — the EventSource constructor takes no
 *  header option — so the stream endpoints accept ?token= instead. Same
 *  secret, only the transport differs. */
function streamUrl(path) {
  if (!link.token) return `${link.api}${path}`;
  return `${link.api}${path}${path.includes("?") ? "&" : "?"}token=${encodeURIComponent(link.token)}`;
}

/** Does a backend answer here, with this token? 401 is a definite NO — the
 *  host is right but the token is wrong, which is a different problem from
 *  "nothing is listening" and must not be reported as offline. */
async function probe(base, ms = 2500) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms);
  try {
    const r = await fetch(`${base}/api/health`, authed({ signal: ctl.signal }));
    if (r.status === 401) return "unauthorized";
    if (!r.ok) return "no";
    // An engine serves one person. Connecting to the other one's would list
    // THEIR signed-in accounts in this console and run deliberations against
    // them -- silently, because everything else about it works. Engines from
    // before profiles existed report nothing here, and those are Tony's.
    try {
      const h = await r.clone().json();
      const theirs = String(h.profile || "tony");
      if (theirs !== PROFILE.id) {
        link.otherProfile = theirs;
        return "wrongprofile";
      }
      link.otherProfile = "";
      link.engine = h.engine || null;
      // The registry learns this engine's id, label and port from the
      // engine itself, the first time it answers. Nothing to configure.
      engSeen(link.token, h, base || null);
    } catch {}
    return "ok";
  } catch {
    return "no";
  } finally {
    clearTimeout(t);
  }
}

/** Ask an engine we can already reach for the token that gates its tunnel.
 *
 *  Only ever called when we are ALREADY connected without a token, which means
 *  loopback -- the engine refuses this over the tunnel. So this asks for
 *  nothing we do not already have; it just turns "I can reach the engine" into
 *  "I can reach the engine from my phone too", with nobody typing a long
 *  random string into a phone keyboard. */
async function fetchEngineToken(base) {
  try {
    const r = await fetch(`${base}/api/token`, authed());
    if (!r.ok) return "";
    const d = await r.json();
    return d && d.token ? String(d.token) : "";
  } catch { return ""; }
}

/** Ask magi-link where the engine published itself. */
async function askLink() {
  try {
    const r = await fetch(LINK_API, authed());
    if (!r.ok) return null;
    const d = await r.json();
    return d && d.url ? d : null;
  } catch {
    return null;
  }
}

/** What kind of device this page is open on, for wording the status. */
const DEVICE_KIND = (() => {
  const ua = navigator.userAgent || "";
  if (/iPhone|iPod|Android.+Mobile|Mobile.+Firefox/i.test(ua)) return "phone";
  if (/iPad|Android|Tablet/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) return "tablet";
  return "computer";
})();

/** The status as a person reads it: a headline and one quiet line under it.
 *  `link.detail` stays the terse internal key -- renderOfflineNote looks its
 *  long explanation up by it -- and this is only how it is shown. */
function linkLabel(where = link.where, detail = link.detail) {
  const dev = DEVICE_KIND === "computer" ? "browser" : DEVICE_KIND;
  if (where === "local") {
    return {
      main: "Running on this PC",
      sub: {
        "phones ok": "Direct · reachable from your phone",
        "phones cut off": "Direct · phone access is down",
      }[detail] || "Direct connection",
    };
  }
  if (where === "remote") {
    return { main: "Connected to your PC", sub: `Remote · ${detail}` };
  }
  if (where === "seeking") {
    return {
      main: "Connecting…",
      sub: detail === "checking your other devices…" ? "Checking your other devices" : "Looking for your PC",
    };
  }
  return {
    main: DEVICE_KIND === "computer" ? "Engine offline" : "Your PC is offline",
    sub: {
      "no API token set": `This ${dev} isn't paired yet`,
      "token rejected": "Access key was rejected",
      "engine has not published": "PC is asleep or MAGI isn't running",
      "tunnel is dead": "Remote link is down",
      "backend not responding": "Engine isn't responding",
      "backend wants a token": "Access key needed",
      // Reached an engine, but it belongs to the other person. Named rather
      // than shown as a generic failure, because the fix is switching
      // profile and nothing about "offline" would ever suggest that.
      "wrong profile": link.otherProfile
        ? `That engine is ${(MAGI_PROFILES[link.otherProfile] || {}).label || link.otherProfile}’s`
        : "That engine belongs to another profile",
    }[detail] || "Can't reach the engine",
  };
}

/* Come back on our own once the engine returns.
 *
 *  connect() used to run on load and on button presses only, so a phone that
 *  was open while the PC restarted sat on "Your PC is offline" until someone
 *  reloaded it -- even though the engine was back seconds later. The page now
 *  retries by itself, and stops the moment it is connected.
 *
 *  Hidden tabs clear the timer entirely (a phone in a pocket must not poll),
 *  and becoming visible retries at once with the backoff reset -- so picking
 *  the phone up finds it already connected. */
const RETRY_STEPS = [3000, 5000, 8000, 13000, 21000, 30000];
const RETRY = { timer: 0, step: 0, busy: false, lastTry: 0 };

function stopRetry() {
  clearTimeout(RETRY.timer);
  RETRY.timer = 0;
  RETRY.step = 0;
}

function scheduleRetry(delay) {
  clearTimeout(RETRY.timer);
  if (document.hidden || online()) return;
  const wait = delay != null ? delay : RETRY_STEPS[Math.min(RETRY.step, RETRY_STEPS.length - 1)];
  RETRY.timer = setTimeout(tryReconnect, wait);
}

async function tryReconnect() {
  if (RETRY.busy || online() || document.hidden) return;
  // Not while the gate is up. Every retry path -- the backoff timer, and the
  // visibilitychange / online / pageshow / focus listeners -- funnels through
  // here, and `pageshow` fires on EVERY load, so without this line a locked
  // console probed 127.0.0.1 for the engine before anyone had proved who they
  // were. Harmless while connect() ran at boot anyway; not harmless once the
  // lock is the thing deciding whether this profile may touch the network.
  // Caught by the gate test asserting that a locked page makes no requests.
  if (!PROFILE.unlocked) return;
  RETRY.busy = true;
  RETRY.lastTry = Date.now();
  try {
    await connect(true);
  } finally {
    RETRY.busy = false;
  }
  if (online()) { stopRetry(); boot(); }
  else { RETRY.step += 1; scheduleRetry(); }
}

/** A gesture that means "I am looking at this now".
 *
 *  Down: retry immediately, backoff reset. UP: check that it is STILL up --
 *  a page sitting idle never notices the engine going away (it only learns
 *  from a request that fails), so coming back to a tab that was connected an
 *  hour ago would show "Running on this PC" over a dead engine until you
 *  clicked something. One health check settles it, and a failure drops into
 *  the retry loop by the usual route. */
async function retryNow(minGapMs = 0) {
  if (document.hidden) return;
  if (minGapMs && Date.now() - RETRY.lastTry < minGapMs) return;
  RETRY.lastTry = Date.now();
  if (online()) {
    if (RETRY.busy) return;
    RETRY.busy = true;
    try {
      const state = await probe(link.api, 4000);
      if (state !== "ok" && state !== "unauthorized" && online()) {
        setLink("down", link.where === "local" ? "backend not responding" : "tunnel is dead");
      }
    } finally {
      RETRY.busy = false;
    }
    return;
  }
  RETRY.step = 0;
  scheduleRetry(0);
}

document.addEventListener("visibilitychange", () => {
  if (document.hidden) clearTimeout(RETRY.timer);
  else retryNow();
});
window.addEventListener("online", () => retryNow());
window.addEventListener("pageshow", () => retryNow());       // iOS bfcache
window.addEventListener("focus", () => retryNow(2000));

function setLink(where, detail) {
  link.where = where;
  link.detail = detail;
  const b = $("linkBtn");
  b.className = `link ${where}`;
  const lab = linkLabel(where, detail);
  const t = $("linkTxt");
  t.textContent = "";
  t.append(el("span", "link-main", lab.main), el("span", "link-sub", lab.sub));
  b.title = `${lab.main} — ${lab.sub}. ` + {
    local: "Click to manage the access key.",
    remote: "Click to manage the access key.",
    seeking: "",
    down: "Click for help.",
  }[where];
  updateEnabled();
  renderOfflineNote();
  if (typeof syncMobileLink === "function") syncMobileLink();
  // Down: keep trying. Up (or still looking): nothing to schedule.
  if (where === "down") { if (!RETRY.timer && !RETRY.busy) scheduleRetry(); }
  else stopRetry();
}

/** Find AN engine -- the active one first, then every other one this
 *  profile knows about, stopping at the first that answers.
 *
 *  One engine is still the common case and still costs exactly what it did:
 *  the loop runs once. The second pass only happens when the machine you
 *  usually use is asleep, which is precisely when you want the laptop tried
 *  rather than being told MAGI is offline. */
async function connect(quiet = false) {
  engLoad();
  // Active first, then the rest in registry order.
  const order = [];
  const act = engActive();
  if (act) order.push(act);
  for (const e of ENG.list) if (e !== act) order.push(e);
  if (!order.length) order.push({ id: "", label: "", token: loadToken(), port: 8000 });

  let last = null;
  for (const eng of order) {
    const r = await connectTo(eng, quiet || order.indexOf(eng) > 0);
    if (online()) { syncEngineBtn(); return r; }
    last = r;
  }
  syncEngineBtn();
  return last;
}

/** One engine: same origin, then loopback, then its tunnel. Unchanged in
 *  substance -- what moved is that the token and the port come from the
 *  engine being tried rather than from a single global. */
async function connectTo(eng, quiet = false) {
  const ENG_PORT = (eng && eng.port) || 8000;
  const ENG_LOCAL = `http://127.0.0.1:${ENG_PORT}`;
  // A silent retry does not flash "Connecting…" over the status: the loop
  // below runs every few seconds while the engine is down, and strobing the
  // button between two messages reads as a fault of its own.
  if (!quiet) setLink("seeking", "locating engine…");

  if (sameOrigin) {
    // The backend is serving this file. No CORS, and no token either: the
    // engine exempts requests that did not arrive through the tunnel.
    link.api = "";
    link.token = (eng && eng.token) || loadToken();
    let s = await probe("", 6000);
    // An older engine, or one reached some other way, may still demand the
    // token. Retrying with a stored one keeps that from being a dead end on
    // the very machine the backend is running on.
    if (s === "unauthorized" && !link.token) {
      return setLink("down", "backend wants a token");
    }
    if (s === "unauthorized") s = await probe("", 6000);
    if (s === "ok") return setLink("local", "direct");
    if (s === "wrongprofile") return setLink("down", "wrong profile");
    if (s === "unauthorized") return setLink("down", "token rejected");
    return setLink("down", "backend not responding");
  }

  link.token = (eng && eng.token) || loadToken();

  // At the desk: straight to the PC, no tunnel hop and NO TOKEN NEEDED. The
  // engine exempts requests that did not arrive through cloudflared, so a
  // GitHub Pages page sitting beside the PC talks to it with nothing
  // configured at all. Tried BEFORE the token check on purpose: requiring a
  // token first meant the hosted page reported "no API token set" while the
  // engine was running on the same machine, three feet away.
  link.api = ENG_LOCAL;
  const local = await probe(ENG_LOCAL);
  if (local === "ok") {
    // The engine's own copy beats whatever is in this browser: a token typed
    // in months ago and rotated since is exactly the stale value that would
    // otherwise be handed to the phone as gospel.
    const fromEngine = await fetchEngineToken(ENG_LOCAL);
    if (fromEngine) {
      // Straight from the engine, so this is the definition of "working".
      rememberGoodToken(fromEngine);
      if (fromEngine !== link.token) { link.token = fromEngine; saveToken(fromEngine); }
    }
    if (link.token) cloudPublishToken(link.token, !fromEngine);
    setLink("local", "direct");
    // Reachable HERE says nothing about reachable from a phone. A quick tunnel
    // can be dropped by Cloudflare while the engine keeps running, and nothing
    // on this screen would change -- the phone just says offline for days. So
    // the desk checks what a phone would find, once, in the background.
    if (link.token) {
      askLink().then((pub) => {
        if (link.where !== "local") return;
        if (pub) return setLink("local", "phones ok");
        setLink("local", "phones cut off");
        $("linkBtn").title =
          "Running here, but the tunnel your phone uses is down. Restarting MAGI on this PC opens a new one.";
      });
    }
    return;
  }

  // Only the tunnel genuinely needs the token: magi-link keys its records by
  // the token's hash, so without one there is nothing to look up.
  //
  // A browser that has never been given one asks the cloud before giving up --
  // this is a phone opening MAGI for the first time, and typing a long random
  // secret on a phone keyboard is the step this removes.
  if (!link.token) {
    setLink("seeking", "checking your other devices…");
    link.token = await cloudFetchToken();
  }
  if (!link.token) { link.api = null; return setLink("down", "no API token set"); }
  if (local === "wrongprofile") { link.api = null; return setLink("down", "wrong profile"); }
  if (local === "unauthorized") { link.api = null; return setLink("down", "token rejected"); }

  // Away: wherever `magi cloud` last published.
  const pub = await askLink();
  if (!pub) { link.api = null; return setLink("down", "engine has not published"); }
  link.api = pub.url;
  const remote = await probe(pub.url, 8000);
  if (remote === "ok") {
    // Proven against the tunnel, so it is worth sharing -- and worth keeping
    // as the value to fall back to if the box ever gets edited by accident.
    rememberGoodToken(link.token);
    cloudPublishToken(link.token);
    const mins = Math.round((pub.age_s || 0) / 60);
    return setLink("remote", mins < 1 ? "linked just now"
      : `linked ${mins < 60 ? mins + "m" : Math.round(mins / 60) + "h"} ago`);
  }
  link.api = null;
  setLink("down", remote === "wrongprofile" ? "wrong profile"
    : remote === "unauthorized" ? "token rejected" : "tunnel is dead");
}

const online = () => link.api !== null && (link.where === "local" || link.where === "remote");

let _howOpen = false;

function openHow() {
  if (_howOpen) return;
  _howOpen = true;
  // The page behind must not scroll or be clickable. The overlay already
  // captures clicks; this is about the SCROLL, which on a phone otherwise
  // drags the console around underneath the panel while you read it.
  document.documentElement.classList.add("modal-open");

  const sheet = el("div", "sheet how-sheet");
  const box = el("div", "how-box");

  const hd = el("div", "how-hd");
  const title = el("div", "how-titlewrap");
  title.append(el("div", "how-title", "How MAGI works"));
  title.append(el("div", "how-sub",
    "Several models, asked independently, then one verdict."));
  const x = el("button", "how-x");
  x.type = "button";
  x.setAttribute("aria-label", "Close");
  x.innerHTML = IC.close;
  hd.append(title, x);

  const scroll = el("div", "how-body");
  for (const sec of HOW) {
    const d = el("details", "how-sec");
    if (sec.open) d.open = true;
    const sm = el("summary");
    sm.append(el("span", "how-q", sec.q));
    sm.append(el("span", "how-caret"));
    d.append(sm);
    for (const para of sec.a) {
      const para_el = el("p", "how-p");
      // Fixed literals in this file, never anything typed by a user.
      para_el.innerHTML = para.split("__DAYS__").join(String(HISTORY_DAYS));
      d.append(para_el);
    }
    scroll.append(d);
  }
  // 210: above the sheet backdrop (200), so the panel's own scrollbar is the
  // one thing that may paint over it.
  attachScrollbar(scroll, 210);

  box.append(hd, scroll);
  sheet.append(box);

  const close = () => {
    _howOpen = false;
    document.documentElement.classList.remove("modal-open");
    document.removeEventListener("keydown", onKey);
    sheet.remove();
  };
  const onKey = (e) => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  x.onclick = close;
  dismissOnBackdrop(sheet, close);

  document.body.append(sheet);
  x.focus();
}

/* ══ setup sheet ═══════════════════════════════════════════════════════════
   What the token IS, and why this screen is deliberately awkward.

   MAGI_API_TOKEN is a shared secret you invented once and set on the engine
   machine. It is not an account, not a subscription key, not anything issued
   by OpenAI or Anthropic or Google -- it is a password on MAGI's own API,
   there because a Cloudflare quick tunnel cannot sit behind Cloudflare Access
   and the tunnel url is otherwise the only thing standing between the open
   internet and endpoints that drive four logged-in paid accounts.

   Which is exactly why editing it by accident is so unpleasant: the field is
   a text box holding 43 opaque characters, one keystroke breaks it, and the
   only symptom is the console going quiet. So the field is READ-ONLY until
   you deliberately unlock it, and there are two ways back that do not involve
   remembering anything:

     · the engine's own copy, over loopback (GET /api/token), which is
       authoritative by definition; and
     · the last token that actually reached the engine from this browser.

   Both are offered as buttons. Neither exists to be clever -- they exist so
   that "I typed in the wrong box" is a five-second problem. */
/* ── the engine picker ─────────────────────────────────────────────────────
   Only appears once there is a choice to make. With one engine -- which is
   most people, most of the time -- there is nothing to pick and the control
   stays out of the way; the status row already says where MAGI is running. */
/** "4m", "3h", "2d" -- short enough for a one-line row. */
function engAgo(ms) {
  const m = Math.max(0, Math.round((Date.now() - ms) / 60000));
  if (m < 1) return "just now";
  if (m < 60) return m + "m ago";
  const h = Math.round(m / 60);
  if (h < 48) return h + "h ago";
  return Math.round(h / 24) + "d ago";
}

function syncEngineBtn() {
  const b = $("engineBtn");
  if (!b) return;
  const many = ENG.list.filter((e) => e.id).length > 1;
  b.hidden = !many;
  if (!many) return;
  const e = engActive();
  b.textContent = "";
  b.append(el("span", "eng-dot" + (online() ? " on" : "")), el("span", "eng-name", engLabel(e)));
  b.title = "Running on " + engLabel(e) + " — click to choose another";
}

  const rows = ENG.list.filter((e) => e.id || e.token);

    const dot = el("span", "eng-dot");
    // Reachability is what the last connection attempt found, not a fresh

    const fresh = e.lastSeen && Date.now() - e.lastSeen < 120000;
    if (e.id === ENG.activeId && online()) dot.classList.add("on");
    else if (fresh) dot.classList.add("warm");
    row.append(dot);

    const mid = el("div", "eng-mid");
    const name = el("input", "eng-in");
    name.value = engLabel(e);
    name.placeholder = "Name this machine";
    name.onchange = () => engRename(e.id, name.value);
    mid.append(name);
    const sub = el("div", "eng-sub",
      e.id === ENG.activeId && online()
        ? `Connected · ${link.where === "local" ? "on this network" : "over the tunnel"}`
        : e.lastSeen
          ? "Last seen " + engAgo(e.lastSeen)
          : "Never reached");
    mid.append(sub);
    row.append(mid);

    const use = el("button", "btn");
    use.textContent = e.id === ENG.activeId && online() ? "In use" : "Use";
    use.disabled = e.id === ENG.activeId && online();
    use.onclick = async () => {
      ENG.activeId = e.id;
      engSave();
      close();
      setLink("seeking", "locating engine…");
      await connect();
      boot();
    };
    row.append(use);

    const rm = el("button", "eng-x");
    rm.innerHTML = IC.x;
    rm.title = "Forget this engine";
    rm.onclick = async () => {
      const yes = await uiConfirmMagi(
        "Forget " + engLabel(e) + "?",
        "MAGI stops looking for it on this profile. Nothing on that machine is "
        + "changed, and adding it back only needs its access key.",
        "Forget");
      if (!yes) return;
      engForget(e.id);
      close();
      openEnginePicker();
    };
    row.append(rm);
    list.append(row);
  }
  box.append(list);

  // Adding one is adding its token: that is the only thing the console cannot
  // discover for itself, and everything else about the engine comes from the
  // engine the first time it answers.
  const addWrap = el("div", "eng-add");
  const addIn = el("input", "lock-in");
  addIn.placeholder = "Access key of another machine";
  addIn.autocomplete = "off";
  const addBtn = el("button", "btn active", "Add");
  addBtn.onclick = async () => {
    const t = addIn.value.trim();
    if (!t) return;
    engAdd(t);
    close();
    setLink("seeking", "locating engine…");
    await connect();
    boot();
  };
  addWrap.append(addIn, addBtn);
  box.append(addWrap);

  const done = el("button", "lock-link", "Close");
  done.onclick = () => close();
  box.append(done);

  sheet.append(box);
  document.body.append(sheet);
  function close() { sheet.remove(); }
  dismissOnBackdrop(sheet, close);
}

function openSetup() {
  const sheet = el("div", "sheet");
  const box = el("div", "sheet-box");
  box.append(
    el("div", "sheet-hd", "Connect to the engine"),
    el("div", "sheet-sub",
      "MAGI's council runs on one device — it drives real logged-in Chrome " +
      "profiles, which cannot leave that machine. The API token is a password " +
      "you set on that machine (MAGI_API_TOKEN); it gates MAGI's own API and " +
      "is not connected to any AI account. It is saved to your other devices " +
      "automatically, so you only type it once."),
  );

  const lbl = el("label", "sheet-lbl", "API token");
  const row = el("div", "sheet-row");
  const input = el("input", "sheet-in");
  input.type = "password";
  input.value = link.token;
  input.placeholder = "MAGI_API_TOKEN";
  input.autocomplete = "off";
  input.readOnly = true;
  const edit = el("button", "btn", "Change");
  row.append(input, edit);
  box.append(lbl, row);

  const note = el("div", "sheet-note");
  note.innerHTML =
    'Locked so it cannot be changed by a stray keystroke — press <b>Change</b> to edit it. ' +
    'Set the same value on the engine device with <code>setx MAGI_API_TOKEN "…"</code>, ' +
    'then run <code>magi cloud</code>. Never in the repo, which is public.';
  box.append(note);

  const msg = el("div");
  const bar = el("div", "sheet-bar");
  const save = el("button", "btn active", "Save & connect");
  const revert = el("button", "btn", "Restore last working");
  const retry = el("button", "btn", "Retry");
  // Offered only where it can work: the engine refuses a restart that arrived
  // over the tunnel, so from a phone this button would 404 by design.
  const restart = el("button", "btn", "Restart engine");
  const close = el("button", "btn", "Close");
  bar.append(save, revert, retry, restart, el("span", "qbar-spacer"), close);
  box.append(bar, msg);

  const done = () => sheet.remove();
  close.onclick = done;
  dismissOnBackdrop(sheet, done);

  const good = () => loadGoodToken();
  const paint = () => {
    input.classList.toggle("locked", input.readOnly);
    edit.textContent = input.readOnly ? "Change" : "Cancel";
    save.disabled = input.readOnly || !input.value.trim() || input.value.trim() === link.token;
    // Only offered when it would actually change something. A button that
    // restores what is already there teaches you to distrust the button.
    const g = good();
    show(revert, !!g && g !== input.value.trim());
    show(restart, link.where === "local");
  };

  /* Restart the engine, from the console.
   *
   *  The engine reads its Python once, at import, so a fix under magi/ does
   *  nothing until it restarts -- which meant going to the PC and hunting a
   *  windowless pythonw in Task Manager. It is the same machine that is
   *  serving this page whenever the status says "Running on this PC", so it
   *  may as well be a button.
   *
   *  The engine hands back the response before exiting, and a detached helper
   *  starts the replacement once the port is free; there is nothing to do here
   *  but keep asking until it answers. Anything still running is reported, and
   *  only then can it be forced -- a restart mid-run loses the run.
   */
  let forceNext = false;
  restart.onclick = async () => {
    restart.disabled = true;
    msg.className = "sheet-note";
    msg.textContent = "Restarting the engine…";
    let r;
    try {
      r = await fetch(`${link.api}/api/restart${forceNext ? "?force=true" : ""}`,
                      authed({ method: "POST" }));
    } catch {
      r = null;
    }
    if (r && r.status === 409) {
      const d = await r.json().catch(() => null);
      forceNext = true;
      restart.disabled = false;
      restart.textContent = "Restart anyway";
      msg.className = "sheet-err";
      msg.textContent = `${(d && d.detail) || "Something is still running."} Press again to restart and lose it.`;
      return;
    }
    if (!r || !r.ok) {
      restart.disabled = false;
      msg.className = "sheet-err";
      msg.textContent = r ? `The engine refused: ${r.status}.` : "Could not reach the engine.";
      return;
    }
    forceNext = false;
    restart.textContent = "Restart engine";
    // It takes a few seconds to come back: the old process has to exit and
    // release the port before the new one can bind it.
    for (let i = 0; i < 40; i++) {
      await new Promise((ok) => setTimeout(ok, 1000));
      msg.textContent = `Restarting the engine… ${i + 1}s`;
      await connect();
      if (online()) {
        msg.className = "sheet-ok";
        msg.textContent = "Engine restarted and running the current code.";
        restart.disabled = false;
        boot();
        return;
      }
    }
    restart.disabled = false;
    msg.className = "sheet-err";
    msg.textContent = "The engine did not come back within 40s. Check the PC.";
  };

  edit.onclick = () => {
    if (input.readOnly) {
      input.readOnly = false;
      input.type = "text";      // you cannot proof-read a row of dots
      paint();
      input.focus();
      input.select();
    } else {
      input.value = link.token;
      input.readOnly = true;
      input.type = "password";
      paint();
    }
  };
  input.oninput = paint;

  const go = async () => {
    msg.className = "sheet-note";
    msg.textContent = "Looking…";
    await connect();
    if (online()) {
      // Typed by hand and just used to reach the engine: this is the moment
      // the other devices should be given it, and at the desk it is the only
      // moment -- a hosted page beside the PC connects over 127.0.0.1, which
      // never exercises the token at all.
      if (link.token) { rememberGoodToken(link.token); cloudPublishToken(link.token); }
      msg.className = "sheet-ok"; msg.textContent = `${linkLabel().main} — ${linkLabel().sub}.`; setTimeout(done, 700); boot();
    } else {
      msg.className = "sheet-err"; msg.textContent = `${linkLabel().main} — ${linkLabel().sub}.`;
      paint();
    }
  };
  save.onclick = () => {
    saveToken(input.value.trim());
    input.readOnly = true; input.type = "password";
    go();
  };
  revert.onclick = () => {
    const g = good();
    if (!g) return;
    input.value = g;
    saveToken(g);
    input.readOnly = true; input.type = "password";
    paint();
    go();
  };
  retry.onclick = go;
  input.onkeydown = (e) => { if (e.key === "Enter" && !save.disabled) save.click(); };

  paint();
  sheet.append(box);
  document.body.append(sheet);
}

function renderOfflineNote() {
  const n = $("offlineNote");
  if (online() || link.where === "seeking") return show(n, false);
  n.innerHTML = "";
  const why = {
    "no API token set": "The engine is not answering on this device, and no API token has reached this browser yet — so there is nothing to look up a tunnel with. Open MAGI once on the engine device and it hands the token over automatically.",
    "token rejected": "The engine is there, but it did not accept this token.",
    "engine has not published": "The engine has not published a tunnel yet. A restart keeps the address it already had, so this normally means the PC is asleep or off, MAGI is not running on it, or it is starting up and the first tunnel has not registered in DNS yet (a minute or so from cold). This page keeps trying on its own and will connect as soon as it can.",
    "tunnel is dead": "The published tunnel no longer answers. A restart of the engine keeps the same address, so this usually means the PC slept or lost its network and Cloudflare dropped the tunnel; the engine opens a replacement when it notices. This page keeps trying on its own.",
    "backend not responding": "The backend is not answering on this machine.",
    "backend wants a token": "The engine is running but is asking for the API token, and this page has none saved.",
  }[link.detail] || "The engine is not reachable.";
  const p = el("div");
  p.innerHTML = `<b>Engine offline.</b> ${why}`;
  n.append(p);

  /* Say the actual rule, every time.
   *
   *  "Engine offline" plus a token button reads like something this page got
   *  wrong, and on a phone that is the whole screen -- so the obvious response
   *  is to fiddle with the token, which is almost never what is wrong. What is
   *  almost always wrong is that the machine holding the logged-in Chrome
   *  sessions went to sleep. A web page cannot wake it, cannot start anything
   *  on it, and no amount of retrying here will change that; the fix is
   *  physical and happens at the other end. */
  const rule = el("div", "offline-rule");
  rule.innerHTML =
    "MAGI runs on <b>one device</b> — the one holding your logged-in Chrome " +
    "sessions. That device has to be <b>awake and signed in</b> before a " +
    "deliberation can run anywhere, and opening this page cannot wake it.";
  n.append(rule);

  // True and worth saying: the cloud copy is independent of the engine, so the
  // page is not actually dead.
  const still = el("div", "offline-rule");
  still.textContent =
    "Past deliberations still open from here — they are read from the cloud, not from the engine.";
  n.append(still);

  const bar = el("div", "offline-actions");
  const b = el("button", null, sameOrigin ? "Retry" : "Set token / retry");
  b.onclick = sameOrigin ? () => connect().then(boot) : openSetup;
  const how = el("button", null, "How MAGI works");
  how.onclick = openHow;
  bar.append(b, how);
  n.append(bar);
  show(n, true);
}

/* ══ sound ═════════════════════════════════════════════════════════════════
   The deliberation tones, synthesised with Web Audio rather than shipped as
   files: a handful of oscillators keeps this a single file with no binary
   assets, and nothing to load before the first one can play.

   Two voices have been through here. A dry square-wave buzz after the
   Evangelion deliberation sequence -- the right idea, played through every odd
   harmonic at full strength, and wearing at 2kHz every 1.6 seconds. Then
   struck sines with an octave partial, which fixed the harshness and landed
   somewhere anonymous: an octave adds no colour, so it read as a clean beep
   rather than as an instrument.

   Then struck glass on stacked fifths, which fixed the anonymity and brought
   two problems of its own: bell partials heard dry and close clang rather than
   ring, and bare fifths are austere at the exact moment the council has
   finally agreed on something.

   This one is a soft mallet on warm metal, in a room. Harmonic partials carry
   the body and a single inharmonic one survives as the strike, gone in a tenth
   of a second. Everything is fed to a generated reverb, which is what stops a
   synthesised tone happening inside your head. The harmony keeps a bare fifth
   while the council is working -- nothing has been decided yet -- and warms to
   D major with a ninth when it lands, falling to a low D left ringing when
   there is no quorum.

   Nothing here creates an AudioContext on load — browsers block audio until a
   user gesture, so it is built lazily on the first beep, which always follows
   the click that starts a run. */
let actx = null, master = null, room = null;

/* How loud the console is, in one place -- audio() sets it and applyMute()
   restores it, and two constants that must agree is one constant.
   Above 1 deliberately: these are quiet, widely-spaced tones whose peaks sit
   around a tenth of full scale even here, so there is room to be heard over a
   laptop fan without any risk of clipping. The warmer voice needed it twice
   over, because the ear is least sensitive exactly where that voice gave up
   energy -- the old bright one measured the same peak and sounded louder. */
const VOLUME = 1.5;

/** A small dark room, generated rather than downloaded.
 *
 *  This is the single biggest thing separating a tone that sounds like an
 *  instrument from one that sounds like a beep. Dry synthesis arrives with no
 *  space around it -- it happens INSIDE your head rather than in front of you
 *  -- and no amount of work on the spectrum fixes that. A reverb tail does.
 *
 *  The impulse is exponentially decaying noise, which is the cheapest thing
 *  that behaves like a room, filtered dark on the way in so the tail is a
 *  bloom rather than a hiss. Around a second and a half: long enough to hear
 *  as space, short enough that the deliberating tone's tail has faded before
 *  the next one lands. */
function buildRoom(ac) {
  const seconds = 1.5, len = Math.floor(ac.sampleRate * seconds);
  const buf = ac.createBuffer(2, len, ac.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) {
      const t = i / len;
      // Squared decay, plus a short pre-delay of near-silence so the direct
      // sound is heard before the room answers it.
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 3.4) * (t < 0.012 ? t / 0.012 : 1);
    }
  }
  const conv = ac.createConvolver();
  conv.buffer = buf;
  const dark = ac.createBiquadFilter();
  dark.type = "lowpass";
  dark.frequency.value = 2600;
  const wet = ac.createGain();
  wet.gain.value = 0.9;
  dark.connect(conv).connect(wet).connect(master);
  return dark;                    // send tones here to put them in the room
}

function audio() {
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    actx = new AC();
    master = actx.createGain();
    // Muted from the first tone when muted -- this used to start at full
    // volume regardless, and only listened to the setting once it was toggled.
    master.gain.value = S.muted ? 0 : VOLUME;
    master.connect(actx.destination);
    // Not fatal if unavailable: the tones simply stay dry.
    try { room = buildRoom(actx); } catch { room = null; }
  }
  // Autoplay policy can leave a context suspended even after a gesture, and a
  // backgrounded tab (or iOS, as "interrupted") can suspend one later.
  if (actx.state !== "running" && actx.state !== "closed") actx.resume().catch(() => {});
  return actx;
}

/* Audio is unlocked by the first click or key anywhere, not by the first
   tone. A run can start with no gesture at all -- the queue, a retry, a
   handoff from TradeHub -- and a context first created then is born
   suspended, so the opening tones had nowhere to go. Creating it silently on
   the first gesture means it is already running when the council starts. */
function unlockAudio() {
  window.removeEventListener("pointerdown", unlockAudio, true);
  window.removeEventListener("keydown", unlockAudio, true);
  audio();
}
window.addEventListener("pointerdown", unlockAudio, true);
window.addEventListener("keydown", unlockAudio, true);

/** One struck tone.
 *
 *  THE VOICE, and the two it replaced. First a square wave -- the right idea
 *  (an Evangelion console) carried by every odd harmonic at full strength, and
 *  genuinely tiring over a two-minute run. Then struck sines with an octave
 *  partial: clean, and a little anonymous, because an octave is the one
 *  interval that adds no colour.
 *
 *  Then struck glass, with bell partials at 2.76x and 5.40x. Those ratios are
 *  what a tubular bell really has, and they are also why a bell needs a
 *  cathedral: heard dry and close, inharmonic partials do not ring, they
 *  CLANG. That is the note this lands on instead -- a soft mallet on warm
 *  metal, in a room:
 *
 *    · HARMONIC partials carry the body -- the octave and the twelfth, both
 *      quiet. Whole-number ratios fuse into one note, which is what makes a
 *      tone sound like a pitch rather than a collision.
 *    · ONE inharmonic partial survives, at a fifth of its old level and a
 *      third of its old life. It is the strike, not the tone: present for
 *      about a tenth of a second, which reads as "struck" and is gone before
 *      it can sour anything.
 *    · A twin detuned by half of what it was. Two sines a thousandth apart
 *      beat slowly enough to shimmer; at three thousandths they beat fast
 *      enough to sound out of tune, which is what the last version did on the
 *      high notes.
 *    · A 28ms attack, nearly twice as long. Below about 10ms a tone starts
 *      with a click; this is the difference between struck and hit.
 *    · The room, above, at a level set per tone -- more on the ones that are
 *      meant to ring, less on the tick that fires four times in a second.
 */
function strike({ freq, at = 0, dur = 0.9, gain = 0.07, bright = 1, pan = 0, wet = 0.3 }) {
  const ac = audio();
  if (!ac) return;
  // THE LOUD BURST. A suspended context's clock is frozen, so every tone
  // scheduled while it is suspended lands on the same instant -- silence
  // first, then, the moment resume() takes effect, every queued strike at
  // once, stacked into one far-too-loud chord. These are status cues, so a
  // tone that cannot play now is dropped rather than queued: missing one is
  // harmless, a pile-up is not. audio() has already asked for a resume.
  if (ac.state !== "running") return;
  const t = ac.currentTime + at;

  // Opens with pitch so low tones stay warm and high ones keep their edge,
  // and capped well under Nyquist so nothing can alias.
  const lp = ac.createBiquadFilter();
  lp.type = "lowpass";
  lp.frequency.setValueAtTime(Math.min(freq * 6, 12000), t);
  lp.Q.setValueAtTime(0.5, t);

  let out = lp;
  // Not in every engine MAGI might run in, and a missing panner must cost the
  // sound its width, not its existence.
  if (ac.createStereoPanner && pan) {
    const pn = ac.createStereoPanner();
    pn.pan.setValueAtTime(Math.max(-1, Math.min(1, pan)), t);
    lp.connect(pn);
    out = pn;
  }
  out.connect(master);
  if (room && wet > 0) {
    const send = ac.createGain();
    send.gain.setValueAtTime(wet, t);
    out.connect(send).connect(room);
  }

  // [ratio, level, how much faster this partial dies than the fundamental]
  const PARTIALS = [
    [1,     1.00, 1.00],
    [1.0015, 0.55, 1.00],        // the twin -- a slow shimmer, not a beat
    [2,     0.16, 0.60],         // octave: body
    [3,     0.05, 0.40],         // twelfth: a little air
    [2.76,  0.06 * bright, 0.12] // the strike itself, gone almost at once
  ];
  for (const [mult, level, decay] of PARTIALS) {
    if (level <= 0) continue;
    const life = Math.max(0.08, dur * decay);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain * level, t + 0.028);
    // exponentialRamp never reaches zero, so it is taken to a floor and the
    // oscillator stopped just after.
    g.gain.exponentialRampToValueAtTime(0.0001, t + life);
    const osc = ac.createOscillator();
    osc.type = "sine";
    osc.frequency.setValueAtTime(freq * mult, t);
    osc.connect(g).connect(lp);
    osc.start(t);
    osc.stop(t + life + 0.05);
  }
}

/* D, and warmer than it was. The fifths-only version was chosen so nothing
 * would sound like a product chime finishing a task -- correct while the
 * council is still working, and needlessly austere at the moment it arrives at
 * something. So the deliberating tone keeps its bare fifth, and the verdict
 * gets a third and a ninth: D - F# - A - E, which resolves without closing,
 * because it lands on the ninth rather than thumping back onto the root. */
const N = { D3: 146.83, F3: 174.61, A3: 220.00, D4: 293.66, E4: 329.63,
            F4: 349.23, Fs4: 369.99, A4: 440.00, D5: 587.33, E5: 659.25,
            A5: 880.00 };

/** Deliberating: one struck fifth, low and quiet, every cycle for as long as
 *  the council works. Dropped an octave from where it was -- the same interval
 *  sits under the ear down here instead of in front of it, which is what you
 *  want from something you will hear eighty times. Rolled, not struck flat. */
const beepProcessing = () => {
  strike({ freq: N.A3, at: 0,    dur: 1.30, gain: 0.046, bright: 0.5, pan: -0.16, wet: 0.22 });
  strike({ freq: N.E4, at: 0.05, dur: 1.15, gain: 0.036, bright: 0.5, pan: 0.16, wet: 0.22 });
};

/** A unit reporting in: one brief tick, barely there. Four of these can land
 *  inside a second, so it is the driest and shortest thing here. */
const beepUnit = () =>
  strike({ freq: N.A5, dur: 0.40, gain: 0.044, bright: 0.9, wet: 0.18 });

/** Consensus: D major with a ninth on top, rolled upward and opening across
 *  the field, the last note left to ring for two and a half seconds in the
 *  room. It arrives rather than cadences -- no leading tone, and it finishes
 *  on the ninth, so it sounds finished without sounding like a jingle. */
const beepResolved = () => {
  strike({ freq: N.D4,  at: 0,    dur: 1.60, gain: 0.056, bright: 0.7, pan: -0.30, wet: 0.34 });
  strike({ freq: N.Fs4, at: 0.11, dur: 1.80, gain: 0.051, bright: 0.8, pan: -0.10, wet: 0.36 });
  strike({ freq: N.A4,  at: 0.22, dur: 2.10, gain: 0.049, bright: 0.8, pan: 0.12, wet: 0.38 });
  strike({ freq: N.E5,  at: 0.33, dur: 2.50, gain: 0.042, bright: 0.9, pan: 0.32, wet: 0.42 });
};

/** No quorum: the same gesture inverted. Falling, and landing on a low D that
 *  is still ringing after everything above it has gone -- with an F natural on
 *  the way down, so what is left is a minor colour rather than a buzzer. It
 *  should read as "this did not land", never as an alarm. */
const beepBlocked = () => {
  strike({ freq: N.A4, at: 0,    dur: 1.10, gain: 0.051, bright: 0.7, pan: 0.20, wet: 0.32 });
  strike({ freq: N.F4, at: 0.15, dur: 1.40, gain: 0.046, bright: 0.6, pan: -0.20, wet: 0.34 });
  strike({ freq: N.D3, at: 0.30, dur: 2.60, gain: 0.041, bright: 0.3, wet: 0.40 });
};

function applyMute() {
  if (master && actx) master.gain.setTargetAtTime(S.muted ? 0 : VOLUME, actx.currentTime, 0.01);
  try { localStorage.setItem("magi.muted", S.muted ? "1" : "0"); } catch {}
}

/* ══ vocabulary ════════════════════════════════════════════════════════════ */
const WORKING = new Set(["queued", "launching", "navigating", "typing", "waiting", "streaming"]);

/** The MAGI units are named systems, not brands — each member gets one. */
// Adam and Lilith are the two seeds of life; the first four are the MAGI
// themselves. A fifth unit needed a name that belongs to the same story.
/* Each unit's name and colour, known to the console itself.
 *
 *  The colour used to come ONLY from the engine's provider list, so on a
 *  device that had not reached the engine yet -- a phone, a fresh tab, the
 *  first second after load -- every unit dot in the queue fell back to grey,
 *  and a row stopped saying who it was going to ask. Same values as
 *  config/selectors.yaml; the engine's list still wins when it has loaded.
 */
const UNIT_FALLBACK = [
  { id: "claude", display_name: "Claude", accent: "#e0b874" },
  { id: "chatgpt", display_name: "ChatGPT", accent: "#a4b986" },
  { id: "gemini", display_name: "Gemini", accent: "#8fa6d8" },
  { id: "deepseek", display_name: "DeepSeek", accent: "#c0aeea" },
  { id: "perplexity", display_name: "Perplexity", accent: "#7fcac2" },
  { id: "grok", display_name: "Grok", accent: "#e5a9c6" },
];

/** The units to offer: the engine's list when there is one, else the known set. */
function knownUnits() {
  if (S.providers && S.providers.length) return orderedProviders();
  const order = S.unitOrder || [];
  return [...UNIT_FALLBACK].sort((a, b) => {
    const ia = order.indexOf(a.id), ib = order.indexOf(b.id);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  });
}

/** One unit's colour, never grey for a unit MAGI knows. */
function unitAccent(id) {
  const p = (S.providers || []).find((x) => x.id === id)
         || UNIT_FALLBACK.find((x) => x.id === id);
  return (p && p.accent) || "var(--bdl)";
}

function unitName(id) {
  const p = (S.providers || []).find((x) => x.id === id)
         || UNIT_FALLBACK.find((x) => x.id === id);
  return (p && p.display_name) || id;
}

const UNIT = { chatgpt: "MELCHIOR·01", claude: "BALTHASAR·02", gemini: "CASPER·03",
               deepseek: "ADAM·04", perplexity: "LILITH·05",
               grok: "TABRIS·06",
               // The same model as BALTHASAR, on the subscription account.
               "claude-pro": "ARMISAEL·07" };

/** Terse console wording for each machine state. */
const STATE_LABEL = {
  queued: "standby", launching: "booting", navigating: "linking",
  typing: "querying", waiting: "thinking", streaming: "reporting",
  done: "resolved",
  // The unit responded, but what came back was not an answer. Deliberately
  // NOT "resolved" (it did not resolve) and not "offline" (it was reachable
  // and did reply) — conflating it with either is what produced a silent
  // "4/4 resolved" on a run where one unit returned a clarifying question.
  degraded: "unusable",
  failed: "offline", skipped: "skipped", idle: "standby",
  // Set by the console the instant Halt is pressed, so a unit stops claiming
  // to be thinking while the engine is still winding its browser down. The
  // engine's own final word overwrites it if it arrives.
  halted: "halted",
};

/** Phase offset per unit, so the working blocks pulse out of step with each
 *  other instead of blinking in unison. Fixed per unit rather than derived
 *  from position, so a unit keeps its own rhythm when others drop out. */
const PHASE = { chatgpt: "0s", claude: "-0.48s", gemini: "-0.95s",
                deepseek: "-1.42s", perplexity: "-1.90s", grok: "-2.37s",
                "claude-pro": "-2.85s" };

function badgeClass(s, ok) {
  if (s === "done") return ok === false ? "failed" : "done";
  if (s === "degraded") return "degraded";
  if (s === "failed") return "failed";
  if (WORKING.has(s)) return "working";
  return "idle";
}

/** Rough progress for the collapsed strip. There is no real total to divide
 *  by — the model never says how long its answer will be — so this is a
 *  saturating curve on characters received: informative about movement, and
 *  deliberately never claiming to reach 100% until the unit actually
 *  resolves. */
function progressPct(p) {
  if (p.state === "done" || p.state === "failed") return 100;
  if (!p.chars) return WORKING.has(p.state) ? 4 : 0;
  return Math.min(92, 4 + (1 - Math.exp(-p.chars / 900)) * 88);
}

const fmtBytes = (n) =>
  n < 1024 ? `${n}B` : n < 1048576 ? `${(n / 1024).toFixed(0)}KB` : `${(n / 1048576).toFixed(1)}MB`;

/* ══ verdict rendering ═════════════════════════════════════════════════════
   The chairman writes ANSWER / NOTES / CONFIDENCE with light markdown inside.
   It is parsed into a small block tree rather than rendered inline, because
   the answer body and the caveats end up in DIFFERENT columns — which a flat
   node list cannot express. */

const SECTION = /^\s*(?:#{1,4}\s*)?(ANSWER|NOTES|CONFIDENCE|VERDICT|AGREEMENTS|DISAGREEMENTS|CAVEATS)\b\s*:?\s*$/i;
const HEADING = /^\s*#{1,6}\s+(.+?)\s*$/;
const BULLET = /^(\s*)[-*•]\s+(.*)$/;
const NUMBERED = /^(\s*)(\d+)[.)]\s+(.*)$/;
/* The rating is split off into a tag only when a separator or a sentence break
 * follows it — "HIGH — the members agreed" or "HIGH. Everyone agreed". The
 * chairman often writes the rating as the SUBJECT of the sentence instead
 * ("HIGH on the architecture and the build order, ..."), and splitting there
 * strands a fragment that starts mid-clause in lowercase. In that case the
 * whole line stays together and the tag is derived without consuming it. */
const CONF = /^\s*(HIGH|MEDIUM|LOW)\b\s*(?:[-—:.]+\s*|,\s+)(.+)$/i;
/** Any line that merely OPENS with a rating, used when CONF does not split. */
const CONF_LEAD = /^\s*(HIGH|MEDIUM|LOW)\b/i;
const TABLE_ROW = /^\s*\|(.+)\|\s*$/;
const TABLE_SEP = /^\s*\|?[\s:|-]*-[\s:|-]*\|?\s*$/;

/** Splits a `| a | b |` line into trimmed cells. */
const cells = (line) => (line.match(TABLE_ROW)?.[1] ?? line).split("|").map((c) => c.trim());

/* Inline markdown, built as DOM -- never innerHTML, so nothing a model writes
 * can become markup.
 *
 *  Covers what the units actually produce: ***bold italic***, **bold** and
 *  __bold__, *italic* and _italic_, ~~strike~~, `code`, [links](https://...)
 *  and bare URLs. Emphasis nests (a bold phrase containing a link or code
 *  renders both), because models write exactly that constantly -- "**See
 *  [the docs](...)**" came out as literal asterisks around a raw bracket.
 *
 *  Only http, https and mailto links are made clickable. Anything else is left
 *  as text: a "javascript:" link from a model is not something to hand the
 *  browser.
 */
const INLINE_RE = new RegExp([
  "\\\\(?<esc>[\\\\`*_{}\\[\\]()#+\\-.!|~>$<])",                    // \* -> *
  "(?<tick>`+)(?<code>[\\s\\S]+?)\\k<tick>",                         // code
  "<!--[\\s\\S]*?-->",                                               // comment: hidden
  "<br\\s*\\/?>",                                                    // <br>
  // A short allowlist of inline HTML, rebuilt as fresh elements -- never
  // parsed as markup, so no attribute, handler or script can come along.
  "<(?<tag>kbd|sub|sup|mark|u|ins|del|s|b|i|strong|em|small|abbr|code|q|cite|var|samp)(?<attrs>\\s[^<>]*)?>(?<tin>[\\s\\S]*?)<\\/\\k<tag>\\s*>",
  "&(?<ent>[a-zA-Z]{2,8}|#\\d{1,6}|#x[0-9a-fA-F]{1,6});",           // &copy; &#169;
  "\\$\\$(?<mathd>[^$]+?)\\$\\$",                                   // $$display$$
  "\\\\\\[(?<mathb>[\\s\\S]+?)\\\\\\]",                             // \[display\]
  "\\\\\\((?<mathp>[\\s\\S]+?)\\\\\\)",                             // \(inline\)
  // $inline$. Not "$5 and $10": the opening $ must be followed by something
  // other than a digit or a space, and the closing one must not touch a word.
  "(?<![\\\\$\\w])\\$(?=[^\\s$\\d])(?<math>[^$\\n]*?[^\\s$\\\\])\\$(?![\\w$])",
  "\\[\\^(?<fn>[^\\]\\s]+)\\]",                                     // [^1]
  "\\*\\*\\*(?=\\S)(?<bi>[\\s\\S]+?\\S)\\*\\*\\*",                   // bold italic
  "\\*\\*(?=\\S)(?<b>[\\s\\S]+?\\S)\\*\\*",                         // bold
  "(?<![\\w_])__(?=\\S)(?<b2>[\\s\\S]+?\\S)__(?![\\w_])",           // bold
  "~~(?=\\S)(?<s>[\\s\\S]+?\\S)~~",                                 // strike
  "(?<![*\\w\\\\])\\*(?=[^\\s*])(?<i>[^*\\n]+?[^\\s*\\\\]|[^\\s*])\\*(?![*\\w])", // italic
  "(?<![\\w_\\\\])_(?=[^\\s_])(?<i2>[^_\\n]+?[^\\s_\\\\]|[^\\s_])_(?![\\w_])",     // italic
  "\\[(?<lt>[^\\]\\n]+)\\]\\(\\s*(?<href>[^)\\s]+)(?:\\s+\"[^\"]*\")?\\s*\\)",    // link
  "(?<url>https?:\\/\\/[^\\s<>()\\[\\]]+[^\\s<>()\\[\\].,;:!?'\"])",              // bare url
].join("|"), "g");

const SAFE_HREF = /^(https?:\/\/|mailto:)/i;

/* Inline markdown, built as DOM -- never innerHTML, so nothing a model writes
 * can become markup.
 *
 *  A backslash makes the next character literal, the way every markdown
 *  renderer treats it: "\*not italic\*" and "\# not a heading" are what a
 *  model writes when it means the symbols themselves, and the engine now
 *  escapes text the chat page showed literally, for the same reason.
 */
function inline(host, text) {
  const src = String(text == null ? "" : text);
  let last = 0, m;
  // A fresh regex per call: inline recurses, and a shared global regex would
  // have its lastIndex moved underneath the outer loop.
  const re = new RegExp(INLINE_RE.source, "g");
  while ((m = re.exec(src))) {
    const g = m.groups;
    if (m.index > last) host.append(src.slice(last, m.index));
    if (g.esc !== undefined) {
      host.append(g.esc);
    } else if (g.code !== undefined) {
      host.append(el("code", "md-code", g.code.replace(/^ (.*) $/, "$1")));
    } else if (/^<!--/.test(m[0])) {
      // an HTML comment is a note to the renderer, not text
    } else if (/^<br/i.test(m[0])) {
      host.append(el("br"));
    } else if (g.tag !== undefined) {
      const t = g.tag.toLowerCase();
      const n = t === "code" ? el("code", "md-code", g.tin) : inline(el(t, "md-html"), g.tin);
      // Only a title survives from the attributes, and only as text.
      const title = g.attrs && g.attrs.match(/\btitle\s*=\s*(?:"([^"]*)"|'([^']*)')/i);
      if (title) n.title = title[1] !== undefined ? title[1] : title[2];
      host.append(n);
    } else if (g.ent !== undefined) {
      host.append(htmlEntity(g.ent, m[0]));
    } else if (g.mathd !== undefined || g.mathb !== undefined) {
      host.append(mathEl(g.mathd !== undefined ? g.mathd : g.mathb, true));
    } else if (g.mathp !== undefined || g.math !== undefined) {
      host.append(mathEl(g.mathp !== undefined ? g.mathp : g.math, false));
    } else if (g.fn !== undefined) {
      host.append(el("sup", "md-fn", g.fn));
    } else if (g.bi !== undefined) {
      const b = el("strong"); const it = el("em"); inline(it, g.bi); b.append(it); host.append(b);
    } else if (g.b !== undefined || g.b2 !== undefined) {
      host.append(inline(el("strong"), g.b !== undefined ? g.b : g.b2));
    } else if (g.s !== undefined) {
      host.append(inline(el("s"), g.s));
    } else if (g.i !== undefined || g.i2 !== undefined) {
      host.append(inline(el("em"), g.i !== undefined ? g.i : g.i2));
    } else if (g.lt !== undefined) {
      if (SAFE_HREF.test(g.href)) {
        const a = el("a", "md-link");
        a.href = g.href; a.target = "_blank"; a.rel = "noopener noreferrer";
        inline(a, g.lt);
        host.append(a);
      } else {
        inline(host, g.lt);
      }
    } else if (g.url !== undefined) {
      const a = el("a", "md-link", g.url);
      a.href = g.url; a.target = "_blank"; a.rel = "noopener noreferrer";
      host.append(a);
    }
    last = m.index + m[0].length;
  }
  if (last < src.length) host.append(src.slice(last));
  return host;
}

/* An HTML entity, decoded without an HTML parser: named ones from a short
 *  table of what models actually write, numeric ones by code point. Anything
 *  unrecognised stays as written. */
const ENTITIES = {
  amp: "&", lt: "<", gt: ">", quot: "\"", apos: "'", nbsp: "\u00a0", copy: "\u00a9",
  reg: "\u00ae", trade: "\u2122", mdash: "\u2014", ndash: "\u2013", hellip: "\u2026",
  laquo: "\u00ab", raquo: "\u00bb", ldquo: "\u201c", rdquo: "\u201d", lsquo: "\u2018",
  rsquo: "\u2019", bull: "\u2022", middot: "\u00b7", deg: "\u00b0", plusmn: "\u00b1",
  times: "\u00d7", divide: "\u00f7", rarr: "\u2192", larr: "\u2190", uarr: "\u2191",
  darr: "\u2193", harr: "\u2194", check: "\u2713", euro: "\u20ac", pound: "\u00a3",
  yen: "\u00a5", cent: "\u00a2", sect: "\u00a7", para: "\u00b6", le: "\u2264", ge: "\u2265",
  ne: "\u2260", infin: "\u221e", asymp: "\u2248", micro: "\u00b5", frac12: "\u00bd",
  frac14: "\u00bc", frac34: "\u00be", sup2: "\u00b2", sup3: "\u00b3", ensp: "\u2002",
  emsp: "\u2003", thinsp: "\u2009", zwj: "\u200d", zwnj: "\u200c",
};
function htmlEntity(ent, raw) {
  if (ent[0] === "#") {
    const cp = ent[1] === "x" || ent[1] === "X" ? parseInt(ent.slice(2), 16) : parseInt(ent.slice(1), 10);
    return cp > 0 && cp <= 0x10ffff && !(cp >= 0xd800 && cp <= 0xdfff) ? String.fromCodePoint(cp) : raw;
  }
  return Object.prototype.hasOwnProperty.call(ENTITIES, ent) ? ENTITIES[ent] : raw;
}

/* ── math ─────────────────────────────────────────────────────────────────
 *  TeX is typeset with KaTeX, fetched the first time an answer contains any
 *  math and never otherwise. Until it arrives -- or if it cannot -- the TeX
 *  itself is shown in the code face, which is readable, rather than the
 *  flattened glyph soup ("∫0∞e−xdx=1") the answer used to arrive as. */
const KATEX = "https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/";
let katexReady = null;
function loadKatex() {
  if (window.katex) return Promise.resolve(window.katex);
  if (katexReady) return katexReady;
  katexReady = new Promise((resolve, reject) => {
    const css = document.createElement("link");
    css.rel = "stylesheet"; css.href = KATEX + "katex.min.css";
    document.head.append(css);
    const js = document.createElement("script");
    js.src = KATEX + "katex.min.js";
    js.onload = () => resolve(window.katex);
    js.onerror = () => { katexReady = null; reject(new Error("katex")); };
    document.head.append(js);
  });
  return katexReady;
}

function mathEl(tex, display) {
  const n = el(display ? "div" : "span", display ? "md-math md-math-block" : "md-math", tex.trim());
  loadKatex().then((k) => {
    try {
      k.render(tex.trim(), n, { displayMode: display, throwOnError: false, output: "htmlAndMathml" });
      n.classList.add("typeset");
    } catch {}
  }).catch(() => {});
  return n;
}


/* Block markdown -> a small AST.
 *
 *  What it replaced swallowed fenced code (the fence lines were dropped and the
 *  code rendered as prose), rendered every heading level identically, capped
 *  lists at two levels, and had no blockquotes, rules or task lists. Models
 *  use all of those in ordinary answers, so the gaps showed up as literal
 *  markup or as a report with no visible structure.
 */
const MD = {
  fence: /^(\s*)(`{3,}|~{3,})\s*([\w+#.-]*)\s*$/,
  heading: /^\s{0,3}(#{1,6})\s+(.+?)\s*#*\s*$/,
  hr: /^\s{0,3}([-*_])(\s*\1){2,}\s*$/,
  quote: /^\s{0,3}>\s?(.*)$/,
  bullet: /^(\s*)([-*+•])\s+(.*)$/,
  ordered: /^(\s*)(\d{1,9})([.)])\s+(.*)$/,
  task: /^\[([ xX])\]\s+(.*)$/,
  math: /^\s*(\$\$|\\\[)\s*$/,
  mathLine: /^\s*(?:\$\$([\s\S]+)\$\$|\\\[([\s\S]+)\\\])\s*$/,
  footdef: /^\s{0,3}\[\^([^\]\s]+)\]:\s*(.*)$/,
  details: /^\s{0,3}<details(\s[^>]*)?>/i,
  // A line that is nothing but a wrapper tag or a comment: it shapes HTML
  // layout, which a rendered answer does not have, so it is dropped and what
  // it wraps is rendered as usual.
  htmlShell: /^\s{0,3}(?:<\/?(?:div|p|span|center|section|article|header|footer|main|aside|figure|figcaption)(?:\s[^>]*)?>\s*)+$|^\s{0,3}<!--[\s\S]*?-->\s*$/i,
};

/* A code block with no language whose first line IS a language name was
 *  captured with the page's label inside it ("Python" above the code).
 *  Answers saved before the engine learned to separate the two are repaired
 *  here, rather than showing the label as a line of code. */
const CODE_LANGS = new Set(("python py javascript js typescript ts jsx tsx json html css scss " +
  "bash sh shell zsh powershell ps1 sql java kotlin swift go golang rust c cpp c++ csharp c# " +
  "ruby php r matlab yaml yml toml xml markdown md plaintext text lua perl scala dart haskell").split(" "));

function mdParse(text) {
  const lines = String(text || "").replace(/\r\n?/g, "\n").replace(/\t/g, "    ").split("\n");
  const out = [];
  const notes = [];
  let i = 0;

  const isTableRow = (l) => TABLE_ROW.test(l) || (/\|/.test(l) && /\S/.test(l.replace(/\|/g, "")) && l.split("|").length > 2);
  const startsBlock = (l, next) =>
    MD.fence.test(l) || MD.heading.test(l) || MD.quote.test(l) ||
    MD.math.test(l) || MD.mathLine.test(l) || MD.footdef.test(l) ||
    MD.details.test(l) || MD.htmlShell.test(l) ||
    MD.bullet.test(l) || MD.ordered.test(l) || MD.hr.test(l) ||
    (isTableRow(l) && next !== undefined && TABLE_SEP.test(next));

  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }

    // ── fenced code: kept verbatim, language remembered ─────────────────────
    const f = line.match(MD.fence);
    if (f) {
      const fence = f[2], body = [];
      i++;
      while (i < lines.length && !new RegExp(`^\\s*${fence[0]}{${fence.length},}\\s*$`).test(lines[i])) {
        body.push(lines[i]); i++;
      }
      i++;                               // the closing fence, if there was one
      let lang = f[3] || "";
      if (!lang && body.length > 1 && CODE_LANGS.has(body[0].trim().toLowerCase())) {
        lang = body.shift().trim().toLowerCase();
      }
      out.push({ kind: "code", lang, text: body.join("\n") });
      continue;
    }

    // ── display math: $$ ... $$ or \[ ... \], on its own lines or one ──────
    const ml = line.match(MD.mathLine);
    if (ml) { out.push({ kind: "math", tex: ml[1] !== undefined ? ml[1] : ml[2] }); i++; continue; }
    const mo = line.match(MD.math);
    if (mo) {
      const close = mo[1] === "$$" ? /^\s*\$\$\s*$/ : /^\s*\\\]\s*$/;
      const body = [];
      i++;
      while (i < lines.length && !close.test(lines[i])) { body.push(lines[i]); i++; }
      i++;
      out.push({ kind: "math", tex: body.join("\n") });
      continue;
    }

    if (MD.htmlShell.test(line)) { i++; continue; }

    // ── <details>: a collapsible section, its body markdown in its own right ─
    if (MD.details.test(line)) {
      const open = /\bopen\b/i.test((line.match(MD.details) || [])[1] || "");
      const buf = [];
      let depth = 0;
      while (i < lines.length) {
        const l = lines[i];
        depth += (l.match(/<details(\s[^>]*)?>/gi) || []).length;
        depth -= (l.match(/<\/details\s*>/gi) || []).length;
        buf.push(l);
        i++;
        if (depth <= 0) break;
      }
      let body = buf.join("\n")
        .replace(/^\s*<details(\s[^>]*)?>/i, "")
        .replace(/<\/details\s*>\s*$/i, "");
      let summary = "Details";
      const sm = body.match(/<summary(?:\s[^>]*)?>([\s\S]*?)<\/summary\s*>/i);
      if (sm) { summary = sm[1].trim() || summary; body = body.replace(sm[0], ""); }
      out.push({ kind: "details", open, summary, blocks: mdParse(body) });
      continue;
    }

    // ── footnote definitions: gathered, and listed at the end ───────────────
    const fd = line.match(MD.footdef);
    if (fd) {
      const text = [fd[2]];
      i++;
      while (i < lines.length && /^\s{2,}\S/.test(lines[i])) { text.push(lines[i].trim()); i++; }
      notes.push({ id: fd[1], text: text.join(" ") });
      continue;
    }

    const h = line.match(MD.heading);
    if (h) { out.push({ kind: "h", level: h[1].length, text: h[2] }); i++; continue; }

    // ── table: a header row with a separator under it ───────────────────────
    if (isTableRow(line) && i + 1 < lines.length && TABLE_SEP.test(lines[i + 1])) {
      const head = cells(line);
      const align = cells(lines[i + 1]).map((c) =>
        /^:-+:$/.test(c) ? "center" : /^-+:$/.test(c) ? "right" : /^:-+$/.test(c) ? "left" : "");
      const rows = [];
      i += 2;
      while (i < lines.length && lines[i].trim() && isTableRow(lines[i])) {
        rows.push(cells(lines[i])); i++;
      }
      out.push({ kind: "table", head, align, rows });
      continue;
    }

    if (MD.hr.test(line)) { out.push({ kind: "hr" }); i++; continue; }

    // ── blockquote: its own content is markdown too ─────────────────────────
    if (MD.quote.test(line)) {
      const inner = [];
      while (i < lines.length && (MD.quote.test(lines[i]) || (lines[i].trim() && inner.length && !startsBlock(lines[i], lines[i + 1])))) {
        const q = lines[i].match(MD.quote);
        inner.push(q ? q[1] : lines[i]);
        i++;
      }
      out.push({ kind: "quote", blocks: mdParse(inner.join("\n")) });
      continue;
    }

    // ── lists, nested to any depth by indentation ───────────────────────────
    if (MD.bullet.test(line) || MD.ordered.test(line)) {
      const { list, next } = parseList(lines, i);
      out.push({ kind: "list", list });
      i = next;
      continue;
    }

    // ── paragraph: until a blank line or the start of another block ─────────
    const para = [];
    while (i < lines.length && lines[i].trim() && !startsBlock(lines[i], lines[i + 1])) {
      para.push(lines[i].trim());
      i++;
    }
    out.push({ kind: "p", lines: para, text: para.join(" ") });
  }
  if (notes.length) out.push({ kind: "footnotes", notes });
  return out;
}

/* A list from `start`, with nested lists wherever indentation grows.
 *
 *  A blank line inside a list does NOT end it -- models put blank lines
 *  between bullets all the time -- unless what follows is not a list item and
 *  not indented continuation.
 */
function parseList(lines, start) {
  const itemOf = (l) => {
    const b = l.match(MD.bullet);
    if (b) return { indent: b[1].length, ordered: false, body: b[3], num: null };
    const o = l.match(MD.ordered);
    if (o) return { indent: o[1].length, ordered: true, body: o[4], num: +o[2] };
    return null;
  };
  const first = itemOf(lines[start]);
  const list = { ordered: first.ordered, start: first.num || 1, items: [] };
  const base = first.indent;
  let i = start;

  while (i < lines.length) {
    const l = lines[i];
    if (!l.trim()) {
      // Look past blank lines: still this list only if an item follows.
      let k = i + 1;
      while (k < lines.length && !lines[k].trim()) k++;
      const nx = k < lines.length ? itemOf(lines[k]) : null;
      if (!nx || nx.indent < base) break;
      i = k;
      continue;
    }
    const it = itemOf(l);
    if (it && it.indent === base) {
      if (it.ordered !== list.ordered && list.items.length) break;
      const t = it.body.match(MD.task);
      list.items.push({
        text: t ? t[2] : it.body,
        task: t ? t[1].toLowerCase() === "x" : null,
        children: [],
        extra: [],
      });
      i++;
      continue;
    }
    if (it && it.indent > base && list.items.length) {
      const sub = parseList(lines, i);
      list.items[list.items.length - 1].children.push(sub.list);
      i = sub.next;
      continue;
    }
    if (it && it.indent < base) break;
    // Indented continuation of the previous item's text.
    if (!it && list.items.length && /^\s{2,}\S/.test(l)) {
      list.items[list.items.length - 1].extra.push(l.trim());
      i++;
      continue;
    }
    break;
  }
  return { list, next: i };
}

/* The verdict: its ANSWER / NOTES / CONFIDENCE sections, each parsed as
 * markdown in its own right.
 *
 *  The section split is the only thing verdict-specific here. It used to be
 *  tangled into a line-by-line parser that had to reimplement every block
 *  type for itself, which is how the gaps above appeared.
 */
function parseVerdict(text) {
  const g = { main: [], notes: [], conf: [] };
  const buckets = { main: [], notes: [], conf: [] };
  let where = "main";
  let fenced = false;

  // A capture that lost the newline after a section label leaves it glued to
  // the text it heads ("ANSWER AI consumes...", "CONFIDENCE HIGH -- ...").
  // Only the exact UPPERCASE labels are split off, so prose that merely
  // starts with "Notes on..." is left alone.
  const lines = String(text || "").replace(/\r/g, "").split("\n").flatMap((l) => {
    const m = l.match(/^\s*(?:#{1,4}\s*)?(ANSWER|NOTES|CONFIDENCE|CAVEATS)(?:\s*:\s*|\s+)(?=\S)(.+)$/);
    return m ? [m[1], m[2]] : [l];
  });
  for (const raw of lines) {
    if (MD.fence.test(raw)) fenced = !fenced;
    const sec = !fenced && raw.match(SECTION);
    if (sec) {
      const s = sec[1].toUpperCase();
      where = s === "NOTES" || s === "CAVEATS" ? "notes" : s === "CONFIDENCE" ? "conf" : "main";
      // Verdicts archived under the older prompt open with AGREEMENTS and
      // DISAGREEMENTS before the answer; label them rather than letting the
      // deliberation notes masquerade as the answer's opening paragraph.
      if (s === "AGREEMENTS" || s === "DISAGREEMENTS" || s === "VERDICT") {
        buckets.main.push("", `### ${s[0] + s.slice(1).toLowerCase()}`, "");
      }
      continue;
    }
    buckets[where].push(raw);
  }

  // A line that is only **bold** stays bold text. It used to be promoted to a
  // sub-heading, which is how "**Bold text**" in a markdown demo rendered as
  // a "BOLD TEXT" section label; a model that wants a heading writes one.
  g.main = mdParse(buckets.main.join("\n"));
  g.notes = mdParse(buckets.notes.join("\n"));

  // Confidence: a HIGH/MEDIUM/LOW opener is a rating wherever it appears --
  // some chairmen drop the heading and just write the line.
  const pull = (list) => list.filter((b) => {
    if (b.kind !== "p") return true;
    const lead = b.text.match(CONF_LEAD);
    if (!lead) return true;
    const c = b.text.match(CONF);
    g.conf.push({ kind: "conf", level: lead[1].toUpperCase(), why: c ? c[2].trim() : b.text });
    return false;
  });
  g.main = pull(g.main);
  g.notes = pull(g.notes);
  for (const b of mdParse(buckets.conf.join("\n"))) {
    if (b.kind === "p") {
      const lead = b.text.match(CONF_LEAD);
      if (lead) {
        const c = b.text.match(CONF);
        g.conf.push({ kind: "conf", level: lead[1].toUpperCase(), why: c ? c[2].trim() : b.text });
        continue;
      }
    }
    g.conf.push(b);
  }

  // A sidebar card reading only "None." is noise.
  if (g.notes.length === 1 && g.notes[0].kind === "p" && /^none[.!]?$/i.test(g.notes[0].text))
    g.notes = [];
  return g;
}

function renderList(list) {
  const n = el(list.ordered ? "ol" : "ul", "v-list");
  if (list.ordered && list.start && list.start !== 1) n.start = list.start;
  for (const it of list.items) {
    const li = el("li");
    if (it.task !== null && it.task !== undefined) {
      li.classList.add("md-task");
      const box = el("span", `md-check ${it.task ? "on" : ""}`, it.task ? "\u2713" : "");
      box.setAttribute("aria-hidden", "true");
      li.append(box);
    }
    inline(li, it.text);
    for (const x of it.extra || []) { li.append(el("br")); inline(li, x); }
    for (const child of it.children || []) li.append(renderList(child));
    n.append(li);
  }
  return n;
}

/** Paragraph lines keep their breaks: a model that put two things on two
 *  lines meant them apart, and joining them into one run-on reads wrong. */
function renderPara(host, lines) {
  lines.forEach((l, k) => {
    if (k) host.append(el("br"));
    inline(host, l);
  });
  return host;
}

function renderBlocks(host, blocks, lead = false) {
  blocks.forEach((b, i) => {
    if (b.kind === "h") {
      const lvl = Math.min(6, Math.max(1, b.level || 3));
      host.append(inline(el("div", `v-h md-h md-h${lvl}`), b.text));
      return;
    }
    if (b.kind === "list") { host.append(renderList(b.list)); return; }
    if (b.kind === "hr") { host.append(el("hr", "md-hr")); return; }
    if (b.kind === "math") { host.append(mathEl(b.tex, true)); return; }
    if (b.kind === "details") {
      const d = el("details", "md-details");
      if (b.open) d.open = true;
      d.append(inline(el("summary", "md-summary"), b.summary));
      d.append(renderBlocks(el("div", "md-details-body"), b.blocks));
      host.append(d);
      return;
    }
