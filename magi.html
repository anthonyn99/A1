/* ══════════════════════════════════════════════════════════════════════════
   MAGI — multi-model council. Evangelion MAGI console, in the TaskHub palette.
   --------------------------------------------------------------------------
   Ask one question, get independent answers from ChatGPT, Claude, Gemini and
   DeepSeek, then one synthesised verdict naming agreements, disagreements and
   confidence. The council runs on Tony's PC — it drives real logged-in Chrome
   profiles, which cannot leave the machine — so THIS file is only the console.
   Where the engine is, and how this page finds it, is the `link` section of
   the script below.

   Ported from Veda's React/Vite build to the A1 single-file shape: one .html
   at the repo root, no build step, no bundle, served straight off GitHub
   Pages. The palette tokens are the suite's, unchanged; the MAGI layer on top
   is structural rather than a recolour — hard-edged blocks wired together with
   visible connection lines, uppercase tracked labels, and status that animates
   while the council deliberates.
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  /* Palette lifted from riftiq.html, which is the suite's current reference:
     the same gray/purple family, but the surfaces are warmer and every
     semantic colour is a PASTEL rather than a saturated signal colour. MAGI's
     old red (#f85149) and green (#5DAF6D) were the loudest things on screen
     and pulled the eye away from the answers, which are the point. */
  --bg:#1a1a1d;          /* suite ground   */
  --s1:#232327;          /* cards          */
  --s2:#2c2c31;          /* raised         */
  --s3:#34343a;          /* highest        */
  --bd:rgba(255,255,255,0.06);
  --bdl:#45454c;
  --tx:#f4f3f0; --txd:#adadb2; --txm:#8d8d94;
  --ac:#c0aeea;          /* identity accent */
  --acl:#dbd0f5; --acd:#9a86c9;
  --grn:#a4b986;         /* suite "good"    */
  --red:#d68a7c;         /* suite "bad"     */
  --amber:#e0b874; --gold:#e0b874; --blue:#8fa6d8;
  --shadow:rgba(0,0,0,.5);

  /* RiftIQ's three faces, and the reason there are three: Manrope carries
     headings, Inter every piece of running UI, IBM Plex Mono every NUMBER.
     MAGI was monospace throughout, which is why long answers read like a log
     file -- prose in a fixed pitch is slower to scan and the console character
     it bought is better served by keeping mono where it means something:
     latencies, char counts, selectors, data tables. */
  --font:'Inter',system-ui,-apple-system,sans-serif;
  --font-display:'Manrope',system-ui,-apple-system,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --r-sm:4px; --r-btn:6px; --r-card:8px;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  background:var(--bg); color:var(--tx); font-family:var(--font);
  font-size:13px; line-height:1.55; -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
/* Scrollbars are hidden globally across the suite. */
*{scrollbar-width:none;-ms-overflow-style:none;}
*::-webkit-scrollbar{display:none;width:0;height:0;}
a,button,label,select,[role="button"]{touch-action:manipulation;cursor:pointer;}
input,select,textarea,button{font-family:var(--font);}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:1px;}
[hidden]{display:none!important;}



* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body, #root { height: 100%; }

body {
  background: var(--bg);
  color: var(--tx);
  font-family: var(--font);
  font-size: 13px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}



/* ── app shell: fixed sidebar + scrolling content ─────────────────────── */
/* The sidebar is the app's navigation surface (Claude desktop's shape): a
   fixed-width rail that owns brand, run controls, system drawers and Studio,
   collapsing to icons only. The content area scrolls independently so the
   nav never scrolls away from a long verdict. */
.shell {
  display: grid;
  grid-template-columns: var(--nav-w, 232px) minmax(0, 1fr);
  height: 100%;
  transition: grid-template-columns .18s ease;
}
.shell.nav-collapsed { --nav-w: 56px; }

.sidebar {
  background: var(--s1);
  border-right: 1px solid var(--bd);
  display: flex; flex-direction: column;
  min-height: 0; overflow: hidden;
}
.side-top {
  /* Tighter gap and padding than the rest of the rail, bought deliberately:
     the tagline needs every pixel of a 232px header it shares with three
     controls, and at 7.5px it was a texture rather than a word. */
  display: flex; align-items: center; gap: 6px;
  padding: 12px 8px 10px;
  border-bottom: 1px solid var(--bd);
  /* FIXED, not min-height. Collapsing hides .side-brand, so a min-height row
     shrank from 77px to 60px and the centred toggle moved 8px up with it -- a
     button that jumps away from the cursor that just pressed it. 109px is the
     expanded height (brand row + the .side-actions row), measured, so neither
     state moves. */
  height: 109px;
}
.side-toggle {
  background: transparent; border: none; color: var(--txm);
  /* Fixed, and immune to the flex row it sits in. Collapsing the rail hides
     .side-brand, which left the toggle as the only item in .side-top -- and
     a stretch-aligned flex item with no siblings takes the whole 60px row,
     so the button visibly grew the moment you collapsed the sidebar. */
  width: 30px; height: 30px; min-height: 30px; max-height: 30px;
  flex: 0 0 auto; align-self: center; border-radius: 7px;
  /* 16px, not 14 -- and this is the whole reason the middle bar of the menu
     icon looked wrong. The icon is a 24-unit viewBox with rules at y=6, 12 and
     18, so at a rendered size S their centres land at S/4, S/2 and 3S/4. At
     S=14 that is 3.5, 7 and 10.5: the outer two straddle a pixel boundary and
     antialias across two rows, the middle one sits ON a whole pixel and does
     not -- so it drew crisper and thinner than its neighbours. Any S divisible
     by 4 puts all three in the same phase and they rasterise identically. */
  font-size: 16px; cursor: pointer; font-family: inherit;
  display: inline-flex; align-items: center; justify-content: center;
  transition: background .15s, color .15s;
}
.side-toggle:hover { background: var(--s2); color: var(--tx); }
/* The brand collapses out of the rail rather than wrapping or clipping
   mid-word, which is what a plain overflow:hidden would have done. */
.side-brand { min-width: 0; overflow: hidden; }
.nav-collapsed .side-brand { display: none; }

.side-nav {
  flex: 1; min-height: 0; overflow-y: auto;
  padding: 8px 8px 20px;
  display: flex; flex-direction: column; gap: 1px;
}

/* ── sidebar rows ─────────────────────────────────────────────────────── */
/* Same flat icon+label language the header nav used, turned vertical: no
   border at rest, soft fill on hover, stronger fill when active. */
.side-item {
  display: flex; align-items: center; gap: 10px; width: 100%;
  background: transparent; color: var(--txd); border: none; border-radius: 7px;
  padding: 7px 9px; min-height: 32px;
  font-family: inherit; font-size: 11.5px; font-weight: 600; letter-spacing: .3px;
  text-align: left; cursor: pointer;
  transition: background .15s, color .15s;
}
.side-item:hover:not(:disabled):not(.disabled) { background: var(--s2); color: var(--tx); }
.side-item.active { background: color-mix(in srgb, var(--ac) 16%, transparent); color: var(--acl); }
.side-item:disabled, .side-item.disabled { opacity: .4; cursor: not-allowed; }
.side-item.danger { color: var(--red); }
.side-item.danger:hover:not(:disabled) { background: rgba(248, 81, 73, .12); }
.side-ic {
  display: inline-flex; align-items: center; justify-content: center;
  width: 18px; flex-shrink: 0; font-size: 12px; color: var(--ac);
}
.side-item.active .side-ic { color: var(--acl); }
.side-item.danger .side-ic { color: var(--red); }
/* Studio rows carry their format's own accent, the same colour the open
   artifact is keyed to -- so the rail and the content agree at a glance. */
.side-ic.studio-ic { color: var(--sa, var(--ac)); }
.side-label {
  flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.side-tag { line-height: 1.4; 
  flex-shrink: 0; font-size: 9.5px; color: var(--txm); letter-spacing: .5px;
}

/* ── sidebar sections ─────────────────────────────────────────────────── */
.side-sec { display: flex; flex-direction: column; gap: 1px; margin-top: 14px; }
.side-sec-hd {
  font-size: 9px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase;
  color: var(--txm); padding: 4px 9px 6px;
}
.side-sec-note { color: var(--txm); font-size: 10px; padding: 0 9px 6px; line-height: 1.45; }

/* Collapsed: an icon-only rail. Labels and section headings are hidden
   rather than removed from the DOM, so the title attribute still names each
   row for both pointer and screen-reader users. */
.nav-collapsed .side-label,
.nav-collapsed .side-tag,
.nav-collapsed .side-sec-note { display: none; }
.nav-collapsed .side-item { justify-content: center; padding: 7px 0; }
.nav-collapsed .side-sec-hd {
  /* A rule instead of text: the heading is unreadable at 56px, but the
     grouping it marks still needs to be visible. */
  height: 1px; padding: 0; margin: 8px 10px; overflow: hidden;
  background: var(--bd); color: transparent;
}

/* Below this a 232px rail is a third of the viewport, so the icon-only form
   is forced regardless of the stored preference. The preference is not
   overwritten -- widening the window restores whatever the user chose. */
@media (min-width: 761px) and (max-width: 820px) {
  .shell { grid-template-columns: 56px minmax(0, 1fr); }
  .side-brand,
  .side-label,
  .side-tag,
  .side-sec-note { display: none; }
  .side-item { justify-content: center; padding: 7px 0; }
  .side-sec-hd {
    height: 1px; padding: 0; margin: 8px 10px; overflow: hidden;
    background: var(--bd); color: transparent;
  }
  .side-toggle { display: none; }
  .side-top { justify-content: center; padding: 12px 4px 10px; }
  /* 56px rail: the header's buttons stack instead of overflowing sideways. */
  .side-top { height: auto; }
  .side-top .side-actions { flex-direction: column; }
}

.wordmark {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 750; letter-spacing: 2px; line-height: 1.2;
  color: var(--acl); white-space: nowrap;
}
.tagline { line-height: 1.4; 
  color: var(--txm); font-size: 8.5px; letter-spacing: 1.4px;
  text-transform: uppercase; margin-top: 1px; white-space: nowrap;
}
/* ── flat icon+label control ──────────────────────────────────────────── */
/* No outline at rest, a soft fill on hover, a stronger fill when toggled.
   Used for the inline controls inside panels (Studio's Regenerate/Close, the
   audio player); the sidebar has its own vertical variant in .side-item. */
.navitem {
  display: inline-flex; align-items: center; gap: 7px;
  background: transparent; color: var(--txd); border: none; border-radius: 7px;
  padding: 7px 10px; height: 30px; box-sizing: border-box;
  font-family: inherit; font-size: 11px; font-weight: 600; letter-spacing: .3px;
  cursor: pointer; transition: background .15s, color .15s;
}
.navitem:hover:not(:disabled) { background: var(--s2); color: var(--tx); }
.navitem.active { background: color-mix(in srgb, var(--ac) 16%, transparent); color: var(--acl); }
.navitem:disabled { opacity: .45; cursor: not-allowed; }
.navitem.danger { color: var(--red); }
.navitem.danger:hover:not(:disabled) { background: rgba(248, 81, 73, .12); color: var(--red); }
.navitem-ic {
  display: inline-flex; align-items: center; justify-content: center;
  width: 16px; font-size: 12px; color: var(--ac); flex-shrink: 0;
}
.navitem.active .navitem-ic { color: var(--acl); }
.navitem.danger .navitem-ic { color: var(--red); }

/* ── buttons: the gitaBtnStyle recipe ─────────────────────────────────── */
.btn {
  background: transparent; color: var(--ac);
  border: 1px solid var(--bdl); border-radius: var(--r-btn);
  padding: 0 10px; height: 28px; box-sizing: border-box;
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 10px; font-weight: 700; cursor: pointer;
  font-family: inherit; text-transform: uppercase; letter-spacing: 1px;
  transition: all .15s;
}
.btn:hover:not(:disabled) { border-color: var(--ac); }
.btn.active { background: var(--ac); color: var(--bg); border-color: var(--ac); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.danger { color: var(--red); }
.btn.danger:hover:not(:disabled) { border-color: var(--red); }

/* ── layout ───────────────────────────────────────────────────────────── */
/* The content column scrolls on its own so the sidebar stays put; min-width:0
   is load-bearing on a grid child or wide tables push the whole column out. */
.page {
  min-width: 0; overflow-y: auto; height: 100%;
  padding: 20px clamp(12px, 3vw, 28px) 60px;
}
.page > * { max-width: 2000px; margin-left: auto; margin-right: auto; }

/* ── the idle council ─────────────────────────────────────────────────────
   Before a question is asked there is nothing below the composer but an empty
   page, so the composer sits in the middle of it -- the shape every search
   page has, for the same reason. Hitting Convene drops this class and the
   whole block rises to the top, making room for the units, the grid and the
   verdict underneath.

   A margin rather than a centring flex container: .page is the scroller and
   holds the sticky mobile header, the offline banner and every drawer, so
   turning it into a centred column would drag all of those into the middle
   too. This moves only the thing that should move, and animates while doing
   it. */
.page .qbar, .page .view-hd { transition: margin-top .28s cubic-bezier(.4, 0, .2, 1); }
/* On the HEADING, which sits directly above the composer -- on the composer,
   the title stayed pinned to the top of the page with a hole under it while
   the box it labels sat in the middle. Same reason .bs-hd carries it. */
.council-idle .view-hd { margin-top: clamp(0px, calc(30vh - 170px), 220px); }
.council-idle .empty-state { opacity: .8; }
@media (max-width: 760px) {
  /* A phone has no spare height to spend on this. */
  .council-idle .view-hd { margin-top: 4vh; }
}
@media (prefers-reduced-motion: reduce) {
  .page .qbar { transition: none; }
}

/* ── composer ─────────────────────────────────────────────────────────── */
/* Modelled on Claude's own input box: one rounded card holding the text, an
   attachment strip, and a toolbar row -- rather than a bare textarea beside a
   button. The card itself is the focus target so the whole thing lights up
   together, not just the textarea inside it. */
.qbar {
  position: relative;   /* the frame the corner grip is pinned to */
  background: var(--s2); border: 1px solid var(--bd); border-radius: 16px;
  padding: 10px 10px 8px; margin-bottom: 8px;
  display: flex; flex-direction: column; gap: 2px;
  transition: border-color .15s, box-shadow .15s, background .15s;
}
.qbar:focus-within {
  border-color: var(--ac);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--ac) 16%, transparent);
}
.qbar.drag {
  border-color: var(--ac); border-style: dashed;
  background: color-mix(in srgb, var(--ac) 6%, var(--s2));
}
/* Height is set inline by the auto-grow effect in App.tsx, so the box fits
   its prompt instead of scrolling internally. max-height is the backstop: a
   pasted essay caps here and scrolls rather than pushing Convene off-screen.
   `resize: none` because the drag handle would fight the auto-sizing. */
.qbar textarea {
  background: transparent; color: var(--tx); border: none;
  padding: 6px 6px 4px; font-family: inherit; font-size: 14px;
  resize: none; min-height: 26px; max-height: 45vh; outline: none;
  line-height: 1.5;
  overflow-y: auto;
}
/* Dimmer than the secondary text. A placeholder and an idle hint are the two
   things on an empty council screen that are NOT content -- at --txm they
   competed with the composer they were sitting in. */
.qbar textarea::placeholder { color: color-mix(in srgb, var(--txm) 62%, transparent); }
.qbar textarea:disabled { color: var(--txd); }

/* Toolbar row: "+" attach on the left, Convene pinned to the right -- same
   shape as Claude's model-row beneath the composer.
   The right padding is the grip's seat: the grip is taken out of the flow and
   parked in the corner, so without it Convene would sit underneath. */
.qbar-toolbar { display: flex; align-items: center; gap: 6px;
                padding: 2px 30px 0 2px; }
.qbar-spacer { flex: 1; }

/* The resize grip, in the box's actual bottom-right CORNER.
   Taken out of the flow and pinned there, because that is where a resize
   handle belongs and where a hand goes looking for one -- in the toolbar row
   it was merely near the corner, one control among four.
   Its bottom-right radius matches the box's own 16px minus the 4px inset, so
   it nests into the curve instead of cutting across it.
   32px square, not the ~14px of a native textarea corner, which on a phone is
   a control you stab at rather than grab. `touch-action: none` is what makes
   the drag work on a touch screen at all; without it the browser claims the
   gesture as a page scroll. */
/* A corner resize handle -- the diagonal hatch a textarea draws for itself,
   because that is the shape people already read as "drag this corner".
   The mark is small; the target is not. 38px of invisible hit area sits over
   the corner so it is grabbed rather than aimed at, and on a phone, where no
   browser offers a native handle at all, it is the only way to resize. */
.qbar-grip {
  position: absolute; right: 0; bottom: 0;
  width: 38px; height: 38px; padding: 0;
  background: transparent; border: 0; border-radius: 0 0 16px 0;
  color: var(--txd); cursor: nwse-resize; touch-action: none;
  display: block;
  transition: color .15s;
}
.qbar-grip::before {
  content: ""; position: absolute; right: 7px; bottom: 7px;
  width: 11px; height: 11px;
  /* Two diagonal strokes, bottom-right, like the native handle. */
  background:
    linear-gradient(135deg, transparent 45%, currentColor 45%, currentColor 55%, transparent 55%) no-repeat right bottom / 11px 11px,
    linear-gradient(135deg, transparent 45%, currentColor 45%, currentColor 55%, transparent 55%) no-repeat right bottom / 6px 6px;
}
.qbar-grip:hover, .qbar-grip:focus-visible { color: var(--tx); }
.qbar-grip.on { color: var(--ac); }
.qbar-grip:active { color: var(--ac); }
.qbar-grip:focus-visible { outline: 1px solid var(--ac); outline-offset: -4px; border-radius: 8px; }

/* The caption under the units. --txd, not --txm: it is the dimmest text on
   the screen on purpose. */
/* 54px clear of the units on BOTH screens, which is not the same margin on
   both. In the council the note is a block sibling of the unit row, so its
   margin-top collapses with that row's own 16px bottom margin -- the larger
   of the two wins and 26px produced 26px of space. Inside the brainstorm
   panel nothing collapses: the 16px, this margin and the panel's 12px flex
   gap all add up, which is how the same rule read as 54px there and 26px
   here. Stated in full, and taken back off inside the panel. */
.view-note {
  max-width: 680px; margin: 54px auto 0; padding: 0 4px;
  /* Fainter than --txd, which is already the dimmest token on the page.
     This is a caption about the screen, read once and then never again --
     it should sit below the reading line, not on it. */
  color: color-mix(in srgb, var(--txd) 64%, transparent);
  font-size: 11.5px; line-height: 1.55; text-align: center;
}
/* The panel's gap and the unit row's margin already supply 28 of the 54. */
.bs .view-note { margin-top: 26px; }
.view-note[hidden] { display: none; }
@media (max-width: 720px) {
  .view-note { font-size: 11px; margin-top: 42px; }
  .bs .view-note { margin-top: 14px; }
}

.qbar-attach {
  width: 30px; height: 30px; border-radius: 50%;
  background: transparent; color: var(--txd); border: 1px solid var(--bdl);
  font-size: 18px; line-height: 1; font-family: inherit; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  transition: all .15s;
}
.qbar-attach:hover:not(:disabled) { border-color: var(--ac); color: var(--ac); }
.qbar-attach:disabled { opacity: .4; cursor: not-allowed; }

.qbar-send {
  height: 32px; border-radius: 16px; padding: 0 16px;
}

/* Refine sits beside "+" on the left, not next to Convene: it acts on the
   text you are still writing, so it belongs with the other compose-time
   controls rather than with the button that ends composing. Quieter than
   .btn.active for the same reason -- Convene stays the one obvious action. */
.qbar-refine {
  height: 30px; border-radius: 15px; padding: 0 12px;
  background: transparent; color: var(--txd);
  border: 1px solid var(--bdl);
  display: inline-flex; align-items: center; gap: 6px;
  font-family: inherit; font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 1px;
  cursor: pointer; transition: all .15s;
  /* Clips any sub-pixel overshoot to the pill, so the spin can never paint
     over the border it lives in. */
  overflow: hidden;
}
.qbar-refine:hover:not(:disabled) { border-color: var(--ac); color: var(--ac); }
.qbar-refine:disabled { opacity: .4; cursor: not-allowed; }
/* A refine is a few seconds, not instant -- so the button has to keep saying
   it is working the whole time rather than just going dead.

   Everything below exists to keep that animation INSIDE the button's border.
   Three separate things were escaping it:

   1. The glyph rotated as a bare inline box, so its bounding box grew and
      shrank through the turn and shoved the label sideways with it.
   2. "Refining…" is wider than "Refine", so the button itself resized the
      moment it was clicked -- and being in a flex row, that pushed every
      control after it along.
   3. A rotated glyph sweeps a circle of its diagonal, which is wider than the
      glyph -- enough to graze the 15px border radius at the pill's end cap.

   Fixed by giving the glyph a square box it can spin freely inside, and
   reserving the label's busy width up front so no layout depends on state. */
.qbar-refine.busy { color: var(--ac); border-color: var(--ac); opacity: 1; }
.qbar-refine.busy:disabled { opacity: 1; }
/* A fixed square that owns the glyph's footprint: the rotation happens inside
   this box, so no amount of spinning changes what the flex row measures.
   grid+place-items keeps the glyph optically centred, which is what stops the
   wobble -- rotating around a box's centre is only stable if it starts there. */
.qbar-refine-ico {
  width: 12px; height: 12px;
  display: grid; place-items: center;
  flex: 0 0 auto;
  line-height: 1;
}
/* The spinner animates ITSELF (.spin-svg), so the box must not also rotate --
   two nested rotations at different periods read as a wobble. The box still
   earns its keep: it fixes the glyph's footprint, so nothing in the flex row
   moves when the button changes state. */
.qbar-refine-ico .spin-svg { width: 12px; height: 12px; display: block; }
/* Reserve the wider of the two labels ("Refining…") at all times, so pressing
   the button changes only pixels inside it -- never its width, and never the
   position of anything beside it. Centred so the shorter idle label sits
   evenly rather than hugging the glyph. */
.qbar-refine-txt {
  /* Measured: "Refining…" needs 58.5px at this size/letter-spacing, "Refine"
     39px. 5.9em (~59px) is the tightest value that still fits the longer label
     -- 6.2em left a visible dead gap beside the shorter one. Kept in em so it
     tracks the font-size rather than silently clipping if that changes. */
  min-width: 5.9em;
  text-align: center;
  white-space: nowrap;
}
/* Respect a reduced-motion preference: keep the state legible via colour and
   the label, drop the spin. */
@media (prefers-reduced-motion: reduce) {
  .qbar-refine.busy .qbar-refine-ico { animation: none; }
}
/* The label is the affordance on a wide composer, but on a narrow one the
   glyph alone still reads and leaves room for Convene. */
@media (max-width: 620px) { .qbar-refine-txt { display: none; } }

.qbar-undo {
  height: 30px; padding: 0 8px;
  background: transparent; color: var(--txm);
  border: none; border-radius: 15px;
  font-family: inherit; font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 1px;
  cursor: pointer; transition: color .15s;
}
.qbar-undo:hover:not(:disabled) { color: var(--ac); }
.qbar-undo:disabled { opacity: .4; cursor: not-allowed; }

.qbar-error {
  color: var(--red); font-size: 10.5px; letter-spacing: .3px;
  padding: 0 6px; margin-top: -2px;
}

/* Attachment strip: file/image chips above the textarea, inside the same card. */
.qbar-chips {
  display: flex; flex-wrap: wrap; gap: 8px;
  padding: 2px 2px 8px;
}
.chipfile {
  display: flex; align-items: center; gap: 8px;
  background: var(--s1); border: 1px solid var(--bd); border-radius: 10px;
  padding: 5px 8px 5px 5px; max-width: 220px;
}
.chipfile-thumb {
  width: 32px; height: 32px; border-radius: 6px; object-fit: cover; flex-shrink: 0;
}
.chipfile-icon {
  width: 32px; height: 32px; border-radius: 6px; flex-shrink: 0;
  background: color-mix(in srgb, var(--ac) 18%, transparent); color: var(--ac);
  display: flex; align-items: center; justify-content: center; font-size: 14px;
}
.chipfile-info { display: flex; flex-direction: column; min-width: 0; gap: 1px; }
.chipfile-name {
  font-size: 11.5px; color: var(--tx); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; max-width: 130px;
}
.chipfile-size { font-size: 9.5px; color: var(--txm); letter-spacing: .3px; }
.chipfile-x {
  background: transparent; border: none; color: var(--txm); cursor: pointer;
  font-size: 10px; padding: 3px; line-height: 1; border-radius: 50%;
  flex-shrink: 0; transition: all .15s;
}
.chipfile-x:hover:not(:disabled) { color: var(--red); background: rgba(248, 81, 73, .12); }
.chipfile-x:disabled { opacity: .4; cursor: not-allowed; }

/* The composer is a centred column, not a full-bleed bar.
   At 2000px a question box spanning the whole content area puts the caret
   nowhere near the middle of the screen and leaves the Convene button a
   thousand pixels from the text it sends. The grid and the verdict below stay
   full width, because those genuinely use it. */
.qbar, .members { max-width: 900px; margin-left: auto; margin-right: auto; width: 100%; }
/* A column: the label above, the chips below, both centred under the
   composer so the three read as one control. */
.members {
  display: flex; flex-direction: column; align-items: center;
  gap: 7px; margin-bottom: 16px;
}
/* A set you pick from, with the chips just clear of each other.
   They were butted into one segmented control, which read as a single object
   rather than as seven things you tick independently -- and a tick is exactly
   what each one is. 4px: enough to separate them, not enough to scatter the
   row into seven unrelated buttons. Both composer screens share this element,
   so the deliberation and brainstorm rows change together. */
#unitChips {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 4px;
}
.members .label { color: var(--txm); font-size: 11px; letter-spacing: .2px; }

/* Two stacked labels: the model name (what you are actually toggling) over
   its MAGI codename. Centred so the pair reads as one chip rather than two
   left-aligned lines. */
.chip {
  border: 1px solid var(--bd); border-radius: var(--r-sm);
  padding: 3px 9px; cursor: pointer; background: transparent; color: var(--txd);
  font-family: inherit; transition: all .15s;
  display: inline-flex; flex-direction: column; align-items: center; line-height: 1.25;
}
/* Draggable, and it has to look it. `grab` is the only cue a mouse gets that
   the row is rearrangeable at all; touch-action keeps the browser from
   claiming the gesture before the hold completes. */
.chip { cursor: grab; touch-action: pan-x; -webkit-user-select: none; user-select: none; }
.chips-drag .chip, .chip.dragged { cursor: grabbing; }
.chip.dragged {
  /* Lifted: brighter, slightly larger, and above its neighbours so it reads
     as being carried rather than swapped. */
  transform: scale(1.06);
  box-shadow: 0 6px 18px var(--shadow);
  position: relative; z-index: 3;
}
/* The chair's star sits INSIDE the chip, top-right, out of the way of both
   labels. Absolute so it cannot change what the flex row measures -- a chip
   that grew when it became the chair would shove the whole row sideways. */
.chip { position: relative; }
.chip-chair {
  position: absolute; top: 3px; right: 4px;
  display: inline-flex; font-size: 10px; line-height: 1;
  color: color-mix(in srgb, var(--bg) 78%, transparent);
  pointer-events: none;
}
/* The star is absolute so it cannot change what the flex row measures, which
   means the label has to be told to get out of its way -- otherwise the name
   runs underneath it, which is exactly what "CLAUDE*" looked like. */
.chip.is-chair { padding-right: 18px; }
.chip:not(.on) .chip-chair { color: var(--ac); }
/* The star is the whole signal. An inset ring on top of it read as a dark
   box drawn around one chip -- three marks (colour, ticked state, chair) on an
   object that only needs to carry two. */

/* "Units" is a button now -- it opens the chair picker -- so it has to look
   like one without becoming loud: it is still a section label. */
.label-btn {
  /* Never stretches. In a centred column a full-width dashed box reads as an
     empty text field, which is the last thing a section label should look
     like. */
  flex: 0 0 auto; align-self: center;
  background: transparent; border: 1px dashed var(--bd); border-radius: 6px;
  padding: 3px 9px; cursor: pointer; font-family: inherit;
  color: var(--txm); font-size: 11px; letter-spacing: .2px;
  transition: all .15s;
}
.label-btn:hover { border-color: var(--ac); color: var(--ac); border-style: solid; }

.chair-list { display: flex; flex-direction: column; gap: 7px; margin: 4px 0 12px; }
.chair-row {
  display: flex; align-items: center; gap: 10px; text-align: left;
  background: var(--s2); border: 1px solid var(--bd);
  border-left: 3px solid var(--pa, var(--ac));
  border-radius: 9px; padding: 9px 11px; cursor: pointer;
  font-family: inherit; color: var(--tx); transition: all .15s;
}
.chair-row:hover { border-color: var(--ac); }
.chair-row.on { background: color-mix(in srgb, var(--ac) 10%, var(--s2)); border-color: var(--ac); }
.chair-names { flex: 1; min-width: 0; }
.chair-name { font-family: var(--font-display); font-size: 12.5px; font-weight: 700; }
.chair-sub { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .55px; color: var(--txm); margin-top: 2px; }
.chair-tags { display: flex; gap: 6px; flex-wrap: wrap; }
@media (max-width: 760px) { .chair-row { min-height: 52px; } }

.chip-model {
  /* No uppercase. The display names are already written correctly in
     selectors.yaml -- ChatGPT, DeepSeek -- and forcing capitals flattened
     that into CHATGPT and DEEPSEEK, which are two brands spelled wrong.
     The codename underneath keeps its capitals: BALTHASAR is written that
     way, not styled that way. */
  font-size: 11.5px; font-weight: 700; letter-spacing: .2px;
}
/* Dimmed against the model name it sits under. `currentColor` at low opacity
   rather than a fixed grey, so it stays legible both on the transparent
   "off" chip and on the accent-filled "on" one. */
.chip-unit {
  font-size: 8px; font-weight: 600; letter-spacing: 1.1px; text-transform: uppercase;
  opacity: .62;
}
.chip-unit:empty { display: none; }
.chip.on { color: var(--bg); }
.chip:disabled { opacity: .45; cursor: not-allowed; }

/* ══ MAGI CONSOLE ═════════════════════════════════════════════════════ */

.magi {
  position: relative;
  margin: 4px 0 18px;
  padding: 10px 0 0;
}

/* The wiring between the member blocks and the core, drawn behind them. */
.magi-links {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  pointer-events: none; z-index: 0;
}
.magi-link {
  stroke: var(--bd);
  stroke-width: 1.5;
  fill: none;
  transition: stroke .25s;
}
.magi-link.live {
  stroke: var(--pa, var(--ac));
  stroke-dasharray: 5 7;
  animation: flow 1s linear infinite;
}
.magi-link.settled { stroke: var(--pa, var(--ac)); opacity: .5; }
.magi-link.dead { stroke: var(--red); opacity: .45; stroke-dasharray: 2 4; }

@keyframes flow { to { stroke-dashoffset: -12; } }

/* Grid: two members, core, two members. */
/* Two unit columns flanking the core, which spans both rows so it sits level
   with the midpoint of the four blocks -- the wiring then converges on it
   symmetrically from all four corners. */
.magi-grid {
  position: relative; z-index: 1;
  display: grid;
  grid-template-columns: 1fr 1fr minmax(190px, .62fr);
  grid-template-rows: auto auto;
  gap: 14px 26px;
  align-items: stretch;
}
.magi-core-cell {
  grid-column: 3; grid-row: 1 / span 2;
  display: flex; align-items: center; justify-content: center;
}

@media (max-width: 900px) {
  .magi-grid { grid-template-columns: 1fr; }
  /* grid-COLUMN has to be reset too, not just grid-row. The base rule pins the
     core to column 3; leaving that in place while declaring a single-column
     template makes grid invent columns 2 and 3 to satisfy it, and the members
     were laid out across them at 4px and 156px wide on a 390px phone. The
     single-column template was there all along and did nothing. */
  .magi-core-cell { grid-column: auto; grid-row: auto; order: 99; }
  .magi-links { display: none; }
}

/* ── member block ─────────────────────────────────────────────────────── */
/* A unit is a closed block by default: four simultaneous answer dumps is more
   text than anyone reads, and the console is meant to show STATE at a glance.
   The answer is one click away, and the verdict below is the thing to read. */
.node {
  background: var(--s1);
  border: 1px solid var(--bd);
  border-left: 3px solid var(--pa, var(--ac));
  border-radius: 2px;                    /* hard-edged, console-like */
  display: flex; flex-direction: column;
  overflow: hidden;
  position: relative;
  transition: border-color .25s, box-shadow .25s;
}
/* Collapsed blocks are uniform and short; only an opened one grows. */
.node.collapsed { min-height: 0; }
.node.open { min-height: 168px; }

.node.working {
  border-color: var(--pa, var(--ac));
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--pa, var(--ac)) 28%, transparent),
              0 0 22px -8px var(--pa, var(--ac));
  /* Each unit pulses in its OWN accent, and --pd staggers the phase so the
     four blocks are visibly out of step with each other rather than blinking
     as one bank. That difference is what reads as four independent machines
     thinking, instead of one animation applied four times. */
  animation: unitblink 1.9s ease-in-out infinite;
  animation-delay: var(--pd, 0s);
}
@keyframes unitblink {
  0%, 100% {
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--pa, var(--ac)) 26%, transparent),
                0 0 20px -10px var(--pa, var(--ac));
  }
  50% {
    box-shadow: 0 0 0 1px var(--pa, var(--ac)),
                0 0 26px -4px var(--pa, var(--ac));
  }
}
.node.failed { border-color: var(--red); border-left-color: var(--red); }

/* Sweep of light across a block while that member is thinking. Staggered on
   the same offset as the blink so a unit's two cues move together. */
.node.working::after {
  content: "";
  position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(
    100deg,
    transparent 40%,
    color-mix(in srgb, var(--pa, var(--ac)) 14%, transparent) 50%,
    transparent 60%
  );
  background-size: 260% 100%;
  animation: sweep 2.1s ease-in-out infinite;
  animation-delay: var(--pd, 0s);
}
@keyframes sweep {
  0%   { background-position: 160% 0; }
  100% { background-position: -60% 0; }
}

/* The whole header is the toggle, so it is a real button: keyboard reachable,
   and the hit target is the full width of the block rather than an icon. */
.node-hd {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; padding: 7px 11px; width: 100%;
  border: none; border-bottom: 1px solid var(--bd);
  background: color-mix(in srgb, var(--pa, var(--ac)) 7%, transparent);
  font-family: inherit; text-align: left; cursor: pointer;
  transition: background .15s;
}
.node.collapsed .node-hd { border-bottom-color: transparent; }
.node-hd:hover { background: color-mix(in srgb, var(--pa, var(--ac)) 14%, transparent); }
.node-hd:focus-visible { outline: 1px solid var(--pa, var(--ac)); outline-offset: -2px; }

/* Caret marking open/closed. Rotates rather than swapping glyphs, so the
   state change is a movement the eye follows. */
.node-caret {
  color: var(--txm); font-size: 9px; flex-shrink: 0;
  transition: transform .2s, color .15s;
}
.node.open .node-caret { transform: rotate(90deg); color: var(--pa, var(--ac)); }

/* Closed, a unit still has to report SOMETHING, or four identical boxes tell
   you nothing. This is the one-line status strip under the header. */
.node-peek {
  padding: 7px 11px 9px;
  display: flex; align-items: center; gap: 8px;
  font-size: 10px; letter-spacing: .5px; color: var(--txm);
  border-top: 1px solid color-mix(in srgb, var(--bd) 55%, transparent);
}
.node-peek .bar {
  flex: 1; height: 2px; border-radius: 2px; overflow: hidden;
  background: color-mix(in srgb, var(--bd) 70%, transparent);
}
.node-peek .bar i {
  display: block; height: 100%; background: var(--pa, var(--ac));
  transition: width .4s ease-out;
}
.node-peek .hint { color: var(--txm); opacity: .75; white-space: nowrap; }
/* The model name. Less letter-spacing than the codename it replaced -- wide
   tracking suits a call-sign like MELCHIOR·01 but makes an ordinary word
   like "DeepSeek" hard to read. */
.node-id {
  font-size: 12px; font-weight: 700; letter-spacing: .6px;
  color: var(--pa, var(--ac));
}
/* The codename, demoted to the secondary line: keeps the console flavour
   without competing with the fact of which model answered. */
.node-sub {
  font-size: 8.5px; letter-spacing: 1.3px; text-transform: uppercase;
  color: var(--txm); margin-top: -1px;
}
.node-sub:empty { display: none; }
.node-meta { color: var(--txm); font-size: 9.5px; letter-spacing: .5px; }

.node-body {
  padding: 10px 11px; overflow-y: auto; max-height: 300px;
  white-space: pre-wrap; word-break: break-word;
  font-size: 12.5px; color: var(--txd); flex: 1;
}
.node-body.idle { color: var(--txm); font-style: italic; }

/* Blinking cursor while a member is still writing. */
.caret {
  display: inline-block; width: 7px; height: 13px;
  background: var(--pa, var(--ac)); vertical-align: text-bottom;
  margin-left: 2px; animation: blink 1s steps(2) infinite;
}
@keyframes blink { 0%, 50% { opacity: 1 } 50.01%, 100% { opacity: 0 } }

/* ── status badges ────────────────────────────────────────────────────── */
.badge {
  font-size: 8.5px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase;
  padding: 2px 6px; border-radius: 2px; border: 1px solid currentColor; white-space: nowrap;
}
.badge.idle    { color: var(--txm); }
.badge.working { color: var(--amber); animation: pulse 1.4s ease-in-out infinite; }
.badge.done    { color: var(--grn); }
.badge.failed  { color: var(--red); }
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .4 } }

/* ── the core / verdict block ─────────────────────────────────────────── */
.core {
  width: 100%;
  background: var(--s1);
  border: 1px solid var(--bd);
  border-radius: 2px;
  padding: 16px 14px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px; text-align: center; min-height: 150px;
  position: relative; overflow: hidden;
  transition: border-color .3s;
}
.core.deliberating { border-color: var(--ac); }
.core.resolved     { border-color: var(--grn); }
.core.blocked      { border-color: var(--red); }

.core-label {
  font-size: 9px; letter-spacing: 2.4px; text-transform: uppercase; color: var(--txm);
}
.core-status {
  font-family: var(--font-display);
  font-size: clamp(15px, 2.1vw, 21px);
  font-weight: 750; letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--ac);
}
.core.deliberating .core-status { animation: pulse 1.5s ease-in-out infinite; }
.core.resolved .core-status { color: var(--grn); }
.core.blocked  .core-status { color: var(--red); }

.core-count {
  font-size: 10px; letter-spacing: 1.2px; color: var(--txd);
}

/* Concentric rings that expand while the council deliberates. */
.core.deliberating::before,
.core.deliberating::after {
  content: "";
  position: absolute; left: 50%; top: 50%;
  width: 40px; height: 40px; margin: -20px 0 0 -20px;
  border: 1px solid var(--ac); border-radius: 50%;
  opacity: 0; animation: ring 2.6s ease-out infinite;
}
.core.deliberating::after { animation-delay: 1.3s; }
@keyframes ring {
  0%   { transform: scale(.5); opacity: .5; }
  100% { transform: scale(6);  opacity: 0; }
}

/* ── verdict panel ────────────────────────────────────────────────────── */
.verdict {
  background: var(--s1); border: 1px solid var(--bd);
  border-left: 3px solid var(--ac); border-radius: 2px; overflow: hidden;
  animation: rise .35s ease-out;
}
@keyframes rise {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: none; }
}
.verdict-hd {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 12px; padding: 9px 14px; border-bottom: 1px solid var(--bd); flex-wrap: wrap;
  background: color-mix(in srgb, var(--ac) 8%, transparent);
}
.verdict-title {
  font-size: 11px; font-weight: 700; letter-spacing: 2.2px;
  text-transform: uppercase; color: var(--ac);
}
.verdict-quorum { color: var(--txm); font-size: 10px; letter-spacing: .6px; }

/* The copy control. One class for every surface that produces a result --
   the verdict, a brainstorm plan, a round draft, a single unit's answer --
   because a control that means "take this away with you" should not look
   like four different buttons.

   `margin-left:auto` rather than a place in the flex order: these headers
   already lay out title-then-meta with space-between, and pinning the button
   to the end keeps it in the same corner whether or not the meta text wraps. */
.copybtn {
  margin-left: auto; flex: 0 0 auto;
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 10px; min-height: 28px;
  border: 1px solid var(--bd); border-radius: 7px;
  background: transparent; color: var(--txm);
  font: inherit; font-size: 10px; font-weight: 600;
  letter-spacing: 1.1px; text-transform: uppercase;
  cursor: pointer; transition: color .15s, border-color .15s, background .15s;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
.copybtn:hover { color: var(--ac); border-color: var(--ac); }
.copybtn:focus-visible { outline: 2px solid var(--ac); outline-offset: 2px; }
.copybtn svg { width: 13px; height: 13px; display: block; }
.copybtn.done { color: var(--grn); border-color: var(--grn); }
/* Under a finished answer rather than in a header -- a unit's block is a
   button itself, so its copy control cannot live in the heading. */
.copybtn.under { margin: 14px 0 0; }

@media (max-width: 760px) {
  /* A fingertip target. The label stays: an unlabelled icon in a console of
     dingbats is a guess, and there is room for five characters. */
  .copybtn { min-height: 36px; padding: 8px 12px; font-size: 11px; }
  .copybtn svg { width: 15px; height: 15px; }
}

/* The verdict is the finished answer, so it is set as prose -- wider leading,
   real paragraphs and lists -- rather than as the monospace console dump the
   member blocks use. It is the one place in the console meant to be READ.
   On a wide screen the caveats and the confidence rating move into a sidebar,
   so the answer keeps a readable measure instead of stretching to 2000px. */
.verdict-body {
  padding: 22px 24px 24px;
  /* The console runs to 2000px but prose does not; the whole verdict block is
     capped and centred so the answer and its sidebar sit together in the
     middle rather than leaving a dead gutter down one side. */
  max-width: 1180px; margin: 0 auto;
  font-size: 14px; line-height: 1.72; color: var(--tx);
  /* The running face, not the display one. This rule used to say
     var(--font-display) for a good reason -- under the old tokens --font WAS
     monospace, and a verdict set in mono reads as a wall. Now --font is Inter,
     so "not mono" and "the reading face" are the same thing, and Manrope here
     would set whole paragraphs in a heading face. */
  font-family: var(--font);
  letter-spacing: .1px;
}
/* The answer column is capped near 78ch for readability and the sidebar is
   fixed-width, so on a very wide screen the pair is centred as a unit rather
   than being flung to opposite edges with dead space between them. */
/* The pair is centred as a unit and capped, rather than the answer track being
   allowed to grow to the full 2000px page. `1fr` on the answer with a max-width
   on the wrapper keeps the two columns adjacent instead of being pushed to
   opposite edges with a dead gutter between them. */
.verdict-body.split {
  display: grid;
  grid-template-columns: minmax(0, 78ch) minmax(230px, 290px);
  justify-content: center;
  gap: 22px 40px;
  align-items: start;
}
/* Without a sidebar there is no grid to cap the measure, so on a 2000px page
   the answer ran the full width -- ~200 characters a line, which is the single
   worst thing you can do to a block of prose. Cap and centre it so a
   one-column verdict reads the same as the answer column of a split one. */
.verdict-body:not(.split) > .v-main {
  max-width: 78ch;
  margin: 0 auto;
}
/* min-width:0 is load-bearing: without it a wide table blows out the grid
   track instead of scrolling inside .v-tablewrap. */
.v-main { min-width: 0; }

/* ── sidebar ── */
/* align-self keeps the cards hugging their content instead of stretching to
   the height of the answer column (or of the collapsed row below it). */
.v-aside { display: flex; flex-direction: column; gap: 12px; min-width: 0; align-self: start; }
.v-card {
  border: 1px solid var(--bd); border-left: 2px solid var(--acd);
  border-radius: 2px; padding: 10px 12px 11px;
  background: color-mix(in srgb, var(--s2) 55%, transparent);
}
.v-card > *:last-child { margin-bottom: 0; }
.v-card p, .v-card .v-list li { font-size: 12.5px; line-height: 1.6; color: var(--txd); }

/* ── inline + blocks ── */
.verdict-body p { margin: 0 0 14px; }
.verdict-body p:last-child { margin-bottom: 0; }
.verdict-body strong { color: var(--tx); font-weight: 700; }
.verdict-body em { color: var(--txd); font-style: italic; }
.verdict-body code {
  font-family: var(--font);
  background: var(--s2); border: 1px solid var(--bd); border-radius: 3px;
  padding: 1px 5px; font-size: 12px; color: var(--acl);
}

/* The opening paragraph is the answer in one breath; everything after it is
   the supporting detail. Sized up so it lands before anything else, and given
   a tinted panel rather than a bare rule -- at this width a 2px line was not
   enough to mark it as the thing to read first. */
.v-main .v-lead {
  font-size: 16.5px; line-height: 1.62; color: var(--tx);
  border-left: 2px solid var(--ac);
  background: color-mix(in srgb, var(--ac) 7%, transparent);
  padding: 13px 16px; margin-bottom: 20px; border-radius: 0 3px 3px 0;
}

/* Section label (sidebar cards) and sub-heading (inside the answer). */
.verdict-body .sec {
  font-family: var(--font);
  color: var(--acl); font-weight: 700; letter-spacing: 1.6px;
  text-transform: uppercase; font-size: 10px;
  display: block; margin: 0 0 8px;
  border-bottom: 1px solid var(--bd); padding-bottom: 4px;
}
/* Sub-headings sit in the console face, not the prose face: they are labels
   marking the structure, and the contrast against the body text is what makes
   the sections scannable at a glance. */
.verdict-body .v-h {
  /* A heading, so the display face -- again the inverse of what it wanted
     under the old tokens, where var(--font) was the console mono this label
     was reaching for. */
  font-family: var(--font-display);
  color: var(--acl); font-weight: 700; letter-spacing: 1.5px;
  text-transform: uppercase; font-size: 10.5px;
  margin: 26px 0 10px; padding-bottom: 5px;
  border-bottom: 1px solid var(--bd);
  display: flex; align-items: center; gap: 8px;
}
/* A small tick before each heading, so the eye catches the section boundary
   even when scrolling fast. */
.verdict-body .v-h::before {
  content: ""; flex: 0 0 auto;
  width: 5px; height: 5px; background: var(--ac);
  transform: rotate(45deg);
}
.verdict-body .v-h:first-child { margin-top: 0; }

/* ── lists ── */
.verdict-body .v-list { margin: 0 0 14px; padding-left: 20px; }
.verdict-body .v-list li { margin-bottom: 8px; padding-left: 3px; }
.verdict-body .v-list li:last-child { margin-bottom: 0; }
.verdict-body ul.v-list { list-style: none; padding-left: 17px; }
.verdict-body ul.v-list li { position: relative; }
.verdict-body ul.v-list li::before {
  content: "▸"; position: absolute; left: -15px; top: -1px;
  color: var(--ac); font-size: 11px;
}
.verdict-body ol.v-list { padding-left: 22px; }
.verdict-body ol.v-list li::marker {
  color: var(--ac); font-weight: 700; font-family: var(--font); font-size: 12px;
}

/* Nested level: tighter, dimmer, different marker so the hierarchy reads. */
.verdict-body .v-list .v-list { margin: 5px 0 0; padding-left: 14px; }
.verdict-body .v-list .v-list li { font-size: 12.5px; color: var(--txd); margin-bottom: 3px; }
.verdict-body ul.v-list ul.v-list li::before { content: "·"; color: var(--acd); }
/* A task item is marked by its checkbox; a bullet beside it is a second marker. */
.verdict-body ul.v-list li.md-task::before { content: none; }
.verdict-body ul.v-list li.md-task { margin-left: -14px; }

/* `- **Sizing:** matters more than brand` -- the lead-in reads as a label. */
.verdict-body .v-list li > strong:first-child {
  color: var(--acl); font-weight: 700; letter-spacing: .3px;
}

/* ── comparison table ── */
/* Tables wrap before they scroll. Every cell may break its text, so a
   three-column comparison fits a phone without a sideways scroll; only a table
   with genuinely too many columns to fit falls back to scrolling inside its own
   frame -- the page itself never scrolls sideways. min-width stops a column
   collapsing to one character a line. */
.v-tablewrap {
  overflow-x: auto; margin: 4px 0 14px; max-width: 100%;
  border: 1px solid var(--bd); border-radius: 8px;
}
.v-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.v-table th {
  text-align: left; color: var(--acl); font-size: 10px; font-weight: 700;
  letter-spacing: .9px; text-transform: uppercase;
  padding: 8px 12px; border-bottom: 1px solid var(--bd); vertical-align: bottom;
  background: color-mix(in srgb, var(--ac) 8%, transparent);
  min-width: 70px; overflow-wrap: anywhere;
}
.v-table td {
  padding: 8px 12px; border-bottom: 1px solid var(--bd);
  color: var(--txm); vertical-align: top; line-height: 1.5;
  min-width: 70px; overflow-wrap: anywhere;
}
/* Zebra, faintly: a wide table's rows are hard to follow across without it. */
.v-table tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--s2) 45%, transparent); }
.v-table tr:last-child td { border-bottom: none; }

/* ══ markdown, everywhere a unit's words are shown ══════════════════════════
   One stylesheet for the verdict, the plan, and every unit's answer card, so a
   heading or a table looks the same wherever it came from. */
.md, .verdict-body { overflow-wrap: anywhere; word-break: normal; }
.md { font-size: 12.5px; line-height: 1.62; color: var(--txm); }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p { margin: 0 0 10px; }

/* A real scale. Every level used to render identically, so a report's H1
   title and its H4 sub-points carried the same weight. */
.md-h { color: var(--tx); font-weight: 700; line-height: 1.3; letter-spacing: .1px; }
.md .md-h, .verdict-body .md-h { margin: 18px 0 8px; }
.md-h1 { font-size: 19px; padding-bottom: 6px; border-bottom: 1px solid var(--bd); }
.md-h2 { font-size: 16.5px; padding-bottom: 4px; border-bottom: 1px solid var(--bdl); }
.md-h3 { font-size: 14.5px; }
.md-h4 { font-size: 13px; color: var(--acl); }
.md-h5, .md-h6 {
  font-size: 11px; color: var(--txm); text-transform: uppercase; letter-spacing: 1.1px;
}
/* Inside a verdict, the small uppercase label style is kept for the levels
   that act as section labels (H4 and below) -- that is what makes a long
   verdict scannable. H1-H3 are TITLES and get the real scale: under the old
   single style a report's title rendered as a 10px caps label, which is the
   "H1 does not render" that was reported. Two classes, to outrank
   `.verdict-body .v-h`. */
.verdict-body .md-h1, .verdict-body .md-h2, .verdict-body .md-h3 {
  font-family: inherit; text-transform: none; letter-spacing: .1px;
  color: var(--tx); display: block;
}
/* A scale measured against the 14px body, so every level is visibly its own
   size: H3 at 14.5px sat level with the text around it and read as bold
   prose, which is what "headings aren't different sizes" was. H4 keeps the
   accent colour; H5-H6 keep the small caps label, the verdict's own
   section-marker look. */
.verdict-body .md-h1 { font-size: 25px; margin: 26px 0 12px; }
.verdict-body .md-h2 { font-size: 20.5px; margin: 24px 0 10px; }
.verdict-body .md-h3 { font-size: 17px; margin: 20px 0 8px; border-bottom: 0; padding-bottom: 0; }
.verdict-body .md-h4 {
  font-family: inherit; text-transform: none; letter-spacing: .1px;
  font-size: 15px; color: var(--acl); display: block;
  border-bottom: 0; padding-bottom: 0; margin: 18px 0 6px;
}
.verdict-body .md-h1::before, .verdict-body .md-h2::before,
.verdict-body .md-h3::before, .verdict-body .md-h4::before { display: none; }

/* ── HTML the models write ── */
.md-details {
  margin: 6px 0 14px; border: 1px solid var(--bd); border-radius: 9px;
  background: color-mix(in srgb, var(--s2) 55%, transparent);
}
.md-summary {
  cursor: pointer; padding: 9px 12px; font-weight: 600; color: var(--tx);
  list-style: none; display: flex; align-items: center; gap: 8px;
}
.md-summary::-webkit-details-marker { display: none; }
.md-summary::before {
  content: ""; width: 0; height: 0; flex: 0 0 auto;
  border-left: 5px solid var(--ac); border-top: 4px solid transparent;
  border-bottom: 4px solid transparent; transition: transform .15s;
}
.md-details[open] > .md-summary::before { transform: rotate(90deg); }
.md-details[open] > .md-summary { border-bottom: 1px solid var(--bdl); }
.md-details-body { padding: 10px 14px 4px; }
.md-details-body > :last-child { margin-bottom: 8px; }
kbd.md-html {
  font-family: var(--font-mono); font-size: .85em; padding: 1px 6px;
  border: 1px solid var(--bdl); border-bottom-width: 2px; border-radius: 5px;
  background: var(--s2); color: var(--tx);
}
mark.md-html { background: color-mix(in srgb, var(--amber) 35%, transparent); color: var(--tx); padding: 0 2px; border-radius: 2px; }
sub.md-html, sup.md-html { font-size: .75em; }
abbr.md-html[title] { text-decoration: underline dotted; cursor: help; }
ins.md-html, u.md-html { text-decoration: underline; text-underline-offset: 2px; }
del.md-html { color: var(--txd); }

/* ── math and footnotes ── */
.md-math { font-family: var(--font-mono); font-size: .92em; color: var(--acl); }
.md-math.typeset { font-family: inherit; font-size: 1.05em; color: inherit; }
.md-math-block {
  display: block; margin: 8px 0 14px; padding: 6px 0;
  overflow-x: auto; overflow-y: hidden; text-align: center; max-width: 100%;
}
.md-math .katex-display { margin: 0; }
.md-fn { font-size: .72em; color: var(--ac); margin-left: 1px; }
.md-footnotes {
  margin-top: 18px; padding-top: 10px; border-top: 1px solid var(--bd);
  font-size: .9em; color: var(--txd);
}
.md-footnotes ol { list-style: none; margin: 0; padding: 0; }
.md-footnotes li { margin: 0 0 6px; }
.md-fn-id {
  display: inline-block; min-width: 18px; margin-right: 6px;
  color: var(--ac); font-size: .8em; vertical-align: super;
}

.md-code {
  font-family: var(--font-mono);
  font-size: .92em; padding: 1px 5px; border-radius: 5px;
  background: color-mix(in srgb, var(--s2) 80%, transparent);
  border: 1px solid var(--bdl); color: var(--acl);
  overflow-wrap: anywhere;
}
.md-link { color: var(--ac); text-decoration: underline; text-underline-offset: 2px; }
.md-link:hover { color: var(--acl); }
.md s { color: var(--txd); }

/* Code blocks keep their lines: they scroll sideways inside their own frame
   rather than wrapping a line of code into something that no longer runs. */
.md-pre-wrap {
  position: relative; margin: 6px 0 14px; border: 1px solid var(--bd);
  border-radius: 9px; background: var(--bg); overflow: hidden; max-width: 100%;
}
.md-pre-lang {
  font-size: 9.5px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
  color: var(--txd); padding: 5px 11px; border-bottom: 1px solid var(--bdl);
}
.md-pre {
  margin: 0; padding: 10px 12px; overflow-x: auto; white-space: pre;
  font-family: var(--font-mono);
  font-size: 12px; line-height: 1.55; color: var(--tx); tab-size: 2;
}
.md-quote {
  margin: 6px 0 14px; padding: 4px 0 4px 13px;
  border-left: 3px solid color-mix(in srgb, var(--ac) 55%, transparent);
  color: var(--txm);
}
.md-quote > :last-child { margin-bottom: 0; }
.md-hr { border: 0; border-top: 1px solid var(--bd); margin: 16px 0; }

/* Lists in a unit's card read like the verdict's. */
.md .v-list { margin: 0 0 10px; padding-left: 20px; }
.md .v-list li { margin-bottom: 5px; }
.md .v-list .v-list { margin: 5px 0 0; }
.md ul.v-list { list-style: disc; }
.md ul.v-list ul.v-list { list-style: circle; }
.md ul.v-list ul.v-list ul.v-list { list-style: square; }
.md li::marker { color: var(--ac); }
.md-task { list-style: none; position: relative; }
.md-check {
  display: inline-flex; align-items: center; justify-content: center;
  width: 13px; height: 13px; margin-right: 6px; vertical-align: -2px;
  border: 1px solid var(--bdl); border-radius: 3px; font-size: 10px; line-height: 1;
}
.md-check.on { background: var(--ac); border-color: var(--ac); color: var(--bg); }

/* Tables in an ANSWER read as prose. The console sets .v-table in the mono
   face, which suits Studio's data tables and is wrong here: mono is wide, so a
   three-column comparison overflowed a phone and broke "Epsilon" mid-word.
   Numbers still line up, through tabular figures rather than a mono font. */
.md .v-table, .verdict-body .v-table {
  font-family: var(--font); font-variant-numeric: tabular-nums;
  /* The phone rules pin every .v-table to 380-460px so it scrolls. That made
     even a two-column table scroll on a phone. Here the floor is per CELL
     (min-width on th/td), so a table fits whenever its columns can, and only
     one with genuinely too many columns scrolls inside its own frame. */
  min-width: 0;
}
.md .v-table th, .md .v-table td,
.verdict-body .v-table th, .verdict-body .v-table td {
  overflow-wrap: break-word; word-break: normal;
}
/* Code inside a block is the block's text, not another inline chip: the
   blanket `.verdict-body code` rule drew a second box inside the first. */
.md .md-pre code, .verdict-body .md-pre code {
  background: none; border: 0; padding: 0; border-radius: 0;
  color: inherit; font-size: inherit; font-family: inherit;
}

/* The unit card: markdown flows as normal text, not pre-wrapped source. */
.node-body.md-node { white-space: normal; }

@media (max-width: 720px) {
  .md { font-size: 13px; }
  .md-h1 { font-size: 17px; }
  .md-h2 { font-size: 15px; }
  .md-h3 { font-size: 14px; }
  .v-table { font-size: 12px; }
  .v-table th, .v-table td { padding: 7px 9px; min-width: 64px; }
  .md-pre { font-size: 11.5px; }
}

/* Confidence reads as a rating, so it gets a tag rather than a sentence. */
.verdict-body .v-conf { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
.verdict-body .conf-tag {
  font-size: 9.5px; font-weight: 700; letter-spacing: 1.4px;
  padding: 2px 8px; border: 1px solid currentColor; border-radius: 2px;
  white-space: nowrap; flex-shrink: 0;
}
.verdict-body .conf-tag.high   { color: var(--grn); }
.verdict-body .conf-tag.medium { color: var(--amber); }
.verdict-body .conf-tag.low    { color: var(--red); }
/* flex-basis 100% drops the justification onto its own line: inside a 240px
   sidebar it has no room to sit beside the tag. */
.verdict-body .conf-why { color: var(--txd); font-size: 12.5px; flex: 1 1 100%; min-width: 0; }
/* When the rating is the sentence's own subject the tag would repeat the word
   that follows it, so the leading rating is dimmed to read as a lead-in
   rather than a stutter. */
.verdict-body .conf-why > .conf-echo { color: var(--txm); }

/* Below this the sidebar has no room to be a sidebar. */
@media (max-width: 1080px) {
  .verdict-body.split { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .v-aside { flex-direction: row; flex-wrap: wrap; }
  .v-aside .v-card { flex: 1 1 260px; }
}
@media (max-width: 640px) {
  /* Stacked again -- the 260px basis above is a WIDTH hint for the side-by-side
     row, and would otherwise become a fixed HEIGHT once the axis flips. */
  .v-aside { flex-direction: column; }
  .v-aside .v-card { flex: 0 0 auto; }
}

/* ── failure callout ──────────────────────────────────────────────────── */
.callout {
  margin: 10px 11px; padding: 9px 11px;
  border: 1px solid var(--red); border-left-width: 3px;
  border-radius: 2px; background: rgba(248, 81, 73, .07);
}
.callout .kind {
  color: var(--red); font-size: 9px; font-weight: 700;
  letter-spacing: 1.4px; text-transform: uppercase; margin-bottom: 4px;
}
.callout .cause { color: var(--tx); font-size: 12px; margin-bottom: 6px; }
.callout .remedy { color: var(--txd); font-size: 11.5px; }
.callout .detail { color: var(--txm); font-size: 10.5px; margin-top: 6px; }

/* A unit that answered with something unusable is amber, not red: it is a
   caution about the verdict's basis, not a system failure. Red is reserved
   for units that could not be reached at all. */
.callout.degraded {
  border-color: var(--amber);
  background: rgba(226, 194, 133, .07);
}
.callout.degraded .kind { color: var(--amber); }
/* The rejected capture itself, quoted back so the user can see what came
   back -- usually a clarifying question, which tells them the prompt was
   ambiguous. Monospaced and boxed to read as a quotation, not as prose. */
.callout.degraded .detail {
  margin-top: 8px; padding: 6px 8px;
  border-left: 2px solid var(--bd);
  color: var(--txd); font-style: italic; font-size: 11px;
}
.badge.degraded { color: var(--amber); }

/* Named directly above the verdict body: a verdict built from three units
   while the display implies four is the failure this exists to prevent. */
.verdict-degraded {
  margin: 0 16px 14px; padding: 9px 11px;
  border: 1px solid var(--amber); border-left-width: 3px;
  border-radius: 2px; background: rgba(226, 194, 133, .07);
  color: var(--txd); font-size: 11.5px; line-height: 1.55;
}
.verdict-degraded strong { color: var(--amber); font-weight: 600; }

/* ══ BRIEF VIEW ════════════════════════════════════════════════════════════
   The verdict laid out as a briefing (briefBody). It keeps .verdict-body, so
   every inline rule above -- bold, code, tables, nested lists -- still applies
   inside its cards; these rules only add the layout around them. */
.verdict-body.brief { max-width: 920px; padding: 22px 24px 26px; }
.br-hero {
  position: relative; overflow: hidden;
  padding: 22px 24px 18px; margin-bottom: 14px;
  border: 1px solid var(--bdl); border-radius: 14px;
  background:
    radial-gradient(90% 140% at 100% 0%, color-mix(in srgb, var(--ac) 11%, transparent), transparent 60%),
    linear-gradient(160deg, var(--s2), var(--s1));
}
.br-headline {
  font-family: var(--font-display); font-size: 22px; font-weight: 800;
  line-height: 1.32; letter-spacing: -.1px; color: var(--tx); text-wrap: balance;
}
.br-headline.long { font-size: 19px; line-height: 1.4; font-weight: 700; }
.br-summary {
  margin-top: 12px; padding-left: 14px; border-left: 2px solid var(--acd);
  font-size: 15px; line-height: 1.65; color: var(--txd); text-wrap: pretty;
}
.br-summary:first-child { margin-top: 0; }
.br-conf { margin-top: 16px; }
.br-conf-top { display: flex; align-items: center; gap: 10px; }
.br-conf-k {
  font-family: var(--font-display); font-size: 10px; font-weight: 700;
  letter-spacing: 1.4px; text-transform: uppercase; color: var(--txm);
}
.br-conf-bar { display: flex; gap: 4px; width: 132px; }
.br-conf-bar i { flex: 1; height: 6px; border-radius: 3px; background: var(--s3); }
.br-conf.high .br-conf-bar i.on { background: var(--grn); }
.br-conf.medium .br-conf-bar i.on { background: var(--amber); }
.br-conf.low .br-conf-bar i.on { background: var(--red); }
.br-conf-v { font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: .6px; }
.br-conf.high .br-conf-v { color: var(--grn); }
.br-conf.medium .br-conf-v { color: var(--amber); }
.br-conf.low .br-conf-v { color: var(--red); }
.br-conf-why { margin-top: 6px; font-size: 12.5px; line-height: 1.6; color: var(--txd); }

.br-toc { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.br-toc-chip {
  height: 30px; padding: 0 13px; border-radius: 999px;
  background: var(--s1); border: 1px solid var(--bd); color: var(--txd);
  font-size: 12px; font-weight: 500; white-space: nowrap; max-width: 100%;
  overflow: hidden; text-overflow: ellipsis;
  transition: background .15s, color .15s, border-color .15s;
}
.br-toc-chip:hover { background: var(--s2); color: var(--tx); border-color: var(--bdl); }
.br-toc-chip strong { font-weight: 500; color: inherit; }

.br-intro { margin: 0 4px 14px; }
.br-sec {
  padding: 18px 20px 16px; margin-bottom: 12px; scroll-margin-top: 76px;
  border: 1px solid var(--bd); border-radius: 12px;
  background: color-mix(in srgb, var(--s1) 70%, transparent);
}
.br-sec-hd { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.br-sec-n {
  flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center;
  width: 24px; height: 24px; border-radius: 50%;
  background: color-mix(in srgb, var(--ac) 18%, transparent); color: var(--acl);
  font-family: var(--font-mono); font-size: 11.5px; font-weight: 700;
}
.br-sec-title {
  margin: 0; font-family: var(--font-display); font-size: 16.5px; font-weight: 700;
  line-height: 1.35; color: var(--tx);
}
.br-sec-body > *:last-child { margin-bottom: 0; }

.br-points { display: grid; gap: 8px; margin: 4px 0 14px; }
.br-points:last-child { margin-bottom: 0; }
.br-points.two { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.br-point {
  padding: 11px 14px; border-radius: 9px;
  background: var(--bg); border: 1px solid var(--bd); border-left: 3px solid var(--ac);
}
.br-point-label { font-size: 13.5px; font-weight: 650; color: var(--tx); line-height: 1.4; }
.br-point-body { margin-top: 3px; font-size: 13.5px; line-height: 1.6; color: var(--txd); }
.br-point-label:only-child, .br-point > .br-point-body:first-child { margin-top: 0; }
.br-point .v-list { margin: 6px 0 0; }

.br-steps { list-style: none; margin: 4px 0 14px; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.br-steps:last-child { margin-bottom: 0; }
.br-step { display: flex; gap: 12px; align-items: flex-start; }
.br-step-n {
  flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center;
  width: 24px; height: 24px; margin-top: 1px; border-radius: 50%;
  background: var(--s3); color: var(--acl); font-family: var(--font-mono); font-size: 11.5px; font-weight: 700;
}
.br-step-body { min-width: 0; line-height: 1.65; }
.br-step-label { font-weight: 650; color: var(--tx); }

.br-notes {
  margin-top: 4px; padding: 14px 18px; border-radius: 12px;
  border: 1px solid color-mix(in srgb, var(--amber) 26%, transparent);
  background: color-mix(in srgb, var(--amber) 5%, transparent);
}
.br-notes-hd {
  display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
  font-family: var(--font-display); font-size: 10.5px; font-weight: 700;
  letter-spacing: 1.4px; text-transform: uppercase; color: var(--amber);
}
.br-notes-ic { display: inline-flex; font-size: 14px; }
.br-notes p, .br-notes .v-list li { font-size: 13px; color: var(--txd); }
.br-notes > *:last-child { margin-bottom: 0; }
.br-notes .br-point { background: transparent; border-left-color: var(--amber); }

/* ── what the blocks inside a card become ── */
.br-group-title {
  display: flex; align-items: center; gap: 12px; margin: 22px 4px 12px;
  font-family: var(--font-display); font-size: 12px; font-weight: 800;
  letter-spacing: 1.6px; text-transform: uppercase; color: var(--acl);
}
.br-group-title::after { content: ""; flex: 1; height: 1px; background: var(--bdl); }
.br-group-title:first-child { margin-top: 4px; }
.br-sec-tw { min-width: 0; }
.br-sec-kicker {
  font-family: var(--font-display); font-size: 9.5px; font-weight: 700;
  letter-spacing: 1.4px; text-transform: uppercase; color: var(--txm); margin-bottom: 1px;
}
.br-sec.tone-good { border-left: 3px solid var(--grn); }
.br-sec.tone-bad { border-left: 3px solid var(--red); }
.br-sec.tone-good .br-sec-n { background: color-mix(in srgb, var(--grn) 18%, transparent); color: var(--grn); }
.br-sec.tone-bad .br-sec-n { background: color-mix(in srgb, var(--red) 18%, transparent); color: var(--red); }
.br-sec.hl {
  border-color: color-mix(in srgb, var(--ac) 40%, var(--bdl));
  background:
    radial-gradient(90% 140% at 0% 0%, color-mix(in srgb, var(--ac) 10%, transparent), transparent 65%),
    color-mix(in srgb, var(--s1) 80%, transparent);
}
.br-subhd {
  margin: 18px 0 8px; font-family: var(--font-display); font-size: 13px; font-weight: 700;
  color: var(--acl); letter-spacing: .2px;
}
.br-subhd:first-child { margin-top: 0; }

.br-groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 10px; margin: 4px 0 14px; }
.br-groups:last-child { margin-bottom: 0; }
.br-group {
  min-width: 0; padding: 12px 14px 10px; border-radius: 10px;
  background: var(--bg); border: 1px solid var(--bd); border-top: 2px solid var(--acd);
}
.br-group.wide { margin: 4px 0 14px; }
.br-group.wide:last-child { margin-bottom: 0; }
.br-point { position: relative; }
.br-point.numbered { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; align-items: start; }
.br-point-body.joined { margin-top: 0; color: var(--txd); }
.br-point-body.joined strong { color: var(--tx); }
.br-point-n {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; margin-top: -1px; border-radius: 6px;
  background: var(--s3); color: var(--acl); font-family: var(--font-mono); font-size: 11px; font-weight: 700;
}
.br-sec.tone-good .br-point { border-left-color: var(--grn); }
.br-sec.tone-good .br-point-n { color: var(--grn); background: color-mix(in srgb, var(--grn) 15%, transparent); }
.br-sec.tone-bad .br-point { border-left-color: var(--red); }
.br-sec.tone-bad .br-point-n { color: var(--red); background: color-mix(in srgb, var(--red) 15%, transparent); }
.br-group.good { border-top-color: var(--grn); background: color-mix(in srgb, var(--grn) 4%, var(--bg)); }
.br-group.bad { border-top-color: var(--red); background: color-mix(in srgb, var(--red) 4%, var(--bg)); }
.br-group-hd {
  display: flex; align-items: center; gap: 7px; margin-bottom: 8px;
  font-family: var(--font-display); font-size: 10.5px; font-weight: 800;
  letter-spacing: 1.2px; text-transform: uppercase; color: var(--txd);
}
.br-group-hd strong { font-weight: inherit; color: inherit; }
.br-group-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--acd); flex: 0 0 auto; }
.br-group.good .br-group-hd { color: var(--grn); }
.br-group.good .br-group-dot { background: var(--grn); }
.br-group.bad .br-group-hd { color: var(--red); }
.br-group.bad .br-group-dot { background: var(--red); }
.br-group .v-list { margin: 0; }
.br-group .v-list li { font-size: 13px; line-height: 1.55; margin-bottom: 6px; color: var(--txd); }
.br-group.good ul.v-list li::before { color: var(--grn); }
.br-group.bad ul.v-list li::before { color: var(--red); }
.br-group p { margin: 0; font-size: 13px; color: var(--txd); }
.br-group .br-points { margin: 0; }

.br-chipset { margin: 2px 0 12px; }
.br-chipset:last-child { margin-bottom: 0; }
.br-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.br-chip {
  display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 7px;
  background: var(--s2); border: 1px solid var(--bdl); color: var(--tx);
  font-family: var(--font-mono); font-size: 11.5px; font-weight: 600; letter-spacing: .2px;
}
.br-chip strong { font-weight: inherit; }
.br-chip-note { margin-top: 8px; font-size: 12.5px; line-height: 1.55; color: var(--txm); }

.br-callout {
  margin: 4px 0 14px; padding: 11px 14px; border-radius: 10px;
  border: 1px solid color-mix(in srgb, var(--amber) 30%, transparent);
  background: color-mix(in srgb, var(--amber) 6%, transparent);
}
.br-callout.bad { border-color: color-mix(in srgb, var(--red) 32%, transparent); background: color-mix(in srgb, var(--red) 6%, transparent); }
.br-callout-hd {
  font-family: var(--font-display); font-size: 10.5px; font-weight: 800; letter-spacing: 1.2px;
  text-transform: uppercase; color: var(--amber); margin-bottom: 3px;
}
.br-callout.bad .br-callout-hd { color: var(--red); }
.br-callout-body { font-size: 13.5px; line-height: 1.6; color: var(--tx); }

.br-flow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 4px 0 14px; }
.br-flow-step {
  padding: 6px 11px; border-radius: 8px; background: var(--s2); border: 1px solid var(--bdl);
  font-size: 12.5px; font-weight: 600; color: var(--tx); white-space: nowrap;
}
.br-flow-step.up { border-color: color-mix(in srgb, var(--grn) 45%, transparent); background: color-mix(in srgb, var(--grn) 8%, var(--s2)); }
.br-flow-step.down { border-color: color-mix(in srgb, var(--red) 45%, transparent); background: color-mix(in srgb, var(--red) 8%, var(--s2)); }
.br-flow-arrow { color: var(--txm); font-size: 13px; }

/* Citations ("Reuters+1") as quiet source pills rather than underlined runs. */
.brief .md-link {
  display: inline-flex; align-items: center; height: 20px; padding: 0 8px; margin: 0 1px;
  border-radius: 999px; background: var(--s2); border: 1px solid var(--bd);
  color: var(--txm); font-size: 11px; font-weight: 500; text-decoration: none;
  vertical-align: 1px; white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis;
}
.brief .md-link:hover { color: var(--tx); border-color: var(--bdl); }

/* ── report mode (Studio Report) ── */
.st-report { container-type: inline-size; }
.verdict-body.brief.report { max-width: 1180px; padding: 2px 0 6px; }
.report .br-hero {
  padding: 28px 30px 24px; margin-bottom: 16px;
  background:
    radial-gradient(80% 140% at 100% 0%, color-mix(in srgb, var(--gold) 9%, transparent), transparent 60%),
    radial-gradient(70% 120% at 0% 100%, color-mix(in srgb, var(--ac) 8%, transparent), transparent 60%),
    linear-gradient(160deg, var(--s2), var(--s1));
}
.br-kicker {
  font-family: var(--font-display); font-size: 10.5px; font-weight: 800;
  letter-spacing: 2.4px; text-transform: uppercase; color: var(--gold); margin-bottom: 10px;
}
.br-cover-title {
  margin: 0 0 14px; font-family: var(--font-display); font-size: 27px; font-weight: 800;
  line-height: 1.22; letter-spacing: -.2px; color: var(--tx); text-wrap: balance;
}
.br-lede {
  padding-left: 14px; border-left: 2px solid var(--acd);
  font-size: 16px; line-height: 1.72; color: var(--txd); text-wrap: pretty; max-width: 80ch;
}
.report .br-conf { margin-top: 18px; }
.br-doc { display: block; }
.br-rail { display: none; }
.report .br-sec { padding: 22px 26px 20px; margin-bottom: 14px; }
.report .br-sec-hd { margin-bottom: 12px; }
.report .br-sec-n { width: 30px; height: 30px; font-size: 12.5px; border-radius: 9px; }
.report .br-sec-title { font-size: 18.5px; }
.report .br-sec-body p, .report .br-intro p { font-size: 14.5px; line-height: 1.78; }
.report .br-intro { margin: 0 6px 16px; }
@container (min-width: 900px) {
  .br-doc { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 26px; align-items: start; }
  .verdict-body.report > .br-toc { display: none; }
  .br-rail {
    display: flex; flex-direction: column; gap: 2px;
    position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto;
    padding: 14px 8px 10px; border: 1px solid var(--bd); border-radius: 12px;
    background: color-mix(in srgb, var(--s1) 70%, transparent);
  }
}
.br-rail-hd {
  padding: 0 10px 8px; font-family: var(--font-display); font-size: 10px; font-weight: 700;
  letter-spacing: 1.6px; text-transform: uppercase; color: var(--txm);
}
.br-rail-item {
  display: flex; align-items: baseline; gap: 10px; width: 100%; text-align: left;
  padding: 8px 10px; border: 0; border-radius: 8px; background: none;
  color: var(--txd); font-size: 12.5px; line-height: 1.4;
  transition: background .15s, color .15s;
}
.br-rail-item:hover { background: var(--s2); color: var(--tx); }
.br-rail-item.on { background: color-mix(in srgb, var(--ac) 13%, transparent); color: var(--tx); }
.br-rail-n { flex: 0 0 auto; font-family: var(--font-mono); font-size: 10.5px; color: var(--txm); }
.br-rail-item.on .br-rail-n { color: var(--acl); }
.br-rail-t strong { font-weight: inherit; color: inherit; }

/* Brief / Text switch in the verdict header */
.br-seg { display: inline-flex; padding: 2px; gap: 2px; border-radius: 999px; background: var(--bg); border: 1px solid var(--bd); }
.br-seg-btn {
  height: 24px; padding: 0 11px; border: 0; border-radius: 999px; background: none;
  color: var(--txm); font-size: 11px; font-weight: 500;
}
.br-seg-btn:hover { color: var(--tx); }
.br-seg-btn.on { background: var(--s3); color: var(--tx); }

@media (max-width: 760px) {
  .verdict-body.brief { padding: 14px 12px 18px; }
  .br-hero { padding: 16px 16px 14px; border-radius: 12px; }
  .br-headline { font-size: 19px; }
  .br-headline.long { font-size: 17px; }
  .br-summary { font-size: 14.5px; }
  .br-conf-bar { width: 96px; }
  .br-toc { flex-wrap: nowrap; overflow-x: auto; margin: 0 -12px 12px; padding: 0 12px; }
  .br-toc-chip { height: 36px; flex: 0 0 auto; max-width: 70vw; }
  .br-intro { margin: 0 2px 12px; }
  .br-sec { padding: 14px 14px 12px; border-radius: 11px; }
  .br-sec-title { font-size: 15.5px; }
  .br-points.two { grid-template-columns: minmax(0, 1fr); }
  .br-notes { padding: 12px 14px; }
  .br-seg-btn { height: 32px; padding: 0 13px; }
  .br-groups { grid-template-columns: minmax(0, 1fr); }
  .br-group-title { margin: 18px 2px 10px; }
  .br-flow-step { white-space: normal; }
  .verdict-body.brief.report { padding: 0; }
  .report .br-hero { padding: 18px 16px 16px; }
  .br-cover-title { font-size: 21px; margin-bottom: 12px; }
  .br-lede { font-size: 15px; }
  .report .br-sec { padding: 16px 14px 14px; }
  .report .br-sec-n { width: 26px; height: 26px; font-size: 11.5px; }
  .report .br-sec-title { font-size: 16.5px; }
  .report .br-sec-body p, .report .br-intro p { font-size: 14.5px; line-height: 1.7; }
  .report .br-toc { margin-left: -12px; margin-right: -12px; }
}

/* ══ TYPE ══════════════════════════════════════════════════════════════════
   RiftIQ's three faces, applied by MEANING rather than by region.

   Inter carries running UI and, most importantly, the answers -- a verdict is
