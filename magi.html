/* ══════════════════════════════════════════════════════════════════════════
   MAGI — multi-model council. Evangelion MAGI console, in the TaskHub palette.
   --------------------------------------------------------------------------
   Ask one question, get independent answers from ChatGPT, Claude, Gemini and
   DeepSeek, then one synthesised verdict naming agreements, disagreements and
   confidence. The council runs on Tony's PC — it drives real logged-in Chrome
   profiles, which cannot leave the machine — so THIS file is only the console.
   Where the engine is, and how this page finds it, is the `link` section of
   the script below.

   Ported from Veda's React/Vite build to the A1 single-file shape: one .html
   at the repo root, no build step, no bundle, served straight off GitHub
   Pages. The palette tokens are the suite's, unchanged; the MAGI layer on top
   is structural rather than a recolour — hard-edged blocks wired together with
   visible connection lines, uppercase tracked labels, and status that animates
   while the council deliberates.
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  --bg:#1B1C1E; --s1:#26272A; --s2:#2E2F33; --s3:#3A3B40;
  --bd:#3D3E43; --bdl:#4A4B51;
  --tx:#ECECEE; --txd:#AFB0B5; --txm:#76777C;
  --ac:#8D769A; --acl:#A892B0; --acd:#6E5C7A;
  --grn:#5DAF6D; --red:#f85149; --amber:#E2C285; --gold:#e0b874;
  --shadow:rgba(0,0,0,.5);
  --font:'IBM Plex Mono','DM Mono',ui-monospace,Consolas,monospace;
  --font-display:'Manrope',system-ui,-apple-system,sans-serif;
  --r-sm:4px; --r-btn:5px; --r-card:6px;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  background:var(--bg); color:var(--tx); font-family:var(--font);
  font-size:13px; line-height:1.55; -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
/* Scrollbars are hidden globally across the suite. */
*{scrollbar-width:none;-ms-overflow-style:none;}
*::-webkit-scrollbar{display:none;width:0;height:0;}
a,button,label,select,[role="button"]{touch-action:manipulation;cursor:pointer;}
input,select,textarea,button{font-family:var(--font);}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:1px;}
[hidden]{display:none!important;}

/* Faint scanline wash over the whole console. */
body::before{
  content:""; position:fixed; inset:0; z-index:9999; pointer-events:none;
  background:repeating-linear-gradient(to bottom,
    rgba(255,255,255,.014) 0px, rgba(255,255,255,.014) 1px,
    transparent 1px, transparent 3px);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body, #root { height: 100%; }

body {
  background: var(--bg);
  color: var(--tx);
  font-family: var(--font);
  font-size: 13px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

/* Faint scanline wash over the whole console. */
body::before {
  content: "";
  position: fixed; inset: 0; z-index: 9999; pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    rgba(255,255,255,.014) 0px,
    rgba(255,255,255,.014) 1px,
    transparent 1px,
    transparent 3px
  );
}

/* ── app shell: fixed sidebar + scrolling content ─────────────────────── */
/* The sidebar is the app's navigation surface (Claude desktop's shape): a
   fixed-width rail that owns brand, run controls, system drawers and Studio,
   collapsing to icons only. The content area scrolls independently so the
   nav never scrolls away from a long verdict. */
.shell {
  display: grid;
  grid-template-columns: var(--nav-w, 232px) minmax(0, 1fr);
  height: 100%;
  transition: grid-template-columns .18s ease;
}
.shell.nav-collapsed { --nav-w: 56px; }

.sidebar {
  background: var(--s1);
  border-right: 1px solid var(--bd);
  display: flex; flex-direction: column;
  min-height: 0; overflow: hidden;
}
.side-top {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 10px 10px;
  border-bottom: 1px solid var(--bd);
  min-height: 60px;
}
.side-toggle {
  background: transparent; border: none; color: var(--txm);
  width: 30px; height: 30px; flex-shrink: 0; border-radius: 7px;
  font-size: 14px; cursor: pointer; font-family: inherit;
  display: inline-flex; align-items: center; justify-content: center;
  transition: background .15s, color .15s;
}
.side-toggle:hover { background: var(--s2); color: var(--tx); }
/* The brand collapses out of the rail rather than wrapping or clipping
   mid-word, which is what a plain overflow:hidden would have done. */
.side-brand { min-width: 0; overflow: hidden; }
.nav-collapsed .side-brand { display: none; }

.side-nav {
  flex: 1; min-height: 0; overflow-y: auto;
  padding: 8px 8px 20px;
  display: flex; flex-direction: column; gap: 1px;
}

/* ── sidebar rows ─────────────────────────────────────────────────────── */
/* Same flat icon+label language the header nav used, turned vertical: no
   border at rest, soft fill on hover, stronger fill when active. */
.side-item {
  display: flex; align-items: center; gap: 10px; width: 100%;
  background: transparent; color: var(--txd); border: none; border-radius: 7px;
  padding: 7px 9px; min-height: 32px;
  font-family: inherit; font-size: 11.5px; font-weight: 600; letter-spacing: .3px;
  text-align: left; cursor: pointer;
  transition: background .15s, color .15s;
}
.side-item:hover:not(:disabled):not(.disabled) { background: var(--s2); color: var(--tx); }
.side-item.active { background: color-mix(in srgb, var(--ac) 16%, transparent); color: var(--acl); }
.side-item:disabled, .side-item.disabled { opacity: .4; cursor: not-allowed; }
.side-item.danger { color: var(--red); }
.side-item.danger:hover:not(:disabled) { background: rgba(248, 81, 73, .12); }
.side-ic {
  display: inline-flex; align-items: center; justify-content: center;
  width: 18px; flex-shrink: 0; font-size: 12px; color: var(--ac);
}
.side-item.active .side-ic { color: var(--acl); }
.side-item.danger .side-ic { color: var(--red); }
/* Studio rows carry their format's own accent, the same colour the open
   artifact is keyed to -- so the rail and the content agree at a glance. */
.side-ic.studio-ic { color: var(--sa, var(--ac)); }
.side-label {
  flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.side-tag {
  flex-shrink: 0; font-size: 9.5px; color: var(--txm); letter-spacing: .5px;
}

/* ── sidebar sections ─────────────────────────────────────────────────── */
.side-sec { display: flex; flex-direction: column; gap: 1px; margin-top: 14px; }
.side-sec-hd {
  font-size: 9px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase;
  color: var(--txm); padding: 4px 9px 6px;
}
.side-sec-note { color: var(--txm); font-size: 10px; padding: 0 9px 6px; line-height: 1.45; }

/* Collapsed: an icon-only rail. Labels and section headings are hidden
   rather than removed from the DOM, so the title attribute still names each
   row for both pointer and screen-reader users. */
.nav-collapsed .side-label,
.nav-collapsed .side-tag,
.nav-collapsed .side-sec-note { display: none; }
.nav-collapsed .side-item { justify-content: center; padding: 7px 0; }
.nav-collapsed .side-sec-hd {
  /* A rule instead of text: the heading is unreadable at 56px, but the
     grouping it marks still needs to be visible. */
  height: 1px; padding: 0; margin: 8px 10px; overflow: hidden;
  background: var(--bd); color: transparent;
}

/* Below this a 232px rail is a third of the viewport, so the icon-only form
   is forced regardless of the stored preference. The preference is not
   overwritten -- widening the window restores whatever the user chose. */
@media (max-width: 820px) {
  .shell { grid-template-columns: 56px minmax(0, 1fr); }
  .side-brand,
  .side-label,
  .side-tag,
  .side-sec-note { display: none; }
  .side-item { justify-content: center; padding: 7px 0; }
  .side-sec-hd {
    height: 1px; padding: 0; margin: 8px 10px; overflow: hidden;
    background: var(--bd); color: transparent;
  }
  .side-toggle { display: none; }
  .side-top { justify-content: center; padding: 12px 4px 10px; }
}

.wordmark {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 750; letter-spacing: 2px; line-height: 1.2;
  color: var(--acl); white-space: nowrap;
}
.tagline {
  color: var(--txm); font-size: 8.5px; letter-spacing: 1.4px;
  text-transform: uppercase; margin-top: 1px; white-space: nowrap;
}
/* ── flat icon+label control ──────────────────────────────────────────── */
/* No outline at rest, a soft fill on hover, a stronger fill when toggled.
   Used for the inline controls inside panels (Studio's Regenerate/Close, the
   audio player); the sidebar has its own vertical variant in .side-item. */
.navitem {
  display: inline-flex; align-items: center; gap: 7px;
  background: transparent; color: var(--txd); border: none; border-radius: 7px;
  padding: 7px 10px; height: 30px; box-sizing: border-box;
  font-family: inherit; font-size: 11px; font-weight: 600; letter-spacing: .3px;
  cursor: pointer; transition: background .15s, color .15s;
}
.navitem:hover:not(:disabled) { background: var(--s2); color: var(--tx); }
.navitem.active { background: color-mix(in srgb, var(--ac) 16%, transparent); color: var(--acl); }
.navitem:disabled { opacity: .45; cursor: not-allowed; }
.navitem.danger { color: var(--red); }
.navitem.danger:hover:not(:disabled) { background: rgba(248, 81, 73, .12); color: var(--red); }
.navitem-ic {
  display: inline-flex; align-items: center; justify-content: center;
  width: 16px; font-size: 12px; color: var(--ac); flex-shrink: 0;
}
.navitem.active .navitem-ic { color: var(--acl); }
.navitem.danger .navitem-ic { color: var(--red); }

/* ── buttons: the gitaBtnStyle recipe ─────────────────────────────────── */
.btn {
  background: transparent; color: var(--ac);
  border: 1px solid var(--bdl); border-radius: var(--r-btn);
  padding: 0 10px; height: 28px; box-sizing: border-box;
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 10px; font-weight: 700; cursor: pointer;
  font-family: inherit; text-transform: uppercase; letter-spacing: 1px;
  transition: all .15s;
}
.btn:hover:not(:disabled) { border-color: var(--ac); }
.btn.active { background: var(--ac); color: var(--bg); border-color: var(--ac); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.danger { color: var(--red); }
.btn.danger:hover:not(:disabled) { border-color: var(--red); }

/* ── layout ───────────────────────────────────────────────────────────── */
/* The content column scrolls on its own so the sidebar stays put; min-width:0
   is load-bearing on a grid child or wide tables push the whole column out. */
.page {
  min-width: 0; overflow-y: auto; height: 100%;
  padding: 20px clamp(12px, 3vw, 28px) 60px;
}
.page > * { max-width: 2000px; margin-left: auto; margin-right: auto; }

/* ── composer ─────────────────────────────────────────────────────────── */
/* Modelled on Claude's own input box: one rounded card holding the text, an
   attachment strip, and a toolbar row -- rather than a bare textarea beside a
   button. The card itself is the focus target so the whole thing lights up
   together, not just the textarea inside it. */
.qbar {
  background: var(--s2); border: 1px solid var(--bd); border-radius: 16px;
  padding: 10px 10px 8px; margin-bottom: 8px;
  display: flex; flex-direction: column; gap: 2px;
  transition: border-color .15s, box-shadow .15s, background .15s;
}
.qbar:focus-within {
  border-color: var(--ac);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--ac) 16%, transparent);
}
.qbar.drag {
  border-color: var(--ac); border-style: dashed;
  background: color-mix(in srgb, var(--ac) 6%, var(--s2));
}
/* Height is set inline by the auto-grow effect in App.tsx, so the box fits
   its prompt instead of scrolling internally. max-height is the backstop: a
   pasted essay caps here and scrolls rather than pushing Convene off-screen.
   `resize: none` because the drag handle would fight the auto-sizing. */
.qbar textarea {
  background: transparent; color: var(--tx); border: none;
  padding: 6px 6px 4px; font-family: inherit; font-size: 14px;
  resize: none; min-height: 26px; max-height: 45vh; outline: none;
  line-height: 1.5;
  overflow-y: auto;
}
.qbar textarea::placeholder { color: var(--txm); }
.qbar textarea:disabled { color: var(--txd); }

/* Toolbar row: "+" attach on the left, Convene pinned to the right -- same
   shape as Claude's model-row beneath the composer. */
.qbar-toolbar { display: flex; align-items: center; gap: 6px; padding: 2px 2px 0; }
.qbar-spacer { flex: 1; }

.qbar-attach {
  width: 30px; height: 30px; border-radius: 50%;
  background: transparent; color: var(--txd); border: 1px solid var(--bdl);
  font-size: 18px; line-height: 1; font-family: inherit; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  transition: all .15s;
}
.qbar-attach:hover:not(:disabled) { border-color: var(--ac); color: var(--ac); }
.qbar-attach:disabled { opacity: .4; cursor: not-allowed; }

.qbar-send {
  height: 32px; border-radius: 16px; padding: 0 16px;
}

/* Refine sits beside "+" on the left, not next to Convene: it acts on the
   text you are still writing, so it belongs with the other compose-time
   controls rather than with the button that ends composing. Quieter than
   .btn.active for the same reason -- Convene stays the one obvious action. */
.qbar-refine {
  height: 30px; border-radius: 15px; padding: 0 12px;
  background: transparent; color: var(--txd);
  border: 1px solid var(--bdl);
  display: inline-flex; align-items: center; gap: 6px;
  font-family: inherit; font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 1px;
  cursor: pointer; transition: all .15s;
  /* Clips any sub-pixel overshoot to the pill, so the spin can never paint
     over the border it lives in. */
  overflow: hidden;
}
.qbar-refine:hover:not(:disabled) { border-color: var(--ac); color: var(--ac); }
.qbar-refine:disabled { opacity: .4; cursor: not-allowed; }
/* A refine is a few seconds, not instant -- so the button has to keep saying
   it is working the whole time rather than just going dead.

   Everything below exists to keep that animation INSIDE the button's border.
   Three separate things were escaping it:

   1. The glyph rotated as a bare inline box, so its bounding box grew and
      shrank through the turn and shoved the label sideways with it.
   2. "Refining…" is wider than "Refine", so the button itself resized the
      moment it was clicked -- and being in a flex row, that pushed every
      control after it along.
   3. A rotated glyph sweeps a circle of its diagonal, which is wider than the
      glyph -- enough to graze the 15px border radius at the pill's end cap.

   Fixed by giving the glyph a square box it can spin freely inside, and
   reserving the label's busy width up front so no layout depends on state. */
.qbar-refine.busy { color: var(--ac); border-color: var(--ac); opacity: 1; }
.qbar-refine.busy:disabled { opacity: 1; }
/* A fixed square that owns the glyph's footprint: the rotation happens inside
   this box, so no amount of spinning changes what the flex row measures.
   grid+place-items keeps the glyph optically centred, which is what stops the
   wobble -- rotating around a box's centre is only stable if it starts there. */
.qbar-refine-ico {
  width: 12px; height: 12px;
  display: grid; place-items: center;
  flex: 0 0 auto;
  line-height: 1;
}
.qbar-refine.busy .qbar-refine-ico {
  animation: refine-spin 1s linear infinite;
  /* Belt and braces: the glyph cannot lay out larger than its box even mid-
     rotation, so a font that renders ◌ wider than expected still cannot push
     the border outward. */
  transform-origin: 50% 50%;
}
@keyframes refine-spin { to { transform: rotate(360deg); } }
/* Reserve the wider of the two labels ("Refining…") at all times, so pressing
   the button changes only pixels inside it -- never its width, and never the
   position of anything beside it. Centred so the shorter idle label sits
   evenly rather than hugging the glyph. */
.qbar-refine-txt {
  /* Measured: "Refining…" needs 58.5px at this size/letter-spacing, "Refine"
     39px. 5.9em (~59px) is the tightest value that still fits the longer label
     -- 6.2em left a visible dead gap beside the shorter one. Kept in em so it
     tracks the font-size rather than silently clipping if that changes. */
  min-width: 5.9em;
  text-align: center;
  white-space: nowrap;
}
/* Respect a reduced-motion preference: keep the state legible via colour and
   the label, drop the spin. */
@media (prefers-reduced-motion: reduce) {
  .qbar-refine.busy .qbar-refine-ico { animation: none; }
}
/* The label is the affordance on a wide composer, but on a narrow one the
   glyph alone still reads and leaves room for Convene. */
@media (max-width: 620px) { .qbar-refine-txt { display: none; } }

.qbar-undo {
  height: 30px; padding: 0 8px;
  background: transparent; color: var(--txm);
  border: none; border-radius: 15px;
  font-family: inherit; font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 1px;
  cursor: pointer; transition: color .15s;
}
.qbar-undo:hover:not(:disabled) { color: var(--ac); }
.qbar-undo:disabled { opacity: .4; cursor: not-allowed; }

.qbar-error {
  color: var(--red); font-size: 10.5px; letter-spacing: .3px;
  padding: 0 6px; margin-top: -2px;
}

/* Attachment strip: file/image chips above the textarea, inside the same card. */
.qbar-chips {
  display: flex; flex-wrap: wrap; gap: 8px;
  padding: 2px 2px 8px;
}
.chipfile {
  display: flex; align-items: center; gap: 8px;
  background: var(--s1); border: 1px solid var(--bd); border-radius: 10px;
  padding: 5px 8px 5px 5px; max-width: 220px;
}
.chipfile-thumb {
  width: 32px; height: 32px; border-radius: 6px; object-fit: cover; flex-shrink: 0;
}
.chipfile-icon {
  width: 32px; height: 32px; border-radius: 6px; flex-shrink: 0;
  background: color-mix(in srgb, var(--ac) 18%, transparent); color: var(--ac);
  display: flex; align-items: center; justify-content: center; font-size: 14px;
}
.chipfile-info { display: flex; flex-direction: column; min-width: 0; gap: 1px; }
.chipfile-name {
  font-size: 11.5px; color: var(--tx); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; max-width: 130px;
}
.chipfile-size { font-size: 9.5px; color: var(--txm); letter-spacing: .3px; }
.chipfile-x {
  background: transparent; border: none; color: var(--txm); cursor: pointer;
  font-size: 10px; padding: 3px; line-height: 1; border-radius: 50%;
  flex-shrink: 0; transition: all .15s;
}
.chipfile-x:hover:not(:disabled) { color: var(--red); background: rgba(248, 81, 73, .12); }
.chipfile-x:disabled { opacity: .4; cursor: not-allowed; }

.members { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
.members .label { color: var(--txm); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }

/* Two stacked labels: the model name (what you are actually toggling) over
   its MAGI codename. Centred so the pair reads as one chip rather than two
   left-aligned lines. */
.chip {
  border: 1px solid var(--bd); border-radius: var(--r-sm);
  padding: 3px 9px; cursor: pointer; background: transparent; color: var(--txd);
  font-family: inherit; transition: all .15s;
  display: inline-flex; flex-direction: column; align-items: center; line-height: 1.25;
}
.chip-model {
  font-size: 10.5px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase;
}
/* Dimmed against the model name it sits under. `currentColor` at low opacity
   rather than a fixed grey, so it stays legible both on the transparent
   "off" chip and on the accent-filled "on" one. */
.chip-unit {
  font-size: 8px; font-weight: 600; letter-spacing: 1.1px; text-transform: uppercase;
  opacity: .62;
}
.chip-unit:empty { display: none; }
.chip.on { color: var(--bg); }
.chip:disabled { opacity: .45; cursor: not-allowed; }

/* ══ MAGI CONSOLE ═════════════════════════════════════════════════════ */

.magi {
  position: relative;
  margin: 4px 0 18px;
  padding: 10px 0 0;
}

/* The wiring between the member blocks and the core, drawn behind them. */
.magi-links {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  pointer-events: none; z-index: 0;
}
.magi-link {
  stroke: var(--bd);
  stroke-width: 1.5;
  fill: none;
  transition: stroke .25s;
}
.magi-link.live {
  stroke: var(--pa, var(--ac));
  stroke-dasharray: 5 7;
  animation: flow 1s linear infinite;
}
.magi-link.settled { stroke: var(--pa, var(--ac)); opacity: .5; }
.magi-link.dead { stroke: var(--red); opacity: .45; stroke-dasharray: 2 4; }

@keyframes flow { to { stroke-dashoffset: -12; } }

/* Grid: two members, core, two members. */
/* Two unit columns flanking the core, which spans both rows so it sits level
   with the midpoint of the four blocks -- the wiring then converges on it
   symmetrically from all four corners. */
.magi-grid {
  position: relative; z-index: 1;
  display: grid;
  grid-template-columns: 1fr 1fr minmax(190px, .62fr);
  grid-template-rows: auto auto;
  gap: 14px 26px;
  align-items: stretch;
}
.magi-core-cell {
  grid-column: 3; grid-row: 1 / span 2;
  display: flex; align-items: center; justify-content: center;
}

@media (max-width: 900px) {
  .magi-grid { grid-template-columns: 1fr; }
  .magi-core-cell { grid-row: auto; order: 99; }
  .magi-links { display: none; }
}

/* ── member block ─────────────────────────────────────────────────────── */
/* A unit is a closed block by default: four simultaneous answer dumps is more
   text than anyone reads, and the console is meant to show STATE at a glance.
   The answer is one click away, and the verdict below is the thing to read. */
.node {
  background: var(--s1);
  border: 1px solid var(--bd);
  border-left: 3px solid var(--pa, var(--ac));
  border-radius: 2px;                    /* hard-edged, console-like */
  display: flex; flex-direction: column;
  overflow: hidden;
  position: relative;
  transition: border-color .25s, box-shadow .25s;
}
/* Collapsed blocks are uniform and short; only an opened one grows. */
.node.collapsed { min-height: 0; }
.node.open { min-height: 168px; }

.node.working {
  border-color: var(--pa, var(--ac));
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--pa, var(--ac)) 28%, transparent),
              0 0 22px -8px var(--pa, var(--ac));
  /* Each unit pulses in its OWN accent, and --pd staggers the phase so the
     four blocks are visibly out of step with each other rather than blinking
     as one bank. That difference is what reads as four independent machines
     thinking, instead of one animation applied four times. */
  animation: unitblink 1.9s ease-in-out infinite;
  animation-delay: var(--pd, 0s);
}
@keyframes unitblink {
  0%, 100% {
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--pa, var(--ac)) 26%, transparent),
                0 0 20px -10px var(--pa, var(--ac));
  }
  50% {
    box-shadow: 0 0 0 1px var(--pa, var(--ac)),
                0 0 26px -4px var(--pa, var(--ac));
  }
}
.node.failed { border-color: var(--red); border-left-color: var(--red); }

/* Sweep of light across a block while that member is thinking. Staggered on
   the same offset as the blink so a unit's two cues move together. */
.node.working::after {
  content: "";
  position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(
    100deg,
    transparent 40%,
    color-mix(in srgb, var(--pa, var(--ac)) 14%, transparent) 50%,
    transparent 60%
  );
  background-size: 260% 100%;
  animation: sweep 2.1s ease-in-out infinite;
  animation-delay: var(--pd, 0s);
}
@keyframes sweep {
  0%   { background-position: 160% 0; }
  100% { background-position: -60% 0; }
}

/* The whole header is the toggle, so it is a real button: keyboard reachable,
   and the hit target is the full width of the block rather than an icon. */
.node-hd {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; padding: 7px 11px; width: 100%;
  border: none; border-bottom: 1px solid var(--bd);
  background: color-mix(in srgb, var(--pa, var(--ac)) 7%, transparent);
  font-family: inherit; text-align: left; cursor: pointer;
  transition: background .15s;
}
.node.collapsed .node-hd { border-bottom-color: transparent; }
.node-hd:hover { background: color-mix(in srgb, var(--pa, var(--ac)) 14%, transparent); }
.node-hd:focus-visible { outline: 1px solid var(--pa, var(--ac)); outline-offset: -2px; }

/* Caret marking open/closed. Rotates rather than swapping glyphs, so the
   state change is a movement the eye follows. */
.node-caret {
  color: var(--txm); font-size: 9px; flex-shrink: 0;
  transition: transform .2s, color .15s;
}
.node.open .node-caret { transform: rotate(90deg); color: var(--pa, var(--ac)); }

/* Closed, a unit still has to report SOMETHING, or four identical boxes tell
   you nothing. This is the one-line status strip under the header. */
.node-peek {
  padding: 7px 11px 9px;
  display: flex; align-items: center; gap: 8px;
  font-size: 10px; letter-spacing: .5px; color: var(--txm);
  border-top: 1px solid color-mix(in srgb, var(--bd) 55%, transparent);
}
.node-peek .bar {
  flex: 1; height: 2px; border-radius: 2px; overflow: hidden;
  background: color-mix(in srgb, var(--bd) 70%, transparent);
}
.node-peek .bar i {
  display: block; height: 100%; background: var(--pa, var(--ac));
  transition: width .4s ease-out;
}
.node-peek .hint { color: var(--txm); opacity: .75; white-space: nowrap; }
/* The model name. Less letter-spacing than the codename it replaced -- wide
   tracking suits a call-sign like MELCHIOR·01 but makes an ordinary word
   like "DeepSeek" hard to read. */
.node-id {
  font-size: 12px; font-weight: 700; letter-spacing: .6px;
  color: var(--pa, var(--ac));
}
/* The codename, demoted to the secondary line: keeps the console flavour
   without competing with the fact of which model answered. */
.node-sub {
  font-size: 8.5px; letter-spacing: 1.3px; text-transform: uppercase;
  color: var(--txm); margin-top: -1px;
}
.node-sub:empty { display: none; }
.node-meta { color: var(--txm); font-size: 9.5px; letter-spacing: .5px; }

.node-body {
  padding: 10px 11px; overflow-y: auto; max-height: 300px;
  white-space: pre-wrap; word-break: break-word;
  font-size: 12.5px; color: var(--txd); flex: 1;
}
.node-body.idle { color: var(--txm); font-style: italic; }

/* Blinking cursor while a member is still writing. */
.caret {
  display: inline-block; width: 7px; height: 13px;
  background: var(--pa, var(--ac)); vertical-align: text-bottom;
  margin-left: 2px; animation: blink 1s steps(2) infinite;
}
@keyframes blink { 0%, 50% { opacity: 1 } 50.01%, 100% { opacity: 0 } }

/* ── status badges ────────────────────────────────────────────────────── */
.badge {
  font-size: 8.5px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase;
  padding: 2px 6px; border-radius: 2px; border: 1px solid currentColor; white-space: nowrap;
}
.badge.idle    { color: var(--txm); }
.badge.working { color: var(--amber); animation: pulse 1.4s ease-in-out infinite; }
.badge.done    { color: var(--grn); }
.badge.failed  { color: var(--red); }
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .4 } }

/* ── the core / verdict block ─────────────────────────────────────────── */
.core {
  width: 100%;
  background: var(--s1);
  border: 1px solid var(--bd);
  border-radius: 2px;
  padding: 16px 14px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px; text-align: center; min-height: 150px;
  position: relative; overflow: hidden;
  transition: border-color .3s;
}
.core.deliberating { border-color: var(--ac); }
.core.resolved     { border-color: var(--grn); }
.core.blocked      { border-color: var(--red); }

.core-label {
  font-size: 9px; letter-spacing: 2.4px; text-transform: uppercase; color: var(--txm);
}
.core-status {
  font-family: var(--font-display);
  font-size: clamp(15px, 2.1vw, 21px);
  font-weight: 750; letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--ac);
}
.core.deliberating .core-status { animation: pulse 1.5s ease-in-out infinite; }
.core.resolved .core-status { color: var(--grn); }
.core.blocked  .core-status { color: var(--red); }

.core-count {
  font-size: 10px; letter-spacing: 1.2px; color: var(--txd);
}

/* Concentric rings that expand while the council deliberates. */
.core.deliberating::before,
.core.deliberating::after {
  content: "";
  position: absolute; left: 50%; top: 50%;
  width: 40px; height: 40px; margin: -20px 0 0 -20px;
  border: 1px solid var(--ac); border-radius: 50%;
  opacity: 0; animation: ring 2.6s ease-out infinite;
}
.core.deliberating::after { animation-delay: 1.3s; }
@keyframes ring {
  0%   { transform: scale(.5); opacity: .5; }
  100% { transform: scale(6);  opacity: 0; }
}

/* ── verdict panel ────────────────────────────────────────────────────── */
.verdict {
  background: var(--s1); border: 1px solid var(--bd);
  border-left: 3px solid var(--ac); border-radius: 2px; overflow: hidden;
  animation: rise .35s ease-out;
}
@keyframes rise {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: none; }
}
.verdict-hd {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 12px; padding: 9px 14px; border-bottom: 1px solid var(--bd); flex-wrap: wrap;
  background: color-mix(in srgb, var(--ac) 8%, transparent);
}
.verdict-title {
  font-size: 11px; font-weight: 700; letter-spacing: 2.2px;
  text-transform: uppercase; color: var(--ac);
}
.verdict-quorum { color: var(--txm); font-size: 10px; letter-spacing: .6px; }

/* The verdict is the finished answer, so it is set as prose -- wider leading,
   real paragraphs and lists -- rather than as the monospace console dump the
   member blocks use. It is the one place in the console meant to be READ.
   On a wide screen the caveats and the confidence rating move into a sidebar,
   so the answer keeps a readable measure instead of stretching to 2000px. */
.verdict-body {
  padding: 22px 24px 24px;
  /* The console runs to 2000px but prose does not; the whole verdict block is
     capped and centred so the answer and its sidebar sit together in the
     middle rather than leaving a dead gutter down one side. */
  max-width: 1180px; margin: 0 auto;
  font-size: 14px; line-height: 1.72; color: var(--tx);
  /* Set in the display face, not the console mono. The member blocks are a
     machine dump and stay monospace; the verdict is the finished answer and is
     the one thing here a person sits and READS. Monospace at paragraph length
     is what made it a wall. */
  font-family: var(--font-display);
  letter-spacing: .1px;
}
/* The answer column is capped near 78ch for readability and the sidebar is
   fixed-width, so on a very wide screen the pair is centred as a unit rather
   than being flung to opposite edges with dead space between them. */
/* The pair is centred as a unit and capped, rather than the answer track being
   allowed to grow to the full 2000px page. `1fr` on the answer with a max-width
   on the wrapper keeps the two columns adjacent instead of being pushed to
   opposite edges with a dead gutter between them. */
.verdict-body.split {
  display: grid;
  grid-template-columns: minmax(0, 78ch) minmax(230px, 290px);
  justify-content: center;
  gap: 22px 40px;
  align-items: start;
}
/* Without a sidebar there is no grid to cap the measure, so on a 2000px page
   the answer ran the full width -- ~200 characters a line, which is the single
   worst thing you can do to a block of prose. Cap and centre it so a
   one-column verdict reads the same as the answer column of a split one. */
.verdict-body:not(.split) > .v-main {
  max-width: 78ch;
  margin: 0 auto;
}
/* min-width:0 is load-bearing: without it a wide table blows out the grid
   track instead of scrolling inside .v-tablewrap. */
.v-main { min-width: 0; }

/* ── sidebar ── */
/* align-self keeps the cards hugging their content instead of stretching to
   the height of the answer column (or of the collapsed row below it). */
.v-aside { display: flex; flex-direction: column; gap: 12px; min-width: 0; align-self: start; }
.v-card {
  border: 1px solid var(--bd); border-left: 2px solid var(--acd);
  border-radius: 2px; padding: 10px 12px 11px;
  background: color-mix(in srgb, var(--s2) 55%, transparent);
}
.v-card > *:last-child { margin-bottom: 0; }
.v-card p, .v-card .v-list li { font-size: 12.5px; line-height: 1.6; color: var(--txd); }

/* ── inline + blocks ── */
.verdict-body p { margin: 0 0 14px; }
.verdict-body p:last-child { margin-bottom: 0; }
.verdict-body strong { color: var(--tx); font-weight: 700; }
.verdict-body em { color: var(--txd); font-style: italic; }
.verdict-body code {
  font-family: var(--font);
  background: var(--s2); border: 1px solid var(--bd); border-radius: 3px;
  padding: 1px 5px; font-size: 12px; color: var(--acl);
}

/* The opening paragraph is the answer in one breath; everything after it is
   the supporting detail. Sized up so it lands before anything else, and given
   a tinted panel rather than a bare rule -- at this width a 2px line was not
   enough to mark it as the thing to read first. */
.v-main .v-lead {
  font-size: 16.5px; line-height: 1.62; color: var(--tx);
  border-left: 2px solid var(--ac);
  background: color-mix(in srgb, var(--ac) 7%, transparent);
  padding: 13px 16px; margin-bottom: 20px; border-radius: 0 3px 3px 0;
}

/* Section label (sidebar cards) and sub-heading (inside the answer). */
.verdict-body .sec {
  font-family: var(--font);
  color: var(--acl); font-weight: 700; letter-spacing: 1.6px;
  text-transform: uppercase; font-size: 10px;
  display: block; margin: 0 0 8px;
  border-bottom: 1px solid var(--bd); padding-bottom: 4px;
}
/* Sub-headings sit in the console face, not the prose face: they are labels
   marking the structure, and the contrast against the body text is what makes
   the sections scannable at a glance. */
.verdict-body .v-h {
  font-family: var(--font);
  color: var(--acl); font-weight: 700; letter-spacing: 1.5px;
  text-transform: uppercase; font-size: 10.5px;
  margin: 26px 0 10px; padding-bottom: 5px;
  border-bottom: 1px solid var(--bd);
  display: flex; align-items: center; gap: 8px;
}
/* A small tick before each heading, so the eye catches the section boundary
   even when scrolling fast. */
.verdict-body .v-h::before {
  content: ""; flex: 0 0 auto;
  width: 5px; height: 5px; background: var(--ac);
  transform: rotate(45deg);
}
.verdict-body .v-h:first-child { margin-top: 0; }

/* ── lists ── */
.verdict-body .v-list { margin: 0 0 14px; padding-left: 20px; }
.verdict-body .v-list li { margin-bottom: 8px; padding-left: 3px; }
.verdict-body .v-list li:last-child { margin-bottom: 0; }
.verdict-body ul.v-list { list-style: none; padding-left: 17px; }
.verdict-body ul.v-list li { position: relative; }
.verdict-body ul.v-list li::before {
  content: "▸"; position: absolute; left: -15px; top: -1px;
  color: var(--ac); font-size: 11px;
}
.verdict-body ol.v-list { padding-left: 22px; }
.verdict-body ol.v-list li::marker {
  color: var(--ac); font-weight: 700; font-family: var(--font); font-size: 12px;
}

/* Nested level: tighter, dimmer, different marker so the hierarchy reads. */
.verdict-body .v-list .v-list { margin: 5px 0 0; padding-left: 14px; }
.verdict-body .v-list .v-list li { font-size: 12.5px; color: var(--txd); margin-bottom: 3px; }
.verdict-body ul.v-list ul.v-list li::before { content: "·"; color: var(--acd); }

/* `- **Sizing:** matters more than brand` -- the lead-in reads as a label. */
.verdict-body .v-list li > strong:first-child {
  color: var(--acl); font-weight: 700; letter-spacing: .3px;
}

/* ── comparison table ── */
.v-tablewrap { overflow-x: auto; margin: 0 0 13px; border: 1px solid var(--bd); border-radius: 2px; }
.v-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.v-table th {
  text-align: left; color: var(--acl); font-size: 9px; font-weight: 700;
  letter-spacing: 1.4px; text-transform: uppercase; white-space: nowrap;
  padding: 7px 11px; border-bottom: 1px solid var(--bd);
  background: color-mix(in srgb, var(--ac) 8%, transparent);
}
.v-table td {
  padding: 6px 11px; border-bottom: 1px solid var(--bd);
  color: var(--txd); vertical-align: top;
}
.v-table tr:last-child td { border-bottom: none; }

/* Confidence reads as a rating, so it gets a tag rather than a sentence. */
.verdict-body .v-conf { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
.verdict-body .conf-tag {
  font-size: 9.5px; font-weight: 700; letter-spacing: 1.4px;
  padding: 2px 8px; border: 1px solid currentColor; border-radius: 2px;
  white-space: nowrap; flex-shrink: 0;
}
.verdict-body .conf-tag.high   { color: var(--grn); }
.verdict-body .conf-tag.medium { color: var(--amber); }
.verdict-body .conf-tag.low    { color: var(--red); }
/* flex-basis 100% drops the justification onto its own line: inside a 240px
   sidebar it has no room to sit beside the tag. */
.verdict-body .conf-why { color: var(--txd); font-size: 12.5px; flex: 1 1 100%; min-width: 0; }
/* When the rating is the sentence's own subject the tag would repeat the word
   that follows it, so the leading rating is dimmed to read as a lead-in
   rather than a stutter. */
.verdict-body .conf-why > .conf-echo { color: var(--txm); }

/* Below this the sidebar has no room to be a sidebar. */
@media (max-width: 1080px) {
  .verdict-body.split { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .v-aside { flex-direction: row; flex-wrap: wrap; }
  .v-aside .v-card { flex: 1 1 260px; }
}
@media (max-width: 640px) {
  /* Stacked again -- the 260px basis above is a WIDTH hint for the side-by-side
     row, and would otherwise become a fixed HEIGHT once the axis flips. */
  .v-aside { flex-direction: column; }
  .v-aside .v-card { flex: 0 0 auto; }
}

/* ── failure callout ──────────────────────────────────────────────────── */
.callout {
  margin: 10px 11px; padding: 9px 11px;
  border: 1px solid var(--red); border-left-width: 3px;
  border-radius: 2px; background: rgba(248, 81, 73, .07);
}
.callout .kind {
  color: var(--red); font-size: 9px; font-weight: 700;
  letter-spacing: 1.4px; text-transform: uppercase; margin-bottom: 4px;
}
.callout .cause { color: var(--tx); font-size: 12px; margin-bottom: 6px; }
.callout .remedy { color: var(--txd); font-size: 11.5px; }
.callout .detail { color: var(--txm); font-size: 10.5px; margin-top: 6px; }

/* A unit that answered with something unusable is amber, not red: it is a
   caution about the verdict's basis, not a system failure. Red is reserved
   for units that could not be reached at all. */
.callout.degraded {
  border-color: var(--amber);
  background: rgba(226, 194, 133, .07);
}
.callout.degraded .kind { color: var(--amber); }
/* The rejected capture itself, quoted back so the user can see what came
   back -- usually a clarifying question, which tells them the prompt was
   ambiguous. Monospaced and boxed to read as a quotation, not as prose. */
.callout.degraded .detail {
  margin-top: 8px; padding: 6px 8px;
  border-left: 2px solid var(--bd);
  color: var(--txd); font-style: italic; font-size: 11px;
}
.badge.degraded { color: var(--amber); }

/* Named directly above the verdict body: a verdict built from three units
   while the display implies four is the failure this exists to prevent. */
.verdict-degraded {
  margin: 0 16px 14px; padding: 9px 11px;
  border: 1px solid var(--amber); border-left-width: 3px;
  border-radius: 2px; background: rgba(226, 194, 133, .07);
  color: var(--txd); font-size: 11.5px; line-height: 1.55;
}
.verdict-degraded strong { color: var(--amber); font-weight: 600; }

/* ══ STUDIO ═══════════════════════════════════════════════════════════ */
/* ── history / doctor drawers ─────────────────────────────────────────── */
.drawer { background: var(--s1); border: 1px solid var(--bd); border-radius: 2px; margin-bottom: 16px; }
.drawer-hd {
  padding: 8px 12px; border-bottom: 1px solid var(--bd);
  font-size: 9.5px; font-weight: 700; letter-spacing: 1.6px;
  text-transform: uppercase; color: var(--txd);
}
.row {
  display: flex; align-items: center; gap: 10px; padding: 7px 12px;
  border-bottom: 1px solid var(--bd); cursor: pointer; font-size: 12px;
}
.row:last-child { border-bottom: none; }
.row:hover { background: var(--s2); }
.row .q { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .meta { color: var(--txm); font-size: 10.5px; white-space: nowrap; }

/* The in-progress state of a doctor pass, carrying its own Stop control so
   cancelling does not depend on finding the sidebar row again. */
.doctor-running {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 12px 14px; color: var(--txd); font-size: 11.5px; line-height: 1.5;
}
.doctor-running > .spin { color: var(--ac); flex-shrink: 0; }

table.doctor { width: 100%; border-collapse: collapse; font-size: 11.5px; }
table.doctor th {
  text-align: left; color: var(--txm); font-size: 9px; font-weight: 700;
  letter-spacing: 1.4px; text-transform: uppercase;
  padding: 6px 12px; border-bottom: 1px solid var(--bd);
}
table.doctor td { padding: 5px 12px; border-bottom: 1px solid var(--bd); color: var(--txd); }
table.doctor td.ok    { color: var(--grn); }
table.doctor td.stale { color: var(--amber); }
table.doctor td.miss  { color: var(--red); }
/* Fields that could not have matched in this page state. Deliberately the
   dimmest row in the table: they are normal, and colouring them like faults
   is what made a working install read as broken. */
table.doctor td.na    { color: var(--txm); opacity: .65; }
table.doctor code { color: var(--txd); font-size: 11px; }

.empty-state { color: var(--txm); text-align: center; padding: 36px 20px; font-size: 12px; letter-spacing: .4px; }
.spin { display: inline-block; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg) } }


   the content area, as one full-width panel. Same hard-edged block language
   as .node and .verdict (2px radius, coloured left accent) so it reads as
   part of this console rather than a pasted-in widget. */
.studio-view {
  background: var(--s1);
  border: 1px solid var(--bd);
  border-left: 3px solid var(--sa, var(--ac));
  border-radius: 2px;
  margin-bottom: 14px;
  overflow: hidden;
  animation: rise .3s ease-out;
}
.studio-view-hd {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 9px 12px; border-bottom: 1px solid var(--bd);
  background: color-mix(in srgb, var(--sa, var(--ac)) 8%, transparent);
}
.studio-view-ic { font-size: 13px; color: var(--sa, var(--ac)); flex-shrink: 0; }
.studio-view-title {
  font-size: 11px; font-weight: 700; letter-spacing: 2.2px;
  text-transform: uppercase; color: var(--tx);
}
.studio-view-status { color: var(--txm); font-size: 10.5px; letter-spacing: .3px; }
.studio-view-body { padding: 14px 16px 18px; }

.studio-regen {
  margin-top: 10px; background: transparent; color: var(--txm); border: 1px solid var(--bd);
  border-radius: 4px; padding: 4px 10px; font-family: inherit; font-size: 10px;
  letter-spacing: .5px; text-transform: uppercase; cursor: pointer; transition: all .15s;
}
.studio-regen:hover { border-color: var(--ac); color: var(--ac); }

.studio-raw {
  white-space: pre-wrap; word-break: break-word; font-size: 11.5px;
  color: var(--txd); margin: 8px 0 0; max-height: 300px; overflow-y: auto;
}

/* ── Data Table card ── */
.studio-tablewrap { overflow-x: auto; margin-top: 8px; }
.studio-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.studio-table th {
  text-align: left; color: var(--acl); font-size: 9px; font-weight: 700;
  letter-spacing: 1.2px; text-transform: uppercase; padding: 6px 9px;
  border-bottom: 1px solid var(--bd);
}
.studio-table td { padding: 6px 9px; border-bottom: 1px solid var(--bd); color: var(--txd); }
.studio-table tr:last-child td { border-bottom: none; }

/* ── Flashcards card ── */
.flashcards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
@media (max-width: 560px) { .flashcards { grid-template-columns: 1fr; } }
.flashcard {
  background: transparent; border: none; padding: 0; cursor: pointer;
  perspective: 800px; height: 92px; font-family: inherit;
}
.flashcard-inner {
  position: relative; width: 100%; height: 100%;
  transform-style: preserve-3d; transition: transform .4s;
}
.flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }
.flashcard-face {
  position: absolute; inset: 0; backface-visibility: hidden;
  border: 1px solid var(--bd); border-radius: 3px; padding: 10px 11px;
  display: flex; align-items: center; font-size: 12px; line-height: 1.4;
  text-align: left; overflow-y: auto;
}
.flashcard-front { background: var(--s2); color: var(--tx); font-weight: 600; }
.flashcard-back { background: color-mix(in srgb, var(--grn) 9%, var(--s2)); color: var(--txd); transform: rotateY(180deg); }

/* ── Quiz card ── */
.quiz { display: flex; flex-direction: column; gap: 14px; margin-top: 8px; }
.quiz-q-text { font-size: 12.5px; color: var(--tx); font-weight: 600; margin-bottom: 7px; }
.quiz-options { display: flex; flex-direction: column; gap: 5px; }
.quiz-opt {
  display: flex; align-items: baseline; gap: 8px; text-align: left;
  background: var(--s2); border: 1px solid var(--bd); border-radius: 3px;
  padding: 6px 9px; font-family: inherit; font-size: 11.5px; color: var(--txd); cursor: pointer;
  transition: all .15s;
}
.quiz-opt:hover:not(:disabled) { border-color: var(--ac); }
.quiz-opt:disabled { cursor: default; }
.quiz-opt.correct { border-color: var(--grn); color: var(--grn); background: rgba(93,175,109,.08); }
.quiz-opt.incorrect { border-color: var(--red); color: var(--red); background: rgba(248,81,73,.08); }
.quiz-opt-letter {
  font-weight: 700; color: var(--acl); flex-shrink: 0; width: 14px;
}
.quiz-why { margin-top: 6px; font-size: 11px; color: var(--txm); padding-left: 2px; }

/* ── Mind Map card ── */
.mindmap { position: relative; display: flex; align-items: center; gap: 26px; padding: 10px 4px; overflow-x: auto; }
.mm-links { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.mm-link { stroke: var(--bd); stroke-width: 1.3; fill: none; }
.mm-root {
  position: relative; z-index: 1; flex-shrink: 0;
  background: color-mix(in srgb, var(--ac) 16%, var(--s2)); border: 1px solid var(--ac);
  border-radius: 3px; padding: 9px 13px; font-size: 12px; font-weight: 700; color: var(--tx);
  max-width: 160px;
}
.mm-branches { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 10px; }
.mm-col { display: flex; align-items: center; gap: 20px; }
.mm-node {
  background: var(--s2); border: 1px solid var(--bd); border-radius: 3px;
  padding: 6px 10px; font-size: 11px; color: var(--txd); max-width: 150px; white-space: normal;
}
.mm-children { display: flex; flex-direction: column; gap: 8px; }

/* ── Slide Deck card ── */
.slidedeck { margin-top: 8px; }
.slide {
  background: var(--s2); border: 1px solid var(--bd); border-radius: 3px;
  padding: 18px 20px; min-height: 140px;
}
.slide-title { font-size: 14px; font-weight: 700; color: var(--tx); margin-bottom: 10px; }
.slide-bullets { padding-left: 18px; margin: 0; }
.slide-bullets li { font-size: 12px; color: var(--txd); margin-bottom: 6px; }
.slide-nav {
  display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 10px;
}
.slide-nav button {
  background: transparent; border: 1px solid var(--bd); color: var(--txd);
  border-radius: 4px; width: 26px; height: 26px; cursor: pointer; font-family: inherit;
}
.slide-nav button:hover:not(:disabled) { border-color: var(--ac); color: var(--ac); }
.slide-nav button:disabled { opacity: .35; cursor: not-allowed; }
.slide-count { font-size: 10.5px; color: var(--txm); letter-spacing: .5px; }

/* ── Audio Overview card ── */
.audio-overview { margin-top: 8px; }
.audio-controls { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.audio-note { color: var(--txm); font-size: 10.5px; }
.audio-transcript {
  max-height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
}
.audio-line {
  font-size: 12px; color: var(--txd); line-height: 1.5; padding: 4px 6px; border-radius: 3px;
}
.audio-line.speaking { background: color-mix(in srgb, var(--ac) 10%, transparent); color: var(--tx); }
.audio-speaker {
  display: inline-block; font-size: 9px; font-weight: 700; letter-spacing: .8px;
  text-transform: uppercase; margin-right: 8px; padding: 1px 6px; border-radius: 2px;
}
.audio-speaker.host-a { color: var(--ac); background: color-mix(in srgb, var(--ac) 16%, transparent); }
.audio-speaker.host-b { color: var(--acl); background: color-mix(in srgb, var(--acl) 16%, transparent); }

/* ── brainstorm ───────────────────────────────────────────────────────────
   The planning session. Keyed to --gold rather than the council's --ac so a
   glance at the screen says which mode is running: the two look similar by
   design (same panels, same grid) and the accent is what tells them apart. */
.bs { display: flex; flex-direction: column; gap: 16px; margin-bottom: 16px; }

.bs-hd { display: flex; flex-direction: column; gap: 4px; }
.bs-title {
  font-size: 11px; font-weight: 700; letter-spacing: 2.2px;
  text-transform: uppercase; color: var(--gold);
}
.bs-sub { color: var(--txd); font-size: 12px; line-height: 1.5; }

.bs-start {
  background: var(--s1); border: 1px solid var(--bd);
  border-left: 3px solid var(--gold); border-radius: 2px; padding: 12px;
}
.bs-topic {
  width: 100%; min-height: 92px; resize: vertical; background: transparent;
  border: 0; outline: 0; color: var(--tx); font-family: var(--font);
  font-size: 13px; line-height: 1.6;
}
.bs-topic::placeholder { color: var(--txm); }
.bs-topic:disabled { color: var(--txd); }
.bs-start-bar { display: flex; align-items: center; gap: 8px; padding-top: 8px; }
.bs-note { color: var(--txm); font-size: 10px; letter-spacing: .5px; }

.bs-phase {
  display: flex; align-items: center; gap: 9px;
  color: var(--txd); font-size: 11px; letter-spacing: .5px;
  background: var(--s1); border: 1px solid var(--bd);
  border-left: 3px solid var(--gold); border-radius: 2px; padding: 11px 14px;
}

/* Questions are the thing the user has to act on, so they get the loudest
   treatment on the page -- louder than the plan draft above them, which is
   there to be read rather than answered. */
.bs-questions {
  background: var(--s1); border: 1px solid var(--bd);
  border-left: 3px solid var(--amber); border-radius: 2px; overflow: hidden;
  animation: rise .35s ease-out;
}
.bs-questions-hd {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 12px; flex-wrap: wrap; padding: 9px 14px;
  border-bottom: 1px solid var(--bd);
  background: color-mix(in srgb, var(--amber) 8%, transparent);
  font-size: 11px; font-weight: 700; letter-spacing: 2.2px;
  text-transform: uppercase; color: var(--amber);
}
.bs-qcount {
  color: var(--txm); font-size: 10px; letter-spacing: .6px;
  font-weight: 400; text-transform: none;
}
/* Question cards. These are the primary controls on the page once a round
   lands, so they get real hit targets and visible focus -- the option rows are
   what the user is here to click. */
.bs-cards { display: grid; gap: 10px; padding: 12px; }

.bs-card {
  background: var(--bg); border: 1px solid var(--bd);
  border-radius: var(--r-card); padding: 11px 12px 12px;
  transition: border-color .15s ease;
}
.bs-card.answered { border-color: color-mix(in srgb, var(--grn) 45%, var(--bd)); }

.bs-card-hd { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
.bs-chip {
  background: color-mix(in srgb, var(--amber) 16%, transparent);
  color: var(--amber); border: 1px solid color-mix(in srgb, var(--amber) 35%, transparent);
  border-radius: 3px; padding: 1px 7px;
  font-size: 9px; letter-spacing: 1.3px; text-transform: uppercase; font-weight: 700;
}
/* A question whose answer changes the plan's structure rather than its
   detail. Deliberately a different hue from the neutral header chip: the
   person skimming which questions to answer needs these to stand out, since
   leaving one unanswered is what makes the finished plan provisional. */
.bs-chip-blocking {
  background: color-mix(in srgb, var(--red, #d9534f) 16%, transparent);
  color: var(--red, #d9534f);
  border-color: color-mix(in srgb, var(--red, #d9534f) 38%, transparent);
  margin-left: 6px;
}

.bs-skip {
  margin-left: auto; background: none; border: 0; cursor: pointer;
  color: var(--txm); font-family: var(--font); font-size: 10px; letter-spacing: .6px;
  padding: 2px 4px; border-radius: 3px;
}
.bs-skip:hover { color: var(--tx); }

.bs-card-q { color: var(--tx); font-size: 13px; line-height: 1.55; margin-bottom: 10px; }

.bs-opts { display: grid; gap: 5px; }
.bs-opt {
  display: flex; align-items: flex-start; gap: 9px; width: 100%;
  text-align: left; cursor: pointer;
  background: var(--s1); border: 1px solid var(--bd);
  border-radius: var(--r-sm); padding: 8px 10px;
  color: var(--txd); font-family: var(--font);
  transition: border-color .12s ease, background .12s ease;
}
.bs-opt:hover:not(:disabled) { border-color: var(--bdl); background: var(--s2); }
.bs-opt:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
.bs-opt:disabled { opacity: .55; cursor: not-allowed; }
.bs-opt.selected {
  border-color: var(--amber);
  background: color-mix(in srgb, var(--amber) 10%, var(--s1));
}
.bs-opt-mark { color: var(--txm); font-size: 11px; line-height: 1.5; }
.bs-opt.selected .bs-opt-mark { color: var(--amber); }
.bs-opt-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.bs-opt-label { color: var(--tx); font-size: 12px; line-height: 1.45; }
.bs-opt.selected .bs-opt-label { font-weight: 700; }
.bs-opt-desc { color: var(--txm); font-size: 11px; line-height: 1.45; }

.bs-open-input {
  width: 100%; margin-top: 7px;
  background: var(--s1); border: 1px solid var(--bd); border-radius: var(--r-sm);
  padding: 8px 10px; color: var(--tx);
  font-family: var(--font); font-size: 12px;
}
.bs-open-input::placeholder { color: var(--txm); }
.bs-open-input:focus { outline: 0; border-color: var(--amber); }
.bs-open-input:disabled { opacity: .55; }

.bs-qlist { margin: 0; padding: 14px 20px 16px 38px; display: grid; gap: 10px; }
.bs-qlist li { color: var(--tx); font-size: 13px; line-height: 1.6; }
.bs-qlist li::marker { color: var(--amber); font-weight: 700; }
.bs-qlist.small li { color: var(--txd); font-size: 12px; }
.bs-qlist.small { padding: 8px 16px 10px 32px; gap: 6px; }

.bs-reply { border-left: 3px solid var(--gold); }
.bs-ready { color: var(--grn); font-size: 10px; letter-spacing: .5px; }
.bs-halt { padding: 0; }

.bs-split, .bs-history {
  background: var(--s1); border: 1px solid var(--bd);
  border-radius: 2px; overflow: hidden;
}
.bs-split > summary, .bs-history > summary {
  cursor: pointer; padding: 9px 14px; color: var(--txd);
  font-size: 10px; letter-spacing: 1.4px; text-transform: uppercase;
  list-style: none; user-select: none;
}
.bs-split > summary::-webkit-details-marker,
.bs-history > summary::-webkit-details-marker { display: none; }
.bs-split > summary::before, .bs-history > summary::before {
  content: "▶ "; color: var(--txm); font-size: 8px;
}
.bs-split[open] > summary::before, .bs-history[open] > summary::before {
  content: "▼ ";
}
.bs-split > summary:hover, .bs-history > summary:hover { color: var(--tx); }

/* Full council answers, kept collapsed. Four answers of ~3000 chars each
   would bury the questions, but they are the evidence behind every merge and
   are never thrown away. */
.bs-council {
  background: var(--bg); border: 1px solid var(--bd);
  border-radius: var(--r-sm); margin-top: 9px; overflow: hidden;
}
.bs-council > summary {
  cursor: pointer; padding: 7px 11px; color: var(--txm);
  font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase;
  list-style: none; user-select: none;
}
.bs-council > summary::-webkit-details-marker { display: none; }
.bs-council > summary::before { content: "▶ "; font-size: 8px; }
.bs-council[open] > summary::before { content: "▼ "; }
.bs-council > summary:hover { color: var(--tx); }

.bs-council-answer { border-top: 1px solid var(--bd); padding: 9px 12px 11px; }
.bs-council-hd {
  display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
  margin-bottom: 5px;
}
.bs-council-name {
  color: var(--acl); font-size: 11px; letter-spacing: 1.1px;
  text-transform: uppercase; font-weight: 700;
}
.bs-council-meta { color: var(--txm); font-size: 10px; }
.bs-council-bad { color: var(--amber); font-size: 10px; }
.bs-council-body {
  color: var(--txd); font-size: 11.5px; line-height: 1.6;
  white-space: pre-wrap; max-height: 320px; overflow-y: auto;
  border-left: 2px solid var(--bd); padding-left: 10px;
}

.bs-hist-round { border-top: 1px solid var(--bd); padding: 10px 14px 12px; }
/* A superseded attempt stays visible but recedes -- it happened, and it is
   not what the session ended up building on. */
.bs-hist-round.superseded { opacity: .62; }
.bs-hist-note { color: var(--amber); text-transform: none; letter-spacing: .3px; }
.bs-hist-hd {
  color: var(--gold); font-size: 10px; letter-spacing: 1.4px;
  text-transform: uppercase; margin-bottom: 6px;
}
.bs-hist-reply {
  color: var(--txd); font-size: 12px; line-height: 1.6;
  border-left: 2px solid var(--bdl); padding: 4px 0 4px 12px; margin-top: 8px;
  white-space: pre-wrap;
}
.bs-hist-label {
  display: block; color: var(--txm); font-size: 10px;
  letter-spacing: 1.2px; text-transform: uppercase; margin-bottom: 3px;
}

/* The finished plan. The path is the payload here -- it is what gets pasted
   into a coding agent -- so it is selectable and given room to wrap. */
.bs-plan-bar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  background: var(--s1); border: 1px solid var(--bd);
  border-left: 3px solid var(--grn); border-radius: 2px; padding: 9px 12px;
}
.bs-path {
  color: var(--grn); font-size: 11px; word-break: break-all;
  user-select: all; font-family: var(--font);
}
.bs-save-state {
  color: var(--txm); font-size: 11px; letter-spacing: .3px;
  display: flex; align-items: center; gap: 5px; flex-wrap: wrap;
}
.bs-save-state code { color: var(--grn); user-select: all; }
.bs-saved-tick { color: var(--grn); }
.bs-hint { color: var(--txm); font-size: 11px; letter-spacing: .4px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ── link status ──────────────────────────────────────────────────────────
   New in the A1 port, and the one piece of UI the React build had no need
   for. There, the backend url was compiled into the bundle, so the page could
   only ever be pointed at one place and "am I connected?" was not a question
   it could answer. Here the page is static and the engine moves, so where it
   is currently reachable — and whether it is reachable at all — has to be
   visible rather than inferred from every button failing. */
.link {
  display: flex; align-items: center; gap: 7px; width: 100%;
  padding: 7px 9px; margin-top: auto; border: 0; border-top: 1px solid var(--bd);
  background: transparent; color: var(--txd); font: inherit; font-size: 10.5px;
  letter-spacing: .4px; text-align: left;
}
.link:hover { background: var(--s2); color: var(--tx); }
.link-dot {
  width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
  background: var(--txm); box-shadow: 0 0 0 0 currentColor;
}
.link.local   .link-dot { background: var(--grn); }
.link.remote  .link-dot { background: var(--acl); }
.link.seeking .link-dot { background: var(--amber); animation: pulse 1.1s ease-in-out infinite; }
.link.down    .link-dot { background: var(--red); }
.link-txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-collapsed .link-txt { display: none; }
.nav-collapsed .link { justify-content: center; }

/* ── setup dialog ─────────────────────────────────────────────────────────
   Where the API token is entered. It is kept in this browser's localStorage
   and never committed: A1 is a PUBLIC repo, and the token is what gates every
   endpoint that drives Tony's paid accounts. The React build inlined it into
   the JS bundle, where anyone with the site link could read it out of page
   source — that is the specific thing this replaces. */
.sheet {
  position: fixed; inset: 0; z-index: 200; display: flex;
  align-items: center; justify-content: center; padding: 20px;
  background: rgba(0,0,0,.62); backdrop-filter: blur(2px);
}
.sheet-box {
  width: 100%; max-width: 460px; background: var(--s1);
  border: 1px solid var(--bd); border-radius: var(--r-card);
  box-shadow: 0 18px 48px var(--shadow); padding: 18px;
  max-height: 92vh; overflow-y: auto;
}
.sheet-hd {
  font-family: var(--font-display); font-size: 12px; font-weight: 800;
  letter-spacing: 2px; text-transform: uppercase; color: var(--acl);
  margin-bottom: 4px;
}
.sheet-sub { color: var(--txd); font-size: 11.5px; line-height: 1.6; margin-bottom: 14px; }
.sheet-lbl {
  display: block; color: var(--txm); font-size: 9px; font-weight: 700;
  letter-spacing: 1.4px; text-transform: uppercase; margin: 12px 0 5px;
}
.sheet-in {
  width: 100%; background: var(--bg); border: 1px solid var(--bd);
  border-radius: var(--r-btn); padding: 8px 10px; color: var(--tx);
  font-size: 12px; outline: 0;
}
.sheet-in:focus { border-color: var(--ac); }
.sheet-note { color: var(--txm); font-size: 10.5px; line-height: 1.55; margin-top: 6px; }
.sheet-note code { color: var(--txd); background: var(--bg); padding: 1px 4px; border-radius: 3px; }
.sheet-bar { display: flex; gap: 7px; align-items: center; margin-top: 16px; }
.sheet-err { color: var(--red); font-size: 11px; margin-top: 8px; }
.sheet-ok  { color: var(--grn); font-size: 11px; margin-top: 8px; }

/* A run cannot start until the engine is found, and saying so where the
   button is beats a Convene click that silently does nothing. */
.offline-note {
  background: var(--s1); border: 1px solid var(--bd); border-left: 3px solid var(--amber);
  border-radius: 2px; padding: 11px 13px; margin-bottom: 16px;
  color: var(--txd); font-size: 11.5px; line-height: 1.6;
}
.offline-note b { color: var(--amber); font-weight: 600; }
.offline-note button {
  background: transparent; border: 1px solid var(--bd); border-radius: var(--r-btn);
  color: var(--txd); font: inherit; font-size: 10.5px; padding: 4px 9px; margin-top: 8px;
}
.offline-note button:hover { border-color: var(--ac); color: var(--ac); }
</style>
</head>
<body>

<div class="shell" id="shell">
  <aside class="sidebar">
    <div class="side-top">
      <button type="button" class="side-toggle" id="navToggle" title="Collapse sidebar" aria-expanded="true">☰</button>
      <div class="side-brand">
        <div class="wordmark">MAGI</div>
        <div class="tagline">Deliberation system</div>
      </div>
    </div>

    <nav class="side-nav" id="sideNav">
      <button type="button" class="side-item" id="navNew" title="New deliberation">
        <span class="side-ic">✦</span><span class="side-label">New deliberation</span>
      </button>
      <button type="button" class="side-item active" id="navCouncil" title="Council">
        <span class="side-ic">◈</span><span class="side-label">Council</span>
      </button>

      <div class="side-sec">
        <div class="side-sec-hd">System</div>
        <button type="button" class="side-item" id="navHistory" title="History">
          <span class="side-ic">☰</span><span class="side-label">History</span>
          <span class="side-tag" id="navHistoryTag" hidden></span>
        </button>
        <button type="button" class="side-item" id="navDoctor" title="Doctor">
          <span class="side-ic" id="navDoctorIc">✚</span><span class="side-label" id="navDoctorLbl">Doctor</span>
          <span class="side-tag" id="navDoctorTag" hidden>✕</span>
        </button>
        <button type="button" class="side-item active" id="navAudio" title="Audio on">

<script>
"use strict";
/* ══════════════════════════════════════════════════════════════════════════
   MAGI console.

   Vanilla port of Veda's React/Vite frontend. The behaviour it describes is
   hers; what changed is the shape (one file, no build) and how the page finds
   the backend (see `link` below). Comments explaining WHY something is the way
   it is are carried over — they document decisions that cost a debugging round
   to reach, and re-deriving them later would cost it again.
   ══════════════════════════════════════════════════════════════════════════ */

const $ = (id) => document.getElementById(id);
const el = (tag, cls, txt) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt != null) n.textContent = txt;
  return n;
};
const show = (n, on) => { n.hidden = !on; };

/* ══ link ══════════════════════════════════════════════════════════════════
   Where the engine is, and how this page reaches it.

   MAGI's council cannot leave Tony's PC: it drives real Chrome profiles
   holding live logins. So this page is static and the engine is local, which
   gives three deployments:

     same-origin   opened at http://127.0.0.1:8000 — the backend is serving
                   this very file, so the API is "" and no token is needed.
     hosted, home  opened from GitHub Pages while sitting at the PC. Chrome
                   allows an https page to call http://127.0.0.1 (a
                   "potentially trustworthy" origin), provided the server
                   answers the Private Network Access preflight — the backend
                   does. Fastest path, no tunnel involved.
     hosted, away  the PC is reachable only through a Cloudflare quick tunnel,
                   whose url changes on every cloudflared restart. `magi cloud`
                   PUBLISHES that url to the magi-link worker on account 2, and
                   this asks for it.

   The React build handled only the third and did it at BUILD time — the url
   was inlined by Vite, so every PC restart meant rewrite .env.production,
   rebuild, redeploy. Discovering it at load time is what removes that cycle,
   and is the reason this file never needs rebuilding. */
const LINK_API = "https://magi-link.av1-2.workers.dev/link";
const LOCAL_API = "http://127.0.0.1:8000";
const TOKEN_KEY = "magi.token";

const link = {
  api: null,        // origin to call, "" meaning same-origin
  token: "",
  where: "seeking", // seeking | local | remote | down
  detail: "",
};

/** True when this page is being served by the backend itself. */
const sameOrigin = /^(127\.0\.0\.1|localhost)$/.test(location.hostname) && location.protocol !== "file:";

function loadToken() {
  try { return localStorage.getItem(TOKEN_KEY) || ""; } catch { return ""; }
}
function saveToken(t) {
  try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch {}
  link.token = t;
}

/** fetch() options carrying the token header. Merges with any existing init. */
function authed(init = {}) {
  if (!link.token) return init;
  return { ...init, headers: { ...(init.headers || {}), "X-MAGI-Token": link.token } };
}

/** EventSource url with the token as a query param.
 *
 *  SSE cannot send custom headers — the EventSource constructor takes no
 *  header option — so the stream endpoints accept ?token= instead. Same
 *  secret, only the transport differs. */
function streamUrl(path) {
  if (!link.token) return `${link.api}${path}`;
  return `${link.api}${path}${path.includes("?") ? "&" : "?"}token=${encodeURIComponent(link.token)}`;
}

/** Does a backend answer here, with this token? 401 is a definite NO — the
 *  host is right but the token is wrong, which is a different problem from
 *  "nothing is listening" and must not be reported as offline. */
async function probe(base, ms = 2500) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms);
  try {
    const r = await fetch(`${base}/api/health`, authed({ signal: ctl.signal }));
    if (r.status === 401) return "unauthorized";
    return r.ok ? "ok" : "no";
  } catch {
    return "no";
  } finally {
    clearTimeout(t);
  }
}

/** Ask magi-link where the PC published itself. */
async function askLink() {
  try {
    const r = await fetch(LINK_API, authed());
    if (!r.ok) return null;
    const d = await r.json();
    return d && d.url ? d : null;
  } catch {
    return null;
  }
}

function setLink(where, detail) {
  link.where = where;
  link.detail = detail;
  const b = $("linkBtn");
  b.className = `link ${where}`;
  $("linkTxt").textContent = detail;
  b.title = {
    local: "Engine on this PC — click to change the token",
    remote: "Engine reached over the tunnel — click to change the token",
    seeking: "Looking for the engine…",
    down: "Engine not reachable — click for help",
  }[where];
  updateEnabled();
  renderOfflineNote();
}

/** Find the engine. Ordered fastest-first, and each step is skipped when it
 *  cannot apply, so the common cases resolve in one request. */
async function connect() {
  setLink("seeking", "locating engine…");

  if (sameOrigin) {
    // The backend is serving this file. No CORS, no token, nothing to find.
    link.api = "";
    const s = await probe("", 6000);
    if (s === "ok") return setLink("local", "this PC · same origin");
    return setLink("down", "backend not responding");
  }

  link.token = loadToken();
  if (!link.token) return setLink("down", "no API token set");

  // At the desk: straight to the PC, no tunnel hop.
  link.api = LOCAL_API;
  const local = await probe(LOCAL_API);
  if (local === "ok") return setLink("local", "this PC · 127.0.0.1");
  if (local === "unauthorized") { link.api = null; return setLink("down", "token rejected"); }

  // Away: wherever `magi cloud` last published.
  const pub = await askLink();
  if (!pub) { link.api = null; return setLink("down", "PC has not published"); }
  link.api = pub.url;
  const remote = await probe(pub.url, 8000);
  if (remote === "ok") {
    const mins = Math.round((pub.age_s || 0) / 60);
    return setLink("remote", `tunnel · ${mins < 60 ? mins + "m" : Math.round(mins / 60) + "h"} ago`);
  }
  link.api = null;
  setLink("down", remote === "unauthorized" ? "token rejected" : "tunnel is dead");
}

const online = () => link.api !== null && (link.where === "local" || link.where === "remote");

/* ══ setup sheet ═══════════════════════════════════════════════════════════ */
function openSetup() {
  const sheet = el("div", "sheet");
  const box = el("div", "sheet-box");
  box.append(
    el("div", "sheet-hd", "Connect to the engine"),
    el("div", "sheet-sub",
      "MAGI's council runs on Tony's PC — it drives real logged-in Chrome " +
      "profiles, which cannot leave the machine. This page needs the shared " +
      "secret that PC gates its API on."),
  );

  const lbl = el("label", "sheet-lbl", "API token");
  const input = el("input", "sheet-in");
  input.type = "password";
  input.value = link.token;
  input.placeholder = "MAGI_API_TOKEN";
  input.autocomplete = "off";
  box.append(lbl, input);
  const note = el("div", "sheet-note");
  note.innerHTML =
    'Set the same value on the PC with <code>setx MAGI_API_TOKEN "…"</code>, then run ' +
    '<code>magi cloud</code>. Stored in this browser only — never in the repo, which is public.';
  box.append(note);

  const msg = el("div");
  const bar = el("div", "sheet-bar");
  const save = el("button", "btn active", "Save & connect");
  const retry = el("button", "btn", "Retry");
  const close = el("button", "btn", "Close");
  bar.append(save, retry, el("span", "qbar-spacer"), close);
  box.append(bar, msg);

  const done = () => sheet.remove();
  close.onclick = done;
  sheet.onclick = (e) => { if (e.target === sheet) done(); };
  const go = async () => {
    msg.className = "sheet-note";
    msg.textContent = "Looking…";
    await connect();
    if (online()) { msg.className = "sheet-ok"; msg.textContent = `Connected — ${link.detail}.`; setTimeout(done, 700); boot(); }
    else { msg.className = "sheet-err"; msg.textContent = `Not reachable — ${link.detail}.`; }
  };
  save.onclick = () => { saveToken(input.value.trim()); go(); };
  retry.onclick = go;
  input.onkeydown = (e) => { if (e.key === "Enter") save.click(); };

  sheet.append(box);
  document.body.append(sheet);
  input.focus();
}

function renderOfflineNote() {
  const n = $("offlineNote");
  if (online() || link.where === "seeking") return show(n, false);
  n.innerHTML = "";
  const why = {
    "no API token set": "This page has no API token yet.",
    "token rejected": "The PC is there, but it did not accept this token.",
    "PC has not published": "The PC has not published a tunnel. It is probably asleep, off, or was started with <code>magi</code> rather than <code>magi cloud</code>.",
    "tunnel is dead": "The published tunnel no longer answers — cloudflared has stopped since it was published.",
    "backend not responding": "The backend is not answering on this machine.",
  }[link.detail] || "The engine is not reachable.";
  const p = el("div");
  p.innerHTML = `<b>Engine offline.</b> ${why} The council cannot run without it — the four Chrome profiles live on that PC.`;
  const b = el("button", null, sameOrigin ? "Retry" : "Set token / retry");
  b.onclick = sameOrigin ? () => connect().then(boot) : openSetup;
  n.append(p, b);
  show(n, true);
}

/* ══ sound ═════════════════════════════════════════════════════════════════
   The deliberation beeps, synthesised with Web Audio rather than shipped as
   files: three short square-wave blips is a handful of oscillators, and
   generating them keeps this a single file with no binary assets.

   The reference is the MAGI deliberation sequence in Evangelion — a dry, high,
   clipped tone at a steady machine tempo while the units think, not a musical
   motif. So: square wave, very short envelope, narrow band around 1.6–2.5kHz,
   a fixed interval that does not drift, and a small lowpass to take the worst
   of the square-wave fizz off so it reads as console hardware rather than a
   piezo buzzer.

   Nothing here creates an AudioContext on load — browsers block audio until a
   user gesture, so it is built lazily on the first beep, which always follows
   the click that starts a run. */
let actx = null, master = null;
function audio() {
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    actx = new AC();
    master = actx.createGain();
    master.gain.value = 0.5;
    master.connect(actx.destination);
  }
  // Autoplay policy can leave a context suspended even after a gesture.
  if (actx.state === "suspended") actx.resume();
  return actx;
}

/** One clipped tone. The envelope is deliberately abrupt at both ends. */
function blip({ freq, at = 0, dur = 0.055, gain = 0.12, type = "square" }) {
  const ac = audio();
  if (!ac) return;
  const t = ac.currentTime + at;
  const osc = ac.createOscillator();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  // Rolls off the square wave's upper harmonics — without this it reads as a
  // cheap buzzer rather than a console tone.
  const lp = ac.createBiquadFilter();
  lp.type = "lowpass";
  lp.frequency.setValueAtTime(Math.min(freq * 3.2, 9000), t);
  const g = ac.createGain();
  // 4ms attack, hold, then a fast decay to silence: short enough to stay
  // percussive, long enough not to click.
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t + 0.004);
  g.gain.setValueAtTime(gain, t + dur * 0.55);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(lp).connect(g).connect(master);
  osc.start(t);
  osc.stop(t + dur + 0.02);
}
/** The repeating processing tone: a three-blip cluster, once per cycle. */
const beepProcessing = () => {
  blip({ freq: 2093, at: 0,     dur: 0.05, gain: 0.10 });
  blip({ freq: 1568, at: 0.075, dur: 0.05, gain: 0.085 });
  blip({ freq: 2349, at: 0.15,  dur: 0.06, gain: 0.10 });
};
/** A single unit reporting in — one short acknowledgement tick. */
const beepUnit = () => blip({ freq: 1760, dur: 0.045, gain: 0.09 });
/** Consensus reached: a rising three-note resolution. */
const beepResolved = () => {
  blip({ freq: 1046, at: 0,    dur: 0.07, gain: 0.11 });
  blip({ freq: 1568, at: 0.09, dur: 0.07, gain: 0.11 });
  blip({ freq: 2093, at: 0.18, dur: 0.16, gain: 0.13 });
};
/** No quorum / failure: a low, flat double tone. */
const beepBlocked = () => {
  blip({ freq: 320, at: 0,    dur: 0.13, gain: 0.13, type: "sawtooth" });
  blip({ freq: 240, at: 0.16, dur: 0.22, gain: 0.13, type: "sawtooth" });
};
function applyMute() {
  if (master && actx) master.gain.setTargetAtTime(S.muted ? 0 : 0.5, actx.currentTime, 0.01);
  try { localStorage.setItem("magi.muted", S.muted ? "1" : "0"); } catch {}
}

/* ══ vocabulary ════════════════════════════════════════════════════════════ */
const WORKING = new Set(["queued", "launching", "navigating", "typing", "waiting", "streaming"]);

/** The MAGI units are named systems, not brands — each member gets one. */
const UNIT = { chatgpt: "MELCHIOR·01", claude: "BALTHASAR·02", gemini: "CASPER·03", deepseek: "ADAM·04" };

/** Terse console wording for each machine state. */
const STATE_LABEL = {
  queued: "standby", launching: "booting", navigating: "linking",
  typing: "querying", waiting: "thinking", streaming: "reporting",
  done: "resolved",
  // The unit responded, but what came back was not an answer. Deliberately
  // NOT "resolved" (it did not resolve) and not "offline" (it was reachable
  // and did reply) — conflating it with either is what produced a silent
  // "4/4 resolved" on a run where one unit returned a clarifying question.
  degraded: "unusable",
  failed: "offline", skipped: "skipped", idle: "standby",
};

/** Phase offset per unit, so the working blocks pulse out of step with each
 *  other instead of blinking in unison. Fixed per unit rather than derived
 *  from position, so a unit keeps its own rhythm when others drop out. */
const PHASE = { chatgpt: "0s", claude: "-0.48s", gemini: "-0.95s", deepseek: "-1.42s" };

function badgeClass(s, ok) {
  if (s === "done") return ok === false ? "failed" : "done";
  if (s === "degraded") return "degraded";
  if (s === "failed") return "failed";
  if (WORKING.has(s)) return "working";
  return "idle";
}

/** Rough progress for the collapsed strip. There is no real total to divide
 *  by — the model never says how long its answer will be — so this is a
 *  saturating curve on characters received: informative about movement, and
 *  deliberately never claiming to reach 100% until the unit actually
 *  resolves. */
function progressPct(p) {
  if (p.state === "done" || p.state === "failed") return 100;
  if (!p.chars) return WORKING.has(p.state) ? 4 : 0;
  return Math.min(92, 4 + (1 - Math.exp(-p.chars / 900)) * 88);
}

const fmtBytes = (n) =>
  n < 1024 ? `${n}B` : n < 1048576 ? `${(n / 1024).toFixed(0)}KB` : `${(n / 1048576).toFixed(1)}MB`;

/* ══ verdict rendering ═════════════════════════════════════════════════════
   The chairman writes ANSWER / NOTES / CONFIDENCE with light markdown inside.
   It is parsed into a small block tree rather than rendered inline, because
   the answer body and the caveats end up in DIFFERENT columns — which a flat
   node list cannot express. */
