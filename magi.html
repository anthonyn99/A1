const SECTION = /^\s*(?:#{1,4}\s*)?(ANSWER|NOTES|CONFIDENCE|VERDICT|AGREEMENTS|DISAGREEMENTS|CAVEATS)\b\s*:?\s*$/i;
const HEADING = /^\s*#{1,6}\s+(.+?)\s*$/;
const BOLD_ONLY = /^\s*\*\*(.+?)\*\*\s*:?\s*$/;
const BULLET = /^(\s*)[-*•]\s+(.*)$/;
const NUMBERED = /^(\s*)(\d+)[.)]\s+(.*)$/;
/* The rating is split off into a tag only when a separator or a sentence break
 * follows it — "HIGH — the members agreed" or "HIGH. Everyone agreed". The
 * chairman often writes the rating as the SUBJECT of the sentence instead
 * ("HIGH on the architecture and the build order, ..."), and splitting there
 * strands a fragment that starts mid-clause in lowercase. In that case the
 * whole line stays together and the tag is derived without consuming it. */
const CONF = /^\s*(HIGH|MEDIUM|LOW)\b\s*(?:[-—:.]+\s*|,\s+)(.+)$/i;
/** Any line that merely OPENS with a rating, used when CONF does not split. */
const CONF_LEAD = /^\s*(HIGH|MEDIUM|LOW)\b/i;
const TABLE_ROW = /^\s*\|(.+)\|\s*$/;
const TABLE_SEP = /^\s*\|?[\s:|-]*-[\s:|-]*\|?\s*$/;

/** Splits a `| a | b |` line into trimmed cells. */
const cells = (line) => (line.match(TABLE_ROW)?.[1] ?? line).split("|").map((c) => c.trim());

/** Inline markdown: **bold**, *italic*, `code`. Appends into `host`. */
function inline(host, text) {
  const re = /\*\*(.+?)\*\*|(?<!\*)\*(?!\s)([^*]+?)\*|`([^`]+?)`/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) host.append(text.slice(last, m.index));
    if (m[1] !== undefined) host.append(el("strong", null, m[1]));
    else if (m[2] !== undefined) host.append(el("em", null, m[2]));
    else host.append(el("code", null, m[3]));
    last = m.index + m[0].length;
  }
  if (last < text.length) host.append(text.slice(last));
  return host;
}

/** A bare `**Foo**` line is a sub-heading only if it is the whole line and
 *  reads like a label — an emphasised one-sentence paragraph must not get
 *  promoted. Sentence-ending punctuation is the tell. */
function isBoldHeading(line) {
  const m = line.match(BOLD_ONLY);
  if (!m) return false;
  const t = m[1].trim();
  return t.length > 0 && t.length <= 60 && !/[.!,;]$/.test(t);
}

function parseVerdict(text) {
  const g = { main: [], notes: [], conf: [] };
  const lines = text.replace(/\r/g, "").split("\n");
  let section = "", para = [], stack = [], table = null;

  /** Where the current section's blocks go. An unknown or absent section goes
   *  to the answer column, so plain prose still renders instead of vanishing. */
  const bucket = () =>
    section === "NOTES" || section === "CAVEATS" ? g.notes
    : section === "CONFIDENCE" ? g.conf : g.main;

  const flushPara = () => {
    if (!para.length) return;
    const body = para.join(" ").trim();
    para = [];
    if (!body) return;
    // A HIGH/MEDIUM/LOW opener is a confidence rating wherever it appears —
    // some chairmen drop the heading and just write the line.
    const lead = body.match(CONF_LEAD);
    if (lead) {
      const c = body.match(CONF);
      // Split only on a real separator; otherwise keep the sentence whole so
      // it still reads as English beside the tag.
      g.conf.push({ kind: "conf", level: lead[1].toUpperCase(), why: c ? c[2].trim() : body });
      return;
    }
    bucket().push({ kind: "p", text: body });
  };
  const flushList = () => {
    if (!stack.length) return;
    const root = stack[0].list;
    stack = [];
    bucket().push({ kind: "list", list: root });
  };
  const flushTable = () => {
    if (!table) return;
    const t = table;
    table = null;
    if (t.rows.length || t.head) bucket().push({ kind: "table", head: t.head, rows: t.rows });
  };
  const flushAll = () => { flushPara(); flushList(); flushTable(); };

  for (const raw of lines) {
    const line = raw.replace(/\s+$/, "");
    const trimmed = line.trim();

    // Fenced code is not supported; swallow the fence rather than rendering a
    // literal ``` line.
    if (/^```/.test(trimmed)) { flushAll(); continue; }

    const sec = line.match(SECTION);
    if (sec) {
      flushAll();
      const s = sec[1].toUpperCase();
      section = s === "VERDICT" ? "ANSWER" : s;
      // Verdicts archived under the older prompt open with AGREEMENTS and
      // DISAGREEMENTS before reaching the answer. Those are genuine sections
      // of that format, so label them rather than letting the deliberation
      // notes masquerade as the answer's opening paragraph.
      if (s === "AGREEMENTS" || s === "DISAGREEMENTS")
        g.main.push({ kind: "h", text: s === "AGREEMENTS" ? "Agreements" : "Disagreements" });
      else if (s === "VERDICT") g.main.push({ kind: "h", text: "Verdict" });
      continue;
    }

    // A blank line closes paragraphs and tables but NOT lists: a blank line
    // between bullets is common and must not split one list in two.
    if (!trimmed) { flushPara(); flushTable(); continue; }

    if (TABLE_ROW.test(line)) {
      flushPara(); flushList();
      const c = cells(line);
      if (!table) table = { head: null, rows: [] };
      if (TABLE_SEP.test(line) && table.rows.length === 1 && !table.head) {
        table.head = table.rows.shift(); // the previous row was the header
      } else if (!TABLE_SEP.test(line)) {
        table.rows.push(c);
      }
      continue;
    }
    flushTable();

    const b = line.match(BULLET), num = line.match(NUMBERED);
    if (b || num) {
      flushPara();
      const indent = (b ? b[1] : num[1]).replace(/\t/g, "  ").length;
      const ordered = !!num;
      const body = (b ? b[2] : num[3]).trim();
      if (!stack.length) {
        stack = [{ indent, list: { ordered, items: [] } }];
      } else {
        // Close any levels indented deeper than this line.
        while (stack.length > 1 && indent < stack[stack.length - 1].indent) stack.pop();
        const top = stack[stack.length - 1];
        if (indent > top.indent + 1 && stack.length < 2) {
          // Deeper than the open level — nest under the last item. Depth is
          // capped at 2: a verdict needing three is a badly written verdict,
          // and flattening is the right failure mode.
          const parent = top.list.items[top.list.items.length - 1];
          if (parent) {
            const child = { ordered, items: [] };
            parent.children = child;
            stack.push({ indent, list: child });
          }
        } else if (stack.length === 1 && top.list.ordered !== ordered) {
          // Marker style changed at the top level — a genuinely new list.
          flushList();
          stack = [{ indent, list: { ordered, items: [] } }];
        }
      }
      stack[stack.length - 1].list.items.push({ text: body, children: null });
      continue;
    }
    flushList();

    const h = line.match(HEADING);
    if (h) { flushPara(); bucket().push({ kind: "h", text: h[1] }); continue; }
    if (isBoldHeading(line)) {
      flushPara();
      bucket().push({ kind: "h", text: line.match(BOLD_ONLY)[1].trim() });
      continue;
    }
    para.push(trimmed);
  }
  flushAll();

  // A sidebar card reading only "None." is noise.
  if (g.notes.length === 1 && g.notes[0].kind === "p" && /^none[.!]?$/i.test(g.notes[0].text))
    g.notes = [];
  return g;
}

function renderList(list) {
  const n = el(list.ordered ? "ol" : "ul", "v-list");
  for (const it of list.items) {
    const li = el("li");
    inline(li, it.text);
    if (it.children) li.append(renderList(it.children));
    n.append(li);
  }
  return n;
}

function renderBlocks(host, blocks, lead = false) {
  blocks.forEach((b, i) => {
    if (b.kind === "h") { host.append(inline(el("div", "v-h"), b.text)); return; }
    if (b.kind === "list") { host.append(renderList(b.list)); return; }
    if (b.kind === "conf") {
      const p = el("p", "v-conf");
      p.append(el("span", `conf-tag ${b.level.toLowerCase()}`, b.level));
      if (b.why) {
        const why = el("span", "conf-why");
        // When the justification is the whole sentence it still opens with the
        // rating word, which the tag beside it already shows. Dim that echo so
        // it reads as "HIGH · [HIGH] on the architecture…" rather than as a
        // stutter, without rewriting the chairman's sentence.
        const echo = b.why.match(new RegExp(`^(${b.level})\\b`, "i"));
        if (echo) why.append(el("span", "conf-echo", echo[1]));
        inline(why, echo ? b.why.slice(echo[1].length) : b.why);
        p.append(why);
      }
      host.append(p);
      return;
    }
    if (b.kind === "table") {
      const wrap = el("div", "v-tablewrap"), t = el("table", "v-table");
      if (b.head) {
        const tr = el("tr");
        b.head.forEach((c) => tr.append(inline(el("th"), c)));
        const thead = el("thead");
        thead.append(tr);
        t.append(thead);
      }
      const tb = el("tbody");
      b.rows.forEach((r) => {
        const tr = el("tr");
        r.forEach((c) => tr.append(inline(el("td"), c)));
        tb.append(tr);
      });
      t.append(tb);
      wrap.append(t);
      host.append(wrap);
      return;
    }
    // Lead styling marks the answer's opening line. It only applies when the
    // verdict actually opens with a paragraph — a legacy verdict starting with
    // an "Agreements" heading must not have its deliberation notes dressed up
    // as the answer.
    host.append(inline(el("p", lead && i === 0 ? "v-lead" : null), b.text));
  });
  return host;
}

/** The verdict body: answer on the left, notes and confidence in a sidebar on
 *  wide screens. The sidebar is omitted entirely when there is nothing to put
 *  in it, so a plain-prose verdict just reads as one column. */
function verdictBody(text) {
  const g = parseVerdict(text);
  const hasAside = g.notes.length > 0 || g.conf.length > 0;
  const root = el("div", `verdict-body ${hasAside ? "split" : ""}`);
  root.append(renderBlocks(el("div", "v-main"), g.main, true));
  if (hasAside) {
    const aside = el("aside", "v-aside");
    if (g.notes.length) {
      const c = el("div", "v-card");
      c.append(el("div", "sec", "Notes"));
      renderBlocks(c, g.notes);
      aside.append(c);
    }
    if (g.conf.length) {
      const c = el("div", "v-card");
      c.append(el("div", "sec", "Confidence"));
      renderBlocks(c, g.conf);
      aside.append(c);
    }
    root.append(aside);
  }
  return root;
}

/* ══ state ═════════════════════════════════════════════════════════════════
   One object rather than scattered variables, so "what is the console showing
   right now" is answerable by reading one place. `panels` is ordered, because
   the grid's left/right split is positional. */
const S = {
  providers: [],
  selected: new Set(),
  panels: [],            // [{id, display_name, accent, state, text, chars, ...}]
  opened: new Set(),     // which unit blocks are expanded
  verdict: null,
  running: false,
  runId: null,
  history: [],
  view: "council",       // council | history | doctor
  doctorBusy: false,
  doctorAbort: null,
  attachments: [],       // {id, file}
  preRefine: null,
  refining: false,
  muted: (() => { try { return localStorage.getItem("magi.muted") === "1"; } catch { return false; } })(),
  navCollapsed: (() => { try { return localStorage.getItem("magi.nav.collapsed") === "1"; } catch { return false; } })(),
  es: null,
  procTimer: null,
  settled: new Set(),
};

const MAX_ATTACHMENTS = 8;
const MAX_ATTACHMENT_BYTES = 20 * 1024 * 1024;
const byId = (id) => S.panels.find((p) => p.id === id);

/* ══ member blocks ═════════════════════════════════════════════════════════
   Built once per run and then MUTATED as events arrive, rather than rebuilt.
   Rebuilding on every SSE frame would drop the caret, collapse open blocks and
   destroy any text the reader had selected mid-stream — the answers arrive a
   few characters at a time, so that is many times a second. */

function buildNode(p) {
  const node = el("div", "node collapsed");
  node.style.setProperty("--pa", p.accent);
  node.style.setProperty("--pd", PHASE[p.id] || "0s");

  const hd = el("button", "node-hd");
  hd.type = "button";
  // Model name leads, codename beneath it. Which model produced an answer is
  // the load-bearing fact when reading one; the codename is the console's
  // flavour and was carrying the visual weight instead.
  const names = el("div");
  names.append(el("div", "node-id", p.display_name), el("div", "node-sub", UNIT[p.id] || ""));
  const right = el("span");
  right.style.cssText = "display:flex;gap:7px;align-items:center";
  const meta = el("span", "node-meta");
  const badge = el("span", "badge");
  right.append(meta, badge, el("span", "node-caret", "▶"));
  hd.append(names, right);
  hd.onclick = () => toggleUnit(p.id);

  const peek = el("div", "node-peek");
  const bar = el("span", "bar");
  const fill = el("i");
  bar.append(fill);
  const hint = el("span", "hint");
  peek.append(bar, hint);

  const body = el("div", "node-body");
  node.append(hd, peek, body);
  p.dom = { node, hd, meta, badge, peek, fill, hint, body };
  return node;
}

function updateNode(p) {
  const d = p.dom;
  if (!d) return;
  const isOpen = S.opened.has(p.id);
  const working = WORKING.has(p.state);
  d.node.className = `node ${isOpen ? "open" : "collapsed"} ${working ? "working" : ""} ${p.ok === false ? "failed" : ""}`;
  d.hd.setAttribute("aria-expanded", String(isOpen));
  d.hd.title = isOpen ? "Collapse this unit" : "Show this unit's response";

  d.meta.textContent = p.latency_ms ? `${(p.latency_ms / 1000).toFixed(1)}s` : p.chars ? `${p.chars}c` : "";
  d.badge.className = `badge ${badgeClass(p.state, p.ok)}`;
  d.badge.textContent = STATE_LABEL[p.state] || p.state;

  show(d.peek, !isOpen);
  if (!isOpen) {
    d.fill.style.width = `${progressPct(p)}%`;
    const hasContent = p.ok === false || !!p.text;
    d.hint.textContent =
      p.degraded ? "unusable · open"
      : p.ok === false ? (p.failure || "offline")
      : hasContent ? `${p.chars}c · open`
      : working ? "receiving…" : "—";
  }

  show(d.body, isOpen);
  if (!isOpen) return;
  d.body.className = "node-body";
  d.body.textContent = "";

  if (p.degraded) {
    // Shown rather than hidden on purpose. What came back is usually a
    // clarifying question, which tells the user their prompt was ambiguous —
    // that is useful information, not noise to be swallowed.
    d.body.className = "callout degraded";
    d.body.append(
      el("div", "kind", "unusable response"),
      el("div", "cause", p.degraded_reason || ""),
      el("div", "remedy", "Excluded from the verdict. The other units are unaffected."),
    );
    if (p.text) d.body.append(el("div", "detail", p.text));
    return;
  }
  if (p.ok === false) {
    d.body.className = "callout";
    d.body.append(el("div", "kind", p.failure || "failed"), el("div", "cause", p.failure_cause || ""));
    if (p.failure_remedy) d.body.append(el("div", "remedy", p.failure_remedy));
    if (p.error_detail) d.body.append(el("div", "detail", p.error_detail));
    return;
  }
  if (!p.text) {
    d.body.className = "node-body idle";
    d.body.textContent = working ? "awaiting response" : "—";
    return;
  }
  d.body.textContent = p.text;
  if (working) d.body.append(el("span", "caret"));
  if (p.low_confidence) {
    const w = el("div", null, "⚠ end of response inferred, not confirmed — may be truncated");
    w.style.cssText = "color:var(--amber);font-size:10px;margin-top:10px;letter-spacing:.4px";
    d.body.append(w);
  }
}

function toggleUnit(id) {
  S.opened.has(id) ? S.opened.delete(id) : S.opened.add(id);
  updateNode(byId(id));
  // The block just changed height, so the wiring has to be re-measured.
  drawLinks();
}

/** Rebuilds the whole grid. Called when the SET of units changes, not when
 *  their contents do. */
function renderGrid() {
  const grid = $("magiGrid");
  grid.textContent = "";
  show($("magi"), S.panels.length > 0);
  show($("emptyState"), S.panels.length === 0 && S.view === "council" && !S.verdict);
  if (!S.panels.length) return;

  for (const p of S.panels) grid.append(buildNode(p));

  // The core owns its own grid column, so it renders once and stays
  // vertically centred against the units beside it.
  const cell = el("div", "magi-core-cell");
  const core = el("div", "core");
  core.id = "core";
  core.append(
    el("div", "core-label", "Central dogma"),
    el("div", "core-status"),
    el("div", "core-count"),
    el("div", "core-label chair"),
  );
  cell.append(core);
  grid.append(cell);

  for (const p of S.panels) updateNode(p);
  updateCore();
  drawLinks();
}

function updateCore() {
  const core = $("core");
  if (!core) return;
  const done = S.panels.filter((p) => p.ok === true).length;
  // Degraded units are ok === false, so they must be excluded here or they
  // would be reported as "offline" — a different claim about what happened,
  // and one the user would have no way to correct from the display.
  const degraded = S.panels.filter((p) => p.degraded).length;
  const failed = S.panels.filter((p) => p.ok === false && !p.degraded).length;
  const v = S.verdict;

  core.className = `core ${S.running ? "deliberating" : v ? (v.synthesis_ok ? "resolved" : "blocked") : ""}`;
  core.children[1].textContent = S.running ? "DELIBERATING" : v ? (v.synthesis_ok ? "CONSENSUS" : "NO QUORUM") : "STANDBY";
  core.children[2].textContent =
    `${done}/${S.panels.length} resolved` +
    (degraded ? ` · ${degraded} unusable` : "") +
    (failed ? ` · ${failed} offline` : "");
  const chair = core.children[3];
  chair.textContent = v && v.chairman ? `chair · ${v.chairman}` : "";
  show(chair, !!(v && v.chairman));
}

/** Draws the wiring from each member block to the core.
 *
 *  Measured from real element positions rather than computed from the layout,
 *  because the blocks grow as answers stream in and the sidebar can collapse
 *  under them. */
function drawLinks() {
  const host = $("magi"), svg = $("magiLinks"), core = $("core");
  if (!core || host.hidden) return;
  const H = host.getBoundingClientRect(), C = core.getBoundingClientRect();
  if (!C.width) return;
  const cx = C.left - H.left + C.width / 2;
  const cy = C.top - H.top + C.height / 2;

  svg.textContent = "";
  for (const p of S.panels) {
    if (!p.dom) continue;
    const R = p.dom.node.getBoundingClientRect();
    // Anchor on whichever side of the block faces the core.
    const onLeft = R.left - H.left + R.width / 2 < cx;
    const x = R.left - H.left + (onLeft ? R.width : 0);
    const y = R.top - H.top + R.height / 2;
    const mid = (x + cx) / 2;
    const cls = p.ok === false ? "dead" : WORKING.has(p.state) ? "live" : p.state === "done" ? "settled" : "";
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    // Elbow route: out horizontally, then into the core.
    path.setAttribute("d", `M ${x} ${y} H ${mid} V ${cy} H ${cx}`);
    path.setAttribute("class", `magi-link ${cls}`);
    path.style.setProperty("--pa", p.accent);
    svg.append(path);
  }
}

// Blocks grow as answers stream in, so the wiring has to follow them.
new ResizeObserver(() => requestAnimationFrame(drawLinks)).observe(document.documentElement);
window.addEventListener("resize", () => requestAnimationFrame(drawLinks));

/* ══ verdict panel ═════════════════════════════════════════════════════════ */
function renderVerdict() {
  const n = $("verdict");
  const v = S.verdict;
  const studioOpen = !!(S.studio && S.studio.active);
  show(n, !!v && S.view === "council" && !studioOpen);
  if (!v || S.view !== "council" || studioOpen) return;
  n.textContent = "";

  const hd = el("div", "verdict-hd");
  hd.append(el("span", "verdict-title", "Verdict"));
  hd.append(el("span", "verdict-quorum",
    `${v.responded} of ${v.total} units responded` +
    (v.chairman ? ` · synthesised by ${v.chairman}` : "") +
    (v.total_ms ? ` · ${(v.total_ms / 1000).toFixed(0)}s` : "")));
  n.append(hd);

  // Named here, not only in History. A verdict built from three units while
  // the display implied four is the exact failure this is here to prevent, and
  // the Verdict panel is what gets read.
  if (v.degraded && v.degraded.length) {
    const d = el("div", "verdict-degraded");
    d.append(el("strong", null, `Built from ${v.responded} of ${v.total} units.`));
    d.append(` ${v.degraded.map((x) => x.reason).join(" ")} Confidence is capped accordingly.`);
    n.append(d);
  }

  if (v.synthesis_ok) {
    n.append(verdictBody(v.verdict));
  } else {
    const b = el("div", "verdict-body");
    const s = el("span", null, v.synthesis_error || "Synthesis failed.");
    s.style.color = "var(--amber)";
    b.append(s);
    n.append(b);
  }
}

/* ══ composer ══════════════════════════════════════════════════════════════ */

/** Grow the composer to fit its text so a long prompt is readable in full
 *  rather than scrolling inside a fixed box.
 *
 *  Height must be reset to "auto" before reading scrollHeight — scrollHeight
 *  never reports less than the current height, so without the reset the box
 *  could only ever grow, never shrink back after a clear. */
function autosize() {
  const t = $("composer");
  t.style.height = "auto";
  t.style.height = `${t.scrollHeight}px`;
}

function setQuestion(v) {
  $("composer").value = v;
  autosize();
  updateEnabled();
}

/** Stages files for the next question. Rejects rather than silently
 *  truncating, so a user who drops 12 files learns why only some landed. */
function addFiles(incoming) {
  const list = Array.from(incoming);
  if (!list.length) return;
  let err = null;
  for (const file of list) {
    if (S.attachments.length >= MAX_ATTACHMENTS) { err = `Only ${MAX_ATTACHMENTS} attachments per question.`; break; }
    if (file.size > MAX_ATTACHMENT_BYTES) { err = `${file.name} exceeds the 20MB limit.`; continue; }
    S.attachments.push({ id: `${Date.now()}-${Math.random().toString(36).slice(2)}`, file });
  }
  setErr("attachError", err);
  renderChips();
}

function setErr(id, msg) {
  const n = $(id);
  n.textContent = msg || "";
  show(n, !!msg);
}

function renderChips() {
  const box = $("qbarChips");
  box.textContent = "";
  show(box, S.attachments.length > 0);
  for (const a of S.attachments) {
    const c = el("div", "chipfile");
    if (a.file.type.startsWith("image/")) {
      const img = el("img", "chipfile-thumb");
      img.src = URL.createObjectURL(a.file);
      img.alt = "";
      img.onload = () => URL.revokeObjectURL(img.src);
      c.append(img);
    } else {
      c.append(el("span", "chipfile-icon", "▤"));
    }
    const info = el("span", "chipfile-info");
    info.append(el("span", "chipfile-name", a.file.name), el("span", "chipfile-size", fmtBytes(a.file.size)));
    const x = el("button", "chipfile-x", "✕");
    x.type = "button";
    x.setAttribute("aria-label", `Remove ${a.file.name}`);
    x.disabled = S.running;
    x.onclick = () => { S.attachments = S.attachments.filter((v) => v.id !== a.id); renderChips(); };
    c.append(info, x);
    box.append(c);
  }
  autosize();
}

/** Rewrite the composer's text into a sharper prompt via one model.
 *
 *  Deliberately NOT a step inside start(): refining on the way to Convene
 *  would send the council a question the person never read, and a rewrite that
 *  drifted from their intent would be discovered only in the verdict. Here it
 *  lands in the textarea first, where it can be read, edited or undone before
 *  anyone is asked anything. */
async function refine() {
  const q = $("composer").value.trim();
  if (!q || S.refining || S.running || !online()) return;
  S.refining = true;
  setErr("refineError", null);
  updateEnabled();
  try {
    const form = new FormData();
    form.append("question", q);
    const res = await fetch(`${link.api}/api/refine`, authed({ method: "POST", body: form }));
    if (!res.ok) {
      const body = await res.json().catch(() => null);
      throw new Error(body?.detail || `Refine failed (${res.status})`);
    }
    const { refined } = await res.json();
    // Keep the original for Undo, but only the text the person actually wrote
    // — refining twice must not make the first rewrite the thing Undo restores.
    if (S.preRefine === null) S.preRefine = q;
    setQuestion(refined);
    $("composer").focus();
  } catch (e) {
    setErr("refineError", e?.message || "Refine failed.");
  } finally {
    S.refining = false;
    updateEnabled();
  }
}

function undoRefine() {
  if (S.preRefine === null) return;
  setQuestion(S.preRefine);
  S.preRefine = null;
  setErr("refineError", null);
  $("composer").focus();
  updateEnabled();
}

/* ══ enable/disable ════════════════════════════════════════════════════════
   One function owning every disabled state. Split across handlers, the button
   that must not be clickable during a run is exactly the one that gets
   forgotten. */
function updateEnabled() {
  const q = $("composer").value.trim();
  // A brainstorm round is already driving these profiles; starting a council
  // run on top of one would have two Chrome contexts fighting for the same
  // profile lock. Derived rather than tracked separately, so the two can never
  // disagree about whether the machine is busy.
  const busy = S.running || S.refining || (S.bs && S.bs.busy);
  const up = online();
  $("btnSend").disabled = busy || !q || S.selected.size === 0 || !up;
  $("btnSend").textContent = S.running ? "Deliberating…" : "Convene";
  $("btnRefine").disabled = busy || !q || !up;
  $("btnRefine").className = `qbar-refine ${S.refining ? "busy" : ""}`;
  $("btnRefine").querySelector(".qbar-refine-ico").textContent = S.refining ? "◌" : "✦";
  $("btnRefine").querySelector(".qbar-refine-txt").textContent = S.refining ? "Refining…" : "Refine";
  $("btnAttach").disabled = S.running || S.attachments.length >= MAX_ATTACHMENTS;
  $("composer").disabled = busy;
  // Only offered while the rewrite is still untouched — see the composer's
  // input handler.
  show($("btnUndo"), S.preRefine !== null && !S.refining);
  $("btnUndo").disabled = busy;
  $("navNew").disabled = busy;
  show($("navHalt"), S.running);
  for (const b of document.querySelectorAll(".chip")) b.disabled = busy;
  if (typeof syncBsStartBar === "function") syncBsStartBar();
}

/* ══ the run ═══════════════════════════════════════════════════════════════ */
async function start() {
  const q = $("composer").value.trim();
  if (!q || S.running || S.selected.size === 0 || !online()) return;

  S.verdict = null;
  S.running = true;
  // A run in progress is the thing to watch, so any drawer the user was
  // reading gives way to the console.
  setView("council");
  S.settled = new Set();
  S.panels = S.providers.filter((p) => S.selected.has(p.id)).map((p) => ({
    id: p.id, display_name: p.display_name, accent: p.accent,
    state: "queued", text: "", chars: 0,
  }));
  S.opened = new Set();
  renderGrid();
  renderVerdict();
  updateEnabled();
  startProcessingTone();

  const form = new FormData();
  form.append("question", q);
  form.append("providers", [...S.selected].join(","));
  for (const a of S.attachments) form.append("files", a.file, a.file.name);
  S.attachments = [];
  renderChips();

  let runId;
  try {
    const res = await fetch(`${link.api}/api/runs`, authed({ method: "POST", body: form }));
    ({ run_id: runId } = await res.json());
  } catch {
    endRun();
    setErr("refineError", "Could not reach the engine to start the run.");
    return;
  }
  S.runId = runId;

  const es = new EventSource(streamUrl(`/api/runs/${runId}/stream`));
  S.es = es;
  es.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === "state") {
      const p = byId(msg.provider_id);
      if (!p) return;
      p.state = msg.state;
      p.text = msg.text || p.text;
      p.chars = msg.chars || p.chars;
      updateNode(p);
      updateCore();
      drawLinks();
    } else if (msg.type === "done") {
      for (const a of msg.answers) {
        const p = byId(a.provider_id);
        if (!p) continue;
        // A degraded answer is ok === false, so it must be checked before the
        // failed branch or it renders as offline.
        Object.assign(p, {
          state: a.ok ? "done" : a.degraded ? "degraded" : "failed",
          text: a.text, ok: a.ok, failure: a.failure,
          failure_cause: a.failure_cause, failure_remedy: a.failure_remedy,
          error_detail: a.error_detail, degraded: a.degraded,
          degraded_reason: a.degraded_reason, low_confidence: a.low_confidence,
          latency_ms: a.latency_ms, completion_reason: a.completion_reason,
          chars: a.chars,
        });
        updateNode(p);
      }
      S.verdict = msg;
      endRun();
      renderVerdict();
      loadHistory();
      // A verdict is what Studio derives from, so its rows unlock here.
      renderStudioNav();
      // Slightly after the processing loop stops, so the two don't overlap.
      if (!S.muted) setTimeout(msg.synthesis_ok ? beepResolved : beepBlocked, 180);
    } else if (msg.type === "error") {
      endRun();
    }
    ackSettled();
  };
  es.onerror = () => endRun();
}

function endRun() {
  S.running = false;
  if (S.es) { S.es.close(); S.es = null; }
  stopProcessingTone();
  updateCore();
  drawLinks();
  updateEnabled();
}

/** The deliberation beep: a steady cluster every 1.6s for as long as the
 *  council is working. Fires immediately on start rather than after the first
 *  interval, so the sound lands with the animation instead of a beat late. */
function startProcessingTone() {
  stopProcessingTone();
  if (S.muted || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  beepProcessing();
  S.procTimer = setInterval(beepProcessing, 1600);
}
function stopProcessingTone() {
  if (S.procTimer) { clearInterval(S.procTimer); S.procTimer = null; }
}

/** One acknowledgement tick as each unit reports in. Tracked in a set so a
 *  unit only ever beeps on the transition, not on every streaming update that
 *  touches the same finished panel. */
function ackSettled() {
  for (const p of S.panels) {
    if ((p.state === "done" || p.state === "failed") && !S.settled.has(p.id)) {
      S.settled.add(p.id);
      if (!S.muted) beepUnit();
    }
  }
}

async function cancelRun() {
  if (!S.runId || !online()) return;
  await fetch(`${link.api}/api/runs/${S.runId}/cancel`, authed({ method: "POST" })).catch(() => {});
}

/** Clears the composer and the previous run's console so the next question
 *  starts from a blank slate, rather than being asked while the last verdict
 *  is still on screen. */
function newRun() {
  if (S.running) return;
  setQuestion("");
  S.attachments = [];
  S.preRefine = null;
  S.panels = [];
  S.opened = new Set();
  S.verdict = null;
  S.runId = null;
  setErr("attachError", null);
  setErr("refineError", null);
  renderChips();
  // A new run has none of the previous run's artifacts, and leaving them on
  // screen would attribute one verdict's material to another.
  resetStudio();
  setView("council");
}

/* ══ history ═══════════════════════════════════════════════════════════════ */
async function loadHistory() {
  if (!online()) return;
  try {
    const r = await fetch(`${link.api}/api/runs?limit=30`, authed());
    S.history = await r.json();
  } catch { return; }
  const tag = $("navHistoryTag");
  tag.textContent = S.history.length ? String(S.history.length) : "";
  show(tag, S.history.length > 0);
  renderHistory();
}

function renderHistory() {
  const box = $("historyRows");
  box.textContent = "";
  if (!S.history.length) { box.append(el("div", "empty-state", "No runs yet.")); return; }
  for (const r of S.history) {
    const row = el("div", "row");
    row.append(el("span", "q", r.question));
    row.append(el("span", "meta",
      `${r.responded_count}/${r.attempted_count} · ` +
      `${r.total_ms ? (r.total_ms / 1000).toFixed(0) + "s" : "—"} · ` +
      new Date(r.created_at).toLocaleString()));
    row.onclick = () => openRun(r.id);
    box.append(row);
  }
}

async function openRun(id) {
  const r = await fetch(`${link.api}/api/runs/${id}`, authed());
  const data = await r.json();
  S.runId = id;
  setQuestion(data.run.question);
  S.opened = new Set();
  S.panels = data.answers.map((a) => ({
    id: a.provider_id,
    display_name: a.display_name,
    accent: S.providers.find((p) => p.id === a.provider_id)?.accent || "#8D769A",
    state: a.ok ? "done" : a.degraded ? "degraded" : "failed",
    text: a.answer_text || "", chars: a.char_count || 0, ok: !!a.ok,
    failure: a.failure_kind, error_detail: a.error_detail,
    degraded: !!a.degraded, degraded_reason: a.degraded_reason || "",
    low_confidence: !!a.low_confidence, latency_ms: a.latency_ms,
    completion_reason: a.completion_reason,
  }));
  S.verdict = data.synthesis ? {
    verdict: data.synthesis.verdict_text || "",
    synthesis_ok: !!data.synthesis.ok,
    synthesis_error: data.synthesis.error_detail,
    chairman: data.synthesis.chairman_provider,
    responded: data.synthesis.members_responded,
    total: data.synthesis.members_total,
    total_ms: data.run.total_ms || 0,
    // Rebuilt from the stored answers rather than persisted twice, so an
    // archived run explains its exclusions the same way a live one does.
    degraded: data.answers.filter((a) => a.degraded).map((a) => ({
      provider_id: a.provider_id, display_name: a.display_name,
      reason: a.degraded_reason || "", chars: a.char_count || 0,
    })),
  } : null;
  resetStudio();
  setView("council");
  renderGrid();
  renderVerdict();
  loadStudio();
}

/* ══ doctor ════════════════════════════════════════════════════════════════ */
async function runDoctor() {
  // Clicking Doctor while a pass is running means "stop", matching the Halt
  // affordance on a run. Otherwise the button is a no-op precisely when the
  // user most wants it to do something.
  if (S.doctorBusy) return stopDoctor();
  if (S.running || !online()) return;

  const ctl = new AbortController();
  S.doctorAbort = ctl;
  S.doctorBusy = true;
  setView("doctor");
  renderDoctor(null);
  try {
    const r = await fetch(`${link.api}/api/doctor`, authed({ method: "POST", signal: ctl.signal }));
    const data = await r.json();
    // A late response from an aborted pass must not overwrite the screen.
    if (!ctl.signal.aborted) { S.doctorBusy = false; renderDoctor(data); }
  } catch {
    // Abort lands here too; either way there is nothing to show.
  } finally {
    if (S.doctorAbort === ctl) { S.doctorAbort = null; S.doctorBusy = false; syncDoctorNav(); }
  }
}

function stopDoctor() {
  S.doctorAbort?.abort();
  S.doctorAbort = null;
  S.doctorBusy = false;
  setView("council");
}

function syncDoctorNav() {
  $("navDoctorLbl").textContent = S.doctorBusy ? "Stop doctor" : "Doctor";
  $("navDoctorIc").textContent = S.doctorBusy ? "◐" : "✚";
  $("navDoctorIc").className = S.doctorBusy ? "side-ic spin" : "side-ic";
  show($("navDoctorTag"), S.doctorBusy);
  $("navDoctor").setAttribute("aria-busy", String(S.doctorBusy));
}

function renderDoctor(data) {
  syncDoctorNav();
  const body = $("doctorBody");
  body.textContent = "";
  // Rendered while busy too, not just once results land: a pass takes tens of
  // seconds, and an empty page with only a spinner in the sidebar gave no
  // indication anything was happening or how to stop it.
  if (S.doctorBusy) {
    $("doctorHd").textContent = "Selector doctor — checking";
    const r = el("div", "doctor-running");
    r.append(el("span", "spin", "◐"));
    r.append(el("span", null, "Opening each unit's site to see which selectors match. This launches a real browser per unit and takes a while."));
    r.append(el("span", "qbar-spacer"));
    const stop = el("button", "navitem danger");
    stop.type = "button";
    stop.append(el("span", "navitem-ic", "■"), document.createTextNode("Stop"));
    stop.onclick = stopDoctor;
    r.append(stop);
    body.append(r);
    return;
  }
  $("doctorHd").textContent = "Selector doctor — live selector match";
  if (!data) return;

  const t = el("table", "doctor");
  const thead = el("thead"), htr = el("tr");
  for (const h of ["Unit", "Field", "Status", "Matched"]) htr.append(el("th", null, h));
  thead.append(htr);
  const tb = el("tbody");
  for (const d of data) {
    for (const s of d.selectors) {
      // Colour on `status`, not on ok. A field that cannot match while the
      // chat is idle is not a fault, and painting it red made a healthy
      // install look catastrophically broken.
      const st = s.status || (s.ok ? "ok" : "miss");
      const cls = st === "ok" ? (s.stale ? "stale" : "ok") : st === "miss" ? "miss" : "na";
      const label = st === "ok" ? (s.stale ? "FALLBACK" : "OK")
        : st === "miss" ? "MISS" : st === "unset" ? "—" : "n/a";
      const tr = el("tr");
      tr.append(el("td", null, s.field === "input" ? d.display_name : ""));
      tr.append(el("td", null, s.field));
      tr.append(el("td", cls, label));
      const last = el("td");
      last.append(el("code", null, s.matched || (s.note ? s.note : st === "miss" ? `all ${s.tried} failed` : "—")));
      tr.append(last);
      tb.append(tr);
    }
  }
  t.append(thead, tb);
  body.append(t);
}

/* ══ views ═════════════════════════════════════════════════════════════════
   One `view` at a time. History and Doctor were independent booleans that
   could both be open, stacking two panels above the console. */
function setView(v) {
  S.view = v;
  // Leaving the council view closes any open Studio card. Otherwise History
  // would render UNDER a slide deck, which is how two panels ended up stacked
  // in the first place.
  if (v !== "council" && S.studio) S.studio.active = null;
  const studioOpen = !!(S.studio && S.studio.active);
  const bsOpen = v === "brainstorm";

  show($("studioView"), studioOpen);
  show($("historyDrawer"), v === "history");
  show($("doctorDrawer"), v === "doctor");
  // Brainstorm brings its own composer and its own reply box, so the council's
  // question bar is HIDDEN rather than stacked above a second textarea that
  // submits somewhere else.
  show($("qbar"), !bsOpen);
  show($("unitBar"), !bsOpen || !S.bs.sessionId);
  $("navCouncil").classList.toggle("active", v === "council" && !studioOpen);
  $("navHistory").classList.toggle("active", v === "history");
  $("navDoctor").classList.toggle("active", v === "doctor");
  // An open card replaces the grid and the verdict rather than sitting above
  // them: showing both at once is what made this page a scroll.
  show($("magi"), S.panels.length > 0 && !studioOpen && (v === "council" || bsOpen));
  show($("emptyState"),
       S.panels.length === 0 && v === "council" && !S.verdict && !studioOpen);
  renderVerdict();
  if (typeof renderStudioNav === "function") renderStudioNav();
  if (typeof renderBsNav === "function") renderBsNav();
  if (typeof renderBsNav === "function") { renderBsNav(); renderBsView(); }
  if (S.panels.length && !studioOpen) requestAnimationFrame(drawLinks);
}

/* ══ units ═════════════════════════════════════════════════════════════════ */
function renderUnitChips() {
  const box = $("unitChips");
  box.textContent = "";
  for (const p of S.providers) {
    const on = S.selected.has(p.id);
    const b = el("button", `chip ${on ? "on" : ""}`);
    b.type = "button";
    if (on) { b.style.background = p.accent; b.style.borderColor = p.accent; }
    else { b.style.color = p.accent; b.style.borderColor = p.accent + "66"; }
    // Both names, because the codename alone does not say which model you are
    // switching off. The real model name is the thing being chosen; the MAGI
    // codename is flavour, so it reads as the smaller, secondary label.
    b.append(el("span", "chip-model", p.display_name));
    b.append(el("span", "chip-unit", (UNIT[p.id] || "").split("·")[0]));
    b.onclick = () => {
      S.selected.has(p.id) ? S.selected.delete(p.id) : S.selected.add(p.id);
      renderUnitChips();
      updateEnabled();
    };
    box.append(b);
  }
  updateEnabled();
}

/* ══ wiring ════════════════════════════════════════════════════════════════ */
function applyNav() {
  $("shell").classList.toggle("nav-collapsed", S.navCollapsed);
  $("navToggle").setAttribute("aria-expanded", String(!S.navCollapsed));
  $("navToggle").title = S.navCollapsed ? "Expand sidebar" : "Collapse sidebar";
  try { localStorage.setItem("magi.nav.collapsed", S.navCollapsed ? "1" : "0"); } catch {}
  // Collapsed rows carry their label in the tooltip instead, so the Studio
  // rows have to be redrawn with the other title text.
  if (typeof renderStudioNav === "function") renderStudioNav();
  // The council wiring is measured from real element positions, so the sidebar
  // changing width invalidates it. The delay matches the grid's transition.
  setTimeout(drawLinks, 220);
}

function applyAudioNav() {
  $("navAudioIc").textContent = S.muted ? "◊" : "◈";
  $("navAudioLbl").textContent = S.muted ? "Audio muted" : "Audio on";
  $("navAudio").classList.toggle("active", !S.muted);
}

$("navToggle").onclick = () => { S.navCollapsed = !S.navCollapsed; applyNav(); };
$("navNew").onclick = newRun;
$("navCouncil").onclick = () => setView("council");
$("navHistory").onclick = () => setView(S.view === "history" ? "council" : "history");
$("navDoctor").onclick = runDoctor;
$("navAudio").onclick = () => { S.muted = !S.muted; applyMute(); applyAudioNav(); if (!S.muted) beepUnit(); };
$("navHalt").onclick = cancelRun;
$("linkBtn").onclick = () => (sameOrigin ? connect().then(boot) : openSetup());

$("btnSend").onclick = start;
$("btnRefine").onclick = refine;
$("btnUndo").onclick = undoRefine;
$("btnAttach").onclick = () => $("fileIn").click();
$("fileIn").onchange = (e) => { if (e.target.files?.length) addFiles(e.target.files); e.target.value = ""; };

const composer = $("composer");
composer.addEventListener("input", () => {
  // Once they edit the rewrite by hand, "Undo refine" would throw away their
  // edit too, so it stops being offered.
  if (S.preRefine !== null) S.preRefine = null;
  setErr("refineError", null);
  autosize();
  updateEnabled();
});
composer.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); start(); }
});
composer.addEventListener("paste", (e) => {
  const files = Array.from(e.clipboardData?.files || []);
  if (files.length) addFiles(files);
});

const qbar = $("qbar");
qbar.addEventListener("dragover", (e) => { if (S.running) return; e.preventDefault(); qbar.classList.add("drag"); });
qbar.addEventListener("dragleave", () => qbar.classList.remove("drag"));
qbar.addEventListener("drop", (e) => {
  e.preventDefault();
  qbar.classList.remove("drag");
  if (!S.running && e.dataTransfer.files?.length) addFiles(e.dataTransfer.files);
});

/* ══ STUDIO ════════════════════════════════════════════════════════════════
   Turns a finished verdict into another format: a table, a longer report,
   flashcards, a quiz, a mind map, a slide deck, or a two-host audio script.

   Every card is derived from ONE run, so the whole section is disabled until
   that run has a verdict. Generation is a POST that returns a job id plus an
   SSE stream, exactly like a council run — the engine drives a real browser
   for each one, so a card takes about as long as a member's answer does.

   State lives in S.studio rather than in the view, because the sidebar rows
   and the open card must read the same artifacts. Owning it in either one
   would mean the other duplicated the fetch, and the two copies would drift
   the moment a generation finished while the card was closed. */

const CARD_META = {
  table:      { label: "Data Table",      icon: "▦", accent: "var(--ac)" },
  report:     { label: "Report",          icon: "▤", accent: "var(--gold)" },
  flashcards: { label: "Flashcards",      icon: "▥", accent: "var(--grn)" },
  quiz:       { label: "Quiz",            icon: "?", accent: "var(--amber)" },
  mindmap:    { label: "Mind Map",        icon: "⌗", accent: "var(--acl)" },
  slides:     { label: "Slide Deck",      icon: "▭", accent: "#8FB8E8" },
  audio:      { label: "Audio Overview",  icon: "◈", accent: "#BFA6E0" },
};
const KIND_ORDER = ["table", "report", "flashcards", "quiz", "mindmap", "slides", "audio"];

const freshArtifacts = () =>
  Object.fromEntries(KIND_ORDER.map((k) => [k, { status: "idle" }]));

S.studio = { artifacts: freshArtifacts(), active: null, ui: {} };

/** One-line status per card, shared by the sidebar row and the open viewer so
 *  the two can never describe the same artifact differently. */
function statusHint(a) {
  return {
    idle: "Not generated yet",
    pending: "Queued…",
    running: "Generating…",
    complete: `Ready — ${a.provider_id || "generated"}`,
    failed: a.error_detail || "Generation failed",
  }[a.status];
}

/** Studio needs a completed run to derive from — the engine refuses otherwise
 *  (400: "Studio needs a completed run"), so the nav is gated on the same
 *  condition rather than letting the click fail. */
const studioEnabled = () => !!(S.runId && S.verdict && S.verdict.synthesis_ok && online());

function resetStudio() {
  S.studio.artifacts = freshArtifacts();
  S.studio.active = null;
  S.studio.ui = {};
  show($("studioView"), false);
  renderStudioNav();
}

/** Restore already-generated cards for this run. Same "a reload recovers state
 *  from SQLite" principle the council run already has: a card generated an hour
 *  ago is still on disk and should come back without regenerating it. */
async function loadStudio() {
  if (!S.runId || !online()) return;
  try {
    const r = await fetch(`${link.api}/api/runs/${S.runId}/studio`, authed());
    const rows = await r.json();
    for (const row of rows) {
      if (row.kind in S.studio.artifacts) {
        S.studio.artifacts[row.kind] = {
          status: row.status,
          provider_id: row.provider_id,
          raw_text: row.raw_text,
          parsed_json: row.parsed_json,
          error_detail: row.error_detail,
        };
      }
    }
  } catch {}
  renderStudioNav();
  if (S.studio.active) renderStudioView();
}

function generateStudio(kind) {
  if (!studioEnabled()) return;
  const runId = S.runId;
  S.studio.artifacts[kind] = { status: "pending" };
  // A regenerate must drop the previous card's interaction state, or a quiz
  // would keep the answers picked against questions that no longer exist.
  delete S.studio.ui[kind];
  renderStudioNav();
  if (S.studio.active === kind) renderStudioView();

  fetch(`${link.api}/api/runs/${runId}/studio/${kind}`, authed({ method: "POST" }))
    .then((r) => r.json())
    .then(({ job_id }) => {
      const es = new EventSource(streamUrl(`/api/runs/${runId}/studio/${job_id}/stream`));
      es.onmessage = (ev) => {
        const msg = JSON.parse(ev.data);
        if (msg.type === "state") {
          S.studio.artifacts[kind].status = "running";
        } else if (msg.type === "done") {
          S.studio.artifacts[kind] = {
            status: msg.status, provider_id: msg.provider_id,
            raw_text: msg.raw_text, parsed_json: msg.parsed_json,
            error_detail: msg.error_detail,
          };
          es.close();
        } else if (msg.type === "error") {
          S.studio.artifacts[kind] = { status: "failed", error_detail: msg.message };
          es.close();
        }
        renderStudioNav();
        if (S.studio.active === kind) renderStudioView();
      };
      es.onerror = () => es.close();
    })
    .catch(() => {
      S.studio.artifacts[kind] = { status: "failed", error_detail: "Request failed." };
      renderStudioNav();
      if (S.studio.active === kind) renderStudioView();
    });
}

/** Clicking a card generates it if it has never run, and always opens it — so
 *  one click does the obvious thing whether the artifact exists yet or not. */
function openStudio(kind) {
  if (!studioEnabled()) return;
  S.studio.active = kind;
  setView("council");
  if (S.studio.artifacts[kind].status === "idle") generateStudio(kind);
  renderStudioNav();
  renderStudioView();
}

function closeStudio() {
  S.studio.active = null;
  show($("studioView"), false);
  renderStudioNav();
  setView("council");
}

function renderStudioNav() {
  const sec = $("studioSec");
  const enabled = studioEnabled();
  show($("studioNote"), !enabled);
  for (const el of sec.querySelectorAll(".studio-row")) el.remove();

  const before = sec.querySelector(".side-item.disabled"); // the Video tile
  for (const kind of KIND_ORDER) {
    const meta = CARD_META[kind];
    const a = S.studio.artifacts[kind];
    const busy = a.status === "pending" || a.status === "running";
    const b = el("button", `side-item studio-row ${S.studio.active === kind ? "active" : ""}`);
    b.type = "button";
    b.style.setProperty("--sa", meta.accent);
    b.disabled = !enabled;
    b.title = S.navCollapsed ? meta.label : statusHint(a);
    b.setAttribute("aria-current", String(S.studio.active === kind));
    b.append(el("span", "side-ic studio-ic", meta.icon), el("span", "side-label", meta.label));
    const tag = el("span", "side-tag");
    if (busy) tag.append(el("span", "spin", "◐"));
    else tag.textContent = a.status === "complete" ? "✓" : a.status === "failed" ? "!" : "";
    b.append(tag);
    b.onclick = () => openStudio(kind);
    sec.insertBefore(b, before);
  }
}

function renderStudioView() {
  const kind = S.studio.active;
  const view = $("studioView");
  show(view, !!kind);
  if (!kind) return;
  const meta = CARD_META[kind], a = S.studio.artifacts[kind];
  const busy = a.status === "pending" || a.status === "running";

  view.style.setProperty("--sa", meta.accent);
  $("studioIc").textContent = meta.icon;
  $("studioTitle").textContent = meta.label;
  $("studioStatus").textContent = statusHint(a);
  show($("studioRegen"), a.status === "complete");

  const body = $("studioBody");
  body.textContent = "";
  if (busy) {
    const w = el("div", "empty-state");
    w.append(el("span", "spin", "◐"), document.createTextNode(` Generating ${meta.label.toLowerCase()}…`));
    body.append(w);
    return;
  }
  if (a.status === "idle") { body.append(el("div", "empty-state", "Not generated yet.")); return; }
  if (a.status === "failed") {
    const c = el("div", "callout");
    c.append(
      el("div", "kind", "generation failed"),
      el("div", "cause", a.error_detail || "The provider did not return usable output."),
    );
    const again = el("button", "studio-regen", "Try again");
    again.type = "button";
    again.onclick = () => generateStudio(kind);
    c.append(again);
    body.append(c);
    return;
  }
  body.append(renderCard(kind, a));
}

/** Raw text fallback: shown whenever the backend parser found nothing usable in
 *  an otherwise-successful generation. Degrade to plain text rather than hide a
 *  real response the provider actually gave. */
const rawFallback = (text) => el("pre", "studio-raw", text || "");

function renderCard(kind, a) {
  const d = a.parsed_json, raw = a.raw_text || "";
  switch (kind) {
    case "table":      return renderStudioTable(raw);
    // Structurally identical to a verdict — headings, lists, tables, prose — so
    // it reuses that renderer wholesale rather than duplicating the parser.
    case "report":     return verdictBody(raw);
    case "flashcards": return renderFlashcards(d, raw);
    case "quiz":       return renderQuiz(d, raw);
    case "mindmap":    return renderMindMap(d, raw);
    case "slides":     return renderSlides(d, raw);
    case "audio":      return renderAudio(d, raw);
  }
}

/* ── Data Table ─────────────────────────────────────────────────────────── */
function renderStudioTable(text) {
  let head = null;
  const rows = [];
  for (const line of text.replace(/\r/g, "").split("\n")) {
    if (!TABLE_ROW.test(line)) continue;
    if (TABLE_SEP.test(line) && rows.length === 1 && !head) head = rows.shift();
    else if (!TABLE_SEP.test(line)) rows.push(cells(line));
  }
  if (!rows.length && !head) return rawFallback(text);
  const wrap = el("div", "studio-tablewrap"), t = el("table", "studio-table");
  if (head) {
    const tr = el("tr");
    head.forEach((c) => tr.append(el("th", null, c)));
    const th = el("thead"); th.append(tr); t.append(th);
  }
  const tb = el("tbody");
  rows.forEach((r) => {
    const tr = el("tr");
    r.forEach((c) => tr.append(el("td", null, c)));
    tb.append(tr);
  });
  t.append(tb);
  wrap.append(t);
  return wrap;
}

/* ── Flashcards ─────────────────────────────────────────────────────────── */
function renderFlashcards(d, raw) {
  const cards = (d && d.cards) || [];
  if (!cards.length) return rawFallback(raw);
  const flipped = (S.studio.ui.flashcards ||= new Set());
  const box = el("div", "flashcards");
  cards.forEach((c, i) => {
    const b = el("button", `flashcard ${flipped.has(i) ? "flipped" : ""}`);
    b.type = "button";
    const inner = el("div", "flashcard-inner");
    inner.append(
      el("div", "flashcard-face flashcard-front", c.front),
      el("div", "flashcard-face flashcard-back", c.back),
    );
    b.append(inner);
    b.onclick = () => {
      flipped.has(i) ? flipped.delete(i) : flipped.add(i);
      b.classList.toggle("flipped", flipped.has(i));
    };
    box.append(b);
  });
  return box;
}

/* ── Quiz ───────────────────────────────────────────────────────────────── */
function renderQuiz(d, raw) {
  const questions = (d && d.questions) || [];
  if (!questions.length) return rawFallback(raw);
  const picked = (S.studio.ui.quiz ||= {});
  const box = el("div", "quiz");
  questions.forEach((q, qi) => {
    const wrap = el("div", "quiz-q");
    wrap.append(el("div", "quiz-q-text", `${qi + 1}. ${q.text}`));
    const opts = el("div", "quiz-options");
    const why = el("div", "quiz-why", q.why || "");

    const paint = () => {
      const chosen = picked[qi];
      for (const btn of opts.children) {
        const letter = btn.dataset.letter;
        btn.disabled = !!chosen;
        btn.className = "quiz-opt " + (!chosen ? ""
          : letter === q.correct ? "correct"
          : letter === chosen ? "incorrect" : "");
      }
      // The explanation only appears once an answer is locked in — showing it
      // beforehand gives the answer away.
      show(why, !!chosen && !!q.why);
    };

    for (const [letter, text] of Object.entries(q.options)) {
      const b = el("button", "quiz-opt");
      b.type = "button";
      b.dataset.letter = letter;
      b.append(el("span", "quiz-opt-letter", letter), document.createTextNode(text));
      b.onclick = () => { if (!picked[qi]) { picked[qi] = letter; paint(); } };
      opts.append(b);
    }
    wrap.append(opts, why);
    paint();
    box.append(wrap);
  });
  return box;
}

/* ── Mind Map ───────────────────────────────────────────────────────────── */
function renderMindMap(d, raw) {
  const root = (d && d.root) || "", branches = (d && d.branches) || [];
  if (!root && !branches.length) return rawFallback(raw);

  const host = el("div", "mindmap");
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "mm-links");
  svg.setAttribute("aria-hidden", "true");
  const rootEl = el("div", "mm-root", root);
  const branchBox = el("div", "mm-branches");
  const nodeEls = new Map();

  const build = (nodes, parentId) => {
    const frag = document.createDocumentFragment();
    nodes.forEach((n, i) => {
      const id = `${parentId}-${i}`;
      const col = el("div", "mm-col");
      const node = el("div", "mm-node", n.text);
      nodeEls.set(id, { el: node, node });
      col.append(node);
      if (n.children && n.children.length) {
        const kids = el("div", "mm-children");
        kids.append(build(n.children, id));
        col.append(kids);
      }
      frag.append(col);
    });
    return frag;
  };
  branchBox.append(build(branches, "b"));
  host.append(svg, rootEl, branchBox);

  // Same measure-after-layout approach as the council wiring: element positions
  // are only real once the browser has laid them out, so draw on rAF and redraw
  // on resize.
  const draw = () => {
    if (!host.isConnected) return;
    const H = host.getBoundingClientRect(), R = rootEl.getBoundingClientRect();
    if (!R.width) return;
    const rx = R.left - H.left + R.width, ry = R.top - H.top + R.height / 2;
    svg.textContent = "";
    const walk = (nodes, parentId, px, py) => {
      nodes.forEach((n, i) => {
        const id = `${parentId}-${i}`;
        const rec = nodeEls.get(id);
        if (!rec) return;
        const B = rec.el.getBoundingClientRect();
        const x = B.left - H.left, y = B.top - H.top + B.height / 2;
        const mid = (px + x) / 2;
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", `M ${px} ${py} H ${mid} V ${y} H ${x}`);
        path.setAttribute("class", "mm-link");
        svg.append(path);
        walk(n.children || [], id, B.left - H.left + B.width, y);
      });
    };
    walk(branches, "b", rx, ry);
  };
  requestAnimationFrame(draw);
  new ResizeObserver(() => requestAnimationFrame(draw)).observe(host);
  return host;
}

/* ── Slide Deck ─────────────────────────────────────────────────────────── */
function renderSlides(d, raw) {
  const slides = (d && d.slides) || [];
  if (!slides.length) return rawFallback(raw);
  const state = (S.studio.ui.slides ||= { i: 0 });
  const box = el("div", "slidedeck");
  const slide = el("div", "slide");
  const title = el("div", "slide-title");
  const bullets = el("ul", "slide-bullets");
  slide.append(title, bullets);

  const nav = el("div", "slide-nav");
  const prev = el("button", null, "◀"), next = el("button", null, "▶");
  prev.type = next.type = "button";
  const count = el("span", "slide-count");
  nav.append(prev, count, next);

  const paint = () => {
    state.i = Math.max(0, Math.min(state.i, slides.length - 1));
    const s = slides[state.i];
    title.textContent = s.title;
    bullets.textContent = "";
    (s.bullets || []).forEach((b) => bullets.append(el("li", null, b)));
    count.textContent = `${state.i + 1} / ${slides.length}`;
    prev.disabled = state.i === 0;
    next.disabled = state.i === slides.length - 1;
  };
  prev.onclick = () => { state.i -= 1; paint(); };
  next.onclick = () => { state.i += 1; paint(); };
  paint();
  box.append(slide, nav);
  return box;
}

/* ── Audio Overview ─────────────────────────────────────────────────────────
   No server-side TTS and no audio file: MAGI has no audio generation surface
   of its own, so the two-host script a provider writes is read aloud entirely
   client-side with the browser's SpeechSynthesis API. HOST A and HOST B get
   two distinct voices, falling back to one voice at two pitches where the
   platform exposes only one. */
let _voicesPromise = null;
function listVoices() {
  if (!window.speechSynthesis) return Promise.resolve([]);
  if (_voicesPromise) return _voicesPromise;
  _voicesPromise = new Promise((resolve) => {
    const synth = window.speechSynthesis;
    const existing = synth.getVoices();
    if (existing.length) return resolve(existing);
    // Most browsers report zero voices until `voiceschanged` fires, and some
    // never fire it when the voices were already loaded between these two
    // checks -- so a timeout backs it up rather than hanging forever.
    const onChange = () => {
      synth.removeEventListener("voiceschanged", onChange);
      resolve(synth.getVoices());
    };
    synth.addEventListener("voiceschanged", onChange);
    setTimeout(() => resolve(synth.getVoices()), 1000);
  });
  return _voicesPromise;
}

/** Speaks a two-host script line by line, chaining each utterance's `end` event
 *  rather than relying on the browser's own queue — that is what lets the
 *  transcript highlight the line currently being spoken. */
function playScript({ lines, voiceA, voiceB, onLine, onEnd }) {
  const synth = window.speechSynthesis;
  synth.cancel();
  let stopped = false, i = 0;
  const speakNext = () => {
    if (stopped || i >= lines.length) { if (!stopped) onEnd && onEnd(); return; }
    const line = lines[i];
    onLine && onLine(i);
    const utter = new SpeechSynthesisUtterance(line.text);
    if (line.speaker === "A") { if (voiceA) utter.voice = voiceA; utter.pitch = 1.0; }
    else { if (voiceB) utter.voice = voiceB; else utter.pitch = 1.35; }
    utter.onend = utter.onerror = () => { i += 1; speakNext(); };
    synth.speak(utter);
  };
  speakNext();
  return { stop: () => { stopped = true; synth.cancel(); } };
}

let _speech = null;
function renderAudio(d, raw) {
  const lines = (d && d.lines) || [];
  if (!lines.length) return rawFallback(raw);
  const box = el("div", "audio-overview");
  const controls = el("div", "audio-controls");
  const btn = el("button", "navitem");
  btn.type = "button";
  const note = el("span", "audio-note", "");
  controls.append(btn, note);

  const transcript = el("div", "audio-transcript");
  const lineEls = lines.map((l) => {
    const row = el("div", "audio-line");
    row.append(
      el("span", `audio-speaker host-${l.speaker.toLowerCase()}`, l.speaker === "A" ? "Host A" : "Host B"),
      document.createTextNode(l.text),
    );
    transcript.append(row);
    return row;
  });

  let playing = false;
  const setBtn = () => {
    btn.textContent = "";
    btn.append(el("span", "navitem-ic", playing ? "■" : "▶"), document.createTextNode(playing ? "Stop" : "Play"));
  };
  const highlight = (idx) => lineEls.forEach((r, i) => r.classList.toggle("speaking", i === idx));
  const stop = () => {
    _speech && _speech.stop();
    _speech = null;
    playing = false;
    highlight(-1);
    setBtn();
  };
  btn.onclick = async () => {
    if (playing) return stop();
    const voices = await listVoices();
    const english = voices.filter((v) => v.lang.startsWith("en"));
    const pool = english.length >= 2 ? english : voices;
    playing = true;
    setBtn();
    _speech = playScript({
      lines, voiceA: pool[0] || null, voiceB: pool[1] || null,
      onLine: highlight, onEnd: stop,
    });
  };
  setBtn();
  listVoices().then((v) => {
    if (!v.length) note.textContent = "No speech voices available on this device.";
  });

  box.append(controls, transcript);
  return box;
}

$("studioClose").onclick = closeStudio;
$("studioRegen").onclick = () => S.studio.active && generateStudio(S.studio.active);

/* ══ BRAINSTORM ════════════════════════════════════════════════════════════
   Many rounds of council questions until a plan is worth building from, then
   the chairman writes it out as a markdown brief.

   A round is three phases, not one: every member answers the same prompt
   independently (propose), each then reads the others VERBATIM and attacks
   them (critique), and the chairman folds proposals plus critiques into one
   plan (merge). The critique phase is what makes this a debate rather than a
   poll — without it four models produce four opinions and a summariser, and a
   wrong claim from one member is never challenged by the three that could have
   caught it.

   Rounds stream the SAME per-member events a council run does, so they drive
   the same grid with no changes to it. Only the merge differs.

   State lives in S.bs so the sidebar, the round panel and the live grid all
   read one session — the same reason Studio lifts its artifacts out of its
   panel. */

S.bs = {
  sessionId: null, topic: "", status: "active", rounds: [], busy: false,
  phase: "idle",   // idle | council | merging | writing
  error: null, planFilename: null, planMd: null, savedTo: null,
  sessions: [], reply: "", answers: {},   // answers keyed by question index
  es: null, jobId: null,
  draft: "", refining: false, preRefine: null, refineError: null,
};

/** Rounds recorded before questions became structured hold plain strings, and
 *  they still have to render. Normalising on read means every consumer sees one
 *  shape and the old form needs no second code path. */
function normaliseQuestion(q) {
  if (typeof q === "string") return { q, header: "", kind: "open", blocking: false, options: [] };
  const options = (Array.isArray(q && q.options) ? q.options : [])
    .map((o) => (typeof o === "string" ? { label: o, description: "" }
                                       : { label: (o && o.label) || "", description: (o && o.description) || "" }))
    .filter((o) => o.label);
  // Trust the option count over the declared kind: a choice with nothing to
  // pick between is a text box, whatever the backend called it.
  const choice = options.length >= 2;
  return {
    q: (q && q.q) || "", header: (q && q.header) || "",
    kind: choice ? "choice" : "open",
    blocking: !!(q && q.blocking),
    options: choice ? options : [],
  };
}

/** Rebuilds the round list from the flat turn log. The backend stores turns,
 *  not rounds, because a round is not a row — it is a user reply plus N council
 *  answers plus one merge, and which of those exist depends on how far the
 *  round got. */
function roundsFromTurns(turns) {
  const key = (t) => `${t.round_no}:${t.attempt ?? 1}`;
  const byKey = new Map();
  const replies = new Map();
  const blank = (t) => ({
    round_no: t.round_no, attempt: t.attempt ?? 1, superseded: false,
    phase: t.phase === "finalize" ? "finalize" : "round",
    plan_so_far: "", questions: [], agreement: "", corrections_text: "",
    dropped_questions: [], council_split: "", ready: false, ready_note: "",
    parsed: false, raw_text: "", council: [],
  });

  for (const t of turns) {
    const k = key(t);
    // A council-only attempt (one that failed before the merge) still needs a
    // row, or the members' answers would have nowhere to live.
    if (!byKey.has(k)) byKey.set(k, blank(t));
    const round = byKey.get(k);
    if (t.phase === "finalize") round.phase = "finalize";

    if (t.role === "user" && (t.content || "").trim()) {
      replies.set(t.round_no, t.content.trim());
    } else if (t.role === "council") {
      round.council.push({
        provider_id: t.provider_id || "member", content: t.content || "",
        ok: t.ok === 1 || t.ok === undefined || t.ok === null,
        degraded: t.degraded === 1, degraded_reason: t.degraded_reason,
        failure_kind: t.failure_kind, error_detail: t.error_detail,
        latency_ms: t.latency_ms, chars: t.char_count,
      });
    } else if (t.role === "chairman" && t.parsed_json) {
      const p = t.parsed_json;
      // The finalise turn holds the finished plan, not a round merge; the plan
      // has its own view and must not masquerade as a round.
      if (p.kind === "plan") continue;
      round.plan_so_far = p.plan_so_far || "";
      round.questions = (p.questions || []).map(normaliseQuestion);
      round.agreement = p.agreement || p.council_split || "";
      round.corrections_text = p.corrections_text || "";
      round.dropped_questions = p.dropped_questions || [];
      round.council_split = p.council_split || "";
      round.ready = !!p.ready;
      round.ready_note = p.ready_note || "";
      round.parsed = !!p.parsed;
      round.raw_text = t.content || "";
      round.chairman = t.provider_id || undefined;
    }
  }

  const rounds = [...byKey.values()].sort(
    (a, b) => a.round_no - b.round_no || a.attempt - b.attempt);

  // Mark every attempt a later one replaced. Kept and shown rather than
  // hidden: a round that failed still happened, and what the members said
  // before it failed is part of the record.
  const best = new Map();
  for (const r of rounds) best.set(r.round_no, Math.max(best.get(r.round_no) ?? 0, r.attempt));
  for (const r of rounds) r.superseded = r.attempt < (best.get(r.round_no) ?? 1);

  // The reply to round N's questions is stored on round N+1, which is where
  // the user typed it. Attaching it back to the round it answers is what makes
  // the history read as a conversation.
  for (const [roundNo, reply] of replies) {
    const answered = [...byKey.values()]
      .filter((r) => r.round_no === roundNo - 1)
      .sort((a, b) => b.attempt - a.attempt)[0];
    if (answered) answered.reply = reply;
  }
  return rounds;
}

/** Suggested filename for the save dialog, mirroring the backend's
 *  `plan_filename`. Recomputed on the client when an old session is reopened,
 *  since the filename is only ever a suggestion and never a stored location. */
function planFilenameFor(topic) {
  const slug = (topic || "").toLowerCase()
    .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "")
    .slice(0, 48).replace(/-[^-]*$/, "") || "plan";
  const d = new Date();
  const date = [d.getFullYear(), String(d.getMonth() + 1).padStart(2, "0"),
                String(d.getDate()).padStart(2, "0")].join("-");
  return `${date}-${slug}.md`;
}

/** The round on screen is the newest one that actually produced a merge — a
 *  superseded attempt, or a fan-out that failed before the chairman, has no
 *  questions to answer. */
function latestRound() {
  const rs = S.bs.rounds;
  return [...rs].reverse().find((r) => r.parsed || r.questions.length > 0)
      || (rs.length ? rs[rs.length - 1] : null);
}

const bsBusy = () => S.running || S.bs.busy;

/* ── actions ───────────────────────────────────────────────────────────── */

async function loadBsSessions() {
  if (!online()) return;
  try {
    const r = await fetch(`${link.api}/api/brainstorm?limit=30`, authed());
    S.bs.sessions = await r.json();
  } catch { return; }
  renderBsNav();
  if (S.view === "brainstorm") renderBsView();
}

function closeBsStream() {
  if (S.bs.es) { S.bs.es.close(); S.bs.es = null; }
  S.bs.jobId = null;
}

/** Re-reads the turn log. The database is the complete record — every member
 *  answer and every attempt — so the view is rebuilt from it rather than
 *  assembled from the events, which carry only the merge. */
async function refreshTurns(id) {
  try {
    const r = await fetch(`${link.api}/api/brainstorm/${id}`, authed());
    const data = await r.json();
    S.bs.rounds = roundsFromTurns(data.turns);
    if (data.session && data.session.plan_md) S.bs.planMd = data.session.plan_md;
  } catch {}
}

/** Rehydrate a session from SQLite. Same principle as the council view's
 *  reload recovery: a session is many minutes of work and must survive a
 *  refresh. */
async function openBsSession(id) {
  closeBsStream();
  Object.assign(S.bs, { error: null, busy: false, phase: "idle", reply: "", answers: {} });
  try {
    const r = await fetch(`${link.api}/api/brainstorm/${id}`, authed());
    if (!r.ok) throw new Error("Session not found.");
    const data = await r.json();
    Object.assign(S.bs, {
      sessionId: id, topic: data.session.topic, status: data.session.status,
      planFilename: planFilenameFor(data.session.topic), savedTo: null,
      planMd: data.session.plan_md || null, rounds: roundsFromTurns(data.turns),
    });
  } catch (e) {
    S.bs.error = (e && e.message) || "Could not open that session.";
  }
  setView("brainstorm");
}

/** Subscribes to a round or finalise job. Both stream the same per-member
 *  events the council grid already renders, so they feed it unchanged. */
function listenBs(sid, jobId, kind) {
  const es = new EventSource(streamUrl(`/api/brainstorm/${sid}/job/${jobId}/stream`));
  S.bs.es = es;
  S.bs.jobId = jobId;

  es.onmessage = async (ev) => {
    const msg = JSON.parse(ev.data);
    onBrainstormEvent(msg);

    if (msg.type === "state") {
      // The chairman's own turn arrives as a waiting state carrying a message;
      // that is the transition out of the fan-out phase.
      if (msg.message) { S.bs.phase = kind === "finalize" ? "writing" : "merging"; renderBsView(); }
    } else if (msg.type === "done") {
      if (kind === "finalize") {
        S.bs.status = "complete";
        S.bs.planFilename = msg.plan_filename || null;
        S.bs.planMd = msg.plan_md || null;
      } else {
        S.bs.reply = "";
        // The new round's questions are different questions; keeping the old
        // selections would attach them to the wrong ones by index.
        S.bs.answers = {};
      }
      // Rebuild from the database rather than patching the round in from the
      // event. The event carries only the merge; the database has the members'
      // full answers and every earlier attempt.
      await refreshTurns(sid);
      Object.assign(S.bs, { busy: false, phase: "idle" });
      closeBsStream();
      loadBsSessions();
      renderBsNav(); renderBsView(); updateEnabled();
    } else if (msg.type === "error") {
      S.bs.error = msg.message || "The round failed.";
      // A failed round still produced member answers, and they are kept:
      // the failure is then inspectable rather than a dead end with nothing
      // to show for the minutes it cost.
      await refreshTurns(sid);
      Object.assign(S.bs, { busy: false, phase: "idle" });
      // Finalise failure puts the session back to active server-side, so the
      // local view has to agree or the retry button stays hidden.
      if (kind === "finalize") S.bs.status = "active";
      closeBsStream();
      renderBsNav(); renderBsView(); updateEnabled();
    }
  };
  es.onerror = () => {
    Object.assign(S.bs, { busy: false, phase: "idle" });
    closeBsStream();
    renderBsNav(); renderBsView(); updateEnabled();
  };
}

/** Brainstorm rounds stream the same per-member events a council run does, so
 *  feeding them through one handler is what lets the existing console render a
 *  round with no changes to it. */
function onBrainstormEvent(msg) {
  if (msg.type === "state") {
    const p = byId(msg.provider_id);
    if (!p) return;
    p.state = msg.state;
    p.text = msg.text || p.text;
    p.chars = msg.chars || p.chars;
    updateNode(p); updateCore(); drawLinks();
  } else if (msg.type === "done" || msg.type === "error") {
    // Round over: settle every unit still shown as working, so the grid does
    // not keep animating after the round has landed.
    for (const p of S.panels) {
      if (WORKING.has(p.state)) { p.state = "done"; p.ok = true; updateNode(p); }
    }
    updateCore(); drawLinks();
  }
}

/** Only the questions the user actually touched go on the wire. */
function answersPayload() {
  return JSON.stringify(
    Object.entries(S.bs.answers)
      .map(([i, a]) => ({ index: Number(i), value: a.value ?? null, other: a.other ?? null }))
      .filter((a) => a.value || a.other));
}

/** Puts the console into the state a run would leave it in, so the grid shows
 *  the members working through the round. */
function primeGridForRound() {
  S.verdict = null;
  S.settled = new Set();
  S.opened = new Set();
  S.panels = S.providers.filter((p) => S.selected.has(p.id)).map((p) => ({
    id: p.id, display_name: p.display_name, accent: p.accent,
    state: "queued", text: "", chars: 0,
  }));
  renderGrid();
  renderVerdict();
}

async function startBrainstorm(rawTopic) {
  const t = (rawTopic || "").trim();
  if (!t || bsBusy() || S.selected.size === 0 || !online()) return;
  Object.assign(S.bs, {
    error: null, busy: true, phase: "council", rounds: [],
    planFilename: null, savedTo: null, planMd: null, status: "active",
    topic: t, reply: "", answers: {},
  });
  setView("brainstorm");
  primeGridForRound();
  renderBsView(); renderBsNav(); updateEnabled();

  try {
    const form = new FormData();
    form.append("topic", t);
    form.append("providers", [...S.selected].join(","));
    const res = await fetch(`${link.api}/api/brainstorm`, authed({ method: "POST", body: form }));
    if (!res.ok) throw new Error(((await res.json()) || {}).detail || "Could not start.");
    const { session_id } = await res.json();
    S.bs.sessionId = session_id;

    const rr = await fetch(`${link.api}/api/brainstorm/${session_id}/round`,
                           authed({ method: "POST", body: new FormData() }));
    if (!rr.ok) throw new Error(((await rr.json()) || {}).detail || "Round failed to start.");
    const { job_id } = await rr.json();
    listenBs(session_id, job_id, "round");
    loadBsSessions();
  } catch (e) {
    Object.assign(S.bs, { error: (e && e.message) || "Could not start the session.", busy: false, phase: "idle" });
    renderBsView(); updateEnabled();
  }
}

async function bsNextRound() {
  if (!S.bs.sessionId || bsBusy() || !online()) return;
  Object.assign(S.bs, { error: null, busy: true, phase: "council" });
  primeGridForRound();
  renderBsView(); renderBsNav(); updateEnabled();
  try {
    const form = new FormData();
    form.append("reply", S.bs.reply);
    form.append("answers", answersPayload());
    const res = await fetch(`${link.api}/api/brainstorm/${S.bs.sessionId}/round`,
                            authed({ method: "POST", body: form }));
    if (!res.ok) throw new Error(((await res.json()) || {}).detail || "Round failed to start.");
    const { job_id } = await res.json();
    listenBs(S.bs.sessionId, job_id, "round");
  } catch (e) {
    Object.assign(S.bs, { error: (e && e.message) || "Could not run the next round.", busy: false, phase: "idle" });
    renderBsView(); updateEnabled();
  }
}

async function bsFinalize() {
  if (!S.bs.sessionId || bsBusy() || !online()) return;
  Object.assign(S.bs, { error: null, busy: true, phase: "council", status: "finalizing" });
  primeGridForRound();
  renderBsView(); renderBsNav(); updateEnabled();
  try {
    const form = new FormData();
    form.append("reply", S.bs.reply);
    form.append("answers", answersPayload());
    const res = await fetch(`${link.api}/api/brainstorm/${S.bs.sessionId}/finalize`,
                            authed({ method: "POST", body: form }));
    if (!res.ok) throw new Error(((await res.json()) || {}).detail || "Could not finalise.");
    const { job_id } = await res.json();
    listenBs(S.bs.sessionId, job_id, "finalize");
  } catch (e) {
    Object.assign(S.bs, {
      error: (e && e.message) || "Could not finalise the plan.",
      busy: false, phase: "idle", status: "active",
    });
    renderBsView(); updateEnabled();
  }
}

async function bsCancel() {
  if (!S.bs.sessionId || !S.bs.jobId || !online()) return;
  await fetch(`${link.api}/api/brainstorm/${S.bs.sessionId}/job/${S.bs.jobId}/cancel`,
              authed({ method: "POST" })).catch(() => {});
}

/** Clears back to the "start a new session" screen. */
function bsReset() {
  if (bsBusy()) return;
  closeBsStream();
  Object.assign(S.bs, {
    sessionId: null, topic: "", rounds: [], status: "active",
    planFilename: null, savedTo: null, planMd: null, error: null,
    reply: "", answers: {}, phase: "idle", draft: "", preRefine: null, refineError: null,
  });
  renderBsNav(); renderBsView();
}

/** Hands the plan to the user as a file, wherever they choose to put it.
 *
 *  Nothing has been written to disk at this point — the plan lives in the
 *  database and in memory. Chrome's File System Access API gives a real Save As
 *  dialog; anything else falls back to an ordinary download, which lands in the
 *  browser's download folder. */
async function bsSavePlan() {
  if (!S.bs.planMd) return;
  const suggested = S.bs.planFilename || "plan.md";
  if (typeof window.showSaveFilePicker === "function") {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: suggested,
        types: [{ description: "Markdown", accept: { "text/markdown": [".md"] } }],
      });
      const w = await handle.createWritable();
      await w.write(S.bs.planMd);
      await w.close();
      S.bs.savedTo = handle.name || suggested;
      renderBsView();
      return;
    } catch (e) {
      // Dismissing the dialog is not an error worth reporting. Anything else
      // (a permission refusal, a read-only location) falls through to the
      // download path rather than leaving them with nothing.
      if (e && e.name === "AbortError") return;
    }
  }
