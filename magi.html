    setSync("error", _syncFail("deleting a planning session", e));
    return;
  }
  BS_PINS.delete(x.id);
  delete BS_NICKS[x.id];
  delete BS_UNPINNED_AT[x.id];
  saveBsMarks();
  S.bs.sessions = S.bs.sessions.filter((y) => y.id !== x.id);
  // The session that was open has just been deleted; bsReset also puts the
  // panel back on the start screen, which is where you now are.
  if (S.bs.sessionId === x.id) bsReset(); else renderBsView();
}

function bsBackButton() {
  const b = el("button", "navitem");
  b.type = "button";
  b.disabled = bsBusy();
  b.title = "Leave this session and start a new one";
  b.append(el("span", "navitem-ic", "←"),
           document.createTextNode(" New session"));
  b.onclick = bsReset;
  return b;
}

function renderBsView() {
  const root = $("bsView");
  show(root, S.view === "brainstorm");
  if (S.view !== "brainstorm") return;
  // The units row is BORROWED into this panel (see further down), so clearing
  // the panel would delete a #page element outright -- and the next render
  // then did root.append(null), which the DOM helpfully stringifies into the
  // word "null" on screen. Hand it back before wiping.
  const borrowed = document.getElementById("unitBar");
  if (borrowed && borrowed.parentElement === root) {
    $("page").insertBefore(borrowed, $("qbar").nextSibling);
  }
  root.textContent = "";
  const bs = S.bs, busy = bs.busy;

  /* ── no session yet ─────────────────────────────────────────────────── */
  if (!bs.sessionId) {
    const hd = el("div", "bs-hd");
    // Heading only. The description goes under the units -- see the note
    // appended after the borrowed unit bar below.
    hd.append(el("span", "bs-title", "Brainstorm"));
    root.append(hd);

    const start = el("div", "bs-start");
    // Drop files on it, exactly as the council's composer takes them. Wired
    // here rather than once at startup because renderBsView rebuilds this
    // element on every state change, so a listener attached to an earlier one
    // would be attached to a node that is no longer on the page.
    start.addEventListener("dragover", (e) => {
      if (bsBusy()) return;
      e.preventDefault();
      start.classList.add("drag");
    });
    start.addEventListener("dragleave", () => start.classList.remove("drag"));
    start.addEventListener("drop", (e) => {
      e.preventDefault();
      start.classList.remove("drag");
      if (!bsBusy() && e.dataTransfer && e.dataTransfer.files.length) {
        bsAddFiles(e.dataTransfer.files);
      }
    });
    const ta = el("textarea", "bs-topic");
    ta.placeholder = "What do you want to plan?  Describe the idea roughly — the questions come next.   (Ctrl+Enter)";
    ta.value = bs.draft;
    // Locked during a refine as well as a round: the rewrite replaces this
    // text, so edits made while it is in flight would be lost.
    ta.disabled = busy || bs.refining;
    bsAutosize(ta);
    ta.oninput = () => {
      bs.draft = ta.value;
      bsAutosize(ta);
      // Once the rewrite is edited by hand, "Undo" would restore over the
      // person's own words rather than over a machine rewrite.
      if (bs.preRefine !== null) bs.preRefine = null;
      if (bs.refineError) { bs.refineError = null; }
      syncBsStartBar();
    };
    ta.onkeydown = (e) => {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && ta.value.trim()) {
        e.preventDefault();
        const t = ta.value;
        bs.draft = ""; bs.preRefine = null;
        startBrainstorm(t);
      }
    };
    start.append(ta);
    if (bs.refineError) start.append(el("div", "qbar-error", bs.refineError));

    // Attachments, exactly as the council's composer does them: the same
    // limits, the same chip strip, the same hidden native input behind a +.
    // They are staged with the SESSION rather than with a round, because
    // every round of a brainstorm is about the same material.
    const chips = el("div", "qbar-chips");
    chips.id = "bsChips";
    show(chips, (bs.attachments || []).length > 0);
    renderBsChipsInto(chips);
    start.append(chips);
    const aerr = el("div", "qbar-error");
    aerr.id = "bsAttachError";
    show(aerr, false);
    start.append(aerr);

    const bar = el("div", "bs-start-bar");

    const fileIn = el("input");
    fileIn.type = "file";
    fileIn.multiple = true;
    fileIn.hidden = true;
    fileIn.onchange = (e) => {
      if (e.target.files && e.target.files.length) bsAddFiles(e.target.files);
      e.target.value = "";
    };
    const attach = el("button", "qbar-attach");
    attach.type = "button";
    attach.title = "Attach files";
    attach.setAttribute("aria-label", "Attach files");
    attach.innerHTML = IC.attach;
    attach.disabled = busy || (bs.attachments || []).length >= MAX_ATTACHMENTS;
    attach.onclick = () => fileIn.click();
    bar.append(fileIn, attach);

    const refineBtn = el("button", `qbar-refine ${bs.refining ? "busy" : ""}`);
    refineBtn.type = "button";
    refineBtn.id = "bsRefine";
    refineBtn.title = "Rewrite this into a sharper topic";
    refineBtn.setAttribute("aria-label", "Refine topic");
    const rIco = el("span", "qbar-refine-ico", bs.refining ? "◌" : "✦");
    rIco.setAttribute("aria-hidden", "true");
    refineBtn.append(rIco, el("span", "qbar-refine-txt", bs.refining ? "Refining…" : "Refine"));
    refineBtn.onclick = bsRefine;
    bar.append(refineBtn);

    if (bs.preRefine !== null && !bs.refining) {
      const undo = el("button", "qbar-undo", "↺ Undo");
      undo.type = "button";
      undo.title = "Restore what you wrote";
      undo.disabled = busy;
      undo.onclick = () => {
        bs.draft = bs.preRefine; bs.preRefine = null; bs.refineError = null;
        renderBsView();
      };
      bar.append(undo);
    }

    // A spacer, not a note. The unit count was already on the chips directly
    // underneath, and "each round takes a few minutes" is something you learn
    // once -- so it was two facts competing for the place where the council
    // puts nothing, and it pushed Begin session away from the right edge
    // where Convene sits.
    bar.append(el("span", "qbar-spacer"));
    const begin = el("button", "btn active", "Begin session");
    begin.id = "bsBegin";
    // Also blocked mid-refine: starting now would seed the session with the
    // pre-rewrite text and throw the rewrite away as it landed.
    begin.onclick = () => {
      const t = ta.value;
      bs.draft = ""; bs.preRefine = null;
      startBrainstorm(t);
    };
    bar.append(begin);
    const bsGrip = gripButton();
    bar.append(bsGrip);
    start.append(bar);
    attachGrip(ta, bsGrip, "bstopic", () => bsAutosize(ta));
    root.append(start);
    syncBsStartBar();

    if (bs.error) root.append(bsCallout("could not start", bs.error));

    // The units row is a #page sibling, so setView can only put it before or
    // after this whole panel -- which left Past sessions wedged between the
    // composer and the units that belong to it. Adopting the node here puts
    // it exactly where it reads: under the composer, above the list. setView
    // hands it back to #page on the way out, so this is a loan, not a move.
    // Guarded: appending null writes the string "null" into the page, which
    // is a confusing way to learn that an element has gone missing.
    if ($("unitBar")) root.append($("unitBar"));
    root.append(el("div", "view-note",
      "Plan something round by round: the council asks you questions until the plan is worth building from, then writes it out as a file for a coding agent."));

    if (bs.sessions.length) {
      const drawer = el("div", "drawer");
      drawer.append(el("div", "drawer-hd", "Past sessions"));
      for (const x of bs.sessions.filter((y) => !bsExpired(y))
                        .sort((a, b) => (bsPinned(b) - bsPinned(a)) ||
                                        String(b.created_at).localeCompare(String(a.created_at)))) {
        const pinned = bsPinned(x), nick = bsNickOf(x);
        const row = el("div", "row" + (pinned ? " pinned" : ""));
        const q = el("span", "q" + (nick ? " named" : ""), bsTitleOf(x));
        if (nick) q.title = x.topic;
        row.append(q);
        const meta = el("span", "meta",
          `${x.status === "complete" ? "plan ready" : x.status} · ` +
          `${x.rounds} round${x.rounds === 1 ? "" : "s"} · ` +
          new Date(x.created_at).toLocaleString([], {
            year: "numeric", month: "numeric", day: "numeric",
            hour: "numeric", minute: "2-digit",
          }));
        row.append(meta);

        const acts = el("span", "row-acts");
        const pin = el("button", "row-act" + (pinned ? " on" : ""));
        pin.type = "button";
        pin.innerHTML = IC.pin;
        pin.title = pinned
          ? "Pinned \u2014 kept forever. Click to unpin."
          : `Pin this, to keep it past ${HISTORY_DAYS} days`;
        pin.onclick = (e) => { e.stopPropagation(); bsTogglePin(x.id); };
        const ren = el("button", "row-act" + (nick ? " on" : ""));
        ren.type = "button";
        ren.innerHTML = IC.rename;
        ren.title = nick ? "Rename, or remove the name" : "Give this a name";
        ren.onclick = (e) => { e.stopPropagation(); openBsNickSheet(x); };
        const del = el("button", "row-act danger");
        del.type = "button";
        del.innerHTML = IC.trash;
        del.title = "Delete this session";
        del.onclick = (e) => { e.stopPropagation(); deleteBsSession(x); };
        acts.append(pin, ren, del);
        row.append(acts);

        row.onclick = () => openBsSession(x.id);
        drawer.append(row);
      }
      drawer.append(el("div", "history-note",
        `Sessions are kept for ${HISTORY_DAYS} days. Pin one to keep it forever.`));
      root.append(drawer);
    }
    return;
  }

  /* ── finished: the plan ─────────────────────────────────────────────── */
  if (bs.status === "complete" && bs.planMd) {
    const hd = el("div", "bs-hd");
    hd.append(el("span", "bs-title", "Plan ready"), el("span", "bs-sub", bs.topic));
    root.append(hd);
    const backBar = el("div", "bs-backbar");
    backBar.append(bsBackButton());
    root.append(backBar);

    const bar = el("div", "bs-plan-bar");
    const state = el("span", "bs-save-state");
    if (bs.savedTo) {
      state.append(el("span", "bs-saved-tick", "✓"), document.createTextNode(" Saved as "),
                   el("code", null, bs.savedTo));
    } else {
      state.textContent = "Not saved anywhere yet — nothing has been written to disk.";
    }
    bar.append(state, el("span", "qbar-spacer"));
    const save = el("button", "navitem");
    save.type = "button";
    save.append(el("span", "navitem-ic", "↓"),
                document.createTextNode(bs.savedTo ? "Save again…" : "Save as…"));
    save.onclick = bsSavePlan;
    // Built here so the bar's copy button can point at the rendered plan; it
    // is appended further down, where it belongs on screen.
    const planBody = el("div", "verdict");
    planBody.append(verdictBody(bs.planMd));
    bar.append(save, copyButton(() => ({ node: planBody, md: bs.planMd || "" }),
                                { label: "Copy plan" }));
    root.append(bar);

    const hint = el("div", "bs-hint");
    hint.append(document.createTextNode(
      "Hand this to Claude Code — it reads as a standalone brief, with the session " +
      "transcript folded in at the end. Copy it straight into a prompt, or save it as "),
      el("code", null, bs.planFilename || "a .md file"),
      document.createTextNode(" wherever you keep your plans."));
    root.append(hint);

    root.append(planBody);

    const hist = roundHistory(bs.rounds);
    if (hist) root.append(hist);
    return;
  }

  /* ── active session ─────────────────────────────────────────────────── */
  const latest = latestRound();
  const hd = el("div", "bs-hd");
  hd.append(el("span", "bs-title", `Brainstorm · round ${latest ? latest.round_no : 1}`),
            el("span", "bs-sub", bs.topic));
  root.append(hd);
  const backBar = el("div", "bs-backbar");
  backBar.append(bsBackButton());
  root.append(backBar);

  if (busy) { const pn = phaseNote(bs.phase); if (pn) root.append(pn); }
  if (bs.error) {
    root.append(bsCallout("round failed", bs.error,
      "Nothing was lost — every earlier round is saved. Try again."));
  }

  if (latest) {
    if (latest.parsed) {
      const v = el("div", "verdict");
      const vh = el("div", "verdict-hd");
      vh.append(el("span", "verdict-title", "Plan so far"),
                el("span", "verdict-quorum",
                   `round ${latest.round_no}` + (latest.chairman ? ` · merged by ${latest.chairman}` : "")));
      const planNow = verdictBody(latest.plan_so_far);
      vh.append(copyButton(() => ({ node: planNow, md: latest.plan_so_far })));
      v.append(vh, planNow);
      root.append(v);

      if (latest.agreement) root.append(bsDetails("Where the council agreed and split", latest.agreement));
      if (latest.corrections_text) root.append(bsDetails("Factual errors caught this round", latest.corrections_text));
      if (latest.dropped_questions.length) {
        root.append(bsDetails(
          `Questions dropped as already settled (${latest.dropped_questions.length})`,
          latest.dropped_questions.map((q) => `- ${q}`).join("\n")));
      }
    } else {
      // The headings did not parse. The text still cost minutes of real browser
      // time and usually contains the plan anyway, so it is shown rather than
      // thrown away.
      const v = el("div", "verdict");
      const vh = el("div", "verdict-hd");
      vh.append(el("span", "verdict-title", `Round ${latest.round_no}`),
                el("span", "verdict-quorum", "unstructured response"));
      const rawNow = verdictBody(latest.raw_text);
      vh.append(copyButton(() => ({ node: rawNow, md: latest.raw_text })));
      v.append(vh, rawNow);
      root.append(v);
    }

    // The raw material this round's merge came from, available without leaving
    // the round.
    const ca = councilAnswers(latest.council);
    if (ca) root.append(ca);

    if (latest.questions.length) {
      const box = el("div", "bs-questions");
      const qh = el("div", "bs-questions-hd");
      qh.append(document.createTextNode("Questions for you"),
                el("span", "bs-qcount",
                   `${latest.questions.length} · answer what you can, skip the rest`));
      box.append(qh);
      const cards = el("div", "bs-cards");
      latest.questions.forEach((q, i) => cards.append(questionCard(i, q, busy)));
      box.append(cards);
      root.append(box);
    }
  }

  if (!busy) {
    const qbar = el("div", "qbar bs-reply");
    const ta = el("textarea");
    ta.placeholder = latest && latest.questions.length
      ? "Anything else the questions didn't cover? Optional.   (Ctrl+Enter)"
      : "Anything to add before the next round?   (Ctrl+Enter)";
    ta.value = bs.reply;
    ta.oninput = () => { bs.reply = ta.value; };
    ta.onkeydown = (e) => {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); bsNextRound(); }
    };
    qbar.append(ta);

    const tools = el("div", "qbar-toolbar");
    if (latest && latest.ready) {
      const rd = el("span", "bs-ready", "✓ The council thinks the plan is ready");
      rd.title = latest.ready_note || "";
      tools.append(rd);
    }
    tools.append(el("span", "qbar-spacer"));
    const next = el("button", "btn", "Next round");
    next.onclick = bsNextRound;
    // Emphasised once the council says it is ready — a hint about when to stop,
    // never a gate. The user ends the session.
    const fin = el("button", `btn ${latest && latest.ready ? "active" : ""}`, "Finalize plan");
    fin.title = "End the session and write the plan file";
    fin.disabled = !bs.rounds.length;
    fin.onclick = bsFinalize;
    tools.append(next, fin);
    const rGrip = gripButton();
    tools.append(rGrip);
    qbar.append(tools);
    root.append(qbar);
    attachGrip(ta, rGrip, "bsreply", () => bsAutosize(ta));
  } else {
    const halt = el("div", "qbar-toolbar bs-halt");
    halt.append(el("span", "qbar-spacer"));
    const b = el("button", "navitem danger");
    b.type = "button";
    b.append(icSpan("navitem-ic", "halt"), document.createTextNode("Halt round"));
    b.onclick = bsCancel;
    halt.append(b);
    root.append(halt);
  }

  // Everything except the round shown above — including attempts that failed,
  // which are part of the record.
  const hist = roundHistory(bs.rounds.filter(
    (r) => !latest || r.round_no !== latest.round_no || r.attempt !== latest.attempt));
  if (hist) root.append(hist);
}

/** Enable/disable for the start screen, kept out of renderBsView so typing in
 *  the topic box does not rebuild the textarea under the caret. */
function syncBsStartBar() {
  const begin = $("bsBegin"), refine = $("bsRefine");
  if (!begin) return;
  const draft = S.bs.draft.trim();
  begin.disabled = bsBusy() || S.bs.refining || !draft || S.selected.size === 0 || !online();
  if (refine) refine.disabled = bsBusy() || S.bs.refining || !draft || !online();
}

/** Prompt refinement for the topic, same contract as the council composer: the
 *  rewrite lands in the box to be read and edited, never sent on the user's
 *  behalf, and preRefine keeps the original so it is undoable.
 *
 *  It matters more here, if anything — the topic seeds every round that
 *  follows, so a vague one costs minutes of questions rather than one answer. */
async function bsRefine() {
  const q = S.bs.draft.trim();
  if (!q || S.bs.refining || bsBusy() || !online()) return;
  S.bs.refining = true;
  S.bs.refineError = null;
  renderBsView();
  try {
    const form = new FormData();
    form.append("question", q);
    form.append("providers", [...S.selected].join(","));
    const res = await fetch(`${link.api}/api/refine`, authed({ method: "POST", body: form }));
    if (!res.ok) {
      const body = await res.json().catch(() => null);
      throw new Error((body && body.detail) || `Refine failed (${res.status})`);
    }
    const { refined } = await res.json();
    // Refining twice must not make the first rewrite the thing Undo restores —
    // only ever the text the person actually wrote.
    if (S.bs.preRefine === null) S.bs.preRefine = q;
    S.bs.draft = refined;
  } catch (e) {
    S.bs.refineError = (e && e.message) || "Refine failed.";
  } finally {
    S.bs.refining = false;
    renderBsView();
  }
}

/* ══ mobile drawer ═════════════════════════════════════════════════════════
   Below 760px the sidebar is off-canvas. Opening it is a class on the shell,
   so the CSS owns the animation and this owns only the intent. */
function setDrawer(open) {
  $("shell").classList.toggle("nav-open", open);
  $("navBurger").setAttribute("aria-expanded", String(open));
  // The drawer scrolls over the page; letting the page scroll underneath is
  // the classic phone bug where closing leaves you somewhere else entirely.
  document.body.style.overflow = open ? "hidden" : "";
}
const drawerOpen = () => $("shell").classList.contains("nav-open");

$("navBurger").onclick = () => setDrawer(!drawerOpen());
$("scrim").onclick = () => setDrawer(false);
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && drawerOpen()) setDrawer(false);
});
// Any navigation choice closes it -- on a phone the drawer covers what you
// just asked to see, so leaving it open hides the result of the tap.
$("sideNav").addEventListener("click", (e) => {
  if (e.target.closest("button") && drawerOpen()) setDrawer(false);
});
// A rotate or a resize back to desktop must not strand the shell in the open
// state, where `nav-open` would mean nothing and the scrim would be gone.
window.addEventListener("resize", () => {
  if (window.innerWidth > 760 && drawerOpen()) setDrawer(false);
});

/** The top bar mirrors the sidebar's link status, because on mobile the
 *  sidebar is usually shut and that row is the only "is the engine there?"
 *  signal the user can see. */
function syncMobileLink() {
  const dot = $("mtopDot");
  if (!dot) return;
  dot.className = "link-dot";
  $("linkBtn").classList.forEach((c) => { if (c !== "link") dot.classList.add(c); });
  $("mtopTxt").textContent = link.detail ? linkLabel().main : "";
}

/** Sync state, shown under the wordmark.
 *
 *  Mirrors TaskHub's states and wording exactly -- saving / saved / error,
 *  with "saved" fading back to nothing after a moment rather than sitting
 *  there. A permanent "Synced" is a label people stop reading; the useful
 *  signals are the two transient ones and the failure, which persists. */
function setSync(state, why) {
  clearTimeout(setSync._t);
  const text = { saving: "Syncing…", saved: "Synced", error: "Sync failed",
                 off: "Sync off" }[state];
  // "Sync failed" on its own is a dead end: it names no operation, no cause
  // and no fix, and the browser console is not somewhere you can look from a
  // phone. The reason is kept and the line becomes clickable.
  if (state === "error" && why) SYNC_ERR.last = why;
  if (state === "saved") SYNC_ERR.last = null;
  const title = state === "off"
    ? "Firebase App Check only issues tokens on anthonyn99.github.io, so a page "
      + "served from 127.0.0.1 cannot sign in. Open the hosted URL to sync."
    : state === "error"
    ? "Click for what failed"
    : "";
  // Two lines, one state: the sidebar's and the mobile top bar's. On a phone
  // the sidebar is a closed drawer, so the top-bar copy is the only one that
  // can ever be seen -- and a state written to only one of them would mean the
  // two could disagree about whether the last run reached the cloud.
  // The mobile brand hands its tagline line over while there is something to
  // say, and takes it back when there is not.
  const brand = $("mtopBrand");
  if (brand) brand.classList.toggle("showsync", !!text);
  for (const id of ["syncLine", "syncLineM"]) {
    const n = $(id);
    if (!n) continue;
    n.className = "syncline" + (text ? " on " + state : "");
    n.textContent = text || "";
    n.title = title;
    n.style.cursor = state === "error" ? "pointer" : "";
    n.onclick = state === "error" ? showSyncError : null;
  }
  // A failure stays put: it needs acting on. A success does not.
  if (state === "saved") setSync._t = setTimeout(() => setSync("idle"), 2500);
}

/* What went wrong the last time a write failed.
 *
 *  Firestore failures are specific and actionable -- permission-denied,
 *  resource-exhausted, unavailable, failed-precondition -- and every one of
 *  them was being collapsed into the words "Sync failed" with the detail going
 *  to a console nobody can open on a phone. */
const SYNC_ERR = { last: null };

const _syncFail = (where, e) => ({
  where,
  code: (e && (e.code || e.name)) || "",
  message: (e && (e.message || String(e))) || "unknown",
  at: new Date().toISOString(),
});

/** Plain-language cause and fix for the Firestore codes worth knowing. */
const SYNC_CAUSE = {
  "permission-denied":
    "Firestore refused the write. Either this browser is not signed in, or firestore.rules no longer allows dashboards/magi.",
  "resource-exhausted":
    "The Firebase project has hit a quota for today. Everything keeps working locally; sync resumes when the quota resets.",
  unavailable:
    "Could not reach Firestore — usually the network, occasionally an outage. It retries on its own.",
  unauthenticated:
    "Anonymous sign-in has expired or was rejected. Reloading the page signs in again.",
  "invalid-argument":
    "Firestore rejected the shape of the document. This one does not fix itself — it is a bug worth reporting.",
  "deadline-exceeded":
    "The write took too long and was abandoned. Usually a slow connection.",
  "failed-precondition":
    "Firestore needs something that is missing — often an index, occasionally a second tab holding the local cache.",
};

function showSyncError() {
  const e = SYNC_ERR.last;
  const sheet = el("div", "sheet");
  const box = el("div", "sheet-box");
  box.append(el("div", "sheet-hd", "Sync failed"));
  if (!e) {
    box.append(el("div", "sheet-sub",
      "No detail was captured for this one. It will be recorded next time."));
  } else {
    box.append(el("div", "sheet-sub",
      SYNC_CAUSE[e.code] || "Firestore rejected the write."));
    const lbl = el("div", "sheet-lbl", "Detail");
    const pre = el("div", "sync-detail");
    pre.textContent =
      `${e.where}\n${e.code ? e.code + "\n" : ""}${e.message}\n${new Date(e.at).toLocaleString()}`;
    box.append(lbl, pre);
  }
  box.append(el("div", "sheet-note",
    "Deliberations are safe either way: the engine keeps its own copy, and " +
    "this only affects reading them on your other devices."));

  const msg = el("div");
  const bar = el("div", "sheet-bar");
  const retry = el("button", "btn active", "Try again");
  const close = el("button", "btn", "Close");
  bar.append(retry, el("span", "qbar-spacer"), close);
  box.append(bar, msg);

  const done = () => sheet.remove();
  close.onclick = done;
  sheet.onclick = (ev) => { if (ev.target === sheet) done(); };
  retry.onclick = async () => {
    msg.className = "sheet-note";
    msg.textContent = "Retrying…";
    const r = await cloudBackfill();
    if (SYNC_ERR.last) {
      msg.className = "sheet-err";
      msg.textContent = `Still failing — ${SYNC_ERR.last.code || SYNC_ERR.last.message}.`;
    } else {
      msg.className = "sheet-ok";
      msg.textContent = r && r.pushed ? `Pushed ${r.pushed}.` : "Nothing left to push.";
      setTimeout(done, 900);
    }
  };

  sheet.append(box);
  document.body.append(sheet);
}

/* ══ CLOUD SYNC ════════════════════════════════════════════════════════════
   Every deliberation, on every device.

   MAGI's engine and its SQLite live on one PC, so without this a verdict is
   only readable where it was produced. Firestore carries the RESULTS; the
   engine stays where the Chrome profiles are.

   ── The write budget, which drove the whole shape ────────────────────────
   Firestore's free tier is 20k writes and 50k reads a day, shared with every
   other A1 program (see docs and workers2/README.md -- account 1 has already
   hit a Cloudflare cap once). So:

     · NOTHING is written while a run is in flight. A council run emits an SSE
       frame every few hundred ms per member; mirroring those would be
       thousands of writes for one question. One completed run = ONE body
       write plus one index update.
     · The index is a SINGLE document, not a collection query. Listing history
       from a collection costs one read PER RUN returned -- 30 reads every
       time the page opens. One index doc is one read, forever.
     · Exactly one listener, on that index doc, so a run finished on the PC
       appears on the phone without polling. Its cost is bounded by the write
       volume above, not by time.
     · Bodies are read ONLY when you open that specific run. Opening the
       History list reads nothing extra.

   Steady state for heavy use -- 30 runs in a day, read on three devices --
   is roughly 90 writes and a few hundred reads. Under half a percent.

   ── Layout ───────────────────────────────────────────────────────────────
     dashboards/magi                one index doc: compact rows, newest first
     dashboards/magi/runs/{id}      one body per run: answers, verdict, cards

   Both sit under the /dashboards/{doc=**} rule that already exists in
   firestore.rules, so no rules change is needed. */

const CLOUD = {
  ready: null,      // Promise<boolean> -- settles once, true if usable
  db: null,
  index: [],        // compact rows from the cloud
  unsub: null,
  pending: null,    // debounce handle for index writes
  enabled: (() => { try { return localStorage.getItem("magi.cloud") !== "0"; } catch { return true; } })(),
  blocked: false,   // auth could not complete -- see syncBlockedNote()
  tokenSeen: null,  // last API token seen in the cloud; null = not looked yet
  pruned: false,    // retention sweep already run this load -- see cloudPrune()
  folded: false,    // pre-maps pins/names carried over -- see cloudWatch()
  lease: null,      // who is draining the queue right now, if anyone
};

// Keep the index doc small and bounded. A row is ~120 bytes, so 300 rows is
// ~36KB against Firestore's 1 MiB document ceiling -- room to spare, and the
// bodies of older runs are never deleted, they just stop being listed.
const CLOUD_INDEX_MAX = 300;

/** Load Firebase and sign in. Lazy and once: the modules are ~200KB and a
 *  local-only user who never opens History should not pay for them. */
function cloudInit() {
  if (CLOUD.ready) return CLOUD.ready;
  if (!CLOUD.enabled) return (CLOUD.ready = Promise.resolve(false));
  /* Nothing is fetched before the profile is unlocked, and this is the line
     that makes the lock mean something. It used to be cosmetic by its own
     admission -- it stopped someone at the laptop READING, while the listener
     attached at boot regardless. That was fine when there was one person. With
     two it is not: Firestore's persistentLocalCache writes to IndexedDB, so a
     document read once stays on the device, and a locked profile whose index
     had already been fetched would be sitting in the cache of a machine its
     owner never unlocked. NOT memoised into CLOUD.ready -- returning a settled
     false here would make the refusal permanent for the session, so the first
     call after unlock has to be free to do the real thing. */
  if (!PROFILE.unlocked) return Promise.resolve(false);

  CLOUD.ready = (async () => {
    try {
      const V = "https://www.gstatic.com/firebasejs/12.12.0";
      const [{ initializeApp, getApps }, { getAuth, signInAnonymously, onAuthStateChanged },
             { initializeAppCheck, ReCaptchaV3Provider }, fs] = await Promise.all([
        import(`${V}/firebase-app.js`),
        import(`${V}/firebase-auth.js`),
        import(`${V}/firebase-app-check.js`),
        import(`${V}/firebase-firestore.js`),
      ]);
      CLOUD.fs = fs;

      const app = getApps().find((a) => a.name === "[DEFAULT]") || initializeApp({
        apiKey: "AIzaSyC2aKunOKj5WS8NpgZhpyMzOYecBr5t2_4",
        authDomain: "task-dashboard-d2b53.firebaseapp.com",
        projectId: "task-dashboard-d2b53",
        storageBucket: "task-dashboard-d2b53.firebasestorage.app",
        messagingSenderId: "982539604706",
        appId: "1:982539604706:web:e93da1aef499fcee2044bb",
      });
      try {
        initializeAppCheck(app, {
          provider: new ReCaptchaV3Provider("6LeUyAstAAAAAEciRypd1i4Akq6ueFUYfXLaLaUX"),
          isTokenAutoRefreshEnabled: true,
        });
      } catch (e) { console.warn("[magi] App Check:", e); }

      // The local cache is what makes an offline phone still show yesterday's
      // verdicts, and it serves repeat reads without touching the quota.
      CLOUD.db = fs.initializeFirestore(app, {
        localCache: fs.persistentLocalCache({ tabManager: fs.persistentSingleTabManager({}) }),
      });

      const auth = getAuth(app);
      const signedIn = await new Promise((res) => {
        let done = false;
        const settle = (v) => { if (!done) { done = true; res(v); } };
        onAuthStateChanged(auth, (u) => { if (u) settle(true); });
        signInAnonymously(auth).catch((e) => { console.warn("[magi] anon auth:", e); settle(false); });
        // Must ALWAYS settle: History awaits this, and a promise that merely
        // never resolves would leave the list spinning with no explanation.
        setTimeout(() => settle(false), 8000);
      });
      if (!signedIn) CLOUD.blocked = true;
      return signedIn;
    } catch (e) {
      CLOUD.blocked = true;
      console.warn("[magi] cloud init failed:", e);
      return false;
    }
  })();
  return CLOUD.ready;
}

/* LifeHub (LifeHub/lifehub.js) borrows this Firebase instead of starting its
   own. It has to: this page's Firestore is created on demand, with a
   persistent cache, and a default one made first by anyone else would make
   the initializeFirestore above throw. Called only when the launcher is used. */
window.LifeHubFirebase = () => cloudInit().then((ok) => (ok ? { db: CLOUD.db, fs: CLOUD.fs } : null));

/* The whole data split, and it is two functions. Tony reads dashboards/magi,
   which is where every deliberation he has ever run already lives; Veda reads
   dashboards/magi_veda, which starts empty. Both sit under the existing
   /dashboards/{doc=**} rule, so firestore.rules needs no change. */
const _indexDoc = () => CLOUD.fs.doc(CLOUD.db, "dashboards", prof().doc);
const _runDoc = (id) => CLOUD.fs.doc(CLOUD.db, "dashboards", prof().doc, "runs", id);

/* ── the API token, carried between your devices ───────────────────────────
   The token was the one thing sync did NOT carry, and it was the thing that
   made a phone useless: magi-link keys its records by the token's hash, so a
   browser without one cannot even ask where the engine is. The phone showed
   "Engine offline — no API token set" while everything else about it worked,
   and the only cure was typing a long random secret on a phone keyboard.

   It rides along in the index document, beside the history it gates access
   to. That is the same Firestore doc, the same rules, the same App Check and
   the same anonymous sign-in that already hold every deliberation -- and
   Keychain keeps real passwords in this project. Putting the token anywhere
   more guarded than the data it protects would be theatre.

   Writes are effectively free: one, on the day you first set the token, and
   one more whenever you rotate it. */
async function cloudFetchToken() {
  if (!CLOUD.enabled) return "";
  if (!(await cloudInit())) return "";
  try {
    const snap = await CLOUD.fs.getDoc(_indexDoc());
    const t = snap.exists() ? String(snap.data().token || "") : "";
    CLOUD.tokenSeen = t;
    if (t) saveToken(t);
    return t;
  } catch (e) { console.warn("[magi] token fetch:", e); return ""; }
}

/** Push the unit order. One tiny merge write, debounced with everything else.
 *
 *  The order is a preference, not a fact about the engine, so it belongs with
 *  the history it sits beside rather than in the engine's config: you reorder
 *  on a phone and the desk console follows, without the engine being involved
 *  at all. */
let _orderT = 0;
function cloudSaveUnitOrder() {
  if (!CLOUD.enabled) return;
  clearTimeout(_orderT);
  setSync("saving");
  // Debounced: dragging a chip across four positions fires four reorders, and
  // that is one preference, not four writes.
  _orderT = setTimeout(async () => {
    if (!(await cloudInit())) { setSync("off"); return; }
    try {
      await CLOUD.fs.setDoc(_indexDoc(), { unitOrder: S.unitOrder || [] }, { merge: true });
      setSync("saved");
    } catch (e) {
      setSync("error", _syncFail("saving the unit order", e));
      console.warn("[magi] unit order:", e);
    }
  }, 900);
}

/* ── the engine registry, across your devices ──────────────────────────────
   One more field on the document that already has a listener attached, so a
   laptop added at the desk reaches the phone for ZERO extra reads and no
   second listener. That is the whole reason it lives here rather than in a
   document of its own: a separate doc would cost a read on every page load,
   permanently, for a few hundred bytes.

   `lastSeen` is deliberately NOT synced. It is what THIS device last managed
   to reach, and syncing it would have a phone claim the laptop was up
   because the desktop could see it a minute ago. */
let _engCloudT = 0;
function cloudSaveEngines() {
  if (!CLOUD.enabled) return;
  clearTimeout(_engCloudT);
  setSync("saving");
  _engCloudT = setTimeout(async () => {
    if (!(await cloudInit())) { setSync("off"); return; }
    try {
      const rows = ENG.list
        .filter((e) => e.id && e.token)
        .map((e) => ({ id: e.id, label: e.label || "", token: e.token, port: e.port || 8000 }));
      await CLOUD.fs.setDoc(_indexDoc(), { engines: rows }, { merge: true });
      setSync("saved");
    } catch (e) {
      setSync("error", _syncFail("saving your engines", e));
      console.warn("[magi] engines:", e);
    }
  }, 900);
}

/** Fold what the cloud knows into what this device knows. Union, not
 *  replace: an engine only this device has reached is still an engine. */
function engMerge(rows) {
  if (!Array.isArray(rows)) return false;
  let changed = false;
  for (const r of rows) {
    if (!r || !r.id || !r.token) continue;
    let e = engFind(r.id);
    if (!e) {
      // Absorb the unnamed legacy entry rather than sitting beside it.
      e = ENG.list.find((x) => !x.id && x.token === r.token);
      if (e) e.id = r.id;
      else { e = { id: r.id, token: r.token, label: "", port: 8000 }; ENG.list.push(e); }
      changed = true;
    }
    if (r.token && e.token !== r.token) { e.token = r.token; changed = true; }
    if (r.port && e.port !== r.port) { e.port = r.port; changed = true; }
    if (r.label && e.label !== r.label) { e.label = r.label; changed = true; }
  }
  if (changed) engSave({ sync: false });
  return changed;
}

/** Share a token this browser has. Guarded on the last value seen from the
 *  cloud, so a page that opens twice a day does not write twice a day.
 *
 *  `onlyIfEmpty` matters more than it looks. A hosted page sitting beside the
 *  PC reaches the engine over 127.0.0.1, which needs NO token -- so whatever
 *  is in that browser's localStorage was never checked against anything and
 *  may be a rotation old. Letting it overwrite freely would mean the desk
 *  machine could quietly replace a working token the phone had just proved
 *  over the tunnel, and break the phone. Unproven tokens therefore only ever
 *  fill a gap; proven ones (a live tunnel, or one just typed in) replace. */
async function cloudPublishToken(tok, onlyIfEmpty) {
  if (!tok || !CLOUD.enabled) return;
  if (CLOUD.tokenSeen === tok) return;
  if (!(await cloudInit())) return;
  try {
    if (CLOUD.tokenSeen == null) {
      const snap = await CLOUD.fs.getDoc(_indexDoc());
      CLOUD.tokenSeen = snap.exists() ? String(snap.data().token || "") : "";
      if (CLOUD.tokenSeen === tok) return;
    }
    if (onlyIfEmpty && CLOUD.tokenSeen) return;
    await CLOUD.fs.setDoc(_indexDoc(), { token: tok }, { merge: true });
    CLOUD.tokenSeen = tok;
  } catch (e) { console.warn("[magi] token publish:", e); }
}

/** Merge cloud rows into the History list, newest first, deduped by id.
 *
 *  Local rows win on conflict: the PC has the authoritative SQLite copy and
 *  the cloud row is a summary of it. */
/* ══ QUEUE ═════════════════════════════════════════════════════════════════
   A list of prompts to put to the council one at a time, each with its own
   units and its own Claude model.

   ── Where it lives ───────────────────────────────────────────────────────
   As a `queue` field on the SAME index document as everything else, which is
   the cheapest possible sync: that document already has a live listener, so
   another device's queue arrives with ZERO extra reads, and an edit here is
   one debounced write to one field. A separate collection would have meant a
   second listener and a read per item per device.

   ── What is NOT synced ───────────────────────────────────────────────────
   Attachment BYTES. A queued prompt carries its files' names, sizes and types
   so every device can see what is attached, while the files themselves stay
   on the device that picked them -- images in Firestore would be the one
   thing here big enough to matter. A device that does not hold the bytes says
   so on the row and runs the prompt without them rather than silently
   dropping them.

   ── One runner, never two ────────────────────────────────────────────────
   Two devices draining one queue would interleave prompts into one engine, so
   draining is leased: a device claims `queueLease`, refreshes it while it
   works, and releases it at the end. A stale lease (nothing refreshed it for
   LEASE_STALE_MS) is fair game, so a closed laptop cannot freeze the queue
   for ever. Within one page a generation counter does the same job for the
   Run/Pause button, which is Veda's fix for the same bug in Claude Queue:
   pressing Pause then Run quickly would otherwise start a second drain loop
   against the same list.
   ════════════════════════════════════════════════════════════════════════ */

const MAX_QUEUE = 100;
/* Fractional ordering, from Claude Queue: new items land on multiples of
   1000, so an insert or a move between two rows is one item's own number
   changing and never a renumbering of its siblings. In a document that syncs
   as one field that keeps a move to a single small diff. */
const QUEUE_STEP = 1000;
const LEASE_STALE_MS = 90000;
const LEASE_REFRESH_MS = 30000;

/** This browser, named well enough to say where a queue item came from. */
const DEVICE_NAME = (() => {
  try {
    const ua = navigator.userAgent;
    if (/iPhone|iPad/i.test(ua)) return "iPhone";
    if (/Android/i.test(ua)) return "Android";
    if (/Mac/i.test(ua)) return "Mac";
    if (/Windows/i.test(ua)) return "PC";
  } catch {}
  return "device";
})();

/** A per-tab id, so a lease can tell "me" from "my other window". */
const DEVICE_ID = (() => {
  try {
    let v = localStorage.getItem("magi.device");
    if (!v) {
      v = `${DEVICE_NAME}-${Math.random().toString(36).slice(2, 8)}`;
      localStorage.setItem("magi.device", v);
    }
    return v;
  } catch { return `${DEVICE_NAME}-temp`; }
})();

/* The actual File objects for queued attachments, by item id.
   Deliberately NOT in S.queue: S.queue is what gets serialised to Firestore,
   and a File cannot be and must not be. */
const QUEUE_FILES = new Map();

/** Told the run id the moment a run starts, so the queue row can record it
 *  before the run finishes. Set around a call and cleared after. */
let onRunStart = null;

/** Generation counter: an older drain loop exits when it sees a newer one. */
let _queueGen = 0;
let _leaseTimer = 0;

const queueSorted = () =>
  [...S.queue].sort((a, b) => (a.order || 0) - (b.order || 0));

const queuePending = () => queueSorted().filter((it) => it.status === "queued");

function queueNextOrder() {
  const last = queueSorted()[S.queue.length - 1];
  return (last ? (last.order || 0) : 0) + QUEUE_STEP;
}

/** Add what is in the composer, with the units currently ticked. */
function queueAdd() {
  const q = $("composer").value.trim();
  if (!q) return;
  if (S.queue.length >= MAX_QUEUE) {
    setErr("refineError", `The queue holds ${MAX_QUEUE} prompts.`);
    return;
  }
  if (!S.selected.size) {
    setErr("refineError", "Tick at least one unit for this prompt.");
    return;
  }
  const id = `q${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;
  const files = S.attachments.map((a) => a.file);
  if (files.length) QUEUE_FILES.set(id, files);
  S.queue.push({
    id,
    q,
    units: [...S.selected],
    // Names, sizes and types travel; the bytes do not. This is what another
    // device shows instead of a file it cannot have.
    atts: files.map((f) => ({ n: f.name, s: f.size, t: f.type || "" })),
    status: "queued",
    order: queueNextOrder(),
    dev: DEVICE_NAME,
    runId: null,
    err: null,
  });
  // The composer is now empty because its contents are IN the queue -- a
  // prompt left behind in the box after queueing it is the shape of a
  // double-send.
  setQuestion("");
  S.attachments = [];
  renderChips();
  setErr("refineError", null);
  queueChanged();
}
/* Asked first, in MAGI's own sheet -- never a browser dialog.
 *
 *  A queued prompt is typed work, and on a phone the X sits a thumb's width
 *  from the arrows that reorder the row. `silent` exists for the one caller
 *  that has already asked (Clear finished, which asks once for the lot rather
 *  than once per row).
 */
async function queueRemove(id, silent) {
  const it = S.queue.find((x) => x.id === id);
  if (!it) return;
  if (!silent) {
    const shown = String(it.q || "");
    const ok = await uiConfirmMagi(
      "Remove this prompt?",
      "“" + (shown.length > 120 ? shown.slice(0, 120) + "…" : shown) + "”"
      + (it.status === "done" || it.status === "failed"
          ? "\n\nThe deliberation it produced stays in History."
          : "\n\nIt has not run yet, so nothing else is lost."),
      "Remove");
    if (!ok) return;
  }
  S.queue = S.queue.filter((x) => x.id !== id);
  QUEUE_FILES.delete(id);
  queueChanged();
}

/* Show what a running prompt is doing.
 *
 *  The deliberation runs in the ENGINE, so it carries on across a refresh --
 *  but the console's grid is built by the tab that started it, and a reload
 *  left the units invisible with the run still going. Attaching to the
 *  stream brings the whole thing back: the engine replays every unit's state
 *  as its first frame.
 *
 *  When the queue is draining in THIS tab there is nothing to attach to --
 *  the grid is already live -- so that case just puts it back on screen.
 */
async function queueWatch(id) {
  const it = S.queue.find((x) => x.id === id);
  if (!it || !it.runId) return;
  if (S.live && S.live.runId === it.runId) { backToLive(); return; }

  const outcome = await watchRun(it.runId, it.q);
  const cur = S.queue.find((x) => x.id === id);
  if (!cur || !outcome) return;
  // Attaching means this tab now sees the end of the run, so the row is
  // finished here even though another tab started it.
  if (cur.status === "running") {
    cur.status = outcome.ok ? "done" : "failed";
    if (!outcome.ok) {
      cur.err = outcome.error
        || `${outcome.responded || 0} of ${outcome.total || 0} units answered`;
    }
    queueChanged();
  }
}

/* Run failed prompts again.
 *
 *  A prompt fails for reasons that usually pass -- you halted it, a unit
 *  timed out, a session had lapsed -- and re-typing it to try again throws
 *  away its units and files. Retrying puts the row back as it was queued and
 *  moves it to the FRONT, because a retry is something you want now rather
 *  than after everything else in the list; and it starts the queue if the
 *  queue was idle, because pressing Retry and then having to find Run as well
 *  is the same request made twice.
 */
function queueRetry(ids) {
  const want = new Set(ids);
  const rows = S.queue.filter((it) => want.has(it.id) && it.status === "failed");
  if (!rows.length) return;
  const front = Math.min(0, ...queuePending().map((it) => it.order || 0));
  rows
    .sort((a, b) => (a.order || 0) - (b.order || 0))
    .forEach((it, k) => {
      it.status = "queued";
      it.err = null;
      it.runId = null;
      it.resumable = false;
      // Kept in their original relative order, all ahead of what was waiting.
      it.order = front - QUEUE_STEP * (rows.length - k);
    });
  queueChanged();
  if (!S.queueRunning && online()) queueStart();
}

const queueFailed = () => S.queue.filter((it) => it.status === "failed");

/* Edit a queued prompt where it lives, in its own panel.
 *
 *  It used to move the prompt back into the composer and drop the row, which
 *  is wrong whenever the composer is busy: with a prompt running, the pencil
 *  took your queued text, put it behind a DELIBERATING button you could not
 *  press, and left the row gone. Editing something in a list should not
 *  depend on what the rest of the screen is doing.
 *
 *  Everything the composer can do to a prompt, this can do to a queued one:
 *  change the text, change who is asked, add and remove attachments, and
 *  Refine. Nothing is written back until Save, so Cancel really does leave
 *  the row as it was.
 */
function queueEdit(id) {
  const it = S.queue.find((x) => x.id === id);
  if (!it || it.status === "running") return;

  const known = new Set(knownUnits().map((p) => p.id));
  // Worked on as COPIES. A half-finished edit must not reach the other
  // devices, and Cancel has to be able to mean cancel.
  let text = it.q;
  let units = new Set((it.units || []).filter((u) => known.has(u)));
  let files = [...(QUEUE_FILES.get(id) || [])];
  // Names carried for the attachments this device does not hold the bytes of.
  let carried = (it.atts || []).filter(
    (a) => !files.some((f) => f.name === a.n));
  let refining = false, preRefine = null;

  const sheet = el("div", "sheet");
  const box = el("div", "sheet-box sheet-wide qedit");
  box.append(el("div", "sheet-hd", "Edit prompt"));

  const taWrap = el("div", "qedit-textwrap");
  const ta = el("textarea", "sheet-in qedit-text");
  ta.value = text;
  ta.rows = 6;
  ta.oninput = () => { text = ta.value; sync(); };
  const taGrip = gripButton();
  taWrap.append(ta, taGrip);
  box.append(taWrap);

  const err = el("div", "qbar-error");
  err.hidden = true;
  box.append(err);

  // ── who gets asked ───────────────────────────────────────────────────────
  const unitLbl = el("div", "sheet-lbl qedit-lbl");
  unitLbl.append(el("span", null, "Units"));
  const unitCount = el("span", "qedit-count");
  unitLbl.append(unitCount);
  box.append(unitLbl);
  const chips = el("div", "qedit-units");
  const drawChips = () => {
    chips.textContent = "";
    for (const p of knownUnits()) {
      const on = units.has(p.id);
      const b = el("button", `chip ${on ? "on" : ""}`);
      b.type = "button";
      // Filled exactly as the composer's row fills them -- the colour IS
      // the ticked state there, and a chip that reads as ticked in one
      // place and unticked in another is worse than no colour at all.
      if (on) { b.style.background = p.accent; b.style.borderColor = p.accent; }
      else { b.style.color = p.accent; b.style.borderColor = p.accent + "66"; }
      b.append(el("span", "chip-name", p.display_name),
               el("span", "chip-unit", (UNIT[p.id] || "").split("\u00b7")[0]));
      b.onclick = () => {
        on ? units.delete(p.id) : units.add(p.id);
        drawChips();
        sync();
      };
      chips.append(b);
    }
  };
  drawChips();
  box.append(chips);

  // ── attachments ──────────────────────────────────────────────────────────
  box.append(el("div", "sheet-lbl", "Attachments"));
  const atts = el("div", "qedit-atts");
  const fileIn = el("input");
  fileIn.type = "file";
  fileIn.multiple = true;
  fileIn.hidden = true;
  fileIn.onchange = (e) => {
    for (const f of e.target.files || []) {
      if (files.length + carried.length >= MAX_ATTACHMENTS) {
        setErrEl(`Only ${MAX_ATTACHMENTS} attachments per prompt.`);
        break;
      }
      if (f.size > MAX_ATTACHMENT_BYTES) {
        setErrEl(`${f.name} exceeds the 20MB limit.`);
        continue;
      }
      files.push(f);
    }
    e.target.value = "";
    drawAtts();
    sync();
  };
  const drawAtts = () => {
    atts.textContent = "";
    for (const f of files) {
      const c = el("span", "qedit-att");
      c.append(el("span", "qedit-att-n", f.name),
               el("span", "qedit-att-s", fmtBytes(f.size)));
      const x = el("button", "qedit-att-x", "\u2715");
      x.type = "button";
      x.title = "Remove";
      x.onclick = () => { files = files.filter((g) => g !== f); drawAtts(); sync(); };
      c.append(x);
      atts.append(c);
    }
    // Added on another device: the name is all this one has, and it says so
    // rather than showing a file it cannot send.
    for (const a of carried) {
      const c = el("span", "qedit-att elsewhere");
      c.append(el("span", "qedit-att-n", a.n),
               el("span", "qedit-att-s", `on the ${it.dev || "other device"}`));
      const x = el("button", "qedit-att-x", "\u2715");
      x.type = "button";
      x.title = "Remove";
      x.onclick = () => { carried = carried.filter((b) => b !== a); drawAtts(); sync(); };
      c.append(x);
      atts.append(c);
    }
    const add = el("button", "qedit-add", "+ Add files");
    add.type = "button";
    add.onclick = () => fileIn.click();
    atts.append(add);
  };
  drawAtts();
  box.append(atts, fileIn);

  // Dropped files land here exactly as they do on the composer: anywhere on
  // the panel, with the panel lighting up so it is obvious where they go.
  const takeFiles = (list) => {
    for (const f of list || []) {
      if (files.length + carried.length >= MAX_ATTACHMENTS) {
        setErrEl(`Only ${MAX_ATTACHMENTS} attachments per prompt.`);
        break;
      }
      if (f.size > MAX_ATTACHMENT_BYTES) {
        setErrEl(`${f.name} exceeds the 20MB limit.`);
        continue;
      }
      files.push(f);
    }
    drawAtts();
    sync();
  };
  box.addEventListener("dragover", (e) => {
    if (![...(e.dataTransfer?.types || [])].includes("Files")) return;
    e.preventDefault();
    box.classList.add("drag");
  });
  box.addEventListener("dragleave", (e) => {
    if (!box.contains(e.relatedTarget)) box.classList.remove("drag");
  });
  box.addEventListener("drop", (e) => {
    if (!e.dataTransfer?.files?.length) return;
    e.preventDefault();
    box.classList.remove("drag");
    takeFiles(e.dataTransfer.files);
  });
  ta.addEventListener("paste", (e) => {
    const pasted = Array.from(e.clipboardData?.files || []);
    if (pasted.length) takeFiles(pasted);
  });

  // ── the bar ──────────────────────────────────────────────────────────────
  const bar = el("div", "sheet-bar qedit-bar");
  const save = el("button", "btn active", "Save");
  save.title = "Save this prompt back to the queue   (Ctrl+Enter)";
  const refine = el("button", "btn", "Refine");
  refine.title = "Have a unit rewrite this into a sharper prompt";
  const undo = el("button", "btn", "Undo");
  undo.title = "Put back what you wrote before Refine";
  const cancel = el("button", "btn", "Cancel");
  undo.hidden = true;
  bar.append(save, refine, undo, el("span", "qbar-spacer"), cancel);
  box.append(bar);

  function setErrEl(msg) {
    err.textContent = msg || "";
    err.hidden = !msg;
  }

  function sync() {
    save.disabled = !text.trim() || units.size === 0;
    refine.disabled = refining || !text.trim() || !online();
    refine.textContent = refining ? "Refining\u2026" : "Refine";
    // Said out loud, because a Save that is greyed for a reason you cannot
    // see is indistinguishable from a broken button.
    unitCount.textContent = units.size
      ? `${units.size} of ${knownUnits().length}`
      : "none \u2014 pick at least one";
    unitCount.classList.toggle("empty", units.size === 0);
  }

  refine.onclick = async () => {
    if (refining || !online()) return;
    refining = true; setErrEl(null); sync();
    try {
      const form = new FormData();
      form.append("question", text);
      // The row's own units, not the ticked set: this prompt is the one being
      // rewritten, and an unticked unit must not be driven for it.
      form.append("providers", [...units].join(","));
      const r = await fetch(`${link.api}/api/refine`,
                            authed({ method: "POST", body: form }));
      if (!r.ok) {
        const d = await r.json().catch(() => null);
        throw new Error((d && d.detail) || `Refine failed (${r.status})`);
      }
      const { refined } = await r.json();
      if (preRefine === null) preRefine = text;
      text = refined;
      ta.value = refined;
      undo.hidden = false;
    } catch (e) {
      setErrEl((e && e.message) || "Refine failed.");
    }
    refining = false;
    sync();
  };

  undo.onclick = () => {
    if (preRefine === null) return;
    text = preRefine;
    ta.value = text;
    preRefine = null;
    undo.hidden = true;
    sync();
  };

  const close = () => sheet.remove();
  cancel.onclick = close;
  dismissOnBackdrop(sheet, close);
  ta.onkeydown = (e) => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); save.click(); }
  };

  save.onclick = () => {
    const cur = S.queue.find((x) => x.id === id);
    if (!cur) return close();
    cur.q = text.trim();
    cur.units = [...units];
    if (files.length) QUEUE_FILES.set(id, files); else QUEUE_FILES.delete(id);
    cur.atts = [
      ...files.map((f) => ({ n: f.name, s: f.size, t: f.type || "" })),
      ...carried,
    ];
    // Edited here, so the row belongs to this device now as far as its files
    // are concerned.
    if (files.length) cur.dev = DEVICE_NAME;
    close();
    queueChanged();
  };

  sheet.append(box);
  document.body.append(sheet);
  attachGrip(ta, taGrip, null, null);
  sync();
  ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);
}
/** Move one row, by changing only its own order number. */
function queueMove(id, dir) {
  const rows = queueSorted();
  const i = rows.findIndex((x) => x.id === id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= rows.length) return;
  const it = rows[i], other = rows[j];
  const beyond = rows[j + dir];
  it.order = beyond
    ? ((other.order || 0) + (beyond.order || 0)) / 2
    : (other.order || 0) + dir * QUEUE_STEP;
  queueChanged();
}

async function queueClearDone() {
  const going = S.queue.filter(
    (it) => it.status !== "queued" && it.status !== "running");
  if (!going.length) return;
  const done = going.filter((it) => it.status === "done").length;
  const failed = going.length - done;
  const ok = await uiConfirmMagi(
    `Clear ${going.length} finished prompt${going.length === 1 ? "" : "s"}?`,
    [done ? `${done} finished` : "", failed ? `${failed} failed` : ""]
      .filter(Boolean).join(" and ")
    + " will leave the queue.\n\nThe deliberations they produced stay in "
    + "History; only the rows go.",
    "Clear");
  if (!ok) return;
  for (const it of going) QUEUE_FILES.delete(it.id);
  S.queue = S.queue.filter((it) => it.status === "queued" || it.status === "running");
  queueChanged();
}

/* Kept on this device as well as in the cloud.
 *
 *  Not belt and braces: the console SERVED BY THE ENGINE (127.0.0.1) can
 *  never sign in to Firebase -- App Check only issues tokens on a registered
 *  domain -- and that is exactly the page you would sit at to run a queue.
 *  Without this the list would live in memory there and be gone on the next
 *  refresh. Attachments are still not stored: File objects are not JSON, and
 *  the names in `atts` are what a reload has to work from.
 */
const QUEUE_KEY = lsKey("queue");

function saveQueueLocal() {
  try { localStorage.setItem(QUEUE_KEY, JSON.stringify(queueForCloud())); } catch {}
}

function loadQueueLocal() {
  try {
    const raw = JSON.parse(localStorage.getItem(QUEUE_KEY) || "[]");
    if (Array.isArray(raw)) {
      // A prompt that was mid-run when the page closed is not running HERE
      // any more -- but if it got as far as an id, the engine may still be
      // running it, and queueResume reconnects rather than asking the council
      // the same question twice.
      S.queue = raw.map((it) => ({
        ...it,
        resumable: it.status === "running" && !!it.runId,
        status: it.status === "running" ? "queued" : it.status,
      }));
    }
  } catch {}
}

/* A prompt that was mid-run when the page reloaded.
 *
 *  loadQueueLocal turns a stale "running" row back into "queued" -- right for
 *  a row that never got an id, wrong for one that did, because that run is
 *  still going in the engine and re-running it would ask the council the same
 *  question twice. This reconnects to it instead, shows it, and records how
 *  it ends.
 *
 *  Deliberately not automatic beyond that: the rest of the queue waits for
 *  Run, because a page that starts deliberations by itself on load is a page
 *  that spends your accounts while you are reading something else.
 */
async function queueResume() {
  if (!online()) return;
  const live = S.queue.find((it) => it.runId && (it.status === "running"
    || it.status === "queued" && it.resumable));
  if (!live) return;
  live.status = "running";
  queueChanged();
  await queueWatch(live.id);
}

/** Every local change goes through here: redraw, then save, then sync. */
function queueChanged() {
  renderQueue();
  updateEnabled();
  saveQueueLocal();
  cloudSaveQueue();
}

/* ── the runner ───────────────────────────────────────────────────────────*/

/** Anything left marked running while nothing is running: a tab that closed
 *  mid-prompt. Counted as startable, or the queue is stuck on a row that no
 *  longer has anything behind it. */
const queueStuck = () =>
  !S.queueRunning && S.queue.some((it) => it.status === "running");

async function queueStart() {
  if (S.queueRunning) return;
  if (!queuePending().length && !queueStuck()) return;
  if (!online()) {
    setErr("refineError", "The engine device has to be awake to run the queue.");
    return;
  }
  if (!(await leaseClaim())) return;
  // Nothing can be running now: this page is not running it, and holding the
  // lease means no other device is either. A row still marked running was
  // left there by a tab that closed mid-prompt, and it has to be startable
  // again or the queue is stuck on a row nothing will ever finish.
  let orphans = 0;
  for (const it of S.queue) {
    if (it.status === "running") { it.status = "queued"; orphans++; }
  }
  if (orphans) queueChanged();
  S.queueRunning = true;
  const gen = ++_queueGen;
  renderQueue();
  _leaseTimer = setInterval(leaseRefresh, LEASE_REFRESH_MS);
  try {
    await queueDrain(gen);
  } finally {
    if (gen === _queueGen) {
      S.queueRunning = false;
      clearInterval(_leaseTimer);
      await leaseRelease();
      renderQueue();
      updateEnabled();
    }
  }
}

function queueStop() {
  // Bumping the generation is what actually stops it: the loop rechecks
  // after every await and a superseded loop exits without touching anything.
  _queueGen++;
  S.queueRunning = false;
  clearInterval(_leaseTimer);
  leaseRelease();
  renderQueue();
  updateEnabled();
}

async function queueDrain(gen) {
  for (;;) {
    if (gen !== _queueGen) return;              // paused, or superseded
    const it = queuePending()[0];
    if (!it) return;
    if (!online()) {
      setErr("refineError", "Lost the engine; the queue is holding.");
      return;
    }

    it.status = "running";
    it.err = null;
    queueChanged();

    const files = QUEUE_FILES.get(it.id) || [];
    // An item added on another device has its names but not its bytes. Said
    // out loud on the row rather than quietly running a prompt that refers to
    // files the council was never given.
    const missing = (it.atts || []).length && !files.length;

    let outcome = null;
    try {
      // Recorded the moment the engine hands back an id, not when the run
      // ends: a refresh mid-prompt can then find the run still going instead
      // of leaving a row that says "running" with nothing to point at.
      onRunStart = (id) => { it.runId = id; queueChanged(); };
      outcome = await runOne({ question: it.q, units: it.units, files });
    } catch (e) {
      outcome = { ok: false, error: (e && e.message) || "the run failed" };
    } finally {
      onRunStart = null;
    }
    // Recorded BEFORE the generation is rechecked. Returning here left the
    // row stuck on "running" for ever: it then counted as neither waiting nor
    // finished, so Run queue had nothing to start and sat greyed out with a
    // prompt that had actually finished. Pause means "stop after this one",
    // which only makes sense if this one is written down.
    if (outcome && outcome.runId) {
      it.runId = outcome.runId;
      it.status = outcome.ok ? "done" : "failed";
      if (!outcome.ok) {
        it.err = outcome.error
          || `${outcome.responded || 0} of ${outcome.total || 0} units answered`;
      }
      if (missing) {
        it.err = [it.err, `attachments stayed on the ${it.dev}`]
          .filter(Boolean).join(" \u00b7 ");
      }
    } else {
      it.status = "failed";
      it.err = (outcome && outcome.error) || "could not start";
    }
    queueChanged();
    if (gen !== _queueGen) return;              // paused: stop after this one

    // A rate limit is the one failure worth stopping for: the next prompt
    // would hit the same wall, and a queue that empties itself into a wall
    // has thrown away the whole list. Everything else is per-prompt, so the
    // queue carries on -- these are independent questions, not steps.
    if (queueHitLimit(outcome)) {
      setErr("refineError",
             "Stopped: the council is rate limited. Resume when it resets.");
      return;
    }
  }
}

/** Did every unit that spoke say "rate limited"? */
function queueHitLimit(outcome) {
  const answers = (outcome && outcome.answers) || [];
  if (!answers.length) return false;
  const limited = answers.filter((a) => a.failure === "FailureKind.RATE_LIMITED"
                                     || /rate.?limit/i.test(a.failure || ""));
  return limited.length > 0 && limited.length === answers.length;
}

/* ── the lease ────────────────────────────────────────────────────────────*/

async function leaseClaim() {
  if (!CLOUD.enabled) return true;             // local-only: nothing to race
  if (!(await cloudInit())) return true;
  const held = CLOUD.lease;
  if (held && held.device !== DEVICE_ID
      && Date.now() - (held.at || 0) < LEASE_STALE_MS) {
    setErr("refineError", `The queue is already running on ${held.name || "another device"}.`);
    return false;
  }
  await leaseWrite({ device: DEVICE_ID, name: DEVICE_NAME, at: Date.now() });
  return true;
}

const leaseRefresh = () =>
  leaseWrite({ device: DEVICE_ID, name: DEVICE_NAME, at: Date.now() });

const leaseRelease = () => leaseWrite(null);

async function leaseWrite(v) {
  if (!CLOUD.enabled || !(await cloudInit())) return;
  try {
    await CLOUD.fs.setDoc(_indexDoc(), { queueLease: v },
                          { mergeFields: ["queueLease"] });
  } catch {}
}

/* ── the sync ─────────────────────────────────────────────────────────────*/

let _queueT = 0;
/** See _marksDirty: an edit in flight is not overwritten by an older copy. */
let _queueDirty = false;

function cloudSaveQueue() {
  if (!CLOUD.enabled) return;
  _queueDirty = true;
  clearTimeout(_queueT);
  setSync("saving");
  // 700ms: long enough that typing a model choice twice is one write, short
  // enough that a queue added on the phone is on the PC before you look up.
  _queueT = setTimeout(async () => {
    if (!(await cloudInit())) { setSync("off"); return; }
    try {
      await CLOUD.fs.setDoc(_indexDoc(), { queue: queueForCloud() },
                            { mergeFields: ["queue"] });
      _queueDirty = false;
      setSync("saved");
    } catch (e) {
      setSync("error", _syncFail("saving the queue", e));
    }
  }, 700);
}

/** Only the fields worth carrying. Firestore rejects undefined outright, and
 *  the local-only suggestion fields would be stale everywhere else anyway. */
const queueForCloud = () => queueSorted().map((it) => ({
  id: it.id,
  q: it.q,
  units: it.units || [],
  atts: (it.atts || []).map((a) => ({ n: a.n, s: a.s || 0, t: a.t || "" })),
  status: it.status || "queued",
  order: it.order || 0,
  dev: it.dev || "",
  runId: it.runId || null,
  err: it.err || null,
}));

/** Apply an incoming queue. Returns true when anything actually changed. */
function queueFromCloud(rows) {
  if (!Array.isArray(rows)) return false;
  const mine = JSON.stringify(queueForCloud());
  const theirs = JSON.stringify(rows.map((it) => ({
    id: it.id, q: it.q, units: it.units || [],
    atts: (it.atts || []).map((a) => ({ n: a.n, s: a.s || 0, t: a.t || "" })),
    status: it.status || "queued", order: it.order || 0, dev: it.dev || "",
    runId: it.runId || null, err: it.err || null,
  })));
  if (mine === theirs) return false;
  S.queue = rows.map((it) => ({ ...it }));
  return true;
}

/** The queue, drawn. */
function renderQueue() {
  const drawer = $("queueDrawer");
  if (!drawer) return;
  const rows = queueSorted();
  // Shown only where it can be acted on: the council screen, and only when
  // there is something in it.
  show(drawer, rows.length > 0 && S.view === "council" && !(S.studio && S.studio.active));

  const pending = queuePending().length;
  const count = $("queueCount");
  count.textContent = rows.length
    ? `${pending} waiting${rows.length - pending ? ` \u00b7 ${rows.length - pending} finished` : ""}`
    : "";

  const runBtn = $("queueRunBtn");
  runBtn.textContent = S.queueRunning ? "Pause" : "Run queue";
  runBtn.disabled = !S.queueRunning
    && ((!pending && !queueStuck()) || !online());
  runBtn.title = S.queueRunning
    ? "Stop after the prompt that is running"
    : !online() ? "The engine device has to be awake"
    : (!pending && !queueStuck()) ? "Nothing is waiting — add a prompt to the queue"
    : "Put each prompt to the council in turn";
  runBtn.onclick = () => (S.queueRunning ? queueStop() : queueStart());

  // Retry all: offered once there is more than one to retry. With one, the
  // row's own button is right next to it and a second copy is clutter.
  const failed = queueFailed();
  const retryAll = $("queueRetryBtn");
  show(retryAll, failed.length > 1);
  retryAll.textContent = `Retry ${failed.length} failed`;
  retryAll.title = "Put every failed prompt back at the front of the queue and run them";
  retryAll.onclick = () => queueRetry(failed.map((it) => it.id));

  const clearBtn = $("queueClearBtn");
  const finished = rows.length - pending;
  show(clearBtn, finished > 0);
  clearBtn.onclick = queueClearDone;

  const box = $("queueRows");
  box.textContent = "";
  for (const it of rows) {
    const row = el("div", `q-row ${it.status}`);
    const main = el("div", "q-main");
    main.append(el("div", "q-text", it.q));

    const meta = el("div", "q-meta");
    meta.append(el("span", `q-state ${it.status}`, it.status));

    // Who is being asked, as colour rather than seven names.
    const units = el("span", "q-units");
    for (const id of it.units || []) {
      const dot = el("span", "q-unit");
      dot.style.background = unitAccent(id);
      dot.title = unitName(id);
      units.append(dot);
    }
    if ((it.units || []).length) {
      meta.append(units, el("span", "", `${it.units.length} unit${it.units.length === 1 ? "" : "s"}`));
    }

    // Attachments: names always, bytes only where they were added.
    const atts = it.atts || [];
    if (atts.length) {
      const here = (QUEUE_FILES.get(it.id) || []).length > 0;
      const names = atts.map((a) => a.n).join(", ");
      const att = el("span", "q-att",
        `\u{1F4C4} ${atts.length} file${atts.length === 1 ? "" : "s"}`);
      att.title = here
        ? names
        : `${names}\n\nAdded on the ${it.dev || "other device"}; the files stay there, so this prompt runs without them.`;
      if (!here) att.textContent += ` (on the ${it.dev || "other device"})`;
      meta.append(att);
    }

    if (it.err) meta.append(el("span", "q-err", it.err));
    main.append(meta);
    row.append(main);

    const acts = el("div", "q-acts");
    const up = el("button", "q-act", "\u2191");
    up.type = "button"; up.title = "Move up";
    up.disabled = it.status !== "queued" || rows.indexOf(it) === 0;
    up.onclick = () => queueMove(it.id, -1);
    const down = el("button", "q-act", "\u2193");
    down.type = "button"; down.title = "Move down";
    down.disabled = it.status !== "queued" || rows.indexOf(it) === rows.length - 1;
    down.onclick = () => queueMove(it.id, 1);
    const edit = el("button", "q-act", "\u270E");
    edit.type = "button"; edit.title = "Edit this prompt";
    edit.disabled = it.status === "running";
    edit.onclick = () => queueEdit(it.id);
    // Running: watch it happen. Finished: open what it produced. One slot,
    // because they are the same question asked at two different times.
    const live = it.status === "running";
    const open = el("button", `q-act ${live ? "watching" : ""}`,
                    live ? "\u25C9" : "\u2197");
    open.type = "button";
    open.title = live
      ? "Watch this deliberation as it happens"
      : "Open the deliberation this produced";
    open.disabled = !it.runId;
    open.onclick = () => (live ? queueWatch(it.id) : openRun(it.runId));
    // Only on a failed row, and before Open: it is the thing you came to the
    // row to do.
    let retry = null;
    if (it.status === "failed") {
      retry = el("button", "q-act retry", "\u21BB");
      retry.type = "button";
      // Never disabled: putting it back in the queue syncs from any device,
      // and whichever device runs the queue picks it up.
      retry.title = "Run this prompt again";
      retry.onclick = () => queueRetry([it.id]);
    }
    const del = el("button", "q-act danger", "\u2715");
    del.type = "button"; del.title = "Remove from the queue";
    del.disabled = it.status === "running";
    del.onclick = () => queueRemove(it.id);
    acts.append(up, down, edit);
    if (retry) acts.append(retry);
    acts.append(open, del);
    row.append(acts);
    box.append(row);
  }
}

/** Put the in-flight run back on screen, with everything it did meanwhile.
 *
 *  Not a re-fetch: the live panels have been updating in the background the
 *  whole time (see S.live), so this is simply pointing the screen back at
 *  them.
 */
function backToLive() {
  const live = S.live;
  if (!live) return;
  S.panels = live.panels;
  S.verdict = live.verdict;
  S.runId = live.runId;
  S.viewQuestion = live.question || "";
  S.opened = new Set();
  S.fromHistory = false;
  S.gridOwner = "council";
  S.runLocal = true;
  setQuestion(live.question || "");
  setView("council");
  renderGrid();
  renderVerdict();
  renderRunNow();
  if (S.panels.length) requestAnimationFrame(drawLinks);
}
/* ── retention ──────────────────────────────────────────────────────────────
   History keeps 30 days. Everything older goes, unless it is PINNED.

   Not housekeeping for its own sake: the cloud index is a single Firestore
   document with a 1 MiB ceiling and a hard row cap, and every run also leaves
   a body document behind. Left alone, a year of questions crowds out the
   twenty you actually refer back to, and the ones worth keeping are exactly
   the ones you would have to scroll past everything else to find.

   A pin is the answer to "but I need that one". Pins are kept BOTH in this
   browser and on the cloud row, and either one counts. That redundancy is
   deliberate: a pin must survive sync being unavailable (App Check refuses to
   sign in on 127.0.0.1, so the console served by the engine can never write
   one), and it must also reach your other devices when sync does work. The
   cost of getting this wrong is a deliberation deleted that you asked to
   keep, so both paths fail towards keeping it. */
const HISTORY_DAYS = 30;
const PIN_KEY = lsKey("pins");

const PINS = new Set((() => {
  try { return JSON.parse(localStorage.getItem(PIN_KEY) || "[]"); } catch { return []; }
})());
function savePins() {
  try {
    localStorage.setItem(PIN_KEY, JSON.stringify([...PINS]));
    localStorage.setItem(UNPIN_KEY, JSON.stringify(UNPINNED_AT));
  } catch {}
}

/* When the retention clock last started.
 *
 *  Without this, unpinning something old made it vanish on the spot: the
 *  window was measured from created_at, and pinning a six-month-old
 *  deliberation for a year would not change that -- one careless tap and it
 *  was gone. Pinning is how you say "not yet", so unpinning has to mean
 *  "start counting now" rather than "you already ran out of time while I was
 *  protecting it". Pinning clears the mark, so a pinned item is not counting
 *  at all; unpinning stamps it, so every pin/unpin gives a fresh 30 days.
 *
 *  Items never pinned have no entry and fall back to created_at, which is the
 *  behaviour everything already had.
 */
const UNPIN_KEY = lsKey("unpinned");
const UNPINNED_AT = (() => {
  try { return JSON.parse(localStorage.getItem(UNPIN_KEY) || "{}") || {}; }
  catch { return {}; }
})();

/** The moment this item's 30 days began. */
function clockStart(id, createdAt) {
  const stamped = UNPINNED_AT[id];
  if (stamped) {
    const t = new Date(stamped).getTime();
    if (Number.isFinite(t)) return t;
  }
  return new Date(createdAt).getTime();
}

const isPinned = (r) => PINS.has(r.id);
const runAgeDays = (r) =>
  (Date.now() - new Date(r.created_at).getTime()) / 86400000;
/** Unpinned and past the window. An unparseable date is NEVER expired: a row
 *  whose timestamp cannot be read is a bug, and deleting it would turn that
 *  bug into data loss. */
function expired(r) {
  if (isPinned(r)) return false;
  const age = (Date.now() - clockStart(r.id, r.created_at)) / 86400000;
  return Number.isFinite(age) && age > HISTORY_DAYS;
}

/* A name you gave it.
 *
 *  A deliberation is listed by its prompt, and a good prompt is long -- three
 *  of these are the same 10-section trading-report template, identical for
 *  the first ninety characters, so History showed rows that could not be told
 *  apart at all. A nickname replaces the prompt in the list; removing it puts
 *  the prompt back. The prompt itself is never touched, because it is the
 *  question that was actually asked and the verdict is an answer to it.
 *
 *  Stored the way pins are -- locally AND on the cloud row, either counting --
 *  for the same reason: it has to survive sync being unavailable and still
 *  reach your other devices when sync works. */
const NICK_KEY = lsKey("nicks");

const NICKS = (() => {
  try { return JSON.parse(localStorage.getItem(NICK_KEY) || "{}") || {}; }
  catch { return {}; }
})();
function saveNicks() {
  try { localStorage.setItem(NICK_KEY, JSON.stringify(NICKS)); } catch {}
}
/* NICKS only, and PINS only.
 *
 *  Both used to fall back to a copy of the mark kept on the run's own index
 *  row, and that copy was the reason nothing could be undone. Unpin a run and
 *  PINS lost it -- but the row still said pinned:true, the fallback believed
 *  the row, and the list came back pinned. Same for a removed name. The row
 *  fields are now read exactly once, to carry old marks into the maps (see
 *  the legacy fold in cloudWatch), and never consulted again.
 */
const nickOf = (r) => (NICKS[r.id] || "").trim();
const titleOf = (r) => nickOf(r) || r.question;

/** A name, like a pin, lives in one map. See togglePin. */
async function setNick(id, name) {
  const clean = (name || "").trim().slice(0, 120);
  if (clean) NICKS[id] = clean; else delete NICKS[id];
  saveNicks();
  cloudSaveMarks();
  mergeHistory();
}

/* Dismissing a sheet by its backdrop, without dismissing it by accident.
 *
 *  `click` fires on the nearest ancestor SHARED by where the press started
 *  and where it ended -- so dragging to select text in a box and releasing
 *  past its edge fires a click on the backdrop, and every sheet in this
 *  program took that as "close". Selecting the text of a prompt closed the
 *  editor and threw the edit away.
 *
 *  Both ends of the gesture must be on the backdrop itself. Escape closes too,
 *  which is what a keyboard expects of anything modal.
 */
function dismissOnBackdrop(sheet, close) {
  let down = false, up = false;
  sheet.addEventListener("pointerdown", (e) => { down = e.target === sheet; });
  sheet.addEventListener("pointerup", (e) => { up = e.target === sheet; });
  sheet.addEventListener("click", (e) => {
    if (e.target === sheet && down && up) close();
    down = up = false;
  });
  const onKey = (e) => {
    if (e.key !== "Escape") return;
    // Only the topmost sheet: two stacked sheets must not both go.
    const sheets = document.querySelectorAll(".sheet");
    if (sheets[sheets.length - 1] !== sheet) return;
    document.removeEventListener("keydown", onKey);
    close();
  };
  document.addEventListener("keydown", onKey);
  // The listener outlives the node otherwise: a sheet closed by its own
