 *  interval, so the sound lands with the animation instead of a beat late. */
function startProcessingTone() {
  stopProcessingTone();
  if (S.muted || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  beepProcessing();
  S.procTimer = setInterval(beepProcessing, 1600);
}
function stopProcessingTone() {
  if (S.procTimer) { clearInterval(S.procTimer); S.procTimer = null; }
}

/** One acknowledgement tick as each unit reports in. Tracked in a set so a
 *  unit only ever beeps on the transition, not on every streaming update that
 *  touches the same finished panel. */
function ackSettled() {
  for (const p of S.panels) {
    if ((p.state === "done" || p.state === "failed") && !S.settled.has(p.id)) {
      S.settled.add(p.id);
      if (!S.muted) beepUnit();
    }
  }
}

/** Halt a run -- and make the FIRST click do it.
 *
 *  Cancelling is cooperative on the engine: it sets an event, and a provider
 *  acts on it at the points where it can safely stop. That is the right design
 *  and it is not instant, so this used to POST, await the response, and change
 *  nothing at all on screen. The units went on saying "thinking", the tone went
 *  on pulsing, and the button went on offering to do the thing you had just
 *  asked for -- so the click looked like it had missed, and the natural
 *  response was to click again. That is the bug: not that halting was slow,
 *  but that nothing acknowledged it.
 *
 *  So the click now owns the console immediately -- working units read HALTED,
 *  the tone stops, the button says Halting -- while the POST goes out
 *  UNAWAITED, because the UI must not wait on a round trip to admit it heard
 *  you. The engine's `done` frame overwrites all of it with the truth when it
 *  lands, which is usually well under a second (the fan-out is raced against
 *  the cancel event now, so a browser mid-launch is torn down rather than
 *  running to the end of its phase). If it never lands, the timer below ends
 *  the run locally rather than leaving the console pretending. */
let haltFallback = 0;
function cancelRun() {
  if (!S.running || S.halting) return;
  S.halting = true;
  stopProcessingTone();
  for (const p of S.panels) {
    if (WORKING.has(p.state)) { p.state = "halted"; updateNode(p); }
  }
  updateCore();
  drawLinks();
  updateEnabled();
  if (S.runId && online()) {
    fetch(`${link.api}/api/runs/${S.runId}/cancel`, authed({ method: "POST" })).catch(() => {});
  }
  clearTimeout(haltFallback);
  // Long enough for a healthy engine to answer, short enough that a wedged one
  // does not leave the console claiming a run is still going.
  haltFallback = setTimeout(() => { if (S.running) endRun(); }, 4000);
}

/** Clears the composer and the previous run's console so the next question
 *  starts from a blank slate, rather than being asked while the last verdict
 *  is still on screen. */
function newRun() {
  if (S.running) return;
  S.fromHistory = false;
  setQuestion("");
  S.attachments = [];
  S.preRefine = null;
  S.panels = [];
  S.opened = new Set();
  S.verdict = null;
  S.runId = null;
  S.gridOwner = null;
  S.runLocal = false;
  S.viewQuestion = "";
  setErr("attachError", null);
  setErr("refineError", null);
  renderChips();
  // A new run has none of the previous run's artifacts, and leaving them on
  // screen would attribute one verdict's material to another.
  resetStudio();
  setView("council");
}

/* ══ history ═══════════════════════════════════════════════════════════════ */
async function loadHistory() {
  if (!online()) return;
  try {
    const r = await fetch(`${link.api}/api/runs?limit=30`, authed());
    S.history = await r.json();
  } catch { return; }
  if (typeof mergeHistory === "function") { mergeHistory(); return; }
  const tag = $("navHistoryTag");
  tag.textContent = S.history.length ? String(S.history.length) : "";
  show(tag, S.history.length > 0);
  renderHistory();
}

function renderHistory() {
  const box = $("historyRows");
  box.textContent = "";
  const rows = S.historyMerged || S.history;
  if (!rows.length) { box.append(el("div", "empty-state", "No runs yet.")); return; }
  for (const r of rows) {
    const pinned = isPinned(r);
    const nick = nickOf(r);
    const row = el("div", "row" + (pinned ? " pinned" : ""));
    const q = el("span", "q" + (nick ? " named" : ""), titleOf(r));
    // The prompt is still what it was, so it stays reachable rather than being
    // replaced outright by a name you chose.
    if (nick) q.title = r.question;
    row.append(q);
    // Seconds are noise in a history list: never what you are looking for, and
    // they push the part you are looking for off a phone screen.
    const meta = el("span", "meta",
      `${r.responded_count}/${r.attempted_count} · ` +
      `${r.total_ms ? (r.total_ms / 1000).toFixed(0) + "s" : "—"} · ` +
      new Date(r.created_at).toLocaleString([], {
        year: "numeric", month: "numeric", day: "numeric",
        hour: "numeric", minute: "2-digit",
      }));
    // A run from another device has no local SQLite row, so say where it came
    // from rather than letting it look identical to one made here.
    if (r.cloudOnly) meta.append(el("span", "row-cloud", " · synced"));
    row.append(meta);

    // All three ALWAYS VISIBLE. They were revealed on hover, which on a touch
    // screen means never, and a control you cannot see is one that does not
    // exist.
    const acts = el("span", "row-acts");

    const pin = el("button", "row-act" + (pinned ? " on" : ""));
    pin.type = "button";
    pin.innerHTML = IC.pin;
    // Says what it will DO, and what pinning is for -- "Pin" alone does not
    // tell you that the alternative is losing it.
    pin.title = pinned
      ? "Pinned — kept forever. Click to unpin."
      : `Pin this, to keep it past ${HISTORY_DAYS} days`;
    pin.setAttribute("aria-pressed", String(pinned));
    pin.onclick = (e) => { e.stopPropagation(); togglePin(r.id); };
    acts.append(pin);

    const ren = el("button", "row-act" + (nick ? " on" : ""));
    ren.type = "button";
    ren.innerHTML = IC.rename;
    ren.title = nick ? "Rename, or remove the name" : "Give this a name";
    ren.onclick = (e) => { e.stopPropagation(); openNickSheet(r); };
    acts.append(ren);

    const del = el("button", "row-act danger");
    del.type = "button";
    del.innerHTML = IC.trash;
    del.title = "Delete this deliberation";
    del.onclick = (e) => { e.stopPropagation(); deleteRun(r); };
    acts.append(del);

    row.append(acts);

    row.onclick = () => (r.cloudOnly ? cloudOpenRun(r.id) : openRun(r.id));
    box.append(row);
  }
  const note = el("div", "history-note");
  note.textContent =
    `Deliberations are kept for ${HISTORY_DAYS} days. Pin one to keep it forever.`;
  box.append(note);
}

async function openRun(id) {
  const r = await fetch(`${link.api}/api/runs/${id}`, authed());
  const data = await r.json();
  S.runId = id;
  S.gridOwner = "council";
  S.runLocal = true;          // read from the engine, so the engine has it
  S.viewQuestion = data.run.question || "";
  setQuestion(data.run.question);
  S.opened = new Set();
  S.panels = data.answers.map((a) => ({
    id: a.provider_id,
    display_name: a.display_name,
    accent: S.providers.find((p) => p.id === a.provider_id)?.accent || "var(--ac)",
    state: a.ok ? "done" : a.degraded ? "degraded" : "failed",
    text: a.answer_text || "", chars: a.char_count || 0, ok: !!a.ok,
    failure: a.failure_kind, error_detail: a.error_detail,
    degraded: !!a.degraded, degraded_reason: a.degraded_reason || "",
    low_confidence: !!a.low_confidence, latency_ms: a.latency_ms,
    completion_reason: a.completion_reason,
  }));
  S.verdict = data.synthesis ? {
    verdict: data.synthesis.verdict_text || "",
    synthesis_ok: !!data.synthesis.ok,
    synthesis_error: data.synthesis.error_detail,
    chairman: data.synthesis.chairman_provider,
    responded: data.synthesis.members_responded,
    total: data.synthesis.members_total,
    total_ms: data.run.total_ms || 0,
    // Rebuilt from the stored answers rather than persisted twice, so an
    // archived run explains its exclusions the same way a live one does.
    degraded: data.answers.filter((a) => a.degraded).map((a) => ({
      provider_id: a.provider_id, display_name: a.display_name,
      reason: a.degraded_reason || "", chars: a.char_count || 0,
    })),
  } : null;
  resetStudio();
  S.fromHistory = true;
  setView("council");
  renderGrid();
  renderVerdict();
  loadStudio();
}

/* ══ doctor ════════════════════════════════════════════════════════════════ */
async function runDoctor() {
  // Clicking Doctor while a pass is running means "stop", matching the Halt
  // affordance on a run. Otherwise the button is a no-op precisely when the
  // user most wants it to do something.
  if (S.doctorBusy) return stopDoctor();
  if (S.running || !online()) return;

  const ctl = new AbortController();
  S.doctorAbort = ctl;
  S.doctorBusy = true;
  setView("doctor");
  renderDoctor(null);
  try {
    // A doctor pass opens a real Chrome per unit, signed in as you. It checks
    // what you have SELECTED -- it was the last place in the console where
    // unticking a unit did not stop MAGI driving it.
    const form = new FormData();
    form.append("providers", [...S.selected].join(","));
    const r = await fetch(`${link.api}/api/doctor`,
      authed({ method: "POST", body: form, signal: ctl.signal }));
    const data = await r.json();
    // A late response from an aborted pass must not overwrite the screen.
    if (!ctl.signal.aborted) { S.doctorBusy = false; renderDoctor(data); }
  } catch {
    // Abort lands here too; either way there is nothing to show.
  } finally {
    if (S.doctorAbort === ctl) { S.doctorAbort = null; S.doctorBusy = false; syncDoctorNav(); }
  }
}

function stopDoctor() {
  S.doctorAbort?.abort();
  S.doctorAbort = null;
  S.doctorBusy = false;
  // The nav row has to be repainted HERE. runDoctor's finally block guards on
  // `S.doctorAbort === ctl`, and this has just set it to null -- so that guard
  // never fired after a stop and the row kept its spinner and its "Stop
  // doctor" label over a pass that was already dead.
  syncDoctorNav();
  setView("council");
}

function syncDoctorNav() {
  $("navDoctorLbl").textContent = S.doctorBusy ? "Stop doctor" : "Doctor";
  $("navDoctorIc").innerHTML = S.doctorBusy ? SPINNER : IC.doctor;
  $("navDoctorIc").className = "side-ic";
  show($("navDoctorTag"), S.doctorBusy);
  $("navDoctor").setAttribute("aria-busy", String(S.doctorBusy));
}

/* ── what runs have hit lately ─────────────────────────────────────────────
 *
 *  A usage limit is almost never on a site's idle page -- ChatGPT's upload cap
 *  is in a tooltip once a file is attached, Grok's replaces an answer after a
 *  send -- so a doctor that only probes the page calls those units healthy.
 *  The engine reads its run history back instead (engine/usage.py) and this
 *  shows it: each unit's most recent problems, a limit's reset time when the
 *  site gave one, and whether the unit has answered fine since. */
const DOC_KIND = {
  rate_limited: "Usage limit",
  timeout: "Timed out",
  empty_response: "Empty response",
  not_logged_in: "Signed out",
  selector_miss: "Page changed",
  overlay_blocked: "Blocked by a dialog",
  bot_challenge: "Bot check",
  navigation: "Could not load",
  browser_crash: "Browser crashed",
  profile_locked: "Profile in use",
  unusable: "Unusable answer",
  unknown: "Error",
};

function docAgo(iso) {
  const ms = Date.now() - Date.parse(iso);
  if (!isFinite(ms)) return "";
  const m = Math.round(ms / 60000);
  if (m < 1) return "just now";
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h ${m % 60 ? (m % 60) + "m " : ""}ago`;
  return `${Math.floor(h / 24)}d ago`;
}

function docUntil(iso) {
  const ms = Date.parse(iso) - Date.now();
  if (!isFinite(ms) || ms <= 0) return "";
  const m = Math.ceil(ms / 60000);
  const clock = new Date(iso).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const rel = m < 60 ? `${m}m` : `${Math.floor(m / 60)}h${m % 60 ? " " + (m % 60) + "m" : ""}`;
  return `${clock} (in ${rel})`;
}

/** A limit that still stands: live on the page, or seen in a run, not
 *  answered past since, and not past the reset time the site gave. */
function docActiveLimits(d) {
  const out = [];
  if (d.limit) out.push({ live: true, detail: d.limit });
  for (const i of (d.recent && d.recent.issues) || []) {
    if (i.limit && !i.cleared && !i.reset_passed) out.push(i);
  }
  return out;
}

/** Problems from runs that the unit has not answered past since. */
function docOpenIssues(d) {
  return ((d.recent && d.recent.issues) || []).filter((i) => !i.limit && !i.cleared);
}

function renderDoctor(data) {
  syncDoctorNav();
  const body = $("doctorBody");
  body.textContent = "";
  // Rendered while busy too, not just once results land: a pass takes tens of
  // seconds, and an empty page with only a spinner in the sidebar gave no
  // indication anything was happening or how to stop it.
  if (S.doctorBusy) {
    $("doctorHd").textContent = "Selector doctor — checking";
    const r = el("div", "doctor-running");
    r.append(spinnerEl());
    r.append(el("span", null,
      `Opening each SELECTED unit's site to see which selectors match — ` +
      `${S.selected.size} of ${S.providers.length}. This launches a real browser per unit and takes a while.`));
    r.append(el("span", "qbar-spacer"));
    const stop = el("button", "navitem danger");
    stop.type = "button";
    stop.append(icSpan("navitem-ic", "halt"), document.createTextNode("Stop"));
    stop.onclick = stopDoctor;
    r.append(stop);
    body.append(r);
    return;
  }
  $("doctorHd").textContent = "Selector doctor";
  if (!data) return;
  if (!data.length) { body.append(el("div", "empty-state", "Nothing was checked.")); return; }

  /* A verdict first, then the detail.
   *
   *  This used to be one flat table of every field of every unit -- around
   *  thirty rows, almost all of them OK, with the unit's name printed on one
   *  row in four. The answer to "is anything broken?" was in there somewhere,
   *  and you had to read the whole thing to find it. Now the top line answers
   *  that question and the rows underneath explain it. */
  const faults = (d) => d.selectors.filter((x) => (x.status || (x.ok ? "ok" : "miss")) === "miss");
  const stale  = (d) => d.selectors.filter((x) => x.stale);
  const limited = data.filter((d) => docActiveLimits(d).length);
  const broken = data.filter((d) => !d.usable || d.error || faults(d).length || limited.includes(d));
  const drifting = data.filter((d) => !broken.includes(d) && (stale(d).length || docOpenIssues(d).length));

  const sum = el("div", "doc-summary " + (broken.length ? "bad" : drifting.length ? "warn" : "good"));
  sum.append(el("span", "doc-sum-dot"));
  const healthy = data.length - broken.length - drifting.length;
  let line;
  if (broken.length) {
    line = `${broken.length} unit${broken.length > 1 ? "s need" : " needs"} attention` +
           (limited.length ? ` (${limited.length} at a usage limit)` : "") +
           (healthy || drifting.length ? ` · ${data.length - broken.length} fine` : "");
  } else if (drifting.length) {
    line = `All ${data.length} usable, but ${drifting.length} ` +
           `${drifting.length > 1 ? "have" : "has"} a recent problem or a fallback selector`;
  } else {
    line = `All ${data.length} unit${data.length > 1 ? "s" : ""} healthy`;
  }
  sum.append(el("span", null, line));
  body.append(sum);

  for (const d of data) {
    const bad = broken.includes(d), drift = drifting.includes(d);
    const card = el("div", "doc-card " + (bad ? "bad" : drift ? "warn" : "good"));

    const hd = el("div", "doc-hd");
    hd.append(el("span", "doc-name", d.display_name));
    const flags = el("span", "doc-flags");
    // Plain words. "reachable=true logged_in=true challenged=false" was a
    // debug print, not a status.
    if (d.error) flags.append(el("span", "doc-flag miss", "Error"));
    else if (!d.reachable) flags.append(el("span", "doc-flag miss", "Unreachable"));
    else {
      if (d.challenged) flags.append(el("span", "doc-flag miss", "Bot check"));
      flags.append(el("span", "doc-flag " + (d.logged_in ? "ok" : "miss"),
                      d.logged_in ? "Signed in" : "Signed out"));
      flags.append(el("span", "doc-flag " + (d.usable ? "ok" : "miss"),
                      d.usable ? "Usable" : "Not usable"));
    }
    if (docActiveLimits(d).length) flags.append(el("span", "doc-flag miss", "Usage limit"));
    if (d.duration_ms) flags.append(el("span", "doc-flag na", `Took ${(d.duration_ms / 1000).toFixed(0)}s`));
    hd.append(flags);
    card.append(hd);

    if (d.error) card.append(el("div", "doc-note", d.error));
    for (const n of d.notes || []) card.append(el("div", "doc-note", n));

    // Usage limits first: they are the one problem here with nothing to fix,
    // only a time to wait for, so the time is the headline.
    for (const lim of docActiveLimits(d)) {
      const box = el("div", "doc-fix doc-limit");
      box.append(el("b", null, "Usage limit"));
      const when = lim.live ? "showing on the site now" : `hit ${docAgo(lim.at)}`;
      box.append(el("span", null, ` ${when}. `));
      box.append(el("span", "doc-limit-said", lim.detail.replace(/^The site said:\s*/, "")));
      const until = lim.resets_at ? docUntil(lim.resets_at) : "";
      box.append(el("div", "doc-limit-when",
        until ? `Lifts around ${until}. Until then this unit fails fast with this message.`
              : `The site gave no reset time. Until it lifts this unit fails fast with this message.`));
      card.append(box);
    }

    const issues = (d.recent && d.recent.issues) || [];
    const shown = issues.filter((i) => !(i.limit && !i.cleared && !i.reset_passed));
    if (shown.length) {
      const wrap = el("div", "doc-recent");
      wrap.append(el("div", "doc-recent-hd",
        `Recent problems · last ${(d.recent && d.recent.window_hours) || 48}h`));
      for (const i of shown) {
        const row = el("div", "doc-recent-row" + (i.cleared || i.reset_passed ? " cleared" : ""));
        const top = el("div", "doc-recent-top");
        top.append(el("span", "doc-recent-kind", DOC_KIND[i.kind] || i.kind));
        top.append(el("span", "doc-recent-at", docAgo(i.at)));
        top.append(el("span", "doc-recent-state",
          i.cleared ? "Answered fine since" : i.reset_passed ? "Limit should have lifted" : "Not answered since"));
        row.append(top);
        if (i.detail) row.append(el("div", "doc-recent-detail", i.detail.replace(/^The site said:\s*/, "")));
        wrap.append(row);
      }
      card.append(wrap);
    }

    // What to actually DO. A stale field still works today and will stop
    // working the next time the site tidies up, and "put the matched selector
    // above the preferred one" is the whole fix -- so say it, with both
    // strings, rather than leaving it to be inferred from two table columns.
    for (const x of [...faults(d), ...stale(d)]) {
      const fix = el("div", "doc-fix" + (x.stale ? " warn" : ""));
      fix.append(el("b", null, x.field));
      if (x.stale) {
        fix.append(el("span", null, " is running on a fallback. In "));
        fix.append(el("code", null, `magi/config/selectors.yaml → ${d.provider_id}.${x.field}`));
        fix.append(el("span", null, ", move "));
        fix.append(el("code", null, x.matched));
        fix.append(el("span", null, " above "));
        fix.append(el("code", null, x.preferred || "the first entry"));
        fix.append(el("span", null, "."));
      } else {
        fix.append(el("span", null, ` matched none of its ${x.tried} selectors. Find the right one in the site's DOM and add it to the top of `));
        fix.append(el("code", null, `magi/config/selectors.yaml → ${d.provider_id}.${x.field}`));
        fix.append(el("span", null, "."));
      }
      card.append(fix);
    }

    // The full table, folded away: it is reference material, not the answer.
    const det = el("details", "doc-details");
    const okCount = d.selectors.filter((x) => (x.status || (x.ok ? "ok" : "miss")) === "ok").length;
    det.append(el("summary", null, `All ${d.selectors.length} fields (${okCount} matching)`));
    const t = el("table", "doctor");
    const thead = el("thead"), htr = el("tr");
    for (const h of ["Field", "Status", "Matched"]) htr.append(el("th", null, h));
    thead.append(htr);
    const tb = el("tbody");
    for (const x of d.selectors) {
      // Colour on `status`, not on ok. A field that cannot match while the
      // chat is idle is not a fault, and painting it red made a healthy
      // install look catastrophically broken.
      const st = x.status || (x.ok ? "ok" : "miss");
      const cls = st === "ok" ? (x.stale ? "stale" : "ok") : st === "miss" ? "miss" : "na";
      const label = st === "ok" ? (x.stale ? "FALLBACK" : "OK")
        : st === "miss" ? "MISS" : st === "unset" ? "—" : "n/a";
      const tr = el("tr");
      tr.append(el("td", null, x.field));
      tr.append(el("td", cls, label));
      const last = el("td");
      last.append(el("code", null, x.matched || (x.note ? x.note : st === "miss" ? `all ${x.tried} failed` : "—")));
      tr.append(last);
      tb.append(tr);
    }
    t.append(thead, tb);
    const wrap = el("div", "doc-tablewrap");
    wrap.append(t);
    attachScrollbar(wrap);
    det.append(wrap);
    card.append(det);
    body.append(card);
  }
}

/* ══ ACCOUNTS ══════════════════════════════════════════════════════════════
   Which account each unit is signed in as, and how to change it.

   This matters more than a settings tab usually does: MAGI drives your own
   logged-in sessions, so a unit quietly signed in to a free personal account
   answers a run you thought was going to your subscription, and nothing else
   on screen would say so.

   THE ACCOUNT NAME IS YOURS TO WRITE. MAGI does not scrape the email off each
   site: seven more selectors, all behind logins, each of which would rot into
   showing the WRONG account -- which is worse than showing none. A label you
   typed is never stale in a way that lies.

   EVERY BUTTON HERE DRIVES A BROWSER ON THE ENGINE DEVICE. A phone can start
   a sign-in, but the window opens where the profiles live, because that is
   the only place it could open. The panel says so rather than leaving you
   watching a phone for a window that is never coming. */
/* `busy` is a SET, not an id.
 *
 *  Checks are per-unit and each opens its own browser against its own profile
 *  -- exactly the shape the doctor already fans out in parallel -- so there
 *  was never a reason to make you check seven sessions one at a time, each
 *  one taking ten seconds with the rest of the panel dead. The only collision
 *  that matters is two checks on the SAME unit, which would fight over one
 *  profile lock, and membership of this set is what prevents that. */
const ACC = { rows: [], busy: new Set(), busyText: {}, login: null, poll: 0 };

async function loadAccounts(quiet) {
  if (!online()) { renderAccounts(); return; }
  if (!quiet) ACC.loading = true, renderAccounts();
  try {
    const r = await fetch(`${link.api}/api/accounts`, authed());
    ACC.rows = await r.json();
  } catch { ACC.rows = []; }
  ACC.loading = false;
  renderAccounts();
}

const AGE = (iso) => {
  if (!iso) return "";
  const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (!Number.isFinite(m)) return "";
  if (m < 1) return "just now";
  if (m < 60) return `${m}m ago`;
  const h = Math.round(m / 60);
  return h < 48 ? `${h}h ago` : `${Math.round(h / 24)}d ago`;
};

function accStatus(a) {
  if (!a.profile) return { cls: "miss", txt: "No session" };
  if (a.signed_in === true) return { cls: "ok", txt: "Signed in" };
  if (a.signed_in === false) return { cls: "miss", txt: "Signed out" };
  return { cls: "na", txt: "Not checked" };
}

function renderAccounts() {
  const box = $("accountsBody");
  if (!box) return;
  box.textContent = "";

  if (!online()) {
    box.append(el("div", "empty-state",
      "Accounts live on the engine device, so this needs the engine to be reachable."));
    return;
  }
  if (ACC.loading && !ACC.rows.length) {
    const w = el("div", "doctor-running");
    w.append(spinnerEl(), el("span", null, "Reading saved sessions…"));
    box.append(w);
    return;
  }


  const note = el("div", "acc-note");
  note.innerHTML =
    "Each unit keeps its own browser profile on the engine device. " +
    "<b>Sign in</b> opens the real site in a window <b>on that device</b> — you type your " +
    "password into the site itself, never into MAGI. <b>Sign out</b> deletes MAGI's copy " +
    "of that session so you can sign in as someone else; it does not sign you out at the " +
    "provider, and it never touches your personal Chrome.";
  box.append(note);

  // Named apart from the per-card `bar` below, which it would otherwise
  // shadow -- legal, and exactly the sort of thing that reads as a bug later.
  const topbar = el("div", "acc-topbar");
  const all = el("button", "navitem", "Check all");
  all.title = "Opens every unit's site at once to see which sessions still work";
  all.disabled = ACC.busy.size > 0;
  all.onclick = () => ACC.rows.forEach((r) => checkAccount(r));
  topbar.append(all);
  if (ACC.busy.size) {
    const w = el("span", "acc-busy");
    w.append(spinnerEl(), el("span", null, `checking ${ACC.busy.size}…`));
    topbar.append(w);
  }
  box.append(topbar);

  for (const a of ACC.rows) {
    const st = accStatus(a);
    const card = el("div", "acc-card");
    card.style.setProperty("--pa", a.accent || "var(--ac)");

    const hd = el("div", "acc-hd");
    const names = el("div", "acc-names");
    names.append(el("div", "acc-name", a.display_name));
    names.append(el("div", "acc-sub", UNIT[a.id] || a.id));
    hd.append(names);

    const flags = el("div", "acc-flags");
    flags.append(el("span", `doc-flag ${st.cls}`, st.txt));
    if (!a.enabled) flags.append(el("span", "doc-flag na", "Unticked"));
    if (a.checked_at) flags.append(el("span", "doc-flag na", `Checked ${AGE(a.checked_at)}`));
    hd.append(flags);
    card.append(hd);

    // "Signed in." under a pill that says "Signed in" is the same sentence
    // twice. The detail line is for detail -- why a check failed, what is in
    // the way -- so the ones that only restate the pill are dropped.
    const redundant = /^(signed in|signed out)\.?$/i.test((a.detail || "").trim());
    if (a.detail && !redundant) card.append(el("div", "acc-detail", a.detail));

    // The label. Written on blur rather than per keystroke: one write per
    // edit, and no request racing the next character.
    const row = el("div", "acc-row");
    const lbl = el("input", "acc-input");
    lbl.type = "text";
    lbl.value = a.label || "";
    lbl.placeholder = "Which account is this? e.g. personal gmail";
    lbl.setAttribute("aria-label", `Account label for ${a.display_name}`);
    lbl.onblur = async () => {
      if ((a.label || "") === lbl.value) return;
      a.label = lbl.value;
      const form = new FormData();
      form.append("label", lbl.value);
      // Reported through the same line as everything else that saves. It is
      // not a Firestore write -- the label lives with the profile it names, on
      // the engine -- but "did that stick?" is the same question, and an edit
      // that silently vanished on a failed request is the same annoyance.
      setSync("saving");
      try {
        const r = await fetch(`${link.api}/api/accounts/${a.id}/label`,
                              authed({ method: "POST", body: form }));
        if (!r.ok) throw new Error(`the engine returned ${r.status}`);
        setSync("saved");
      } catch (e) {
        setSync("error", _syncFail("saving an account label", e));
      }
    };
    lbl.onkeydown = (e) => { if (e.key === "Enter") lbl.blur(); };
    row.append(lbl);
    card.append(row);

    const bar = el("div", "acc-actions");
    const busy = ACC.busy.has(a.id);

    // A saved session that is SIGNED OUT is not an account to switch away
    // from -- it is an account to get back into, and "Switch account" was the
    // wrong instruction on precisely the units that needed the right one.
    // Highlighted there too, because on those cards it is the whole point.
    const needsLogin = !a.profile || a.signed_in === false;
    const signin = el("button", "navitem" + (a.signed_in === false ? " active" : ""),
                      needsLogin ? "Sign in" : "Switch account");
    signin.disabled = busy;
    signin.onclick = () => startLogin(a);
    bar.append(signin);

    const check = el("button", "navitem", "Check");
    check.disabled = busy;
    check.title = "Opens this site once to see whether the saved session still works";
    check.onclick = () => checkAccount(a);
    bar.append(check);

    // Sign out only when there is something to sign out OF. A card that
    // already says SIGNED OUT offering "Sign out" is nonsense, and it sat
    // right beside the one button that card actually needed. Signing back in
    // reuses the same profile, so nothing has to be cleared first.
    if (a.profile && a.signed_in !== false) {
      const out = el("button", "navitem danger", "Sign out");
      out.disabled = busy;
      out.title = "Deletes MAGI's saved session for this unit so you can sign in as someone else";
      out.onclick = () => signOutAccount(a);
      bar.append(out);
    }

    bar.append(el("span", "qbar-spacer"));
    const meta = [];
    if (a.size_mb) meta.push(`${a.size_mb} MB`);
    if (a.last_used) meta.push(`used ${AGE(a.last_used)}`);
    if (meta.length) bar.append(el("span", "acc-meta", meta.join(" · ")));
    card.append(bar);

    if (busy) {
      const w = el("div", "acc-busy");
      w.append(spinnerEl(), el("span", null, ACC.busyText[a.id] || "Working…"));
      card.append(w);
    }
    box.append(card);
  }
}

async function checkAccount(a) {
  // Two checks of the same unit would fight over one profile lock, and the
  // loser reports a failure that says nothing about the session.
  if (ACC.busy.has(a.id)) return;
  ACC.busy.add(a.id);
  ACC.busyText[a.id] = `Opening ${a.display_name} to see whether the session still works…`;
  renderAccounts();
  try {
    const r = await fetch(`${link.api}/api/accounts/${a.id}/check`,
                          authed({ method: "POST" }));
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || "check failed");
    // Written straight onto the row rather than reloading the whole list: a
    // reload mid-batch would redraw the other units' spinners from a listing
    // that does not know they are still running.
    Object.assign(a, { signed_in: d.signed_in, detail: d.detail,
                       checked_at: new Date().toISOString() });
  } catch (e) {
    a.detail = String(e.message || e);
  }
  ACC.busy.delete(a.id);
  delete ACC.busyText[a.id];
  renderAccounts();
  // One reload once the last one lands, to pick up sizes and timestamps.
  if (!ACC.busy.size) loadAccounts(true);
}

async function signOutAccount(a) {
  const ok = await uiConfirmMagi(
    `Sign out of ${a.display_name}?`,
    "This deletes MAGI's saved session for this unit so you can sign in as a " +
    "different account. It does not sign you out at " + a.display_name +
    " itself, and your personal Chrome is not touched.",
    "Sign out");
  if (!ok) return;
  ACC.busy.add(a.id);
  ACC.busyText[a.id] = "Removing the saved session…";
  renderAccounts();
  try {
    const r = await fetch(`${link.api}/api/accounts/${a.id}/signout`,
                          authed({ method: "POST" }));
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || "sign out failed");
  } catch (e) {
    a.detail = String(e.message || e);
  }
  ACC.busy.delete(a.id);
  delete ACC.busyText[a.id];
  await loadAccounts(true);
}

/** Start a sign-in and watch it, in a panel that says where the window is. */
async function startLogin(a) {
  const sheet = el("div", "sheet");
  const box = el("div", "sheet-box");
  box.append(el("div", "sheet-hd", `Sign in to ${a.display_name}`));
  const sub = el("div", "sheet-sub");
  sub.innerHTML =
    "A real " + a.display_name + " window is opening <b>on the engine device</b> — " +
    "that is where the browser profiles live, so it is the only place it can open. " +
    "Sign in there as normal. MAGI watches the page and finishes on its own; " +
    "you never type a password into MAGI.";
  box.append(sub);

  const status = el("div", "acc-busy");
  const spin = spinnerEl();
  const txt = el("span", null, "Opening the window…");
  status.append(spin, txt);
  box.append(status);

  const bar = el("div", "sheet-bar");
  const cancel = el("button", "btn", "Cancel");
  const close = el("button", "btn", "Close");
  bar.append(cancel, el("span", "qbar-spacer"), close);
  box.append(bar);

  let stopped = false;
  const done = () => { stopped = true; clearTimeout(ACC.poll); sheet.remove(); loadAccounts(true); };
  close.onclick = done;
  cancel.onclick = async () => {
    try {
      await fetch(`${link.api}/api/accounts/${a.id}/login/cancel`, authed({ method: "POST" }));
    } catch {}
    done();
  };

  sheet.append(box);
  document.body.append(sheet);

  try {
    const r = await fetch(`${link.api}/api/accounts/${a.id}/login`, authed({ method: "POST" }));
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || "could not start");
  } catch (e) {
    spin.remove();
    status.className = "sheet-err";
    txt.textContent = String(e.message || e);
    cancel.remove();
    return;
  }

  // Polled, not streamed: this finishes in a person's own time -- a minute
  // for a password manager, five for a 2FA code on another device -- and a
  // held-open SSE stream buys nothing at that timescale.
  const tick = async () => {
    if (stopped) return;
    try {
      const r = await fetch(`${link.api}/api/accounts/${a.id}/login`, authed());
      const d = await r.json();
      txt.textContent = d.detail || d.state;
      if (d.state === "done") {
        spin.remove();
        status.className = "sheet-ok";
        cancel.remove();
        setTimeout(done, 1200);
        return;
      }
      if (d.state === "failed" || d.state === "cancelled") {
        spin.remove();
        status.className = "sheet-err";
        cancel.remove();
        return;
      }
    } catch {}
    ACC.poll = setTimeout(tick, 2000);
  };
  ACC.poll = setTimeout(tick, 1200);
}

/** A confirm in MAGI's own UI. No browser dialogs anywhere in this console. */
function uiConfirmMagi(title, body, okLabel) {
  return new Promise((res) => {
    const sheet = el("div", "sheet");
    const box = el("div", "sheet-box");
    const sub = el("div", "sheet-sub");
    // pre-line, so a body can separate the thing being acted on from the
    // consequences of acting on it.
    sub.style.whiteSpace = "pre-line";
    sub.textContent = body;
    box.append(el("div", "sheet-hd", title), sub);
    const bar = el("div", "sheet-bar");
    const ok = el("button", "btn active", okLabel || "OK");
    const no = el("button", "btn", "Cancel");
    bar.append(ok, el("span", "qbar-spacer"), no);
    box.append(bar);
    const end = (v) => { sheet.remove(); res(v); };
    ok.onclick = () => end(true);
    no.onclick = () => end(false);
    dismissOnBackdrop(sheet, () => end(false));
    sheet.append(box);
    document.body.append(sheet);
    no.focus();
  });
}

/* ══ views ═════════════════════════════════════════════════════════════════
   One `view` at a time. History and Doctor were independent booleans that
   could both be open, stacking two panels above the console. */
function setView(v) {
  S.view = v;
  // Leaving the council view closes any open Studio card. Otherwise History
  // would render UNDER a slide deck, which is how two panels ended up stacked
  // in the first place.
  if (v !== "council" && S.studio) { releaseStudioCard(); S.studio.active = null; }
  const studioOpen = !!(S.studio && S.studio.active);
  const bsOpen = v === "brainstorm";

  show($("studioView"), studioOpen);
  show($("historyDrawer"), v === "history");
  // The bar itself, and its second button: a way back to the run still in
  // flight, which only exists while one is.
  const pastWhileRunning = v === "council" && S.fromHistory && S.live
    && S.panels !== S.live.panels;
  show($("histBackBar"), v === "council" && S.fromHistory && !studioOpen);
  show($("backToLive"), !!pastWhileRunning && !studioOpen);
  show($("doctorDrawer"), v === "doctor");
  show($("accountsDrawer"), v === "accounts");
  // Brainstorm brings its own composer and its own reply box, so the council's
  // question bar is HIDDEN rather than stacked above a second textarea that
  // submits somewhere else.
  // Accounts is a settings screen: a question box and a row of unit toggles
  // above it are controls for a different job entirely, and they push the
  // thing you came to read below the fold.
  // Accounts and the Doctor are settings screens: a question box and a row of
  // unit toggles above them are controls for a different job, and they push
  // the thing you came to read below the fold.
  const settingsView = v === "accounts" || v === "doctor" || v === "history";
  show($("qbar"), !bsOpen && !settingsView);
  show($("unitBar"), (!bsOpen || !S.bs.sessionId) && !settingsView);
  // Moved, not duplicated: two unit rows that could disagree about what is
  // ticked would be worse than one in the wrong place. In the markup it
  // follows the council composer, which puts it ABOVE the brainstorm panel.
  const bar = $("unitBar"), bs = $("bsView"), page = $("page");
  // On the way IN, park it after the panel; renderBsView then pulls it inside,
  // between the composer and Past sessions. On the way OUT it comes home --
  // and that has to happen even when it is currently a child of bsView, which
  // is why this checks the parent and not just the sibling.
  if (bsOpen) {
    if (bar.parentElement === page && bar.previousElementSibling !== bs) {
      page.insertBefore(bar, bs.nextSibling);
    }
  } else if (bar.parentElement !== page || bar.previousElementSibling !== $("qbar")) {
    page.insertBefore(bar, $("qbar").nextSibling);
  }
  // A run opened from History keeps History lit -- you drilled into that
  // list, you did not leave it -- and New deliberation is only lit for a
  // screen you would actually be starting one on.
  const viewingPast = v === "council" && S.fromHistory;
  $("navNew").classList.toggle("active", v === "council" && !studioOpen && !viewingPast);
  $("navHistory").classList.toggle("active", v === "history" || viewingPast);
  $("navDoctor").classList.toggle("active", v === "doctor");
  $("navAccounts").classList.toggle("active", v === "accounts");
  // An open card replaces the grid and the verdict rather than sitting above
  // them: showing both at once is what made this page a scroll.
  // Owned by this screen, not merely present. See S.gridOwner.
  const gridMine = S.gridOwner === (bsOpen ? "brainstorm" : "council");
  show($("magi"), S.panels.length > 0 && !studioOpen && gridMine
                  && (v === "council" || bsOpen));
  show($("emptyState"),
       (S.panels.length === 0 || !gridMine) && v === "council"
       && !(S.verdict && gridMine) && !studioOpen);
  renderVerdict();
  renderQueue();
  renderRunNow();
  syncCouncilIdle();
  if (typeof renderStudioNav === "function") renderStudioNav();
  if (typeof renderBsNav === "function") renderBsNav();
  if (typeof renderBsNav === "function") { renderBsNav(); renderBsView(); }
  if (S.panels.length && gridMine && !studioOpen) requestAnimationFrame(drawLinks);
}

/* ══ units ═════════════════════════════════════════════════════════════════ */
/* ── the order of the units, which is yours ────────────────────────────────
   Drag a chip to move it. The gesture is TradeHub's, deliberately: a small
   move starts a drag with a mouse, a ~300ms hold starts one with a finger --
   so a plain swipe still scrolls the row and a plain tap still toggles the
   unit. Anything else on a touch screen means the row cannot be scrolled
   without reordering it by accident.

   Stored per browser AND in the cloud, because the order is a preference, not
   a fact about the engine: it should follow you to your phone, but a phone
   that cannot reach Firestore must still remember what you did last time. */
const UNIT_ORDER_KEY = lsKey("unitorder");

/* Which units are ticked, remembered on this device.
 *
 *  Per device on purpose, unlike the ORDER: which models you are willing to
 *  spend a run on is a local decision -- a phone on mobile data and a desk
 *  machine are not the same situation -- whereas the order is just how you
 *  like to read them. `null` means "never chosen here", which is different
 *  from "chose none" and is what lets the default apply exactly once. */
const UNIT_PICK_KEY = lsKey("units");

function loadUnitPicks() {
  try {
    const raw = localStorage.getItem(UNIT_PICK_KEY);
    if (!raw) return null;
    const v = JSON.parse(raw);
    // The old shape was a bare array of ticked ids. Read it, so nobody's
    // existing choice is thrown away by the upgrade -- with no record of what
    // existed at the time, every unit is treated as already known, which is
    // right for anyone whose units have not changed since.
    if (Array.isArray(v)) return { on: v, known: v.slice() };
    if (v && Array.isArray(v.on) && Array.isArray(v.known)) return v;
    return null;
  } catch { return null; }
}

/** Store the ticked units AND the units that existed when you ticked them.
 *
 *  Both halves are needed. With only the ticked list there is no way to tell
 *  "a unit you deliberately unticked" from "a unit that did not exist when you
 *  chose" -- both are simply absent -- so the rule that welcomes a NEW unit
 *  also silently re-ticked one you had turned off, every single refresh. That
 *  was the bug: unticking Copilot never survived a reload.
 */
function saveUnitPicks() {
  try {
    localStorage.setItem(UNIT_PICK_KEY, JSON.stringify({
      on: [...S.selected],
      known: S.providers.map((p) => p.id),
    }));
  } catch {}
}

function loadUnitOrder() {
  try {
    const a = JSON.parse(localStorage.getItem(UNIT_ORDER_KEY) || "[]");
    return Array.isArray(a) ? a : [];
  } catch { return []; }
}
function saveUnitOrder(order) {
  S.unitOrder = order.slice();
  try { localStorage.setItem(UNIT_ORDER_KEY, JSON.stringify(order)); } catch {}
}

/** Saved order first, then anything new, minus anything gone.
 *
 *  A unit added to the config after you last dragged must appear rather than
 *  vanish, and one removed from it must not leave a hole -- the same merge
 *  TradeHub does for its tabs, for the same reason. */
function orderedProviders() {
  const byId = {};
  for (const p of S.providers) byId[p.id] = p;
  const out = [], seen = new Set();
  for (const id of (S.unitOrder || [])) {
    if (byId[id] && !seen.has(id)) { out.push(byId[id]); seen.add(id); }
  }
  for (const p of S.providers) if (!seen.has(p.id)) { out.push(p); seen.add(p.id); }
  return out;
}

function renderUnitChips() {
  // The engine's list has just arrived or changed: the queue's unit dots were
  // drawn from whatever was known before it, so they are redrawn with it.
  if (typeof renderQueue === "function") queueMicrotask(renderQueue);
  const box = $("unitChips");
  box.textContent = "";
  for (const p of orderedProviders()) {
    const on = S.selected.has(p.id);
    const b = el("button", `chip ${on ? "on" : ""}`);
    b.type = "button";
    b.dataset.unit = p.id;
    if (on) { b.style.background = p.accent; b.style.borderColor = p.accent; }
    else { b.style.color = p.accent; b.style.borderColor = p.accent + "66"; }
    // Both names, because the codename alone does not say which model you are
    // switching off. The real model name is the thing being chosen; the MAGI
    // codename is flavour, so it reads as the smaller, secondary label.
    b.append(el("span", "chip-model", p.display_name));
    b.append(el("span", "chip-unit", (UNIT[p.id] || "").split("\u00b7")[0]));
    if (CHAIR.id === p.id) {
      // A star, not a colour or a border: the chip already uses both for the
      // unit's identity and for whether it is ticked.
      const st = el("span", "chip-chair");
      st.innerHTML = IC.chair;
      st.title = `${p.display_name} is the chairman \u2014 it writes the verdict. Click to change.`;
      b.append(st);
      b.classList.add("is-chair");
    }
    b.onclick = () => {
      // A drag ends with a click on the chip you were holding. Toggling the
      // unit off because you moved it would be maddening.
      if (DRAG.justDragged) return;
      S.selected.has(p.id) ? S.selected.delete(p.id) : S.selected.add(p.id);
      saveUnitPicks();
      renderUnitChips();
      updateEnabled();
    };
    b.onpointerdown = (e) => unitDragStart(e, p.id);
    box.append(b);
  }
  updateEnabled();
}

/* ══ THE CHAIR ═════════════════════════════════════════════════════════════
   The chairman reads every answer and writes the verdict, so which member it
   is genuinely changes the result -- and until now it was a line in a YAML
   file on one machine, invisible from the console that shows the verdict.

   It lives on the ENGINE, not in Firestore, unlike the unit order: this is
   not a per-person preference, it decides how a run is conducted, and a run
   happens in exactly one place.

   The chip shows a star. Only one unit can wear it, and the panel says out
   loud what happens when the chair is not among the units you ticked --
   because that is the case people get wrong, and the answer is that the
   fallback chain picks someone else rather than the run failing. */
const CHAIR = { id: null, fallback: [], busy: false };

async function loadChair() {
  if (!online()) return;
  try {
    const r = await fetch(`${link.api}/api/chairman`, authed());
    const d = await r.json();
    CHAIR.id = d.chairman || null;
    CHAIR.fallback = d.fallback_order || [];
  } catch {}
  if (S.providers.length) renderUnitChips();
}

async function setChair(id) {
  if (CHAIR.busy || !online()) return;
  CHAIR.busy = true;
  const was = CHAIR.id;
  CHAIR.id = id;                      // optimistic: the star moves at once
  renderUnitChips();
  try {
    const form = new FormData();
    form.append("provider_id", id);
    const r = await fetch(`${link.api}/api/chairman`,
                          authed({ method: "POST", body: form }));
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || "could not set the chair");
    CHAIR.id = d.chairman || id;
  } catch (e) {
    CHAIR.id = was;                   // put it back rather than lying
    console.warn("[magi] chair:", e);
  }
  CHAIR.busy = false;
  renderUnitChips();
}

/** The chair picker. Reached from the star, or from the row's own label. */
function openChairPicker() {
  const sheet = el("div", "sheet");
  const box = el("div", "sheet-box");
  box.append(el("div", "sheet-hd", "Chairman"));
  box.append(el("div", "sheet-sub",
    "The chairman is the member that reads every other answer and writes the " +
    "verdict. It does not get a vote and it is not a tie-breaker \u2014 it decides " +
    "what the council's answer actually says, so the choice changes the " +
    "verdict. Pick the member you would trust to weigh the others, not the " +
    "one you rate highest on its own."));

  const list = el("div", "chair-list");
  for (const p of orderedProviders()) {
    const row = el("button", "chair-row" + (CHAIR.id === p.id ? " on" : ""));
    row.type = "button";
    row.style.setProperty("--pa", p.accent);
    const names = el("div", "chair-names");
    names.append(el("div", "chair-name", p.display_name));
    names.append(el("div", "chair-sub", UNIT[p.id] || p.id));
    row.append(names);
    const tags = el("div", "chair-tags");
    if (CHAIR.id === p.id) tags.append(el("span", "doc-flag ok", "Chairman"));
    if (!S.selected.has(p.id)) tags.append(el("span", "doc-flag na", "Unticked"));
    row.append(tags);
    row.onclick = () => { setChair(p.id); sheet.remove(); };
    list.append(row);
  }
  box.append(list);

  const note = el("div", "sheet-note");
  const chairSelected = CHAIR.id && S.selected.has(CHAIR.id);
  note.innerHTML = chairSelected
    ? "A single-unit run has no chairman at all: with one member there is " +
      "nothing to synthesise, so its answer <i>is</i> the verdict."
    : "<b>The chairman is not ticked.</b> It cannot chair a run it is not part " +
      "of, so the verdict will be written by the first ticked member in the " +
      "fallback order instead. Tick it, or choose a chairman you are using.";
  box.append(note);

  const bar = el("div", "sheet-bar");
  const close = el("button", "btn", "Close");
  bar.append(el("span", "qbar-spacer"), close);
  box.append(bar);
  close.onclick = () => sheet.remove();
  dismissOnBackdrop(sheet, () => sheet.remove());
  sheet.append(box);
  document.body.append(sheet);
}

const DRAG = {
  id: null, startX: 0, startY: 0, kind: "mouse", pointerId: null,
  target: null, timer: 0, active: false, justDragged: false, ids: null,
};

function unitDragStart(e, id) {
  if (e.button != null && e.button !== 0) return;   // primary button only
  const kind = e.pointerType || "mouse";
  Object.assign(DRAG, {
    id, kind, startX: e.clientX, startY: e.clientY,
    pointerId: e.pointerId, target: e.currentTarget,
    ids: orderedProviders().map((p) => p.id),
  });
  clearTimeout(DRAG.timer);
  if (kind !== "mouse") {
    // Hold to pick up. Without this, every attempt to scroll the row sideways
    // would reorder it.
    DRAG.timer = setTimeout(() => {
      DRAG.timer = 0;
      if (DRAG.id === id && !DRAG.active) unitDragBegin();
    }, 300);
  }
}

function unitDragBegin() {
  DRAG.active = true;
  $("unitChips").classList.add("dragging");
  $("unitBar").classList.add("chips-drag");
  const el0 = $("unitChips").querySelector(`[data-unit="${DRAG.id}"]`);
  if (el0) el0.classList.add("dragged");
  try { DRAG.target.setPointerCapture(DRAG.pointerId); } catch {}
  try { navigator.vibrate && navigator.vibrate(12); } catch {}
}

function unitDragMove(e) {
  if (!DRAG.id) return;
  if (!DRAG.active) {
    const dx = Math.abs(e.clientX - DRAG.startX), dy = Math.abs(e.clientY - DRAG.startY);
    if (DRAG.kind === "mouse") { if (dx > 5 || dy > 5) unitDragBegin(); }
    else if ((dx > 8 || dy > 8) && DRAG.timer) {
      // Moved before the hold completed: that was a scroll, not a drag.
      clearTimeout(DRAG.timer); DRAG.timer = 0; DRAG.id = null;
    }
    if (!DRAG.active) return;
  }
  const box = $("unitChips");
  const without = DRAG.ids.filter((x) => x !== DRAG.id);
  let insert = without.length;
  for (let k = 0; k < without.length; k++) {
    const n = box.querySelector(`[data-unit="${without[k]}"]`);
    if (!n) continue;
    const r = n.getBoundingClientRect();
    if (e.clientX < r.left + r.width / 2) { insert = k; break; }
  }
  const next = without.slice();
  next.splice(insert, 0, DRAG.id);
  if (next.join("|") === DRAG.ids.join("|")) return;
  DRAG.ids = next;
  S.unitOrder = next.slice();
  renderUnitChips();
  const moved = box.querySelector(`[data-unit="${DRAG.id}"]`);
  if (moved) moved.classList.add("dragged");
}

function unitDragEnd() {
  clearTimeout(DRAG.timer);
  DRAG.timer = 0;
  const was = DRAG.active;
  DRAG.active = false;
  DRAG.id = null;
  $("unitChips").classList.remove("dragging");
  $("unitBar").classList.remove("chips-drag");
  for (const n of $("unitChips").querySelectorAll(".dragged")) n.classList.remove("dragged");
  if (!was) return;
  // Swallow the click that a drag always ends with.
  DRAG.justDragged = true;
  setTimeout(() => { DRAG.justDragged = false; }, 60);
  saveUnitOrder(DRAG.ids || []);
  cloudSaveUnitOrder();
}

S.unitOrder = loadUnitOrder();

document.addEventListener("pointermove", unitDragMove);
document.addEventListener("pointerup", unitDragEnd);
document.addEventListener("pointercancel", unitDragEnd);
// Only while actually dragging, so a plain swipe still scrolls the row.
$("unitChips").addEventListener("touchmove", (e) => {
  if (DRAG.active) e.preventDefault();
}, { passive: false });

/* ══ wiring ════════════════════════════════════════════════════════════════ */
function applyNav() {

  $("navBurger").innerHTML = IC.menu;
  $("navToggle").setAttribute("aria-expanded", String(!S.navCollapsed));
  $("navToggle").title = S.navCollapsed ? "Expand sidebar" : "Collapse sidebar";

  // Collapsed rows carry their label in the tooltip instead, so the Studio
  // rows have to be redrawn with the other title text.
  if (typeof renderStudioNav === "function") renderStudioNav();
  // The council wiring is measured from real element positions, so the sidebar
  // changing width invalidates it. The delay matches the grid's transition.
  setTimeout(drawLinks, 220);
}

function applyAudioNav() {
  $("navAudioIc").innerHTML = S.muted ? IC.audioOff : IC.audioOn;
  $("navAudioLbl").textContent = S.muted ? "Audio muted" : "Audio on";

}

$("navToggle").onclick = () => { S.navCollapsed = !S.navCollapsed; applyNav(); };

$("navHistory").onclick = () => setView(S.view === "history" ? "council" : "history");
$("navDoctor").onclick = runDoctor;
$("navAudio").onclick = () => { S.muted = !S.muted; applyMute(); applyAudioNav(); if (!S.muted) beepUnit(); };
$("navHalt").onclick = cancelRun;
$("linkBtn").onclick = () => (sameOrigin ? connect().then(boot) : openSetup());

$("btnSend").onclick = start;
$("btnRefine").onclick = refine;
$("btnUndo").onclick = undoRefine;
$("btnAttach").onclick = () => $("fileIn").click();
$("fileIn").onchange = (e) => { if (e.target.files?.length) addFiles(e.target.files); e.target.value = ""; };

const composer = $("composer");
composer.addEventListener("input", () => {
  // Once they edit the rewrite by hand, "Undo refine" would throw away their
  // edit too, so it stops being offered.
  if (S.preRefine !== null) S.preRefine = null;
  setErr("refineError", null);
  autosize();
  updateEnabled();
});
composer.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); start(); }
});
composer.addEventListener("paste", (e) => {
  const files = Array.from(e.clipboardData?.files || []);
  if (files.length) addFiles(files);
});

const qbar = $("qbar");
// Not blocked by a run: the composer is where the NEXT prompt is written, and
// that includes its files.
qbar.addEventListener("dragover", (e) => { e.preventDefault(); qbar.classList.add("drag"); });
qbar.addEventListener("dragleave", () => qbar.classList.remove("drag"));
qbar.addEventListener("drop", (e) => {
  e.preventDefault();
  qbar.classList.remove("drag");
  if (e.dataTransfer.files?.length) addFiles(e.dataTransfer.files);
});

/* ══ STUDIO ════════════════════════════════════════════════════════════════
   Turns a finished verdict into another format: a table, a longer report,
   flashcards, a quiz, a mind map, a slide deck, or a two-host audio script.

   Every card is derived from ONE run, so the whole section is disabled until
   that run has a verdict. Generation is a POST that returns a job id plus an
   SSE stream, exactly like a council run — the engine drives a real browser
   for each one, so a card takes about as long as a member's answer does.

   State lives in S.studio rather than in the view, because the sidebar rows
   and the open card must read the same artifacts. Owning it in either one
   would mean the other duplicated the fetch, and the two copies would drift
   the moment a generation finished while the card was closed. */

const CARD_META = {
  table:      { label: "Data Table",     ic: "table",     accent: "var(--ac)" },
  report:     { label: "Report",         ic: "report",    accent: "var(--gold)" },
  flashcards: { label: "Flashcards",     ic: "cards",     accent: "var(--grn)" },
  quiz:       { label: "Quiz",           ic: "quiz",      accent: "var(--amber)" },
  mindmap:    { label: "Mind Map",       ic: "mindmap",   accent: "var(--acl)" },
  slides:     { label: "Slide Deck",     ic: "slides",    accent: "var(--blue)" },
  audio:      { label: "Audio Overview", ic: "audioCard", accent: "var(--ac)" },
};
const KIND_ORDER = ["table", "report", "flashcards", "quiz", "mindmap", "slides", "audio"];

const freshArtifacts = () =>
  Object.fromEntries(KIND_ORDER.map((k) => [k, { status: "idle" }]));

S.studio = { artifacts: freshArtifacts(), active: null, ui: {}, jobs: {}, cleanup: null, onKey: null };

/** One-line status per card, shared by the sidebar row and the open viewer so
 *  the two can never describe the same artifact differently. */
function statusHint(a) {
  return {
    idle: "Not generated yet",
    pending: "Queued…",
    running: "Generating…",
    complete: `Ready — ${a.provider_id || "generated"}`,
    failed: a.error_detail || "Generation failed",
  }[a.status];
}

/** Studio needs a completed run to derive from — the engine refuses otherwise
 *  (400: "Studio needs a completed run"), so the nav is gated on the same
 *  condition rather than letting the click fail. */
/* Studio derives from a verdict that is ON SCREEN. Tied to the same
   ownership as the grid: when a brainstorm session takes the screen the
   deliberation behind it is gone, and offering to build a slide deck from
   something no longer shown is a half-state. */
const studioEnabled = () => !!(S.runId && S.gridOwner === "council"
  && S.runLocal && S.verdict && S.verdict.synthesis_ok && online());

function resetStudio() {
  releaseStudioCard();
  S.studio.artifacts = freshArtifacts();
  S.studio.active = null;
  S.studio.ui = {};
  S.studio.jobs = {};
  show($("studioView"), false);
  renderStudioNav();
}

/** Restore already-generated cards for this run. Same "a reload recovers state
 *  from SQLite" principle the council run already has: a card generated an hour
 *  ago is still on disk and should come back without regenerating it. */
async function loadStudio() {
  if (!S.runId || !online()) return;
  try {
    const r = await fetch(`${link.api}/api/runs/${S.runId}/studio`, authed());
    const rows = await r.json();
    for (const row of rows) {
      if (row.kind in S.studio.artifacts) {
        S.studio.artifacts[row.kind] = {
          status: row.status,
          provider_id: row.provider_id,
          raw_text: row.raw_text,
          parsed_json: row.parsed_json,
          error_detail: row.error_detail,
        };
        // Still generating (started before a reload, or on another tab):
        // follow it to the end. This used to restore it as "pending" and never
        // look again, so the card spun for ever even after it had finished.
        if ((row.status === "pending" || row.status === "running") && !S.studio.jobs[row.kind]) {
          S.studio.jobs[row.kind] = row.id;
          followStudioJob(row.kind, S.runId, row.id);
        }
      }
    }
  } catch {}
  renderStudioNav();
  if (S.studio.active) renderStudioView();
}

/** Follow one Studio job to its end over SSE, and survive losing the stream.
 *
 *  Every update is checked against the job it belongs to: a card regenerated
 *  while this one ran, or a different deliberation opened meanwhile, must not
 *  have this job's result written over it. If the stream drops, the job's row
 *  is read back -- a finished card is shown, a live one is followed again, and
 *  one the engine no longer knows (it restarted) is reported as interrupted
 *  rather than left spinning. */
function followStudioJob(kind, runId, jobId, tries = 0) {
  const mine = () => S.runId === runId && S.studio.jobs[kind] === jobId;
  const settle = (a) => {
    if (!mine()) return;
    S.studio.artifacts[kind] = a;
    delete S.studio.jobs[kind];
    renderStudioNav();
    if (S.studio.active === kind) renderStudioView();
    // Each card costs a real browser run, so mirroring it means a phone
    // OPENS one instead of re-earning it. The index write behind this is
    // debounced, so generating three cards in a row is still one write.
    if (a.status === "complete") cloudPushRun(runId);
  };
  let finished = false;
  const es = new EventSource(streamUrl(`/api/runs/${runId}/studio/${jobId}/stream`));
  es.onmessage = (ev) => {
    if (!mine()) { es.close(); return; }
    const msg = JSON.parse(ev.data);
    if (msg.type === "state") {
      // Progress arrives on every poll; the card only needs to know once
      // that it has moved from queued to generating.
      if (S.studio.artifacts[kind].status !== "running") {
        S.studio.artifacts[kind].status = "running";
        renderStudioNav();
        if (S.studio.active === kind) renderStudioView();
      }
    } else if (msg.type === "done") {
      finished = true; es.close();
      settle({
        status: msg.status, provider_id: msg.provider_id,
        raw_text: msg.raw_text, parsed_json: msg.parsed_json,
        error_detail: msg.error_detail,
      });
    } else if (msg.type === "error") {
      finished = true; es.close();
      settle({ status: "failed", error_detail: msg.message });
    }
  };
  es.onerror = async () => {
    es.close();
    if (finished || !mine()) return;
    let row = null;
    try {
      const r = await fetch(`${link.api}/api/runs/${runId}/studio/${jobId}`, authed());
      if (r.ok) row = await r.json();
    } catch {}
    if (!mine()) return;
    if (row && (row.status === "complete" || row.status === "failed")) {
      settle({
        status: row.status, provider_id: row.provider_id,
        raw_text: row.raw_text, parsed_json: row.parsed_json,
        error_detail: row.error_detail,
      });
    } else if (tries < 3 && online()) {
      setTimeout(() => mine() && followStudioJob(kind, runId, jobId, tries + 1), 2500);
    } else {
      settle({ status: "failed",
               error_detail: "Lost track of this card — the engine may have restarted. Generate it again." });
    }
  };
}

function generateStudio(kind) {
  if (!studioEnabled()) return;
  const runId = S.runId;
  S.studio.artifacts[kind] = { status: "pending" };
  // A regenerate must drop the previous card's interaction state, or a quiz
  // would keep the answers picked against questions that no longer exist.
  delete S.studio.ui[kind];
  renderStudioNav();
  if (S.studio.active === kind) renderStudioView();

  // The CURRENT unit selection goes with every card. Unticking a member must
  // stop it being driven at all -- it is a paid account and an explicit
  // instruction -- and without this the engine reused the run's stored
  // chairman, so unticking Claude still produced "Ready - claude".
  const pickForm = new FormData();
  pickForm.append("providers", [...S.selected].join(","));
  fetch(`${link.api}/api/runs/${runId}/studio/${kind}`,
        authed({ method: "POST", body: pickForm }))
    // Checked, not assumed. A refusal (404 unknown run, 400 no verdict) is
    // JSON too -- it just has `detail` where `job_id` should be, so the old
    // code opened a stream at /studio/undefined/stream and the card sat on
    // "Queued..." for ever with nothing said.
    .then(async (r) => {
      const d = await r.json().catch(() => null);
      if (!r.ok || !d || !d.job_id) {
        throw new Error((d && d.detail) || `the engine returned ${r.status}`);
      }
      return d;
    })
    .then(({ job_id }) => {
      // Kept so Cancel has something to cancel. Cleared when the job settles,
      // so a stale id can never be sent for a card that already finished.
      S.studio.jobs[kind] = job_id;
      if (S.studio.active === kind) renderStudioView();
      followStudioJob(kind, runId, job_id);
    })
    .catch((e) => {
      // What the engine actually said. "Request failed." was true of every
      // refusal and useful for none of them.
      S.studio.artifacts[kind] = {
        status: "failed",
        error_detail: (e && e.message) || "Request failed.",
      };
      renderStudioNav();
      if (S.studio.active === kind) renderStudioView();
    });
}

/** Clicking a card generates it if it has never run, and always opens it — so
 *  one click does the obvious thing whether the artifact exists yet or not. */
function openStudio(kind) {
  if (!studioEnabled()) return;
  S.studio.active = kind;
  setView("council");
  if (S.studio.artifacts[kind].status === "idle") generateStudio(kind);
  renderStudioNav();
  renderStudioView();
}

/** What the open card holds that outlives its DOM: speech in progress, a
 *  presentation overlay on <body>, a keyboard handler. Dropped on every
 *  re-render and on close, so none of it outlives the card that made it. */
function releaseStudioCard() {
  const fn = S.studio.cleanup;
  S.studio.cleanup = null;
  S.studio.onKey = null;
  if (fn) try { fn(); } catch {}
}

function closeStudio() {
  releaseStudioCard();
  S.studio.active = null;
  show($("studioView"), false);
  renderStudioNav();
  setView("council");
}

/** Stop a card that is still generating.
 *
 *  Marks it failed locally the moment the request is sent rather than waiting
 *  for the stream to notice: the engine's cancel Event is checked between
 *  steps, so the browser it already opened still has to unwind, and a UI that
 *  sat on "Generating…" for those seconds would look like Cancel had done
 *  nothing -- the same complaint the doctor's Stop earned. */
async function cancelStudio(kind) {
  const jobId = S.studio.jobs[kind];
  const a = S.studio.artifacts[kind];
  if (!a || (a.status !== "pending" && a.status !== "running")) return;
  S.studio.artifacts[kind] = { status: "failed", error_detail: "Cancelled." };
  delete S.studio.jobs[kind];
  renderStudioNav();
  if (S.studio.active === kind) renderStudioView();
  if (!jobId || !online()) return;
  try {
    await fetch(`${link.api}/api/runs/${S.runId}/studio/${jobId}/cancel`,
                authed({ method: "POST" }));
  } catch { /* the card is already shown as cancelled; nothing to add */ }
}

function renderStudioNav() {
  const sec = $("studioSec");
  const enabled = studioEnabled();
  show($("studioNote"), !enabled);
  // Three different reasons a card cannot be built, and "Available once a
  // verdict is reached" is only one of them. A row greyed out with the wrong
  // explanation reads as a bug in the program rather than a fact about this
  // deliberation.
  const note = $("studioNote");
  if (!enabled) {
    note.textContent =
      !online()
        ? "Needs the engine device to be awake."
      : (S.runId && S.gridOwner === "council" && !S.runLocal)
        ? "This deliberation is synced from another device. Cards already " +
          "built travel with it, but new ones have to be made where it ran."
      : "Available once a verdict is reached.";
  }
  for (const el of sec.querySelectorAll(".studio-row")) el.remove();

  const before = sec.querySelector(".side-item.disabled"); // the Video tile
  for (const kind of KIND_ORDER) {
    const meta = CARD_META[kind];
    const a = S.studio.artifacts[kind];
    const busy = a.status === "pending" || a.status === "running";
    const b = el("button", `side-item studio-row ${S.studio.active === kind ? "active" : ""}`);
    b.type = "button";
    b.style.setProperty("--sa", meta.accent);
    b.disabled = !enabled;
    b.title = S.navCollapsed ? meta.label : statusHint(a);
    b.setAttribute("aria-current", String(S.studio.active === kind));
    const sic = el("span", "side-ic studio-ic");
    sic.innerHTML = IC[meta.ic];
    b.append(sic, el("span", "side-label", meta.label));
    const tag = el("span", "side-tag");
    if (busy) tag.append(spinnerEl());
    else tag.textContent = a.status === "complete" ? "✓" : a.status === "failed" ? "!" : "";
    b.append(tag);
    b.onclick = () => openStudio(kind);
    sec.insertBefore(b, before);
  }
}

function renderStudioView() {
  releaseStudioCard();
  const kind = S.studio.active;
  const view = $("studioView");
  show(view, !!kind);
  if (!kind) return;
  const meta = CARD_META[kind], a = S.studio.artifacts[kind];
  const busy = a.status === "pending" || a.status === "running";

  view.style.setProperty("--sa", meta.accent);
  $("studioIc").innerHTML = IC[meta.ic];
  $("studioTitle").textContent = meta.label;
  $("studioStatus").textContent = statusHint(a);
  show($("studioRegen"), a.status === "complete");
  // A card drives a real browser against a paid account for the better part of
  // a minute. Without this, "Generating…" was a state whose only exit was
  // waiting it out -- the run grid and brainstorm rounds both had a Halt and
  // this did not.
  show($("studioCancel"), busy);

  const body = $("studioBody");
  body.textContent = "";
  if (busy) {
    const w = el("div", "empty-state");
    w.append(spinnerEl(), document.createTextNode(` Generating ${meta.label.toLowerCase()}…`));
    const stop = el("button", "studio-regen", "Cancel");
    stop.type = "button";
    stop.style.marginLeft = "12px";
    stop.onclick = () => cancelStudio(kind);
    w.append(stop);
    body.append(w);
    return;
  }
  if (a.status === "idle") { body.append(el("div", "empty-state", "Not generated yet.")); return; }
  if (a.status === "failed") {
    const c = el("div", "callout");
    c.append(
      el("div", "kind", "generation failed"),
      el("div", "cause", a.error_detail || "The provider did not return usable output."),
    );
    const again = el("button", "studio-regen", "Try again");
    again.type = "button";
    again.onclick = () => generateStudio(kind);
    c.append(again);
    body.append(c);
    return;
  }
  body.append(renderCard(kind, a));
}

/** Raw text fallback: shown whenever no parser found anything usable in an
 *  otherwise-successful generation. Degrade to plain text rather than hide a
 *  real response the provider actually gave. */
const rawFallback = (text) => el("pre", "studio-raw", text || "");

/* ── Studio parsing, in the console ─────────────────────────────────────────
   Every structured card is parsed HERE from raw_text, not from the engine's
   parsed_json. The engine's parsers split on markers that sit alone on their
   own line ("CARD 1" / "HOST A:") -- but a chat page's capture regularly comes
   back with its newlines gone ("...into the atmosphere.CARD 2 FRONT: ..."), so
   a whole deck parsed as nothing and a whole podcast as one line. Parsing on
   the console also means a card generated before this change renders in the
   new UI straight away, with no engine restart and no regeneration.
   parsed_json is still the fallback when these find nothing. */

/** "**FRONT:**", "**FRONT**:", "__TITLE__:" -> "FRONT:", so every parser sees
 *  one label shape whichever way a model decided to bold it. */
const studioClean = (raw) => String(raw || "")
  .replace(/\r/g, "")
  .replace(/(\*\*|__)\s*([A-Z][A-Z ]{0,18}?\s*\d{0,2})\s*(:?)\s*\1\s*(:?)/g,
           (m, _w, label, c1, c2) => (/^(CARD|FRONT|BACK|SLIDE|TITLE|CORRECT|WHY|HOST|ROOT|Q)\b/i.test(label)
             ? `${label}${c1 || c2}` : m))
  .trim();

/** Splits text on a numbered marker ("CARD 3", "Q3.", "SLIDE 3") and returns
 *  the bodies of the LAST numbered run. A capture sometimes holds the answer
 *  twice -- a draft and then the final, both numbered from 1 -- and sixteen
 *  slides that are two copies of eight is worse than eight. */
function numberedBlocks(text, marker, punct = "[:.)\\-–—]?") {
  // Uppercase markers match anywhere, even glued to the previous word
  // ("...recycled waterSLIDE 1") -- that is exactly what a lost newline looks
  // like. Any other casing ("Slide 1") only counts at the start of a line and
  // with punctuation after it, so prose that mentions "slide 3" never splits.
  const tail = String.raw`\s*(\d{1,3})\s*${punct}\s*`;
  const strict = String.raw`\s*(\d{1,3})\s*(?:[:.)\-–—]|(?=\n)|$)\s*`;
  const anyCase = marker.replace(/[A-Za-z]/g, (c) => `[${c.toUpperCase()}${c.toLowerCase()}]`);
  const re = new RegExp(String.raw`(?<![A-Z0-9])${marker}${tail}|(?<=^|\n)[ \t]*${anyCase}${strict}`, "g");
  const num = (m) => +(m[1] || m[2]);
  // Only an unbroken 1, 2, 3... sequence counts, so "Q4 earnings" inside
  // question 2 stays text rather than becoming a fourth question.
  const hits = [];
  let start = 0;
  for (const m of text.matchAll(re)) {
    const n = num(m);
    if (n === 1) { start = hits.length; hits.push(m); }
    else if (hits.length && n === num(hits[hits.length - 1]) + 1) hits.push(m);
  }
  const out = [];
  for (let k = start; k < hits.length; k++) {
    const e = k + 1 < hits.length ? hits[k + 1].index : text.length;
    out.push(text.slice(hits[k].index + hits[k][0].length, e).trim());
  }
  return out;
}

function studioParseFlashcards(raw) {
  const c = studioClean(raw);
  const blocks = numberedBlocks(c, "CARD");
  const t = blocks.length ? blocks.join("\n") : c;
  const cards = [];
  const re = /FRONT\s*:\s*([\s\S]*?)\s*BACK\s*:\s*([\s\S]*?)\s*(?=FRONT\s*:|$)/gi;
  let m;
  while ((m = re.exec(t))) {
    const front = m[1].trim(), back = m[2].trim();
    if (front && back) cards.push({ front, back });
  }
  return cards;
}

function studioParseQuiz(raw) {
  const out = [];
  for (const block of numberedBlocks(studioClean(raw), "Q(?:uestion)?", "[.):]")) {
    const cm = block.match(/(?<![A-Z])(?:CORRECT(?:\s+ANSWER)?|ANSWER|[Cc]orrect(?:\s+answer)?|[Aa]nswer)\s*[:\-–]\s*\(?\s*([A-Da-d])\b/);
    if (!cm) continue;
    const body = block.slice(0, cm.index);
    const wm = block.slice(cm.index + cm[0].length)
      .match(/(?<![A-Z])(?:WHY|EXPLANATION|[Ww]hy|[Ee]xplanation)\s*[:\-–]\s*([\s\S]*)$/);
    // Walk back from the end: the last D, then the last C before it, then B,
    // then A. A letter inside the question itself ("Plan B. ...") sits BEFORE
    // the real option markers, so searching backwards never lands on it.
    const marks = [];
    let end = body.length;
    for (const L of ["D", "C", "B", "A"]) {
      const re = new RegExp(String.raw`(?:^|\s)\(?${L}[.):]\s+`, "g");
      const head = body.slice(0, end);
      let mm, last = null;
      while ((mm = re.exec(head))) last = mm;
      if (last) { marks.unshift({ L, at: last.index, len: last[0].length }); end = last.index; }
    }
    if (marks.length < 2) continue;
    const text = body.slice(0, marks[0].at).trim();
    const options = {};
    marks.forEach((mk, i) => {
      const stop = i + 1 < marks.length ? marks[i + 1].at : body.length;
      options[mk.L] = body.slice(mk.at + mk.len, stop).trim();
    });
    const correct = cm[1].toUpperCase();
    if (!text || !(correct in options)) continue;
    out.push({ text, options, correct, why: wm ? wm[1].trim() : "" });
  }
  return out;
}

function studioParseSlides(raw) {
  const slides = [];
  for (let b of numberedBlocks(studioClean(raw), "SLIDE")) {
    b = b.replace(/^TITLE\s*:\s*/i, "");
    let title, rest;
    const nl = b.indexOf("\n");
    if (nl >= 0) { title = b.slice(0, nl); rest = b.slice(nl + 1); }
    else {
      // All on one line: the title runs up to the first " - " bullet.
      const k = b.search(/\s[-•*]\s+/);
      title = k >= 0 ? b.slice(0, k) : b; rest = k >= 0 ? b.slice(k) : "";
    }
    const bullets = /\n/.test(rest.trim())
      ? rest.split("\n").map((l) => l.trim()).filter(Boolean)
          .map((l) => l.replace(/^(?:[-•*]|\d+[.)])\s+/, ""))
      : rest.split(/(?:^|\s)[-•*]\s+/).map((s) => s.trim()).filter(Boolean);
    title = title.replace(/^#+\s*/, "").trim();
    if (title || bullets.length) slides.push({ title, bullets });
  }
  return slides;
}

function studioParseAudio(raw) {
  const t = studioClean(raw);
  // Uppercase HOST matches even glued to the previous word, as the numbered
  // markers do; "Host A:" only at the start of a line.
  const hits = [...t.matchAll(/(?<![A-Z])HOST\s*([AB12])\s*:\s*|(?<=^|\n)[ \t]*[Hh]ost\s*([AB12ab])\s*:\s*/g)];
  return hits.map((m, i) => {
    const e = i + 1 < hits.length ? hits[i + 1].index : t.length;
    const sp = (m[1] || m[2]).toUpperCase();
    return { speaker: sp === "1" ? "A" : sp === "2" ? "B" : sp, text: t.slice(m.index + m[0].length, e).trim() };
  }).filter((l) => l.text);
}

/** ROOT: plus a dash outline, two levels deep. Deeper nesting is flattened
 *  onto the second level -- a badly indented answer still draws. */
function studioParseMindmap(raw) {
  let root = "";
  const branches = [];
  let stack = [];
  // A capture that lost its newlines: " - " runs become bullets again.
  let t = studioClean(raw);
  if (!/\n\s*[-•*]\s/.test(t)) t = t.replace(/\s[-•*]\s+/g, "\n- ");
  for (const line of t.split("\n")) {
    if (!line.trim()) continue;
    const rm = line.match(/^\s*ROOT\s*:\s*(.+)$/i);
    if (rm) { root = rm[1].trim(); continue; }
    const bm = line.match(/^(\s*)[-•*]\s+(.*)$/);
    if (!bm) { if (!root && !branches.length) root = line.replace(/^#+\s*/, "").trim(); continue; }
    const indent = bm[1].replace(/\t/g, "  ").length;
    const node = { text: bm[2].trim(), children: [] };
    while (stack.length && indent <= stack[stack.length - 1][0]) stack.pop();
    if (!stack.length) branches.push(node);
    else stack[0][1].children.push(node);
    stack.push([indent, node]);
  }
  return root || branches.length ? [{ root, branches }] : [];
}

const STUDIO_PARSE = {
  mindmap:    [studioParseMindmap, null],
  flashcards: [studioParseFlashcards, "cards"],
  quiz:       [studioParseQuiz, "questions"],
  slides:     [studioParseSlides, "slides"],
  audio:      [studioParseAudio, "lines"],
};

/** The card's items: the console's parse of raw_text first, the engine's
 *  parsed_json only when that finds nothing. */
function studioItems(kind, a) {
  const [parse, key] = STUDIO_PARSE[kind];
  let items = [];
  try { items = parse(a.raw_text || ""); } catch { items = []; }
  if (items.length) return items;
  const d = a.parsed_json;
  if (!key) return d && (d.root || (d.branches || []).length) ? [d] : [];
  return (d && Array.isArray(d[key])) ? d[key] : [];
}

/* ── shared pieces ── */

/** Inline markdown (bold, italics, code, links) as DOM -- the same renderer
 *  the verdict uses, so a card never shows literal asterisks. */
const mdSpan = (text, cls, tag = "span") => inline(el(tag, cls), text);

/** Strips inline markdown for sorting, searching and CSV. */
const mdPlain = (s) => String(s || "")
  .replace(/\[([^\]]+)\]\([^)]*\)/g, "$1")
  .replace(/\*\*|__|~~|`/g, "")
  .replace(/(^|[^\w*])[*_](?=\S)|(?<=\S)[*_](?![\w*])/g, "$1")
  .replace(/\\([\\`*_{}[\]()#+\-.!|~>])/g, "$1")
  .trim();

function stBtn(label, icon, onClick, cls = "", title = "") {
  const b = el("button", `st-btn ${cls}`.trim());
  b.type = "button";
  if (icon) b.append(icSpan("st-btn-ic", icon));
  if (label) b.append(el("span", "st-btn-txt", label));
  if (title || !label) { b.title = title || label; b.setAttribute("aria-label", title || label); }
  b.onclick = onClick;
  return b;
}

function downloadText(name, text, type = "text/plain") {
  const url = URL.createObjectURL(new Blob([text], { type: `${type};charset=utf-8` }));
  const a = el("a");
  a.href = url; a.download = name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

const studioFileName = (suffix, ext) =>
  `magi-${suffix}-${new Date().toISOString().slice(0, 10)}.${ext}`;

/** Horizontal swipe on touch screens. A swipe never also counts as a tap. */
function onSwipe(node, left, right) {
  let x0 = null, y0 = 0;
  node.addEventListener("touchstart", (e) => {
    const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY;
  }, { passive: true });
  node.addEventListener("touchend", (e) => {
    if (x0 == null) return;
    const t = e.changedTouches[0];
