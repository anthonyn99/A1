  .gate-card.open { width: 100%; }
  .gate-av { width: 60px; height: 60px; flex-basis: 60px; font-size: 27px; }
}

.lock-in {
  width: 100%; background: var(--bg); border: 1px solid var(--bd);
  border-radius: var(--r-btn); padding: 11px 12px; color: var(--tx);
  font-size: 15px; outline: 0; margin-bottom: 9px;
}
.lock-in:focus { border-color: var(--ac); }
.lock-row { display: flex; gap: 8px; margin-top: 4px; }
.lock-row .btn { flex: 1; justify-content: center; }
.lock-msg { min-height: 17px; font-size: 11.5px; color: var(--red); text-align: center; margin-top: 10px; }
.lock-msg.ok { color: var(--grn); }
/* Outlined like every other control on this screen. It was the one bare
   text link among four framed buttons, which read as a footnote rather than
   as the way out -- and it is the way out. */
.lock-link {
  display: block; width: 100%; margin-top: 12px; background: none;
  border: 1px solid var(--bd); border-radius: var(--r-btn);
  padding: 9px 14px;
  color: var(--txm); font: inherit; font-size: 11px; text-align: center;
}
.lock-link:hover { color: var(--ac); border-color: var(--ac); }
.lock-bio { margin-top: 12px; }
.lock-bio .btn { width: 100%; justify-content: center; }
/* A wrong password shakes rather than only printing -- the message is small
   and easy to miss when you are typing fast. */
@keyframes lock-shake {
  0%,100% { transform: translateX(0); }
  20%,60% { transform: translateX(-6px); }
  40%,80% { transform: translateX(6px); }
}
.gate-card.shake { animation: lock-shake .32s; }

/* The profile chip. Reads as a person, not as an icon button -- a coloured
   dot with a name beside it, so "whose MAGI is this?" is answered without
   hovering anything. Collapses to the avatar alone where the rail is narrow. */
.prof-btn {
  display: inline-flex; align-items: center; gap: 7px;
  height: 26px; padding: 0 9px 0 4px;
  background: none;
  border: 1px solid color-mix(in srgb, var(--pc) 45%, transparent);
  border-radius: 999px; color: var(--tx); font: inherit; cursor: pointer;
  max-width: 100%; min-width: 0;
}
.prof-btn:hover { border-color: var(--pc); }
/* Outlined, like the gate's. A tinted disc behind a person's mark reads as a
   selected state rather than as an identity, and it is only ever an identity. */
.prof-av {
  width: 18px; height: 18px; flex: 0 0 18px;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; line-height: 1; border-radius: 50%;
  background: none;
  border: 1px solid var(--pc);
}
.prof-name {
  font-size: 11px; font-weight: 600; letter-spacing: .2px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.nav-collapsed .sidebar .prof-btn { display: none; }

/* The engine chip, and the rows inside its picker. A dot carries the state
   -- connected, seen recently, cold -- because a row that spells it out in
   words is a row that no longer fits a phone. */
.eng-btn {
  display: inline-flex; align-items: center; gap: 6px;
  height: 26px; padding: 0 10px;
  background: none; border: 1px solid var(--bd); border-radius: 999px;
  color: var(--txd); font: inherit; font-size: 11px; cursor: pointer;
  max-width: 100%; min-width: 0;
}
.eng-btn:hover { border-color: var(--ac); color: var(--tx); }
.eng-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.eng-dot {
  width: 7px; height: 7px; flex: 0 0 7px; border-radius: 50%;
  background: var(--txm); opacity: .5;
}
.eng-dot.on { background: var(--grn); opacity: 1; }
.eng-dot.warm { background: var(--amber); opacity: .9; }
.nav-collapsed .sidebar .eng-btn { display: none; }
.eng-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
.eng-row {
  display: flex; align-items: center; gap: 10px;
  border: 1px solid var(--bd); border-radius: var(--r-btn); padding: 10px 11px;
}
.eng-row.on { border-color: var(--ac); }
.eng-mid { flex: 1 1 auto; min-width: 0; }
.eng-in {
  width: 100%; background: none; border: 0; padding: 0;
  color: var(--tx); font: inherit; font-size: 13px; font-weight: 600; outline: 0;
}
.eng-in:focus { color: var(--ac); }
.eng-sub { font-size: 11px; color: var(--txm); margin-top: 2px; }
.eng-x {
  flex: 0 0 auto; width: 26px; height: 26px; padding: 0;
  display: flex; align-items: center; justify-content: center;
  background: none; border: 0; border-radius: 6px; color: var(--txm); cursor: pointer;
}
.eng-x:hover { color: var(--red); }
.eng-x svg { width: 14px; height: 14px; }
.eng-add { display: flex; gap: 8px; align-items: flex-start; }
.eng-add .lock-in { margin-bottom: 0; }
@media (max-width: 430px) {
  .eng-add { flex-direction: column; }
  .eng-add .btn { width: 100%; justify-content: center; }
}
@media (max-width: 760px) {
  /* The mobile bar is 40px of very contested space: the dot alone still says
     which person, and the gate says the name in full the moment you tap it. */
  #profBtnM { padding: 0; width: 26px; justify-content: center; }
  #profBtnM .prof-name { display: none; }
}

/* The header control. Sits at the right of the sidebar's top row, where the
   screenshot put it. */
.lock-btn svg { width: 15px; height: 15px; display: block; }
.lock-btn {
  width: 30px; height: 30px; flex-shrink: 0; margin-left: auto;
  display: flex; align-items: center; justify-content: center;
  background: transparent; border: 1px solid var(--bd);
  border-radius: var(--r-btn); color: var(--txm); font-size: 13px;
}
.lock-btn:hover { border-color: var(--ac); color: var(--ac); }
.lock-btn.unset { color: var(--txm); opacity: .6; }
.nav-collapsed .sidebar .lock-btn { display: none; }
.nav-collapsed .sidebar a1-lifehub { display: none; }
/* The top bar's copy exists only on mobile, where .mtop itself is hidden
   above the breakpoint -- so no separate rule is needed to hide it. */
.mtop .lock-btn { margin-left: 4px; }
/* Two rows: toggle + brand on the first, the header's buttons (help, lock,
   LifeHub) together on a second row, flush right. Sharing one row with three
   buttons left the tagline ~90px and it clipped to "DELIBERATION SYSTE"
   however the tracking was trimmed; on its own row it has the whole rail. */
/* Top-aligned rather than centred, so the toggle sits at the same height
   whether the rail is expanded (two rows) or collapsed (toggle alone) -- the
   same no-jump rule the fixed height above exists for. */
.side-top { flex-wrap: wrap; align-content: flex-start; row-gap: 6px; }
.side-top .side-toggle { align-self: flex-start; }
.side-top .side-brand { flex: 1 1 0; }
.side-actions { flex: 0 0 100%; display: flex; justify-content: flex-end; align-items: center; gap: 6px; }
.nav-collapsed .side-actions { display: none; }
.side-top .lock-btn { margin-left: 0; width: 26px; height: 26px; }
.side-top .lock-btn svg { width: 15px; height: 15px; }
@media (max-width: 760px) { .sidebar .lock-btn { display: flex; } }

/* Pull-to-refresh indicator. Parked above the top of the scroller and pulled
   into view by the gesture, so it costs no layout when idle. */
.ptr {
  position: absolute; top: -44px; left: 0; right: 0;
  display: flex; align-items: center; justify-content: center;
  height: 36px; pointer-events: none; opacity: 0;
  /* Above the sticky mobile top bar (z-index 60), which is a SIBLING inside
     .page -- at 40 the indicator slid down behind it and disappeared exactly
     as the gesture became meaningful. Still below the drawer scrim (70) and
     the drawer itself (80), which is correct: the gesture is inert while the
     drawer is open, so it must never paint over it. */
  z-index: 65;
}
.ptr-spin {
  display: flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--s2); border: 1px solid var(--bdl);
  box-shadow: 0 4px 14px var(--shadow);
  color: var(--txm);
}
.ptr-spin svg { width: 18px; height: 18px; display: block; }
.ptr.ready .ptr-spin { color: var(--ac); border-color: var(--ac); }
.ptr.spinning .ptr-spin { color: var(--ac); border-color: var(--ac); }
.ptr.spinning .ptr-spin svg { animation: spin .8s linear infinite; }
/* The page is the scroller, so the indicator anchors to it. */
.page { position: relative; }

/* Reaching either end of a scroller does NOTHING: no rubber band, and no
   handing the gesture on to whatever is behind it. On a phone the drawer was
   chaining its overscroll to the page underneath, so pulling past the bottom
   of the sidebar slid the background into view through it. Set at every width
   rather than only on mobile -- a trackpad chains the same way. */
.page, .sidebar, .side-nav, .node-body, .bs-council-body,
.audio-transcript, .sheet-box { overscroll-behavior: none; }

/* ══ OVERLAY SCROLLBARS ════════════════════════════════════════════════════
   A phone gives you no scrollbar at all, so a long verdict has no indication
   of how much is left and no way to jump; a desktop gives you the platform's,
   which on Windows is a permanent light-grey slab that fights everything else
   on the page. This is one behaviour for both: nothing while you are reading,
   a thumb while you are moving, and something you can actually grab -- with a
   finger or a cursor.

   The bar is a FIXED overlay positioned from the scroller's own rect rather
   than a child of it. A child would either scroll away with the content or
   need the scroller restructured; every scroller here (the page, an open
   answer, the drawer) then needs the same exception. Reading the rect works
   for all of them and adds nothing to their markup. */
[data-sbar] { scrollbar-width: none; -ms-overflow-style: none; }
[data-sbar]::-webkit-scrollbar { width: 0; height: 0; }

.sbar {
  position: fixed; width: 14px;
  /* Parked off-screen and zero-height until place() has measured its scroller.
     A fixed box with `top`/`left` unset falls back to its STATIC position --
     which for a body child is wherever the flow happens to leave it, and the
     thumb inside carries its own absolute offset. That is the "scrollbar
     flashed in the middle of the screen" on a view change: a bar shown before
     it had been measured. It cannot happen from here. */
  top: 0; left: -9999px; height: 0;
  pointer-events: none;          /* only the thumb is a target, and only when
                                    it is visible -- an always-live 14px strip
                                    down the right edge would eat back-swipes */
  opacity: 0; visibility: hidden;
  /* visibility flips instantly ON and only after the fade OFF, so a hidden bar
     genuinely cannot paint and the fade-out still reads as a fade. */
  transition: opacity .25s ease, visibility 0s linear .25s;
  z-index: 70;                   /* over page content (60/65), under the
                                    drawer (80) and any sheet (200) */
}
.sbar.on {
  opacity: 1; visibility: visible;
  transition: opacity .25s ease, visibility 0s;
}
.sbar-thumb {
  position: absolute; right: 4px; width: 5px;
  border-radius: 999px; background: var(--bdl);
  transition: background .15s ease, width .12s ease, right .12s ease;
}
.sbar.on .sbar-thumb { pointer-events: auto; touch-action: none; cursor: grab; }
/* A fatter, accented thumb the moment it is worth aiming at. The widening is
   what makes a 5px target grabbable without giving 14px of edge away when it
   is not wanted. */
.sbar-thumb:hover, .sbar.dragging .sbar-thumb {
  background: var(--ac); width: 9px; right: 2px;
}
.sbar.dragging .sbar-thumb { cursor: grabbing; }
/* Coarse pointers cannot hover, so the resting thumb has to be big enough to
   hit on the first try. */
@media (pointer: coarse) {
  .sbar-thumb { width: 7px; right: 3px; }
}
@media (prefers-reduced-motion: reduce) {
  .sbar, .sbar-thumb { transition: none; }
}

/* Sync state, under the wordmark -- the same place and the same wording
   TaskHub uses, so "Syncing… / Synced / Sync failed" means the same thing
   everywhere in the suite. It reserves no space when idle: a line that
   appears and disappears under a logo is less noise than a permanent
   "Synced" nobody reads. */
.syncline {
  /* min-height + line-height, never a fixed height: 10px text needs more than
     10px of box once descenders and the ellipsis in "Syncing…" are counted,
     and a hard height cropped them. Reserving the space keeps the wordmark
     from jumping when the line appears. */
  font-size: 10px; font-weight: 600; white-space: nowrap;
  letter-spacing: .2px; margin-top: 3px;
  min-height: 15px; line-height: 15px; overflow: visible;
  visibility: hidden; color: var(--txm);
}
.syncline.on { visibility: visible; }
.syncline.saving { color: var(--txm); }
.syncline.saved  { color: var(--grn); }
.syncline.error  { color: var(--red); }
.syncline.off    { color: var(--txm); }

/* ══ SIDEBAR GROUPS ════════════════════════════════════════════════════════
   Each section is a card. Before this the sections were separated only by a
   label and some margin, so History, Doctor, Brainstorm and Studio's seven
   rows read as one long undifferentiated column -- and Studio in particular
   looked like it belonged to Brainstorm above it.

   The card does the grouping that whitespace alone was failing to do: a
   surface a step up from the rail, a hairline, and the section label sitting
   ON the card rather than floating above a gap. */
.side-nav { gap: 10px; padding: 10px 8px 14px; }

.side-sec {
  background: var(--s1);
  border: 1px solid var(--bd);
  border-radius: var(--r-card);
  padding: 8px 7px;
  gap: 1px;
  margin-top: 0;
}
.side-sec-hd {
  padding: 2px 7px 6px;
  margin: 0;
  color: var(--txm);
  font-size: 9px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase;
}
.side-sec-note { padding: 0 7px 6px; }

/* The two loose rows at the top -- New deliberation and Council -- are the
   program's primary actions, not a section, so they get their own card
   without a heading rather than being dropped into one that needs a name. */
.side-primary {
  display: flex; flex-direction: column; gap: 1px;
  background: var(--s1); border: 1px solid var(--bd);
  border-radius: var(--r-card); padding: 7px;
}

/* Rows sit INSIDE a card now, so their own hover surface has to step up
   again or it disappears against the card. */
.side-item { border-radius: var(--r-btn); }
.side-item:hover:not(:disabled):not(.disabled) { background: var(--s3); }
.side-item.active { background: color-mix(in srgb, var(--ac) 20%, var(--s2)); }

/* Collapsed, the cards would be seven near-identical squares stacked in a
   56px rail, which is worse than no grouping at all. */
.nav-collapsed .side-sec,
.nav-collapsed .side-primary {
  background: none; border: 0; padding: 0; border-radius: 0;
}
.nav-collapsed .side-sec + .side-sec { border-top: 1px solid var(--bd); padding-top: 8px; }

/* ══ HOVER ═════════════════════════════════════════════════════════════════
   Every interactive control gives feedback on hover.

   The filled purple buttons gave none: `.btn:hover` only set border-color to
   --ac, and `.btn.active` already HAS an --ac border, so hovering Convene,
   Unlock or Lock now changed literally nothing. A brightness shift works for
   both shapes at once -- it lightens a filled button and lifts an outlined
   one's text and border together -- so one rule covers the whole program
   rather than a bespoke hover per control.

   :active presses it back down, so a click reads as a click on a touchscreen
   too, where there is no hover at all. */
.btn:not(:disabled):hover,
.navitem:not(:disabled):hover,
.chip:not(:disabled):hover,
.quiz-opt:not(:disabled):hover,
.bs-opt:not(:disabled):hover,
.slide-nav button:not(:disabled):hover,
.qbar-attach:not(:disabled):hover,
.qbar-refine:not(:disabled):hover,
.qbar-undo:not(:disabled):hover,
.chipfile-x:not(:disabled):hover,
.lock-btn:hover, .lock-link:hover, .bs-skip:hover,
.studio-regen:hover, .side-toggle:hover, .mtop-burger:hover,
.side-item:not(:disabled):not(.disabled):hover,
.flashcard:hover, .row:hover, .ptr.ready .ptr-spin {
  filter: brightness(1.15);
}
/* The filled ones get a little more, since brightness alone on a solid fill is
   subtler than on an outline. */
.btn.active:not(:disabled):hover {
  filter: brightness(1.12);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--ac) 22%, transparent);
}
.btn:not(:disabled):active,
.navitem:not(:disabled):active,
.chip:not(:disabled):active,
.side-item:not(:disabled):active,
.lock-btn:active, .mtop-burger:active, .side-toggle:active {
  filter: brightness(.94);
  transform: translateY(1px);
}
/* Everything clickable says so. */
.btn, .navitem, .chip, .side-item, .lock-btn, .lock-link, .bs-skip,
.quiz-opt, .bs-opt, .flashcard, .row, .studio-regen, .slide-nav button,
.qbar-attach, .qbar-refine, .qbar-undo, .chipfile-x, .node-hd,
.side-toggle, .mtop-burger { cursor: pointer; }
.btn:disabled, .navitem:disabled, .chip:disabled, .side-item:disabled,
.quiz-opt:disabled, .bs-opt:disabled, .qbar-attach:disabled,
.qbar-refine:disabled, .qbar-undo:disabled { cursor: not-allowed; }

@media (prefers-reduced-motion: reduce) {
  .btn:active, .navitem:active, .chip:active, .side-item:active { transform: none; }
}

/* ── link status ──────────────────────────────────────────────────────────
   New in the A1 port, and the one piece of UI the React build had no need
   for. There, the backend url was compiled into the bundle, so the page could
   only ever be pointed at one place and "am I connected?" was not a question
   it could answer. Here the page is static and the engine moves, so where it
   is currently reachable — and whether it is reachable at all — has to be
   visible rather than inferred from every button failing. */
.link {
  display: flex; align-items: center; gap: 7px; width: 100%;
  padding: 7px 9px; margin-top: auto; border: 0; border-top: 1px solid var(--bd);
  background: transparent; color: var(--txd); font: inherit; font-size: 10.5px;
  letter-spacing: .4px; text-align: left;
}
.link:hover { background: var(--s2); color: var(--tx); }
.link-dot {
  width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
  background: var(--txm); box-shadow: 0 0 0 0 currentColor;
}
.link.local   .link-dot { background: var(--grn); }
.link.remote  .link-dot { background: var(--acl); }
.link.seeking .link-dot { background: var(--amber); animation: pulse 1.1s ease-in-out infinite; }
.link.down    .link-dot { background: var(--red); }
.link { gap: 10px; padding: 10px 12px; }
.link-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; letter-spacing: 0; }
.link-main, .link-sub { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.link-main { font-size: 12px; font-weight: 600; color: var(--tx); }
.link-sub { font-size: 10.5px; color: var(--txm); }
.link.down .link-main { color: var(--red); }
.link-dot { width: 8px; height: 8px; }
.link.local .link-dot { box-shadow: 0 0 0 3px color-mix(in srgb, var(--grn) 18%, transparent); }
.link.remote .link-dot { box-shadow: 0 0 0 3px color-mix(in srgb, var(--acl) 18%, transparent); }
.link.down .link-dot { box-shadow: 0 0 0 3px color-mix(in srgb, var(--red) 18%, transparent); }
.nav-collapsed .link-txt { display: none; }
.nav-collapsed .link { justify-content: center; }

/* ── setup dialog ─────────────────────────────────────────────────────────
   Where the API token is entered. It is kept in this browser's localStorage
   and never committed: A1 is a PUBLIC repo, and the token is what gates every
   endpoint that drives Tony's paid accounts. The React build inlined it into
   the JS bundle, where anyone with the site link could read it out of page
   source — that is the specific thing this replaces. */
/* ══ HOW IT WORKS ══════════════════════════════════════════════════════════
   A reading surface, not a dialog: generous measure, real paragraph rhythm,
   and sections you can collapse so the whole thing is scannable rather than a
   wall. The backdrop is blurred and the page behind it is frozen -- see
   html.modal-open -- because this is something you read, not something you
   glance past. */
.sheet.how-sheet {
  /* .sheet's base and mobile rules are declared further down the file,
     so an equal-specificity override here would lose on source order.
     Doubling the class is cheaper than splitting this block in two. */
  backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px);
  padding: 20px;
}
.how-box {
  width: 100%; max-width: 760px;
  /* dvh, not vh: on a phone vh is the tall URL-bar-hidden height, so the
     panel's own footer sat below the fold and could not be scrolled to. */
  max-height: min(86dvh, 860px);
  display: flex; flex-direction: column;
  background: var(--s1); border: 1px solid var(--bd);
  border-radius: var(--r-card); box-shadow: 0 24px 64px var(--shadow);
  overflow: hidden;
}
.how-hd {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 16px 18px 13px; border-bottom: 1px solid var(--bd);
  background: var(--s2); flex-shrink: 0;
}
.how-titlewrap { min-width: 0; }
.how-title {
  font-family: var(--font-display); font-size: 16px; font-weight: 800;
  letter-spacing: .3px; color: var(--tx);
}
.how-sub { color: var(--txm); font-size: 11.5px; margin-top: 3px; }
.how-x {
  margin-left: auto; flex-shrink: 0;
  width: 34px; height: 34px; border-radius: 9px;
  display: inline-flex; align-items: center; justify-content: center;
  background: transparent; border: 1px solid var(--bd); color: var(--txd);
  cursor: pointer; transition: all .15s; font-size: 15px;
}
.how-x:hover { border-color: var(--ac); color: var(--ac); background: var(--s1); }
.how-x svg { width: 17px; height: 17px; }

.how-body { overflow-y: auto; padding: 6px 18px 18px; min-height: 0; }

.how-sec { border-bottom: 1px solid var(--bd); }
.how-sec:last-child { border-bottom: none; }
.how-sec > summary {
  display: flex; align-items: center; gap: 10px;
  padding: 13px 2px; cursor: pointer; list-style: none;
  transition: color .15s;
}
.how-sec > summary::-webkit-details-marker { display: none; }
.how-q {
  font-family: var(--font-display); font-size: 13px; font-weight: 700;
  color: var(--tx); letter-spacing: .2px; flex: 1; min-width: 0;
}
.how-sec > summary:hover .how-q { color: var(--ac); }
/* A chevron drawn in CSS rather than another icon: it has to rotate, and a
   rotating glyph wanders inside its em box. */
.how-caret {
  width: 8px; height: 8px; flex-shrink: 0; margin-right: 3px;
  border-right: 1.6px solid var(--txm); border-bottom: 1.6px solid var(--txm);
  transform: rotate(45deg); transform-origin: 60% 60%;
  transition: transform .18s ease, border-color .15s;
}
.how-sec[open] > summary .how-caret { transform: rotate(225deg); }
.how-sec > summary:hover .how-caret { border-color: var(--ac); }

.how-p {
  color: var(--txd); font-size: 12.5px; line-height: 1.75;
  margin: 0 0 11px; padding-left: 18px; max-width: 66ch;
}
.how-sec[open] > summary { padding-bottom: 8px; }
.how-p:last-child { margin-bottom: 15px; }
.how-p b { color: var(--tx); font-weight: 700; }
.how-p i { color: var(--txd); font-style: italic; }
.how-p code {
  font-family: var(--font-mono); font-size: 11px;
  background: var(--bg); color: var(--acl);
  padding: 1px 5px; border-radius: 3px; word-break: break-word;
}

/* The page behind a modal is frozen. `overflow: hidden` on the root alone is
   not enough on iOS, which scrolls the nearest scrollable ancestor anyway --
   .page IS that ancestor here, so it is pinned too. */
html.modal-open, html.modal-open body { overflow: hidden; }
html.modal-open .page, html.modal-open .sidebar { overflow: hidden; }

@media (max-width: 760px) {
  .sheet.how-sheet { padding: 0; align-items: stretch; }
  /* Full-bleed on a phone. A centred card with margins wastes the width that
     long sentences need, and the rounded corners only read as "dialog" on a
     screen big enough to show what is behind them. */
  .how-box { max-width: none; max-height: 100dvh; height: 100dvh; border: none; border-radius: 0; }
  .how-hd { padding: 14px 14px 12px; padding-top: max(14px, env(safe-area-inset-top)); }
  .how-x { width: 44px; height: 44px; }
  .how-body { padding: 4px 14px; padding-bottom: max(24px, env(safe-area-inset-bottom)); }
  .how-sec > summary { padding: 15px 2px; min-height: 44px; }
  .how-p { font-size: 13.5px; line-height: 1.8; padding-left: 0; }
  .how-title { font-size: 17px; }
}

.sheet {
  position: fixed; inset: 0; z-index: 200; display: flex;
  align-items: center; justify-content: center; padding: 20px;
  background: rgba(0,0,0,.62); backdrop-filter: blur(2px);
}
.sheet-box {
  width: 100%; max-width: 460px; background: var(--s1);
  border: 1px solid var(--bd); border-radius: var(--r-card);
  box-shadow: 0 18px 48px var(--shadow); padding: 18px;
  max-height: 92vh; overflow-y: auto;
}
.sheet-hd {
  font-family: var(--font-display); font-size: 12px; font-weight: 800;
  letter-spacing: 2px; text-transform: uppercase; color: var(--acl);
  margin-bottom: 4px;
}
.sheet-sub { color: var(--txd); font-size: 11.5px; line-height: 1.6; margin-bottom: 14px; }
.sheet-lbl {
  display: block; color: var(--txm); font-size: 9px; font-weight: 700;
  letter-spacing: 1.4px; text-transform: uppercase; margin: 12px 0 5px;
}
.sheet-in {
  width: 100%; background: var(--bg); border: 1px solid var(--bd);
  border-radius: var(--r-btn); padding: 8px 10px; color: var(--tx);
  font-size: 12px; outline: 0;
}
.sheet-in:focus { border-color: var(--ac); }
/* The token field and its unlock button. The button never wraps under the
   field: on a phone that put "Change" at the bottom of the sheet, nowhere near
   the thing it changes. */
.sheet-row { display: flex; gap: 7px; align-items: stretch; }
.sheet-row .sheet-in { flex: 1 1 auto; min-width: 0; }
.sheet-row .btn { flex: 0 0 auto; }
/* Locked reads as a value, not as an invitation to type in it. */
.sheet-in.locked {
  color: var(--txm); background: var(--bg); cursor: default;
  border-color: var(--bd);
}
.sheet-note { color: var(--txm); font-size: 10.5px; line-height: 1.55; margin-top: 6px; }
.sheet-note b { color: var(--txd); }
.sheet-note code { color: var(--txd); background: var(--bg); padding: 1px 4px; border-radius: 3px; }
.sheet-bar { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; margin-top: 16px; }
.sync-detail {
  font-family: var(--font-mono); font-size: 10.5px; line-height: 1.6;
  white-space: pre-wrap; word-break: break-word;
  background: var(--bg); border: 1px solid var(--bd); border-radius: 6px;
  padding: 9px 11px; color: var(--txd); max-height: 30vh; overflow-y: auto;
}
.sheet-err { color: var(--red); font-size: 11px; margin-top: 8px; }
.sheet-ok  { color: var(--grn); font-size: 11px; margin-top: 8px; }

/* ── editing a queued prompt ─────────────────────────────────────────────── */
.sheet-wide { max-width: 620px; width: 100%; }
/* Sections spaced by the container rather than by each label's own margin,
   so the panel reads as four bands instead of a column of loose parts. */
.qedit { display: flex; flex-direction: column; gap: 4px; }
.qedit .sheet-sub { margin-bottom: 10px; }
.qedit .sheet-lbl { margin: 10px 0 6px; }
.qedit-lbl { display: flex; align-items: baseline; gap: 8px; }
.qedit-count {
  font-size: 9px; font-weight: 600; letter-spacing: .6px;
  text-transform: none; color: var(--txd);
}
.qedit-count.empty { color: var(--amber); }
.qedit-text {
  min-height: 132px; resize: vertical; line-height: 1.6; font-size: 13.5px;
  padding: 11px 12px; border-radius: 12px;
  transition: border-color .15s, box-shadow .15s;
}
/* The same ring the composer draws, for the same reason: this IS a composer. */
.qedit-textwrap { position: relative; }
/* Our handle, not the browser's: two handles in one corner is one too many,
   and a phone has no native one. */
.qedit-text { resize: none; }
.qedit-textwrap .qbar-grip { border-radius: 0 0 12px 0; }
.qedit.drag {
  border-color: var(--ac); border-style: dashed;
  background: color-mix(in srgb, var(--ac) 6%, var(--s1));
}
.qedit-text:focus {
  border-color: var(--ac);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--ac) 16%, transparent);
}
.qedit-bar { margin-top: 14px; }
.qedit-units { display: flex; flex-wrap: wrap; gap: 4px; }
/* Not a drag surface here: this row picks units, it does not reorder them. */
.qedit-units .chip { cursor: pointer; }
.qedit-atts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.qedit-att {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--bdl); border-radius: 8px; padding: 3px 6px 3px 9px;
  font-size: 11px; color: var(--txm); max-width: 100%;
}
.qedit-att.elsewhere { border-style: dashed; color: var(--txd); }
.qedit-att-n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 180px; }
.qedit-att-s { color: var(--txd); font-size: 10px; }
.qedit-att-x {
  background: transparent; border: 0; color: var(--txd); cursor: pointer;
  font-family: inherit; font-size: 11px; line-height: 1; padding: 2px 3px;
}
.qedit-att-x:hover { color: var(--red); }
.qedit-add {
  background: transparent; border: 1px dashed var(--bdl); border-radius: 8px;
  color: var(--txm); font-family: inherit; font-size: 11px; padding: 4px 10px;
  cursor: pointer;
}
.qedit-add:hover { border-color: var(--ac); color: var(--ac); }
@media (max-width: 720px) {
  /* Sized to the VISIBLE viewport. 92vh counts the browser's own chrome, so a
     tall sheet put its buttons under the URL bar; dvh is what is actually on
     screen. Placement is left to the existing rule further down, which pins
     sheets near the top on a phone so an open keyboard cannot bury them.
     Full width, because 460px of panel inside a 390px screen is a scrollbar. */
  .sheet-box {
    max-width: none;
    max-height: 84dvh; padding: 16px 14px calc(16px + env(safe-area-inset-bottom));
  }
  .qedit-text { min-height: 120px; font-size: 15px; }
  .qedit-att-n { max-width: 130px; }
  .qedit-add, .qedit-att { padding: 7px 10px; }
  /* Reachable buttons, and Cancel kept away from Save so the two are not one
     ambiguous target at the bottom of the screen. */
  .sheet-bar { gap: 8px; }
  .sheet-bar .btn { padding: 10px 16px; }
  .qedit-units .chip { padding: 5px 11px; }
}

/* A run cannot start until the engine is found, and saying so where the
   button is beats a Convene click that silently does nothing. */
.offline-note {
  background: var(--s1); border: 1px solid var(--bd); border-left: 3px solid var(--amber);
  border-radius: 2px; padding: 11px 13px; margin-bottom: 16px;
  color: var(--txd); font-size: 11.5px; line-height: 1.6;
}
.offline-note b { color: var(--amber); font-weight: 600; }
.offline-note button {
  background: transparent; border: 1px solid var(--bd); border-radius: var(--r-btn);
  color: var(--txd); font: inherit; font-size: 10.5px; padding: 4px 9px; margin-top: 8px;
}
.offline-note button:hover { border-color: var(--ac); color: var(--ac); }

/* ══ MOBILE ════════════════════════════════════════════════════════════════
   Below 760px the sidebar stops being a rail and becomes an off-canvas drawer.

   The inherited design collapsed it to a 56px icon-only strip instead. That is
   fine on a narrow laptop and wrong on a phone: it costs 14% of a 390px screen
   permanently, and stripping the labels leaves Studio's seven cards and
   Brainstorm as a column of near-identical glyphs. A drawer gives the content
   the whole width and the nav its full labels when it is actually open.

   MAGI is genuinely useful on a phone -- the engine is on the PC and the
   console is just a view of it -- so this is the case where you are most
   likely to be reading a verdict rather than starting a run.
   ══════════════════════════════════════════════════════════════════════════ */

/* The mobile top bar: hidden on desktop, where the sidebar is always present. */
.mtop { display: none; }

/* The scrim is a CHILD OF .shell, which is a grid -- so if it is merely
   invisible it still occupies a grid cell. Left in flow it took column 1 and
   pushed the page into the sidebar's 56px slot, which collapsed the console to
   a 4px-wide column of member blocks at every width above the mobile
   breakpoint. display:none removes it from the grid entirely; the mobile layer
   turns it back on as a FIXED overlay, which is out of flow either way. */
.scrim { display: none; }

@media (max-width: 760px) {
  .shell,
  .shell.nav-collapsed { grid-template-columns: minmax(0, 1fr); height: 100dvh; }

  /* The scroller's own top padding used to be a band ABOVE the sticky header
     -- sticky pins to the content box, not the border box -- so everything you
     scrolled passed through that gap and was visible between the header and
     the URL bar. See .page further down: the padding is gone from the top and
     the gap is now this header's own margin-bottom, where nothing can scroll
     into it. */
  .mtop {
    display: flex; align-items: center; gap: 10px;
    position: sticky; top: 0; z-index: 60;
    padding: 8px 12px;
    padding-top: max(8px, env(safe-area-inset-top));
    margin-bottom: 16px;
    background: var(--s1); border-bottom: 1px solid var(--bd);
  }
  /* A column, so the sync state sits UNDER the wordmark exactly as it does in
     the sidebar -- and on a phone the sidebar is a closed drawer, so this is
     the only place "Syncing… / Synced / Sync failed" can be seen at all. */
  .mtop-brand {
    display: flex; flex-direction: column; justify-content: center;
    flex-shrink: 0; min-width: 0; line-height: 1.1;
  }
  .mtop-tag {
    font-family: var(--font-mono); font-size: 9px; letter-spacing: .9px;
    text-transform: uppercase; color: var(--txm);
    margin-top: 2px; line-height: 13px; white-space: nowrap;
  }
  .mtop .syncline {
    font-size: 9px; letter-spacing: .3px;
    margin-top: 2px; min-height: 12px; line-height: 12px;
    /* Out of flow when idle, so it cannot reserve a line the tagline is
       already using -- `visibility: hidden` would still hold the space and the
       header would grow by 12px for nothing. */
    display: none;
  }
  .mtop-brand.showsync .mtop-tag { display: none; }
  .mtop-brand.showsync .syncline { display: block; }
  /* Where the engine is already has a permanent home at the bottom of the
     drawer. Repeating it here spent the width that the wordmark, the sync
     state and the lock all have to share. */
  .mtop-where { display: none; }
  /* The same trap as the sidebar header: `margin-left: auto` on EACH icon
     button puts a spring before both, so the pair drifts apart and the free
     width lands between them instead of before them. The brand takes the
     slack; the two controls sit together at the end. */
  .mtop-brand { flex: 1 1 auto; }
  .mtop .lock-btn { margin-left: 0; }
  .mtop #helpBtnM { margin-left: auto; }
  /* 30px was fine as a lone control at the end of a row. Two of them side by
     side at 30px is a pair of targets you have to aim between. */
  .mtop .lock-btn { width: 40px; height: 40px; }
  .mtop .lock-btn svg { width: 18px; height: 18px; }
  .mtop-burger {
    width: 40px; height: 40px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: transparent; border: 1px solid var(--bd); border-radius: var(--r-btn);
    /* Divisible by 4, for the reason spelled out on .side-toggle: it is what
       keeps the menu icon's three bars identical to each other. */
    color: var(--txd); font-size: 16px;
  }
  .mtop-burger:active { background: var(--s2); color: var(--tx); }
  .mtop-title {
    font-family: var(--font-display); font-size: 13px; font-weight: 800;
    letter-spacing: 2.4px; color: var(--acl);
  }
  .mtop-title { flex-shrink: 0; }

  /* ── the drawer ───────────────────────────────────────────────────────── */
  /* 100dvh, not `bottom: 0`. A fixed element's bottom edge is the LAYOUT
     viewport, which on a phone stays the size it was when the URL bar was
     showing -- so once that bar retracted the drawer stopped short of the
     screen and the page behind it showed through the gap at the bottom. dvh
     tracks the viewport that is actually on screen. */
  .sidebar {
    position: fixed; inset: 0 auto auto 0; height: 100dvh; z-index: 80;
    width: min(82vw, 300px);
    transform: translateX(-100%);
    transition: transform .2s cubic-bezier(0.4, 0, 0.2, 1);
    border-right: 1px solid var(--bd);
    box-shadow: 0 0 40px var(--shadow);
    padding-top: env(safe-area-inset-top);
  }
  .shell.nav-open .sidebar { transform: translateX(0); }

  /* Everything the collapsed rail hid comes BACK -- the drawer is wide. */
  .sidebar .side-brand,
  .sidebar .side-label,
  .sidebar .side-tag,
  .sidebar .side-sec-note { display: revert; }
  .sidebar .side-item { justify-content: flex-start; padding: 11px 10px; }
  .sidebar .side-sec-hd {
    height: auto; padding: 0 9px 5px; margin: 0; overflow: visible;
    background: none; color: var(--txm);
  }
  .side-toggle { display: none; }
  .side-top { justify-content: flex-start; padding: 14px 12px 10px; height: auto; }

  /* Tapping the scrim is the fastest way out, and on a phone it is the one
     people reach for before hunting a close button. */
  .scrim {
    display: block;
    position: fixed; inset: 0 0 auto 0; height: 100dvh; z-index: 70;
    background: rgba(0, 0, 0, .55);
    opacity: 0; pointer-events: none; transition: opacity .2s ease;
  }
  .shell.nav-open .scrim { opacity: 1; pointer-events: auto; }

  .page {
    /* No top padding: it would sit ABOVE the sticky header (sticky pins to the
       content box) and every line you scrolled would show through it. The
       header carries that gap as its own margin-bottom instead. */
    padding: 0 12px;
    padding-bottom: max(24px, env(safe-area-inset-bottom));
  }

  /* ── touch targets ────────────────────────────────────────────────────── */
  /* 44px is the smallest reliably hittable control; the desktop sizes here are
     28px pills built for a mouse. */
  .side-item, .navitem, .btn, .chip, .bs-opt { min-height: 44px; }
  .btn { padding: 0 16px; font-size: 12px; }
  /* Both are icon-only at this width -- .qbar-refine-txt is hidden below
     620px -- so they must be CIRCLES. Setting only min-height grew the height
     and left the 30px width alone, which is what made them ovals. Width and
     height are set together, and padding is zeroed so .qbar-refine's pill
     padding cannot stretch it back out. */
  .qbar-attach, .qbar-refine {
    width: 42px; height: 42px; min-height: 42px;
    padding: 0; border-radius: 50%; flex: 0 0 auto;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .qbar-refine svg, .qbar-attach svg { width: 17px; height: 17px; }
  /* The label is hidden below 620px, but .qbar-refine-txt still reserved
     5.9em for the word "Refining..." -- so the button kept the width of a
     label it was not drawing, and on a 360px screen that pushed Convene's
     row wide enough to clip. A hidden element must not hold space. */
  .qbar-refine-txt { display: none; }
  /* The chip is a column of two centred lines. Without an explicit width the
     flex row stretches each chip to fill, and the text then sits left in a
     box wider than itself -- which is what made "DEEPSEEK / ADAM" look
     misaligned rather than centred. */
  .chip {
    padding: 7px 12px; min-height: 44px;
    align-items: center; justify-content: center; text-align: center;
    flex: 0 0 auto;
  }
  .chip-model, .chip-unit { width: 100%; text-align: center; }
  .node-hd { min-height: 52px; }
  /* The pin was a 26px square with no hover to reveal it -- the smallest
     control in the console, on the surface most often used one-handed, and
     missing it opens the deliberation instead. 44px square, permanently
     visible (a touch screen has no hover to discover it with), and outlined so
     it reads as a button rather than a decoration beside the date. */
  /* 44px is the smallest reliably hittable control, and three of them will
     not fit beside a question on a 360px screen -- so they take their own row
     underneath rather than squeezing the question to nothing. */
  .row-act {
    width: 44px; height: 44px; border-radius: 10px;
    color: var(--txd); background: var(--s2);
  }
  .row-act svg { width: 18px; height: 18px; }

  /* iOS zooms the page when a focused input is under 16px. That zoom does not
     undo itself, so one tap on the composer leaves the whole console
     magnified and horizontally scrolling. */
  .qbar textarea, .bs-topic, .bs-open-input, .sheet-in, input, textarea {
    font-size: 16px;
  }

  /* ── composer ─────────────────────────────────────────────────────────── */
  .qbar { padding: 10px; }
  /* The same box as brainstorm's: it grows from one line rather than opening
     with 72px of empty space. Two composers for the same council had no
     reason to be different sizes. */
  .qbar textarea { min-height: 26px; }
  /* One row: attach, Refine, then Convene pushed to the end -- exactly the
     shape Begin session has in brainstorm. Convene used to take a whole row of
     its own below them, which on a phone is a third of the composer spent on
     a button you press once. */
  .qbar-toolbar { flex-wrap: nowrap; gap: 8px; }
  .qbar-send { flex: 0 0 auto; margin-left: auto; }
  .qbar-spacer { display: none; }

  .members { gap: 8px; }


  /* ── verdict + cards ──────────────────────────────────────────────────── */
  .verdict-body.split { grid-template-columns: minmax(0, 1fr); }
  .verdict, .studio-view, .drawer { border-radius: var(--r-card); }
  .verdict-hd, .studio-view-hd { flex-wrap: wrap; gap: 6px; }
  .v-lead { font-size: 15px; }

  /* A wide table must scroll INSIDE its own box; the page itself must never
     scroll sideways. */
  .v-tablewrap, .bs-split { max-width: 100%; overflow-x: auto; }
  .v-table { min-width: 460px; }

  .magi-grid { gap: 10px; }
  .node-body { max-height: 50vh; }

  /* ── studio ───────────────────────────────────────────────────────────── */
  .studio-view-body { padding: 14px 12px 16px; }
  /* One row on a phone: the header's actions become icon buttons, and the
     status drops under the title rather than pushing them onto a new line. */
  .studio-view-hd { flex-wrap: nowrap; gap: 8px; padding: 8px 8px 8px 12px; }
  .studio-view-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .studio-view-status { display: none; }
  .studio-view-hd .studio-hd-txt { display: none; }
  .studio-view-hd .navitem { width: 40px; min-height: 40px; height: 40px; padding: 0; justify-content: center; flex: 0 0 auto; }
  .studio-view-hd .navitem .navitem-ic { margin: 0; font-size: 16px; }
  .st-bar .copybtn, .au-opts .copybtn { height: 36px; }
  .mindmap { gap: 18px; }
  .mm-node, .mm-root { font-size: 11.5px; }

  /* ── brainstorm ───────────────────────────────────────────────────────── */
  .bs-cards { grid-template-columns: 1fr; }
  /* The council's toolbar exactly: one row, attach and Refine as circles,
     the action button pushed to the end. Two composers for the same council
     had no reason to lay their controls out differently. */
  .bs-start-bar { flex-wrap: nowrap; gap: 8px; }
  .bs-start-bar .btn { flex: 0 0 auto; margin-left: auto; }
  .bs-note { flex: 1 1 100%; order: 9; }
  .bs-plan-bar { flex-wrap: wrap; gap: 8px; }
  .bs-council-body { max-height: 40vh; }

  /* ── history rows ─────────────────────────────────────────────────────── */
  /* Question and metadata stack; side by side, the question was crushed to a
     few characters before the ellipsis. A grid rather than a column flex, so
     the pin can sit to the RIGHT of both lines instead of becoming a third
     thing stacked under them. */
  .row {
    display: grid; align-items: center;
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas: "q q" "meta meta" "acts acts";
    gap: 4px 10px; padding: 12px;
  }
  /* Two lines, then an ellipsis. A prompt can be a 10-section template, and
     wrapping the whole thing turned one row into half a screen -- so the list
     you came to scan became a list you have to scroll. The full text is still
     one tap away, in the deliberation itself. */
  .row .q {
    grid-area: q; white-space: normal; overflow: hidden;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
    line-clamp: 2;
  }
  .row .meta { grid-area: meta; white-space: normal; }
  .row .row-acts { grid-area: acts; justify-content: flex-start; margin-top: 4px; }

  table.doctor { font-size: 10.5px; }
  table.doctor th, table.doctor td { padding: 5px 7px; }

  .sheet { padding: 12px; align-items: flex-start; padding-top: 8vh; }
}

/* Very narrow: an extra squeeze for 360px-class phones. */
@media (max-width: 400px) {
  .page { padding-left: 10px; padding-right: 10px; }
  .chip-unit { display: none; }
  .verdict-quorum { font-size: 9.5px; }
  .v-table { min-width: 380px; }
}

/* Landscape phones are SHORT, not narrow: the drawer must still scroll and the
   composer must not eat the whole viewport. */
@media (max-width: 900px) and (max-height: 460px) {
  .sidebar { overflow-y: auto; }
  .qbar textarea { min-height: 48px; }
  .node-body { max-height: 60vh; }
}

<style id="ui-cap-2000">
/* == Suite-wide 2000px UI cap ==============================================
   Past 2000px the interface stops growing and only the page BACKGROUND keeps
   going, so on an ultrawide monitor MAGI stays a readable centred column
   instead of stretching its sidebar-plus-content grid across a metre of glass.
   Every other A1 program carries the identical cap.

   body carries it because every piece of chrome lives inside body -- with one
   exception that is easy to miss: a position:fixed element is laid out against
   the VIEWPORT, so it ignores an ancestor's max-width completely, and would
   stay full width while everything around it narrowed.

   MAGI needs no such exception today, and the reason is worth recording so a
   future reader does not "fix" a bar that is already fine. Its fixed elements
   are .lock-screen, .sheet and #uim-overlay -- backdrops, whose cards centre
   themselves -- plus .sidebar and .scrim, which exist ONLY inside
   `@media (max-width: 760px)` as the phone drawer. None of them can be on
   screen at a width where this cap applies. The DESKTOP sidebar is not fixed
   at all: it is the first column of `.shell`'s grid, so the cap reaches it
   through body like everything else.

   The background still fills the screen: body's background propagates to the
   canvas, so narrowing body reveals the page ground, not white.

   tests/ui-width-cap.test.js fails the build if this goes missing. */
body { max-width: 2000px; margin-inline: auto; }
</style>
<script id="mail-relay">
/* == Recovery-mail relay ===================================================
   The worker mints the reset code and the hint text, but it cannot always
   DELIVER them. Formspree files anything posted from a Cloudflare Worker as
   spam -- it answers {"ok":true} and the mail never arrives -- while the exact
   same submission sent from a browser has worked for months. So when the
   worker has no server-side sender configured it hands the page an envelope
   instead of sending, and this posts it from here, where it works.

   `relay` only appears when the worker could not send it itself. Set
   BREVO_API_KEY (or RESEND_API_KEY) on taskhub-reminders and the worker sends
   it directly, stops returning `relay`, and this quietly stops being used --
   no page change needed. Until then, note that a relayed reset code passes
   through this browser, so whoever asked for it can read it.

   Returns true if the mail went out, false if nothing was sent. A response
   that was already delivered server-side (`emailed`) counts as sent. */
window._mailRelay = window._mailRelay || async function (res) {
  if (res && res.emailed) return true;
  var r = res && res.relay;
  if (!r || !r.form) return false;
  try {
    var out = await fetch(r.form, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      /* `_subject` is the field Formspree uses for the subject line; a plain
         `subject` key is swallowed. Both are sent so either spelling works. */
      body: JSON.stringify({ email: r.email, _subject: r.subject, subject: r.subject, message: r.message })
    });
    var d = null;
    try { d = await out.json(); } catch (e) {}
    /* A 2xx is not delivery on its own -- Formspree states a refusal as
       {"ok":false} or an errors array underneath one. */
    return !!out.ok && !(d && (d.ok === false || (d.errors && d.errors.length)));
  } catch (e) { return false; }
};
</script>

  function collect(){ var o={}; var ins=el('uim-fields').querySelectorAll('input'); Array.prototype.forEach.call(ins,function(i){ o[i.getAttribute('data-name')]=i.value; }); return o; }
  function submit(){
    if(!active) return; var cfg=active;
    if(cfg.fields && cfg.fields.length){
      var vals=collect(), ins=el('uim-fields').querySelectorAll('input');
      for(var i=0;i<cfg.fields.length;i++){ var f=cfg.fields[i];
        if(f.required && !String(vals[f.name]||'').trim()){ el('uim-err').textContent=(f.label||'This field')+' is required.'; if(ins[i]) ins[i].focus(); return; } }
      close(cfg.kind==='prompt' ? String(vals[cfg.fields[0].name]) : vals);
    } else { close(cfg.kind==='confirm'?true:undefined); }
  }
  function close(result){
    var cfg=active; active=null;
    var ov=el('uim-overlay'); if(ov) ov.classList.remove('show');
    if(cfg && cfg.resolve) cfg.resolve(result);
    if(queue.length){ render(queue.shift()); }
  }
  function open(cfg){ return new Promise(function(res){ cfg.resolve=res; if(active) queue.push(cfg); else render(cfg); }); }
  window.uiModal=open;
  window.uiAlert=function(m,o){ o=o||{}; return open({kind:'alert',message:String(m==null?'':m),title:o.title,okLabel:o.okLabel||'OK'}); };
  window.uiConfirm=function(m,o){ o=o||{}; return open({kind:'confirm',message:String(m==null?'':m),title:o.title,okLabel:o.okLabel||'OK',cancelLabel:o.cancelLabel||'Cancel',danger:o.danger}); };
  window.uiPrompt=function(m,o){ o=o||{}; return open({kind:'prompt',message:String(m==null?'':m),title:o.title,okLabel:o.okLabel||'OK',cancelLabel:o.cancelLabel||'Cancel',
    fields:[{name:'value',type:o.password?'password':'text',value:(o.default!=null?o.default:(o.value!=null?o.value:'')),placeholder:o.placeholder||'',autocap:o.autocap}]}); };
  window.uiForm=function(cfg){ cfg=cfg||{}; return open({kind:'form',title:cfg.title,message:cfg.message,okLabel:cfg.okLabel||'Save',cancelLabel:cfg.cancelLabel||'Cancel',danger:cfg.danger,fields:cfg.fields||[]}); };
  // Route native alert() through the in-UI modal (can't be dismissed by clicking
  // outside the app window). confirm/prompt are converted at their call sites.
  try { window.alert=function(m){ window.uiAlert(m==null?'':String(m)); }; } catch(e){}
})();
</script>

<script>
(function(){
  if (window.Bio) return;
  var NS = 'bio_cred_';
  function u8(buf){ return new Uint8Array(buf); }
  function b64u(buf){ var b=u8(buf),s=''; for(var i=0;i<b.length;i++) s+=String.fromCharCode(b[i]); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
  function unb64u(str){ str=String(str).replace(/-/g,'+').replace(/_/g,'/'); while(str.length%4) str+='='; var bin=atob(str),b=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i); return b.buffer; }
  function rand(n){ var a=new Uint8Array(n); crypto.getRandomValues(a); return a; }
  function keyOf(app,id){ return NS+app+'_'+id; }
  function supported(){ return !!(window.isSecureContext && window.PublicKeyCredential && navigator.credentials && navigator.credentials.create); }
  function available(){
    if(!supported()) return Promise.resolve(false);
    if(!PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable) return Promise.resolve(false);
    return PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().then(function(v){return !!v;}).catch(function(){return false;});
  }
  function stored(app,id){ try{ return JSON.parse(localStorage.getItem(keyOf(app,id))||'null'); }catch(e){ return null; } }
  function isRegistered(app,id){ var r=stored(app,id); return !!(r&&r.id); }
  function unregister(app,id){ try{ localStorage.removeItem(keyOf(app,id)); }catch(e){} }
  function label(){
    var ua=navigator.userAgent||'';
    if(/iPhone|iPad|iPod/.test(ua)) return 'Face ID';
    if(/Android/.test(ua)) return 'fingerprint';
    if(/Windows/.test(ua)) return 'Windows Hello';
    if(/Mac/.test(ua)) return 'Touch ID';
    return 'biometrics';
  }
  function register(app,id,opts){
    opts=opts||{};
    if(!supported()) return Promise.resolve({ok:false,error:'unsupported'});
    return navigator.credentials.create({publicKey:{
      challenge: rand(32),
      rp:{ name: opts.rpName||document.title||'App', id: location.hostname||undefined },
      user:{ id: rand(16), name: opts.userName||(app+':'+id), displayName: opts.displayName||opts.userName||id },
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{ authenticatorAttachment:'platform', userVerification:'required', residentKey:'preferred' },
      timeout: 60000, attestation:'none'
    }}).then(function(cred){
      if(!cred) return {ok:false,error:'cancelled'};
      localStorage.setItem(keyOf(app,id), JSON.stringify({ id:b64u(cred.rawId), created:Date.now(), label:opts.displayName||opts.userName||id }));
      return {ok:true};
    }).catch(function(e){ return {ok:false, error:(e&&e.name)||'error', message:(e&&e.message)||'' }; });
  }
  function authenticate(app,id){
    if(!supported()) return Promise.resolve({ok:false,error:'unsupported'});
    var rec=stored(app,id);
    if(!rec||!rec.id) return Promise.resolve({ok:false,error:'notregistered'});
    return navigator.credentials.get({publicKey:{
      challenge: rand(32),
      allowCredentials:[{ type:'public-key', id: unb64u(rec.id) }],
      userVerification:'required', timeout:60000, rpId: location.hostname||undefined
    }}).then(function(asr){
      if(!asr) return {ok:false,error:'cancelled'};
      return {ok:true};
    }).catch(function(e){ return {ok:false, error:(e&&e.name)||'error', message:(e&&e.message)||'' }; });
  }
  window.Bio = { supported:supported, available:available, isRegistered:isRegistered, register:register, authenticate:authenticate, unregister:unregister, label:label };
})();
</script>

<script>
"use strict";
/* ══════════════════════════════════════════════════════════════════════════
   MAGI console.

   Vanilla port of Veda's React/Vite frontend. The behaviour it describes is
   hers; what changed is the shape (one file, no build) and how the page finds
   the backend (see `link` below). Comments explaining WHY something is the way
   it is are carried over — they document decisions that cost a debugging round
   to reach, and re-deriving them later would cost it again.
   ══════════════════════════════════════════════════════════════════════════ */

const $ = (id) => document.getElementById(id);
const el = (tag, cls, txt) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt != null) n.textContent = txt;
  return n;
};
const show = (n, on) => { n.hidden = !on; };

/* ══ PROFILES ══════════════════════════════════════════════════════════════
   Two people, two MAGIs. Tony and Veda each get their own AI accounts, their
   own history, their own settings and their own password -- the same split
   index.html has had for its TaskHubs, built the same way and deliberately
   sharing its colours so the suite reads as one product.

   A profile is a DOCUMENT PATH plus a set of credentials, not an identity.
   Firebase auth stays a single anonymous session for the whole suite, exactly
   as index.html does it, so nothing about rules, App Check or sign-in changes.
   What changes is which document the console reads and which localStorage
   namespace it writes.

   ── Why a switch reloads the page ────────────────────────────────────────
   Every key constant below is evaluated once, at load, against PROFILE.id. A
   switch that merely reassigned PROFILE.id would leave a dozen constants and
   one live Firestore listener pointing at the person who just left -- and
   Firestore's persistent cache means a document read once stays on the device.
   Reloading makes the swap total and unarguable for the cost of one repaint,
   and this page already treats a reload as the ordinary fix (see PULL TO
   REFRESH). The profile is read back out of localStorage on the way up.

   ── What is NOT namespaced ───────────────────────────────────────────────
   Device-shaped facts, not person-shaped ones: which device this is, whether
   its sound is muted, whether its sidebar is collapsed. Sharing those is the
   point -- muting MAGI should not un-mute itself because you switched profile. */
const MAGI_PROFILES = {
  // `doc` is the Firestore document under /dashboards. Tony keeps "magi" so
  // every deliberation he has ever run stays exactly where it is -- there is
  // no history migration in this change, and there must never need to be one.
  tony: { label: "Tony", emoji: "⚜️", color: "#e0b874", doc: "magi",      lock: "tony_magi" },
  veda: { label: "Veda", emoji: "✦",       color: "#8D769A", doc: "magi_veda", lock: "veda_magi" },
};
const PROFILE_ORDER = ["tony", "veda"];
const LAST_PROFILE_LS = "magi.lastProfile";
// Favouriting a profile pins THIS DEVICE to it: every fresh load opens
// straight there. Per device, never synced -- which of you usually picks up
// this particular phone is a fact about the phone, not about either person.
const FAV_PROFILE_LS = "magi.favProfile";
// A deliberate switch has to beat the favourite, or picking the other
// profile would bounce you back on the reload that performs the switch.
// sessionStorage, so it lasts as long as this tab and no longer: a NEW
// window is a fresh start and gets the favourite again.
const PICK_SS = "magi.pick";
// A prompt handed over by another A1 program belongs to a PERSON, and every
// program that hands one over -- TradeHub's Analysis tab, and the morning
// launcher that builds the same link in Python -- is Tony's. Without this a
// handoff would land in whichever profile the console happened to be showing,
// so a trading prompt could convene Veda's council against Veda's accounts
// and file the verdict in her history.
const HANDOFF_PROFILE = "tony";
// A handoff that arrives in the WRONG profile has to survive the reload that
// switches to the right one -- takeHandoff() has already stripped the
// fragment by then, so there is nothing left in the url to read afterwards.
const HANDOFF_SS = "magi.handoff";
const hasHandoffHash = () => { try { return /[#&]tb=/.test(location.hash || ""); } catch { return false; } };

const PROFILE = {
  // Resolved synchronously, before any key constant below is evaluated. The
  // gate may change it, and when it does it reloads rather than reassigning.
  id: (() => {
    // A handoff outranks everything, including a favourite pointing the
    // other way: the link names the work, and the work is one person's.
    try {
      if (hasHandoffHash() || sessionStorage.getItem(HANDOFF_SS)) return HANDOFF_PROFILE;
    } catch {}
    // Then this tab's explicit pick, the favourite, whoever was here last,
    // and the default.
    try {
      const p = sessionStorage.getItem(PICK_SS);
      if (p && MAGI_PROFILES[p]) return p;
    } catch {}
    for (const key of [FAV_PROFILE_LS, LAST_PROFILE_LS]) {
      try {
        const v = localStorage.getItem(key);
        if (v && MAGI_PROFILES[v]) return v;
      } catch {}
    }
    return PROFILE_ORDER[0];
  })(),
  unlocked: false,   // nothing reaches the network until this is true
};

const prof = () => MAGI_PROFILES[PROFILE.id];

/** Every per-person localStorage key goes through here. `magi.tony.pins`,
 *  `magi.veda.pins` -- never a bare `magi.pins`, which is what the other
 *  profile would then read as its own. */
const lsKey = (name) => `magi.${PROFILE.id}.${name}`;

/* ── one-time migration of Tony's existing keys ────────────────────────────
   Before profiles, every key was `magi.<name>` with no owner. Those values are
   Tony's -- his API token, his pins, his unit order, his queue -- and dropping
   them would look exactly like MAGI having forgotten him. Copied, not moved:
   an older build of the page left open in another tab still reads the legacy
   names, and a migration that deleted them would break it mid-session.

   Runs once and marks itself done, so a key deleted on purpose afterwards
   does not come back on the next load. */
(function migrateLegacyKeys() {
  const DONE = "magi.tony.migrated";
  try {
    if (localStorage.getItem(DONE) === "1") return;
    const pairs = [
      ["magi.token", "magi.tony.token"],
      ["magi.token.ok", "magi.tony.token.ok"],
      ["magi.unitorder", "magi.tony.unitorder"],
      ["magi.units", "magi.tony.units"],
      ["magi.studio.audio", "magi.tony.studio.audio"],
      ["magi.queue", "magi.tony.queue"],
      ["magi.pins", "magi.tony.pins"],
      ["magi.unpinned", "magi.tony.unpinned"],
      ["magi.nicks", "magi.tony.nicks"],
      ["magi.bspins", "magi.tony.bspins"],
      ["magi.bsnicks", "magi.tony.bsnicks"],
      ["magi.bsunpinned", "magi.tony.bsunpinned"],
      ["magi_lock_session", "magi.tony.lock_session"],
      ["magi_locked", "magi.tony.locked"],
    ];
    for (const [from, to] of pairs) {
      const v = localStorage.getItem(from);
      if (v != null && localStorage.getItem(to) == null) localStorage.setItem(to, v);
    }
    localStorage.setItem(DONE, "1");
  } catch {}
})();
