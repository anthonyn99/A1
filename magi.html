  const url = URL.createObjectURL(new Blob([S.bs.planMd], { type: "text/markdown;charset=utf-8" }));
  const a = document.createElement("a");
  a.href = url; a.download = suggested;
  document.body.append(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  S.bs.savedTo = suggested;
  renderBsView();
}

/* ── views ─────────────────────────────────────────────────────────────── */

function renderBsNav() {
  const sec = $("bsSec");
  for (const el2 of sec.querySelectorAll(".bs-row")) el2.remove();
  const bs = S.bs;
  show($("bsNote"), !S.navCollapsed && !bs.sessionId);

  const main = el("button", `side-item bs-row ${S.view === "brainstorm" ? "active" : ""}`);
  main.type = "button";
  main.style.setProperty("--sa", "var(--gold)");
  main.disabled = !online();
  main.title = S.navCollapsed ? "Brainstorm" : "Open the planning session";
  main.setAttribute("aria-current", String(S.view === "brainstorm"));
  main.append(el("span", "side-ic studio-ic", "◇"),
              el("span", "side-label", bs.sessionId ? "Current session" : "New session"));
  const tag = el("span", "side-tag");
  if (bs.busy) tag.append(el("span", "spin", "◐"));
  else tag.textContent = bs.status === "complete" ? "✓" : bs.rounds.length ? `R${bs.rounds.length}` : "";
  main.append(tag);
  main.onclick = () => setView("brainstorm");
  sec.append(main);

  if (bs.sessionId && !S.navCollapsed) {
    const nu = el("button", "side-item bs-row");
    nu.type = "button";
    nu.style.setProperty("--sa", "var(--acl)");
    nu.disabled = bsBusy();
    nu.title = "Start a different planning session";
    nu.append(el("span", "side-ic studio-ic", "✦"),
              el("span", "side-label", "New session"), el("span", "side-tag"));
    nu.onclick = bsReset;
    sec.append(nu);
  }
}

function phaseNote(phase) {
  if (phase === "idle") return null;
  const text = phase === "council"
    ? "Each unit is thinking about the plan independently…"
    : phase === "merging"
      ? "Merging the round into one plan and one set of questions…"
      : "Writing the plan file…";
  const n = el("div", "bs-phase");
  n.append(el("span", "spin", "◐"), document.createTextNode(" " + text));
  return n;
}

function bsCallout(kind, cause, remedy) {
  const c = el("div", "callout");
  c.append(el("div", "kind", kind), el("div", "cause", cause));
  if (remedy) c.append(el("div", "remedy", remedy));
  return c;
}

/** One question as a card: header chip, the question, then either selectable
 *  options or a text input. Modelled on Claude Code's AskUserQuestion, which is
 *  the interaction this is meant to feel like. */
function questionCard(index, question, disabled) {
  const answer = S.bs.answers[index];
  // An open question is "Other" by construction — there is nothing to pick, so
  // its input IS the answer.
  const isOpen = question.kind === "open";
  const otherActive = isOpen || (answer && answer.other !== undefined);
  const answered = !!(answer && (answer.value || answer.other));

  const card = el("div", `bs-card ${answered ? "answered" : ""}`);
  const hd = el("div", "bs-card-hd");
  hd.append(el("span", "bs-chip", question.header || `Q${index + 1}`));
  if (question.blocking) {
    const b = el("span", "bs-chip bs-chip-blocking", "shapes the plan");
    b.title = "The shape of the plan depends on this answer, not just its detail.";
    hd.append(b);
  }
  if (answered && !disabled) {
    const clr = el("button", "bs-skip", "clear");
    clr.type = "button";
    clr.title = "Clear this answer — the council will decide it instead";
    clr.onclick = () => setBsAnswer(index, null);
    hd.append(clr);
  }
  card.append(hd, el("div", "bs-card-q", question.q));

  if (!isOpen) {
    const opts = el("div", "bs-opts");
    opts.setAttribute("role", "radiogroup");
    opts.setAttribute("aria-label", question.q);
    for (const o of question.options) {
      const on = answer && answer.value === o.label && answer.other === undefined;
      const b = el("button", `bs-opt ${on ? "selected" : ""}`);
      b.type = "button";
      b.setAttribute("role", "radio");
      b.setAttribute("aria-checked", String(!!on));
      b.disabled = !!disabled;
      const mark = el("span", "bs-opt-mark", on ? "◉" : "○");
      mark.setAttribute("aria-hidden", "true");
      const txt = el("span", "bs-opt-text");
      txt.append(el("span", "bs-opt-label", o.label));
      if (o.description) txt.append(el("span", "bs-opt-desc", o.description));
      b.append(mark, txt);
      b.onclick = () => setBsAnswer(index, on ? null : { value: o.label });
      opts.append(b);
    }
    const other = el("button", `bs-opt ${otherActive ? "selected" : ""}`);
    other.type = "button";
    other.setAttribute("role", "radio");
    other.setAttribute("aria-checked", String(!!otherActive));
    other.disabled = !!disabled;
    const m2 = el("span", "bs-opt-mark", otherActive ? "◉" : "○");
    m2.setAttribute("aria-hidden", "true");
    const t2 = el("span", "bs-opt-text");
    t2.append(el("span", "bs-opt-label", "Other…"),
              el("span", "bs-opt-desc", "Answer in your own words"));
    other.append(m2, t2);
    other.onclick = () => setBsAnswer(index, otherActive ? null : { other: "" });
    opts.append(other);
    card.append(opts);
  }

  if (otherActive) {
    const inp = el("input", "bs-open-input");
    inp.type = "text";
    inp.placeholder = isOpen ? "Your answer — or leave blank to skip" : "Your answer…";
    inp.value = (answer && answer.other) || "";
    inp.disabled = !!disabled;
    inp.oninput = () => {
      const v = inp.value;
      // An emptied box on an open question is a skip, not an empty answer —
      // otherwise a stray keystroke would send blank prose.
      if (isOpen && !v) S.bs.answers[index] = undefined, delete S.bs.answers[index];
      else S.bs.answers[index] = { other: v };
      // Deliberately NOT a re-render: rebuilding the card here would destroy
      // the input and take the caret with it on every keystroke.
      card.classList.toggle("answered", !!v);
    };
    card.append(inp);
    if (!isOpen) setTimeout(() => inp.focus(), 0);
  }
  return card;
}

/** Answer changes rebuild the card list, so the radio marks and the clear
 *  affordance stay in step with the state. */
function setBsAnswer(index, entry) {
  if (entry === null) delete S.bs.answers[index];
  else S.bs.answers[index] = entry;
  renderBsView();
}

/** One member's full answer for a round. Collapsed by default — these run to
 *  thousands of characters each, and four of them per round would bury the
 *  questions. Collapsed is not the same as discarded. */
function councilAnswers(council) {
  if (!council || !council.length) return null;
  const d = el("details", "bs-council");
  d.append(el("summary", null, `What each unit said (${council.length})`));
  for (const a of council) {
    const row = el("div", "bs-council-answer");
    const hd = el("div", "bs-council-hd");
    hd.append(el("span", "bs-council-name", a.provider_id));
    if (a.degraded) {
      hd.append(el("span", "bs-council-bad", `excluded — ${a.degraded_reason || "unusable response"}`));
    } else if (!a.ok) {
      hd.append(el("span", "bs-council-bad",
        (a.failure_kind || "failed") + (a.error_detail ? ` — ${a.error_detail}` : "")));
    } else {
      hd.append(el("span", "bs-council-meta",
        (a.latency_ms ? `${(a.latency_ms / 1000).toFixed(1)}s` : "") +
        (a.chars ? ` · ${a.chars}c` : "")));
    }
    row.append(hd);
    if ((a.content || "").trim()) row.append(el("div", "bs-council-body", a.content));
    d.append(row);
  }
  return d;
}

function roundHistory(rounds) {
  if (!rounds.length) return null;
  const d = el("details", "bs-history");
  d.append(el("summary", null, `Earlier rounds (${rounds.length})`));
  for (const r of [...rounds].reverse()) {
    const box = el("div", `bs-hist-round ${r.superseded ? "superseded" : ""}`);
    const hd = el("div", "bs-hist-hd");
    hd.append(document.createTextNode(
      (r.phase === "finalize" ? "Finalise pass" : `Round ${r.round_no}`) +
      (r.attempt > 1 ? ` · attempt ${r.attempt}` : "")));
    if (r.superseded) hd.append(el("span", "bs-hist-note", " — retried, did not complete"));
    box.append(hd);

    if (r.questions.length) {
      const ol = el("ol", "bs-qlist small");
      r.questions.forEach((q) => ol.append(el("li", null, q.q)));
      box.append(ol);
    }
    if (r.reply) {
      const rep = el("div", "bs-hist-reply");
      rep.append(el("span", "bs-hist-label", "You answered"), document.createTextNode(r.reply));
      box.append(rep);
    }
    if (r.plan_so_far) {
      const pd = el("details", "bs-council");
      pd.append(el("summary", null, "Plan draft at this round"));
      const inner = el("div", "bs-council-answer");
      inner.append(verdictBody(r.plan_so_far));
      pd.append(inner);
      box.append(pd);
    }
    const ca = councilAnswers(r.council);
    if (ca) box.append(ca);
    d.append(box);
  }
  return d;
}

function bsDetails(summaryText, bodyText) {
  const d = el("details", "bs-split");
  d.append(el("summary", null, summaryText));
  d.append(verdictBody(bodyText));
  return d;
}

/** The whole Brainstorm surface: the start form, the live round, the finished
 *  plan, and the prior-round history. */
function renderBsView() {
  const root = $("bsView");
  show(root, S.view === "brainstorm");
  if (S.view !== "brainstorm") return;
  root.textContent = "";
  const bs = S.bs, busy = bs.busy;

  /* ── no session yet ─────────────────────────────────────────────────── */
  if (!bs.sessionId) {
    const hd = el("div", "bs-hd");
    hd.append(el("span", "bs-title", "Brainstorm"),
              el("span", "bs-sub",
                 "The council asks you questions until the plan is worth building from, " +
                 "then writes it to a file for a coding agent."));
    root.append(hd);

    const start = el("div", "bs-start");
    const ta = el("textarea", "bs-topic");
    ta.placeholder = "What do you want to plan?  Describe the idea roughly — the questions come next.   (Ctrl+Enter)";
    ta.value = bs.draft;
    // Locked during a refine as well as a round: the rewrite replaces this
    // text, so edits made while it is in flight would be lost.
    ta.disabled = busy || bs.refining;
    ta.oninput = () => {
      bs.draft = ta.value;
      // Once the rewrite is edited by hand, "Undo" would restore over the
      // person's own words rather than over a machine rewrite.
      if (bs.preRefine !== null) bs.preRefine = null;
      if (bs.refineError) { bs.refineError = null; }
      syncBsStartBar();
    };
    ta.onkeydown = (e) => {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && ta.value.trim()) {
        e.preventDefault();
        const t = ta.value;
        bs.draft = ""; bs.preRefine = null;
        startBrainstorm(t);
      }
    };
    start.append(ta);
    if (bs.refineError) start.append(el("div", "qbar-error", bs.refineError));

    const bar = el("div", "bs-start-bar");
    const refineBtn = el("button", `qbar-refine ${bs.refining ? "busy" : ""}`);
    refineBtn.type = "button";
    refineBtn.id = "bsRefine";
    refineBtn.title = "Rewrite this into a sharper topic";
    refineBtn.setAttribute("aria-label", "Refine topic");
    const rIco = el("span", "qbar-refine-ico", bs.refining ? "◌" : "✦");
    rIco.setAttribute("aria-hidden", "true");
    refineBtn.append(rIco, el("span", "qbar-refine-txt", bs.refining ? "Refining…" : "Refine"));
    refineBtn.onclick = bsRefine;
    bar.append(refineBtn);

    if (bs.preRefine !== null && !bs.refining) {
      const undo = el("button", "qbar-undo", "↺ Undo");
      undo.type = "button";
      undo.title = "Restore what you wrote";
      undo.disabled = busy;
      undo.onclick = () => {
        bs.draft = bs.preRefine; bs.preRefine = null; bs.refineError = null;
        renderBsView();
      };
      bar.append(undo);
    }

    const n = S.selected.size;
    bar.append(el("span", "bs-note",
      `${n} unit${n === 1 ? "" : "s"} selected · each round takes a few minutes`));
    bar.append(el("span", "qbar-spacer"));
    const begin = el("button", "btn active", "Begin session");
    begin.id = "bsBegin";
    // Also blocked mid-refine: starting now would seed the session with the
    // pre-rewrite text and throw the rewrite away as it landed.
    begin.onclick = () => {
      const t = ta.value;
      bs.draft = ""; bs.preRefine = null;
      startBrainstorm(t);
    };
    bar.append(begin);
    start.append(bar);
    root.append(start);
    syncBsStartBar();

    if (bs.error) root.append(bsCallout("could not start", bs.error));

    if (bs.sessions.length) {
      const drawer = el("div", "drawer");
      drawer.append(el("div", "drawer-hd", "Past sessions"));
      for (const s of bs.sessions) {
        const row = el("div", "row");
        row.append(el("span", "q", s.topic));
        row.append(el("span", "meta",
          `${s.status === "complete" ? "plan ready" : s.status} · ` +
          `${s.rounds} round${s.rounds === 1 ? "" : "s"} · ` +
          new Date(s.created_at).toLocaleString()));
        row.onclick = () => openBsSession(s.id);
        drawer.append(row);
      }
      root.append(drawer);
    }
    return;
  }

  /* ── finished: the plan ─────────────────────────────────────────────── */
  if (bs.status === "complete" && bs.planMd) {
    const hd = el("div", "bs-hd");
    hd.append(el("span", "bs-title", "Plan ready"), el("span", "bs-sub", bs.topic));
    root.append(hd);

    const bar = el("div", "bs-plan-bar");
    const state = el("span", "bs-save-state");
    if (bs.savedTo) {
      state.append(el("span", "bs-saved-tick", "✓"), document.createTextNode(" Saved as "),
                   el("code", null, bs.savedTo));
    } else {
      state.textContent = "Not saved anywhere yet — nothing has been written to disk.";
    }
    bar.append(state, el("span", "qbar-spacer"));
    const save = el("button", "navitem");
    save.type = "button";
    save.append(el("span", "navitem-ic", "↓"),
                document.createTextNode(bs.savedTo ? "Save again…" : "Save as…"));
    save.onclick = bsSavePlan;
    const copy = el("button", "navitem");
    copy.type = "button";
    copy.append(el("span", "navitem-ic", "⧉"), document.createTextNode("Copy markdown"));
    copy.onclick = () => navigator.clipboard && navigator.clipboard.writeText(bs.planMd || "");
    bar.append(save, copy);
    root.append(bar);

    const hint = el("div", "bs-hint");
    hint.append(document.createTextNode(
      "Hand this to Claude Code — it reads as a standalone brief, with the session " +
      "transcript folded in at the end. Copy it straight into a prompt, or save it as "),
      el("code", null, bs.planFilename || "a .md file"),
      document.createTextNode(" wherever you keep your plans."));
    root.append(hint);

    const v = el("div", "verdict");
    v.append(verdictBody(bs.planMd));
    root.append(v);

    const hist = roundHistory(bs.rounds);
    if (hist) root.append(hist);
    return;
  }

  /* ── active session ─────────────────────────────────────────────────── */
  const latest = latestRound();
  const hd = el("div", "bs-hd");
  hd.append(el("span", "bs-title", `Brainstorm · round ${latest ? latest.round_no : 1}`),
            el("span", "bs-sub", bs.topic));
  root.append(hd);

  if (busy) { const pn = phaseNote(bs.phase); if (pn) root.append(pn); }
  if (bs.error) {
    root.append(bsCallout("round failed", bs.error,
      "Nothing was lost — every earlier round is saved. Try again."));
  }

  if (latest) {
    if (latest.parsed) {
      const v = el("div", "verdict");
      const vh = el("div", "verdict-hd");
      vh.append(el("span", "verdict-title", "Plan so far"),
                el("span", "verdict-quorum",
                   `round ${latest.round_no}` + (latest.chairman ? ` · merged by ${latest.chairman}` : "")));
      v.append(vh, verdictBody(latest.plan_so_far));
      root.append(v);

      if (latest.agreement) root.append(bsDetails("Where the council agreed and split", latest.agreement));
      if (latest.corrections_text) root.append(bsDetails("Factual errors caught this round", latest.corrections_text));
      if (latest.dropped_questions.length) {
        root.append(bsDetails(
          `Questions dropped as already settled (${latest.dropped_questions.length})`,
          latest.dropped_questions.map((q) => `- ${q}`).join("\n")));
      }
    } else {
      // The headings did not parse. The text still cost minutes of real browser
      // time and usually contains the plan anyway, so it is shown rather than
      // thrown away.
      const v = el("div", "verdict");
      const vh = el("div", "verdict-hd");
      vh.append(el("span", "verdict-title", `Round ${latest.round_no}`),
                el("span", "verdict-quorum", "unstructured response"));
      v.append(vh, verdictBody(latest.raw_text));
      root.append(v);
    }

    // The raw material this round's merge came from, available without leaving
    // the round.
    const ca = councilAnswers(latest.council);
    if (ca) root.append(ca);

    if (latest.questions.length) {
      const box = el("div", "bs-questions");
      const qh = el("div", "bs-questions-hd");
      qh.append(document.createTextNode("Questions for you"),
                el("span", "bs-qcount",
                   `${latest.questions.length} · answer what you can, skip the rest`));
      box.append(qh);
      const cards = el("div", "bs-cards");
      latest.questions.forEach((q, i) => cards.append(questionCard(i, q, busy)));
      box.append(cards);
      root.append(box);
    }
  }

  if (!busy) {
    const qbar = el("div", "qbar bs-reply");
    const ta = el("textarea");
    ta.placeholder = latest && latest.questions.length
      ? "Anything else the questions didn't cover? Optional.   (Ctrl+Enter)"
      : "Anything to add before the next round?   (Ctrl+Enter)";
    ta.value = bs.reply;
    ta.oninput = () => { bs.reply = ta.value; };
    ta.onkeydown = (e) => {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); bsNextRound(); }
    };
    qbar.append(ta);

    const tools = el("div", "qbar-toolbar");
    if (latest && latest.ready) {
      const rd = el("span", "bs-ready", "✓ The council thinks the plan is ready");
      rd.title = latest.ready_note || "";
      tools.append(rd);
    }
    tools.append(el("span", "qbar-spacer"));
    const next = el("button", "btn", "Next round");
    next.onclick = bsNextRound;
    // Emphasised once the council says it is ready — a hint about when to stop,
    // never a gate. The user ends the session.
    const fin = el("button", `btn ${latest && latest.ready ? "active" : ""}`, "Finalize plan");
    fin.title = "End the session and write the plan file";
    fin.disabled = !bs.rounds.length;
    fin.onclick = bsFinalize;
    tools.append(next, fin);
    qbar.append(tools);
    root.append(qbar);
  } else {
    const halt = el("div", "qbar-toolbar bs-halt");
    halt.append(el("span", "qbar-spacer"));
    const b = el("button", "navitem danger");
    b.type = "button";
    b.append(el("span", "navitem-ic", "■"), document.createTextNode("Halt round"));
    b.onclick = bsCancel;
    halt.append(b);
    root.append(halt);
  }

  // Everything except the round shown above — including attempts that failed,
  // which are part of the record.
  const hist = roundHistory(bs.rounds.filter(
    (r) => !latest || r.round_no !== latest.round_no || r.attempt !== latest.attempt));
  if (hist) root.append(hist);
}

/** Enable/disable for the start screen, kept out of renderBsView so typing in
 *  the topic box does not rebuild the textarea under the caret. */
function syncBsStartBar() {
  const begin = $("bsBegin"), refine = $("bsRefine");
  if (!begin) return;
  const draft = S.bs.draft.trim();
  begin.disabled = bsBusy() || S.bs.refining || !draft || S.selected.size === 0 || !online();
  if (refine) refine.disabled = bsBusy() || S.bs.refining || !draft || !online();
}

/** Prompt refinement for the topic, same contract as the council composer: the
 *  rewrite lands in the box to be read and edited, never sent on the user's
 *  behalf, and preRefine keeps the original so it is undoable.
 *
 *  It matters more here, if anything — the topic seeds every round that
 *  follows, so a vague one costs minutes of questions rather than one answer. */
async function bsRefine() {
  const q = S.bs.draft.trim();
  if (!q || S.bs.refining || bsBusy() || !online()) return;
  S.bs.refining = true;
  S.bs.refineError = null;
  renderBsView();
  try {
    const form = new FormData();
    form.append("question", q);
    const res = await fetch(`${link.api}/api/refine`, authed({ method: "POST", body: form }));
    if (!res.ok) {
      const body = await res.json().catch(() => null);
      throw new Error((body && body.detail) || `Refine failed (${res.status})`);
    }
    const { refined } = await res.json();
    // Refining twice must not make the first rewrite the thing Undo restores —
    // only ever the text the person actually wrote.
    if (S.bs.preRefine === null) S.bs.preRefine = q;
    S.bs.draft = refined;
  } catch (e) {
    S.bs.refineError = (e && e.message) || "Refine failed.";
  } finally {
    S.bs.refining = false;
    renderBsView();
  }
}

/* ══ boot ══════════════════════════════════════════════════════════════════ */
async function boot() {
  if (!online()) return;
  try {
    const r = await fetch(`${link.api}/api/providers`, authed());
    S.providers = await r.json();
    // First load only: everything the engine has enabled. A later reconnect
    // must not silently switch units back on that were turned off by hand.
    if (!S.selected.size) S.selected = new Set(S.providers.filter((p) => p.enabled).map((p) => p.id));
    renderUnitChips();
  } catch {}
  loadHistory();
  renderStudioNav();
  loadBsSessions();
}

applyNav();
applyAudioNav();
applyMute();
autosize();
updateEnabled();
setView("council");
connect().then(boot);
</script>
</body>
