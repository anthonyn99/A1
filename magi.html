    const dx = t.clientX - x0, dy = t.clientY - y0;
    x0 = null;
    if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.4) {
      node.dataset.swiped = String(Date.now());
      (dx < 0 ? left : right)();
    }
  }, { passive: true });
}
const justSwiped = (node) => Date.now() - (+node.dataset.swiped || 0) < 450;

/** Keys go to whichever card is open, unless the person is typing. */
document.addEventListener("keydown", (e) => {
  if (!S.studio || !S.studio.onKey || !S.studio.active || $("studioView").hidden) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const t = e.target;
  if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
  S.studio.onKey(e);
});

function renderCard(kind, a) {
  const raw = a.raw_text || "";
  switch (kind) {
    case "table":  return renderStudioTable(raw);
    // Structurally identical to a verdict — headings, lists, tables, prose — so
    // it reuses that renderer wholesale rather than duplicating the parser.
    case "report": return renderStudioReport(raw);
  }
  const items = studioItems(kind, a);
  if (!items.length) return rawFallback(raw);
  switch (kind) {
    case "flashcards": return renderFlashcards(items);
    case "quiz":       return renderQuiz(items);
    case "slides":     return renderSlides(items);
    case "audio":      return renderAudio(items);
    case "mindmap":    return renderMindMap(items[0], raw);
  }
}

/* ── Report ─────────────────────────────────────────────────────────────── */
function renderStudioReport(raw) {
  // The one Studio card that is a document rather than a widget, so it is the
  // one worth taking away whole -- as rich text, or as a .md file.
  const body = briefBody(raw, { report: true, title: S.viewQuestion || "" });
  S.studio.cleanup = () => body.stopSpy && body.stopSpy();
  const bar = el("div", "st-bar st-bar-end");
  bar.append(
    copyButton(() => ({ node: body, md: raw }), { label: "Copy report" }),
    stBtn("Download .md", "download", () => downloadText(studioFileName("report", "md"), raw, "text/markdown")),
  );
  const wrap = el("div", "st-report");
  wrap.append(bar, body);
  return wrap;
}

/* ── Data Table ─────────────────────────────────────────────────────────── */
function renderStudioTable(text) {
  let head = null;
  const rows = [], prose = [], mdLines = [];
  for (const line of String(text).replace(/\r/g, "").split("\n")) {
    if (!TABLE_ROW.test(line)) { if (line.trim()) prose.push(line); continue; }
    mdLines.push(line.trim());
    if (TABLE_SEP.test(line)) { if (rows.length === 1 && !head) head = rows.shift(); continue; }
    rows.push(cells(line));
  }
  if (!rows.length && !head) return rawFallback(text);
  const ncol = Math.max(head ? head.length : 0, ...rows.map((r) => r.length));
  const pad = (r) => Array.from({ length: ncol }, (_, i) => r[i] ?? "");
  const cols = pad(head || []).map((h, i) => h || `Column ${i + 1}`);
  const data = rows.map(pad);

  const st = (S.studio.ui.table ||= { col: -1, dir: 1, q: "" });
  const wrap = el("div", "st-table");

  // toolbar: size, filter, copy, csv
  const bar = el("div", "st-bar");
  bar.append(el("span", "st-meta", `${data.length} row${data.length === 1 ? "" : "s"} · ${ncol} column${ncol === 1 ? "" : "s"}`));
  const find = el("input", "st-search");
  find.type = "search"; find.placeholder = "Filter rows…"; find.value = st.q;
  find.setAttribute("aria-label", "Filter rows");
  const csv = () => [cols, ...data].map((r) => r.map((c) => {
    const v = mdPlain(c);
    return /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v;
  }).join(",")).join("\n");
  const table = el("table", "st-tbl");
  const acts = el("div", "st-actions");
  acts.append(
    copyButton(() => ({ node: table, md: mdLines.join("\n") }), { label: "Copy" }),
    stBtn("CSV", "download", () => downloadText(studioFileName("table", "csv"), csv(), "text/csv"), "", "Download as CSV"),
  );
  if (data.length > 4) bar.append(find);
  bar.append(acts);

  const thead = el("thead"), tbody = el("tbody");
  const htr = el("tr");
  cols.forEach((c, i) => {
    const th = el("th");
    const b = el("button", "st-th");
    b.type = "button";
    b.append(mdSpan(c), icSpan("st-sort", "sort"));
    b.title = "Sort by this column";
    b.onclick = () => {
      if (st.col !== i) { st.col = i; st.dir = 1; }
      else if (st.dir === 1) st.dir = -1;
      else st.col = -1;
      paint();
    };
    th.append(b);
    htr.append(th);
  });
  thead.append(htr);
  table.append(thead, tbody);

  const num = (s) => {
    const m = mdPlain(s).replace(/,/g, "").match(/-?\d+(?:\.\d+)?/);
    return m ? parseFloat(m[0]) : NaN;
  };
  const paint = () => {
    [...htr.children].forEach((th, i) => {
      th.classList.toggle("sorted", st.col === i);
      th.classList.toggle("desc", st.col === i && st.dir === -1);
      th.setAttribute("aria-sort", st.col !== i ? "none" : st.dir === 1 ? "ascending" : "descending");
    });
    const q = st.q.trim().toLowerCase();
    let view = data.filter((r) => !q || r.some((c) => mdPlain(c).toLowerCase().includes(q)));
    if (st.col >= 0) {
      const k = st.col;
      const allNum = view.every((r) => !mdPlain(r[k]) || !isNaN(num(r[k])));
      view = [...view].sort((a, b) => st.dir * (allNum
        ? (num(a[k]) || 0) - (num(b[k]) || 0)
        : mdPlain(a[k]).localeCompare(mdPlain(b[k]), undefined, { numeric: true, sensitivity: "base" })));
    }
    tbody.textContent = "";
    for (const r of view) {
      const tr = el("tr");
      r.forEach((c, i) => {
        const td = el("td");
        td.dataset.label = mdPlain(cols[i]);
        td.append(mdSpan(c));
        tr.append(td);
      });
      tbody.append(tr);
    }
    if (!view.length) {
      const tr = el("tr", "st-empty"), td = el("td", null, "No rows match that filter.");
      td.colSpan = ncol; tr.append(td); tbody.append(tr);
    }
  };
  find.oninput = () => { st.q = find.value; paint(); };
  paint();

  const scroller = el("div", "st-tbl-wrap");
  scroller.append(table);
  wrap.append(bar, scroller);
  // Anything the model wrote around the table (a caption, a source line) is
  // kept rather than silently dropped.
  if (prose.length) wrap.append(mdBody(prose.join("\n")));
  return wrap;
}

/* ── Flashcards ─────────────────────────────────────────────────────────── */
function renderFlashcards(cards) {
  const n = cards.length;
  const fresh = () => ({ order: cards.map((_, i) => i), pos: 0, flipped: false, known: new Set(), grid: false, done: false, gridFlip: new Set() });
  let st = S.studio.ui.flashcards;
  if (!st || st.n !== n) st = S.studio.ui.flashcards = Object.assign(fresh(), { n });

  const box = el("div", "fc");
  let dir = 0;   // -1 / +1: which way the next card slides in

  const faces = (c, idx) => {
    const inner = el("div", "fc-inner");
    const front = el("div", "fc-face fc-front");
    const fhd = el("div", "fc-face-hd");
    fhd.append(el("span", "fc-tag", "Term"), el("span", "fc-num", `${idx + 1} / ${n}`));
    front.append(fhd, mdSpan(c.front, "fc-text fc-text-front", "div"),
                 el("div", "fc-hint", "Click to reveal"));
    const back = el("div", "fc-face fc-back");
    const bhd = el("div", "fc-face-hd");
    bhd.append(el("span", "fc-tag", "Answer"), el("span", "fc-num", `${idx + 1} / ${n}`));
    back.append(bhd, el("div", "fc-back-q", mdPlain(c.front)),
                mdSpan(c.back, `fc-text fc-text-back ${c.back.length > 220 ? "long" : ""}`, "div"));
    inner.append(front, back);
    return inner;
  };

  const go = (d) => {
    dir = d;
    const next = st.pos + d;
    if (next < 0) return;
    if (next >= st.order.length) { st.done = true; paint(); return; }
    st.pos = next; st.flipped = false; paint();
  };
  const flip = () => {
    st.flipped = !st.flipped;
    const card = box.querySelector(".fc-card");
    if (card) { card.classList.toggle("flipped", st.flipped); card.setAttribute("aria-pressed", String(st.flipped)); }
  };
  const mark = (knows) => {
    const idx = st.order[st.pos];
    knows ? st.known.add(idx) : st.known.delete(idx);
    go(1);
  };
  const shuffle = () => {
    const o = st.order;
    for (let i = o.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [o[i], o[j]] = [o[j], o[i]]; }
    st.pos = 0; st.flipped = false; st.done = false; dir = 0; paint();
  };
  const restart = (onlyLearning) => {
    const learning = cards.map((_, i) => i).filter((i) => !st.known.has(i));
    st.order = onlyLearning && learning.length ? learning : cards.map((_, i) => i);
    if (!onlyLearning) st.known.clear();
    st.pos = 0; st.flipped = false; st.done = false; dir = 0; paint();
  };

  const paint = () => {
    box.textContent = "";
    const bar = el("div", "st-bar");
    const meta = el("span", "st-meta");
    meta.append(`${n} cards`);
    if (st.known.size) meta.append(el("span", "st-dot"), el("span", "st-good", `${st.known.size} known`));
    bar.append(meta);
    const acts = el("div", "st-actions");
    acts.append(
      stBtn("Shuffle", "shuffle", shuffle),
      stBtn(st.grid ? "Study" : "All cards", st.grid ? "deck" : "grid", () => { st.grid = !st.grid; paint(); }),
    );
    bar.append(acts);
    box.append(bar);

    if (st.grid) {
      const grid = el("div", "fc-grid");
      cards.forEach((c, idx) => {
        const card = el("button", `fc-card fc-mini ${st.gridFlip.has(idx) ? "flipped" : ""} ${st.known.has(idx) ? "known" : ""}`);
        card.type = "button";
        card.append(faces(c, idx));
        card.onclick = () => {
          st.gridFlip.has(idx) ? st.gridFlip.delete(idx) : st.gridFlip.add(idx);
          card.classList.toggle("flipped", st.gridFlip.has(idx));
        };
        grid.append(card);
      });
      box.append(grid);
      S.studio.onKey = null;
      return;
    }

    const total = st.order.length;
    const track = el("div", "st-track");
    const fill = el("div", "st-track-fill");
    fill.style.width = `${((st.done ? total : st.pos + 1) / total) * 100}%`;
    track.append(fill);
    box.append(track);

    if (st.done) {
      const learning = cards.length - st.known.size;
      const end = el("div", "fc-done");
      end.append(icSpan("fc-done-ic", "tick"), el("div", "fc-done-title", "Deck complete"),
                 el("div", "fc-done-sub", learning
                   ? `${st.known.size} known · ${learning} still learning`
                   : `You know all ${n} cards.`));
      const acts2 = el("div", "fc-done-acts");
      if (learning && st.known.size) acts2.append(stBtn(`Review ${learning} still learning`, "flip", () => restart(true), "primary"));
      acts2.append(stBtn("Start over", "undo", () => restart(false), learning && st.known.size ? "" : "primary"));
      end.append(acts2);
      box.append(end);
      S.studio.onKey = (e) => { if (e.key === "ArrowLeft") { st.done = false; paint(); e.preventDefault(); } };
      return;
    }

    const idx = st.order[st.pos];
    const stage = el("div", "fc-stage");
    const card = el("button", `fc-card ${st.flipped ? "flipped" : ""} ${st.known.has(idx) ? "known" : ""} ${dir > 0 ? "in-next" : dir < 0 ? "in-prev" : ""}`);
    card.type = "button";
    card.setAttribute("aria-pressed", String(st.flipped));
    card.setAttribute("aria-label", "Flashcard — press to flip");
    card.append(faces(cards[idx], idx));
    card.onclick = () => { if (!justSwiped(stage)) flip(); };
    stage.append(card);
    onSwipe(stage, () => go(1), () => go(-1));
    box.append(stage);

    const ctl = el("div", "fc-ctl");
    const prev = stBtn("", "chevL", () => go(-1), "round", "Previous card (←)");
    prev.disabled = st.pos === 0;
    ctl.append(
      prev,
      stBtn("Still learning", "x", () => mark(false), "fc-learn"),
      stBtn("Got it", "tick", () => mark(true), "fc-know"),
      stBtn("", "chevR", () => go(1), "round", "Next card (→)"),
    );
    box.append(ctl);
    box.append(el("div", "st-keys", "Space flip · ← → move · 1 still learning · 2 got it"));

    S.studio.onKey = (e) => {
      if (e.key === " " || e.key === "Enter" || e.key === "ArrowUp" || e.key === "ArrowDown") flip();
      else if (e.key === "ArrowRight") go(1);
      else if (e.key === "ArrowLeft") go(-1);
      else if (e.key === "1") mark(false);
      else if (e.key === "2") mark(true);
      else return;
      e.preventDefault();
    };
  };
  paint();
  return box;
}

/* ── Quiz ───────────────────────────────────────────────────────────────── */
function renderQuiz(questions) {
  const n = questions.length;
  let st = S.studio.ui.quiz;
  if (!st || st.n !== n) st = S.studio.ui.quiz = { n, i: 0, picked: {}, results: false };
  const box = el("div", "qz");

  const score = () => questions.filter((q, i) => st.picked[i] === q.correct).length;
  const answered = () => Object.keys(st.picked).length;
  const go = (i) => { st.results = false; st.i = Math.max(0, Math.min(n - 1, i)); paint(); };
  const next = () => (st.i < n - 1 ? go(st.i + 1) : (st.results = true, paint()));

  const paint = () => {
    box.textContent = "";
    const bar = el("div", "st-bar");
    const meta = el("span", "st-meta");
    meta.append(`${n} questions`);
    if (answered()) meta.append(el("span", "st-dot"), el("span", "st-good", `${score()} / ${answered()} correct`));
    bar.append(meta);
    const acts = el("div", "st-actions");
    if (answered()) acts.append(stBtn("Restart", "undo", () => { st.picked = {}; go(0); }));
    if (!st.results && answered()) acts.append(stBtn("Results", "tick", () => { st.results = true; paint(); }));
    bar.append(acts);
    box.append(bar);

    // One segment per question: where you are, and how each answer went.
    const segs = el("div", "qz-segs");
    questions.forEach((q, i) => {
      const s = el("button", "qz-seg");
      s.type = "button";
      s.title = `Question ${i + 1}`;
      s.setAttribute("aria-label", `Go to question ${i + 1}`);
      if (st.picked[i]) s.classList.add(st.picked[i] === q.correct ? "ok" : "bad");
      if (!st.results && i === st.i) s.classList.add("cur");
      s.onclick = () => go(i);
      segs.append(s);
    });
    box.append(segs);

    if (st.results) return paintResults();

    const q = questions[st.i], chosen = st.picked[st.i];
    const card = el("div", "qz-card");
    card.append(el("div", "qz-kicker", `Question ${st.i + 1} of ${n}`),
                mdSpan(q.text, "qz-q", "div"));
    const opts = el("div", "qz-opts");
    const letters = Object.keys(q.options);
    letters.forEach((L, k) => {
      const b = el("button", "qz-opt");
      b.type = "button";
      const state = !chosen ? "" : L === q.correct ? "correct" : L === chosen ? "wrong" : "dim";
      if (state) b.classList.add(state);
      b.disabled = !!chosen;
      b.append(el("span", "qz-letter", L), mdSpan(q.options[L], "qz-opt-txt"));
      if (state === "correct") b.append(icSpan("qz-mark", "tick"));
      if (state === "wrong") b.append(icSpan("qz-mark", "x"));
      b.title = `Answer ${L} (key ${k + 1})`;
      b.onclick = () => { if (!st.picked[st.i]) { st.picked[st.i] = L; paint(); } };
      opts.append(b);
    });
    card.append(opts);

    // The explanation only appears once an answer is locked in — showing it
    // beforehand gives the answer away.
    if (chosen) {
      const ok = chosen === q.correct;
      const fb = el("div", `qz-fb ${ok ? "ok" : "bad"}`);
      const hd = el("div", "qz-fb-hd");
      hd.append(icSpan("qz-fb-ic", ok ? "tick" : "x"),
                el("span", null, ok ? "Correct" : `Not quite — the answer is ${q.correct}`));
      fb.append(hd);
      if (q.why) fb.append(mdSpan(q.why, "qz-why", "div"));
      card.append(fb);
    }
    box.append(card);

    const nav = el("div", "qz-nav");
    const prev = stBtn("Back", "chevL", () => go(st.i - 1));
    prev.disabled = st.i === 0;
    const last = st.i === n - 1;
    const fwd = stBtn(!chosen ? "Skip" : last ? "See results" : "Next question", last && chosen ? "tick" : "chevR",
                      next, `ic-end ${chosen ? "primary" : ""}`);
    nav.append(prev, fwd);
    box.append(nav);
    box.append(el("div", "st-keys", "1–4 or A–D answer · Enter next · ← back"));

    S.studio.onKey = (e) => {
      const k = e.key.toUpperCase();
      const byNum = /^[1-4]$/.test(k) ? letters[+k - 1] : null;
      const pick = byNum || (letters.includes(k) ? k : null);
      if (pick && !st.picked[st.i]) { st.picked[st.i] = pick; paint(); }
      else if (e.key === "Enter" || e.key === "ArrowRight") next();
      else if (e.key === "ArrowLeft") go(st.i - 1);
      else return;
      e.preventDefault();
    };
  };

  const paintResults = () => {
    const s = score(), pct = Math.round((s / n) * 100);
    const res = el("div", "qz-results");
    const ring = el("div", "qz-ring");
    const R = 42, C = 2 * Math.PI * R;
    ring.innerHTML =
      `<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="${R}" class="qz-ring-bg"/>` +
      `<circle cx="50" cy="50" r="${R}" class="qz-ring-fg" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - s / n)}"/></svg>`;
    ring.append(el("div", "qz-ring-num", `${pct}%`));
    const msg = pct === 100 ? "Perfect score." : pct >= 80 ? "Great work." : pct >= 50 ? "Good start — review the ones you missed." : "Worth another pass.";
    const head = el("div", "qz-res-hd");
    const txt = el("div");
    txt.append(el("div", "qz-res-title", `${s} of ${n} correct`), el("div", "qz-res-sub", msg));
    head.append(ring, txt);
    res.append(head);

    const list = el("div", "qz-review");
    questions.forEach((q, i) => {
      const p = st.picked[i], ok = p === q.correct;
      const row = el("button", `qz-rv ${!p ? "skip" : ok ? "ok" : "bad"}`);
      row.type = "button";
      row.append(icSpan("qz-rv-ic", !p ? "chevR" : ok ? "tick" : "x"));
      const body = el("div", "qz-rv-body");
      body.append(mdSpan(q.text, "qz-rv-q", "div"),
                  el("div", "qz-rv-a", !p ? `Skipped · answer ${q.correct}` : ok ? `Your answer ${p}` : `Your answer ${p} · correct ${q.correct}`));
      row.append(body);
      row.onclick = () => go(i);
      list.append(row);
    });
    res.append(list);

    const missed = questions.map((q, i) => i).filter((i) => st.picked[i] !== questions[i].correct);
    const acts = el("div", "qz-nav");
    if (missed.length && missed.length < n) {
      acts.append(stBtn(`Retry ${missed.length} missed`, "undo", () => {
        missed.forEach((i) => delete st.picked[i]);
        go(missed[0]);
      }));
    }
    acts.append(stBtn("Retake quiz", "undo", () => { st.picked = {}; go(0); }, "primary"));
    res.append(acts);
    box.append(res);
    S.studio.onKey = null;
  };

  paint();
  return box;
}

/* ── Mind Map ───────────────────────────────────────────────────────────── */
function renderMindMap(d, raw) {
  const root = (d && d.root) || "", branches = (d && d.branches) || [];
  if (!root && !branches.length) return rawFallback(raw);

  const host = el("div", "mindmap");
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "mm-links");
  svg.setAttribute("aria-hidden", "true");
  const rootEl = mdSpan(root, "mm-root", "div");
  const branchBox = el("div", "mm-branches");
  const nodeEls = new Map();

  const build = (nodes, parentId) => {
    const frag = document.createDocumentFragment();
    nodes.forEach((n, i) => {
      const id = `${parentId}-${i}`;
      const col = el("div", "mm-col");
      const node = mdSpan(n.text, "mm-node", "div");
      nodeEls.set(id, { el: node, node });
      col.append(node);
      if (n.children && n.children.length) {
        const kids = el("div", "mm-children");
        kids.append(build(n.children, id));
        col.append(kids);
      }
      frag.append(col);
    });
    return frag;
  };
  branchBox.append(build(branches, "b"));
  host.append(svg, rootEl, branchBox);

  // Same measure-after-layout approach as the council wiring: element positions
  // are only real once the browser has laid them out, so draw on rAF and redraw
  // on resize.
  const draw = () => {
    if (!host.isConnected) return;
    const H = host.getBoundingClientRect(), R = rootEl.getBoundingClientRect();
    if (!R.width) return;
    const rx = R.left - H.left + R.width + host.scrollLeft, ry = R.top - H.top + R.height / 2;
    svg.textContent = "";
    svg.style.width = `${host.scrollWidth}px`;
    const walk = (nodes, parentId, px, py) => {
      nodes.forEach((n, i) => {
        const id = `${parentId}-${i}`;
        const rec = nodeEls.get(id);
        if (!rec) return;
        const B = rec.el.getBoundingClientRect();
        const x = B.left - H.left + host.scrollLeft, y = B.top - H.top + B.height / 2;
        const mid = (px + x) / 2;
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", `M ${px} ${py} C ${mid} ${py}, ${mid} ${y}, ${x} ${y}`);
        path.setAttribute("class", "mm-link");
        svg.append(path);
        walk(n.children || [], id, x + B.width, y);
      });
    };
    walk(branches, "b", rx, ry);
  };
  requestAnimationFrame(draw);
  new ResizeObserver(() => requestAnimationFrame(draw)).observe(host);

  const outline = [`# ${mdPlain(root)}`, ...branches.flatMap((b) =>
    [`- ${b.text}`, ...(b.children || []).map((c) => `  - ${c.text}`)])].join("\n");
  const wrap = el("div", "st-mindmap");
  const bar = el("div", "st-bar st-bar-end");
  bar.append(copyButton(() => ({ md: outline }), { label: "Copy outline" }));
  wrap.append(bar, host);
  return wrap;
}

/* ── Slide Deck ─────────────────────────────────────────────────────────── */
/** One slide, sized entirely in container units so the same element is a
 *  full slide on the stage, a thumbnail in the strip, and a projector-sized
 *  slide when presenting -- one layout, scaled, never three. */
function slideEl(s, idx, n, mini) {
  const wrap = el("div", `sd-slide ${mini ? "sd-mini" : ""}`);
  const kind = idx === 0 ? "is-title" : idx === n - 1 && n > 2 ? "is-end" : "";
  const inner = el("div", `sd-inner ${kind}`);
  const top = el("div", "sd-top");
  top.append(el("span", "sd-brand", "MAGI"), el("span", "sd-no", String(idx + 1).padStart(2, "0")));
  const body = el("div", "sd-body");
  body.append(mdSpan(s.title || "", "sd-title", "div"));
  if (s.bullets && s.bullets.length) {
    const ul = el("ul", "sd-bullets");
    s.bullets.forEach((b) => ul.append(mdSpan(b, null, "li")));
    body.append(ul);
  }
  const foot = el("div", "sd-foot");
  foot.append(el("span", null, kind === "is-end" ? "Summary" : kind === "is-title" ? "Overview" : ""),
              el("span", null, `${idx + 1} / ${n}`));
  inner.append(top, body, foot);
  wrap.append(inner);
  return wrap;
}

function renderSlides(slides) {
  const n = slides.length;
  let st = S.studio.ui.slides;
  if (!st || st.n !== n) st = S.studio.ui.slides = { n, i: 0, grid: false };
  const box = el("div", "sd");
  let overlay = null, dir = 0;

  const outline = () => slides.map((s, i) =>
    `## ${i + 1}. ${s.title}\n${(s.bullets || []).map((b) => `- ${b}`).join("\n")}`).join("\n\n");

  const go = (i) => {
    const t = Math.max(0, Math.min(n - 1, i));
    if (t === st.i) return;
    dir = t > st.i ? 1 : -1;
    st.i = t;
    paint();
    if (overlay) paintOverlay();
  };

  const closePresent = () => {
    if (!overlay) return;
    const o = overlay; overlay = null;
    o.remove();
    document.removeEventListener("fullscreenchange", onFs);
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    document.body.classList.remove("sd-presenting");
  };
  const onFs = () => { if (!document.fullscreenElement) closePresent(); };
  const paintOverlay = () => {
    const stage = overlay.querySelector(".sd-present-stage");
    stage.textContent = "";
    stage.append(slideEl(slides[st.i], st.i, n));
    overlay.querySelector(".sd-present-count").textContent = `${st.i + 1} / ${n}`;
  };
  const present = () => {
    if (overlay) return;
    overlay = el("div", "sd-present");
    const stage = el("div", "sd-present-stage");
    stage.onclick = (e) => {
      if (justSwiped(stage)) return;
      const r = stage.getBoundingClientRect();
      go(e.clientX - r.left < r.width * 0.33 ? st.i - 1 : st.i + 1);
    };
    onSwipe(stage, () => go(st.i + 1), () => go(st.i - 1));
    const hud = el("div", "sd-present-hud");
    hud.append(stBtn("", "chevL", () => go(st.i - 1), "round", "Previous"),
               el("span", "sd-present-count"),
               stBtn("", "chevR", () => go(st.i + 1), "round", "Next"),
               stBtn("", "x", closePresent, "round", "Exit (Esc)"));
    overlay.append(stage, hud);
    document.body.append(overlay);
    document.body.classList.add("sd-presenting");
    paintOverlay();
    // Real fullscreen where the platform allows it; the overlay alone is the
    // presentation on iPhone, which has no element fullscreen.
    if (overlay.requestFullscreen) {
      overlay.requestFullscreen().then(() => document.addEventListener("fullscreenchange", onFs)).catch(() => {});
    }
  };
  S.studio.cleanup = closePresent;

  const paint = () => {
    box.textContent = "";
    const bar = el("div", "st-bar");
    bar.append(el("span", "st-meta", `${n} slides`));
    const acts = el("div", "st-actions");
    acts.append(
      stBtn(st.grid ? "Slide view" : "All slides", st.grid ? "deck" : "grid", () => { st.grid = !st.grid; paint(); }),
      copyButton(() => ({ md: outline() }), { label: "Copy outline" }),
      stBtn("Present", "expand", present, "primary"),
    );
    bar.append(acts);
    box.append(bar);

    if (st.grid) {
      const grid = el("div", "sd-grid");
      slides.forEach((s, i) => {
        const b = el("button", `sd-thumb ${i === st.i ? "active" : ""}`);
        b.type = "button";
        b.setAttribute("aria-label", `Slide ${i + 1}: ${mdPlain(s.title)}`);
        b.append(slideEl(s, i, n, true));
        b.onclick = () => { st.i = i; st.grid = false; dir = 0; paint(); };
        grid.append(b);
      });
      box.append(grid);
      S.studio.onKey = null;
      return;
    }

    const stage = el("div", `sd-stage ${dir > 0 ? "in-next" : dir < 0 ? "in-prev" : ""}`);
    stage.append(slideEl(slides[st.i], st.i, n));
    const zl = el("button", "sd-zone sd-zone-l"), zr = el("button", "sd-zone sd-zone-r");
    zl.type = zr.type = "button";
    zl.setAttribute("aria-label", "Previous slide"); zr.setAttribute("aria-label", "Next slide");
    zl.append(icSpan("sd-zone-ic", "chevL")); zr.append(icSpan("sd-zone-ic", "chevR"));
    zl.onclick = () => { if (!justSwiped(stage)) go(st.i - 1); };
    zr.onclick = () => { if (!justSwiped(stage)) go(st.i + 1); };
    zl.hidden = st.i === 0; zr.hidden = st.i === n - 1;
    stage.append(zl, zr);
    onSwipe(stage, () => go(st.i + 1), () => go(st.i - 1));
    box.append(stage);

    const nav = el("div", "sd-nav");
    const prev = stBtn("", "chevL", () => go(st.i - 1), "round", "Previous slide (←)");
    const next = stBtn("", "chevR", () => go(st.i + 1), "round", "Next slide (→)");
    prev.disabled = st.i === 0; next.disabled = st.i === n - 1;
    const dots = el("div", "sd-dots");
    slides.forEach((_, i) => {
      const d = el("button", `sd-dot ${i === st.i ? "on" : ""}`);
      d.type = "button";
      d.setAttribute("aria-label", `Slide ${i + 1}`);
      d.onclick = () => go(i);
      dots.append(d);
    });
    nav.append(prev, dots, el("span", "sd-count", `${st.i + 1} / ${n}`), next);
    box.append(nav);

    const strip = el("div", "sd-strip");
    slides.forEach((s, i) => {
      const b = el("button", `sd-thumb ${i === st.i ? "active" : ""}`);
      b.type = "button";
      b.setAttribute("aria-label", `Slide ${i + 1}: ${mdPlain(s.title)}`);
      b.append(slideEl(s, i, n, true));
      b.onclick = () => go(i);
      strip.append(b);
    });
    box.append(strip);
    requestAnimationFrame(() => {
      const a = strip.querySelector(".active");
      if (a) strip.scrollTo({ left: a.offsetLeft - strip.clientWidth / 2 + a.clientWidth / 2, behavior: "smooth" });
    });
    box.append(el("div", "st-keys", "← → move · F present · Esc exit"));
  };

  S.studio.onKey = (e) => {
    if (st.grid && !overlay) return;
    if (e.key === "ArrowRight" || e.key === "PageDown" || (e.key === " " && overlay)) go(st.i + 1);
    else if (e.key === "ArrowLeft" || e.key === "PageUp") go(st.i - 1);
    else if (e.key === "Home") go(0);
    else if (e.key === "End") go(n - 1);
    else if (e.key === "f" || e.key === "F") (overlay ? closePresent() : present());
    else if (e.key === "Escape" && overlay) closePresent();
    else return;
    e.preventDefault();
  };
  paint();
  return box;
}

/* ── Audio Overview ─────────────────────────────────────────────────────────
   No server-side TTS and no audio file: MAGI has no audio generation surface
   of its own, so the two-host script a provider writes is read aloud entirely
   client-side with the browser's SpeechSynthesis API. Each host gets the best
   voice the device has -- neural / "Natural" voices first, then the network
   Google voices, then the rest -- and the two hosts are given contrasting
   voices where the device has them. Both are overridable and remembered. */
/* Voices arrive LATE on phones, and sometimes only after you speak.
 *
 *  The first version asked once, cached the answer and never asked again --
 *  and on a phone getVoices() is empty for the first second or two, so the
 *  empty list was cached for the life of the page: no voices, an empty voice
 *  picker, and no way back. Android fills the list a moment after load;
 *  iOS Safari often reports nothing at all until speech has run once inside a
 *  real user gesture.
 *
 *  So: an EMPTY list is never cached, `voiceschanged` is watched for the life
 *  of the page, the list is re-read a few times after load (voiceschanged is
 *  not reliable on mobile), and anything showing voices subscribes rather than
 *  asking once. */
let _voicesCache = [];
const _voiceSubs = new Set();

const voicesNow = () => {
  try {
    return (window.speechSynthesis && window.speechSynthesis.getVoices()) || [];
  } catch { return []; }
};

function refreshVoices() {
  const v = voicesNow();
  // Never overwrite a good list with an empty one: some browsers momentarily
  // report zero while the engine reloads.
  if (!v.length) return _voicesCache;
  const changed = v.length !== _voicesCache.length ||
    v.some((x, i) => !_voicesCache[i] || _voicesCache[i].voiceURI !== x.voiceURI);
  _voicesCache = v;
  if (changed) for (const fn of [..._voiceSubs]) { try { fn(v); } catch {} }
  return _voicesCache;
}

/** Call `fn` with the voice list now (if known) and whenever it changes. */
function onVoices(fn) {
  _voiceSubs.add(fn);
  if (_voicesCache.length) { try { fn(_voicesCache); } catch {} }
  return () => _voiceSubs.delete(fn);
}

/** Nudge the browser into populating its voice list. Safe to call often. */
function primeVoices() {
  if (!window.speechSynthesis) return;
  refreshVoices();
  // voiceschanged is unreliable on mobile, so the list is also re-read a few
  // times over the first few seconds.
  for (const ms of [200, 600, 1200, 2500, 5000]) setTimeout(refreshVoices, ms);
}

if (window.speechSynthesis) {
  try {
    window.speechSynthesis.addEventListener("voiceschanged", refreshVoices);
  } catch {
    window.speechSynthesis.onvoiceschanged = refreshVoices;
  }
  primeVoices();
  // iOS hands over its voices only after speech has run inside a gesture. One
  // silent utterance on the first tap costs nothing and unlocks both the list
  // and playback itself.
  const unlockSpeech = () => {
    window.removeEventListener("pointerdown", unlockSpeech, true);
    window.removeEventListener("keydown", unlockSpeech, true);
    try {
      const u = new SpeechSynthesisUtterance(" ");
      u.volume = 0;
      window.speechSynthesis.speak(u);
    } catch {}
    primeVoices();
  };
  window.addEventListener("pointerdown", unlockSpeech, true);
  window.addEventListener("keydown", unlockSpeech, true);
}

const FEMALE_V = /female|aria|jenny|ava\b|emma|sonia|libby|michelle|samantha|zira|karen|moira|tessa|serena|susan|hazel|natasha|clara|joanna|salli|kimberly|allison|susan|victoria|fiona|google us english|heera|neerja/i;
const MALE_V = /\bmale|guy|andrew|brian|christopher|eric|ryan|daniel|david|\bmark\b|thomas|george|james|william|alex\b|fred|roger|davis|tony|oliver|arthur|aaron|rishi|google uk english male/i;
const voiceGender = (v) => (/female/i.test(v.name) ? "f" : MALE_V.test(v.name) ? "m" : FEMALE_V.test(v.name) ? "f" : "");

/** Higher is better: how natural a voice is likely to sound. */
function voiceScore(v) {
  const n = v.name, lang = (v.lang || "").toLowerCase();
  let s = 0;
  if (/natural|neural/i.test(n)) s += 60;          // Edge / Windows 11 neural
  if (/online/i.test(n)) s += 10;
  if (/premium|enhanced|siri/i.test(n)) s += 45;   // Apple's better tiers
  if (/^google/i.test(n)) s += 35;                  // Chrome's network voices
  if (/samantha|daniel|karen|moira|serena|ava/i.test(n)) s += 12;
  if (/desktop|espeak|compact/i.test(n)) s -= 25;   // the robotic ones
  if (lang.startsWith("en")) s += 30;
  if (lang === (navigator.language || "en-US").toLowerCase()) s += 8;
  if (lang === "en-us" || lang === "en-gb") s += 4;
  return s;
}

function pickHostVoices(voices, saved) {
  const byUri = (u) => voices.find((v) => v.voiceURI === u) || null;
  const ranked = [...voices].sort((a, b) => voiceScore(b) - voiceScore(a));
  let A = saved.a ? byUri(saved.a) : null;
  let B = saved.b ? byUri(saved.b) : null;
  if (!A) A = ranked.find((v) => voiceGender(v) === "f") || ranked[0] || null;
  if (!B) {
    const want = A && voiceGender(A) === "m" ? "f" : "m";
    B = ranked.find((v) => v !== A && voiceGender(v) === want && voiceScore(v) >= voiceScore(A || v) - 40)
      || ranked.find((v) => v !== A) || A;
  }
  return { A, B };
}

const AUDIO_PREFS_KEY = lsKey("studio.audio");
const audioPrefs = () => { try { return JSON.parse(localStorage.getItem(AUDIO_PREFS_KEY)) || {}; } catch { return {}; } };
const saveAudioPrefs = (p) => { try { localStorage.setItem(AUDIO_PREFS_KEY, JSON.stringify(p)); } catch {} };

/** Chrome silently stops an utterance after ~15 seconds with network voices,
 *  so a long line is spoken as sentence-sized pieces. */
function speechChunks(text) {
  const plain = mdPlain(text);
  const parts = plain.match(/[^.!?]+[.!?]+["')\]]*\s*|[^.!?]+$/g) || [plain];
  const out = [];
  let cur = "";
  for (const p of parts) {
    if ((cur + p).length > 200 && cur) { out.push(cur.trim()); cur = ""; }
    cur += p;
  }
  if (cur.trim()) out.push(cur.trim());
  return out;
}

const HOSTS = { A: "Host A", B: "Host B" };
const VOICE_NOTE = "This device has not offered its voice list yet — playback " +
  "uses the system voice. Press play once; on iPhone the list appears after " +
  "the first line is spoken.";
let _speech = null;

function renderAudio(lines) {
  const n = lines.length;
  const words = lines.map((l) => mdPlain(l.text).split(/\s+/).filter(Boolean).length);
  const totalWords = words.reduce((a, b) => a + b, 0);
  const prefs = audioPrefs();
  const st = { rate: prefs.rate || 1, cur: -1, playing: false, token: 0, voices: { A: null, B: null } };
  const fmt = (sec) => `${Math.floor(sec / 60)}:${String(Math.round(sec % 60)).padStart(2, "0")}`;
  const secsFor = (w) => w / (2.55 * st.rate);

  const box = el("div", "au");

  /* player */
  const player = el("div", "au-player");
  const hosts = el("div", "au-hosts");
  const hostEl = {};
  for (const h of ["A", "B"]) {
    const d = el("div", `au-host host-${h.toLowerCase()}`);
    const av = el("div", "au-avatar");
    av.append(el("span", null, h));
    const eq = el("div", "au-eq");
    for (let i = 0; i < 4; i++) eq.append(el("i"));
    const meta = el("div", "au-host-meta");
    const vname = el("div", "au-host-voice", "");
    meta.append(el("div", "au-host-name", HOSTS[h]), vname);
    d.append(av, meta, eq);
    hosts.append(d);
    hostEl[h] = { d, vname };
  }

  const main = el("div", "au-main");
  const back = stBtn("", "skipBack", () => jump(-1), "round au-skip", "Previous line");
  const play = el("button", "au-play");
  play.type = "button";
  const fwd = stBtn("", "skipFwd", () => jump(1), "round au-skip", "Next line");
  main.append(back, play, fwd);

  const prog = el("div", "au-prog");
  const segs = el("div", "au-segs");
  const segEls = lines.map((l, i) => {
    const s = el("button", `au-seg host-${l.speaker.toLowerCase()}`);
    s.type = "button";
    s.style.flexGrow = String(Math.max(1, words[i]));
    s.setAttribute("aria-label", `Play from line ${i + 1}`);
    s.onclick = () => start(i);
    segs.append(s);
    return s;
  });
  const times = el("div", "au-times");
  const tNow = el("span", null, "0:00"), tAll = el("span");
  times.append(tNow, tAll);
  prog.append(segs, times);

  const opts = el("div", "au-opts");
  const speeds = el("div", "au-speeds");
  const speedBtns = [0.75, 1, 1.25, 1.5, 2].map((r) => {
    const b = el("button", "au-speed", `${r}×`);
    b.type = "button";
    b.onclick = () => {
      st.rate = r; prefs.rate = r; saveAudioPrefs(prefs); paintSpeed();
      if (st.playing) start(st.cur);   // re-speak the current line at the new rate
    };
    speeds.append(b);
    return [r, b];
  });
  const paintSpeed = () => {
    speedBtns.forEach(([r, b]) => b.classList.toggle("on", r === st.rate));
    tAll.textContent = fmt(secsFor(totalWords));
    paintTime();
  };
  const voiceBtn = stBtn("Voices", "audioOn", () => { vPanel.hidden = !vPanel.hidden; }, "", "Choose a voice for each host");
  const copyT = copyButton(() => ({ md: lines.map((l) => `**${HOSTS[l.speaker] || l.speaker}:** ${l.text}`).join("\n\n") }),
                           { label: "Transcript" });
  opts.append(speeds, el("span", "st-grow"), voiceBtn, copyT);

  const vPanel = el("div", "au-vpanel");
  vPanel.hidden = true;
  const selects = {};
  for (const h of ["A", "B"]) {
    const lab = el("label", "au-vrow");
    lab.append(el("span", `au-vtag host-${h.toLowerCase()}`, HOSTS[h]));
    const sel = el("select", "au-vsel");
    sel.onchange = () => {
      const v = _voicesCache.find((x) => x.voiceURI === sel.value) || null;
      if (sel.value) {
        st.voices[h] = v;
        prefs[h.toLowerCase()] = sel.value;
      } else {
        // "Best available": forget the pinned choice and re-pick.
        delete prefs[h.toLowerCase()];
        applyVoices(_voicesCache);
      }
      saveAudioPrefs(prefs);
      paintVoices();
      preview(h);
    };
    lab.append(sel);
    vPanel.append(lab);
    selects[h] = sel;
  }
  const vReset = stBtn("Best available", "regen", () => {
    delete prefs.a; delete prefs.b; saveAudioPrefs(prefs);
    applyVoices(_voicesCache);
  }, "", "Reset to the best voices this device has");
  const vNote = el("div", "au-vnote",
    "Voices come from this device and browser. Edge's “Natural” voices and Chrome's Google voices sound the most human.");
  vPanel.append(vReset, vNote);

  player.append(hosts, main, prog, opts, vPanel);

  /* transcript */
  const tr = el("div", "au-transcript");
  const lineEls = lines.map((l, i) => {
    const row = el("button", `au-line host-${l.speaker.toLowerCase()}`);
    row.type = "button";
    const who = el("div", "au-line-hd");
    let at = 0;
    for (let k = 0; k < i; k++) at += words[k];
    who.append(el("span", "au-line-dot"), el("span", "au-line-name", HOSTS[l.speaker] || l.speaker),
               el("span", "au-line-time", fmt(secsFor(at))));
    row.append(who, mdSpan(l.text, "au-line-txt", "div"));
    row.title = "Play from here";
    row.onclick = () => start(i);
    tr.append(row);
    return row;
  });

  const note = el("div", "au-note");
  box.append(player, note, tr);

  /* playback */
  const synth = window.speechSynthesis;
  const paintTime = () => {
    let w = 0;
    for (let k = 0; k < Math.max(0, st.cur); k++) w += words[k];
    tNow.textContent = fmt(secsFor(w));
  };
  const paint = () => {
    play.textContent = "";
    play.append(icSpan("au-play-ic", st.playing ? "pause" : "play"));
    play.setAttribute("aria-label", st.playing ? "Pause" : "Play");
    play.classList.toggle("on", st.playing);
    box.classList.toggle("playing", st.playing);
    segEls.forEach((s, i) => {
      s.classList.toggle("done", i < st.cur);
      s.classList.toggle("cur", i === st.cur);
    });
    lineEls.forEach((r, i) => {
      r.classList.toggle("speaking", i === st.cur && st.playing);
      r.classList.toggle("current", i === st.cur);
      r.classList.toggle("past", st.cur >= 0 && i < st.cur);
    });
    const who = st.cur >= 0 ? lines[st.cur].speaker : null;
    for (const h of ["A", "B"]) hostEl[h].d.classList.toggle("talking", st.playing && who === h);
    back.disabled = st.cur <= 0;
    fwd.disabled = st.cur >= n - 1;
    paintTime();
  };
  const paintVoices = () => {
    for (const h of ["A", "B"]) {
      const v = st.voices[h];
      hostEl[h].vname.textContent = v
        ? v.name.replace(/^Microsoft\s+|\s+Online.*$|\s*\(Natural\)|\s+-\s+.*$/g, "")
        : (_voicesCache.length ? "Best available" : "System default");
      selects[h].value = v ? v.voiceURI : "";
    }
  };
  const applyVoices = (voices) => {
    const english = (voices || []).filter((v) => /^en/i.test(v.lang));
    const pool = english.length ? english : (voices || []);
    const { A, B } = pool.length ? pickHostVoices(pool, prefs) : { A: null, B: null };
    st.voices.A = A; st.voices.B = B;
    for (const h of ["A", "B"]) {
      const sel = selects[h];
      sel.textContent = "";
      // Always one real choice, even before the device has handed over its
      // list: an empty <select> cannot be opened, which is what "no voice
      // options" looked like on a phone.
      const auto = el("option", null, pool.length ? "Best available" : "System default voice");
      auto.value = "";
      sel.append(auto);
      [...pool].sort((a, b) => voiceScore(b) - voiceScore(a)).forEach((v) => {
        const o = el("option", null, `${v.name} · ${v.lang}`);
        o.value = v.voiceURI;
        sel.append(o);
      });
      sel.disabled = false;
    }
    paintVoices();
    note.textContent = pool.length ? "" : VOICE_NOTE;
  };

  const utter = (text, h) => {
    const u = new SpeechSynthesisUtterance(text);
    const v = st.voices[h];
    if (v) { u.voice = v; u.lang = v.lang; }
    u.rate = st.rate;
    // Only one voice on the device: pitch is the only way left to tell two
    // people apart.
    if (h === "B" && st.voices.A && st.voices.B === st.voices.A) u.pitch = 0.8;
    return u;
  };

  const stop = () => {
    st.token += 1;
    st.playing = false;
    if (synth) synth.cancel();
    if (_speech === ctl) _speech = null;
    paint();
  };
  const start = (from) => {
    if (!synth) return;
    if (_speech && _speech !== ctl) _speech.stop();
    _speech = ctl;
    synth.cancel();
    const token = ++st.token;
    st.playing = true;
    st.cur = Math.max(0, Math.min(n - 1, from));
    const speakLine = () => {
      // A card closed, regenerated or navigated away from must fall silent.
      if (token !== st.token) return;
      if (!box.isConnected || $("studioView").hidden) { stop(); return; }
      if (st.cur >= n) { st.cur = -1; stop(); return; }
      paint();
      lineEls[st.cur].scrollIntoView({ block: "nearest", behavior: "smooth" });
      const chunks = speechChunks(lines[st.cur].text);
      let c = 0;
      const speakChunk = () => {
        if (token !== st.token) return;
        if (c >= chunks.length) { st.cur += 1; speakLine(); return; }
        const u = utter(chunks[c], lines[st.cur].speaker);
        u.onend = () => { c += 1; speakChunk(); };
        u.onerror = (e) => {
          if (token !== st.token || e.error === "interrupted" || e.error === "canceled") return;
          c += 1; speakChunk();
        };
        synth.speak(u);
      };
      speakChunk();
    };
    speakLine();
  };
  const jump = (d) => {
    const t = Math.max(0, Math.min(n - 1, (st.cur < 0 ? 0 : st.cur) + d));
    if (st.playing) start(t); else { st.cur = t; paint(); lineEls[t].scrollIntoView({ block: "nearest", behavior: "smooth" }); }
  };
  const toggle = () => (st.playing ? stop() : start(st.cur < 0 ? 0 : st.cur));
  const preview = (h) => {
    if (!synth || st.playing) return;
    synth.cancel();
    const first = lines.find((l) => l.speaker === h);
    synth.speak(utter(speechChunks(first ? first.text : "Hello.")[0], h));
  };
  const ctl = { stop };
  play.onclick = toggle;

  S.studio.cleanup = stop;
  S.studio.onKey = (e) => {
    if (e.key === " " || e.key === "k" || e.key === "K") toggle();
    else if (e.key === "ArrowRight") jump(1);
    else if (e.key === "ArrowLeft") jump(-1);
    else return;
    e.preventDefault();
  };

  if (!synth) {
    note.textContent = "This browser has no speech engine, so the overview can be read but not played.";
    play.disabled = true;
  } else {
    // Subscribed, not asked once: on a phone the list usually arrives AFTER
    // this card is on screen, and the picker has to fill in when it does.
    const stopWatching = onVoices(applyVoices);
    applyVoices(_voicesCache);
    primeVoices();
    const priorCleanup = S.studio.cleanup;
    S.studio.cleanup = () => { stopWatching(); if (priorCleanup) priorCleanup(); };
  }
  paintSpeed();
  paint();
  return box;
}

$("studioClose").onclick = closeStudio;
$("studioRegen").onclick = () => S.studio.active && generateStudio(S.studio.active);
$("studioCancel").onclick = () => S.studio.active && cancelStudio(S.studio.active);

/* ══ BRAINSTORM ════════════════════════════════════════════════════════════
   Many rounds of council questions until a plan is worth building from, then
   the chairman writes it out as a markdown brief.

   A round is three phases, not one: every member answers the same prompt
   independently (propose), each then reads the others VERBATIM and attacks
   them (critique), and the chairman folds proposals plus critiques into one
   plan (merge). The critique phase is what makes this a debate rather than a
   poll — without it four models produce four opinions and a summariser, and a
   wrong claim from one member is never challenged by the three that could have
   caught it.

   Rounds stream the SAME per-member events a council run does, so they drive
   the same grid with no changes to it. Only the merge differs.

   State lives in S.bs so the sidebar, the round panel and the live grid all
   read one session — the same reason Studio lifts its artifacts out of its
   panel. */

S.bs = {
  sessionId: null, topic: "", status: "active", rounds: [], busy: false,
  attachments: [],
  phase: "idle",   // idle | council | merging | writing
  error: null, planFilename: null, planMd: null, savedTo: null,
  sessions: [], reply: "", answers: {},   // answers keyed by question index
  es: null, jobId: null,
  draft: "", refining: false, preRefine: null, refineError: null,
};

/** Rounds recorded before questions became structured hold plain strings, and
 *  they still have to render. Normalising on read means every consumer sees one
 *  shape and the old form needs no second code path. */
function normaliseQuestion(q) {
  if (typeof q === "string") return { q, header: "", kind: "open", blocking: false, options: [] };
  const options = (Array.isArray(q && q.options) ? q.options : [])
    .map((o) => (typeof o === "string" ? { label: o, description: "" }
                                       : { label: (o && o.label) || "", description: (o && o.description) || "" }))
    .filter((o) => o.label);
  // Trust the option count over the declared kind: a choice with nothing to
  // pick between is a text box, whatever the backend called it.
  const choice = options.length >= 2;
  return {
    q: (q && q.q) || "", header: (q && q.header) || "",
    kind: choice ? "choice" : "open",
    blocking: !!(q && q.blocking),
    options: choice ? options : [],
  };
}

/** Rebuilds the round list from the flat turn log. The backend stores turns,
 *  not rounds, because a round is not a row — it is a user reply plus N council
 *  answers plus one merge, and which of those exist depends on how far the
 *  round got. */
function roundsFromTurns(turns) {
  const key = (t) => `${t.round_no}:${t.attempt ?? 1}`;
  const byKey = new Map();
  const replies = new Map();
  const blank = (t) => ({
    round_no: t.round_no, attempt: t.attempt ?? 1, superseded: false,
    phase: t.phase === "finalize" ? "finalize" : "round",
    plan_so_far: "", questions: [], agreement: "", corrections_text: "",
    dropped_questions: [], council_split: "", ready: false, ready_note: "",
    parsed: false, raw_text: "", council: [],
  });

  for (const t of turns) {
    const k = key(t);
    // A council-only attempt (one that failed before the merge) still needs a
    // row, or the members' answers would have nowhere to live.
    if (!byKey.has(k)) byKey.set(k, blank(t));
    const round = byKey.get(k);
    if (t.phase === "finalize") round.phase = "finalize";

    if (t.role === "user" && (t.content || "").trim()) {
      replies.set(t.round_no, t.content.trim());
    } else if (t.role === "council") {
      round.council.push({
        provider_id: t.provider_id || "member", content: t.content || "",
        ok: t.ok === 1 || t.ok === undefined || t.ok === null,
        degraded: t.degraded === 1, degraded_reason: t.degraded_reason,
        failure_kind: t.failure_kind, error_detail: t.error_detail,
        latency_ms: t.latency_ms, chars: t.char_count,
      });
    } else if (t.role === "chairman" && t.parsed_json) {
      const p = t.parsed_json;
      // The finalise turn holds the finished plan, not a round merge; the plan
      // has its own view and must not masquerade as a round.
      if (p.kind === "plan") continue;
      round.plan_so_far = p.plan_so_far || "";
      round.questions = (p.questions || []).map(normaliseQuestion);
      round.agreement = p.agreement || p.council_split || "";
      round.corrections_text = p.corrections_text || "";
      round.dropped_questions = p.dropped_questions || [];
      round.council_split = p.council_split || "";
      round.ready = !!p.ready;
      round.ready_note = p.ready_note || "";
      round.parsed = !!p.parsed;
      round.raw_text = t.content || "";
      round.chairman = t.provider_id || undefined;
    }
  }

  const rounds = [...byKey.values()].sort(
    (a, b) => a.round_no - b.round_no || a.attempt - b.attempt);

  // Mark every attempt a later one replaced. Kept and shown rather than
  // hidden: a round that failed still happened, and what the members said
  // before it failed is part of the record.
  const best = new Map();
  for (const r of rounds) best.set(r.round_no, Math.max(best.get(r.round_no) ?? 0, r.attempt));
  for (const r of rounds) r.superseded = r.attempt < (best.get(r.round_no) ?? 1);

  // The reply to round N's questions is stored on round N+1, which is where
  // the user typed it. Attaching it back to the round it answers is what makes
  // the history read as a conversation.
  for (const [roundNo, reply] of replies) {
    const answered = [...byKey.values()]
      .filter((r) => r.round_no === roundNo - 1)
      .sort((a, b) => b.attempt - a.attempt)[0];
    if (answered) answered.reply = reply;
  }
  return rounds;
}

/** Suggested filename for the save dialog, mirroring the backend's
 *  `plan_filename`. Recomputed on the client when an old session is reopened,
 *  since the filename is only ever a suggestion and never a stored location. */
function planFilenameFor(topic) {
  const slug = (topic || "").toLowerCase()
    .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "")
    .slice(0, 48).replace(/-[^-]*$/, "") || "plan";
  const d = new Date();
  const date = [d.getFullYear(), String(d.getMonth() + 1).padStart(2, "0"),
                String(d.getDate()).padStart(2, "0")].join("-");
  return `${date}-${slug}.md`;
}

/** The round on screen is the newest one that actually produced a merge — a
 *  superseded attempt, or a fan-out that failed before the chairman, has no
 *  questions to answer. */
function latestRound() {
  const rs = S.bs.rounds;
  return [...rs].reverse().find((r) => r.parsed || r.questions.length > 0)
      || (rs.length ? rs[rs.length - 1] : null);
}

const bsBusy = () => S.running || S.bs.busy;

/* ── actions ───────────────────────────────────────────────────────────── */

async function loadBsSessions() {
  if (!online()) return;
  try {
    const r = await fetch(`${link.api}/api/brainstorm?limit=30`, authed());
    S.bs.sessions = await r.json();
  } catch { return; }
  renderBsNav();
  if (S.view === "brainstorm") renderBsView();
}

function closeBsStream() {
  if (S.bs.es) { S.bs.es.close(); S.bs.es = null; }
  S.bs.jobId = null;
}

/** Re-reads the turn log. The database is the complete record — every member
 *  answer and every attempt — so the view is rebuilt from it rather than
 *  assembled from the events, which carry only the merge. */
async function refreshTurns(id) {
  try {
    const r = await fetch(`${link.api}/api/brainstorm/${id}`, authed());
    const data = await r.json();
    S.bs.rounds = roundsFromTurns(data.turns);
    if (data.session && data.session.plan_md) S.bs.planMd = data.session.plan_md;
  } catch {}
}

/** Rehydrate a session from SQLite. Same principle as the council view's
 *  reload recovery: a session is many minutes of work and must survive a
 *  refresh. */
async function openBsSession(id) {
  closeBsStream();
  Object.assign(S.bs, { error: null, busy: false, phase: "idle", reply: "", answers: {} });
  try {
    const r = await fetch(`${link.api}/api/brainstorm/${id}`, authed());
    if (!r.ok) throw new Error("Session not found.");
    const data = await r.json();
    Object.assign(S.bs, {
      sessionId: id, topic: data.session.topic, status: data.session.status,
      planFilename: planFilenameFor(data.session.topic), savedTo: null,
      planMd: data.session.plan_md || null, rounds: roundsFromTurns(data.turns),
    });
  } catch (e) {
    S.bs.error = (e && e.message) || "Could not open that session.";
  }
  setView("brainstorm");
}

/** Subscribes to a round or finalise job. Both stream the same per-member
 *  events the council grid already renders, so they feed it unchanged. */
function listenBs(sid, jobId, kind) {
  const es = new EventSource(streamUrl(`/api/brainstorm/${sid}/job/${jobId}/stream`));
  S.bs.es = es;
  S.bs.jobId = jobId;

  es.onmessage = async (ev) => {
    const msg = JSON.parse(ev.data);
    onBrainstormEvent(msg);

    if (msg.type === "state") {
      // The chairman's own turn arrives as a waiting state carrying a message;
      // that is the transition out of the fan-out phase.
      if (msg.message) { S.bs.phase = kind === "finalize" ? "writing" : "merging"; renderBsView(); }
    } else if (msg.type === "done") {
      if (kind === "finalize") {
        S.bs.status = "complete";
        S.bs.planFilename = msg.plan_filename || null;
        S.bs.planMd = msg.plan_md || null;
      } else {
        S.bs.reply = "";
        // The new round's questions are different questions; keeping the old
        // selections would attach them to the wrong ones by index.
        S.bs.answers = {};
      }
      // Rebuild from the database rather than patching the round in from the
      // event. The event carries only the merge; the database has the members'
      // full answers and every earlier attempt.
      await refreshTurns(sid);
      Object.assign(S.bs, { busy: false, phase: "idle" });
      closeBsStream();
      loadBsSessions();
      renderBsNav(); renderBsView(); updateEnabled();
    } else if (msg.type === "error") {
      S.bs.error = msg.message || "The round failed.";
      // A failed round still produced member answers, and they are kept:
      // the failure is then inspectable rather than a dead end with nothing
      // to show for the minutes it cost.
      await refreshTurns(sid);
      Object.assign(S.bs, { busy: false, phase: "idle" });
      // Finalise failure puts the session back to active server-side, so the
      // local view has to agree or the retry button stays hidden.
      if (kind === "finalize") S.bs.status = "active";
      closeBsStream();
      renderBsNav(); renderBsView(); updateEnabled();
    }
  };
  es.onerror = () => {
    Object.assign(S.bs, { busy: false, phase: "idle" });
    closeBsStream();
    renderBsNav(); renderBsView(); updateEnabled();
  };
}

/** Brainstorm rounds stream the same per-member events a council run does, so
 *  feeding them through one handler is what lets the existing console render a
 *  round with no changes to it. */
function onBrainstormEvent(msg) {
  if (msg.type === "state") {
    const p = byId(msg.provider_id);
    if (!p) return;
    p.state = msg.state;
    p.text = msg.text || p.text;
    p.chars = msg.chars || p.chars;
    updateNode(p); updateCore(); drawLinks();
  } else if (msg.type === "done" || msg.type === "error") {
    // Round over: settle every unit still shown as working, so the grid does
    // not keep animating after the round has landed.
    for (const p of S.panels) {
      if (WORKING.has(p.state)) { p.state = "done"; p.ok = true; updateNode(p); }
    }
    updateCore(); drawLinks();
  }
}

/** Only the questions the user actually touched go on the wire. */
function answersPayload() {
  return JSON.stringify(
    Object.entries(S.bs.answers)
      .map(([i, a]) => ({ index: Number(i), value: a.value ?? null, other: a.other ?? null }))
      .filter((a) => a.value || a.other));
}

/** Puts the console into the state a run would leave it in, so the grid shows
 *  the members working through the round. */
function primeGridForRound() {
  S.verdict = null;
  S.gridOwner = "brainstorm";
  S.settled = new Set();
  S.opened = new Set();
  S.panels = S.providers.filter((p) => S.selected.has(p.id)).map((p) => ({
    id: p.id, display_name: p.display_name, accent: p.accent,
    state: "queued", text: "", chars: 0,
  }));
  renderGrid();
  renderVerdict();
}

async function startBrainstorm(rawTopic) {
  const t = (rawTopic || "").trim();
  if (!t || bsBusy() || S.selected.size === 0 || !online()) return;
  Object.assign(S.bs, {
    error: null, busy: true, phase: "council", rounds: [],
    planFilename: null, savedTo: null, planMd: null, status: "active",
    topic: t, reply: "", answers: {},
  });
  setView("brainstorm");
  primeGridForRound();
  renderBsView(); renderBsNav(); updateEnabled();

  try {
    const form = new FormData();
    form.append("topic", t);
    form.append("providers", [...S.selected].join(","));
    for (const a of S.bs.attachments || []) form.append("files", a.file, a.file.name);
    const res = await fetch(`${link.api}/api/brainstorm`, authed({ method: "POST", body: form }));
    if (!res.ok) throw new Error(((await res.json()) || {}).detail || "Could not start.");
    const { session_id } = await res.json();
    S.bs.sessionId = session_id;

    const rr = await fetch(`${link.api}/api/brainstorm/${session_id}/round`,
                           authed({ method: "POST", body: new FormData() }));
    if (!rr.ok) throw new Error(((await rr.json()) || {}).detail || "Round failed to start.");
    const { job_id } = await rr.json();
    listenBs(session_id, job_id, "round");
    loadBsSessions();
  } catch (e) {
    Object.assign(S.bs, { error: (e && e.message) || "Could not start the session.", busy: false, phase: "idle" });
    renderBsView(); updateEnabled();
  }
}

async function bsNextRound() {
  if (!S.bs.sessionId || bsBusy() || !online()) return;
  Object.assign(S.bs, { error: null, busy: true, phase: "council" });
  primeGridForRound();
  renderBsView(); renderBsNav(); updateEnabled();
  try {
    const form = new FormData();
    form.append("reply", S.bs.reply);
    form.append("answers", answersPayload());
    const res = await fetch(`${link.api}/api/brainstorm/${S.bs.sessionId}/round`,
                            authed({ method: "POST", body: form }));
    if (!res.ok) throw new Error(((await res.json()) || {}).detail || "Round failed to start.");
    const { job_id } = await res.json();
    listenBs(S.bs.sessionId, job_id, "round");
  } catch (e) {
    Object.assign(S.bs, { error: (e && e.message) || "Could not run the next round.", busy: false, phase: "idle" });
    renderBsView(); updateEnabled();
  }
}

async function bsFinalize() {
  if (!S.bs.sessionId || bsBusy() || !online()) return;
  Object.assign(S.bs, { error: null, busy: true, phase: "council", status: "finalizing" });
  primeGridForRound();
  renderBsView(); renderBsNav(); updateEnabled();
  try {
    const form = new FormData();
    form.append("reply", S.bs.reply);
    form.append("answers", answersPayload());
    const res = await fetch(`${link.api}/api/brainstorm/${S.bs.sessionId}/finalize`,
                            authed({ method: "POST", body: form }));
    if (!res.ok) throw new Error(((await res.json()) || {}).detail || "Could not finalise.");
    const { job_id } = await res.json();
    listenBs(S.bs.sessionId, job_id, "finalize");
  } catch (e) {
    Object.assign(S.bs, {
      error: (e && e.message) || "Could not finalise the plan.",
      busy: false, phase: "idle", status: "active",
    });
    renderBsView(); updateEnabled();
  }
}

async function bsCancel() {
  if (!S.bs.sessionId || !S.bs.jobId || !online()) return;
  await fetch(`${link.api}/api/brainstorm/${S.bs.sessionId}/job/${S.bs.jobId}/cancel`,
              authed({ method: "POST" })).catch(() => {});
}

/** Clears back to the "start a new session" screen. */
function bsReset() {
  if (bsBusy()) return;
  closeBsStream();
  // A new session shows nothing yet. Whatever is in the grid came from
  // somewhere else -- a past deliberation, or the round just abandoned.
  if (S.gridOwner === "brainstorm") { S.panels = []; S.verdict = null; }
  S.gridOwner = null;
  Object.assign(S.bs, {
    sessionId: null, topic: "", rounds: [], status: "active",
    planFilename: null, savedTo: null, planMd: null, error: null,
    reply: "", answers: {}, phase: "idle", draft: "", preRefine: null, refineError: null,
    // A different session is about different material.
    attachments: [],
  });
  // setView, not the two renderers directly. They redraw the panel but not
  // the things AROUND it: the units row stays hidden because its `hidden` is
  // set by setView from bs.sessionId, and the idle class stays off, so the
  // composer loses its centred offset and the whole screen jumps to the top.
  setView("brainstorm");
}

/** Hands the plan to the user as a file, wherever they choose to put it.
 *
 *  Nothing has been written to disk at this point — the plan lives in the
 *  database and in memory. Chrome's File System Access API gives a real Save As
 *  dialog; anything else falls back to an ordinary download, which lands in the
 *  browser's download folder. */
async function bsSavePlan() {
  if (!S.bs.planMd) return;
  const suggested = S.bs.planFilename || "plan.md";
  if (typeof window.showSaveFilePicker === "function") {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: suggested,
        types: [{ description: "Markdown", accept: { "text/markdown": [".md"] } }],
      });
      const w = await handle.createWritable();
      await w.write(S.bs.planMd);
      await w.close();
      S.bs.savedTo = handle.name || suggested;
      renderBsView();
      return;
    } catch (e) {
      // Dismissing the dialog is not an error worth reporting. Anything else
      // (a permission refusal, a read-only location) falls through to the
      // download path rather than leaving them with nothing.
      if (e && e.name === "AbortError") return;
    }
  }
  const url = URL.createObjectURL(new Blob([S.bs.planMd], { type: "text/markdown;charset=utf-8" }));
  const a = document.createElement("a");
  a.href = url; a.download = suggested;
  document.body.append(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  S.bs.savedTo = suggested;
  renderBsView();
}

/* ── views ─────────────────────────────────────────────────────────────── */

function renderBsNav() {
  const sec = $("bsSec");
  for (const el2 of sec.querySelectorAll(".bs-row")) el2.remove();
  const bs = S.bs;

  const main = el("button", `side-item bs-row ${S.view === "brainstorm" ? "active" : ""}`);
  main.type = "button";
  main.style.setProperty("--sa", "var(--gold)");
  main.disabled = !online();
  main.title = S.navCollapsed ? "Brainstorm" : "Open the planning session";
  main.setAttribute("aria-current", String(S.view === "brainstorm"));
  main.append(icSpan("side-ic studio-ic", "brainstorm"),
              el("span", "side-label", bs.sessionId ? "Current session" : "New session"));
  const tag = el("span", "side-tag");
  if (bs.busy) tag.append(spinnerEl());
  else tag.textContent = bs.status === "complete" ? "✓" : bs.rounds.length ? `R${bs.rounds.length}` : "";
  main.append(tag);
  main.onclick = () => setView("brainstorm");
  sec.append(main);

  if (bs.sessionId && !S.navCollapsed) {
    const nu = el("button", "side-item bs-row");
    nu.type = "button";
    nu.style.setProperty("--sa", "var(--acl)");
    nu.disabled = bsBusy();
    nu.title = "Start a different planning session";
    nu.append(icSpan("side-ic studio-ic", "new"),
              el("span", "side-label", "New session"), el("span", "side-tag"));
    nu.onclick = bsReset;
    sec.append(nu);
  }
}

function phaseNote(phase) {
  if (phase === "idle") return null;
  const text = phase === "council"
    ? "Each unit is thinking about the plan independently…"
    : phase === "merging"
      ? "Merging the round into one plan and one set of questions…"
      : "Writing the plan file…";
  const n = el("div", "bs-phase");
  n.append(spinnerEl(), document.createTextNode(" " + text));
  return n;
}

function bsCallout(kind, cause, remedy) {
  const c = el("div", "callout");
  c.append(el("div", "kind", kind), el("div", "cause", cause));
  if (remedy) c.append(el("div", "remedy", remedy));
  return c;
}

/** One question as a card: header chip, the question, then either selectable
 *  options or a text input. Modelled on Claude Code's AskUserQuestion, which is
 *  the interaction this is meant to feel like. */
function questionCard(index, question, disabled) {
  const answer = S.bs.answers[index];
  // An open question is "Other" by construction — there is nothing to pick, so
  // its input IS the answer.
  const isOpen = question.kind === "open";
  const otherActive = isOpen || (answer && answer.other !== undefined);
  const answered = !!(answer && (answer.value || answer.other));

  const card = el("div", `bs-card ${answered ? "answered" : ""}`);
  const hd = el("div", "bs-card-hd");
  hd.append(el("span", "bs-chip", question.header || `Q${index + 1}`));
  if (question.blocking) {
    const b = el("span", "bs-chip bs-chip-blocking", "shapes the plan");
    b.title = "The shape of the plan depends on this answer, not just its detail.";
    hd.append(b);
  }
  if (answered && !disabled) {
    const clr = el("button", "bs-skip", "clear");
    clr.type = "button";
    clr.title = "Clear this answer — the council will decide it instead";
    clr.onclick = () => setBsAnswer(index, null);
    hd.append(clr);
  }
  card.append(hd, el("div", "bs-card-q", question.q));

  if (!isOpen) {
    const opts = el("div", "bs-opts");
    opts.setAttribute("role", "radiogroup");
    opts.setAttribute("aria-label", question.q);
    for (const o of question.options) {
      const on = answer && answer.value === o.label && answer.other === undefined;
      const b = el("button", `bs-opt ${on ? "selected" : ""}`);
      b.type = "button";
      b.setAttribute("role", "radio");
      b.setAttribute("aria-checked", String(!!on));
      b.disabled = !!disabled;
      const mark = el("span", "bs-opt-mark", on ? "◉" : "○");
      mark.setAttribute("aria-hidden", "true");
      const txt = el("span", "bs-opt-text");
      txt.append(el("span", "bs-opt-label", o.label));
      if (o.description) txt.append(el("span", "bs-opt-desc", o.description));
      b.append(mark, txt);
      b.onclick = () => setBsAnswer(index, on ? null : { value: o.label });
      opts.append(b);
    }
    const other = el("button", `bs-opt ${otherActive ? "selected" : ""}`);
    other.type = "button";
    other.setAttribute("role", "radio");
    other.setAttribute("aria-checked", String(!!otherActive));
    other.disabled = !!disabled;
    const m2 = el("span", "bs-opt-mark", otherActive ? "◉" : "○");
    m2.setAttribute("aria-hidden", "true");
    const t2 = el("span", "bs-opt-text");
    t2.append(el("span", "bs-opt-label", "Other…"),
              el("span", "bs-opt-desc", "Answer in your own words"));
    other.append(m2, t2);
    other.onclick = () => setBsAnswer(index, otherActive ? null : { other: "" });
    opts.append(other);
    card.append(opts);
  }

  if (otherActive) {
    const inp = el("input", "bs-open-input");
    inp.type = "text";
    inp.placeholder = isOpen ? "Your answer — or leave blank to skip" : "Your answer…";
    inp.value = (answer && answer.other) || "";
    inp.disabled = !!disabled;
    inp.oninput = () => {
      const v = inp.value;
      // An emptied box on an open question is a skip, not an empty answer —
      // otherwise a stray keystroke would send blank prose.
      if (isOpen && !v) S.bs.answers[index] = undefined, delete S.bs.answers[index];
      else S.bs.answers[index] = { other: v };
      // Deliberately NOT a re-render: rebuilding the card here would destroy
      // the input and take the caret with it on every keystroke.
      card.classList.toggle("answered", !!v);
    };
    card.append(inp);
    if (!isOpen) setTimeout(() => inp.focus(), 0);
  }
  return card;
}

/** Answer changes rebuild the card list, so the radio marks and the clear
 *  affordance stay in step with the state. */
function setBsAnswer(index, entry) {
  if (entry === null) delete S.bs.answers[index];
  else S.bs.answers[index] = entry;
  renderBsView();
}

/** One member's full answer for a round. Collapsed by default — these run to
 *  thousands of characters each, and four of them per round would bury the
 *  questions. Collapsed is not the same as discarded. */
function councilAnswers(council) {
  if (!council || !council.length) return null;
  const d = el("details", "bs-council");
  d.append(el("summary", null, `What each unit said (${council.length})`));
  for (const a of council) {
    const row = el("div", "bs-council-answer");
    const hd = el("div", "bs-council-hd");
    hd.append(el("span", "bs-council-name", a.provider_id));
    if (a.degraded) {
      hd.append(el("span", "bs-council-bad", `excluded — ${a.degraded_reason || "unusable response"}`));
    } else if (!a.ok) {
      hd.append(el("span", "bs-council-bad",
        (a.failure_kind || "failed") + (a.error_detail ? ` — ${a.error_detail}` : "")));
    } else {
      hd.append(el("span", "bs-council-meta",
        (a.latency_ms ? `${(a.latency_ms / 1000).toFixed(1)}s` : "") +
        (a.chars ? ` · ${a.chars}c` : "")));
    }
    row.append(hd);
    if ((a.content || "").trim()) row.append(el("div", "bs-council-body", a.content));
    d.append(row);
  }
  return d;
}

function roundHistory(rounds) {
  if (!rounds.length) return null;
  const d = el("details", "bs-history");
  d.append(el("summary", null, `Earlier rounds (${rounds.length})`));
  for (const r of [...rounds].reverse()) {
    const box = el("div", `bs-hist-round ${r.superseded ? "superseded" : ""}`);
    const hd = el("div", "bs-hist-hd");
    hd.append(document.createTextNode(
      (r.phase === "finalize" ? "Finalise pass" : `Round ${r.round_no}`) +
      (r.attempt > 1 ? ` · attempt ${r.attempt}` : "")));
    if (r.superseded) hd.append(el("span", "bs-hist-note", " — retried, did not complete"));
    box.append(hd);

    if (r.questions.length) {
      const ol = el("ol", "bs-qlist small");
      r.questions.forEach((q) => ol.append(el("li", null, q.q)));
      box.append(ol);
    }
    if (r.reply) {
      const rep = el("div", "bs-hist-reply");
      rep.append(el("span", "bs-hist-label", "You answered"), document.createTextNode(r.reply));
      box.append(rep);
    }
    if (r.plan_so_far) {
      const pd = el("details", "bs-council");
      pd.append(el("summary", null, "Plan draft at this round"));
      const inner = el("div", "bs-council-answer");
      const draft = verdictBody(r.plan_so_far);
      inner.append(draft, copyButton(() => ({ node: draft, md: r.plan_so_far }),
                                     { label: "Copy draft", cls: "under" }));
      pd.append(inner);
      box.append(pd);
    }
    const ca = councilAnswers(r.council);
    if (ca) box.append(ca);
    d.append(box);
  }
  return d;
}

function bsDetails(summaryText, bodyText) {
  const d = el("details", "bs-split");
  d.append(el("summary", null, summaryText));
  d.append(verdictBody(bodyText));
  return d;
}

/** The whole Brainstorm surface: the start form, the live round, the finished
 *  plan, and the prior-round history. */
/** The way out of a session you opened from the list.
 *
 *  The sidebar has a "New session" row, but a panel you navigated INTO needs
 *  its exit where you are looking -- and "New session" in a list of rows reads
 *  as one more row rather than as back. Named for where it takes you.
 */
/** Grow a brainstorm textarea to fit its content, capped by CSS.
 *
 *  The same two lines the council's composer uses: reset to auto so the
 *  scrollHeight is measured against no height at all, then adopt it. Taking
 *  the element rather than an id because renderBsView rebuilds the panel, so
 *  the box this runs on is younger than any id lookup done before the render.
 */
function bsAutosize(ta) {
  if (!ta || ta.dataset.userH) return;   // sized by hand -- see attachGrip
  ta.style.height = "auto";
  ta.style.height = `${ta.scrollHeight}px`;
}

/* ── past sessions: pin, rename, delete ───────────────────────────────────
   The same three things History offers, because a planning session is the
   same KIND of object: something you made, will come back to, and will
   eventually want gone. It would be strange for one list to offer them and
   the list directly below it not to.

   Pins and names are kept per browser AND in the cloud index, exactly as the
   deliberation ones are -- two more small fields on a document that is
   already written on a debounce, for the same reason: they have to survive
   sync being unavailable and still follow you to another device. */
const BS_PIN_KEY = lsKey("bspins");
const BS_NICK_KEY = lsKey("bsnicks");
const BS_UNPIN_KEY = lsKey("bsunpinned");

const BS_PINS = new Set((() => {
  try { return JSON.parse(localStorage.getItem(BS_PIN_KEY) || "[]"); } catch { return []; }
})());
const BS_NICKS = (() => {
  try { return JSON.parse(localStorage.getItem(BS_NICK_KEY) || "{}") || {}; } catch { return {}; }
})();
// See UNPINNED_AT: unpinning restarts the window rather than exposing however
// long the thing had already been sitting there.
const BS_UNPINNED_AT = (() => {
  try { return JSON.parse(localStorage.getItem(BS_UNPIN_KEY) || "{}") || {}; } catch { return {}; }
})();

function saveBsMarks() {
  try {
    localStorage.setItem(BS_PIN_KEY, JSON.stringify([...BS_PINS]));
    localStorage.setItem(BS_NICK_KEY, JSON.stringify(BS_NICKS));
    localStorage.setItem(BS_UNPIN_KEY, JSON.stringify(BS_UNPINNED_AT));
  } catch {}
  cloudSaveBsMarks();
}

let _bsMarkT = 0;
let _bsMarksDirty = false;   // see _marksDirty; a session mark is no different
function cloudSaveBsMarks() {
  if (!CLOUD.enabled) return;
  _bsMarksDirty = true;
  clearTimeout(_bsMarkT);
  setSync("saving");
  // 400, not 900. The old delay left a nine-tenths-of-a-second window in
  // which any snapshot reverted the pin you had just set, and there is
  // nothing to batch here -- a pin is one deliberate press.
  _bsMarkT = setTimeout(async () => {
    if (!(await cloudInit())) { setSync("off"); return; }
    try {
      // mergeFields for the same reason as the deliberation marks: so that
      // removing a name removes it there too.
      await CLOUD.fs.setDoc(_indexDoc(), {
        bsPins: [...BS_PINS], bsNicks: BS_NICKS, bsUnpinnedAt: BS_UNPINNED_AT,
      }, { mergeFields: ["bsPins", "bsNicks", "bsUnpinnedAt"] });
      _bsMarksDirty = false;
      setSync("saved");
    } catch (e) {
      setSync("error", _syncFail("saving your session pins and names", e));
    }
  }, 400);
}

const bsPinned = (x) => BS_PINS.has(x.id);
const bsNickOf = (x) => (BS_NICKS[x.id] || "").trim();
const bsTitleOf = (x) => bsNickOf(x) || x.topic;
/* Same window as a deliberation, and the pin means the same thing. Sessions
   live only on the engine, so "expired" hides rather than deletes -- the
   engine keeps its own copy either way, and deleting someone's planning work
   on a timer is not something a list should do quietly. */
const bsExpired = (x) => {
  if (bsPinned(x)) return false;
  const stamped = BS_UNPINNED_AT[x.id];
  const from = stamped && Number.isFinite(new Date(stamped).getTime())
    ? new Date(stamped).getTime()
    : new Date(x.created_at).getTime();
  const age = (Date.now() - from) / 86400000;
  return Number.isFinite(age) && age > HISTORY_DAYS;
};

function bsTogglePin(id) {
  const on = !BS_PINS.has(id);
  if (on) { BS_PINS.add(id); delete BS_UNPINNED_AT[id]; }
  else { BS_PINS.delete(id); BS_UNPINNED_AT[id] = new Date().toISOString(); }
  saveBsMarks();
  renderBsView();
}

function openBsNickSheet(x) {
  const sheet = el("div", "sheet");
  const box = el("div", "sheet-box");
  box.append(el("div", "sheet-hd", bsNickOf(x) ? "Rename" : "Give it a name"));
  box.append(el("div", "sheet-sub",
    "Shown in Past sessions instead of the topic. The topic itself is " +
    "unchanged \u2014 it is what the council was asked to plan."));
  box.append(el("div", "sheet-lbl", "Name"));
  const input = el("input", "sheet-in");
  input.type = "text";
  input.value = bsNickOf(x);
  input.placeholder = String(x.topic || "").slice(0, 60);
  input.maxLength = 120;
  box.append(input);
  box.append(el("div", "sheet-note", "Follows you to your other devices."));

  const bar = el("div", "sheet-bar");
  const save = el("button", "btn active", "Save");
  const clear = el("button", "btn", "Remove name");
  const close = el("button", "btn", "Cancel");
  bar.append(save);
  if (bsNickOf(x)) bar.append(clear);
  bar.append(el("span", "qbar-spacer"), close);
  box.append(bar);

  const done = () => sheet.remove();
  const set = (v) => {
    const clean = (v || "").trim().slice(0, 120);
    if (clean) BS_NICKS[x.id] = clean; else delete BS_NICKS[x.id];
    saveBsMarks();
    done();
    renderBsView();
  };
  close.onclick = done;
  dismissOnBackdrop(sheet, done);
  save.onclick = () => set(input.value);
  clear.onclick = () => set("");
  input.onkeydown = (e) => { if (e.key === "Enter") save.click(); };
  sheet.append(box);
  document.body.append(sheet);
  input.focus();
  input.select();
}

async function deleteBsSession(x) {
  const name = String(bsTitleOf(x) || "");
  const shown = name.length > 90 ? name.slice(0, 90) + "\u2026" : name;
  const ok = await uiConfirmMagi(
    "Delete this session?",
    "\u201c" + shown + "\u201d\n\n" +
    "Every round, every question and the plan go with it. This cannot be undone.",
    "Delete");
  if (!ok) return;
  if (!online()) return;
  setSync("saving");
  try {
    const r = await fetch(`${link.api}/api/brainstorm/${x.id}`,
                          authed({ method: "DELETE" }));
    if (!r.ok) {
      const d = await r.json().catch(() => null);
      throw new Error((d && d.detail) || `HTTP ${r.status}`);
    }
    setSync("saved");
  } catch (e) {
