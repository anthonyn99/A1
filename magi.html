    if (b.kind === "footnotes") {
      const box = el("div", "md-footnotes");
      const ol = el("ol");
      for (const n of b.notes) {
        const li = el("li");
        li.append(el("span", "md-fn-id", n.id));
        inline(li, n.text);
        ol.append(li);
      }
      box.append(ol);
      host.append(box);
      return;
    }
    if (b.kind === "quote") {
      host.append(renderBlocks(el("blockquote", "md-quote"), b.blocks));
      return;
    }
    if (b.kind === "code") {
      const wrap = el("div", "md-pre-wrap");
      if (b.lang) wrap.append(el("div", "md-pre-lang", b.lang));
      const pre = el("pre", "md-pre");
      pre.append(el("code", null, b.text));
      wrap.append(pre);
      attachScrollbar(pre);
      host.append(wrap);
      return;
    }
    if (b.kind === "conf") {
      const p = el("p", "v-conf");
      p.append(el("span", `conf-tag ${b.level.toLowerCase()}`, b.level));
      if (b.why) {
        const why = el("span", "conf-why");
        const echo = b.why.match(new RegExp(`^(${b.level})\\b`, "i"));
        if (echo) why.append(el("span", "conf-echo", echo[1]));
        inline(why, echo ? b.why.slice(echo[1].length) : b.why);
        p.append(why);
      }
      host.append(p);
      return;
    }
    if (b.kind === "table") {
      const wrap = el("div", "v-tablewrap"), t = el("table", "v-table");
      const cols = Math.max(b.head ? b.head.length : 0, ...b.rows.map((r) => r.length));
      const cell = (tag, text, k) => {
        const c = inline(el(tag), text || "");
        const a = b.align && b.align[k];
        if (a) c.style.textAlign = a;
        return c;
      };
      if (b.head) {
        const tr = el("tr");
        for (let k = 0; k < cols; k++) tr.append(cell("th", b.head[k], k));
        const thead = el("thead");
        thead.append(tr);
        t.append(thead);
      }
      const tb = el("tbody");
      for (const r of b.rows) {
        const tr = el("tr");
        // Short rows are padded, so a ragged table keeps its grid.
        for (let k = 0; k < cols; k++) tr.append(cell("td", r[k], k));
        tb.append(tr);
      }
      t.append(tb);
      wrap.append(t);
      attachScrollbar(wrap);
      host.append(wrap);
      return;
    }
    // Lead styling marks the answer's opening line, only when the answer
    // actually opens with a paragraph.
    const p = el("p", lead && i === 0 ? "v-lead" : null);
    host.append(renderPara(p, b.lines || [b.text]));
  });
  return host;
}

/** Any unit's answer, rendered as markdown rather than as a wall of symbols. */
function mdBody(text) {
  return renderBlocks(el("div", "md"), mdParse(text));
}

/** The verdict body: answer on the left, notes and confidence in a sidebar on
 *  wide screens. The sidebar is omitted entirely when there is nothing to put
 *  in it, so a plain-prose verdict just reads as one column. */
function verdictBody(text) {
  const g = parseVerdict(text);
  const hasAside = g.notes.length > 0 || g.conf.length > 0;
  const root = el("div", `verdict-body ${hasAside ? "split" : ""}`);
  root.append(renderBlocks(el("div", "v-main"), g.main, true));
  if (hasAside) {
    const aside = el("aside", "v-aside");
    if (g.notes.length) {
      const c = el("div", "v-card");
      c.append(el("div", "sec", "Notes"));
      renderBlocks(c, g.notes);
      aside.append(c);
    }
    if (g.conf.length) {
      const c = el("div", "v-card");
      c.append(el("div", "sec", "Confidence"));
      renderBlocks(c, g.conf);
      aside.append(c);
    }
    root.append(aside);
  }
  return root;
}

/* ══ the brief: a verdict laid out as a briefing ═══════════════════════════
   The same text as verdictBody, drawn the way TradeHub's Market Summary is:
   a headline and summary up top with a confidence meter, then each section as
   its own card, bold-led bullets as key-point cards, notes as a "worth
   knowing" panel. Everything comes from structure the chairman ALREADY
   writes (ANSWER / NOTES / CONFIDENCE, ### sections, **bold** lead phrases),
   so it costs no extra prompt, no engine change and no time -- and every past
   deliberation gets it too. A verdict with no structure to find simply reads
   as a hero plus prose, never worse than the text view. */

const VERDICT_VIEW = {
  get: () => { try { return localStorage.getItem("magi.verdict.view") === "text" ? "text" : "brief"; } catch { return "brief"; } },
  set: (v) => { try { localStorage.setItem("magi.verdict.view", v); } catch {} },
};

/** "**Label:** rest" / "**Label** — rest" -> { label, rest }; null otherwise. */
function boldLead(text) {
  const m = String(text || "").match(/^\s*(?:\*\*|__)(.{2,90}?)(?:\*\*|__)\s*([:：—–-]\s*)?([\s\S]*)$/);
  if (!m) return null;
  const rest = m[3].trim();
  // "**Label:** text" is a label over its body. "**Oil climbs above $100**,
  // particularly if..." is one sentence that happens to open in bold --
  // splitting it left a card body starting ", particularly".
  const labelled = !!m[2] || /[:：]\s*$/.test(m[1]) || !rest;
  return { label: m[1].replace(/[:：]\s*$/, "").trim(), rest, joined: !labelled && /^[,;.)\]a-z]/.test(rest) };
}

/** A list, as cards when it is a list of labelled points, as numbered steps
 *  when it is ordered, and as a plain list otherwise. */
function briefList(list) {
  const items = list.items;
  const leads = items.map((it) => boldLead(it.text));
  const labelled = leads.filter(Boolean).length;
  if (items.length >= 2 && labelled / items.length >= 0.6) {
    const short = items.every((it) => (it.text.length + (it.extra || []).join(" ").length) < 260 && !(it.children || []).length);
    const grid = el("div", `br-points ${short && items.length > 1 ? "two" : ""}`);
    items.forEach((it, k) => {
      const card = el("div", "br-point");
      const lead = leads[k];
      // A numbered list is a ranking; turned into cards it keeps its numbers.
      let host = card;
      if (list.ordered) {
        card.classList.add("numbered");
        card.append(el("span", "br-point-n", String((list.start || 1) + k)));
        host = el("div", "br-point-main");
        card.append(host);
      }
      const split = lead && !lead.joined;
      if (split) host.append(inline(el("div", "br-point-label"), lead.label));
      const body = el("div", `br-point-body ${lead && lead.joined ? "joined" : ""}`);
      const rest = split ? lead.rest : it.text;
      if (rest) inline(body, rest);
      for (const x of it.extra || []) { body.append(el("br")); inline(body, x); }
      if (rest || (it.extra || []).length) host.append(body);
      for (const c of it.children || []) host.append(renderList(c));
      grid.append(card);
    });
    return grid;
  }
  if (list.ordered && items.length >= 2) {
    const steps = el("ol", "br-steps");
    items.forEach((it, k) => {
      const li = el("li", "br-step");
      li.append(el("span", "br-step-n", String((list.start || 1) + k)));
      const body = el("div", "br-step-body");
      const lead = leads[k];
      if (lead) {
        body.append(inline(el("div", "br-step-label"), lead.label));
        if (lead.rest) body.append(inline(el("div"), lead.rest));
      } else inline(body, it.text);
      for (const x of it.extra || []) { body.append(el("br")); inline(body, x); }
      for (const c of it.children || []) body.append(renderList(c));
      li.append(body);
      steps.append(li);
    });
    return steps;
  }
  return renderList(list);
}

/* What a model writes, recognised as more than prose. Every unit reaches for
   the same handful of devices -- a bold label on its own line over a list
   ("**Bullish if:**"), a bold run of tickers, "**Important:**" asides,
   "A ↑ → B ↑ → C ↓" chains -- so recognising them is what lets an answer from
   ANY unit, or any chairman, render as a briefing rather than a wall. */
const TONE_BAD = /\b(bear(ish)?|downside|cons|disadvantages?|drawbacks?|risks?|weakness(es)?|threats?|headwinds?|negatives?|worst[- ]case|avoid|warnings?|pitfalls?|red flags?|dangers?|concerns?)\b/i;
const TONE_GOOD = /\b(bull(ish)?|upside|pros|advantages?|benefits?|strengths?|opportunit(y|ies)|tailwinds?|positives?|best[- ]case|catalysts?|wins?)\b/i;
const toneOf = (label) => (TONE_BAD.test(label) ? "bad" : TONE_GOOD.test(label) ? "good" : "");

const LABEL_ONLY = /^\s*(?:\*\*|__)([^*_\n]{1,48}?)\s*[:：]?\s*(?:\*\*|__)\s*[:：]?\s*$/;
const PLAIN_LABEL = /^\s*([A-Z][^.!?\n*]{0,32}?)\s*:\s*$/;
const CALLOUT = /^\s*(?:\*\*|__)\s*((?:important|note|notes|warning|caution|correction|caveat|heads[- ]up|tip|reminder|disclaimer|key (?:point|takeaway|insight))\b[^*_\n]{0,40}?)\s*[:：]?\s*(?:\*\*|__)\s*[:：]?\s*([\s\S]+)$/i;

/** "**A, B, C, D**, plus the rest" -> chips A B C D and a note. Loose mode
 *  (under a label like "Most affected:") also takes an unbolded list. */
function briefChips(text, loose) {
  const t = String(text || "").trim();
  let cand = null, note = "";
  const m = t.match(/^\*\*([^*]+)\*\*\s*[,;:.]?\s*([\s\S]*)$/);
  if (m) { cand = m[1]; note = m[2]; }
  else if (loose) cand = t.replace(/\*\*/g, "");
  if (!cand) return null;
  const items = cand.split(/\s*[,;]\s*/).map((s) => s.trim().replace(/\.$/, "")).filter(Boolean);
  if (items.length < 3 || !items.every((s) => s.length <= 30)) return null;
  const wrap = el("div", "br-chipset");
  const chips = el("div", "br-chips");
  items.forEach((s) => chips.append(inline(el("span", "br-chip"), s)));
  wrap.append(chips);
  note = note.replace(/^(?:and|plus)\s+/i, "").trim();
  if (note) wrap.append(inline(el("div", "br-chip-note"), note.charAt(0).toUpperCase() + note.slice(1)));
  return wrap;
}

/** "Oil ↑ → yields ↑ → Nasdaq ↓" as a row of steps. */
function briefFlow(text) {
  const t = String(text || "").trim().replace(/^\*\*|\*\*$/g, "");
  if ((t.match(/→|->|⟶|⇒/g) || []).length < 2) return null;
  const steps = t.split(/\s*(?:→|->|⟶|⇒)\s*/);
  if (steps.some((s) => !s.trim() || s.length > 48)) return null;
  const row = el("div", "br-flow");
  steps.forEach((s, k) => {
    if (k) row.append(el("span", "br-flow-arrow", "→"));
    const dir = /↑|⬆/.test(s) ? "up" : /↓|⬇/.test(s) ? "down" : "";
    row.append(inline(el("span", `br-flow-step ${dir}`), s.replace(/\*\*/g, "").trim()));
  });
  return row;
}

function briefBlocks(host, blocks) {
  let groups = null;             // the grid a run of labelled groups shares
  for (let i = 0; i < blocks.length; i++) {
    const b = blocks[i];
    if (b.kind === "hr") continue;                  // cards already separate
    if (b.kind === "h") {
      groups = null;
      host.append(inline(el("div", "br-subhd"), b.text));
      continue;
    }
    if (b.kind === "p") {
      const next = blocks[i + 1];
      const lab = b.text.match(LABEL_ONLY) || (b.text.length <= 36 ? b.text.match(PLAIN_LABEL) : null);
      if (lab && next && (next.kind === "list" || next.kind === "p" || next.kind === "table")) {
        const label = lab[1].trim();
        const box = el("div", `br-group ${toneOf(label)}`);
        const hd = el("div", "br-group-hd");
        hd.append(el("span", "br-group-dot"), inline(el("span"), label));
        box.append(hd);
        let wide = false;
        if (next.kind === "list") box.append(briefList(next.list));
        else if (next.kind === "p") {
          const chips = briefChips(next.text, true);
          wide = !!chips;
          box.append(chips || inline(el("p"), next.text));
        } else { wide = true; renderBlocks(box, [next]); }
        i++;
        // A row of chips or a table spans the card on its own row, outside the
        // grid -- inside it, it held a third column open that left the
        // Bullish/Bearish pair beside it at two-thirds width.
        if (wide) { box.classList.add("wide"); host.append(box); groups = null; continue; }
        if (!groups) { groups = el("div", "br-groups"); host.append(groups); }
        groups.append(box);
        continue;
      }
      groups = null;
      const co = b.text.match(CALLOUT);
      if (co) {
        const box = el("div", `br-callout ${toneOf(co[1])}`);
        box.append(inline(el("div", "br-callout-hd"), co[1].trim()), inline(el("div", "br-callout-body"), co[2]));
        host.append(box);
        continue;
      }
      const flow = briefFlow(b.text);
      if (flow) { host.append(flow); continue; }
      const chips = briefChips(b.text, false);
      if (chips) { host.append(chips); continue; }
    }
    groups = null;
    if (b.kind === "list") host.append(briefList(b.list));
    else renderBlocks(host, [b]);
  }
  return host;
}

/** "Priority #1 — Fed Repricing" -> { n: "1", kicker: "Priority", title }.
 *  Also "1. X", "#2: X", "Step 3 - X", "Part 4) X". */
function briefNumbered(title) {
  const t = String(title || "").trim();
  let m = t.match(/^(priority|tier|step|part|phase|stage|rank|section|chapter|day|option|reason|tip)\s*#?\s*(\d{1,2})\s*[—–:.)\-]\s*(.+)$/i);
  if (m) return { n: m[2], kicker: m[1], title: m[3] };
  m = t.match(/^#?(\d{1,2})\s*(?:[.)]\s+|\s*[—–:\-]\s*)(.+)$/);
  if (m) return { n: m[1], kicker: "", title: m[2] };
  return { n: "", kicker: "", title: t };
}
const BRIEF_HIGHLIGHT = /^(bottom line|summary|in summary|conclusion|tl;?dr|key takeaways?|the verdict|final (?:take|thoughts|answer|verdict)|recommendation|what to do|action plan)\b/i;

/** Splits a lead paragraph into a headline and the rest, when its first
 *  sentence is short enough to be one. */
function splitHeadline(text) {
  const t = String(text || "").trim();
  if (t.length <= 170) return { head: t, rest: "" };
  // First sentence end: . ! ? followed by a space and a capital -- so "e.g."
  // and "U.S. data" do not end it.
  const m = t.match(/^([\s\S]{25,170}?[.!?])\s+(?=[A-Z"“(])/);
  if (m) return { head: m[1], rest: t.slice(m[0].length) };
  // One long sentence is still the headline, just set a size down.
  return t.length <= 280 ? { head: t, rest: "", long: true } : { head: "", rest: t };
}

/** opts.report: the Studio Report's document layout -- a cover naming the
 *  question, numbered chapters, and a sticky contents rail that follows the
 *  reader on wide screens (chips on narrow ones). */
function briefBody(text, opts = {}) {
  const g = parseVerdict(text);
  const report = !!opts.report;
  const root = el("div", `verdict-body brief ${report ? "report" : ""}`);
  const blocks = [...g.main];

  /* hero */
  const hero = el("div", "br-hero");
  const lead = blocks[0] && blocks[0].kind === "p" ? blocks.shift() : null;
  if (report) {
    hero.append(el("div", "br-kicker", "Report"));
    if (opts.title) hero.append(inline(el("h2", "br-cover-title"), opts.title));
    if (lead) hero.append(inline(el("div", "br-lede"), lead.text));
  } else if (lead) {
    const { head, rest, long } = splitHeadline(lead.text);
    if (head) hero.append(inline(el("div", `br-headline ${long ? "long" : ""}`), head));
    // The headline stood alone and the answer goes on with a short framing
    // paragraph before its first section: that paragraph is the summary.
    const next = blocks[0];
    const summary = rest || (next && next.kind === "p" && next.text.length <= 420 ? (blocks.shift(), next.text) : "");
    if (summary) hero.append(inline(el("div", "br-summary"), summary));
  }
  const conf = g.conf.find((b) => b.kind === "conf");
  if (conf) {
    const lv = { LOW: 1, MEDIUM: 2, HIGH: 3 }[conf.level] || 0;
    const meter = el("div", `br-conf ${conf.level.toLowerCase()}`);
    const top = el("div", "br-conf-top");
    const bar = el("div", "br-conf-bar");
    for (let k = 1; k <= 3; k++) bar.append(el("i", k <= lv ? "on" : ""));
    top.append(el("span", "br-conf-k", "Confidence"), bar, el("span", "br-conf-v", conf.level));
    meter.append(top);
    if (conf.why) {
      let why = conf.why.replace(new RegExp(`^${conf.level}\\b\\s*[-—:.,]*\\s*`, "i"), "");
      why = why.charAt(0).toUpperCase() + why.slice(1);
      if (why) meter.append(inline(el("div", "br-conf-why"), why));
    }
    hero.append(meter);
  }

  /* sections: every heading opens a card, whatever its level. Models mix #,
     ## and ### freely (ChatGPT: a ## title, ### priorities, then # parts),
     and splitting only on the shallowest level left everything under the
     others as uncarded prose. A heading with nothing under it before the next
     heading is a GROUP title; a deeper heading inside a card that already has
     content is that card's sub-heading. */
  const sections = [];
  let cur = { title: null, level: 0, blocks: [] };
  const push = () => { if (cur.title !== null || cur.blocks.length) sections.push(cur); };
  const nextReal = (i) => { let j = i + 1; while (blocks[j] && blocks[j].kind === "hr") j++; return blocks[j]; };
  blocks.forEach((b, i) => {
    if (b.kind !== "h") { cur.blocks.push(b); return; }
    const lvl = b.level || 3;
    if (cur.title !== null && lvl > cur.level && cur.blocks.some((x) => x.kind !== "hr")) {
      cur.blocks.push(b);
      return;
    }
    push();
    const nx = nextReal(i);
    if (nx && nx.kind === "h" && (nx.level || 3) >= lvl) {
      sections.push({ group: b.text });
      cur = { title: null, level: 0, blocks: [] };
      return;
    }
    cur = { title: b.text, level: lvl, blocks: [] };
  });
  push();
  const titled = sections.filter((s) => typeof s.title === "string");

  if (hero.childNodes.length) root.append(hero);

  // A report numbers its chapters even when the model did not, so the
  // contents and the cards read as one document.
  const chapter = (s, k) => {
    const c = briefNumbered(s.title);
    return { n: report ? String(k + 1) : c.n, kicker: c.kicker, title: c.title };
  };

  // contents chips when there is enough to navigate
  const secEls = [];
  const jump = (k) => secEls[k] && secEls[k].scrollIntoView({ behavior: "smooth", block: "start" });
  if (titled.length >= (report ? 2 : 3)) {
    const toc = el("div", "br-toc");
    titled.forEach((s, k) => {
      const b = el("button", "br-toc-chip");
      b.type = "button";
      inline(b, chapter(s, k).title);
      b.onclick = () => jump(k);
      toc.append(b);
    });
    root.append(toc);
  }

  // A report's body sits beside a contents rail; a verdict's is the root.
  let host = root, rail = null;
  if (report && titled.length >= 2) {
    const doc = el("div", "br-doc");
    rail = el("nav", "br-rail");
    rail.setAttribute("aria-label", "Contents");
    rail.append(el("div", "br-rail-hd", "Contents"));
    titled.forEach((s, k) => {
      const c = chapter(s, k);
      const b = el("button", "br-rail-item");
      b.type = "button";
      if (c.n) b.append(el("span", "br-rail-n", c.n.padStart(2, "0")));
      b.append(inline(el("span", "br-rail-t"), c.title));
      b.onclick = () => jump(k);
      rail.append(b);
    });
    host = el("div", "br-doc-main");
    doc.append(rail, host);
    root.append(doc);
  }

  let k = 0;
  for (const s of sections) {
    if (s.group !== undefined) {
      host.append(inline(el("div", "br-group-title"), s.group));
      continue;
    }
    if (s.title === null) {
      if (s.blocks.length) host.append(briefBlocks(el("div", "br-intro"), s.blocks));
      continue;
    }
    const c = chapter(s, k++);
    const tone = toneOf(c.title);
    const card = el("section", `br-sec ${tone ? "tone-" + tone : ""} ${BRIEF_HIGHLIGHT.test(c.title) ? "hl" : ""}`);
    const hd = el("div", "br-sec-hd");
    if (c.n) hd.append(el("span", "br-sec-n", c.n));
    const tw = el("div", "br-sec-tw");
    if (c.kicker) tw.append(el("div", "br-sec-kicker", c.kicker));
    tw.append(inline(el("h3", "br-sec-title"), c.title));
    hd.append(tw);
    card.append(hd);
    if (s.blocks.length) card.append(briefBlocks(el("div", "br-sec-body"), s.blocks));
    secEls.push(card);
    host.append(card);
  }

  // The rail marks the chapter being read.
  if (rail && "IntersectionObserver" in window) {
    const items = [...rail.querySelectorAll(".br-rail-item")];
    const io = new IntersectionObserver((entries) => {
      for (const e of entries) {
        if (!e.isIntersecting) continue;
        const i = secEls.indexOf(e.target);
        items.forEach((it, j) => it.classList.toggle("on", j === i));
      }
    }, { rootMargin: "-15% 0px -70% 0px" });
    secEls.forEach((s) => io.observe(s));
    root.stopSpy = () => io.disconnect();
  }

  /* notes + the rest of the confidence section */
  const confRest = g.conf.filter((b) => b.kind !== "conf");
  if (g.notes.length || confRest.length) {
    const notes = el("div", "br-notes");
    const hd = el("div", "br-notes-hd");
    hd.append(icSpan("br-notes-ic", "help"), el("span", null, "Worth knowing"));
    notes.append(hd);
    briefBlocks(notes, [...g.notes, ...confRest]);
    host.append(notes);
  }
  return root;
}

/* ══ copying a result ══════════════════════════════════════════════════════
   Every surface that finishes with something worth keeping gets the same
   button: the verdict, a brainstorm plan, an earlier round's draft, one
   unit's answer, a Studio report.

   TWO FLAVOURS, ONE CLICK. The clipboard can hold the same content in several
   types at once and let the destination pick, which is exactly the right shape
   here because the two destinations want opposite things:

     text/plain  the MARKDOWN, untouched. This is what another model wants,
                 what a markdown editor wants, and what a commit message
                 wants. Emoji are just characters and survive as themselves.
     text/html   the rendered thing, with its styling inlined, for a document
                 or an email -- headings, bold, lists, tables and colour.

   WHY THE COLOURS ARE FLIPPED ON THE WAY OUT. This console is white-on-black;
   documents are black-on-white. Copying the computed colours verbatim would
   paste near-white text onto a white page -- technically "the colours", and
   unreadable. So each colour's LIGHTNESS is inverted while its hue and
   saturation are kept: the gold stays gold, the green stays green, the near
   white becomes near black, and the muted greys stay muted rather than
   flattening into one colour. What arrives looks like the panel, set for
   paper.

   Only typography is inlined -- colour, weight, slant, monospace, underline,
   pre-wrap. Deliberately NOT the box model: this console's padding, widths
   and flex layout are for a 2000px console, and carrying them into a Word
   document is what makes pasted HTML look broken. */

/** rgb(...) -> a colour that reads on white, keeping hue and saturation. */
function forPaper(css) {
  const m = /rgba?\(([^)]+)\)/.exec(css || "");
  if (!m) return null;
  const [r, g, b] = m[1].split(",").map((x) => parseFloat(x) / 255);
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  let l = (max + min) / 2;
  if (l <= 0.5) return null;              // already dark enough to read on white
  const d = max - min;
  const sat = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1));
  let h = 0;
  if (d !== 0) {
    h = max === r ? ((g - b) / d) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
    h *= 60;
    if (h < 0) h += 360;
  }
  // Flipped, then floored a little short of black so the hierarchy the panel
  // had -- heading, body, muted aside -- survives as three distinct greys.
  l = Math.min(0.42, 1 - l);
  return `hsl(${Math.round(h)} ${Math.round(sat * 100)}% ${Math.round(l * 100)}%)`;
}

/** Copy the styling that matters from a live tree onto its clone.
 *
 *  Walked in parallel rather than read from the clone: a detached node has no
 *  computed style at all, so the original is the only thing that can answer
 *  what colour anything actually is. */
function inlineStyle(src, dst) {
  const cs = getComputedStyle(src);
  const out = [];
  const col = forPaper(cs.color);
  if (col) out.push("color:" + col);
  if (parseInt(cs.fontWeight, 10) >= 600) out.push("font-weight:700");
  if (cs.fontStyle === "italic") out.push("font-style:italic");
  if (/mono/i.test(cs.fontFamily)) out.push("font-family:ui-monospace,SFMono-Regular,Consolas,monospace");
  if (cs.textDecorationLine && cs.textDecorationLine !== "none") out.push("text-decoration:" + cs.textDecorationLine);
  if (/^pre/.test(cs.whiteSpace)) out.push("white-space:pre-wrap");
  if (out.length) dst.setAttribute("style", out.join(";"));
  const a = src.children, b = dst.children;
  for (let i = 0; i < a.length && i < b.length; i++) inlineStyle(a[i], b[i]);
}

const esc = (t) => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

/** The html flavour: a rendered node with its styling baked in, or -- for the
 *  unit answers, which are plain text and not markdown -- the text itself,
 *  wrapped so its line breaks survive. */
function richHtml(node, text) {
  if (!node) {
    return '<div style="white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Consolas,monospace">'
      + esc(text) + "</div>";
  }
  const clone = node.cloneNode(true);
  // Styled first, pruned second. inlineStyle walks the live tree and the clone
  // together BY INDEX, so removing anything from the clone beforehand shifts
  // every later sibling onto its neighbour's styling.
  inlineStyle(node, clone);
  // Controls are not content: a copy button pasted into a document would be an
  // empty box captioned COPY.
  for (const b of clone.querySelectorAll(".copybtn, button")) b.remove();
  return '<div style="font-family:Georgia,\'Times New Roman\',serif;line-height:1.55">'
    + clone.innerHTML + "</div>";
}

/** Put both flavours on the clipboard. Returns whether anything landed.
 *
 *  Three routes, because the good one is not available everywhere: async
 *  clipboard writes need a secure context (https, or 127.0.0.1 -- but not a
 *  console opened from a file:// path), and ClipboardItem is newer than the
 *  rest. Nothing is awaited before the write, so the user gesture that
 *  authorises it is still in scope. */
async function putOnClipboard(html, text) {
  try {
    if (navigator.clipboard && window.ClipboardItem) {
      await navigator.clipboard.write([new ClipboardItem({
        "text/html": new Blob([html], { type: "text/html" }),
        "text/plain": new Blob([text], { type: "text/plain" }),
      })]);
      return true;
    }
  } catch { /* fall through -- a refused rich write must not lose the text */ }
  try {
    if (navigator.clipboard) { await navigator.clipboard.writeText(text); return true; }
  } catch { /* fall through */ }
  // The last resort, and it keeps both flavours rather than degrading to one.
  // execCommand copies a SELECTION, which would hand the destination whatever
  // plain text the browser derives from the html -- the rendered prose, with
  // every asterisk and heading marker gone. So a one-shot copy listener
  // overwrites both types with exactly what was asked for; the offscreen
  // selection is still needed, because a collapsed selection makes the whole
  // command a no-op in Safari.
  try {
    const host = el("div");
    host.contentEditable = "true";
    host.innerHTML = html;
    host.style.cssText = "position:fixed;left:-9999px;top:0;white-space:pre-wrap";
    document.body.append(host);
    const range = document.createRange();
    range.selectNodeContents(host);
    const sel = getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    const onCopy = (e) => {
      e.clipboardData.setData("text/html", html);
      e.clipboardData.setData("text/plain", text);
      e.preventDefault();
    };
    document.addEventListener("copy", onCopy, { once: true, capture: true });
    const ok = document.execCommand("copy");
    document.removeEventListener("copy", onCopy, true);
    sel.removeAllRanges();
    host.remove();
    return ok;
  } catch { return false; }
}

/** The button itself.
 *
 *  `payload` is a function, not a value: these panels re-render on every
 *  streaming frame and on every round, so a node captured at build time would
 *  be a detached copy of something the user is no longer looking at. Asking at
 *  click time always copies what is on screen. */
function copyButton(payload, { label = "Copy", cls = "" } = {}) {
  const b = el("button", `copybtn ${cls}`.trim());
  b.type = "button";
  const ico = icSpan("", "copy");
  const txt = el("span", null, label);
  b.append(ico, txt);
  b.title = "Copy this — formatted for a document, markdown for anything else";
  let reset = 0;
  b.onclick = async (ev) => {
    // These buttons sit inside <summary> and other things that act on a
    // click; copying must not also fold the section away.
    ev.preventDefault();
    ev.stopPropagation();
    const { node = null, md = "" } = payload() || {};
    const text = (md || (node ? node.innerText : "") || "").trim();
    if (!text) return;
    const ok = await putOnClipboard(richHtml(node, text), text);
    clearTimeout(reset);
    b.classList.toggle("done", ok);
    ico.innerHTML = IC[ok ? "tick" : "copy"];
    txt.textContent = ok ? "Copied" : "Press Ctrl+C";
    reset = setTimeout(() => {
      b.classList.remove("done");
      ico.innerHTML = IC.copy;
      txt.textContent = label;
    }, 1600);
  };
  return b;
}

/** Fill every [data-ic] with its drawn icon. Called after any render that can
 *  introduce one, so markup stays declarative and the table stays the single
 *  place an icon is defined. */
function paintIcons(root) {
  for (const n of (root || document).querySelectorAll("[data-ic]")) {
    const want = n.dataset.ic;
    if (n.dataset.icPainted === want) continue;
    n.innerHTML = IC[want] || "";
    n.dataset.icPainted = want;
  }
}

/** A drawn spinner element. The old one rotated the dingbat ◐, whose ink is
 *  not centred in its em box -- so it orbited rather than spun, which is what
 *  made the doctor look broken the moment it started. */
function spinnerEl() {
  const n = el("span", "spin");
  n.innerHTML = SPINNER;
  return n;
}

const icSpan = (cls, name) => { const n = el("span", cls); n.innerHTML = IC[name] || ""; return n; };
const nodeCaret = () => icSpan("node-caret", "caret");

/* ══ state ═════════════════════════════════════════════════════════════════
   One object rather than scattered variables, so "what is the console showing
   right now" is answerable by reading one place. `panels` is ordered, because
   the grid's left/right split is positional. */
const S = {
  providers: [],
  selected: new Set(),
  panels: [],            // [{id, display_name, accent, state, text, chars, ...}]
  opened: new Set(),     // which unit blocks are expanded
  verdict: null,
  running: false,
  // Halt has been pressed and the engine has not finished winding down yet.
  halting: false,
  /* Which screen the grid and the verdict belong to: "council", "brainstorm"
   * or null for neither.
   *
   *  Both screens fill the SAME panels: a deliberation puts one unit per
   *  member in the grid, and so does a brainstorm round. Without a record of
   *  which one put them there, opening a past deliberation and then going to
   *  Brainstorm carried that deliberation's units and its CENTRAL DOGMA panel
   *  along with it -- a finished verdict sitting under a composer that has
   *  nothing to do with it.
   */
  gridOwner: null,
  /* True when the deliberation on screen exists in this engine's database.
   *
   *  Studio builds a card by driving a real browser against the run's stored
   *  answers, so it can only run where those answers live. A deliberation
   *  made on another device opens here from the cloud -- its answers, verdict
   *  and any cards already built all travel -- but the engine has never seen
   *  it, and asking it to build a new card returns 404 "unknown run".
   */
  runLocal: false,
  // The prompt queue. One entry per prompt waiting to be put to the council,
  // each carrying its own units -- see the QUEUE section.
  queue: [],
  queueRunning: false,
  /* The run that is actually in flight, held apart from whatever is on
   * screen.
   *
   *  Opening a finished prompt from the queue while the next one is running
   *  used to hand the live stream the OLD run's rows: byId() reads S.panels,
   *  openRun replaces S.panels, and the provider ids match -- so the finished
   *  deliberation you opened started filling up with the running one's states
   *  while its verdict sat underneath. The live panels are kept here instead,
   *  and the stream writes to them whether or not they are the ones showing.
   */
  live: null,
  /* The question the verdict on screen answers.
   *
   *  The composer used to be that label. It no longer is: it is typable
   *  during a run, so while one prompt works you can be reading another
   *  prompt's verdict with a third one half-written in the box above it.
   *  Kept with the run rather than read off the screen.
   */
  viewQuestion: "",
  // True while the council view is showing a run opened from History rather
  // than one you just started. The difference is not cosmetic: it decides
  // which sidebar row is lit and whether there is a way back to the list.
  fromHistory: false,
  // Filled in where loadUnitOrder is defined: UNIT_ORDER_KEY is a const
  // declared with the drag code below, and reading it from here would hit it
  // in the temporal dead zone -- which throws before the page paints.
  unitOrder: [],
  runId: null,
  history: [],
  view: "council",       // council | history | doctor
  doctorBusy: false,
  doctorAbort: null,
  attachments: [],       // {id, file}
  preRefine: null,
  refining: false,
  muted: (() => { try { return localStorage.getItem("magi.muted") === "1"; } catch { return false; } })(),
  navCollapsed: (() => { try { return localStorage.getItem("magi.nav.collapsed") === "1"; } catch { return false; } })(),
  es: null,
  procTimer: null,
  settled: new Set(),
};

const MAX_ATTACHMENTS = 8;
const MAX_ATTACHMENT_BYTES = 20 * 1024 * 1024;
const byId = (id) => S.panels.find((p) => p.id === id);

/* ══ member blocks ═════════════════════════════════════════════════════════
   Built once per run and then MUTATED as events arrive, rather than rebuilt.
   Rebuilding on every SSE frame would drop the caret, collapse open blocks and
   destroy any text the reader had selected mid-stream — the answers arrive a
   few characters at a time, so that is many times a second. */

function buildNode(p) {
  const node = el("div", "node collapsed");
  node.style.setProperty("--pa", p.accent);
  node.style.setProperty("--pd", PHASE[p.id] || "0s");

  const hd = el("button", "node-hd");
  hd.type = "button";
  // Model name leads, codename beneath it. Which model produced an answer is
  // the load-bearing fact when reading one; the codename is the console's
  // flavour and was carrying the visual weight instead.
  const names = el("div");
  names.append(el("div", "node-id", p.display_name), el("div", "node-sub", UNIT[p.id] || ""));
  const right = el("span");
  right.style.cssText = "display:flex;gap:7px;align-items:center";
  const meta = el("span", "node-meta");
  const badge = el("span", "badge");
  right.append(meta, badge, nodeCaret());
  hd.append(names, right);
  hd.onclick = () => toggleUnit(p.id);

  const peek = el("div", "node-peek");
  const bar = el("span", "bar");
  const fill = el("i");
  bar.append(fill);
  const hint = el("span", "hint");
  peek.append(bar, hint);

  const body = el("div", "node-body");
  attachScrollbar(body);
  node.append(hd, peek, body);
  p.dom = { node, hd, meta, badge, peek, fill, hint, body };
  return node;
}

function updateNode(p) {
  const d = p.dom;
  if (!d) return;
  const isOpen = S.opened.has(p.id);
  const working = WORKING.has(p.state);
  d.node.className = `node ${isOpen ? "open" : "collapsed"} ${working ? "working" : ""} ${p.ok === false ? "failed" : ""}`;
  d.hd.setAttribute("aria-expanded", String(isOpen));
  d.hd.title = isOpen ? "Collapse this unit" : "Show this unit's response";

  d.meta.textContent = p.latency_ms ? `${(p.latency_ms / 1000).toFixed(1)}s` : p.chars ? `${p.chars}c` : "";
  d.badge.className = `badge ${badgeClass(p.state, p.ok)}`;
  d.badge.textContent = STATE_LABEL[p.state] || p.state;

  show(d.peek, !isOpen);
  if (!isOpen) {
    d.fill.style.width = `${progressPct(p)}%`;
    const hasContent = p.ok === false || !!p.text;
    d.hint.textContent =
      p.degraded ? "unusable · open"
      : p.ok === false ? (p.failure || "offline")
      : hasContent ? `${p.chars}c · open`
      : working ? "receiving…" : "—";
  }

  show(d.body, isOpen);
  if (!isOpen) return;
  d.body.className = "node-body";
  d.body.textContent = "";

  if (p.degraded) {
    // Shown rather than hidden on purpose. What came back is usually a
    // clarifying question, which tells the user their prompt was ambiguous —
    // that is useful information, not noise to be swallowed.
    d.body.className = "callout degraded";
    d.body.append(
      el("div", "kind", "unusable response"),
      el("div", "cause", p.degraded_reason || ""),
      el("div", "remedy", "Excluded from the verdict. The other units are unaffected."),
    );
    if (p.text) d.body.append(el("div", "detail", p.text));
    return;
  }
  if (p.ok === false) {
    d.body.className = "callout";
    d.body.append(el("div", "kind", p.failure || "failed"), el("div", "cause", p.failure_cause || ""));
    if (p.failure_remedy) d.body.append(el("div", "remedy", p.failure_remedy));
    if (p.error_detail) d.body.append(el("div", "detail", p.error_detail));
    return;
  }
  if (!p.text) {
    d.body.className = "node-body idle";
    d.body.textContent = working ? "awaiting response" : "—";
    return;
  }
  // Markdown, not raw text: every unit writes bold, lists, headings and
  // tables, and the card showed them as literal ** and - characters.
  d.body.className = "node-body md-node";
  d.body.append(mdBody(p.text));
  if (working) {
    const tail = d.body.querySelector(".md > :last-child") || d.body;
    tail.append(el("span", "caret"));
  }
  // Under the answer rather than in the heading: the heading IS a button (it
  // expands the unit), and a button inside a button is neither valid nor
  // clickable. Only once the unit has finished -- copying half a stream is a
  // promise this cannot keep.
  if (!working) {
    d.body.append(copyButton(() => ({ md: p.text }),
                             { label: `Copy ${p.display_name}`, cls: "under" }));
  }
  if (p.low_confidence) {
    // No glyph: U+26A0 is one of the few characters here with EMOJI
    // presentation, so it rendered as a colour pictograph among monochrome
    // dingbats. The amber already carries the caution.
    const w = el("div", null, "End of response inferred, not confirmed — may be truncated");
    w.style.cssText = "color:var(--amber);font-size:10px;margin-top:10px;letter-spacing:.4px";
    d.body.append(w);
  }
}

function toggleUnit(id) {
  S.opened.has(id) ? S.opened.delete(id) : S.opened.add(id);
  updateNode(byId(id));
  // The block just changed height, so the wiring has to be re-measured.
  drawLinks();
}

/** Rebuilds the whole grid. Called when the SET of units changes, not when
 *  their contents do. */
function renderGrid() {
  const grid = $("magiGrid");
  grid.textContent = "";
  show($("magi"), S.panels.length > 0);
  show($("emptyState"), S.panels.length === 0 && S.view === "council" && !S.verdict);
  if (!S.panels.length) return;

  for (const p of S.panels) grid.append(buildNode(p));

  // The core owns its own grid column, so it renders once and stays
  // vertically centred against the units beside it.
  const cell = el("div", "magi-core-cell");
  const core = el("div", "core");
  core.id = "core";
  core.append(
    el("div", "core-label", "Central dogma"),
    el("div", "core-status"),
    el("div", "core-count"),
    el("div", "core-label chair"),
  );
  cell.append(core);
  grid.append(cell);

  for (const p of S.panels) updateNode(p);
  updateCore();
  drawLinks();
  syncCouncilIdle();
  // The answer bodies were just rebuilt, so the bars belonging to the old
  // ones are pointing at detached nodes. One pass reaps them.
  if (typeof _replaceAllBars === "function") _replaceAllBars();
}

function updateCore() {
  const core = $("core");
  if (!core) return;
  const done = S.panels.filter((p) => p.ok === true).length;
  // Degraded units are ok === false, so they must be excluded here or they
  // would be reported as "offline" — a different claim about what happened,
  // and one the user would have no way to correct from the display.
  const degraded = S.panels.filter((p) => p.degraded).length;
  const failed = S.panels.filter((p) => p.ok === false && !p.degraded).length;
  const v = S.verdict;

  // One unit is a legitimate way to run MAGI, and calling its answer a
  // CONSENSUS would be a claim about agreement that nothing was measured
  // against. There is no chairman on that path either -- the sole member's
  // answer IS the verdict -- so the chair line is dropped rather than naming
  // the model as if it had synthesised anything.
  const solo = S.panels.length === 1;
  core.className = `core ${S.running ? "deliberating" : v ? (v.synthesis_ok ? "resolved" : "blocked") : ""}`;
  core.children[1].textContent = S.running ? "DELIBERATING"
    : v ? (v.synthesis_ok ? (solo ? "SOLE UNIT" : "CONSENSUS") : "NO QUORUM")
    : "STANDBY";
  core.children[2].textContent =
    `${done}/${S.panels.length} resolved` +
    (degraded ? ` · ${degraded} unusable` : "") +
    (failed ? ` · ${failed} offline` : "");
  const chair = core.children[3];
  const named = !!(v && v.chairman) && !solo;
  chair.textContent = named ? `chair · ${v.chairman}` : "";
  show(chair, named);
}

/** Draws the wiring from each member block to the core.
 *
 *  Measured from real element positions rather than computed from the layout,
 *  because the blocks grow as answers stream in and the sidebar can collapse
 *  under them. */
function drawLinks() {
  const host = $("magi"), svg = $("magiLinks"), core = $("core");
  if (!core || host.hidden) return;
  const H = host.getBoundingClientRect(), C = core.getBoundingClientRect();
  if (!C.width) return;
  const cx = C.left - H.left + C.width / 2;
  const cy = C.top - H.top + C.height / 2;

  svg.textContent = "";
  for (const p of S.panels) {
    if (!p.dom) continue;
    const R = p.dom.node.getBoundingClientRect();
    // Anchor on whichever side of the block faces the core.
    const onLeft = R.left - H.left + R.width / 2 < cx;
    const x = R.left - H.left + (onLeft ? R.width : 0);
    const y = R.top - H.top + R.height / 2;
    const mid = (x + cx) / 2;
    const cls = p.ok === false ? "dead" : WORKING.has(p.state) ? "live" : p.state === "done" ? "settled" : "";
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    // Elbow route: out horizontally, then into the core.
    path.setAttribute("d", `M ${x} ${y} H ${mid} V ${cy} H ${cx}`);
    path.setAttribute("class", `magi-link ${cls}`);
    path.style.setProperty("--pa", p.accent);
    svg.append(path);
  }
}

// Blocks grow as answers stream in, so the wiring has to follow them.
new ResizeObserver(() => requestAnimationFrame(drawLinks)).observe(document.documentElement);
window.addEventListener("resize", () => requestAnimationFrame(drawLinks));

/* ══ verdict panel ═════════════════════════════════════════════════════════ */
function renderVerdict() {
  const n = $("verdict");
  // Only while the council still owns what is on screen. A verdict belongs to
  // the grid it was drawn from -- left on its own after that grid went away,
  // it is a conclusion with nothing above it and nothing to click into.
  const v = S.gridOwner === "council" ? S.verdict : null;
  const studioOpen = !!(S.studio && S.studio.active);
  show(n, !!v && S.view === "council" && !studioOpen);
  if (!v || S.view !== "council" || studioOpen) return;
  n.textContent = "";

  // A single-unit run has no synthesis and no chairman: the answer is the
  // verdict. Saying "synthesised by ChatGPT" there would credit a pass that
  // never ran.
  const solo = v.total === 1;
  const hd = el("div", "verdict-hd");
  hd.append(el("span", "verdict-title", solo ? "Answer" : "Verdict"));
  hd.append(el("span", "verdict-quorum",
    (solo ? `${v.chairman || "one unit"} · answered directly`
          : `${v.responded} of ${v.total} units responded` +
            (v.chairman ? ` · synthesised by ${v.chairman}` : "")) +
    (v.total_ms ? ` · ${(v.total_ms / 1000).toFixed(0)}s` : "")));

  /* A way out, ON the verdict.
   *
   *  There is already one at the top of the screen, but a verdict is long and
   *  you read it at the bottom -- by then the control that dismisses it is a
   *  page and a half away, which is the same as not having one. This sits in
   *  the header of the thing being closed.
   */
  // One group at the right end, so Close and Copy are neighbours rather than
  // two controls with the header's spare width pushed between them.
  const acts = el("span", "verdict-acts");
  hd.append(acts);

  if (S.fromHistory) {
    const shut = el("button", "verdict-close");
    shut.type = "button";
    const live = S.running && S.live && S.panels !== S.live.panels;
    shut.append(el("span", "verdict-close-x", "✕"),
                document.createTextNode(live ? "Close — back to the running prompt"
                                             : "Close"));
    shut.title = live
      ? "Put the prompt that is still running back on screen"
      : "Clear this deliberation from the screen";
    shut.onclick = () => (live ? backToLive() : newRun());
    acts.append(shut);
  }

  n.append(hd);

  /* The question this verdict answers, when the composer cannot be trusted to
   * say it: you opened this from History or the queue, or something else is
   * running and the box above holds a different prompt entirely. A verdict
   * with no question attached is a paragraph of answer to something you have
   * to remember.
   */
  if (S.viewQuestion && (S.fromHistory || S.running)) {
    const q = el("div", "verdict-q");
    // A prompt pasted as a markdown template read as "# Weekly ... **5 most
    // important** ... * Keep it concise" -- its symbols shown raw. Plain text
    // here, clamped, and a click shows all of it.
    const plainQ = String(S.viewQuestion)
      .replace(/^\s{0,3}#{1,6}\s*/gm, "")
      .replace(/^\s*[*+-]\s+/gm, "• ")
      .replace(/\*\*|__|`/g, "")
      .replace(/\s*\n+\s*/g, "  ")
      .trim();
    const qt = el("span", "verdict-q-text", plainQ);
    qt.onclick = () => qt.classList.toggle("open");
    q.append(el("span", "verdict-q-tag", "asked"), qt);
    q.title = S.viewQuestion;
    n.append(q);
  }

  // Named here, not only in History. A verdict built from three units while
  // the display implied four is the exact failure this is here to prevent, and
  // the Verdict panel is what gets read.
  if (v.degraded && v.degraded.length) {
    const d = el("div", "verdict-degraded");
    d.append(el("strong", null, `Built from ${v.responded} of ${v.total} units.`));
    d.append(` ${v.degraded.map((x) => x.reason).join(" ")} Confidence is capped accordingly.`);
    n.append(d);
  }

  if (v.synthesis_ok) {
    // The body is built first so the header's copy button can point at it --
    // the header is already in the DOM, so adding to it here still lands in
    // the right corner. History reopens a past run through this very function,
    // so that button is there too without a second code path. There is none on
    // a failed synthesis: an error message is not a result to take away.
    const view = VERDICT_VIEW.get();
    const body = view === "brief" ? briefBody(v.verdict) : verdictBody(v.verdict);
    // Brief (the laid-out briefing) or Text (the plain reading view) --
    // remembered per device, since a phone and a desk can want different ones.
    const seg = el("span", "br-seg");
    for (const [k, label] of [["brief", "Brief"], ["text", "Text"]]) {
      const b = el("button", `br-seg-btn ${view === k ? "on" : ""}`, label);
      b.type = "button";
      b.setAttribute("aria-pressed", String(view === k));
      b.onclick = () => { if (VERDICT_VIEW.get() !== k) { VERDICT_VIEW.set(k); renderVerdict(); } };
      seg.append(b);
    }
    const group = (n.querySelector(".verdict-acts") || hd);
    group.prepend(seg);
    group.append(copyButton(() => ({ node: body, md: v.verdict })));
    n.append(body);
  } else {
    /* A failed synthesis is not a failed deliberation.
     *
     *  What was on screen was a wall of orange reading "Chairman (ChatGPT)
     *  failed: None -- ..." over NO QUORUM, with five good answers sitting
     *  above it -- which reads as "everything broke" when the truth is
     *  "everyone answered and the last step, the merge, did not land". The
     *  panel now says which of those it is, and the raw FailureKind ("None",
     *  which is what a rejected-but-successful capture reports) never reaches
     *  the screen.
     */
    const b = el("div", "verdict-body verdict-failed");
    const answered = (S.panels || []).filter((p) => p.ok).length;

    b.append(el("div", "vf-head", answered
      ? `The merge did not land \u2014 but ${answered} unit${answered === 1 ? "" : "s"} answered.`
      : "No verdict was produced."));

    if (answered) {
      b.append(el("div", "vf-sub",
        "Every answer above is intact and is what you asked for; only the "
        + "chairman's pass at merging them into one verdict failed. Open the "
        + "units to read them, or convene again to retry the merge."));
    }

    b.append(el("div", "vf-why", cleanSynthError(v.synthesis_error)));
    n.append(b);
  }
}

/** The engine's reason, without its internals.
 *
 *  "Chairman (ChatGPT) failed: None -- ChatGPT's response shares almost no
 *  vocabulary with the question" carries a FailureKind of None, because the
 *  capture SUCCEEDED and was then rejected by validation. Printing "None" at
 *  the user is showing them a variable.
 */
function cleanSynthError(raw) {
  let t = String(raw || "Synthesis failed.");
  t = t.replace(/failed:\s*None\s*--\s*/i, "failed: ");
  t = t.replace(/failed:\s*FailureKind\.(\w+)\s*--\s*/i,
                (_, k) => `failed (${k.toLowerCase().replace(/_/g, " ")}): `);
  return t;
}

/* ══ composer ══════════════════════════════════════════════════════════════ */

/** Grow the composer to fit its text so a long prompt is readable in full
 *  rather than scrolling inside a fixed box.
 *
 *  Height must be reset to "auto" before reading scrollHeight — scrollHeight
 *  never reports less than the current height, so without the reset the box
 *  could only ever grow, never shrink back after a clear. */
function autosize() {
  const t = $("composer");
  if (t.dataset.userH) return;   // sized by hand -- see attachGrip
  t.style.height = "auto";
  t.style.height = `${t.scrollHeight}px`;
}

/* Resize by dragging the grip; expand or compress by clicking it.
 *
 *  Both, because they answer different needs with the same control: a click
 *  is "give me room" without aiming, and a drag is "give me exactly this
 *  much". A click on a corner you can only drag is a dead press, and a drag
 *  on a button that only toggles is a fight with the page.
 *
 *  While a height has been chosen by hand, autosize stops touching the box:
 *  a box you sized is a box you decided about, and having it spring back on
 *  the next keystroke is the thing that makes handles feel broken. Clicking
 *  the grip while it is tall hands it back to auto-grow.
 */
const GRIP_MIN = 26;
function gripCap() { return Math.max(160, Math.round(innerHeight * 0.6)); }

/** The grip button itself, for the panels that build their bars in script. */
function gripButton() {
  const g = el("button", "qbar-grip");
  g.type = "button";
  g.title = "Drag to resize. Click to expand or compress.";
  g.setAttribute("aria-label", "Resize the prompt box");
  return g;
}

function attachGrip(ta, grip, key, resize) {
  if (!ta || !grip) return;
  const store = key ? "magi.h." + key : null;

  const apply = (h) => {
    ta.style.height = h ? `${h}px` : "auto";
    // The stylesheet caps these boxes at 45vh so a pasted essay cannot push
    // Convene off the screen. That cap has to give way to a height asked for
    // by hand, or the box stops halfway through the drag and the grip looks
    // broken -- gripCap() is the ceiling instead.
    ta.style.maxHeight = h ? `${h}px` : "";
    ta.dataset.userH = h ? String(h) : "";
    grip.classList.toggle("on", !!h);
    if (!h && resize) resize();
    try { if (store) h ? localStorage.setItem(store, String(h))
                       : localStorage.removeItem(store); } catch {}
  };

  // A height chosen on an earlier visit is still the height that was wanted.
  try {
    const saved = store ? parseInt(localStorage.getItem(store) || "", 10) : NaN;
    if (Number.isFinite(saved) && saved > GRIP_MIN) apply(Math.min(saved, gripCap()));
  } catch {}

  let id = null, y0 = 0, h0 = 0, moved = 0;
  grip.addEventListener("pointerdown", (e) => {
    id = e.pointerId; y0 = e.clientY; moved = 0;
    h0 = Math.round(ta.getBoundingClientRect().height);
    grip.setPointerCapture(id);
    e.preventDefault();
  });
  grip.addEventListener("pointermove", (e) => {
    if (e.pointerId !== id) return;
    const dy = e.clientY - y0;
    moved = Math.max(moved, Math.abs(dy));
    if (moved < 3) return;                      // not a drag yet, just a press
    apply(Math.max(GRIP_MIN, Math.min(h0 + dy, gripCap())));
  });
  const end = (e) => {
    if (e.pointerId !== id) return;
    try { grip.releasePointerCapture(id); } catch {}
    id = null;
    // A press that went nowhere is a click: toggle instead of resize.
    if (moved < 3) {
      if (ta.dataset.userH) apply(0);
      else apply(Math.min(gripCap(), Math.max(h0 + 120, 260)));
    }
  };
  grip.addEventListener("pointerup", end);
  grip.addEventListener("pointercancel", end);
  // Keyboard reach: the grip is a button, so Enter and Space must do the
  // thing the button says it does.
  grip.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    e.preventDefault();
    if (ta.dataset.userH) apply(0);
    else apply(Math.min(gripCap(), 260));
  });
}

function setQuestion(v) {
  $("composer").value = v;
  autosize();
  updateEnabled();
}

/** Stages files for the next question. Rejects rather than silently
 *  truncating, so a user who drops 12 files learns why only some landed. */
/** The brainstorm's attachment list. Same rules as the council's, and the
 *  same reason for each: a cap because these are typed into a chat composer's
 *  own upload control, and a size limit because that control is sized for a
 *  few reference files rather than bulk transfer. */
function bsAddFiles(incoming) {
  const bs = S.bs;
  bs.attachments = bs.attachments || [];
  const list = Array.from(incoming);
  if (!list.length) return;
  let err = null;
  for (const file of list) {
    if (bs.attachments.length >= MAX_ATTACHMENTS) {
      err = `Only ${MAX_ATTACHMENTS} attachments per session.`;
      break;
    }
    if (file.size > MAX_ATTACHMENT_BYTES) { err = `${file.name} exceeds the 20MB limit.`; continue; }
    bs.attachments.push({ id: `${Date.now()}-${Math.random().toString(36).slice(2)}`, file });
  }
  renderBsView();
  if (err) setErr("bsAttachError", err);
}

/** The chip strip, built into whatever box it is given.
 *
 *  Takes its container rather than looking one up by id: renderBsView rebuilds
 *  the whole panel, so the element this writes into is younger than any
 *  reference captured before the render. */
function renderBsChipsInto(box) {
  const bs = S.bs;
  box.textContent = "";
  for (const a of bs.attachments || []) {
    const c = el("div", "chipfile");
    if (a.file.type.startsWith("image/")) {
      const img = el("img", "chipfile-thumb");
      img.src = URL.createObjectURL(a.file);
      img.alt = "";
      img.onload = () => URL.revokeObjectURL(img.src);
      c.append(img);
    } else {
      c.append(el("span", "chipfile-icon", "\u25a4"));
    }
    const info = el("span", "chipfile-info");
    info.append(el("span", "chipfile-name", a.file.name),
                el("span", "chipfile-size", fmtBytes(a.file.size)));
    const x = el("button", "chipfile-x", "\u2715");
    x.type = "button";
    x.title = "Remove";
    x.onclick = () => {
      bs.attachments = (bs.attachments || []).filter((f) => f.id !== a.id);
      renderBsView();
    };
    c.append(info, x);
    box.append(c);
  }
}

function addFiles(incoming) {
  const list = Array.from(incoming);
  if (!list.length) return;
  let err = null;
  for (const file of list) {
    if (S.attachments.length >= MAX_ATTACHMENTS) { err = `Only ${MAX_ATTACHMENTS} attachments per question.`; break; }
    if (file.size > MAX_ATTACHMENT_BYTES) { err = `${file.name} exceeds the 20MB limit.`; continue; }
    S.attachments.push({ id: `${Date.now()}-${Math.random().toString(36).slice(2)}`, file });
  }
  setErr("attachError", err);
  renderChips();
}

function setErr(id, msg) {
  const n = $(id);
  n.textContent = msg || "";
  show(n, !!msg);
}

function renderChips() {
  const box = $("qbarChips");
  box.textContent = "";
  show(box, S.attachments.length > 0);
  for (const a of S.attachments) {
    const c = el("div", "chipfile");
    if (a.file.type.startsWith("image/")) {
      const img = el("img", "chipfile-thumb");
      img.src = URL.createObjectURL(a.file);
      img.alt = "";
      img.onload = () => URL.revokeObjectURL(img.src);
      c.append(img);
    } else {
      c.append(el("span", "chipfile-icon", "▤"));
    }
    const info = el("span", "chipfile-info");
    info.append(el("span", "chipfile-name", a.file.name), el("span", "chipfile-size", fmtBytes(a.file.size)));
    const x = el("button", "chipfile-x", "✕");
    x.type = "button";
    x.setAttribute("aria-label", `Remove ${a.file.name}`);
    x.disabled = S.running;
    x.onclick = () => { S.attachments = S.attachments.filter((v) => v.id !== a.id); renderChips(); };
    c.append(info, x);
    box.append(c);
  }
  autosize();
}

/** Rewrite the composer's text into a sharper prompt via one model.
 *
 *  Deliberately NOT a step inside start(): refining on the way to Convene
 *  would send the council a question the person never read, and a rewrite that
 *  drifted from their intent would be discovered only in the verdict. Here it
 *  lands in the textarea first, where it can be read, edited or undone before
 *  anyone is asked anything. */
async function refine() {
  const q = $("composer").value.trim();
  if (!q || S.refining || S.running || !online()) return;
  S.refining = true;
  setErr("refineError", null);
  updateEnabled();
  try {
    const form = new FormData();
    form.append("question", q);
    // Refine drives a model too, quietly and with no History row to show for
    // it -- so it gets the same tick boxes as everything else.
    form.append("providers", [...S.selected].join(","));
    const res = await fetch(`${link.api}/api/refine`, authed({ method: "POST", body: form }));
    if (!res.ok) {
      const body = await res.json().catch(() => null);
      throw new Error(body?.detail || `Refine failed (${res.status})`);
    }
    const { refined } = await res.json();
    // Keep the original for Undo, but only the text the person actually wrote
    // — refining twice must not make the first rewrite the thing Undo restores.
    if (S.preRefine === null) S.preRefine = q;
    setQuestion(refined);
    $("composer").focus();
  } catch (e) {
    setErr("refineError", e?.message || "Refine failed.");
  } finally {
    S.refining = false;
    updateEnabled();
  }
}

function undoRefine() {
  if (S.preRefine === null) return;
  setQuestion(S.preRefine);
  S.preRefine = null;
  setErr("refineError", null);
  $("composer").focus();
  updateEnabled();
}

/* ══ enable/disable ════════════════════════════════════════════════════════
   One function owning every disabled state. Split across handlers, the button
   that must not be clickable during a run is exactly the one that gets
   forgotten. */
/** Is the engine mid-something that this page is the only witness to?
 *
 *  A brainstorm round is already driving these profiles; starting a council
 *  run on top of one would have two Chrome contexts fighting for the same
 *  profile lock. Derived rather than tracked separately, so the two can never
 *  disagree about whether the machine is busy. Pull-to-refresh reads it too,
 *  because a reload mid-run drops the SSE stream. */
function engineBusy() {
  const studio = S.studio && S.studio.artifacts &&
    Object.values(S.studio.artifacts).some(
      (a) => a && (a.status === "running" || a.status === "pending"));
  return !!(S.running || S.refining || (S.bs && S.bs.busy) || studio);
}

/** Is the council showing nothing yet?
 *
 *  Deliberately derived rather than tracked: a flag would have to be cleared
 *  by the run, by opening a past run, by New deliberation, by a brainstorm
 *  and by Studio, and the one that gets forgotten leaves the composer
 *  floating in the middle of a page full of answers. */
function syncCouncilIdle() {
  // Brainstorm's start screen is the same situation as the council's: a
  // composer with nothing under it yet.
  const bsIdle = S.view === "brainstorm" && S.bs && !S.bs.sessionId && !S.bs.busy;
  // Another screen's grid does not make this one busy: a brainstorm round
  // left on screen used to un-centre the council's composer even though the
  // council had nothing to show.
  const ownGrid = S.gridOwner === "council" && (S.panels.length > 0 || !!S.verdict);
  const idle = bsIdle || (
    S.view === "council" &&
    !S.running &&
    !ownGrid &&
    !(S.studio && S.studio.active));
  document.getElementById("shell").classList.toggle("council-idle", idle);
  // The council's heading: only on the council, and only while it is empty.
  const hd = document.getElementById("councilHd");
  if (hd) hd.hidden = !(idle && S.view === "council");
  // Its description keeps the heading company -- the two are one thought,
  // split around the composer and the units they describe.
  const note = document.getElementById("councilNote");
  if (note) note.hidden = !(idle && S.view === "council");
}

function updateEnabled() {
  const q = $("composer").value.trim();
  const busy = S.running || S.refining || (S.bs && S.bs.busy);
  const up = online();
  $("btnSend").disabled = busy || !q || S.selected.size === 0 || !up;
  $("btnSend").textContent = S.running ? "Deliberating…" : "Convene";
  $("btnRefine").disabled = busy || !q || !up;
  // Queueing needs a prompt and units, but NOT a reachable engine: building
  // the list up on a phone while the PC is asleep is half the point of it.
  $("btnQueue").disabled = !q || S.selected.size === 0;
  $("btnRefine").className = `qbar-refine ${S.refining ? "busy" : ""}`;
  const rico = $("btnRefine").querySelector(".qbar-refine-ico");
  // The same stroked arc the doctor spins. The old glyph was a dotted circle
  // whose ink is not centred in its em box, so it orbited rather than spun.
  if (S.refining) rico.innerHTML = SPINNER;
  else rico.textContent = "✦";
  $("btnRefine").querySelector(".qbar-refine-txt").textContent = S.refining ? "Refining…" : "Refine";
  // Typing is never blocked by a run in flight. The queue exists so the next
  // prompts can be written WHILE the council works -- disabling the box made
  // the one screen where you would queue something the one screen where you
  // could not. Only the actions that need the engine right now are held:
  // Convene (one run at a time) and Refine (it drives a unit).
  $("btnAttach").disabled = S.refining
    || S.attachments.length >= MAX_ATTACHMENTS;
  $("composer").disabled = S.refining;
  // Only offered while the rewrite is still untouched — see the composer's
  // input handler.
  show($("btnUndo"), S.preRefine !== null && !S.refining);
  $("btnUndo").disabled = S.refining;
  $("navNew").disabled = busy;
  show($("navHalt"), S.running);
  // It stays VISIBLE while halting, and says so. Hiding it would answer "did
  // that work?" with the control disappearing, which is the same silence in a
  // different shape.
  $("navHalt").disabled = S.halting;
  const haltLbl = $("navHalt").querySelector(".side-label");
  if (haltLbl) haltLbl.textContent = S.halting ? "Halting\u2026" : "Halt run";
  for (const b of document.querySelectorAll("#unitChips .chip")) {
    b.disabled = S.refining;
  }
  if (typeof syncBsStartBar === "function") syncBsStartBar();
  syncCouncilIdle();
}

/* ══ the run ═══════════════════════════════════════════════════════════════ */
/** Convene with what is in the composer. */
async function start() {
  const q = $("composer").value.trim();
  if (!q || S.running || S.selected.size === 0 || !online()) return;
  const files = S.attachments.map((a) => a.file);
  S.attachments = [];
  renderChips();
  await runOne({ question: q, units: [...S.selected], files });
}

/* One deliberation, start to finish.
 *
 *  Extracted from start() so the queue can run an item without pretending to
 *  be a person typing: the prompt, the units, the model and the files are all
 *  arguments now. start() passes exactly what it used to read from the
 *  composer, so the single-run path behaves as it always did.
 *
 *  The promise settles when the run is OVER -- verdict, error, or a dropped
 *  stream -- which is what lets the queue await one item before starting the
 *  next. Nothing else in the console awaited a run before, so this is the
 *  only reason it returns anything at all.
 */
/* Attach to a run that is ALREADY going, instead of starting one.
 *
 *  The engine replays state to a reconnecting client -- an `init` frame with
 *  every unit as it stands, and the whole verdict if it has already landed --
 *  so this needs no history of its own. It is what makes a refresh survivable:
 *  the deliberation carries on in the engine either way, and without this the
 *  console simply stopped showing it.
 */
function watchRun(runId, question) {
  if (!runId || !online()) return Promise.resolve(null);
  return runOne({ question, units: [], files: [], attachTo: runId });
}

function runOne({ question, units, files = [], attachTo = null }) {
  const ids = (units && units.length ? units : [...S.selected]).filter(
    (id) => S.providers.some((p) => p.id === id));
  // Attaching brings its own units with it, in the stream's first frame.
  if ((!question && !attachTo) || (!ids.length && !attachTo) || !online()) {
    return Promise.resolve(null);
  }

  S.verdict = null;
  S.running = true;
  S.fromHistory = false;
  S.gridOwner = "council";
  S.runLocal = true;
  S.viewQuestion = question || "";
  // A run in progress is the thing to watch, so any drawer the user was
  // reading gives way to the console.
  setView("council");
  S.settled = new Set();
  // Built from the units THIS run was given, not from S.selected: a queue
  // item carries its own selection, and overwriting the ticked set would
  // rewrite a per-device preference every time the queue moved on.
  S.panels = S.providers.filter((p) => ids.includes(p.id)).map((p) => ({
    id: p.id, display_name: p.display_name, accent: p.accent,
    state: "queued", text: "", chars: 0,
  }));
  S.opened = new Set();
  // The array this run owns. Everything below resolves providers through it
  // rather than through S.panels, which the user may replace at any moment by
  // opening something from History or from the queue.
  const livePanels = S.panels;
  S.live = { panels: livePanels, runId: null, verdict: null, question };
  const showingLive = () => S.panels === livePanels;
  const liveById = (id) => livePanels.find((p) => p.id === id);
  renderGrid();
  renderVerdict();
  renderRunNow();
  updateEnabled();
  startProcessingTone();

  return new Promise((settle) => {
  let done = false;
  const finish = (outcome) => { if (!done) { done = true; settle(outcome); } };

  (async () => {
  let runId = attachTo;
  if (!runId) {
    const form = new FormData();
    form.append("question", question);
    form.append("providers", ids.join(","));
    for (const f of files) form.append("files", f, f.name);
    try {
      const res = await fetch(`${link.api}/api/runs`,
                              authed({ method: "POST", body: form }));
      const d = await res.json();
      runId = d.run_id;
    } catch {
      endRun();
      setErr("refineError", "Could not reach the engine to start the run.");
      finish({ ok: false, error: "unreachable" });
      return;
    }
  }
  S.runId = showingLive() ? runId : S.runId;
  S.live.runId = runId;
  // The queue row learns the id AS THE RUN STARTS, not when it ends, so a
  // refresh mid-prompt can find its way back to the run still going.
  if (typeof onRunStart === "function") onRunStart(runId);

  const es = new EventSource(streamUrl(`/api/runs/${runId}/stream`));
  S.es = es;
  es.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === "init") {
      // Only when attaching: a run started here already has its panels, and
      // rebuilding them would throw away text already on screen.
      if (!attachTo || !msg.providers) return;
      livePanels.length = 0;
      for (const p of msg.providers) {
        livePanels.push({
          id: p.id, display_name: p.display_name,
          accent: p.accent || (S.providers.find((x) => x.id === p.id) || {}).accent
                  || "var(--ac)",
          state: p.state, text: p.text || "", chars: p.chars || 0,
        });
      }
      if (showingLive()) { renderGrid(); requestAnimationFrame(drawLinks); }
    } else if (msg.type === "state") {
      const p = liveById(msg.provider_id);
      if (!p) return;
      p.state = msg.state;
      p.text = msg.text || p.text;
      p.chars = msg.chars || p.chars;
      // Drawn only while this run is the one on screen. The state is kept
      // either way, so coming back to it shows everything that happened
      // while you were reading something else.
      if (showingLive()) { updateNode(p); updateCore(); drawLinks(); }
    } else if (msg.type === "done") {
      for (const a of msg.answers) {
        const p = liveById(a.provider_id);
        if (!p) continue;
        // A degraded answer is ok === false, so it must be checked before the
        // failed branch or it renders as offline.
        Object.assign(p, {
          state: a.ok ? "done" : a.degraded ? "degraded" : "failed",
          text: a.text, ok: a.ok, failure: a.failure,
          failure_cause: a.failure_cause, failure_remedy: a.failure_remedy,
          error_detail: a.error_detail, degraded: a.degraded,
          degraded_reason: a.degraded_reason, low_confidence: a.low_confidence,
          latency_ms: a.latency_ms, completion_reason: a.completion_reason,
          chars: a.chars,
        });
        if (showingLive()) updateNode(p);
      }
      S.live.verdict = msg;
      if (showingLive()) S.verdict = msg;
      endRun();
      renderVerdict();
      loadHistory();
      // A verdict is what Studio derives from, so its rows unlock here.
      renderStudioNav();
      // ONE write, here, at the end -- never from a progress frame.
      cloudPushRun(runId);
      // Slightly after the processing loop stops, so the two don't overlap.
      if (!S.muted) setTimeout(msg.synthesis_ok ? beepResolved : beepBlocked, 180);
      finish({
        ok: !!msg.synthesis_ok, runId, responded: msg.responded,
        total: msg.total, answers: msg.answers || [],
      });
    } else if (msg.type === "error") {
      endRun();
      finish({ ok: false, error: msg.message || "the run failed" });
    }
    ackSettled();
  };
  es.onerror = () => {
    endRun();
    // A dropped stream is not a verdict. Settling here rather than hanging is
    // what stops one lost connection from stalling a queue for ever. When
    // ATTACHING this is also how "the engine no longer knows that run"
    // arrives -- it restarted, or the run finished long ago -- and the row
    // says so rather than sitting on "running" for ever.
    finish({
      ok: false,
      error: attachTo ? "the engine is no longer streaming that run"
                      : "the run stream dropped",
    });
  };
  })();
  });
}

/** The prompt currently on the wire, named above the units answering it. */
function renderRunNow() {
  const n = $("runNow");
  if (!n) return;
  const live = S.live;
  const on = !!(S.running && live && live.question);
  show(n, on);
  if (!on) return;

  n.textContent = "";
  const showing = S.panels === live.panels;
  n.classList.toggle("elsewhere", !showing);

  const tag = el("span", "run-now-tag");
  tag.append(el("span", "run-now-dot"),
             document.createTextNode(showing ? "running" : "still running"));
  n.append(tag, el("span", "run-now-q", live.question));

  // When you are reading something else, this is also the way back -- the
  // banner is already the thing on screen that says a run is in flight.
  if (!showing) {
    const b = el("button", "run-now-show", "Show");
    b.type = "button";
    b.title = "Put the running prompt back on screen";
    b.onclick = backToLive;
    n.append(b);
  }
}

function endRun() {
  S.running = false;
  S.halting = false;
  renderRunNow();
  clearTimeout(haltFallback);
  if (S.es) { S.es.close(); S.es = null; }
  stopProcessingTone();
  updateCore();
  drawLinks();
  updateEnabled();
  // A handoff that arrived mid-run has been waiting for exactly this.
  handoffTry();
}

/* ══ handoff — a question sent here by another A1 program ══════════════
   TradeHub's Analysis tab no longer opens a chat site and types into it. It
   opens THIS page with the prompt and the units it wants:

       magi.html#tb=<base64url of {v,src,q,units,run,t}>

   A FRAGMENT, deliberately, and it is the whole channel:
     · a fragment is never sent to a server, so a long trading prompt cannot
       overflow a request line the way ?q= did (that is the HTTP 431 TradeHub
       hit and the reason it fell back to the clipboard);
     · nothing is written to a worker, to KV or to Firestore to carry it, so
       handing a prompt over costs zero reads and zero writes;
     · it works cross-origin, so the same link opens MAGI whether this page is
       on GitHub Pages or being served by the engine itself.

   It is consumed ONCE. The hash is stripped before anything acts on it, so a
   reload cannot fire a second council run against four paid accounts — which
   is also why `t` is in the payload: two identical prompts must still be two
   distinct urls, or re-sending the same one to an open tab would change
   nothing and look broken. */
let HANDOFF = null;

function b64uDecode(str) {
  const p = String(str).replace(/-/g, "+").replace(/_/g, "/");
  const bin = atob(p + "=".repeat((4 - (p.length % 4)) % 4));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

/** Read #tb= if it is there, and strip it either way. Never throws: a mangled
 *  link must leave the console usable, not blank. */
function takeHandoff() {
  let raw = "";
  try {
    const m = /[#&]tb=([^&]+)/.exec(location.hash || "");
    if (!m) return null;
    raw = m[1];
  } catch { return null; }
  // Off the address bar BEFORE the payload is read, so no path through the
  // parse below can leave behind a link that fires again on the next reload.
  // Its own try, because a browser that refuses replaceState (file://) must
  // not also cost us the prompt.
  try {
    history.replaceState(history.state, "", location.pathname + location.search);
  } catch {}
  try {
    const h = JSON.parse(b64uDecode(decodeURIComponent(raw)));
    const q = String((h && h.q) || "").trim();
    if (!q) return null;
    return {
      q,
      units: Array.isArray(h.units) ? h.units.map(String).slice(0, 12) : [],
      run: !!h.run,
      src: String((h && h.src) || "").slice(0, 24),
    };
  } catch { return null; }
}

/** Everything a handoff needs is asynchronous — the units come from the
 *  engine, and the lock paints over the console before either. So this is
 *  called from every point where one of those arrives (boot, unlock, the end
 *  of a run) and applies the handoff on whichever call finds the console
 *  ready. It is a no-op on all the others. */
function handoffTry() {
  if (!HANDOFF) return;
  // The lock has not decided yet. It is a network answer and can land after
  // the engine has already listed its units, so "the lock screen is not up"
  // is not the same question as "this page is unlocked".
  if (!LOCK.booted) return;
  const scr = $("lockScreen");
  if (scr && !scr.hidden) return;                    // still behind the lock
  if (S.running || S.refining) return;               // busy; endRun() comes back
  // Wait for the unit list, but only while there is an engine to get it from:
  // offline, the prompt still belongs in the box.
  if (online() && !S.providers.length) return;
  const h = HANDOFF;
  HANDOFF = null;
  applyHandoff(h);
}

function applyHandoff(h) {
  const box = $("composer");
  if (box) { box.value = h.q; autosize(); }
  // The text is new, so there is nothing to restore.
  S.preRefine = null;
  // Tick exactly what was sent, minus anything this engine does not have. If
  // that leaves nothing (a link naming units none of which are configured),
  // keep the selection already made here rather than convening with none.
  if (h.units.length && S.providers.length) {
    const have = new Set(S.providers.map((p) => p.id));
    const want = h.units.filter((id) => have.has(id));
    if (want.length) {
      S.selected = new Set(want);
      saveUnitPicks();
      renderUnitChips();
    }
  }
  setView("council");
  updateEnabled();
  if (!h.run) return;
  if (!online()) {
    setErr("refineError", "Engine offline — the prompt is in the box. Press Convene once it is reachable.");
    return;
  }
  start();
}

// The tab is already open and TradeHub sent another one. A hash-only change
// does not reload the page, so this is the only thing that hears it.
window.addEventListener("hashchange", () => {
  const h = takeHandoff();
  if (!h) return;
  if (adoptHandoffProfile(h)) return;   // reloading into the right profile
  HANDOFF = h;
  handoffTry();
});

/** A handoff that landed in the wrong profile: carry it across the reload.
 *
 *  This is the tab-already-open case. TradeHub navigates the existing MAGI
 *  tab rather than opening a second one, so if that tab was showing Veda the
 *  prompt arrives in her console. The fragment is already stripped by the
 *  time we get here -- takeHandoff does that first, deliberately -- so the
 *  payload goes into sessionStorage and is picked up on the way back up.
 *
 *  Returns true when a reload is happening and the caller should stop. */
function adoptHandoffProfile(h) {
  if (!h || PROFILE.id === HANDOFF_PROFILE) return false;
  try {
    sessionStorage.setItem(HANDOFF_SS, JSON.stringify(h));
    sessionStorage.setItem(PICK_SS, HANDOFF_PROFILE);
    localStorage.setItem(LAST_PROFILE_LS, HANDOFF_PROFILE);
  } catch { return false; }   // no storage: better here than nowhere
  location.reload();
  return true;
}

/** A handoff stashed by the reload above. Consumed once, like the url one. */
function takeStashedHandoff() {
  try {
    const raw = sessionStorage.getItem(HANDOFF_SS);
    if (!raw) return null;
    sessionStorage.removeItem(HANDOFF_SS);
    const h = JSON.parse(raw);
    return h && h.q ? h : null;
  } catch { return null; }
}

// Read at load, before anything else can touch the address bar. The stash
// is checked first: if one is waiting, this load IS the reload that carried
// it, and there is no fragment left to read.
HANDOFF = takeStashedHandoff() || takeHandoff();

/** The deliberation beep: a steady cluster every 1.6s for as long as the
 *  council is working. Fires immediately on start rather than after the first
