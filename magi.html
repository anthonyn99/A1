  // buttons would leave a handler behind that fires on a detached element.
  const obs = new MutationObserver(() => {
    if (!sheet.isConnected) {
      document.removeEventListener("keydown", onKey);
      obs.disconnect();
    }
  });
  obs.observe(document.body, { childList: true });
}

/** Ask for a name in MAGI's own UI. No browser dialogs anywhere here. */
function openNickSheet(r) {
  const sheet = el("div", "sheet");
  const box = el("div", "sheet-box");
  box.append(el("div", "sheet-hd", nickOf(r) ? "Rename" : "Give it a name"));
  box.append(el("div", "sheet-sub",
    "Shown in History instead of the prompt. The prompt itself is unchanged " +
    "— it is the question that was asked, and the verdict answers it."));

  box.append(el("div", "sheet-lbl", "Name"));
  const input = el("input", "sheet-in");
  input.type = "text";
  input.value = nickOf(r);
  input.placeholder = String(r.question || "").slice(0, 60);
  input.maxLength = 120;
  box.append(input);
  box.append(el("div", "sheet-note", "Follows you to your other devices."));

  const bar = el("div", "sheet-bar");
  const save = el("button", "btn active", "Save");
  const clear = el("button", "btn", "Remove name");
  const close = el("button", "btn", "Cancel");
  bar.append(save);
  if (nickOf(r)) bar.append(clear);
  bar.append(el("span", "qbar-spacer"), close);
  box.append(bar);

  const done = () => sheet.remove();
  close.onclick = done;
  dismissOnBackdrop(sheet, done);
  save.onclick = () => { setNick(r.id, input.value); done(); };
  clear.onclick = () => { setNick(r.id, ""); done(); };
  input.onkeydown = (e) => { if (e.key === "Enter") save.click(); };

  sheet.append(box);
  document.body.append(sheet);
  input.focus();
  input.select();
}

/* ── deleting one ──────────────────────────────────────────────────────────
   Both copies, and the CLOUD one first.

   The cloud row is the copy that comes back: left behind after the engine has
   forgotten the run it is a History entry that opens to nothing, and worse,
   backfill would see a local run missing from the cloud and cheerfully
   re-upload it. Doing the cloud first means the worst an interruption can
   leave is an engine copy with no cloud row -- which is the state every
   never-synced run is already in, and is harmless. */
async function deleteRun(r) {
  const name = String(titleOf(r) || "");
  const shown = name.length > 90 ? name.slice(0, 90) + "…" : name;
  const ok = await uiConfirmMagi(
    "Delete this deliberation?",
    "“" + shown + "”\n\n" +
    "Every member's answer and the verdict go with it, on this device and on " +
    "your others. This cannot be undone.",
    "Delete");
  if (!ok) return;

  setSync("saving");
  let failed = null;
  if (await cloudInit()) {
    try {
      await CLOUD.fs.deleteDoc(_runDoc(r.id));
      CLOUD.index = CLOUD.index.filter((x) => x.id !== r.id);
      await CLOUD.fs.setDoc(_indexDoc(), {
        runs: CLOUD.index, updated: CLOUD.fs.serverTimestamp(),
      }, { merge: true });
    } catch (e) { failed = _syncFail("deleting a deliberation from the cloud", e); }
  }

  if (!r.cloudOnly && online()) {
    try {
      const res = await fetch(`${link.api}/api/runs/${r.id}`,
                              authed({ method: "DELETE" }));
      if (!res.ok) {
        const d = await res.json().catch(() => null);
        failed = _syncFail("deleting a deliberation from the engine",
                           new Error((d && d.detail) || ("HTTP " + res.status)));
      }
    } catch (e) { failed = _syncFail("deleting a deliberation from the engine", e); }
  }

  delete NICKS[r.id];
  delete UNPINNED_AT[r.id];
  PINS.delete(r.id);
  saveNicks();
  savePins();
  cloudSaveMarks();
  S.history = S.history.filter((x) => x.id !== r.id);
  // The run that was open has just been deleted -- leaving it on screen
  // invites a Studio card generated from something that no longer exists.
  // But newRun() also switches to the council, and being thrown onto a blank
  // composer after tidying up History is not what tidying up means: you were
  // in a list, you are still in a list.
  if (S.runId === r.id) { newRun(); setView("history"); }
  mergeHistory();
  if (failed) setSync("error", failed); else setSync("saved");
}

/* Pins and names, written as their OWN fields on the index document.
 *
 *  They used to ride on the run's index ROW, which meant a mark only synced
 *  if that run had reached the cloud at all -- pin something that had never
 *  been pushed (made while sync was off, or past the point the index is
 *  capped) and the pin lived and died on one device. Two small maps instead,
 *  so a mark travels whether or not the body ever did.
 *
 *  400ms, not the index's 1500. That longer debounce exists to batch a run's
 *  Studio cards, which arrive in bursts; a pin is one deliberate press, and a
 *  tab closed in the meantime should not lose it.
 */
let _marksT = 0;
/* True from the moment a mark changes here until that change is safely in
 * Firestore. The listener will not apply an incoming copy of these fields
 * while it is set.
 *
 *  Without it, every edit undid itself. A tap changes PINS and schedules the
 *  write; before the write lands, any OTHER snapshot -- a finished run
 *  elsewhere, this page's own index write, a token rotation -- arrives
 *  carrying the document as it was BEFORE the tap, and the listener dutifully
 *  restored it. The pin lit up and went out again, which is exactly what
 *  "pinning does nothing" looks like.
 *
 *  It is only cleared on a SUCCESSFUL write: if the write failed, this
 *  browser holds the newer truth and must not be overwritten by the older
 *  document it failed to replace.
 */
let _marksDirty = false;
function cloudSaveMarks() {
  if (!CLOUD.enabled) return;
  _marksDirty = true;
  clearTimeout(_marksT);
  setSync("saving");
  _marksT = setTimeout(async () => {
    if (!(await cloudInit())) { setSync("off"); return; }
    try {
      // mergeFields, NOT merge:true.
      //
      //   merge:true merges a map field key by key, so a key removed here was
      //   never removed there: "Remove name" deleted NICKS[id], wrote the map
      //   without it, and Firestore kept the old key -- which the next
      //   snapshot handed straight back. The name returned every time, and no
      //   amount of trying again could shift it.
      //
      //   mergeFields names the fields to REPLACE outright, leaving runs and
      //   token alone. A key absent from the map is then genuinely gone.
      await CLOUD.fs.setDoc(_indexDoc(), {
        pins: [...PINS], nicks: NICKS, unpinnedAt: UNPINNED_AT,
      }, { mergeFields: ["pins", "nicks", "unpinnedAt"] });
      _marksDirty = false;
      setSync("saved");
    } catch (e) {
      setSync("error", _syncFail("saving your pins and names", e));
    }
  }, 400);
}

/* A pin is a change to PINS and to nothing else.
 *
 *  It used to ALSO rewrite the run's index row and push the whole index back
 *  up on a 1500ms debounce. Two writers for one fact, on two different
 *  clocks: the marks write landed first and the index write followed with a
 *  copy of the row it had read before the tap, so the pin arrived and was
 *  then contradicted by the slower write. Now there is one writer.
 */
async function togglePin(id) {
  const on = !PINS.has(id);
  if (on) PINS.add(id); else PINS.delete(id);
  // Pinned: not counting, so the mark is dropped. Unpinned: counting from
  // this instant.
  if (on) delete UNPINNED_AT[id];
  else UNPINNED_AT[id] = new Date().toISOString();
  savePins();
  cloudSaveMarks();
  mergeHistory();        // redraws the list, the pin, and the retention filter
}

function mergeHistory() {
  const seen = new Set(S.history.map((r) => r.id));
  const extra = CLOUD.index
    .filter((r) => !seen.has(r.id))
    .map((r) => ({ ...r, cloudOnly: true }));
  S.historyMerged = [...S.history, ...extra]
    .filter((r) => !expired(r))
    // Pinned first: they are the ones kept on purpose, and burying them under
    // this week's questions would defeat pinning them.
    .sort((a, b) =>
      (isPinned(b) - isPinned(a)) ||
      String(b.created_at).localeCompare(String(a.created_at)));
  const tag = $("navHistoryTag");
  tag.textContent = S.historyMerged.length ? String(S.historyMerged.length) : "";
  show(tag, S.historyMerged.length > 0);
  renderHistory();
}

/** One listener, on one document. Other devices' runs arrive here. */
async function cloudWatch() {
  if (!(await cloudInit())) return;
  if (CLOUD.unsub) return;
  try {
    CLOUD.unsub = CLOUD.fs.onSnapshot(_indexDoc(), (snap) => {
      const d = snap.data();
      const before = CLOUD.index.length;
      CLOUD.index = (d && Array.isArray(d.runs)) ? d.runs : [];
      mergeHistory();
      // The first snapshot is the first moment there is anything to prune, and
      // cloudPrune is a no-op on every snapshot after it.
      cloudPrune();
      // A rotated token reaches an already-open page here, and only retries
      // the connection if this page is currently stranded without one.
      // A reorder on another device lands here. Ignored mid-drag, so a
      // snapshot cannot yank a chip out from under the finger holding it.
      const ord = d && Array.isArray(d.unitOrder) ? d.unitOrder : null;
      if (ord && !DRAG.active && (S.unitOrder || []).join("|") !== ord.join("|")) {
        saveUnitOrder(ord);
        if (typeof renderUnitChips === "function" && S.providers.length) renderUnitChips();
      }

      // An engine registered on another device arrives here, on the listener
      // that was already attached -- no extra read, no second listener.
      if (d && Array.isArray(d.engines) && engMerge(d.engines)) {
        syncEngineBtn();
        // Worth a look right away only if we are currently stranded: the
        // machine that just appeared may be the one that is actually awake.
        if (!online() && PROFILE.unlocked) connect(true).then(() => { if (online()) boot(); });
      }

      /* Marks that predate the maps, dealt with once.
       *
       *  Pins and names used to be stored on each run's index row, and a
       *  stale pinned:true left lying there is precisely what made unpinning
       *  impossible: the maps said no, the row said yes, and the row won.
       *  They are stripped here so nothing can read them again.
       *
       *  A row's mark is only ADOPTED when there is no modern field to trust
       *  -- a document written entirely by the old code. When pins or nicks
       *  exists, that field is the answer, including when it is EMPTY: an
       *  empty pins array is a pin deliberately removed, and folding the old
       *  row flag back in would hand it straight back.
       */
      if (d && !CLOUD.folded) {
        CLOUD.folded = true;
        const legacy = Array.isArray(d.runs) ? d.runs : [];
        let found = false;
        if (!Array.isArray(d.pins)) {
          for (const r of legacy) {
            if (r.pinned && !PINS.has(r.id)) { PINS.add(r.id); found = true; }
          }
        }
        if (!d.nicks) {
          for (const r of legacy) {
            if (r.nick && !NICKS[r.id]) { NICKS[r.id] = String(r.nick); found = true; }
          }
        }
        if (found) {
          savePins(); saveNicks();
          cloudSaveMarks();   // sets _marksDirty, so the block below stands
          mergeHistory();     // aside until the folded set is safely written
        }
        if (legacy.some((r) => "pinned" in r || "nick" in r)) cloudStripRowMarks();
      }

      // Deliberation pins, names and retention clocks. Skipped while an edit
      // made here is still on its way up: that document is the one this
      // browser is in the middle of replacing.
      if (d && !_marksDirty && (Array.isArray(d.pins) || d.nicks || d.unpinnedAt)) {
        let changed = false;
        if (Array.isArray(d.pins)
            && [...PINS].sort().join("|") !== d.pins.slice().sort().join("|")) {
          PINS.clear();
          for (const id of d.pins) PINS.add(id);
          changed = true;
        }
        if (d.nicks && typeof d.nicks === "object"
            && JSON.stringify(d.nicks) !== JSON.stringify(NICKS)) {
          for (const k of Object.keys(NICKS)) delete NICKS[k];
          Object.assign(NICKS, d.nicks);
          saveNicks();
          changed = true;
        }
        if (d.unpinnedAt && typeof d.unpinnedAt === "object"
            && JSON.stringify(d.unpinnedAt) !== JSON.stringify(UNPINNED_AT)) {
          for (const k of Object.keys(UNPINNED_AT)) delete UNPINNED_AT[k];
          Object.assign(UNPINNED_AT, d.unpinnedAt);
          changed = true;
        }
        if (changed) { savePins(); mergeHistory(); }
      }

      /* The queue, and who is draining it.
       *
       *  Same document, same listener, so a prompt queued on the phone is on
       *  the PC with no extra read -- and skipped while an edit made here is
       *  still on its way up, for the reason _marksDirty exists: an older
       *  copy arriving mid-edit would undo what was just typed.
       */
      CLOUD.lease = (d && d.queueLease) || null;
      if (d && !_queueDirty && Array.isArray(d.queue)) {
        if (queueFromCloud(d.queue)) { saveQueueLocal(); renderQueue(); }
      }

      // Session pins and names ride the same document as everything else,
      // and are guarded the same way -- this block used to apply every
      // snapshot unconditionally, which is why a session pin lit up and then
      // went out the moment anything else touched the document.
      if (d && !_bsMarksDirty
          && (Array.isArray(d.bsPins) || d.bsNicks || d.bsUnpinnedAt)) {
        let bsChanged = false;
        if (Array.isArray(d.bsPins)
            && [...BS_PINS].sort().join("|") !== d.bsPins.slice().sort().join("|")) {
          BS_PINS.clear();
          for (const id of d.bsPins) BS_PINS.add(id);
          bsChanged = true;
        }
        if (d.bsNicks && typeof d.bsNicks === "object"
            && JSON.stringify(d.bsNicks) !== JSON.stringify(BS_NICKS)) {
          for (const k of Object.keys(BS_NICKS)) delete BS_NICKS[k];
          Object.assign(BS_NICKS, d.bsNicks);
          bsChanged = true;
        }
        if (d.bsUnpinnedAt && typeof d.bsUnpinnedAt === "object"
            && JSON.stringify(d.bsUnpinnedAt) !== JSON.stringify(BS_UNPINNED_AT)) {
          for (const k of Object.keys(BS_UNPINNED_AT)) delete BS_UNPINNED_AT[k];
          Object.assign(BS_UNPINNED_AT, d.bsUnpinnedAt);
          bsChanged = true;
        }
        if (bsChanged) {
          try {
            localStorage.setItem(BS_PIN_KEY, JSON.stringify([...BS_PINS]));
            localStorage.setItem(BS_NICK_KEY, JSON.stringify(BS_NICKS));
            localStorage.setItem(BS_UNPIN_KEY, JSON.stringify(BS_UNPINNED_AT));
          } catch {}
          if (S.view === "brainstorm") renderBsView();
        }
      }

      const tok = d && d.token ? String(d.token) : "";
      if (tok) {
        CLOUD.tokenSeen = tok;
        if (tok !== link.token) {
          saveToken(tok);
          if (!online() && !sameOrigin) connect().then(boot);
        }
      }
      // Only on an actual change: the first snapshot always fires, and
      // flashing "Synced" on every page load would make the indicator noise.
      if (before && CLOUD.index.length !== before) setSync("saved");
    }, (e) => {
      setSync("error", _syncFail("listening for other devices' runs", e));
      console.warn("[magi] index listen:", e);
    });
  } catch (e) { console.warn("[magi] cloudWatch:", e); }
}

/** Push a finished run: one body write, one index update.
 *
 *  Called exactly once per run, from the SSE `done` handler -- never from a
 *  progress frame. */
async function cloudPushRun(runId, quiet) {
  if (!runId || !online()) return false;
  if (!(await cloudInit())) return false;
  if (!quiet) setSync("saving");
  try {
    // Read the authoritative record back from the engine rather than
    // assembling it from events: the database has every member's full answer
    // and the stored synthesis, which the event stream does not carry.
    const r = await fetch(`${link.api}/api/runs/${runId}`, authed());
    // Bare `return` here meant undefined -- falsy, so the caller counted it as
    // a failed push, but nothing was recorded and nothing said why. The engine
    // not serving a run is a real condition (it restarted, the run was
    // deleted) and it is not a Firestore fault.
    if (!r.ok) throw new Error(`the engine returned ${r.status} for this run`);
    const data = await r.json();
    const run = data.run || {};

    let studio = [];
    try {
      const sr = await fetch(`${link.api}/api/runs/${runId}/studio`, authed());
      if (sr.ok) studio = await sr.json();
    } catch {}

    const { serverTimestamp, setDoc } = CLOUD.fs;
    await setDoc(_runDoc(runId), {
      run, answers: data.answers || [], synthesis: data.synthesis || null,
      studio, device: navigator.platform || "pc", at: serverTimestamp(),
    });

    const row = {
      id: runId,
      question: String(run.question || "").slice(0, 300),
      status: run.status || "complete",
      created_at: run.created_at || new Date().toISOString(),
      total_ms: run.total_ms || 0,
      responded_count: data.answers ? data.answers.filter((a) => a.ok).length : 0,
      attempted_count: (data.answers || []).length,
    };
    await cloudUpsertIndex(row);
    if (!quiet) setSync("saved");
    return true;
  } catch (e) {
    // Sync is a convenience layered on a working local run. It must never
    // turn a successful deliberation into an error the user sees -- so this
    // reports in the status line and nowhere else. Recorded either way: a
    // quiet failure during a batch still has to be explainable afterwards.
    const detail = _syncFail("saving a finished deliberation", e);
    if (quiet) SYNC_ERR.last = detail;
    else setSync("error", detail);
    console.warn("[magi] cloudPushRun:", e);
    return false;
  }
}

/** Index write, debounced and read-modify-write on the cached copy.
 *
 *  Debounced because generating three Studio cards in a row would otherwise
 *  be three index writes for one run's worth of change. */
/** Take the duplicated pin/name fields off the index rows, once.
 *
 *  One write, and then never again: after it no row carries either field, so
 *  the caller's test finds nothing to do on every later load.
 */
async function cloudStripRowMarks() {
  for (const r of CLOUD.index) { delete r.pinned; delete r.nick; }
  try {
    await CLOUD.fs.setDoc(_indexDoc(), { runs: CLOUD.index },
                          { mergeFields: ["runs"] });
  } catch (e) { console.warn("[magi] stripping old row marks:", e); }
}

/* One compact row per run. `pinned` and `nick` are deliberately NOT on it:
 * they are per-person marks, not properties of the deliberation, and keeping
 * a second copy here is what made them impossible to undo. */
function cloudUpsertIndex(row) {
  delete row.pinned; delete row.nick;
  CLOUD.index = [row, ...CLOUD.index.filter((r) => r.id !== row.id)]
    .sort((a, b) => String(b.created_at).localeCompare(String(a.created_at)))
    .slice(0, CLOUD_INDEX_MAX);
  mergeHistory();
  clearTimeout(CLOUD.pending);
  return new Promise((res) => {
    CLOUD.pending = setTimeout(async () => {
      try {
        await CLOUD.fs.setDoc(_indexDoc(), {
          runs: CLOUD.index, updated: CLOUD.fs.serverTimestamp(),
        }, { merge: true });
      } catch (e) {
        setSync("error", _syncFail("writing the history index", e));
        console.warn("[magi] index write:", e);
      }
      res();
    }, 1500);
  });
}

/** Explain a sync that cannot start, rather than leaving it silently off.
 *
 *  Firebase App Check is ENFORCED on this project -- anonymous sign-in itself
 *  returns 401 "App Check token is invalid" without one -- and App Check only
 *  issues tokens on a registered domain. anthonyn99.github.io is registered;
 *  127.0.0.1 is not. So the console served BY the engine can never sign in,
 *  and every run made there stays on this PC.
 *
 *  That is invisible otherwise: runs complete, History fills, and nothing ever
 *  reaches another device. This says so, and offers the one-click fix -- the
 *  hosted page talks to this same engine.
 */
function syncBlockedNote() {
  if (!CLOUD.blocked || !CLOUD.enabled) return;
  setSync("off");
  if (!sameOrigin) return;               // hosted already; a failure there is
                                         // something else and the line says so
  if ($("syncNote")) return;
  try { if (localStorage.getItem("magi.syncnote") === "0") return; } catch {}

  const n = el("div", "offline-note");
  n.id = "syncNote";
  const p = el("div");
  p.innerHTML =
    "<b>Deliberations are staying on this device.</b> Sync needs Firebase App Check, " +
    "which only issues tokens on <code>anthonyn99.github.io</code> — a page served " +
    "from <code>127.0.0.1</code> cannot sign in. Open the hosted console instead: " +
    "it drives this same engine, and everything syncs from there.";
  const open = el("button", null, "Open the hosted console");
  open.onclick = () => window.open("https://anthonyn99.github.io/A1/magi.html", "_blank", "noopener");
  const hide = el("button", null, "Don't show again");
  hide.style.marginLeft = "8px";
  hide.onclick = () => {
    try { localStorage.setItem("magi.syncnote", "0"); } catch {}
    n.remove();
  };
  n.append(p, open, hide);
  $("offlineNote").after(n);
}

/** Push every past deliberation the engine has that the cloud does not.
 *
 *  cloudPushRun only fires as a run FINISHES, so everything deliberated before
 *  sync existed lives solely in the PC's SQLite. This walks that gap once.
 *
 *  Cost is bounded and paid once: one body write per missing run, and ONE
 *  index write for the whole batch -- cloudUpsertIndex is debounced, so twenty
 *  runs still settle into a single index document. Nothing is re-uploaded on
 *  later loads, because the index IS the record of what is already there.
 *
 *  Deliberately serial. Twenty parallel pushes would mean twenty simultaneous
 *  reads from the local engine and twenty Firestore writes in flight, which is
 *  the exact burst pattern this sync design exists to avoid -- and the engine
 *  is a single local process, so nothing is gained by it.
 */
async function cloudBackfill() {
  if (!online()) return { skipped: "engine offline" };
  if (!(await cloudInit())) return { skipped: "cloud unavailable" };

  // Let the index listener deliver at least once first, or every run would
  // look missing and be uploaded again on each reload.
  if (!CLOUD.unsub) await cloudWatch();
  await new Promise((r) => setTimeout(r, 1200));

  let local = [];
  try {
    local = await (await fetch(`${link.api}/api/runs?limit=500`, authed())).json();
  } catch { return { skipped: "could not list local runs" }; }

  const have = new Set(CLOUD.index.map((r) => r.id));
  // Only runs that produced something: a failed one has no verdict to read on
  // another device, so syncing it would just be noise in History.
  // ...and nothing the retention window has already let go. Without this the
  // engine's SQLite -- which keeps everything -- would re-upload every expired
  // run on the next load, and pruning would be a loop rather than a policy.
  const missing = local.filter(
    (r) => !have.has(r.id) && (r.responded_count || 0) > 0 && !expired(r));
  if (!missing.length) return { pushed: 0, alreadyThere: have.size };

  setSync("saving");
  SYNC_ERR.last = null;
  let pushed = 0, failed = 0;
  for (const r of missing) {
    // quiet: the indicator says "Syncing…" once for the batch, not once per run.
    if (await cloudPushRun(r.id, true)) pushed++;
    else failed++;
  }
  // Report on what FAILED, not on what succeeded. `pushed ? saved : error`
  // was wrong in both directions: a batch where nine of ten runs failed
  // reported "Synced", and one where the only missing run had been deleted
  // from the engine reported "Sync failed" with nothing actually broken.
  if (failed) setSync("error", SYNC_ERR.last || _syncFail("saving past deliberations", null));
  else setSync("saved");
  return { pushed, failed, alreadyThere: have.size };
}

/** Drop what the retention window has let go: bodies first, then the index.
 *
 *  Bodies before rows, deliberately. If this is interrupted between the two,
 *  an orphaned body is invisible and costs a few KB; an index row pointing at
 *  a body that is gone is a History entry that opens to nothing. Failing in
 *  the harmless direction is worth the ordering.
 *
 *  Runs once per load and only when something has actually expired, so the
 *  usual cost is zero writes -- see the write budget above. */
async function cloudPrune() {
  if (!CLOUD.enabled || CLOUD.pruned) return { pruned: 0 };
  const doomed = CLOUD.index.filter(expired);
  if (!doomed.length) return { pruned: 0 };
  if (!(await cloudInit())) return { skipped: "cloud unavailable" };
  CLOUD.pruned = true;

  let gone = 0;
  for (const r of doomed) {
    try { await CLOUD.fs.deleteDoc(_runDoc(r.id)); gone++; }
    catch (e) { console.warn("[magi] prune body:", r.id, e); }
  }
  // Only rows whose body we actually removed, so a failed delete leaves the
  // run listed and it is retried on the next load rather than being lost.
  const dead = new Set(doomed.map((r) => r.id));
  CLOUD.index = CLOUD.index.filter((r) => !dead.has(r.id));
  try {
    await CLOUD.fs.setDoc(_indexDoc(), {
      runs: CLOUD.index, updated: CLOUD.fs.serverTimestamp(),
    }, { merge: true });
  } catch (e) { console.warn("[magi] prune index:", e); }
  mergeHistory();
  return { pruned: gone };
}

/** Open a run that exists only in the cloud -- one read, on demand. */
async function cloudOpenRun(id) {
  if (!(await cloudInit())) return false;
  try {
    const snap = await CLOUD.fs.getDoc(_runDoc(id));
    if (!snap.exists()) return false;
    const data = snap.data();
    S.runId = id;
    S.gridOwner = "council";
    S.runLocal = false;       // read from the cloud; this engine never ran it
    S.viewQuestion = (data.run && data.run.question) || "";
    setQuestion((data.run && data.run.question) || "");
    S.opened = new Set();
    S.panels = (data.answers || []).map((a) => ({
      id: a.provider_id, display_name: a.display_name,
      accent: (S.providers.find((p) => p.id === a.provider_id) || {}).accent || "var(--ac)",
      state: a.ok ? "done" : a.degraded ? "degraded" : "failed",
      text: a.answer_text || "", chars: a.char_count || 0, ok: !!a.ok,
      failure: a.failure_kind, error_detail: a.error_detail,
      degraded: !!a.degraded, degraded_reason: a.degraded_reason || "",
      low_confidence: !!a.low_confidence, latency_ms: a.latency_ms,
      completion_reason: a.completion_reason,
    }));
    const syn = data.synthesis;
    S.verdict = syn ? {
      verdict: syn.verdict_text || "", synthesis_ok: !!syn.ok,
      synthesis_error: syn.error_detail, chairman: syn.chairman_provider,
      responded: syn.members_responded, total: syn.members_total,
      total_ms: (data.run && data.run.total_ms) || 0,
      degraded: (data.answers || []).filter((a) => a.degraded).map((a) => ({
        provider_id: a.provider_id, display_name: a.display_name,
        reason: a.degraded_reason || "", chars: a.char_count || 0 })),
    } : null;
    // Studio cards travelled with the body, so a card generated on the PC
    // opens on the phone without regenerating it -- each one costs a real
    // browser run, so re-earning them would be the expensive mistake here.
    resetStudio();
    for (const c of data.studio || []) {
      if (c.kind in S.studio.artifacts) {
        S.studio.artifacts[c.kind] = {
          status: c.status, provider_id: c.provider_id,
          raw_text: c.raw_text, parsed_json: c.parsed_json,
          error_detail: c.error_detail,
        };
      }
    }
    S.fromHistory = true;
    setView("council");
    renderGrid(); renderVerdict(); renderStudioNav();
    return true;
  } catch (e) {
    console.warn("[magi] cloudOpenRun:", e);
    return false;
  }
}

/* ══ APP LOCK ══════════════════════════════════════════════════════════════
   Identical backend to every other A1 program's lock: the PBKDF2 record lives
   in taskhub-reminders' KV as jlock:applock:tony_magi, created and reset
   through the same /auth/journal + /auth/reset endpoints index.html uses, with
   hints and reset codes mailed via the same Formspree form.

   ── How this one differs from Insight's, and why ─────────────────────────
   Insight exchanges a verified password at insight-api for a 1-hour bearer
   token, because there the lock also AUTHORISES something server-side (Plaid).
   MAGI's engine is local and already gated by MAGI_API_TOKEN, so this lock has
   one job: stop someone at your laptop reading the transcripts or spending
   your model quota. There is nothing to mint a token against, so a verified
   device is recorded locally.

   The honest consequence: changing the password does NOT evict devices already
   trusted, the way it does in Insight. Removing the lock does unlock them, and
   "Lock now" revokes this device immediately. If eviction ever matters, the
   fix is a fingerprint returned by /auth/journal/verify -- it returns only
   {ok} today, which is why this is written down rather than assumed. */
const AUTH_API = "https://taskhub-reminders.av1.workers.dev";
/* Per profile, so Tony's password and Veda's are separate records on the same
   worker. Tony's entry id is unchanged from before profiles existed, which is
   why his password and his fingerprint both survive this change untouched --
   `bio_cred_magi_tony` is exactly what Bio.keyOf("magi","tony") already built. */
const LOCK_ID = { journal: "applock", entryId: prof().lock };
const FORM_URL = "https://formspree.io/f/xeedkebo";
const LOCK_EMAIL = "anthonypn99@gmail.com";
const LOCK_LS = lsKey("lock_session");
const LOCKED_LS = lsKey("locked");
const BIO_APP = "magi", BIO_ID = PROFILE.id;

const LOCK = {
  mode: "unlock",      // unlock | setup | reset | change | manage
  session: null,       // { at } once this device is trusted
  hasLock: false,
  bioRemove: false,
  box: null,
  // Has lockBoot finished deciding? Whether this page is locked is a NETWORK
  // answer, and it can land well after the engine has listed its units -- so
  // a handed-over question that only looked at the lock screen could convene a
  // council a moment before the lock painted over it. Measured, not theorised.
  booted: false,
};

const lockGet = () => { try { return JSON.parse(localStorage.getItem(LOCK_LS) || "null"); } catch { return null; } };
const lockPut = (v) => { try { v ? localStorage.setItem(LOCK_LS, JSON.stringify(v)) : localStorage.removeItem(LOCK_LS); } catch {} };
const lockedFlag = () => { try { return localStorage.getItem(LOCKED_LS) === "1"; } catch { return false; } };
const setLockedFlag = (on) => { try { on ? localStorage.setItem(LOCKED_LS, "1") : localStorage.removeItem(LOCKED_LS); } catch {} };
const bioReady = () => !!(window.Bio && Bio.isRegistered(BIO_APP, BIO_ID));

async function authPost(path, body) {
  const r = await fetch(AUTH_API + path, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ ...LOCK_ID, ...body }),
  });
  return r.json();
}

function formspree(subject, message) {
  return fetch(FORM_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json", Accept: "application/json" },
    body: JSON.stringify({ email: LOCK_EMAIL, subject, message }),
  });
}

/* ── the screen ─────────────────────────────────────────────────────────── */
const MARK = "<svg viewBox='0 0 96 96' aria-hidden='true'>"
  + "<g fill='none' stroke='var(--ac)' stroke-width='5'><circle cx='48' cy='37' r='17.5'/><circle cx='34' cy='60' r='17.5'/><circle cx='62' cy='60' r='17.5'/></g><circle cx='48' cy='52' r='6.5' fill='var(--acl)'/>"
  + "</svg>";

function lockMsg(text, ok) {
  const m = $("lockMsg");
  if (!m) return;
  m.textContent = text || "";
  m.className = "lock-msg" + (ok ? " ok" : "");
}

function lockShake() {
  const b = LOCK.box;
  if (!b) return;
  b.classList.remove("shake");
  void b.offsetWidth;
  b.classList.add("shake");
}

/* ── the gate: profile picker and lock, one screen ─────────────────────────
   These used to be two ideas: a picker that shows you the door, and a lock
   that guards it. Keeping them apart means two chances to get the ordering
   wrong, and the ordering IS the security property -- nothing may be fetched
   for a profile until that profile is unlocked (see cloudInit).

   The profile you last used arrives expanded, because it is the one you
   almost always want; the other sits collapsed beside it, one tap away.
   Choosing it reloads the page -- see the PROFILES block for why a switch is
   a reload -- and it comes back up expanded on the other card. */
const GATE = {
  open: null,      // which card is expanded
  picking: false,  // opened from the profile chip: both cards shut, both offered
};

const STAR = "<svg viewBox='0 0 24 24' stroke='currentColor' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><path d='M12 3.6l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.6 9.7l5.8-.8z'/></svg>";

const favProfile = () => {
  try { return localStorage.getItem(FAV_PROFILE_LS) || ""; } catch { return ""; }
};

/** Pin this device to a profile, or unpin it. Toggling off leaves you where
 *  you are; it only changes where the NEXT fresh load lands. */
function toggleFav(id) {
  try {
    if (favProfile() === id) localStorage.removeItem(FAV_PROFILE_LS);
    else localStorage.setItem(FAV_PROFILE_LS, id);
  } catch {}
  renderLock();
  syncProfileBtn();
}

const EYE = "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z'/><circle cx='12' cy='12' r='3'/></svg>";
const EYE_OFF = "<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M9.9 4.2A10.9 10.9 0 0 1 12 4c6.5 0 10 7 10 7a18.5 18.5 0 0 1-3.2 4.2M6.6 6.6A18.5 18.5 0 0 0 2 11s3.5 7 10 7a10.9 10.9 0 0 0 4.2-.8'/><path d='M3 3l18 18'/><path d='M9.9 9.9a3 3 0 0 0 4.2 4.2'/></svg>";

/** A drawn password field: the input, an eye that toggles it, and a caps-lock
 *  hint. Not a bare <input type=password>, because the browser's own reveal
 *  control exists on some platforms and not others, sits somewhere different
 *  in each, and cannot be styled to match anything else on this screen. */
function pwField(id, placeholder, autocomplete) {
  const wrap = el("div", "gate-pw");
  const inp = el("input", "lock-in");
  inp.id = id;
  inp.type = "password";
  inp.placeholder = placeholder;
  inp.autocomplete = autocomplete;
  const eye = el("button", "gate-eye");
  eye.type = "button";
  // Not in the tab order: it is a convenience, and tabbing out of the password
  // field should reach the button that submits it.
  eye.tabIndex = -1;
  const paint = () => {
    eye.innerHTML = inp.type === "password" ? EYE : EYE_OFF;
    eye.title = inp.type === "password" ? "Show password" : "Hide password";
  };
  eye.onclick = () => {
    inp.type = inp.type === "password" ? "text" : "password";
    paint();
    inp.focus();
  };
  paint();
  // Caps Lock is the reason a password "does not work" often enough to be
  // worth saying out loud, and it is invisible on a laptop with no indicator.
  const caps = el("div", "gate-caps", "Caps Lock is on");
  caps.hidden = true;
  const check = (e) => {
    try { caps.hidden = !(e.getModifierState && e.getModifierState("CapsLock")); } catch {}
  };
  inp.addEventListener("keydown", check);
  inp.addEventListener("keyup", check);
  wrap.append(inp, eye, caps);
  return wrap;
}

/** Choosing a profile. The other one is always a reload, which is what makes
 *  the swap total. The one already loaded either expands to ask for its
 *  password, or -- if this session already proved it -- simply closes the
 *  gate, because making you type it twice to look at the picker would teach
 *  you to avoid the picker. */
function selectProfile(id) {
  if (!MAGI_PROFILES[id]) return;
  if (id === PROFILE.id) {
    GATE.picking = false;
    if (PROFILE.unlocked) { hideLock(); return; }
    GATE.open = id;
    renderLock();
    return;
  }
  try {
    localStorage.setItem(LAST_PROFILE_LS, id);
    // Beats the favourite for this tab, so switching actually switches.
    sessionStorage.setItem(PICK_SS, id);
  } catch {}
  location.reload();
}

/** The profile chip: show both people, neither expanded. Escape backs out,
 *  but only when there is something to back out TO -- pressing it on the boot
 *  gate, before anything has been unlocked, must not dismiss the lock. */
function openProfilePicker() {
  GATE.picking = true;
  GATE.open = null;
  renderLock();
}

document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  const scr = $("lockScreen");
  if (!scr || scr.hidden) return;
  if (GATE.picking && PROFILE.unlocked) hideLock();
});

/** Whose MAGI this is, in the sidebar and the mobile top bar. Two controls,
 *  one state -- on a phone the sidebar is a shut drawer, so a chip only in
 *  there would answer "whose history am I reading?" only after you opened it. */
function syncProfileBtn() {
  const p = prof();
  for (const id of ["profBtn", "profBtnM"]) {
    const b = $(id);
    if (!b) continue;
    b.textContent = "";
    b.style.setProperty("--pc", p.color);
    b.append(el("span", "prof-av", p.emoji), el("span", "prof-name", p.label));
    b.title = "Signed in as " + p.label + " — switch profile";
  }
}

function renderLock() {
  let scr = $("lockScreen");
  if (!scr) {
    scr = el("div", "gate");
    scr.id = "lockScreen";
    document.body.append(scr);
  }
  scr.hidden = false;
  scr.textContent = "";
  if (!GATE.open && !GATE.picking) GATE.open = PROFILE.id;

  const wrap = el("div", "gate-wrap");
  const mark = el("div", "gate-mark");
  mark.innerHTML = MARK;
  wrap.append(mark, el("div", "gate-brand", "MAGI"));
  if (GATE.picking) wrap.append(el("div", "gate-lede", "Choose a profile"));

  const cards = el("div", "gate-cards");
  for (const id of PROFILE_ORDER) cards.append(gateCard(id));
  wrap.append(cards);
  scr.append(wrap);

  const p1 = $("lockPw1");
  if (p1) {
    p1.focus();
    p1.onkeydown = (e) => { if (e.key === "Enter") lockSubmit(); };
  }
  if (LOCK.mode === "unlock") renderBioButton();
}

function gateCard(id) {
  const p = MAGI_PROFILES[id];
  const open = GATE.open === id;
  const card = el("div", "gate-card" + (open ? " open" : " shut"));
  card.style.setProperty("--pc", p.color);

  // Just the name. The card used to carry a second line saying "Locked" or
  // "Open Veda’s MAGI", which is either obvious from the password field
  // sitting under it or a claim this page cannot actually check -- the other
  // profile's lock state is a record on the worker under a different key, and
  // probing it at boot would be a network call made to decorate a subtitle.
  const head = el("div", "gate-head");
  head.append(el("div", "gate-av", p.emoji));
  head.append(el("div", "gate-name", p.label));

  // Pin this device to a profile. Stays out of the card's click target, or
  // favouriting would also open the profile you were only bookmarking.
  const fav = el("button", "gate-fav" + (favProfile() === id ? " on" : ""));
  fav.type = "button";
  fav.innerHTML = STAR;
  fav.title = favProfile() === id
    ? "This device opens as " + p.label + " — click to stop"
    : "Always open this device as " + p.label;
  fav.onclick = (e) => { e.stopPropagation(); toggleFav(id); };
  head.append(fav);
  card.append(head);

  if (!open) {
    card.classList.add("tappable");
    card.onclick = () => selectProfile(id);
    card.tabIndex = 0;
    card.onkeydown = (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); selectProfile(id); }
    };
    return card;
  }

  LOCK.box = card;
  const body = el("div", "gate-body");
  lockFormInto(body);
  card.append(body);
  return card;
}

/** Everything the old .lock-box held, minus the identity the card already
 *  shows. Element ids are unchanged, so lockSubmit, lockForgot, bioUnlock and
 *  the rest of the lock keep working exactly as they did. */
function lockFormInto(box) {
  const m = LOCK.mode;

  const blurb = {
    unlock: "",
    setup: "Everything you have asked the council is readable without a password.",
    reset: "Enter the code emailed to you, then choose a new password.",
    change: "Enter your current password, then the new one.",
    manage: "",
  }[m];
  if (blurb) box.append(el("div", "gate-blurb", blurb));

  if (m === "manage") {
    const row = el("div", "lock-row");
    const lockNow = el("button", "btn active", "Lock now");
    lockNow.onclick = lockNowAction;
    const change = el("button", "btn", "Change password");
    change.onclick = () => { LOCK.mode = "change"; renderLock(); };
    row.append(lockNow, change);
    box.append(row);

    const row2 = el("div", "lock-row");
    const rm = el("button", "btn danger", "Remove lock");
    rm.onclick = () => { LOCK.mode = "change"; LOCK.removing = true; renderLock(); };
    row2.append(rm);
    box.append(row2);

    if (window.Bio) {
      const bioRow = el("div", "lock-bio");
      const b = el("button", "btn");
      if (bioReady()) {
        b.textContent = "Remove " + Bio.label() + " from this device";
        b.onclick = () => { Bio.unregister(BIO_APP, BIO_ID); renderLock(); };
      } else {
        b.textContent = "Enable " + Bio.label();
        b.onclick = enrolBio;
      }
      bioRow.append(b);
      box.append(bioRow);
      Bio.available().then((ok) => { if (!ok) bioRow.remove(); });
    }

    const close = el("button", "lock-link", "Back to the council");
    close.onclick = hideLock;
    box.append(close, el("div", "lock-msg", ""));
    box.querySelector(".lock-msg").id = "lockMsg";
    return;
  }

  if (m === "reset") {
    const code = el("input", "lock-in");
    code.id = "lockCode";
    code.placeholder = "6-character code";
    code.autocomplete = "one-time-code";
    box.append(code);
  }

  box.append(pwField("lockPw1",
    m === "change" ? "Current password" : m === "unlock" ? "Password" : "New password",
    m === "unlock" ? "current-password" : "new-password"));

  if (m !== "unlock") {
    box.append(pwField("lockPw2",
      m === "change" ? "New password" : "Confirm password", "new-password"));
    if (m === "change") box.append(pwField("lockPw3", "Confirm new password", "new-password"));
    const hint = el("input", "lock-in");
    hint.id = "lockHintIn";
    hint.placeholder = "Hint (optional, emailed to you)";
    box.append(hint);
  }

  const row = el("div", "lock-row");
  const go = el("button", "btn active",
    m === "unlock" ? "Unlock" : m === "setup" ? "Set password"
      : m === "reset" ? "Set new password" : LOCK.removing ? "Remove lock" : "Change password");
  go.onclick = lockSubmit;
  row.append(go);

  if (m !== "unlock" && m !== "setup") {
    const cancel = el("button", "btn", "Cancel");
    cancel.onclick = () => {
      LOCK.removing = false;
      LOCK.mode = LOCK.session ? "manage" : "unlock";
      renderLock();
    };
    row.append(cancel);
  }
  box.append(row);

  const bio = el("div", "lock-bio");
  bio.id = "lockBio";
  bio.style.display = "none";
  box.append(bio);

  if (m === "unlock") {
    // Short, because the card is narrow now and the long form wrapped to two
    // lines. The title carries what it actually does.
    const forgot = el("button", "lock-link", "Forgot password?");
    forgot.title = "Email me a hint, or a reset code";
    forgot.onclick = lockForgot;
    box.append(forgot);
  }

  const msg = el("div", "lock-msg");
  msg.id = "lockMsg";
  box.append(msg);
}

function renderBioButton() {
  const box = $("lockBio");
  if (!box || !window.Bio || !bioReady()) return;
  Bio.available().then((ok) => {
    if (!ok || LOCK.mode !== "unlock") return;
    // Only offered when there is a trusted session to release: the credential
    // is a local gate, not a replacement for the password that created it.
    if (!LOCK.bioRemove && !lockGet()) return;
    const b = el("button", "btn");
    b.textContent = (LOCK.bioRemove ? "Verify with " : "Unlock with ") + Bio.label();
    b.onclick = bioUnlock;
    box.textContent = "";
    box.append(b);
    box.style.display = "";
  });
}

async function bioUnlock() {
  lockMsg("");
  const r = await Bio.authenticate(BIO_APP, BIO_ID);
  if (!r.ok) {
    if (r.error === "notregistered") { $("lockBio").style.display = "none"; return; }
    lockMsg(r.error === "cancelled" || r.error === "NotAllowedError"
      ? "Cancelled — or use your password." : Bio.label() + " check failed — use your password.");
    return;
  }
  if (!lockGet()) { lockMsg("Enter your password once on this device."); return; }
  LOCK.session = lockGet();
  setLockedFlag(false);
  hideLock();
}

async function enrolBio() {
  const r = await Bio.register(BIO_APP, BIO_ID, "MAGI");
  lockMsg(r && r.ok ? Bio.label() + " enabled on this device." : "Could not enable " + Bio.label() + ".", r && r.ok);
  if (r && r.ok) renderLock();
}

async function lockForgot() {
  lockMsg("Sending…");
  try {
    // The worker composes both messages now, so MAGI no longer builds the text
    // or reads the code. It sends them itself when it has a provider that can;
    // otherwise it returns a `relay` envelope and _mailRelay posts it FROM THIS
    // BROWSER, because Formspree files worker-sent mail as spam. This block used
    // to key off `h.hint` and `rq.code` being returned — neither is any more, so
    // it had silently stopped emailing anything at all.
    const h = await authPost("/auth/journal/hint", { appName: "MAGI", label: "MAGI" });
    const hintSent = await window._mailRelay(h);
    if (hintSent) lockMsg("Hint emailed.", true);

    const rq = await authPost("/auth/reset/request", { appName: "MAGI", label: "MAGI" });
    if (await window._mailRelay(rq)) {
      LOCK.mode = "reset";
      renderLock();
      lockMsg("Reset code emailed. Enter it below.", true);
    } else if (!hintSent) {
      lockMsg("Could not send anything — is the lock service reachable?");
    }
  } catch {
    lockMsg("Could not reach the lock service.");
  }
}

async function lockSubmit() {
  const m = LOCK.mode;
  const p1 = ($("lockPw1") || {}).value || "";
  lockMsg("");

  if (m === "unlock") {
    if (!p1) return;
    const v = await authPost("/auth/journal/verify", { password: p1 });
    if (v && v.ok) {
      LOCK.session = { at: Date.now() };
      lockPut(LOCK.session);
      setLockedFlag(false);
      hideLock();
      maybeOfferBio();
      return;
    }
    lockShake();
    lockMsg("Wrong password.");
    return;
  }

  const p2 = ($("lockPw2") || {}).value || "";
  const hint = (($("lockHintIn") || {}).value || "").trim();

  if (m === "change") {
    const v = await authPost("/auth/journal/verify", { password: p1 });
    if (!v || !v.ok) { lockShake(); lockMsg("Wrong current password."); return; }
    if (LOCK.removing) {
      const rm = await authPost("/auth/journal/remove-lock", { password: p1 });
      if (rm && rm.ok) {
        LOCK.removing = false; LOCK.hasLock = false;
        lockPut(null); setLockedFlag(false);
        LOCK.session = { at: Date.now() };
        hideLock();
        syncLockBtn();
        return;
      }
      lockMsg("Could not remove the lock.");
      return;
    }
    const p3 = ($("lockPw3") || {}).value || "";
    if (p2.length < 4) { lockMsg("Use at least 4 characters."); return; }
    if (p2 !== p3) { lockMsg("New passwords do not match."); return; }
    // remove-then-set, the same two-step the rest of the suite uses.
    await authPost("/auth/journal/remove-lock", { password: p1 });
    const st = await authPost("/auth/journal/set-lock", { password: p2, hint });
    if (st && st.ok) { lockMsg("Password changed.", true); LOCK.mode = "manage"; setTimeout(renderLock, 700); }
    else lockMsg("Could not change the password.");
    return;
  }

  if (p1.length < 4) { lockMsg("Use at least 4 characters."); return; }
  if (p1 !== p2) { lockMsg("Passwords do not match."); return; }

  if (m === "setup") {
    const r = await authPost("/auth/journal/set-lock", { password: p1, hint });
    if (r && r.ok) {
      LOCK.hasLock = true;
      LOCK.session = { at: Date.now() };
      lockPut(LOCK.session);
      setLockedFlag(false);
      hideLock(); syncLockBtn(); maybeOfferBio();
      return;
    }
    lockMsg("Could not set the password.");
    return;
  }

  if (m === "reset") {
    const code = (($("lockCode") || {}).value || "").trim();
    if (!code) { lockMsg("Enter the emailed code."); return; }
    const r = await authPost("/auth/reset/confirm", { code, password: p1, hint });
    if (r && r.ok) {
      LOCK.hasLock = true;
      LOCK.session = { at: Date.now() };
      lockPut(LOCK.session);
      setLockedFlag(false);
      hideLock(); syncLockBtn();
      return;
    }
    lockShake();
    lockMsg("That code was not accepted.");
  }
}

function maybeOfferBio() {
  if (!window.Bio || bioReady()) return;
  Bio.available().then(async (ok) => {
    if (!ok) return;
    // Offered, never forced, and only after a password has already proved it
    // is you — the credential releases the session, it does not create it.
    //
    // uiConfirm, not confirm(): a native dialog is chrome the page cannot
    // style, says "anthonyn99.github.io says", and in an installed PWA looks
    // like the browser interrupting rather than the app asking. The suite
    // replaced every one of these for the same reason.
    const yes = await window.uiConfirm(
      "Enable " + Bio.label() + " to unlock MAGI on this device?",
      { title: "Biometric unlock", okLabel: "Enable", cancelLabel: "Not now" });
    if (yes) enrolBio();
  });
}

function lockNowAction() {
  setLockedFlag(true);
  LOCK.session = null;
  LOCK.mode = "unlock";
  // Re-shut the door for the rest of this page's life. openUp() has already
  // run, so the listener and the engine connection stay -- locking now is
  // about the screen in front of you, and a full teardown is what the reload
  // on a profile switch is for.
  PROFILE.unlocked = false;
  GATE.open = PROFILE.id;
  renderLock();
}

function hideLock() {
  const scr = $("lockScreen");
  if (scr) scr.hidden = true;
  // The profile is open. Everything that touches the network for this person
  // -- the engine, Firestore, the token -- was held until this line.
  PROFILE.unlocked = true;
  GATE.open = null;
  GATE.picking = false;
  syncLockBtn();
  syncProfileBtn();
  openUp();
  // A handoff that arrived while MAGI was locked runs now, not silently never.
  if (typeof handoffTry === "function") handoffTry();
}

/* Discovery and sync, started once, the first time a profile is unlocked.
   These used to run beside lockBoot() so an unlock landed on a console that
   was already ready, and that was the right call when the lock was cosmetic.
   It is not any more: connect() carries this profile's API token and
   cloudWatch() attaches a listener to this profile's document, and neither
   may happen for someone who has not proved who they are. The cost is the
   second or so it now takes after an unlock -- and on a trusted device, which
   is the usual case, the unlock itself is instant. */
let _openedUp = false;
function openUp() {
  if (_openedUp) return;
  _openedUp = true;
  connect().then(boot);
  // Starts INDEPENDENTLY of the engine, and that is the whole point of it.
  // Reading past verdicts needs Firestore and nothing else; only MAKING one
  // needs the engine -- so a phone away from the desk still shows History.
  // It also carries the API token, so a phone that has never been told the
  // secret can be handed it here and reconnect on its own.
  cloudWatch();
}

function showLock(mode) {
  LOCK.mode = mode || (LOCK.hasLock ? "unlock" : "setup");
  renderLock();
}

/** The header control: locked-shackle when a lock exists, open when it does
 *  not. Clicking it locks immediately if unlocked, or opens setup if there is
 *  no password yet -- one control, and its icon says which. */
function syncLockBtn() {
  // Two controls, one state: the sidebar's and the mobile top bar's. On a
  // phone the sidebar is off-canvas, so a lock only in the drawer is a lock
  // you cannot reach without first opening the thing it protects.
  for (const id of ["lockBtn", "lockBtnM"]) {
    const b = $(id);
    if (!b) continue;
    // The suite's shared Lucide-style glyph, so a "lock" looks identical here,
    // in Vault, in TradeHub and in TaskHub. innerHTML is safe: SLI is a fixed
    // table of literals in this file, never anything a user typed.
    b.innerHTML = window.SLI ? (LOCK.hasLock ? SLI.lock : SLI.unlock) : "";
    b.classList.toggle("unset", !LOCK.hasLock);
    b.title = LOCK.hasLock ? "Lock MAGI / manage password" : "No password set — click to add one";
  }
}

/** Decide whether this device is trusted, and paint the lock if it is not.
 *  Wrapped by lockBoot so every exit from it -- including the early ones and a
 *  throw -- lands on the same "the lock has decided" point. */
async function lockBootDecide() {
  syncLockBtn();
  const stored = lockGet();
  const wasLocked = lockedFlag();
  try {
    // /status, not /hint: this runs on every load and /hint MAILS the owner.
    const st = await authPost("/auth/journal/status", {});
    LOCK.hasLock = !!(st && st.hasLock);
  } catch {
    // Lock service unreachable. A device that has never been trusted must
    // stay shut -- failing OPEN here would mean a flaky network is a bypass.
    if (!stored || wasLocked) {
      showLock("unlock");
      lockMsg("Lock service unreachable — reload to retry.");
      return;
    }
  }
  syncLockBtn();
  if (!LOCK.hasLock) { LOCK.session = { at: Date.now() }; hideLock(); return; }
  if (stored && !wasLocked) { LOCK.session = stored; hideLock(); return; }
  showLock("unlock");
}

async function lockBoot() {
  try {
    await lockBootDecide();
  } finally {
    // Only now can a handed-over question tell whether it is allowed to run.
    // hideLock() has already tried once on the unlocked paths; that call is a
    // no-op while this flag is still false, and this one is the real attempt.
    LOCK.booted = true;
    handoffTry();
  }
}

/* ══ boot ══════════════════════════════════════════════════════════════════ */
async function boot() {
  // No engine: the units cannot be listed and nothing can be run, but a
  // handed-over prompt still belongs in the box with the reason showing.
  if (!online()) { handoffTry(); return; }
  try {
    const r = await fetch(`${link.api}/api/providers`, authed());
    S.providers = await r.json();
    // First load only: everything the engine has enabled. A later reconnect
    // must not silently switch units back on that were turned off by hand.
    // Remembered per device, and only defaulted on a browser that has never
    // chosen. Before this the selection came from the config's `enabled` flags
    // on every load, so a unit shipped disabled was unticked again on every
    // refresh however many times you ticked it -- and unticking one you did
    // not want to pay for never survived a reload either.
    const saved = loadUnitPicks();
    if (saved) {
      const exists = new Set(S.providers.map((p) => p.id));
      S.selected = new Set(saved.on.filter((id) => exists.has(id)));
      // A unit that did not EXIST when you last chose joins in -- it is new,
      // not something you turned down. One you unticked stays unticked,
      // because it is in `known` and simply not in `on`.
      const knew = new Set(saved.known);
      for (const p of S.providers) if (p.enabled && !knew.has(p.id)) S.selected.add(p.id);
    } else {
      // Never chosen on this device: start from whatever the engine enables.
      S.selected = new Set(S.providers.filter((p) => p.enabled).map((p) => p.id));
    }
    // No fallback to "all" when the set is empty. Unticking everything is a
    // choice -- Convene is disabled and says so -- and quietly re-ticking the
    // lot would be the same bug in a different disguise.
    saveUnitPicks();
    renderUnitChips();
  } catch {}
  loadHistory();
  loadAccounts(true);
  loadChair();
  renderStudioNav();
  loadBsSessions();
  paintIcons();
  // Backfill needs the engine -- it reads the local SQLite to find what the
  // cloud is missing -- so unlike the listener it belongs here. It is a no-op
  // on every load after the first, because the index already lists everything.
  cloudBackfill().then(syncBlockedNote);
  // A question handed over by another A1 program needs the unit list, so this
  // is the earliest it can run. Nothing happens if there was no handoff.
  handoffTry();
}

const lockBtnClick = () => {
  if (!LOCK.hasLock) return showLock("setup");
  if (LOCK.session) return showLock("manage");
  showLock("unlock");
};
$("navAccounts").onclick = () => { setView("accounts"); loadAccounts(); };
// Back to the list you came from. It does NOT clear the deliberation: coming
// back to the list and then returning to the same row should show the same
// thing, and clearing would make the trip destructive.
$("histBack").onclick = () => setView("history");
$("chairBtn").onclick = openChairPicker;
$("lockBtn").onclick = lockBtnClick;
$("lockBtnM").onclick = lockBtnClick;
$("profBtn").onclick = openProfilePicker;
$("engineBtn").onclick = openEnginePicker;
$("profBtnM").onclick = openProfilePicker;
syncProfileBtn();
// Two buttons, one panel: the sidebar's and the mobile top bar's. On a phone
// the sidebar is a shut drawer, so a Help only in there would be help you have
// to already know how to find.
for (const id of ["helpBtn", "helpBtnM"]) {
  const b = $(id);
  if (!b) continue;
  b.innerHTML = IC.help;
  b.onclick = openHow;
}

applyNav();
applyAudioNav();
paintIcons();
applyMute();
autosize();
attachGrip($("composer"), $("composerGrip"), "composer", autosize);
$("btnQueue").onclick = queueAdd;
$("backToLive").onclick = backToLive;
loadQueueLocal();
renderQueue();
// A prompt that was mid-run when this page reloaded is still running in the
// engine; reconnect to it rather than leaving the grid blank.
queueResume();
updateEnabled();
setView("council");
// The gate paints first and covers everything. Discovery, the engine and the
// Firestore listener all wait behind it -- see openUp(), which lockBoot()
// reaches through hideLock() the moment this profile is open.
lockBoot();
/* ══ OVERLAY SCROLLBARS ════════════════════════════════════════════════════
   See the .sbar rules for why these are fixed overlays rather than children of
   the scrollers they describe. Everything below is about cost: a bar does no
   work at all while its scroller is still, and stops existing the moment that
   scroller leaves the DOM -- which the answer bodies do on every re-render. */
const SBARS = new Set();

function attachScrollbar(sc, z) {
  if (!sc || sc.dataset.sbar) return;
  sc.dataset.sbar = "1";

  const bar = el("div", "sbar");
  const thumb = el("div", "sbar-thumb");
  if (z) bar.style.zIndex = String(z);
  bar.append(thumb);
  document.body.append(bar);

  const MIN_THUMB = 32;
  let hideT = 0, raf = 0, dragging = false;

  const scrollable = () => sc.scrollHeight - sc.clientHeight;

  const place = () => {
    raf = 0;
    // The scroller is gone -- an answer that re-rendered, a view that closed.
    // Nothing else reaps these, so the bar reaps itself.
    if (!sc.isConnected) { bar.remove(); SBARS.delete(entry); return; }
    const room = scrollable();
    const r = sc.getBoundingClientRect();
    if (room < 8 || r.height < 40 || !r.width) { bar.classList.remove("on"); return; }
    bar.style.top = `${r.top}px`;
    bar.style.left = `${r.right - 14}px`;
    bar.style.height = `${r.height}px`;
    const th = Math.max(MIN_THUMB, r.height * (sc.clientHeight / sc.scrollHeight));
    const travel = r.height - th;
    thumb.style.height = `${th}px`;
    thumb.style.top = `${travel * Math.min(1, Math.max(0, sc.scrollTop / room))}px`;
  };
  const schedule = () => { if (!raf) raf = requestAnimationFrame(place); };

  const show = () => {
    place();
    if (scrollable() < 8) return;
    bar.classList.add("on");
    _startBarPump();
    clearTimeout(hideT);
    // Held open while dragging: a thumb that faded out from under the finger
    // holding it would be absurd.
    if (!dragging) hideT = setTimeout(() => bar.classList.remove("on"), 1200);
  };

  sc.addEventListener("scroll", show, { passive: true });
  // A cursor near the right edge is someone looking for the scrollbar, so put
  // it there before they have to guess.
  sc.addEventListener("pointermove", (e) => {
    if (e.pointerType !== "mouse") return;
    if (e.clientX > sc.getBoundingClientRect().right - 32) show();
  }, { passive: true });

  thumb.addEventListener("pointerdown", (e) => {
    if (scrollable() < 8) return;
    e.preventDefault();
    dragging = true;
    bar.classList.add("dragging");
    thumb.setPointerCapture(e.pointerId);
    const r = sc.getBoundingClientRect();
    const th = thumb.offsetHeight;
    // Grab OFFSET, not thumb centre: jumping the thumb to the finger on
    // contact throws away the reader's position before the drag even starts.
    const grab = e.clientY - thumb.getBoundingClientRect().top;
    const travel = Math.max(1, r.height - th);

    const move = (ev) => {
      const top = Math.min(travel, Math.max(0, ev.clientY - r.top - grab));
      sc.scrollTop = (top / travel) * scrollable();
      show();
    };
    const end = () => {
      dragging = false;
      bar.classList.remove("dragging");
      thumb.removeEventListener("pointermove", move);
      thumb.removeEventListener("pointerup", end);
      thumb.removeEventListener("pointercancel", end);
      show();
    };
    thumb.addEventListener("pointermove", move);
    thumb.addEventListener("pointerup", end);
    thumb.addEventListener("pointercancel", end);
  });

  const entry = { sc, bar, place, schedule };
  SBARS.add(entry);
  schedule();
}

/* While a bar is visible it re-measures every frame.
 *
 *  Scroll and resize events are not enough: a view change, a drawer sliding
 *  open, an answer expanding -- all move a scroller without either firing, and
 *  a bar left at its previous coordinates is a thumb sitting in the middle of
 *  nothing. Re-placing costs one getBoundingClientRect per VISIBLE bar, and
 *  bars are visible for about a second at a time, so the loop is idle almost
 *  always: it stops itself the moment none are on. */
let _sbarPump = 0;
function _pumpBars() {
  _sbarPump = 0;
  let live = false;
  for (const b of SBARS) {
    if (!b.bar.classList.contains("on")) continue;
    b.place();
    live = true;
  }
  if (live) _sbarPump = requestAnimationFrame(_pumpBars);
}
function _startBarPump() { if (!_sbarPump) _sbarPump = requestAnimationFrame(_pumpBars); }

// One listener for the lot. A nested scroller MOVES when the page scrolls, and
// resizes/rotations move all of them, so every bar re-places on any of it --
// coalesced into a single frame each, and a no-op for bars that are hidden.
const _replaceAllBars = () => { for (const b of SBARS) b.schedule(); };
document.addEventListener("scroll", _replaceAllBars, { capture: true, passive: true });
window.addEventListener("resize", _replaceAllBars);
window.addEventListener("orientationchange", _replaceAllBars);

attachScrollbar($("page"));
// The question box grows to 45vh and then scrolls, and a long pasted prompt
// hits that in a hurry -- with no indication of how much was above the fold.
attachScrollbar($("composer"));
// Above the drawer it lives in (80), unlike the page's, which must stay below
// it -- the same rule either way: a scrollbar belongs to the surface it
// scrolls, so it stacks with that surface.
attachScrollbar($("sideNav"), 90);

/* ══ PULL TO REFRESH ═══════════════════════════════════════════════════════
   The browser's own pull-to-refresh never fires here: `body { overflow:
   hidden }` and a scrolling `.page` mean the document itself is never at
   scrollTop 0 in the way Chrome looks for, and inside an installed PWA there
   is no address bar to pull against at all. So the gesture is implemented on
   the scroller that actually scrolls.

   It RELOADS THE WHOLE PROGRAM (hardReload, just below: the page AND every file it
   loads, fresh from GitHub), the way pulling down on Index or any other A1 page
   does. Refetching state in place was the first version and it was subtly
   wrong: pull-to-refresh is the gesture people reach for when the page itself
   looks wrong, and a refresh that leaves the running script, the stylesheet
   and every stale bit of DOM exactly where they were cannot fix that. This
   picks up a newly deployed magi.html too, which the in-place version never
   could.

   The ONE exception is a deliberation in flight: reloading then would drop the
   SSE stream and leave the council running against your paid accounts with
   nothing watching it. That case still refreshes in place, so the gesture is
   never simply ignored. */
/* The WHOLE program, fresh from GitHub -- not just this document.
 *
 * location.reload() alone does not do that. The browser re-checks the page
 * itself, but serves everything it loads (LifeHub/lifehub.js, tabsync.js,
 * hoverfx.js, ...) straight from the HTTP cache for as long as GitHub Pages
 * says they are fresh (max-age=600). So a pull could bring up the new
 * magi.html running last deploy's scripts.
 *
 * fetch(..., {cache: 'reload'}) goes to the network and REPLACES the cached
 * copy, so every same-origin file is refetched first and the reload then
 * finds only fresh copies. Bounded at 4s: a slow or offline network still
 * gets its reload rather than a spinner that never ends. Cross-origin files
 * (fonts, the Firebase SDK) are pinned by version and never change in place,
 * so there is nothing to refresh there. */
async function hardReload() {
  const urls = new Set([location.href.split("#")[0]]);
  document.querySelectorAll("script[src], link[rel='stylesheet'][href], link[rel='modulepreload'][href], link[rel='manifest'][href]")
    .forEach((n) => {
      try {
        const u = new URL(n.src || n.href, location.href);
        if (u.origin === location.origin) urls.add(u.href.split("#")[0]);
      } catch {}
    });
  const fetches = Promise.allSettled([...urls].map((u) => fetch(u, { cache: "reload", credentials: "same-origin" })));
  await Promise.race([fetches, new Promise((r) => setTimeout(r, 4000))]);
  location.reload();
}

(function () {
  const page = $("page");
  // Distance tuned to the browser's own gesture: about 115px of finger travel
  // at half-rate resistance, the same feel as the other A1 programs.
  const THRESHOLD = 64;
  const MAX = 110;
  const RATE = 0.55;

  const ind = el("div", "ptr");
  // The browser's pull-to-refresh mark: a circular arrow that winds round as
  // you pull, then spins while the page reloads.
  ind.innerHTML = "<span class='ptr-spin'><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M20 12a8 8 0 1 1-2.34-5.66'/><path d='M20 4v4.5h-4.5'/></svg></span>";
  page.prepend(ind);
  const arrow = ind.querySelector("svg");

  let startY = 0, pulling = false, dist = 0, busy = false;

  /* A pull only starts on the page itself, never on something being used.
   *
   *  Dragging the corner handle of a prompt box DOWN on a phone is exactly a
   *  pull-down gesture from the top of the page, and it reloaded MAGI
   *  mid-resize. The same is true of anything else a finger drags: a unit chip
   *  being reordered, text being selected, a slider, a box that scrolls on its
   *  own. So a touch that lands on any of those is theirs, not the page's. */
  //  Buttons, links and labels are NOT on the list: the browser's own
  //  pull-to-refresh (what every other A1 program gets) starts from anywhere,
  //  and on MAGI's council screen buttons and chips cover most of the top --
  //  excluding them is what made pulling here feel like it did nothing. A
  //  drag from a button never clicks it, so nothing fires by accident.
  //  Prompt boxes are excluded WHOLE (.qbar, .qedit-textwrap, .bs-start), not
  //  just their grip, so a drag that starts a finger's width off the handle
  //  resizes the box instead of reloading the page.
  const OWNED = [
    "input", "textarea", "select",
    // A button is something you press, and pressing on a phone always drags a
    // few pixels. Starting a pull there reloaded the page out from under the
    // press -- and a Studio card or a running deliberation is exactly what you
    // lose when that happens.
    "button",
    "[contenteditable]", "[draggable='true']", "[role='slider']",
    ".qbar-grip", ".qbar", ".qedit-textwrap", ".bs-start",
    // Unit chips reorder on a hold-and-drag (unitDragStart) -- theirs.
    "#unitChips [data-unit]",
    ".sheet", ".sheet-box", "audio", "video", "canvas",
  ].join(",");

  const ownedBy = (target) => {
    for (let n = target; n && n !== page; n = n.parentElement) {
      if (!(n instanceof Element)) continue;
      if (n.matches(OWNED)) return true;
      const cs = getComputedStyle(n);
      // Anything that has claimed touches for itself (drag handles, maps).
      if (cs.touchAction === "none" || cs.touchAction === "pan-x") return true;
      // An inner scroller that is not at its own top: the pull scrolls it.
      if (/(auto|scroll)/.test(cs.overflowY) && n.scrollHeight > n.clientHeight + 1 && n.scrollTop > 0) {
        return true;
      }
    }
    return false;
  };

  // This used to cancel the pull on ANY gotpointercapture, to stand down when
  // the resize handle or a unit reorder took the pointer. But a touch pointer
  // is captured IMPLICITLY by whatever it lands on, so that event fires just
  // before the first move of every touch -- and every pull on a phone was
  // cancelled before it began. Pulling here simply never worked. The controls
  // that capture are excluded by OWNED instead, and a unit reorder that is
  // somehow live mid-pull is checked for directly in touchmove.

  const setPull = (d) => {
    dist = d;
    ind.style.transform = `translateY(${Math.min(d, MAX)}px)`;
    ind.style.opacity = String(Math.min(1, d / THRESHOLD));
    ind.classList.toggle("ready", d >= THRESHOLD);
    if (!ind.classList.contains("spinning")) arrow.style.transform = `rotate(${Math.round(d * 4)}deg)`;
  };
  const reset = () => {
    ind.style.transition = "transform .2s ease, opacity .2s ease";
    setPull(0);
    setTimeout(() => { ind.style.transition = ""; }, 220);
  };

  page.addEventListener("touchstart", (e) => {
    // Only from the very top, and never mid-refresh or while a drawer is open.
    if (busy || page.scrollTop > 0 || e.touches.length !== 1) return;
    if ($("shell").classList.contains("nav-open")) return;
    if (ownedBy(e.target)) return;
    // Text is being selected: the drag extends the selection.
    const sel = window.getSelection && window.getSelection();
    if (sel && !sel.isCollapsed && String(sel).trim()) return;
    startY = e.touches[0].clientY;
    pulling = true;
  }, { passive: true });

  page.addEventListener("touchmove", (e) => {
    if (!pulling) return;
    const d = e.touches[0].clientY - startY;
    if (d <= 0) { pulling = false; reset(); return; }
    // The page scrolled after all (momentum, an inner scroller handing off).
    if (page.scrollTop > 0) { pulling = false; reset(); return; }
    if (DRAG.active) { pulling = false; reset(); return; }
    // Half-rate resistance, like the browser's own: the indicator trails the
    // finger rather than tracking it 1:1 off the top of the screen.
    setPull(d * RATE);
    // Non-passive so a pull is only a pull: without this iOS also rubber-bands
    // the scroller, and the page and the indicator both move.
    if (e.cancelable) e.preventDefault();
  }, { passive: false });

  page.addEventListener("touchend", async () => {
    if (!pulling) return;
    pulling = false;
    if (dist < THRESHOLD) return reset();

    busy = true;
    ind.classList.add("spinning");
    setPull(THRESHOLD);

    if (!engineBusy()) {
      // Leave the spinner up: the reload replaces the page, so there is
      // nothing to tidy afterwards and a reset would only flicker.
      hardReload();
      return;
    }

    try {
      await connect();
      if (online()) {
        await Promise.all([
          loadHistory(),
          loadBsSessions(),
          typeof loadStudio === "function" ? loadStudio() : null,
          boot(),
        ]);
      }
    } catch {}
    // A minimum visible spin: a refresh that completes in 40ms otherwise looks
    // like the gesture did nothing at all.
    setTimeout(() => {
      busy = false;
      ind.classList.remove("spinning");
      reset();
    }, 450);
  }, { passive: true });
})();
</script>
<script>
/* A console opened by hand (bookmark, typed url, a restore that lost its
   sessionStorage) carries no a1tab_ key, so tabsync.js would sit silent and every
   TradeHub launch would open a second console beside it. There is only ever
   meant to be one, however it was opened — so claim the key ourselves. A key
   already in window.name or sessionStorage wins; this only fills the gap. */
try {
  if (!/^a1tab_/.test(String(window.name || "")) && !sessionStorage.getItem("a1TabKey")) window.name = "a1tab_magi";
} catch {}
/* Answered to a claim so no opener retires this tab mid-council. */
window.a1TabBusy = () => !!(S.running || S.refining);
</script>
<script src="tabsync.js"></script>
<script src="LifeHub/lifehub.js" data-lock="#lockScreen" data-accent="#c0aeea" defer></script>
