name = "quant-bot"
# Neo Cortex's bot (worker.js), A1-Priv docs/TradeHub/quant-trading.md §N4. Account 3
# ("Anthony Account 3"); deploys via .github/workflows/deploy-workers3.yml, else by hand:
# CLOUDFLARE_ACCOUNT_ID=c7a5d105aef82380269d238c32868407 npx wrangler deploy. No account_id here on purpose.
# core/ is copied by A1-Priv tools/sync-core.mjs.
main = "service.js"
compatibility_date = "2026-01-01"

[triggers]
crons = ["* 13-21 * * 1-5", "*/5 22 * * 1-5"]   # N8: 22:xx UTC reaches the brief's 17:15 ET deadline in winter

[[durable_objects.bindings]]
name = "EXECUTION"
class_name = "CortexExecution"

[[migrations]]
tag = "n4_execution"
new_sqlite_classes = ["CortexExecution"]

[[d1_databases]]
binding = "DB"
database_name = "quantbot"
database_id = "1810ecb2-aff9-4acc-af65-50733f4fd532"
migrations_dir = "migrations"

# Secrets (wrangler secret put <NAME>, CLOUDFLARE_ACCOUNT_ID = account 3):
#   PROBE_KEY          N0's probe key (random, set by the session; never in a file)
#   BOT_ALPACA_KEY     the Neo Autopilot Alpaca PAPER account (Tony's)
#   BOT_ALPACA_SECRET
