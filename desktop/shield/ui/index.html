<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shield — Offline</title>
<style>
/* Deliberately tiny and self-contained: this is the page that has to render
   when there is no network at all, so it inlines everything and loads nothing.
   Same look as shield.html's Tony side (the 2026-10-27 redesign). */
:root{
  --bg:#1a1a1d;--s1:#232327;--s2:#2c2c31;--s3:#34343a;--bd:rgba(255,255,255,.06);
  --tx:#f4f3f0;--txd:#adadb2;--txm:#8d8d94;--ac:#c0aeea;--acx:#dbd0f5;--err:#d68a7c;--grn:#a4b986;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg);color:var(--tx);
  font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.55;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 20px;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
}
.box{width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center}
.mark{width:72px;height:72px;border-radius:20px;background:var(--s1);display:flex;align-items:center;justify-content:center}
.mark svg{width:42px;height:42px}
h1{font-family:'Manrope','Segoe UI',system-ui,sans-serif;font-size:22px;font-weight:750;letter-spacing:-.4px;color:var(--acx)}
.tagline{font-size:12.5px;color:var(--txm);margin-top:4px}
.list{width:100%;display:flex;flex-direction:column;gap:1px;border-radius:12px;overflow:hidden}
.row{background:var(--s1);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;font-size:13px}
.row .k{color:var(--txd)}
.row .v{font-weight:600}
.row .v.on{color:var(--err)}
.row .v.ok{color:var(--grn)}
kbd{font-family:ui-monospace,'Cascadia Mono',Consolas,monospace;font-size:11px;color:var(--txd);
  background:var(--s2);border-radius:5px;padding:2px 6px}
.note{font-size:12px;color:var(--txm);max-width:330px}
</style>
</head>
<body data-hoverfx="magi">
<div class="box">
  <div class="mark">
    <svg viewBox="0 0 96 96" aria-hidden="true">
      <g fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M48 14 22 23v24c0 17 13 28 26 35" stroke="#c0aeea"/>
        <path d="M48 14 74 23v24c0 17-13 28-26 35" stroke="#8D769A"/>
        <circle cx="48" cy="42" r="7" stroke="#adadb2"/>
        <path d="M48 49v11" stroke="#adadb2"/>
      </g>
    </svg>
  </div>
  <div>
    <h1>Shield</h1>
    <div class="tagline">Offline. The agent is still running.</div>
  </div>
  <div class="list">
    <div class="row"><span class="k">Emergency mode</span><span class="v" id="emg">checking…</span></div>
    <div class="row"><span class="k">Close Apps</span><span class="v"><kbd>Ctrl+Shift+X</kbd></span></div>
    <div class="row"><span class="k">Lock down</span><span class="v"><kbd>Ctrl+Shift+L</kbd></span></div>
    <div class="row"><span class="k">Agent</span><span class="v" id="ver">—</span></div>
  </div>
  <p class="note">The tray menu and shortcuts work offline. Reconnect to end an emergency.</p>
</div>
<script>
// Best-effort: if the agent bridge is present, show real state.
(function(){
  var T = window.__TAURI__ && (window.__TAURI__.core || window.__TAURI__.tauri);
  if (!T || !T.invoke) return;
  T.invoke('sh_status', {}).then(function(s){
    var e = document.getElementById('emg');
    var on = s && s.emergency && s.emergency.active;
    e.textContent = on ? 'Active' : 'Off';
    e.className = 'v ' + (on ? 'on' : 'ok');
    document.getElementById('ver').textContent = 'v' + ((s && s.version) || '?');
  }).catch(function(){});
})();
</script>
<script src="hoverfx.js"></script></body>
</html>
