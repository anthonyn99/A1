[package]
name = "shield-agent"
version = "1.0.0"
description = "Shield — emergency application closer and lockdown agent"
authors = ["A1"]
edition = "2021"
rust-version = "1.77"

[lib]
# The _lib suffix keeps the library from colliding with the binary of the same
# name on Windows, which is the layout `tauri init` produces for v2.
name = "shield_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"

[dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_Shutdown",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
# The agent is a tray utility that starts at logon: small and quick to load
# matters more than the last few percent of runtime speed.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
