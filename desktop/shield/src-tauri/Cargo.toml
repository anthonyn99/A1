[package]
name = "shield-agent"
version = "1.0.0"
description = "Shield — emergency application closer and lockdown agent"
authors = ["A1"]
edition = "2021"
rust-version = "1.77"

[lib]
# The _lib suffix keeps the library from colliding with the binary of the same
# name on Windows, which is the layout `tauri init` produces for v2.
name = "shield_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
# "deep-link" feature: a second `shieldopen:` launch (from TaskHub, in a
# browser tab) must hand its URL to the ALREADY-RUNNING agent, not spawn a
# competing one. Without this feature the single-instance plugin still
# forwards argv, but the deep-link plugin's on_open_url never fires for it.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
# Only for the Url type the deep-link plugin hands back (it takes the crate as
# a dependency but does not re-export it) — not used for any HTTP of our own.
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"

[dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_Shutdown",
  "Win32_UI_WindowsAndMessaging",
  # Resolving what a .lnk actually points at (IShellLink + IPersistFile), and
  # telling Explorer to repaint the desktop after moving one.
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_Storage_FileSystem",
]

[profile.release]
# The agent is a tray utility that starts at logon: small and quick to load
# matters more than the last few percent of runtime speed.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
# NOT panic = "abort", deliberately.
#
# With abort, a panic anywhere — including in the watchdog's background thread,
# or in a command handler — terminates the entire process instantly and without
# a message. On a tray app that is indistinguishable from "Shield randomly
# closed", and if it happened during a lockdown it would silently stop
# enforcing. Unwinding lets a thread die on its own without taking the agent
# with it. The binary is a few hundred KB larger; that is a fine trade.
