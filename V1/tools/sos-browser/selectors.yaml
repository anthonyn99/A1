# StudyOS browser driver — per-site selectors.
#
# EVERY FIELD IS AN ORDERED LIST, tried top to bottom, first match wins. When a
# site changes its markup, ADD the new selector at the TOP rather than replacing
# the old one: these sites A/B test and roll back, and keeping the old entry
# means a rollback doesn't break you again.
#
# ── PROVENANCE ─────────────────────────────────────────────────────────────
# Carried over from MAGI's config/selectors.yaml in this same repo, which
# verified them against live logged-in sessions. These are NOT guesses. Where a
# value looks oddly specific (claude's confirm_samples, gemini's strip_patterns)
# it was measured against real observed failures — do not "tidy" those.
#
# StudyOS drives Claude and Gemini only: they are the two subscriptions on this
# account, and a deck rewrite wants one good answer, not a council.

sites:
  claude:
    display_name: Claude
    url: https://claude.ai/new
    # Verified in TRUE HEADLESS with the user-agent override (see driver.py).
    headless_ok: true
    input:
      - "div[contenteditable='true'].ProseMirror"
      - "[data-testid='chat-input']"
      - "div[contenteditable='true'][aria-label*='prompt' i]"
      - "fieldset div[contenteditable='true']"
    submit:
      - "button[aria-label='Send message']"
      - "button[aria-label*='Send' i]"
      - "button[type='submit']:has(svg)"
    send_key: Enter
    file_input:
      - "input[type='file']"
      - "[data-testid='file-upload-input']"
    assistant_turn:
      # .font-claude-response is the clean answer body. The outer
      # div[data-is-streaming] wrapper prefixes "Claude responded:" and repeats
      # the text, so it must NOT be used for extraction.
      - ".font-claude-response"
      - ".standard-markdown"
      - "div[data-testid='assistant-message']"
      - "div.font-claude-message"
    stop_button:
      - "button[aria-label*='Stop' i]"
    streaming_marker:
      - "div[data-is-streaming='true']"
    ready_selector:
      - "div[contenteditable='true']"
    strip_patterns:
      # When a file is attached, Claude narrates its tool use ABOVE the answer:
      # "Reading the file-reading router skill…", "Read a file, ran a command".
      # Those lines render inside the same response node, so the serializer
      # picks them up and they land at the top of the generated note. Observed
      # verbatim on a real 95-slide deck.
      #
      # Anchored to the START and only to these known phrases: a greedy
      # "delete everything before the first heading" would silently eat a real
      # introduction on a deck whose first section has no heading.
      - "(?s)^\\s*Reading the [^\\n]*skill[^\\n]*\\n+"
      - "(?s)^\\s*This is a [^\\n]*let me read[^\\n]*\\n+"
      - "(?s)^\\s*(Read a file, ran a command)+\\s*\\n+"
      - "(?s)^\\s*(Analyzed data|Viewed image|Searched files)[^\\n]*\\n+"
      - "(?s)^\\s*\\d+-page slide-deck PDF[^\\n]*\\n+"
      - "(?s)^\\s*(I'll|Let me) (rasterize|inspect|extract|start)[^\\n]*\\n+"
    # Claude opens a long answer with a one-line framing QUESTION, drops the
    # streaming flag while it thinks, then streams the real answer into the same
    # node. A short confirm window expires inside that pause and captures the
    # preamble as the final answer — measured 10/10 on long prompts in MAGI.
    # 14 polls = ~9.8s of continuous quiet before a cleared marker is believed.
    # The marker reappearing resets the counter, so a still-streaming answer is
    # unaffected; this only costs time on answers that genuinely finish early.
    confirm_samples: 14
    poll_ms: 700
    stability_samples: 4
    # Generous vs MAGI's 45s/300s: a slide-by-slide rewrite of a 15-slide chunk
    # is a much longer generation than a council question.
    stall_timeout_s: 90
    hard_timeout_s: 600
    login_selectors:
      # Match only the real login page. Claude's logged-in UI contains "Claude"
      # aria-labels that looser patterns caught.
      - "input[name='email']"
      - "button:has-text('Continue with Google')"
      - "a[href*='/login']"
    rate_limit_selectors:
      # The toast carries the reset time, which is the one fact worth surfacing.
      - "text=/Limits will reset/i"
      - "text=/you've hit your limit/i"
      - "text=/reached your .{0,30}limit/i"
      - 'text=/Need more usage\?/i'
    challenge_selectors:
      - "iframe[src*='challenges.cloudflare.com']"
      - "text=/Verify you are human/i"

  gemini:
    display_name: Gemini
    url: https://gemini.google.com/app
    # Answers correctly in true headless — Google's bot checks did not trigger
    # here, unlike the Cloudflare-fronted sites. If Gemini ever starts
    # challenging headless, set this to false.
    headless_ok: true
    input:
      - "rich-textarea div.ql-editor[contenteditable='true']"
      - "div.ql-editor[contenteditable='true']"
      - "rich-textarea [contenteditable='true']"
    submit:
      - "button[aria-label='Send message']"
      - "button[aria-label*='Send' i]"
      - "button.send-button"
    send_key: Enter
    file_input:
      - "input[type='file']"
    assistant_turn:
      # .model-response-text is the answer body. The outer model-response
      # wrapper also carries the disclaimer/action chrome.
      - ".model-response-text"
      - "message-content.model-response-text"
      - "model-response message-content"
      - "model-response"
    stop_button:
      - "button[aria-label*='Stop' i]"
      - "button.stop-icon"
    # Gemini exposes no streaming flag; completion rests on the stop button and
    # text stability, so a result here is more often low-confidence.
    streaming_marker: []
    ready_selector:
      - "rich-textarea"
      - "div.ql-editor"
    strip_patterns:
      # Gemini appends grounding citations as trailing source names plus a
      # "+ N" pill (observed: "AcqNotes\n+ 2"). Without stripping, that lands
      # inside the generated note.
      - "\\n\\s*\\+\\s*\\d+\\s*$"
      - "\\n\\s*(Sources|Show more|Learn more)\\s*$"
    confirm_samples: 4
    poll_ms: 700
    stability_samples: 4
    stall_timeout_s: 90
    hard_timeout_s: 600
    login_selectors:
      - "a[href*='accounts.google.com/ServiceLogin']"
      - "text=/^Sign in$/"
    rate_limit_selectors:
      - "text=/You've reached your .{0,40}limit/i"
      - "text=/try again later/i"
    challenge_selectors:
      - "text=/unusual traffic/i"
      - "form#captcha-form"

# ── decks: (UNVERIFIED) ───────────────────────────────────────────────────────
# Everything under `decks:` is a GUESS, written without a live NotebookLM
# session. Unlike `sites:` above, NONE of these were measured against a real
# page — the provenance note at the top of this file does NOT cover them.
#
# The first real run is EXPECTED to fail on a missing selector. That is the
# design, not a defect:
#
#     python driver.py deck --site notebooklm --source deck.pdf \
#         --out probe.pdf --prompt test --dry-run --headful
#
# walks the wizard, stops before Generate, and names the field that missed.
# Fix that one field, re-run — about a minute per iteration, against ~25
# minutes if you had to generate a real deck to discover each miss. The
# artifacts/ dump has the HTML to repair it from.
#
# Treat a match here as unconfirmed until dry-run reports `missing: []`.
#
# Same ordered-list rule as above: ADD a new selector at the TOP, never replace.
#
# WHY A SEPARATE TOP-LEVEL KEY AND NOT A THIRD ENTRY UNDER `sites:`
# load_site() filters against Site.__dataclass_fields__, so a notebooklm entry
# under `sites:` would silently DROP every field below and hand back a Site
# with empty input/assistant_turn lists — config that loads perfectly and then
# fails at runtime as `no_input`, pointing at the composer instead of at this
# file. A separate key makes load_site('notebooklm') say "unknown site", which
# is the honest answer.
decks:
  notebooklm:
    display_name: NotebookLM
    url: https://notebooklm.google.com/
    # Deliberately FALSE while the selectors are guesses: a headful run (parked
    # off-screen by launch()) makes the save_artifacts screenshots readable
    # during the repair loop, and a real rendering browser is the less
    # distinguishable choice for a content-generation action.
    headless_ok: false

    # ── The wizard, in click order ───────────────────────────────────────────
    # MEASURED against the live app on 2026-09-12 unless marked otherwise. The
    # product is branded "Gemini Notebook" in the UI now; the host and the URL
    # are still notebooklm.google.com.
    #
    # An announcement modal (mat-dialog, "We're giving you more flexibility...")
    # can cover the whole app on first load and swallows every click behind it.
    # Dismissed first, best-effort — absent on later runs, which is why the flow
    # treats a miss here as normal rather than as a failure.
    dismiss_dialog:
      - "button[aria-label='Close dialog']"
      - "button[aria-label='Dismiss banner']"
      - "mat-dialog-container button[aria-label*='close' i]"
    create_notebook:
      - "[aria-label*='Create new' i]"
      - "button:has-text('Create notebook')"
      - "button:has-text('Create new notebook')"
      - "button:has-text('New notebook')"
    # There is NO input[type=file] in the DOM until this is clicked — the first
    # guess waited for one that could not exist yet.
    add_source_button:
      - "button:has-text('Add sources')"
      - "[aria-label='Add source']"
      - "button:has-text('Add source')"
    # Inside the Add-sources dialog. Clicking this opens a NATIVE file chooser
    # rather than revealing an input[type=file] in the DOM — the reason two
    # rounds of waiting for such an input timed out. Driven with Playwright's
    # expect_file_chooser, which intercepts the OS dialog.
    upload_files_button:
      - "button:has-text('Upload files')"
      - "[aria-label*='Upload file' i]"
    # Fallback only: used when a hidden input IS present, which some layouts do
    # expose. The flow prefers the file chooser and falls back to this.
    source_file_input:
      - "input[type='file']"
      - "[data-testid='file-upload-input']"
    # Proof the source finished UPLOADING AND INGESTING.
    #
    # MEASURED, and it is the opposite of what the first guess assumed. The
    # source ROW appears the instant the upload starts, so matching on it
    # returned "ready" while the file was still being processed — the Studio
    # buttons were still greyed out, the Slide Deck click landed on a disabled
    # control, did nothing but show a tooltip, and the run failed three steps
    # later pointing at an innocent selector.
    #
    # Worse, is_enabled() is useless here: these are styled divs, not real
    # buttons, so Playwright reports enabled=True the whole time.
    #
    # The one honest signal is the SPINNER DISAPPEARING (measured ~20s for a
    # 30-page PDF). So source_ready names the row (it must exist at all) and
    # ingest_spinner names what must then go AWAY — the flow waits for both.
    source_ready:
      - "[aria-label$='.pdf']"
      - "[data-testid='source-item']"
      - "[class*='source-item']"
      - "[aria-label*='source' i][role='listitem']"
    ingest_spinner:
      - "mat-spinner"
      - "[role='progressbar']"
      - ".mdc-circular-progress"
    # The Studio is a PANEL that is already open on the right, not a tab that
    # has to be selected. Kept as an optional step: clicked only if it matches,
    # so a layout where it IS collapsed still works.
    studio_tab:
      - "[aria-label='Expand Studio panel']"
      - "button:has-text('Studio')"
      - "[role='tab']:has-text('Studio')"
    slide_deck_button:
      - "[aria-label='Slide Deck']"
      - "button:has-text('Slide Deck')"
      - "button:has-text('Slides')"
    # WARNING: `[aria-label*='Customize' i]` matches "Customize notebook" — the
    # global settings dialog (title, cover image, summary), which is NOT the
    # Slide Deck prompt. Anchored to the Studio panel's own control instead.
    # Left optional in the flow: on the current layout the Slide Deck click
    # opens its prompt directly, with no separate Customize step.
    customize_button:
      - "[aria-label='Customize Slide Deck']"
      - "button[aria-label*='Customize slide' i]"
    # MEASURED. A bare `textarea` matched the SIDEBAR's "Search the web for new
    # sources" box — invisible behind the dialog, so the click timed out after
    # 30s pointing at the wrong control entirely. Always anchor to the aria
    # label; there are three visible textareas on this screen and only one of
    # them is the prompt.
    prompt_input:
      - "[aria-label='Describe the slide deck you want to create']"
      - "textarea[aria-label*='slide deck' i]"
      - "mat-dialog-container textarea"
    # Two Generate buttons exist once the dialog is open (the Studio card keeps
    # its own). Scoped to the dialog so the click lands on the one that submits
    # the prompt rather than the one that reopens the panel.
    generate_button:
      - "mat-dialog-container button:has-text('Generate')"
      - "[role='dialog'] button:has-text('Generate')"
      - "button:has-text('Generate')"

    # ── Completion, and its opposite ─────────────────────────────────────────
    # artifact_failed is checked BEFORE artifact_ready on every poll (see
    # _wait_for_deck). If a failed artifact row still matches the ready
    # selector — plausible, same row with a different badge — ready-first would
    # report success and then hand back a download that never arrives.
    artifact_ready:
      - "button[aria-label*='Download' i]"
      - "[data-testid='artifact-ready']"
      - "button:has-text('Download')"
    artifact_failed:
      - "text=/generation failed/i"
      - "text=/couldn't generate/i"
      - "text=/something went wrong/i"
    download_trigger:
      - "button[aria-label*='Download' i]"
      - "button:has-text('Download')"
      - "[aria-label='More'][role='button']"
    # OPTIONAL second click: only used if it matches. Whether Download is a
    # direct button or hidden behind an overflow menu is exactly the kind of
    # thing a guess gets wrong, so the flow tolerates both shapes.
    download_menu_item:
      - "[role='menuitem']:has-text('PDF')"
      - "[role='menuitem']:has-text('Download')"

    # ── Timing ──────────────────────────────────────────────────────────────
    # 5s, not the chat path's 700ms: a 30-minute wait at 700ms is ~2,500 DOM
    # queries for no extra information, and it reads as automation.
    gen_poll_ms: 5000
    gen_timeout_s: 1800        # 30 min; deck generation is genuinely slow
    source_timeout_s: 300      # upload + ingest, a separate and variable wait
    download_timeout_s: 120

    # ── Sentinels ───────────────────────────────────────────────────────────
    # Same hard stop as every site above: never solved, only reported.
    #
    # MEASURED, unlike the wizard selectors above. A signed-out visit to
    # notebooklm.google.com redirects to
    #   accounts.google.com/v3/signin/identifier?continue=https://notebook.google.com/...
    # (note: notebook.google.com, no "lm" — that is Google's own redirect, the
    # URL above is still right). Of the original two guesses only the loose
    # text match fired there, so #identifierId is first now: it is the id of
    # the email field on Google's sign-in page and the most stable of the
    # three. Checked against the real redirect, not assumed.
    login_selectors:
      - "#identifierId"
      - "a[href*='accounts.google.com/ServiceLogin']"
      - "text=/^Sign in$/"
    rate_limit_selectors:
      - "text=/You've reached your .{0,40}limit/i"
      - "text=/try again later/i"
    challenge_selectors:
      - "text=/unusual traffic/i"
      - "form#captcha-form"
