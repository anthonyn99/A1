# ============================================================================
# studyos-api — App Lock auth + reminder push cron
# ============================================================================
# Deploy:
#   cd workers/studyos-api
#   npx wrangler kv namespace create TOKEN_CACHE     # paste the id below
#   npx wrangler deploy
#
# Then add the two service-account secrets (only needed for push):
#   npx wrangler secret put FIREBASE_CLIENT_EMAIL
#   npx wrangler secret put FIREBASE_PRIVATE_KEY
#
# Both come from Firebase console → Project settings → Service accounts →
# "Generate new private key". The JSON it downloads has client_email and
# private_key. Paste private_key INCLUDING the BEGIN/END lines.
#
# Verify:  curl https://studyos-api.<your-subdomain>.workers.dev/health
#          → { "ok": true, "kv": true, "fcm": true }
# ============================================================================

name = "studyos-api"
main = "worker.js"
compatibility_date = "2025-06-01"

[vars]
# The Index Firebase project — already correct, matches config/config.js §1.
FIREBASE_PROJECT_ID = "task-dashboard-d2b53"

# Comma-separated origins allowed to call this worker. Set this to V1's real
# origin once deployed — "*" lets ANY page attempt password guesses here.
# e.g. "https://vedaname.github.io,http://localhost:8080"
ALLOWED_ORIGINS = "https://tradeboard.vedapatel05.workers.dev,http://localhost:8080,http://127.0.0.1:8080"

# ⚠️ MUST stay distinct from Index's own `reminders` / `fcm_tokens`.
# StudyOS shares the Index Firebase project, and Index runs its own reminder
# cron over those collections. Two crons on one collection means duplicate
# notifications and a delete race. Do not change these to the unprefixed names.
REMINDERS_COLLECTION = "studyos_reminders"
TOKENS_COLLECTION    = "studyos_fcm_tokens"

# ── KV namespace: lock hashes, reset codes, cached Google token ─────────────
# Create it ONCE, then paste the id (deploy fails until this is real):
#   npx wrangler kv namespace create TOKEN_CACHE
[[kv_namespaces]]
binding = "TOKEN_CACHE"
id = "25cb36ce33e54ac3959447f556cf3b22"

# ── Cron: check for due reminders every minute ─────────────────────────────
# Free plan allows 5 cron triggers per account. Drop this section entirely if
# you are only using the App Lock and not push notifications.
[triggers]
crons = ["* * * * *"]
