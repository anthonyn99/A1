    const p=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date()).reduce((a,x)=>{a[x.type]=x.value;return a},{});
    if(p.weekday==='Sat'||p.weekday==='Sun')return false;
    let h=+p.hour; if(h===24)h=0;
    const mins=h*60+(+p.minute);
    return mins>=570&&mins<960; // 9:30 → 16:00 ET
  }catch(e){return true;}
}

// Build a deduped, display-ordered headline list from an event's sources.
// Skips empty headlines and non-article URLs (the Finnhub API redirect / '#').
// Orders "why it moved" explainers first (the catchy Robinhood-style lines —
// "Why Sandisk Stock Just Dropped", "What's Behind the Memory Split"), then most
// recent. Dedupes near-identical headlines that clustering attached from multiple wires.
function nhHeadlines(sources){
  const seen=new Set(), out=[];
  for(const s of (sources||[])){
    const h=(s.headline||'').trim();
    if(!h)continue;
    const u=s.url||'';
    if(!u||u==='#'||u.includes('finnhub.io/api/news'))continue;
    const key=h.toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim().slice(0,60);
    if(seen.has(key))continue;
    seen.add(key); out.push(s);
  }
  const isWhy=h=>/^(why\b|what'?s behind|here'?s why|what'?s driving)/i.test((h||'').trim());
  out.sort((a,b)=>{
    const wa=isWhy(a.headline)?1:0, wb=isWhy(b.headline)?1:0;
    if(wa!==wb)return wb-wa;
    return (b.ts||0)-(a.ts||0);
  });
  return out;
}
// Raw catchy source headlines under an event card, with a "+N more" expander.
// Additive: sits between the AI summary and the Sources row.
function NHHeadlineList({sources}){
  const [open,setOpen]=useState(false);
  const items=nhHeadlines(sources);
  if(!items.length)return null;
  const CAP=6;
  const shown=open?items:items.slice(0,CAP);
  const more=items.length-shown.length;
  return(
    <div style={{display:'flex',flexDirection:'column',gap:7,marginBottom:11}}>
      {shown.map((s,i)=>(
        // Source headlines sit under the AI summary in the hierarchy, so they
        // read grey; white is reserved for the summary itself.
        <a key={i} href={s.url} target="_blank" rel="noopener noreferrer"
          style={{display:'flex',gap:8,alignItems:'baseline',textDecoration:'none',color:'var(--txd)'}}
          onMouseEnter={ev=>ev.currentTarget.style.color='var(--ac)'}
          onMouseLeave={ev=>ev.currentTarget.style.color='var(--txd)'}>
          <span style={{color:'var(--txd)',opacity:0.5,flex:'none'}}>›</span>
          <span style={{fontSize:13,lineHeight:1.45,fontWeight:400}}>{s.headline}
            <span style={{color:'var(--txm)',fontWeight:500,marginLeft:6,fontSize:11,opacity:0.9}}>{s.name}{s.ts?' · '+nhTimeAgo(s.ts):''}</span>
          </span>
        </a>
      ))}
      {(more>0||open)&&(
        <span onClick={()=>setOpen(o=>!o)} style={{fontSize:11,fontWeight:700,color:'var(--ac)',cursor:'pointer',marginLeft:16}}>
          {open?'Show less':('+ '+more+' more headline'+(more!==1?'s':''))}
        </span>
      )}
    </div>
  );
}

function TBNewsPage({watchlist:sharedWatchlist=NH_DEFAULT_TICKERS}){
  const [events,setEvents]=useState([]);
  const [generatedAt,setGeneratedAt]=useState(null);
  // Seed from the module-level manager so the spinner is still there when you come
  // back to a tab whose build is still running — `kicking` covers the request that
  // starts the build, `building` the poll that watches it.
  const [loading,setLoadingState]=useState(()=>_tbNewsBuild.kicking);
  const [building,setBuilding]=useState(()=>_tbNewsBuild.building);
  const [degraded,setDegraded]=useState(false); // all AI down, showing raw headlines
  const [notice,setNoticeState]=useState(()=>(_tbNewsBuild.notice&&Date.now()-_tbNewsBuild.noticeAt<NH_NOTICE_TTL)?_tbNewsBuild.notice:'');
  /* Both write through the manager, so the "Refreshing…" state and the message
     explaining how a build ended are still there after a tab switch. */
  const setLoading=useCallback(v=>{_tbNewsBuild.setKicking(v);setLoadingState(v);},[]);
  const setNotice=useCallback(m=>{_tbNewsBuild.note(m);setNoticeState(m);},[]);
  const [hours,setHours]=useState(72); // 3-day window
  const [sentFilter,setSentFilter]=useState('all');
  const [impFilter,setImpFilter]=useState('all');
  const [selTickers,setSelTickers]=useState([]);
  const [selSectors,setSelSectors]=useState([]);
  const [sortBy,setSortBy]=useState('impact');
  // Watchlist now comes from the shared Control-tab list (prop). Read-only here.
  const newsTickers=sharedWatchlist;
  // Rate limit state (fetched from /rate-status)
  const [rlUsed,setRlUsed]=useState(0);
  const [rlCooldown,setRlCooldown]=useState(0); // seconds remaining in cooldown
  // Live quotes for price-move correlation: { TICKER:{c,d,dp,...} }
  const [quotes,setQuotes]=useState({});
  const [quotesAt,setQuotesAt]=useState(0);
  const cooldownTimer=useRef(null);
  const hydrated=useRef(false);
  // Latest generatedAt, readable from callbacks without re-creating them.
  const genRef=useRef(0);
  useEffect(()=>{genRef.current=generatedAt||0;},[generatedAt]);

  // Apply a finished build (from the manager, a remote device, or a poll).
  const applyBuild=useCallback((p)=>{
    if(!p||!Array.isArray(p.events))return;
    setEvents(p.events);
    setGeneratedAt(p.generatedAt||Date.now());
    setDegraded(!!p.degraded);
    genRef.current=p.generatedAt||Date.now();
    /* Hand it to the manager too: a force-fresh can come back finished on the
       first request (no polling involved), and if that lands while the tab is
       closing, `last` is what a remount adopts before the debounced Firebase
       write has even gone out. */
    if((p.generatedAt||0)>=((_tbNewsBuild.last&&_tbNewsBuild.last.generatedAt)||0))_tbNewsBuild.last=p;
  },[]);

  // Keep the manager's copy of the filters current — it publishes the finished
  // build to Firebase itself, and that write is a full doc overwrite.
  // Only once hydrated — publishing pre-hydration defaults would overwrite the
  // saved filters. Until then the manager re-reads them off the Firebase doc.
  useEffect(()=>{
    if(!hydrated.current)return;
    _tbNewsBuild.settings={hours,sentFilter,impFilter,selTickers,selSectors,sortBy};
  },[hours,sentFilter,impFilter,selTickers,selSectors,sortBy]);

  /* ── Fetch rate status from worker (cheap KV reads) ── */
  const fetchRateStatus=useCallback(async()=>{
    try{
      const r=await fetch(NH_WORKER_URL+'/rate-status');
      if(!r.ok)return;
      const j=await r.json();
      setRlUsed(j.usedToday||0);
      setRlCooldown(Math.max(0,j.cooldownSec||0));
    }catch(e){}
  },[]);

  /* Cooldown countdown ticker */
  useEffect(()=>{
    if(cooldownTimer.current)clearInterval(cooldownTimer.current);
    if(rlCooldown>0){
      cooldownTimer.current=setInterval(()=>{
        setRlCooldown(p=>{if(p<=1){clearInterval(cooldownTimer.current);return 0;}return p-1;});
      },1000);
    }
    return()=>clearInterval(cooldownTimer.current);
  },[rlCooldown]);

  /* ── Load from Firebase on mount ── */
  useEffect(()=>{
    const doLoad=async()=>{
      let fbDoc=null;
      if(window._fbLoadTBNews){
        const d=await window._fbLoadTBNews();
        fbDoc=d;
        if(d){
          // A build that finished while this tab was closed may not have hit
          // Firebase yet (the save is debounced) — don't let a staler doc win.
          const lb=_tbNewsBuild.last;
          const fresher=lb&&(lb.generatedAt||0)>(d.generatedAt||0);
          if(!fresher){
            if(Array.isArray(d.events)&&d.events.length>0){setEvents(d.events);}
            if(d.generatedAt&&(!d.events||d.events.length>0)){setGeneratedAt(d.generatedAt);genRef.current=d.generatedAt;}
          }
          if(d.settings){
            const s=d.settings;
            if(s.hours)setHours(s.hours);
            if(s.sentFilter)setSentFilter(s.sentFilter);
            if(s.impFilter)setImpFilter(s.impFilter);
            if(Array.isArray(s.selTickers))setSelTickers(s.selTickers);
            if(Array.isArray(s.selSectors))setSelSectors(s.selSectors);
            if(s.sortBy)setSortBy(s.sortBy);
          }
        }
      }
      hydrated.current=true;
      if(fbDoc&&fbDoc.settings)_tbNewsBuild.settings=fbDoc.settings;
      // Always fetch rate status on mount
      fetchRateStatus();
      // Show what's ALREADY built — opening the tab must not start a build. See
      // peekOrBuild: keeping the feed current every trading morning is now the
      // app-level orchestrator's job (TBApp), which runs whichever tab is open.
      peekOrBuild(fbDoc);
    };
    if(window._fbReady)doLoad();
    else{const h=()=>doLoad();window.addEventListener('fb-ready',h,{once:true});return()=>window.removeEventListener('fb-ready',h);}
  },[]);

  /* ── Live sync from other devices ── */
  useEffect(()=>{
    const onRemote=(e)=>{
      const d=e.detail;if(!d)return;
      if(Array.isArray(d.events)&&d.events.length>0){
        // Another device collected a finished build and published it — show it and
        // tear down any in-flight polling / build spinner so it "just appears".
        setEvents(d.events);
        setDegraded(d.events.every(e=>e.aiAnalyzed===false));
        setBuilding(false);
        setLoading(false);
        setNotice('');
        _tbNewsBuild.stop();
      }
      if(d.generatedAt&&(!d.events||d.events.length>0)){setGeneratedAt(d.generatedAt);genRef.current=d.generatedAt;}
      if(d.settings){
        const s=d.settings;
        if(s.hours)setHours(s.hours);
        if(s.sentFilter)setSentFilter(s.sentFilter);
        if(s.impFilter)setImpFilter(s.impFilter);
        if(Array.isArray(s.selTickers))setSelTickers(s.selTickers);
        if(Array.isArray(s.selSectors))setSelSectors(s.selSectors);
        if(s.sortBy)setSortBy(s.sortBy);
      }
    };
    window.addEventListener('fb-tb-news-remote',onRemote);
    return()=>window.removeEventListener('fb-tb-news-remote',onRemote);
  },[]);

  /* ── Persist settings when they change ── */
  useEffect(()=>{
    if(!hydrated.current)return;
    if(!window._fbSaveTBNews)return;
    const settings={hours,sentFilter,impFilter,selTickers,selSectors,sortBy};
    window._fbSaveTBNews({events,generatedAt,settings});
  },[hours,sentFilter,impFilter,selTickers,selSectors,sortBy,newsTickers]);

  /* ── Track the module-level build manager ────────────────────────────────
     It owns the polling, so a build keeps being watched across tab switches and
     this tab just mirrors its state — including on a fresh mount, where `last`
     hands over a build that finished while News was closed. ── */
  useEffect(()=>{
    setBuilding(_tbNewsBuild.building);
    setLoadingState(_tbNewsBuild.kicking);
    const lb=_tbNewsBuild.last;
    if(lb&&(lb.generatedAt||0)>genRef.current)applyBuild(lb);
    return _tbNewsBuild.sub((evt)=>{
      /* A build kicked from ANOTHER mount (or the orchestrator) drives this tab
         through these two, so the spinner is right the moment you come back. */
      if(evt.type==='kick'){setLoadingState(true);}
      else if(evt.type==='kickend'){setLoadingState(false);}
      else if(evt.type==='notice'){setNoticeState(evt.message||'');}
      else if(evt.type==='start'){setBuilding(true);setLoading(false);setNotice('');}
      else if(evt.type==='done'){
        applyBuild(evt.payload);
        setBuilding(false);setLoading(false);
        setNotice(evt.payload.events.length?'':'Worker returned 0 events. Quotas may be exhausted — try again later.');
        fetchRateStatus();
      }
      else if(evt.type==='timeout'){
        setBuilding(false);setLoading(false);
        // Don't blame quota here — this branch only knows the build didn't land in
        // ~4 min, and the usual cause is the pipeline being cut short, not an
        // exhausted API. Saying "quota may be exhausted" sent a real diagnosis down
        // the wrong path on 2026-08-21, when every model was healthy. Point at the
        // one place that actually knows.
        setNotice('Build did not finish in time. Nothing was lost — the feed below is the last good build. Check /_stage-debug on the worker for the reason (aiStats.omissionSkipped / lastError).');
        fetchRateStatus();
      }
      else if(evt.type==='error'){
        setBuilding(false);setLoading(false);
        setNotice(evt.message||'Build failed.');
      }
    });
  },[applyBuild,fetchRateStatus]);

  /* ── Refresh: kick worker build, hand the watch to the manager ──
     `escalated` marks the one automatic retry described at the empty-result
     branch below; it exists only to stop that retry from recursing. ── */
  const refresh=useCallback(async(forceFresh,escalated)=>{
    _tbNewsBuild.stop();
    const baseGen=genRef.current||0;
    setLoading(true);setBuilding(false);setNotice('');
    try{
      const tq='tickers='+encodeURIComponent(newsTickers.join(','));
      const url=NH_WORKER_URL+'/news?'+tq+(forceFresh?'&fresh=1':'');
      const r=await fetch(url);

      // Rate limited
      if(r.status===429){
        const j=await r.json().catch(()=>({}));
        setNotice(j.reason||'Rate limit reached. Try again later.');
        setLoading(false);
        fetchRateStatus();
        return;
      }

      const j=await r.json();

      // Rate limited but returned cached data
      if(j._rateLimited){
        setNotice(j._rateLimitReason||'Rate limited — showing cached data.');
        if(Array.isArray(j.events)&&j.events.length>0){
          setEvents(j.events);
          setGeneratedAt(j.generatedAt||Date.now());
        }
        setLoading(false);
        fetchRateStatus();
        return;
      }

      // ── Building in background ────────────────────────────────────────────
      // The worker answers a kicked build two different ways: 202 with no body,
      // or 200 carrying the PREVIOUS payload (+ X-Building:1) so the feed isn't
      // blank while the pipeline runs. Only the 202 used to count as "building",
      // so a Force fresh over a warm cache looked finished the instant it
      // returned — nothing watched, and the new build showed up only on a manual
      // Refresh. forceFresh ALWAYS starts a build, so always watch after one
      // (the X-Building read is a cross-origin header and can't be relied on
      // alone if the deployed worker predates Access-Control-Expose-Headers).
      const bldHdr=(()=>{try{return r.headers.get('X-Building')==='1';}catch(e){return false;}})();
      // ...unless the worker already WAITED for the build and handed back the
      // finished feed. Force fresh is now synchronous up to FRESH_WAIT_MS (the
      // fire-and-forget version kept getting reaped mid-build), so a force fresh
      // that answers with events NEWER than what we started from is done — there
      // is nothing left to watch. Without this the poller would sit on a baseGen
      // it can never beat and print "Build is taking too long" 4 minutes later,
      // over a feed that had already refreshed correctly.
      const freshDone=forceFresh&&r.status===200&&!bldHdr&&Array.isArray(j.events)&&j.events.length>0&&(j.generatedAt||0)>baseGen;
      if(!freshDone&&(r.status===202||j.status==='building'||bldHdr||forceFresh)){
        setLoading(false);
        // If we got stale events, show them while building
        if(Array.isArray(j.events)&&j.events.length>0){
          setEvents(j.events);
          setGeneratedAt(j.generatedAt||Date.now());
          genRef.current=j.generatedAt||genRef.current;
        }
        tbNewsWatchBuild(newsTickers,Math.max(baseGen,j.generatedAt||0));
        fetchRateStatus();
        return;
      }

      // Got immediate result (cache hit)
      const evs=j.events||[];

      // ── Empty cache hit → escalate, don't dead-end ────────────────────────
      // The worker caches a document even when a build produced nothing, and it
      // lives for 4h. A plain Refresh over one of those used to land here and do
      // nothing but print "use Force fresh" — which is exactly the dead end that
      // made a failed 6am build look like a broken Refresh button. The worker no
      // longer serves an empty doc as a hit (it rebuilds instead), so reaching
      // this point with 0 events means the cheap path genuinely has nothing to
      // give: spend ONE force-fresh to actually get news, rather than leaving the
      // page blank. Once only — if the forced build also comes back empty, the
      // notice stands.
      if(!evs.length&&!forceFresh&&!escalated&&Date.now()-_tbNewsEscalatedAt>NH_ESCALATE_COOLDOWN){
        _tbNewsEscalatedAt=Date.now();
        setNotice('Nothing in cache — running a full rebuild…');
        return refresh(true,true);
      }

      applyBuild({events:evs,generatedAt:j.generatedAt||Date.now(),degraded:!!j.degraded||(evs.length>0&&evs.every(e=>e.aiAnalyzed===false))});
      setLoading(false);
      fetchRateStatus();
      if(!evs.length)setNotice('Build returned no events — sources or AI quota may be down. Try Force fresh again shortly.');
      // Never publish an empty result: the doc write is a full overwrite, so a
      // failed build would erase the last good news off every other device too.
      if(window._fbSaveTBNews&&evs.length){
        const settings={hours,sentFilter,impFilter,selTickers,selSectors,sortBy};
        window._fbSaveTBNews({events:evs,generatedAt:j.generatedAt||Date.now(),settings});
      }
    }catch(e){
      setNotice('Fetch error: '+e.message);
      setLoading(false);
    }
  },[applyBuild,hours,sentFilter,impFilter,selTickers,selSectors,sortBy,newsTickers,fetchRateStatus]);

  /* ── Mount: show what's already built, never kick a build just because the tab
     was opened. cacheOnly=1 is a pure PEEK — it never builds, never takes the
     lock, never spends quota. Order of preference: the worker's cache (freshest,
     written by the 6am cron) → the Firebase copy (already applied above) → an
     actual build, and that last one ONLY when there is nothing at all to show.
     Before this, mount always called refresh(false), which on a cache miss kicked
     a pipeline — that's why opening the News tab was what started the build. ── */
  const peekOrBuild=useCallback(async(fbDoc)=>{
    const fbGen=(fbDoc&&fbDoc.generatedAt)||0;
    const fbCount=(fbDoc&&Array.isArray(fbDoc.events))?fbDoc.events.length:0;
    try{
      const r=await fetch(NH_WORKER_URL+'/news?cacheOnly=1&tickers='+encodeURIComponent(newsTickers.join(',')));
      if(r.ok){
        const j=await r.json().catch(()=>({}));
        // Cache HIT with actual news. An "events: []" document is a build that
        // FAILED, not a hit — treating it as one is what made this return here
        // and leave the tab on "No events loaded" all morning. Fall through to
        // the build path instead.
        if(j&&!j._cacheMiss&&Array.isArray(j.events)&&j.events.length){
          // Adopt it when it's at least as new as the Firebase copy.
          if((j.generatedAt||0)>=fbGen){
            applyBuild({events:j.events,generatedAt:j.generatedAt||Date.now(),degraded:!!j.degraded||j.events.every(e=>e.aiAnalyzed===false)});
            // Publish only a genuinely newer build, and keep the saved filters —
            // the doc write is a full overwrite, so dropping settings would reset
            // the user's filters on every open.
            if(window._fbSaveTBNews&&(j.generatedAt||0)>fbGen){
              const settings=(fbDoc&&fbDoc.settings)||{hours,sentFilter,impFilter,selTickers,selSectors,sortBy};
              window._fbSaveTBNews({events:j.events,generatedAt:j.generatedAt||Date.now(),settings});
            }
          }
          return;
        }
      }
    }catch(e){}
    // Worker cache has nothing usable. Build only if the page would otherwise be
    // blank — an empty News tab is worse than a background build.
    if(!fbCount){ refresh(false); return; }
    // We have news to show, but the cache is empty because the orchestrator's
    // background build is still running — join it so the result lands here.
    // (Watching runs in the manager, so it outlives this tab.)
    if(Date.now()-_tbNewsBuildKickedAt<5*60*1000) tbNewsWatchBuild(newsTickers,fbGen);
  },[newsTickers,refresh,applyBuild,hours,sentFilter,impFilter,selTickers,selSectors,sortBy]);

  /* ── Attach to a build this tab didn't start (kicked by the app-level morning
     orchestrator). Polling is what makes a finished build appear on its own: the
     worker's own "push to Firebase" can't work (App Check blocks worker REST
     writes — see workers/newshub-api/worker.js), so the browser is the only thing
     that can notice the build landed. ── */
  useEffect(()=>{
    const onKick=()=>tbNewsWatchBuild(newsTickers,genRef.current||0);
    /* The orchestrator collected a finished build and wrote it to Firebase. That
       write is this device's OWN, so the cross-device listener deliberately skips
       it — take the events straight off the event instead. */
    const onBuilt=(e)=>{
      const j=e.detail;
      if(!j||!Array.isArray(j.events)||!j.events.length)return;
      applyBuild({events:j.events,generatedAt:j.generatedAt||Date.now(),degraded:!!j.degraded||j.events.every(x=>x.aiAnalyzed===false)});
      setBuilding(false);setLoading(false);setNotice('');
      _tbNewsBuild.stop();
    };
    window.addEventListener('tb-news-building',onKick);
    window.addEventListener('tb-news-built',onBuilt);
    return()=>{
      window.removeEventListener('tb-news-building',onKick);
      window.removeEventListener('tb-news-built',onBuilt);
    };
  },[newsTickers,applyBuild]);

  // NOTE: no stopPolling-on-unmount. Tearing the poll down on a tab switch was
  // exactly what dropped in-flight builds on the floor — the manager keeps it
  // alive and caps itself at NH_MAX_POLLS.

  /* ── Derived ── */
  const watchlist=useMemo(()=>{
    const s=new Set();
    events.forEach(e=>{if(e.primaryTicker)s.add(e.primaryTicker);(e.additionalTickers||[]).forEach(t=>s.add(t));});
    return [...s].sort();
  },[events]);
  const sectorList=useMemo(()=>{
    const s=new Set();
    events.forEach(e=>(e.sectors||[]).forEach(x=>s.add(x)));
    return [...s].sort();
  },[events]);

  const windowed=useMemo(()=>{
    const cutoff=Date.now()-hours*3600*1000;
    return events.filter(e=>(e.ts||0)>=cutoff);
  },[events,hours]);

  const visible=useMemo(()=>{
    let arr=windowed.filter(e=>{
      if(selTickers.length){const m=selTickers.includes(e.primaryTicker)||(e.additionalTickers||[]).some(t=>selTickers.includes(t));if(!m)return false;}
      if(selSectors.length){const m=(e.sectors||[]).some(s=>selSectors.includes(s));if(!m)return false;}
      if(sentFilter!=='all'&&(e.sentiment?.label||'neutral')!==sentFilter)return false;
      const tier=e.impact?.tier||'minor';
      if(impFilter==='critical'&&tier!=='critical')return false;
      if(impFilter==='major'&&!['critical','major'].includes(tier))return false;
      if(impFilter==='important'&&!['critical','major','important'].includes(tier))return false;
      if(impFilter==='notable'&&tier==='minor')return false;
      return true;
    });
    if(sortBy==='time')arr=[...arr].sort((a,b)=>(b.ts||0)-(a.ts||0));
    else arr=[...arr].sort((a,b)=>(b.impact?.score||0)-(a.impact?.score||0)||(b.ts||0)-(a.ts||0));
    return arr;
  },[windowed,selTickers,selSectors,sentFilter,impFilter,sortBy]);

  const counts=useMemo(()=>({
    total:windowed.length,
    critical:windowed.filter(e=>e.impact?.tier==='critical').length,
    major:windowed.filter(e=>e.impact?.tier==='major').length,
    bull:windowed.filter(e=>e.sentiment?.label==='bull').length,
    bear:windowed.filter(e=>e.sentiment?.label==='bear').length,
  }),[windowed]);

  const tickerCounts=useMemo(()=>{const m=new Map();windowed.forEach(e=>{if(e.primaryTicker)m.set(e.primaryTicker,(m.get(e.primaryTicker)||0)+1);(e.additionalTickers||[]).forEach(t=>m.set(t,(m.get(t)||0)+1));});return m;},[windowed]);
  const sectorCounts=useMemo(()=>{const m=new Map();windowed.forEach(e=>(e.sectors||[]).forEach(s=>m.set(s,(m.get(s)||0)+1)));return m;},[windowed]);

  /* Breaking = events fresher than NH_BREAKING_MS (recompute on nowTick). */
  const [nowTick,setNowTick]=useState(0);
  useEffect(()=>{const id=setInterval(()=>setNowTick(x=>x+1),60000);return()=>clearInterval(id);},[]);
  const breakingCount=useMemo(()=>{const c=Date.now()-NH_BREAKING_MS;return windowed.filter(e=>(e.ts||0)>=c).length;},[windowed,nowTick]);

  /* Each watchlist ticker → its single most-important event in-window. Ties a
     price mover to the news that explains it (price-move correlation). */
  const topEventByTicker=useMemo(()=>{
    const m={};
    for(const e of windowed){
      const t=e.primaryTicker;if(!t)continue;
      const sc=e.impact?.score||0;
      if(!m[t]||sc>(m[t].impact?.score||0))m[t]=e;
    }
    return m;
  },[windowed]);

  /* Top Movers — biggest |%| movers on the watchlist, with their top headline. */
  const movers=useMemo(()=>{
    const list=[];
    for(const t of newsTickers){
      const q=quotes[t];
      if(!q||q.dp==null||!isFinite(q.dp))continue;
      list.push({t,c:q.c,dp:q.dp});
    }
    list.sort((a,b)=>Math.abs(b.dp)-Math.abs(a.dp));
    return list.slice(0,6);
  },[quotes,newsTickers]);

  const toggleTicker=(t)=>setSelTickers(p=>p.includes(t)?p.filter(x=>x!==t):[...p,t]);
  const toggleSector=(s)=>setSelSectors(p=>p.includes(s)?p.filter(x=>x!==s):[...p,s]);
  const clearAll=()=>{setSelTickers([]);setSelSectors([]);setSentFilter('all');setImpFilter('all');};
  const hasFilter=sentFilter!=='all'||impFilter!=='all'||selTickers.length>0||selSectors.length>0;

  /* Sectors auto-derived from the shared watchlist — used to prune stale filters. */
  const [secTick,setSecTick]=useState(0);
  useEffect(()=>{const h=()=>setSecTick(x=>x+1);window.addEventListener('tb-sectors-updated',h);tbResolveSectors(newsTickers);return()=>window.removeEventListener('tb-sectors-updated',h);},[newsTickers]);
  const newsSectors=useMemo(()=>{
    const s=new Set();
    newsTickers.forEach(t=>s.add(tbInferSector(t)));
    return [...s].sort();
  },[newsTickers,secTick]);

  /* When the watchlist changes (after hydration), drop events that no
     longer match and pull a fresh cache for the new list. Worker keys cache per
     list, so this is a cheap cache GET unless that list was never built. */
  const tickersKey=newsTickers.join(',');
  const lastTickersKey=useRef(null);
  useEffect(()=>{
    if(!hydrated.current)return;
    if(lastTickersKey.current===null){lastTickersKey.current=tickersKey;return;}
    if(lastTickersKey.current===tickersKey)return;
    lastTickersKey.current=tickersKey;
    // Prune stale events + stale ticker/sector filters so the UI matches.
    const tset=new Set(newsTickers);
    setEvents(prev=>prev.filter(e=>tset_has(tset,e)));
    setSelTickers(p=>p.filter(t=>tset.has(t)));
    setSelSectors(p=>p.filter(s=>newsSectors.includes(s)));
    // Pull the new list's cache (non-fresh = free, no rate-limit burn).
    refresh(false);
  },[tickersKey]);
  function tset_has(set,e){
    if(set.has(e.primaryTicker))return true;
    return (e.additionalTickers||[]).some(t=>set.has(t));
  }

  /* ── Live quotes (price-move correlation). Worker KV-caches ~60s. Polling is
     guarded two ways so it only spends API/requests when it's actually useful:
       • Tab hidden  → don't fetch at all (re-fetches the moment it's visible).
       • Otherwise   → 5min cadence.
  ── */
  const nhFetchQuotes=useCallback(async()=>{
    if(!newsTickers.length)return;
    try{
      const r=await fetch(NH_WORKER_URL+'/quotes?tickers='+encodeURIComponent(newsTickers.join(',')));
      if(!r.ok)return;
      const j=await r.json();
      if(j&&j.quotes){setQuotes(j.quotes);setQuotesAt(j.asOf||Date.now());}
    }catch(e){}
  },[tickersKey]);
  useEffect(()=>{
    let timer=null, stopped=false;
    const tick=async()=>{
      if(stopped)return;
      if(typeof document==='undefined'||!document.hidden)await nhFetchQuotes();
      if(stopped)return;
      const hidden=typeof document!=='undefined'&&document.hidden;
      const delay=hidden?120000:300000;
      timer=setTimeout(tick,delay);
    };
    tick();
    const onVis=()=>{if(!document.hidden)nhFetchQuotes();};
    if(typeof document!=='undefined')document.addEventListener('visibilitychange',onVis);
    return()=>{stopped=true;if(timer)clearTimeout(timer);if(typeof document!=='undefined')document.removeEventListener('visibilitychange',onVis);};
  },[nhFetchQuotes]);

  const canRefresh=rlUsed<NH_DAILY_LIMIT&&rlCooldown<=0&&!loading&&!building;
  const rlRemaining=NH_DAILY_LIMIT-rlUsed;

  /* ── Styles (TB tokens) ── */
  const segWrap={display:'flex',flexWrap:'wrap',background:'var(--s2)',border:'1px solid var(--bd)',borderRadius:8,padding:3,gap:2};
  const segBtn=(on,col)=>({fontFamily:'inherit',fontSize:11,fontWeight:on?800:600,border:'none',background:on?'var(--s1)':'transparent',color:on?(col||'var(--tx)'):'var(--txd)',padding:'6px 10px',borderRadius:6,cursor:'pointer',transition:'all .15s',display:'inline-flex',alignItems:'center',whiteSpace:'nowrap',boxShadow:on?'0 1px 3px var(--shadow)':'none'});
  const chip=(on,faded)=>({fontFamily:"'IBM Plex Mono',monospace",fontSize:11,fontWeight:700,padding:'5px 10px',borderRadius:100,cursor:'pointer',border:'1px solid '+(on?'var(--ac)':'var(--bd)'),background:on?'var(--ac)':'var(--s1)',color:on?'#fff':'var(--txd)',transition:'all .15s',userSelect:'none',display:'inline-flex',alignItems:'center',gap:4,opacity:faded?0.4:1,letterSpacing:0.3});
  const lbl={fontSize:10,fontWeight:900,textTransform:'uppercase',letterSpacing:1.5,color:'var(--txm)',flexShrink:0,whiteSpace:'nowrap'};

  return(<div className="tb-fade-in tb-page-content nh-page" style={{maxWidth:1100,margin:'0 auto'}}>

    {/* Header */}
    <div className="nh-header" style={{display:'flex',alignItems:'flex-start',gap:10,marginBottom:16}}>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:20,fontWeight:800,color:'var(--tx)'}}>News</div>
        <div style={{fontSize:13,color:'var(--txm)',display:'flex',flexWrap:'wrap',alignItems:'center',gap:6}}>
          {building?(
            <span style={{color:'var(--tbw)',fontWeight:500,display:'inline-flex',alignItems:'center',gap:6}}><TBIcon n="refresh"/> Building… polling in {Math.round(NH_POLL_INTERVAL/1000)}s</span>
          ):generatedAt&&events.length>0?(
            <span>Updated {nhTimeAgo(generatedAt)} · {events.length} events</span>
          ):(
            <span>No events loaded — hit Refresh</span>
          )}
          <span style={{fontSize:11,background:'var(--s2)',border:'1px solid var(--bd)',padding:'2px 8px',borderRadius:4,fontFamily:"'IBM Plex Mono',monospace",whiteSpace:'nowrap'}}>
            {rlRemaining}/{NH_DAILY_LIMIT} left today
          </span>
          {rlCooldown>0&&<span style={{fontSize:11,color:'var(--tbw)',whiteSpace:'nowrap',display:'inline-flex',alignItems:'center',gap:5}}><TBIcon n="clock"/> {nhFmtTime(rlCooldown)}</span>}
        </div>
      </div>
      <div className="nh-header-btns" style={{display:'flex',gap:6,flexShrink:0,flexWrap:'wrap'}}>
        <button className="tb-btn-ghost" onClick={()=>refresh(true)} disabled={!canRefresh}
          style={{fontSize:11,opacity:canRefresh?1:0.45}}
          title={!canRefresh?(!rlRemaining?'Daily limit reached':`Wait ${nhFmtTime(rlCooldown)}`):'Force full re-fetch'}>
          <TBIcon n="rotateCcw"/> Force fresh
        </button>
        <button className="tb-btn-primary" onClick={()=>refresh(false)} disabled={loading||building} style={{fontSize:12}}>
          {loading?'Loading…':building?'Building…':<span><TBIcon n="refresh"/> Refresh</span>}
        </button>
      </div>
    </div>

    {notice&&<div className="tb-card" style={{padding:'12px 16px',marginBottom:16,borderLeft:'3px solid var(--ac)',fontSize:13,color:'var(--txd)'}}>{notice}</div>}

    {/* Watchlist is edited in the Control tab now — News just consumes it. */}

    {/* Building indicator */}
    {building&&(
      <div className="tb-card" style={{padding:'14px 18px',marginBottom:16,borderLeft:'3px solid var(--tbw)',display:'flex',alignItems:'center',gap:12}}>
        <TBIcon n="refresh" size={18} style={{animation:'tb-spin 1s linear infinite'}}/>
        <div>
          <div style={{fontWeight:700,color:'var(--tx)',fontSize:13}}>AI pipeline running in background</div>
          <div style={{fontSize:12,color:'var(--txm)',marginTop:2}}>Fetching news from 4 sources + running Gemini analysis. Auto-refreshing every {Math.round(NH_POLL_INTERVAL/1000)}s — takes 30–90s total.</div>
        </div>
      </div>
    )}

    {/* Degraded mode banner — all AI quota exhausted, showing raw headlines */}
    {!building&&degraded&&events.length>0&&(
      <div className="tb-card" style={{padding:'12px 16px',marginBottom:16,borderLeft:'3px solid var(--tbw)',display:'flex',alignItems:'center',gap:12,fontSize:12}}>
        <TBIcon n="alert" size={16}/>
        <div>
          <span style={{fontWeight:700,color:'var(--tbw)'}}>AI quota exhausted</span>
          <span style={{color:'var(--txm)',marginLeft:8}}>Showing raw headlines — no sentiment or impact scoring. AI analysis resumes tomorrow when quotas reset (midnight UTC), or use Force fresh to retry now.</span>
        </div>
      </div>
    )}

    {/* Top Movers — biggest % movers tied to the news that explains them */}
    {movers.length>0&&(
      <div style={{marginBottom:16}}>
        <div style={{display:'flex',alignItems:'baseline',gap:8,marginBottom:8}}>
          <span style={{fontSize:10,fontWeight:900,textTransform:'uppercase',letterSpacing:1.5,color:'var(--txm)'}}>Top Movers</span>
          {quotesAt>0&&<span style={{fontSize:10,color:'var(--txm)'}}>quotes {nhTimeAgo(quotesAt)}</span>}
        </div>
        <div className="nh-movers" style={{display:'grid',gridAutoFlow:'column',gridAutoColumns:'minmax(210px,1fr)',gap:10,overflowX:'auto',paddingBottom:4}}>
          {movers.map(m=>{
            const ev=topEventByTicker[m.t];
            const hl=ev?(nhHeadlines(ev.sources)[0]?.headline||ev.summary):'';
            const on=selTickers.length===1&&selTickers[0]===m.t;
            return(
              <div key={m.t} className="tb-card" onClick={()=>setSelTickers(on?[]:[m.t])}
                style={{padding:'12px 14px',cursor:'pointer',borderLeft:'3px solid '+nhMoveColor(m.dp),outline:on?'2px solid var(--ac)':'none'}}>
                <div style={{display:'flex',alignItems:'baseline',gap:8}}>
                  <span style={{fontFamily:"'IBM Plex Mono',monospace",fontWeight:800,fontSize:14,color:'var(--ac)'}}>{m.t}</span>
                  <span style={{fontFamily:"'IBM Plex Mono',monospace",fontWeight:800,fontSize:13,color:nhMoveColor(m.dp)}}>{m.dp>0?'▲':'▼'} {nhFmtPct(m.dp)}</span>
                  <span style={{marginLeft:'auto',fontFamily:"'IBM Plex Mono',monospace",fontSize:12,color:'var(--txd)'}}>{nhFmtPrice(m.c)}</span>
                </div>
                {hl?(
                  <div style={{fontSize:12,lineHeight:1.4,color:'var(--txm)',marginTop:7,display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical',overflow:'hidden'}}>{hl}</div>
                ):(
                  <div style={{fontSize:11,color:'var(--txm)',marginTop:7,fontStyle:"normal",fontFamily:"var(--font-accent)",opacity:0.7}}>No news in window</div>
                )}
              </div>
            );
          })}
        </div>
      </div>
    )}

    {/* Stats */}
    {events.length>0&&(
      <div className="nh-stats-grid" style={{display:'grid',gridTemplateColumns:'repeat(6,1fr)',gap:8,marginBottom:16}}>
        {[
          {n:counts.total,l:'Events · '+hours+'h',c:'var(--tx)'},
          {n:breakingCount,l:'Breaking',c:'var(--tbw)'},
          {n:counts.critical,l:'Critical',c:'var(--tbr)'},
          {n:counts.major,l:'Major',c:'var(--ac)'},
          {n:counts.bull,l:'Bullish',c:'var(--tbb)'},
          {n:counts.bear,l:'Bearish',c:'var(--tbr)'},
        ].map((s,i)=>(
          <div key={i} className="tb-card" style={{padding:'14px 16px'}}>
            <div style={{fontSize:26,fontWeight:800,fontFamily:"'Manrope',system-ui,-apple-system,sans-serif",lineHeight:1,color:s.c}}>{s.n}</div>
            <div style={{fontSize:10,color:'var(--txm)',fontWeight:700,textTransform:'uppercase',letterSpacing:0.5,marginTop:6}}>{s.l}</div>
          </div>
        ))}
      </div>
    )}

    {/* Active filter bar */}
    {events.length>0&&(
      <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap',marginBottom:14,padding:'8px 12px',background:'transparent',border:'1px solid var(--bd)',borderRadius:8,fontSize:12,color:'var(--txd)'}}>
        <span>Showing <b style={{color:'var(--tx)'}}>{visible.length}</b> of {windowed.length}</span>
        {sentFilter!=='all'&&<span style={{background:'var(--s1)',border:'1px solid var(--bd)',padding:'2px 8px',borderRadius:100,fontWeight:700}}>{NH_SLABEL[sentFilter]} <span onClick={()=>setSentFilter('all')} style={{cursor:'pointer',color:'var(--txm)'}}>×</span></span>}
        {impFilter!=='all'&&<span style={{background:'var(--s1)',border:'1px solid var(--bd)',padding:'2px 8px',borderRadius:100,fontWeight:700}}>{impFilter} <span onClick={()=>setImpFilter('all')} style={{cursor:'pointer',color:'var(--txm)'}}>×</span></span>}
        {selSectors.map(s=><span key={s} style={{background:'var(--s1)',border:'1px solid var(--bd)',padding:'2px 8px',borderRadius:100,fontWeight:700}}>{s} <span onClick={()=>toggleSector(s)} style={{cursor:'pointer',color:'var(--txm)'}}>×</span></span>)}
        {selTickers.map(t=><span key={t} style={{background:'var(--s1)',border:'1px solid var(--bd)',padding:'2px 8px',borderRadius:100,fontWeight:700,fontFamily:"'IBM Plex Mono',monospace"}}>{t} <span onClick={()=>toggleTicker(t)} style={{cursor:'pointer',color:'var(--txm)'}}>×</span></span>)}
        {hasFilter&&<span onClick={clearAll} style={{marginLeft:'auto',color:'var(--ac)',fontWeight:700,cursor:'pointer'}}>Clear all</span>}
      </div>
    )}

    {/* Filters */}
    <div style={{display:'flex',flexDirection:'column',gap:10,marginBottom:18}}>
      <div className="nh-filter-row" style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
        <span className="nh-lbl" style={lbl}>Sort</span>
        <div className="nh-seg" style={segWrap}>
          <button style={segBtn(sortBy==='impact')} onClick={()=>setSortBy('impact')}>By impact</button>
          <button style={segBtn(sortBy==='time')} onClick={()=>setSortBy('time')}>By time</button>
        </div>
        <span style={{flex:1,minWidth:8}}/>
        <span className="nh-lbl" style={lbl}>Window</span>
        <div className="nh-seg" style={segWrap}>
          {[24,48,72].map(h=><button key={h} style={segBtn(hours===h)} onClick={()=>setHours(h)}>{h}h</button>)}
        </div>
      </div>
      <div className="nh-filter-row" style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
        <span className="nh-lbl" style={lbl}>View</span>
        <div className="nh-seg" style={segWrap}>
          <button style={segBtn(sentFilter==='all')} onClick={()=>setSentFilter('all')}>All</button>
          <button style={segBtn(sentFilter==='bull','var(--tbb)')} onClick={()=>setSentFilter('bull')}>Bullish</button>
          <button style={segBtn(sentFilter==='neutral')} onClick={()=>setSentFilter('neutral')}>Neutral</button>
          <button style={segBtn(sentFilter==='bear','var(--tbr)')} onClick={()=>setSentFilter('bear')}>Bearish</button>
        </div>
      </div>
      <div className="nh-filter-row" style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
        <span className="nh-lbl" style={lbl}>Impact</span>
        <div className="nh-seg" style={segWrap}>
          <button style={segBtn(impFilter==='all')} onClick={()=>setImpFilter('all')}>All</button>
          <button style={segBtn(impFilter==='critical','var(--tbr)')} onClick={()=>setImpFilter('critical')}>Critical</button>
          <button style={segBtn(impFilter==='major','var(--ac)')} onClick={()=>setImpFilter('major')}>Major+</button>
          <button style={segBtn(impFilter==='important','var(--tbw)')} onClick={()=>setImpFilter('important')}>Important+</button>
          <button style={segBtn(impFilter==='notable')} onClick={()=>setImpFilter('notable')}>Notable+</button>
        </div>
      </div>
      {sectorList.length>0&&(
        <div className="nh-filter-row" style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
          <span className="nh-lbl" style={lbl}>Sector</span>
          <span style={{...chip(selSectors.length===0),fontFamily:'inherit'}} onClick={()=>setSelSectors([])}>All</span>
          {sectorList.map(s=>{const ct=sectorCounts.get(s)||0;const on=selSectors.includes(s);return(
            <span key={s} style={{...chip(on,events.length>0&&ct===0&&!on),fontFamily:'inherit',fontWeight:600}} onClick={()=>toggleSector(s)}>{s}{ct>0&&<span style={{fontSize:9,opacity:0.7,marginLeft:2}}>{ct}</span>}</span>
          );})}
        </div>
      )}
      {watchlist.length>0&&(
        <div className="nh-filter-row" style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
          <span className="nh-lbl" style={lbl}>Ticker</span>
          <span style={{...chip(selTickers.length===0),fontFamily:'inherit'}} onClick={()=>setSelTickers([])}>All</span>
          {watchlist.map(t=>{const ct=tickerCounts.get(t)||0;const on=selTickers.includes(t);return(
            <span key={t} style={chip(on,events.length>0&&ct===0&&!on)} onClick={()=>toggleTicker(t)}>{t}{ct>0&&<span style={{fontSize:9,opacity:0.7,marginLeft:2}}>{ct}</span>}</span>
          );})}
        </div>
      )}
    </div>

    {/* Loading spinner */}
    {loading&&!building&&(
      <div style={{textAlign:'center',padding:'60px 20px',color:'var(--txm)'}}>
        <div style={{fontSize:13,fontWeight:700}}>Checking cache…</div>
      </div>
    )}

    {/* Empty */}
    {!loading&&visible.length===0&&!building&&(
      <div style={{textAlign:'center',padding:'70px 20px'}}>
        <TBIcon n="sparkle" size={42} style={{marginBottom:14,color:'var(--txm)'}}/>
        <div style={{fontFamily:"'Manrope',system-ui,-apple-system,sans-serif",fontSize:20,fontWeight:700,color:'var(--tx)',marginBottom:8}}>
          {events.length?'No matches':'No events loaded yet'}
        </div>
        <div style={{fontSize:13,color:'var(--txm)',maxWidth:360,margin:'0 auto'}}>
          {events.length?'Adjust or clear filters above.':'Hit Refresh to pull AI-curated news for your watchlist.'}
        </div>
      </div>
    )}

    {/* Event list */}
    {!loading&&visible.length>0&&(
      <div style={{display:'flex',flexDirection:'column',gap:12}}>
        {visible.map(e=>{
          const tier=e.impact?.tier||'minor';
          const tm=NH_TIER_META[tier]||NH_TIER_META.minor;
          const sLabel=e.sentiment?.label||'neutral';
          const score=e.sentiment?.score||0;
          const sources=e.sources||[];
          // Dedupe the SOURCES row by outlet so "Yahoo · Yahoo · Yahoo" collapses to
          // a single link; show up to 3 distinct outlets, with "+N more" for the rest.
          const uniqueSources=[];const seenNames=new Set();
          for(const s of sources){const nm=(s.name||'').trim().toLowerCase();if(!nm||seenNames.has(nm))continue;seenNames.add(nm);uniqueSources.push(s);}
          const shown=uniqueSources.slice(0,3);
          const extra=uniqueSources.length-shown.length;
          const sentCls=sLabel==='bull'?'tb-badge-bull':sLabel==='bear'?'tb-badge-bear':'tb-badge-neutral';
          const q=quotes[e.primaryTicker];
          const hasPct=q&&q.dp!=null&&isFinite(q.dp);
          const breaking=(Date.now()-(e.ts||0))<NH_BREAKING_MS;
          return(
            <div key={e.id} className="tb-card" style={{padding:'16px 18px',borderLeft:'3px solid '+(breaking?'var(--tbw)':tm.c)}}>
              <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:9,flexWrap:'wrap'}}>
                {breaking&&<span style={{fontSize:9,fontWeight:900,letterSpacing:0.7,color:'#fff',background:'var(--tbw)',padding:'3px 8px',borderRadius:100,textTransform:'uppercase',display:'inline-flex',alignItems:'center',gap:4}}><span style={{width:6,height:6,borderRadius:'50%',background:'#fff'}}/>Breaking</span>}
                <span style={{fontFamily:"'IBM Plex Mono',monospace",fontWeight:800,fontSize:13,color:'var(--ac)'}}>{e.primaryTicker}</span>
                {hasPct&&<span title="Today's move" style={{fontFamily:"'IBM Plex Mono',monospace",fontWeight:800,fontSize:11,color:nhMoveColor(q.dp)}}>{q.dp>0?'▲':'▼'} {nhFmtPct(q.dp)}</span>}
                {e.additionalTickers?.length>0&&<span style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:11,color:'var(--txm)',fontWeight:600}}>+ {e.additionalTickers.join(' · ')}</span>}
                {e.sectors?.length>0&&<span style={{fontSize:11,color:'var(--txm)',paddingLeft:8,borderLeft:'1px solid var(--bd)'}}>{e.sectors[0]}</span>}
                {tier!=='minor'&&<span style={{fontSize:10,fontWeight:800,textTransform:'uppercase',letterSpacing:0.6,padding:'3px 9px',borderRadius:100,background:(tier==='critical'||tier==='major')?tm.c:'transparent',color:(tier==='critical'||tier==='major')?'#fff':tm.c,border:(tier==='critical'||tier==='major')?'none':'1px solid '+tm.c,display:'inline-flex',alignItems:'center',gap:4}}>
                  {tm.label}<span style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:9,opacity:0.8,marginLeft:2}}>{e.impact?.score}</span>
                </span>}
                <span className={sentCls} style={{fontSize:10}}>
                  {NH_SLABEL[sLabel]}{score!==0&&<span style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:9,opacity:0.75,marginLeft:3}}>{nhFmtScore(score)}</span>}
                </span>
                {e.eventType&&e.eventType!=='other'&&<span style={{fontSize:10,fontWeight:600,color:'var(--txm)',padding:'2px 8px',border:'1px solid var(--bd)',borderRadius:100,textTransform:'uppercase',letterSpacing:0.5}}>{e.eventType}</span>}
                {e.aiAnalyzed===false&&<span style={{fontSize:9,fontWeight:800,color:'var(--tbw)',padding:'2px 6px',border:'1px solid var(--tbw)',borderRadius:100,letterSpacing:0.5,opacity:0.7}}>RAW</span>}
                <span style={{marginLeft:'auto',fontSize:11,color:'var(--txm)',fontFamily:"'IBM Plex Mono',monospace"}}>{nhTimeAgo(e.ts)}</span>
              </div>
              <div style={{fontSize:15,lineHeight:1.55,color:'var(--tx)',fontWeight:500,fontFamily:"'Manrope',system-ui,-apple-system,sans-serif",marginBottom:11}}>{e.summary}</div>
              <NHHeadlineList sources={sources}/>
              <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap',paddingTop:10,borderTop:'1px dashed var(--bd)',fontSize:11.5,color:'var(--txm)'}}>
                <span style={{fontWeight:800,textTransform:'uppercase',letterSpacing:0.6,fontSize:10}}>Sources</span>
                {shown.map((s,i)=>(<React.Fragment key={i}>
                  {i>0&&<span style={{opacity:0.4}}>·</span>}
                  {/* Outlet names are provenance, not content — they sit a step
                      below the headline in the hierarchy, so grey not white. */}
                  <a href={s.url} target="_blank" rel="noopener noreferrer" style={{color:'var(--txm)',textDecoration:'none',fontWeight:600}}
                    onMouseEnter={ev=>ev.currentTarget.style.color='var(--ac)'}
                    onMouseLeave={ev=>ev.currentTarget.style.color='var(--txm)'}>{s.name}</a>
                </React.Fragment>))}
                {extra>0&&<span>+ {extra} more</span>}
              </div>
            </div>
          );
        })}
      </div>
    )}
  </div>);
}

// ── Catalysts helpers ───────────────────────────────────────────────────────
// Calendar date `offset` days from today, in the DEVICE's own timezone.
// These dates are read by a person looking at the screen -- "is this catalyst
// still ahead of me?", "has the 6am refresh happened yet today?" -- so the day
// has to roll over at the viewer's midnight, not at some fixed zone's. Nothing
// is hardcoded: 'en-CA' is only a formatting trick for YYYY-MM-DD output, and
// omitting timeZone lets Intl resolve the device's own.
function tbLocalDate(offset){
  const d=new Date(Date.now()+(offset||0)*86400000);
  return new Intl.DateTimeFormat('en-CA',{year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
}
// ISO instant for dateStr at hh:mm LOCAL wall-clock. Built from local Date parts,
// which the engine already resolves against the device's zone and its DST rules --
// no offset arithmetic and no zone name to keep in sync.
function tbLocalISO(dateStr,hh,mm){
  const [Y,M,D]=dateStr.split('-').map(Number);
  return new Date(Y,M-1,D,hh,mm,0,0).toISOString();
}
const TB_CAT_COLORS={earnings:'#e7a6b4',inflation:'#e3c794',fed:'#c9b3ec',jobs:'#a6c8e6',growth:'#a6dcb2',macro:'#c0c6cd',rates:'#c9b3ec',gdp:'#a6dcb2',retail:'#a6dcb2',housing:'#a3dcc6',sentiment:'#e3cb98',trade:'#edb2a6',oil:'#e3bd96',ecb:'#9db1e8',holiday:'#b0b9cc'};
const tbCatColor=c=>TB_CAT_COLORS[String(c||'').toLowerCase()]||'#adadb2';
// Macro market-impact pill (importance tier from the worker). Soft pastels that
// match index.html's MC_IMP exactly, so the same event reads identically in the
// Catalysts tab and on both TaskHubs. Sentence case, not shouted caps.
const TB_IMP={high:{c:'#f85149',t:'High'},medium:{c:'#E2C285',t:'Med'},low:{c:'#adadb2',t:'Low'}};
// Category chips arrive lowercase from the worker ('earnings', 'inflation', …);
// title-case them for display rather than uppercasing the whole label.
const tbCatLabel=c=>{const s=String(c||'');return s?s.charAt(0).toUpperCase()+s.slice(1):s;};
function tbFmtLocal(iso){ if(!iso) return ''; const d=new Date(iso); let h=d.getHours(); const m=d.getMinutes(); const ap=h<12?'AM':'PM'; h=h%12||12; return h+':'+(m<10?'0':'')+m+' '+ap; }
// Standard macro release time (ET) by name/category. Mirrors index.html's
// mcMacroET so the Catalysts tab and both TaskHubs agree to the minute. ECB
// announces at 14:15 CET (= 8:15 AM ET year-round); Fed 2:00 PM ET; EIA 10:30;
// sentiment/ISM/PMI 10:00; most US releases 8:30 AM ET. Earnings/holidays: none.
function tbMacroET(e){
  if(!e||e.kind==='earnings'||e.kind==='holiday')return null;
  const n=((e.name||'')+' '+(e.category||'')).toLowerCase();
  if(e.category==='ecb'||/\becb\b|european central bank/.test(n))return{hh:8,mm:15}; // ECB: 14:15 CET = 8:15 AM ET
  if(/fomc|rate decision|fed funds|interest rate|fed minutes|meeting minutes/.test(n))return{hh:14,mm:0};   // Fed: 2:00 PM ET
  if(e.category==='fed'||e.category==='rates')return{hh:14,mm:0};
  if(e.category==='oil'||e.category==='energy'||/crude|petroleum|\beia\b|oil inventories|natural gas storage/.test(n))return{hh:10,mm:30}; // EIA: 10:30 AM ET
  if(/sentiment|michigan|umich|\bism\b|\bpmi\b|jolts|job openings|consumer confidence|existing home|new home sales|factory orders|business inventories|construction spending|wholesale|leading index/.test(n))return{hh:10,mm:0}; // 10:00 AM ET
  if(e.category==='sentiment')return{hh:10,mm:0};
  if(e.kind==='macro'||['inflation','jobs','growth','gdp','retail','housing','trade'].indexOf(e.category)>=0)return{hh:8,mm:30};        // most releases: 8:30 AM ET
  return null;
}
// ET release time → the VIEWER'S local wall-clock "h:mm AM/PM" (DST-safe via tbNyTs).
function tbMacroTimeLocal(e){const t=tbMacroET(e);if(!t)return'';try{return new Date(tbNyTs(e.date,t.hh,t.mm)).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});}catch(_){return'';}}

// ── Shared calendar builder ─────────────────────────────────────────────────
// Fetch + poll + merge-fallback + de-dup, returning {future,degraded}. Used by
// both the manual Refresh/Force button (below) and the app-level auto-force
// scheduler so the two paths can never drift apart. No React state here.
async function tbBuildCalendar(wl,opts){
  opts=opts||{};
  wl=(wl&&wl.length)?wl:NH_DEFAULT_TICKERS;
  const tq='tickers='+encodeURIComponent(wl.join(','))+'&days=30'+(opts.force?'&fresh=1':'');
  const url=NH_WORKER_URL+'/calendar?'+tq;
  let j=null;
  // Poll for as long as the worker keeps answering "building". The old 20-try cap
  // gave up after 60s, which is shorter than the 6am cron's own run — so opening
  // TradeHub inside that window timed out instead of simply collecting the cron's
  // build. The worker holds its lock for the whole cron invocation now, so waiting
  // is the correct behaviour; this only ever runs while a build is genuinely live.
  const deadline=Date.now()+(opts.waitMs||4*60*1000);
  while(Date.now()<deadline){
    const r=await fetch(url);
    if(r.status===429){const jj=await r.json().catch(()=>({}));const e=new Error(jj.reason||'Rate limited — try later.');e.rateLimited=true;throw e;}
    if(r.status===202){await new Promise(res=>setTimeout(res,3000));continue;}
    j=await r.json();
    if(j&&j.status==='building'){await new Promise(res=>setTimeout(res,3000));j=null;continue;}
    break;
  }
  if(!j){const e=new Error('Build timed out.');e.timedOut=true;throw e;}
  const evs=Array.isArray(j.events)?j.events:[];
  const today=tbLocalDate(0);
  // newshub provides ACCURATE, real-dated macro + earnings. Only fall back to the
  // trade-dashboard COMPUTED calendar when newshub returns NO macro at all.
  let merged=evs;
  const hasMacro=evs.some(e=>e&&e.kind==='macro');
  if(!hasMacro){
    try{
      const tdq='tickers='+encodeURIComponent(wl.join(','))+'&days=30';
      const tdr=await fetch('https://trade-dashboard.av1.workers.dev/calendar?'+tdq);
      if(tdr.ok){
        const tdj=await tdr.json();
        const tdEvents=(Array.isArray(tdj.events)?tdj.events:[]).filter(e=>e&&e.kind!=='earnings');
        const seen=new Set(evs.map(e=>e&&((e.kind==='earnings'?'earn':'macro')+'|'+(e.category||e.kind||'')+'|'+e.date)));
        for(const e of tdEvents){const k='macro|'+(e.category||e.kind||'')+'|'+e.date;if(!seen.has(k)){seen.add(k);merged.push(e);}}
      }
    }catch(e){}
  }
  // de-dup earnings across any source by ticker+date
  const dseen=new Set();
  merged=merged.filter(e=>{if(!e)return false;const nm=(e.name||'');const tick=(nm.match(/^[A-Z]{1,5}\b/)||[])[0];const k=((e.kind==='earnings'||/earnings/i.test(nm))?'earn|'+(tick||nm):'ev|'+nm)+'|'+e.date;if(dseen.has(k))return false;dseen.add(k);return true;});
  const future=merged.filter(e=>e&&e.date>=today).sort((a,b)=>a.date.localeCompare(b.date));
  return {future,degraded:!!(j&&j.degraded)};
}

// ── Publish the calendar to the shared Firebase doc ──────────────────────────
// A build only ever returns TODAY-ONWARD events, but Tony's and Veda's TaskHubs
// read this same doc to draw their macro cards. Saving just the future set would
// DELETE yesterday's macros the moment a day rolled over, so the cards vanished
// from those grids instead of dimming like task/event cards do. Keep the past
// events already in the doc (trimmed to a retention window so it can't grow
// forever) and union them with the fresh future set.
const TB_CAL_KEEP_PAST_DAYS=90;
// Order-independent signature of the ticker list a calendar was built from. Stored
// on the doc so any device can tell "this calendar predates my current watchlist"
// and rebuild — see tbSyncCatalystsToWatchlist.
function tbCalWlSig(wl){ return (Array.isArray(wl)?wl:[]).filter(Boolean).map(t=>String(t).toUpperCase()).sort().join(','); }
// Is this an earnings event? Macro comes from a hardcoded schedule in the worker and
// is therefore ALWAYS present, so `events.length > 0` says nothing about whether the
// earnings providers (Finnhub / Nasdaq / AlphaVantage) actually answered. Only an
// earnings COUNT can tell a real calendar from a macro-only shell.
const tbCalIsEarn=e=>!!e&&(e.kind==='earnings'||/earnings/i.test(e.name||''));
const tbCalEarnCount=list=>(Array.isArray(list)?list:[]).filter(tbCalIsEarn).length;
// Publish a freshly-built forward window to the shared doc. Returns the future set
// that was ACTUALLY stored (which may differ from `future` — see the safety net), or
// null if nothing was written.
async function tbPublishCalendar(future,wl){
  if(!window._fbSaveMarketCal)return null;
  const today=tbLocalDate(0),cutoff=tbLocalDate(-TB_CAL_KEEP_PAST_DAYS);
  const wlList=(Array.isArray(wl)&&wl.length)?wl:tbLoadWatchlistLocal();
  const wlSet=new Set(wlList.map(t=>String(t).toUpperCase()));
  const onWl=e=>!(e.ticker&&!wlSet.has(String(e.ticker).toUpperCase()));
  let stored=[],past=[];
  try{
    const d=window._fbLoadMarketCal?await window._fbLoadMarketCal():null;
    stored=(d&&Array.isArray(d.events))?d.events:[];
    past=stored.filter(e=>e&&e.date&&e.date<today&&e.date>=cutoff)
      // Retained past events are how macro cards keep showing on both TaskHubs after
      // the day rolls over — but an EARNINGS event for a ticker you've since removed
      // from Control has no reason to linger, and nothing else ever deletes it (a
      // rebuild only replaces the forward window). Drop those here so removing a
      // ticker actually clears it out of Catalysts.
      .filter(e=>!(e.kind==='earnings'&&e.ticker&&!wlSet.has(String(e.ticker).toUpperCase())));
  }catch(e){}
  let fresh=future||[];
  // ── EARNINGS SAFETY NET ────────────────────────────────────────────────────
  // A build replaces the whole FORWARD window, so a run whose earnings providers
  // all came back empty (rate-limited Finnhub, Nasdaq's 8s abort, AlphaVantage
  // quota) used to publish a macro-only calendar over a perfectly good one — and
  // that silently deleted every earnings date from Catalysts AND from both
  // TaskHubs, with Force the only way to get them back. Zero earnings from a
  // watchlist this size is never a real answer, so carry the stored ones through
  // instead of deleting them. This is transient by design: the next build that
  // DOES return earnings has a non-zero count, skips this branch, and replaces
  // the forward window wholesale — so carried-over dates can't accumulate or go
  // stale.
  let keptEarnings=0;
  if(!tbCalEarnCount(fresh)){
    const survivors=stored.filter(e=>e&&e.date>=today&&tbCalIsEarn(e)&&onWl(e));
    if(survivors.length){ fresh=survivors.concat(fresh); keptEarnings=survivors.length; }
  }
  const key=e=>e.id||((e.kind||'')+'|'+(e.category||'')+'|'+(e.name||'')+'|'+e.date);
  const seen=new Set(fresh.map(key));
  const events=past.filter(e=>!seen.has(key(e))).concat(fresh).sort((a,b)=>a.date.localeCompare(b.date));
  const now=Date.now();
  window._fbSaveMarketCal({events,watchlist:wlList,generatedAt:now,savedAt:now});
  if(keptEarnings)console.warn(`[catalysts] build returned 0 earnings — kept ${keptEarnings} existing earnings date(s) rather than wiping them.`);
  return fresh.slice().sort((a,b)=>a.date.localeCompare(b.date));
}

// ── Keep Catalysts in lockstep with the Control-tab watchlist ────────────────
// Catalysts only ever rebuilt on a manual Refresh/Force or the once-a-morning
// orchestrator tick — and that tick short-circuits as soon as the stored calendar
// is newer than today's 6am slot. So a ticker added (or removed) in Control could
// sit there for days with no earnings date pulled: the calendar was "fresh enough"
// even though it was built from a DIFFERENT ticker list. Compare the list the doc
// was built from against the live one and rebuild whenever they differ. Cheap: the
// worker caches per watchlist-hash, so this is one build per actual list change,
// and it costs nothing from the daily force-fresh budget (force is never set).
async function tbSyncCatalystsToWatchlist(wl){
  if(!wl||!wl.length||!window._fbLoadMarketCal)return;
  if(_tbCatBuild.building)return;
  const sig=tbCalWlSig(wl);
  if(sig===_tbCatLastSyncedSig)return;              // already handled this list
  let d=null;
  try{ d=await window._fbLoadMarketCal(); }catch(e){ return; }
  // No doc yet → leave it to the morning orchestrator / manual Refresh; there's
  // nothing to compare against and no reason to race them.
  if(!d||!Array.isArray(d.events))return;
  // A doc with no recorded watchlist predates this check, so it CANNOT be assumed
  // to match — rebuild once to stamp the current list onto it, which is what arms
  // the mismatch detection for every later edit. Note this one-time pass usually
  // comes back as a worker cache HIT (same ticker-set → same cal:v1 key, 12h TTL),
  // so it re-publishes the same events; only Force rebuilds a same-day calendar
  // from scratch. A genuine list change gets a new key and a real build.
  if(Array.isArray(d.watchlist)&&tbCalWlSig(d.watchlist)===sig){ _tbCatLastSyncedSig=sig; return; }
  _tbCatLastSyncedSig=sig;                          // don't re-kick while this runs
  tbRunCatBuild(wl,false);
}
let _tbCatLastSyncedSig='';

// Most-recent 6:00 AM in the DEVICE'S OWN zone, EVERY calendar day — weekends
// and market holidays included. Returns a ms timestamp at or before now.
//
// THE single refresh boundary for the whole app: Catalysts, News, Portfolio and the
// Journal Webull sync all run off this one slot, so opening TradeHub on any day —
// Saturday, Sunday, Thanksgiving — shows data collected that morning.
//
// There used to be a second, trading-day-only slot powering News/Portfolio/Journal.
// It returned the most recent TRADING morning, so all weekend (and through a holiday)
// it kept handing back Friday's slot — a value those guards already recorded on
// Friday, so the refresh silently no-opped and the app sat on data that aged out day
// by day. Weekends are not empty: news breaks, the forward 30-day calendar shifts,
// Sunday-night positions and fees still need to be reconciled. The newshub cron
// pre-warms news + calendar Mon-Sun (workers/newshub-api/wrangler.toml), so there is
// a fresh build waiting every morning — the browser just has to collect and publish
// it, since App Check blocks the worker's own Firebase push (see
// pushMarketCalToFirebase in worker.js).
function tbLastMorningSlot(){
  const now=Date.now();
  for(let back=0;back<3;back++){
    const ts=new Date(tbLocalISO(tbLocalDate(-back),6,0)).getTime();
    if(ts<=now) return ts;              // today's 6am, or yesterday's before 6am
  }
  return 0;
}
let _tbAutoForceInFlight=false;
let _tbLastCheckedSlot=0;
// When the morning orchestrator kicked a background news build (ms). Lets the News
// tab pick the build up — spinner + polling — whether it was already open when the
// kick happened or is opened while it's still running.
let _tbNewsBuildKickedAt=0;

// ── Module-level catalyst build manager ──────────────────────────────────────
// Force / Refresh runs HERE (not inside the React component) so a build KEEPS
// RUNNING when you leave the Catalysts tab — and the buttons stay locked until
// it finishes, even after you navigate away and back (the tab remounts but reads
// this live state). On completion it saves to Firebase; a mounted tab reflects
// the result via its subscription, a remounted tab loads it from Firebase.
const _tbCatBuild = {
  building:false,
  last:null,               // {future,degraded,at} — what the last finished build stored
  notice:'', noticeAt:0,   // and how it ended, so a tab opened later still explains itself
  listeners:new Set(),
  sub(fn){ this.listeners.add(fn); return ()=>this.listeners.delete(fn); },
  emit(evt){ this.listeners.forEach(fn=>{ try{ fn(evt); }catch(e){} }); },
  note(msg){ this.notice=msg||''; this.noticeAt=msg?Date.now():0; this.emit({type:'notice',message:this.notice}); },
};
const TB_CAT_NOTICE_TTL=5*60*1000;
async function tbRunCatBuild(wl, force){
  if(_tbCatBuild.building) return {ok:false,busy:true};   // one build at a time
  wl=(wl&&wl.length)?wl:NH_DEFAULT_TICKERS;
  _tbCatBuild.building=true; _tbJobs.set('catalysts','Building…'); _tbCatBuild.emit({type:'start'});
  try{
    let {future,degraded}=await tbBuildCalendar(wl,{force});
    // ── SELF-HEAL: no earnings → escalate to a real Force, once. ──────────────
    // The worker caches a calendar for 12h under a per-day key, so a build that
    // lost its earnings providers poisons every later plain Refresh for the rest
    // of the day — which is why the fix used to be "hit Force by hand". Do that
    // automatically: fresh=1 bypasses the cache and rebuilds from the providers.
    // Only ever ONE escalation per build, and only when earnings are actually
    // missing, so a healthy morning still costs nothing from the daily budget.
    if(!force&&!tbCalEarnCount(future)){
      console.warn('[catalysts] build returned 0 earnings — escalating to a forced rebuild.');
      try{ const r2=await tbBuildCalendar(wl,{force:true}); if(tbCalEarnCount(r2.future)){ future=r2.future; degraded=r2.degraded; } }
      catch(e){ console.warn('[catalysts] forced rebuild failed:',e&&e.message); }
    }
    let stored=future||[];
    if(future&&future.length){
      // Publishing can carry existing earnings through a bad build, so render what
      // was actually STORED — otherwise the on-screen list and the shared doc (and
      // therefore both TaskHubs) would disagree.
      stored=(await tbPublishCalendar(future,wl))||future;
      _tbCatLastSyncedSig=tbCalWlSig(wl);    // this list is now what the stored calendar reflects
    }
    /* Keep the finished build on the manager: the Firebase write is debounced, so
       a tab reopened seconds later would otherwise read the PREVIOUS doc back out
       of Firestore and show the old calendar until something else refreshed it. */
    _tbCatBuild.last={future:stored,degraded:!!degraded,at:Date.now()};
    _tbCatBuild.emit({type:'done',future:stored,degraded:!!degraded});
    // `earnings` counts what's actually STORED (what the user sees); `builtEarnings`
    // counts what THIS build produced. They differ exactly when the safety net kept
    // existing dates alive through a failed build — and the morning orchestrator has
    // to gate on the latter, or a day rescued by carried-over dates would be marked
    // complete and never pick up a newly-announced earnings date.
    return {ok:true,future:stored,degraded:!!degraded,
            earnings:tbCalEarnCount(stored),builtEarnings:tbCalEarnCount(future)};
  }catch(e){
    _tbCatBuild.emit({type:'error',error:e});
    return {ok:false,error:e};
  }finally{
    _tbCatBuild.building=false; _tbJobs.set('catalysts',''); _tbCatBuild.emit({type:'end'});
  }
}

function TBCatalystsPage({watchlist=NH_DEFAULT_TICKERS}){
  const [events,setEvents]=useState([]);
  // Init from the module-level manager so buttons are locked on remount if a
  // background build is still running.
  const [loading,setLoading]=useState(()=>_tbCatBuild.building);
  /* Notices go through the manager too, so a build that ended while you were on
     another tab still tells you how it went when you come back. */
  const [notice,setNoticeState]=useState(()=>(_tbCatBuild.notice&&Date.now()-_tbCatBuild.noticeAt<TB_CAT_NOTICE_TTL)?_tbCatBuild.notice:'');
  const setNotice=useCallback(m=>{_tbCatBuild.note(m);setNoticeState(m);},[]);
  const [lastSync,setLastSync]=useState(null);
  const eventsRef=useRef([]); const wlRef=useRef(watchlist); const didAuto=useRef(false);
  useEffect(()=>{eventsRef.current=events;},[events]);
  // Keep the ref in sync with the shared watchlist prop (used by refresh()).
  useEffect(()=>{wlRef.current=watchlist;},[watchlist]);

  // Refresh / Force just kick the module-level manager — it keeps running even if
  // this component unmounts (tab switch). Results arrive via the subscription below.
  const refresh=useCallback((force,wlOverride)=>{
    const wl=wlOverride||wlRef.current||NH_DEFAULT_TICKERS;
    tbRunCatBuild(wl,force);
  },[]);

  // Subscribe to the manager: keep the buttons locked while a build runs and apply
  // the result when it finishes (whether this tab was mounted the whole time or not).
  useEffect(()=>{
    setLoading(_tbCatBuild.building);
    return _tbCatBuild.sub((evt)=>{
      if(evt.type==='start'){ setLoading(true); setNotice(''); }
      else if(evt.type==='end'){ setLoading(false); }
      else if(evt.type==='notice'){ setNoticeState(evt.message||''); }
      else if(evt.type==='done'){
        const today=tbLocalDate(0);
        const prev=(eventsRef.current||[]).filter(e=>e&&e.date>=today);
        const prevCount=prev.length;
        // Guard: a DEGRADED build with fewer events than we already have is likely
        // partial — keep the richer cached set instead of wiping it. Same for ANY
        // build that came back empty: nothing was published in that case (see
        // tbRunCatBuild), so blanking the list would just misreport the stored doc.
        if(prevCount&&(!evt.future.length||(evt.degraded&&evt.future.length<prevCount))){
          setNotice('Sources partial right now — kept your last full calendar. Try Force again in a bit.');
          return;
        }
        // Same idea one level down: the forward window can be full of macro yet have
        // lost every earnings date. tbPublishCalendar already refuses to write that
        // over good data, so mirror its decision here instead of showing the gap.
        if(prevCount&&!tbCalEarnCount(evt.future)&&tbCalEarnCount(prev)){
          setNotice('Earnings sources are unavailable right now — kept your existing earnings dates.');
          return;
        }
        const fut=(evt.future||[]).filter(e=>e&&e.date>=today);
        setEvents(fut); eventsRef.current=fut; setLastSync(Date.now());
        if(!fut.length)setNotice(evt.degraded?'Sources empty right now — try Force in a bit.':'No catalysts in the next 30 days.');
      }
      else if(evt.type==='error'){
        const e=evt.error||{};
        setNotice(e.rateLimited?e.message:e.timedOut?e.message:'Network error: '+(e.message||'unknown'));
      }
    });
  },[]);

  useEffect(()=>{
    const doLoad=async()=>{
      let fbGen=0;
      try{
        if(window._fbLoadMarketCal){const d=await window._fbLoadMarketCal();if(d&&Array.isArray(d.events)){const today=tbLocalDate(0);const fut=d.events.filter(e=>e&&e.date>=today);setEvents(fut);eventsRef.current=fut;setLastSync(d.generatedAt||d.savedAt||null);fbGen=d.generatedAt||d.savedAt||0;
          // One-time cleanup: nuke any catalyst reminder docs from the old push
          // flow (ids == event ids) so no 6:30 AM notification ever fires again.
          if(window._fbDeleteReminder){for(const e of (d.events||[])){if(e&&e.id){try{await window._fbDeleteReminder(e.id);}catch(_e){}}}}
        }}
        // A build that finished while this tab was closed may not have reached
        // Firebase yet (that write is debounced) — prefer the manager's copy so
        // reopening the tab shows the calendar you just built, not the old one.
        const lb=_tbCatBuild.last;
        if(lb&&lb.at>fbGen&&Array.isArray(lb.future)){
          const today=tbLocalDate(0);
          const fut=lb.future.filter(e=>e&&e.date>=today);
          if(fut.length){setEvents(fut);eventsRef.current=fut;setLastSync(lb.at);}
        }
      }catch(e){}
      // No auto-refresh on tab open — only load cached events from Firebase.
      // Fresh fetch happens ONLY when the user hits Refresh / Force.
      didAuto.current=true;
    };
    if(window._fbReady)doLoad();else{const h=()=>doLoad();window.addEventListener('fb-ready',h,{once:true});return()=>window.removeEventListener('fb-ready',h);}
  },[]);

  useEffect(()=>{
    const onCal=e=>{if(e.detail&&Array.isArray(e.detail.events)){const today=tbLocalDate(0);const fut=e.detail.events.filter(x=>x&&x.date>=today);setEvents(fut);eventsRef.current=fut;setLastSync(e.detail.generatedAt||e.detail.savedAt||null);}};
    window.addEventListener('fb-tb-marketcal-remote',onCal);
    return()=>window.removeEventListener('fb-tb-marketcal-remote',onCal);
  },[]);

  const groups=useMemo(()=>{const g={};events.forEach(e=>{(g[e.date]=g[e.date]||[]).push(e);});return Object.keys(g).sort().map(d=>({date:d,items:g[d]}));},[events]);
  // Years whose macro dates are AI-estimated (official schedule not yet hardcoded).
  const approxYears=useMemo(()=>[...new Set(events.filter(e=>e&&e.approx).map(e=>String(e.date).slice(0,4)))].sort(),[events]);

  return (<div className="tb-fade-in" style={{maxWidth:1100,margin:'0 auto'}}>
    <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:16,flexWrap:'wrap',gap:8}}>
      <div>
        <div style={{fontSize:20,fontWeight:800,color:'var(--tx)'}}>Catalysts</div>
        <div style={{fontSize:12,color:'var(--txm)',marginTop:2}}>Earnings + macro · next 30 days · {watchlist.length} tickers · auto-synced to TaskHub</div>
      </div>
      <div style={{display:'flex',gap:8}}>
        <button onClick={()=>refresh(false)} disabled={loading} style={{padding:'8px 16px',borderRadius:100,border:'1px solid var(--bd)',background:'var(--s2)',color:'var(--tx)',fontSize:13,fontWeight:700,cursor:loading?'default':'pointer',opacity:loading?.5:1}}>{loading?'Loading…':'↻ Refresh'}</button>
        <button className="tb-btn-primary" onClick={()=>refresh(true)} disabled={loading}>Force</button>
      </div>
    </div>
    {notice&&<div className="tb-card" style={{marginBottom:12,fontSize:12,color:'var(--txm)'}}>{notice}</div>}
    {lastSync&&<div style={{fontSize:11,color:'var(--txm)',marginBottom:10}}>Last updated {new Date(lastSync).toLocaleString([],{dateStyle:'short',timeStyle:'short'})}</div>}
    {(()=>{
      // Year-end (Dec, lingering into Jan): if next year's macro still isn't hardcoded,
      // show a dedicated "annual update due" reminder. Self-clears once it's hardcoded
      // (those events stop being AI-estimated), and recurs automatically every December.
      const et=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',year:'numeric',month:'numeric'}).formatToParts(new Date()).reduce((a,x)=>{a[x.type]=x.value;return a},{});
      const etM=+et.month, etY=+et.year;
      const targetYear=etM>=11?etY+1:etY;                 // Nov+ → next year is the one to hardcode
      const updateDue=(etM>=11||etM<=1)&&approxYears.includes(String(targetYear));
      if(updateDue) return (<div className="tb-card" style={{marginBottom:12,padding:'11px 15px',borderLeft:'3px solid #e0b57c',background:'rgba(224,181,124,0.06)',fontSize:12.5,color:'var(--txd)',lineHeight:1.6}}>
        <b style={{color:'#e0b57c',display:'inline-flex',alignItems:'center',gap:6}}><TBIcon n="calendar" size={13}/>Annual macro update due ({targetYear})</b> — the {targetYear} release schedule (CPI, jobs, FOMC…) isn't hardcoded yet, so those dates are AI-estimated. The official BLS / BEA / Fed schedules are published now — time to hardcode {targetYear} in the newshub worker for exact dates.
      </div>);
      if(approxYears.length>0) return (<div className="tb-card" style={{marginBottom:12,padding:'10px 14px',borderLeft:'3px solid #e0b57c',fontSize:12,color:'var(--txd)',lineHeight:1.55}}>
        <b style={{color:'#e0b57c',display:'inline-flex',alignItems:'center',gap:6}}><TBIcon n="alert" size={13}/>AI-estimated dates</b> — official macro release schedules for {approxYears.join(', ')} aren't published yet, so events tagged <b>(approx)</b> are AI-estimated and may shift a day or two. Earnings and market holidays are exact.
      </div>);
      return null;
    })()}
    {groups.length===0&&!loading&&<div className="tb-card" style={{textAlign:'center',color:'var(--txm)',padding:'32px 16px'}}>No catalysts yet — hit Refresh.</div>}
    {groups.map(g=>(<div key={g.date} className="tb-card" style={{marginBottom:10,padding:'12px 16px'}}>
      <div style={{fontSize:12,fontWeight:700,color:'var(--txd)',marginBottom:6}}>{new Date(g.date+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}</div>
      {g.items.map(ev=>(<div key={ev.id} style={{display:'flex',alignItems:'center',gap:10,padding:'7px 0',borderTop:'1px solid var(--bd)'}}>
        <span style={{fontSize:10,fontWeight:500,letterSpacing:.2,color:tbCatColor(ev.category||ev.kind),background:'transparent',border:'1px solid '+(tbCatColor(ev.category||ev.kind)+'55'),borderRadius:5,padding:'2px 8px',whiteSpace:'nowrap'}}>{tbCatLabel(ev.category||ev.kind)}</span>
        {(()=>{const tm=tbMacroTimeLocal(ev);return tm?<span title="Release time (your local zone)" style={{fontSize:11,fontWeight:700,color:'var(--txm)',whiteSpace:'nowrap',flexShrink:0}}>{tm}</span>:null;})()}
        <span style={{fontSize:13,color:'var(--tx)',flex:1}}>{ev.name}{ev.kind==='earnings'&&ev.when?(<span style={{color:'var(--txm)',fontSize:11}}> · {ev.when==='amc'?'after close':ev.when==='bmo'?'before open':ev.when}</span>):null}{ev.kind==='earnings'&&ev.confirmed===false?(<span title="Date not confirmed by a second source — may shift" style={{marginLeft:6,fontSize:10,fontWeight:500,letterSpacing:.2,color:'var(--txm)',border:'1px solid var(--bd)',borderRadius:5,padding:'1px 6px',verticalAlign:'middle'}}>Est.</span>):null}</span>
        {ev.importance&&TB_IMP[ev.importance]?(<span title={'Market impact: '+ev.importance} style={{fontSize:10,fontWeight:500,letterSpacing:.2,color:TB_IMP[ev.importance].c,background:'transparent',border:'1px solid '+(TB_IMP[ev.importance].c+'55'),borderRadius:5,padding:'2px 8px',whiteSpace:'nowrap',flexShrink:0}}>{TB_IMP[ev.importance].t}</span>):null}
      </div>))}
    </div>))}
  </div>);
}

/* ══════════════════════════════════════════════════════════════════════════════
   PLAYBOOK — editable pages of trading documentation (rules, strategies, notes).
   Pages are stored as sanitized HTML and synced through the same Firebase +
   "Syncing / Synced" pipeline as the rest of TradeHub.

   Three converters power it, all self-contained (the app ships no markdown lib):
     tbMdToHtml    — markdown SOURCE text → HTML   (pasting raw markdown)
     tbSanitizeHtml— untrusted HTML → safe HTML    (pasting rendered content)
     tbHtmlToMd    — stored HTML → markdown        (what Trading Auto Launch shows)
   ══════════════════════════════════════════════════════════════════════════════ */

const tbEscHtml=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* Inline markdown: code spans are extracted FIRST so their contents are never
   re-parsed for emphasis (`**x**` inside code must stay literal). */
function tbMdInline(src){
  let t=tbEscHtml(src);
  const spans=[];
  t=t.replace(/`([^`]+)`/g,(m,c)=>{spans.push(c);return '\u0000'+(spans.length-1)+'\u0000';});
  t=t.replace(/!\[([^\]]*)\]\(([^)\s]+)[^)]*\)/g,(m,alt,src2)=>'<img src="'+src2+'" alt="'+alt+'">');
  t=t.replace(/\[([^\]]+)\]\(([^)\s]+)[^)]*\)/g,'<a href="$2">$1</a>');
  t=t.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2">$2</a>');
  t=t.replace(/\*\*\*([^*]+)\*\*\*/g,'<strong><em>$1</em></strong>');
  t=t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  t=t.replace(/(^|[^\w*])\*([^*\n]+)\*(?!\*)/g,'$1<em>$2</em>');
  t=t.replace(/___([^_]+)___/g,'<strong><em>$1</em></strong>');
  t=t.replace(/__([^_]+)__/g,'<strong>$1</strong>');
  t=t.replace(/(^|[^\w_])_([^_\n]+)_(?!_)/g,'$1<em>$2</em>');
  t=t.replace(/~~([^~]+)~~/g,'<del>$1</del>');
  t=t.replace(/\u0000(\d+)\u0000/g,(m,i)=>'<code>'+spans[+i]+'</code>');
  return t;
}

/* Block-level markdown. Covers what a pasted trading doc actually contains:
   headings, fenced code, tables, blockquotes, rules, nested bullet/numbered
   lists, paragraphs. Output always goes through tbSanitizeHtml before it hits
   the DOM, so this function never has to be defensive about the input. */
function tbMdToHtml(md){
  const lines=String(md||'').replace(/\r\n?/g,'\n').replace(/\t/g,'    ').split('\n');
  const out=[];
  const stack=[];              // open lists: {tag,indent}
  let para=[];
