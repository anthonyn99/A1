  const flushPara=()=>{ if(para.length){ out.push('<p>'+tbMdInline(para.join('\n')).replace(/\n/g,'<br>')+'</p>'); para=[]; } };
  const closeAll=()=>{ while(stack.length) out.push('</'+stack.pop().tag+'>'); };

  for(let i=0;i<lines.length;i++){
    const line=lines[i], trimmed=line.trim();

    const fence=/^(```|~~~)/.exec(trimmed);
    if(fence){
      flushPara(); closeAll();
      const marker=fence[1], buf=[];
      for(i++;i<lines.length && lines[i].trim().indexOf(marker)!==0;i++) buf.push(lines[i]);
      out.push('<pre><code>'+tbEscHtml(buf.join('\n'))+'</code></pre>');
      continue;
    }
    if(!trimmed){ flushPara(); closeAll(); continue; }
    if(/^(\*\s*){3,}$|^(-\s*){3,}$|^(_\s*){3,}$/.test(trimmed)){ flushPara(); closeAll(); out.push('<hr>'); continue; }

    const h=/^(#{1,6})\s+(.*)$/.exec(trimmed);
    if(h){ flushPara(); closeAll(); const l=h[1].length; out.push('<h'+l+'>'+tbMdInline(h[2].replace(/\s+#+\s*$/,''))+'</h'+l+'>'); continue; }

    // Table — only when the NEXT line is a |---|---| delimiter row.
    if(trimmed.indexOf('|')!==-1 && i+1<lines.length &&
       /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(lines[i+1])){
      flushPara(); closeAll();
      const cells=r=>r.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>c.trim());
      const head=cells(trimmed);
      let t='<table><thead><tr>'+head.map(c=>'<th>'+tbMdInline(c)+'</th>').join('')+'</tr></thead><tbody>';
      for(i++;i+1<lines.length && lines[i+1].trim() && lines[i+1].indexOf('|')!==-1;){
        i++;
        const row=cells(lines[i]);
        while(row.length<head.length) row.push('');
        t+='<tr>'+row.slice(0,head.length).map(c=>'<td>'+tbMdInline(c)+'</td>').join('')+'</tr>';
      }
      out.push(t+'</tbody></table>');
      continue;
    }

    if(/^>\s?/.test(trimmed)){
      flushPara(); closeAll();
      const buf=[];
      for(;i<lines.length && /^\s*>\s?/.test(lines[i]);i++) buf.push(lines[i].replace(/^\s*>\s?/,''));
      i--;
      out.push('<blockquote>'+tbMdToHtml(buf.join('\n'))+'</blockquote>');
      continue;
    }

    const li=/^(\s*)([-*+]|\d{1,9}[.)])\s+(.*)$/.exec(line);
    if(li){
      flushPara();
      const indent=li[1].length, tag=/^\d/.test(li[2])?'ol':'ul';
      while(stack.length && stack[stack.length-1].indent>indent) out.push('</'+stack.pop().tag+'>');
      const top=stack[stack.length-1];
      if(!top || top.indent<indent){ stack.push({tag,indent}); out.push('<'+tag+'>'); }
      else if(top.tag!==tag){ out.push('</'+stack.pop().tag+'>'); stack.push({tag,indent}); out.push('<'+tag+'>'); }
      out.push('<li>'+tbMdInline(li[3])+'</li>');
      continue;
    }

    para.push(trimmed);
  }
  flushPara(); closeAll();
  return out.join('');
}

/* ── Sanitizer ────────────────────────────────────────────────────────────────
   Pasted HTML comes from arbitrary pages, and stored HTML is re-inserted with
   dangerouslySetInnerHTML — so it is sanitized on the way IN and again on the
   way OUT. Allowlist-based: unknown tags are unwrapped (their text survives),
   dangerous tags are dropped whole, and every attribute not explicitly allowed
   goes — including all `on*` handlers. */
const TB_PB_TAGS=new Set(['p','br','hr','h1','h2','h3','h4','h5','h6','strong','b','em','i','u','s','strike','del','ins','mark','small','sub','sup','ul','ol','li','blockquote','pre','code','kbd','samp','table','thead','tbody','tfoot','tr','th','td','caption','a','img','span','div','figure','figcaption']);
const TB_PB_DROP=new Set(['script','style','iframe','object','embed','link','meta','form','input','button','select','textarea','noscript','svg','math','base','title','head']);
const TB_PB_ATTRS={a:['href','title'],img:['src','alt','title'],th:['colspan','rowspan'],td:['colspan','rowspan'],ol:['start']};

/* `style` is FILTERED rather than dropped. A browser puts the source's computed
   typography inline on the clipboard fragment, so discarding the whole attribute
   made every paste snap to this doc's own sizes — 11px source text arriving as
   15px. Keeping these properties is what makes a paste match where it came from. */
const TB_PB_STYLE_PROPS=['font-size','font-weight','font-style','font-family','line-height','text-decoration-line','text-align','vertical-align','margin-left','margin-right'];
/* COLOUR props are kept when the user chose them with the toolbar (load path) but
   DROPPED from a paste: pasting from a light-background document would carry black
   text into this dark theme and render it invisible. See tbSanitizeHtml(dropColor). */
const TB_PB_COLOR_PROPS=['color','background-color'];

function tbPbKeepStyle(el,dropColor){
  let out='';
  try{
    const s=el.style;
    if(!s || !s.length) return '';
    const props=dropColor?TB_PB_STYLE_PROPS:TB_PB_STYLE_PROPS.concat(TB_PB_COLOR_PROPS);
    for(const p of props){
      const v=s.getPropertyValue(p);
      // The CSSOM already rejected anything unparseable; this drops the values
      // that parse but can still fetch or inject (url(), expression(), …).
      if(!v || /url\(|expression|javascript:|[<>]/i.test(v)) continue;
      out+=p+':'+v+';';
    }
  }catch(e){}
  return out;
}

function tbPbSafeUrl(u,isImg){
  const s=String(u||'').trim();
  if(/^(https?:|mailto:|tel:)/i.test(s)) return s;
  // Pasted screenshots arrive as base64 data URLs. svg+xml is excluded on purpose
  // — it can carry markup — and every other scheme (javascript:, data:text/html,
  // vbscript:, blob:) is rejected by falling through.
  if(isImg && /^data:image\/(png|jpe?g|gif|webp|bmp);base64,[a-z0-9+/=\s]+$/i.test(s)) return s;
  return '';
}

/* dropColor: true on the PASTE path (foreign colours are dropped so black-on-white
   source text can't land invisible on this dark theme); false/omitted on load, so
   colours the user picked with the toolbar are preserved. */
function tbSanitizeHtml(html,opts){
  const dropColor=!!(opts&&opts.dropColor);
  const raw=String(html||'');
  if(!raw.trim()) return '';
  // DOMParser does not execute scripts or load resources — safe to parse first.
  const doc=new DOMParser().parseFromString('<body><div id="tb-pb-root">'+raw+'</div></body>','text/html');
  const root=doc.getElementById('tb-pb-root');
  if(!root) return '';

  // Comments carry Office/Word conditional markup and survive an element-only
  // walk, so strip them explicitly.
  const cw=doc.createTreeWalker(root,NodeFilter.SHOW_COMMENT);
  const comments=[]; while(cw.nextNode()) comments.push(cw.currentNode);
  comments.forEach(c=>{ try{ c.remove(); }catch(e){} });

  // Snapshot in document order. Unwrapped children stay in the tree, so they are
  // still visited; anything under a dropped ancestor fails the contains() guard.
  for(const el of Array.from(root.querySelectorAll('*'))){
    if(!root.contains(el)) continue;
    const tag=el.tagName.toLowerCase();
    if(TB_PB_DROP.has(tag)){ el.remove(); continue; }
    if(!TB_PB_TAGS.has(tag)){
      const parent=el.parentNode;
      if(parent){ while(el.firstChild) parent.insertBefore(el.firstChild,el); }
      el.remove();
      continue;
    }
    // Read the typography off the style attribute BEFORE the loop below strips it.
    const keepStyle=tbPbKeepStyle(el,dropColor);
    const allowed=TB_PB_ATTRS[tag]||[];
    for(const attr of Array.from(el.attributes)){
      const n=attr.name.toLowerCase();
      if(!allowed.includes(n)){ el.removeAttribute(attr.name); continue; }
      if(n==='href'){ const u=tbPbSafeUrl(attr.value,false); if(u) el.setAttribute('href',u); else el.removeAttribute('href'); }
      else if(n==='src'){ const u=tbPbSafeUrl(attr.value,true); if(u) el.setAttribute('src',u); else el.remove(); }
    }
    if(keepStyle && root.contains(el)) el.setAttribute('style',keepStyle);
    if(tag==='a' && el.getAttribute('href')){ el.setAttribute('target','_blank'); el.setAttribute('rel','noopener noreferrer'); }
  }
  return root.innerHTML;
}

/* Plain text → HTML, with NO markdown interpretation: blank lines split
   paragraphs, single newlines become breaks, and every markdown-ish character is
   inert because the text is HTML-escaped. Used for a text/plain paste that isn't
   markdown, so "-5% stop" lands as typed instead of being second-guessed. */
function tbTextToHtml(text){
  return String(text||'').replace(/\r\n?/g,'\n').split(/\n{2,}/)
    .map(b=>b.trim()).filter(Boolean)
    .map(b=>'<p>'+tbEscHtml(b).replace(/\n/g,'<br>')+'</p>').join('');
}

/* Does this plain text read as markdown? Decides whether a text/plain paste gets
   rendered or inserted literally. */
function tbLooksLikeMd(t){
  const s=String(t||'');
  return /^\s{0,3}#{1,6}\s+\S/m.test(s) || /\*\*[^*\n]+\*\*/.test(s) || /^\s*[-*+]\s+\S/m.test(s)
      || /^\s*\d{1,9}[.)]\s+\S/m.test(s) || /^\s*>\s+\S/m.test(s) || /```/.test(s)
      || /^\s*\|.*\|\s*$/m.test(s) || /\[[^\]]+\]\(https?:[^)]+\)/.test(s);
}
/* True when HTML carries no structure worth preserving — e.g. copying from a
   plain textarea, which still puts a bare <div>/<span> wrapper on the clipboard.
   In that case the plain-text branch (markdown) gives the better result. */
function tbHtmlIsPlain(html){
  return !/<(h[1-6]|ul|ol|li|table|tr|td|th|pre|code|blockquote|strong|b|em|i|a|img|hr)[\s>]/i.test(String(html||''));
}

/* ── HTML → Markdown ──────────────────────────────────────────────────────────
   Pages are authored as HTML, but Trading Auto Launch renders the Daily Reminder in
   a plain Tk dialog, so it is pushed a Markdown copy.

   This has to cope with real editor markup, which nests block content in places
   the content model forbids — a <ul> inside an <h1> is the common one, and the
   HTML parser keeps it there because it only auto-closes a heading on ANOTHER
   heading. So no element is assumed to hold only inline content: runs of inline
   nodes are grouped into one block and block-level children always keep their
   own shape. Flattening a heading's subtree into its text instead turned a whole
   rules list into one giant run-on heading. */
const TB_MD_BLOCK=/^(address|article|aside|blockquote|div|dl|dd|dt|figure|figcaption|footer|h[1-6]|header|hr|li|main|nav|ol|p|pre|section|table|tbody|td|tfoot|th|thead|tr|ul)$/;

function tbHtmlToMd(html){
  const raw=String(html||'');
  if(!raw.trim()) return '';
  const doc=new DOMParser().parseFromString('<body><div id="tb-md-root">'+raw+'</div></body>','text/html');
  const root=doc.getElementById('tb-md-root');
  if(!root) return '';

  /* Format ONE node as inline markdown. Split out from inl() so callers that walk
     children themselves (emitMixed) still get a <code>/<a> wrapped properly —
     handing the element to inl() would return its contents with the backticks or
     link syntax silently dropped. */
  const fmtNode=(c)=>{
    if(c.nodeType===3) return c.nodeValue.replace(/\s+/g,' ');
    if(c.nodeType!==1) return '';
    const t=c.tagName.toLowerCase(), inner=inl(c), core=inner.trim();
    if(t==='br') return '\n';
    if((t==='strong'||t==='b')&&core) return '**'+core+'**';
    if((t==='em'||t==='i')&&core) return '*'+core+'*';
    if((t==='del'||t==='s'||t==='strike')&&core) return '~~'+core+'~~';
    if(t==='code') return '`'+inner+'`';
    if(t==='a'){ const h=c.getAttribute('href')||''; return (h&&core)?'['+core+']('+h+')':inner; }
    if(t==='img') return '['+(c.getAttribute('alt')||'image')+']';
    return inner;
  };

  const inl=(n)=>{
    let s='';
    n.childNodes.forEach(c=>{
      const piece=fmtNode(c);
      if(!piece) return;
      // A block child reached here (inside an <li>, say) still ends a line of
      // prose, so keep a separator — otherwise "…profits." and "Steady growth…"
      // fuse into one word.
      if(c.nodeType===1 && TB_MD_BLOCK.test(c.tagName.toLowerCase()) && s && !/\s$/.test(s)) s+=' ';
      s+=piece;
    });
    return s;
  };

  // A list renders as ONE block so its items stay on consecutive lines.
  const listMd=(el,depth)=>{
    const ordered=el.tagName.toLowerCase()==='ol';
    let idx=parseInt(el.getAttribute('start')||'1',10)||1;
    const lines=[];
    Array.from(el.children).forEach(ch=>{
      const ct=ch.tagName.toLowerCase();
      // A nested list can be a sibling of the <li> (the shape tbMdToHtml emits)
      // or a child of it (the shape most editors emit) — handle both.
      if(ct==='ul'||ct==='ol'){ const s=listMd(ch,depth+1); if(s) lines.push(s); return; }
      if(ct!=='li') return;
      const clone=ch.cloneNode(true), subs=[];
      Array.from(clone.children).forEach(k=>{ const kt=k.tagName.toLowerCase(); if(kt==='ul'||kt==='ol'){ subs.push(k); k.remove(); } });
      const text=inl(clone).trim();
      lines.push('  '.repeat(depth)+(ordered?(idx++)+'. ':'- ')+text);
      subs.forEach(s=>{ const m=listMd(s,depth+1); if(m) lines.push(m); });
    });
    return lines.filter(Boolean).join('\n');
  };

  const blocks=[];

  /* Emit an element's children IN ORDER: consecutive inline nodes are gathered
     into one block via wrap(), and any block-level child is emitted on its own.
     This is what keeps a list nested inside a heading a real list. */
  const emitMixed=(el,wrap)=>{
    let buf='';
    const flush=()=>{ const s=buf.trim(); buf=''; if(s) blocks.push(wrap(s)); };
    el.childNodes.forEach(c=>{
      if(c.nodeType===3){ buf+=c.nodeValue.replace(/\s+/g,' '); return; }
      if(c.nodeType!==1) return;
      if(TB_MD_BLOCK.test(c.tagName.toLowerCase())){ flush(); emitNode(c); }
      else buf+=fmtNode(c);
    });
    flush();
  };

  const emitNode=(c)=>{
    const t=c.tagName.toLowerCase();
    if(/^h[1-6]$/.test(t)){ const n=parseInt(t[1],10); emitMixed(c,s=>'#'.repeat(n)+' '+s); return; }
    if(t==='p'){ emitMixed(c,s=>s); return; }
    if(t==='hr'){ blocks.push('---'); return; }
    if(t==='br'){ return; }   // block separator — the join already handles it
    if(t==='pre'){ blocks.push('```\n'+(c.textContent||'').replace(/\n+$/,'')+'\n```'); return; }
    if(t==='blockquote'){ const s=tbHtmlToMd(c.innerHTML); if(s) blocks.push(s.split('\n').map(l=>l?'> '+l:'>').join('\n')); return; }
    if(t==='ul'||t==='ol'){ const s=listMd(c,0); if(s) blocks.push(s); return; }
    if(t==='table'){
      const rows=Array.from(c.querySelectorAll('tr'));
      if(!rows.length) return;
      const cellsOf=r=>Array.from(r.children).map(td=>inl(td).trim().replace(/\|/g,'\\|')||' ');
      const head=cellsOf(rows[0]);
      if(!head.length) return;
      const lines=['| '+head.join(' | ')+' |','|'+head.map(()=>' --- ').join('|')+'|'];
      rows.slice(1).forEach(r=>{ const cs=cellsOf(r); while(cs.length<head.length) cs.push(' '); lines.push('| '+cs.slice(0,head.length).join(' | ')+' |'); });
      blocks.push(lines.join('\n'));
      return;
    }
    walk(c);   // div/section/figure wrappers — descend
  };

  const walk=(n)=>{
    n.childNodes.forEach(c=>{
      if(c.nodeType===3){ const tx=c.nodeValue.trim(); if(tx) blocks.push(tx); return; }
      if(c.nodeType!==1) return;
      emitNode(c);
    });
  };
  walk(root);
  /* Editors often emit each bullet as its own single-item <ul>. Those arrive here
     as separate blocks and would be joined by a blank line, rendering as a loose,
     airy list even though the source looks like one tight list. Fuse neighbouring
     lists back into one. */
  const isList=b=>/^\s*([-*+]|\d{1,9}\.)\s/.test(b);
  const merged=[];
  for(const b of blocks){
    if(merged.length && isList(b) && isList(merged[merged.length-1])) merged[merged.length-1]+='\n'+b;
    else merged.push(b);
  }
  return merged.join('\n\n').replace(/\n{3,}/g,'\n\n').trim();
}

/* ── Formatting toolbar ───────────────────────────────────────────────────────
   Word-processor controls over the shared contentEditable. Every button/menu-item
   preventDefaults its mousedown so the editor keeps its live selection, then runs
   an execCommand against it — the standard rich-text-toolbar trick, and simpler
   than saving/restoring a Range. `run` focuses, toggles styleWithCSS as needed,
   execs, and re-fires the editor's onInput (via emit) so the change syncs. */
const TB_PB_FONTS=[
  ['Arial','Arial, Helvetica, sans-serif'],
  ['Georgia','Georgia, serif'],
  ['Times','\'Times New Roman\', Times, serif'],
  ['Courier','\'Courier New\', monospace'],
  ['System','system-ui, sans-serif'],
  ['Lora','Lora, Georgia, serif'],
];
const TB_PB_SIZES=[12,14,16,18,20,24,28,32];
const TB_PB_BLOCKS=[['p','Normal text'],['h1','Heading 1'],['h2','Heading 2'],['h3','Heading 3'],['blockquote','Quote'],['pre','Code block']];
// Text colours: theme-aware, all readable on the dark surface. First entry resets.
const TB_PB_TEXT_COLORS=['','#f4f3f0','#adadb2','#e0b874','#a4b986','#d68a7c','#e0b57c','#7dd3fc','#c084fc','#fb923c'];
// Highlights: translucent so text stays legible. First entry clears.
const TB_PB_HL_COLORS=['','rgba(224,184,116,0.30)','rgba(164,185,134,0.28)','rgba(251,191,36,0.30)','rgba(125,211,252,0.28)','rgba(192,132,252,0.28)'];

/* Hoisted so their identity is stable across toolbar re-renders (inline components
   would remount their subtrees, e.g. dropping focus from an open menu). */
function TBpTool({title,onClick,children,active}){

function TBpDiv(){ return <span className="tb-pb-div"/>; }
function TBpItem({onClick,close,active,children}){

function TBPlaybookToolbar({editorRef,emit}){
  const [openId,setOpenId]=useState(null);
  const [linkUrl,setLinkUrl]=useState('');
  const barRef=useRef(null);
  const linkRange=useRef(null);

  // Close any open menu on an outside click or Escape.
  useEffect(()=>{
    if(!openId) return;
    const onDown=(e)=>{ if(barRef.current && !barRef.current.contains(e.target)) setOpenId(null); };
    const onKey=(e)=>{ if(e.key==='Escape') setOpenId(null); };
    document.addEventListener('pointerdown',onDown,true);
    document.addEventListener('keydown',onKey);
    return()=>{ document.removeEventListener('pointerdown',onDown,true); document.removeEventListener('keydown',onKey); };
  },[openId]);

  const focusEd=()=>{ const el=editorRef.current; if(el) el.focus(); return el; };

  // Core: run an execCommand against the editor's current selection, then sync.
  // A null value is passed as OMITTED, not as the string "null" — insertHorizontalRule
  // treats its value arg as the new element's id, so run('insertHorizontalRule')
  // must not hand it one.
  const run=(cmd,val=null,css=false)=>{
    const el=focusEd(); if(!el) return;
    try{ document.execCommand('styleWithCSS',false,css); }catch(e){}
    try{ if(val==null) document.execCommand(cmd,false); else document.execCommand(cmd,false,val); }catch(e){}
    emit();
  };

  const setBlock=(tag)=>{ run('formatBlock',tag,false); };
  const setFont=(css)=>{ run('fontName',css,true); };
  const setColor=(c)=>{
    if(c){ run('foreColor',c,true); return; }
    // Reset = re-apply the theme's default text colour, so ONLY the colour clears
    // — removeFormat would also strip the selection's bold/italic/size.
    const root=document.getElementById('tradeboard-root');
    const def=(root&&getComputedStyle(root).getPropertyValue('--tx').trim())||'#f4f3f0';
    run('foreColor',def,true);
  };
  const setHighlight=(c)=>{ run('hiliteColor',c||'transparent',true); };

  // Font size: execCommand('fontSize','7') creates <font size=7> around the
  // selection (reliable cross-browser); we then remap those to a px span. This is
  // the same technique index.html's editor uses.
  const setSize=(px)=>{
    const el=focusEd(); if(!el) return;
    try{ document.execCommand('styleWithCSS',false,false); }catch(e){}
    try{ document.execCommand('fontSize',false,'7'); }catch(e){}
    el.querySelectorAll('font[size="7"]').forEach(f=>{
      const span=document.createElement('span');
      span.style.fontSize=px+'px';
      while(f.firstChild) span.appendChild(f.firstChild);
      f.replaceWith(span);
    });
    emit();
  };

  // Inline code: wrap the selection in <code>, or unwrap if already inside one.
  const toggleCode=()=>{
    const el=focusEd(); if(!el) return;
    const sel=window.getSelection();
    if(!sel||!sel.rangeCount){ return; }
    let n=sel.anchorNode; if(n&&n.nodeType===3) n=n.parentElement;
    const existing=n&&n.closest?n.closest('code'):null;
    if(existing&&el.contains(existing)){
      const p=existing.parentNode;
      while(existing.firstChild) p.insertBefore(existing.firstChild,existing);
      p.removeChild(existing); el.normalize(); emit(); return;
    }
    if(sel.isCollapsed){ return; }
    const range=sel.getRangeAt(0);
    const code=document.createElement('code');
    code.textContent=range.toString();
    range.deleteContents(); range.insertNode(code);
    const r2=document.createRange(); r2.selectNodeContents(code); r2.collapse(false);
    sel.removeAllRanges(); sel.addRange(r2);
    emit();
  };

  // Link: capture the selection when the button is pressed (its mousedown is
  // prevented, so the range is still live), reveal an input, then createLink onto
  // the restored range. A collapsed caret inserts the URL as its own link text.
  const openLink=()=>{
    const el=focusEd(); if(!el) return;
    const sel=window.getSelection();
    let a=null, n=sel&&sel.anchorNode;
    if(n&&n.nodeType===3) n=n.parentElement;
    if(n&&n.closest) a=n.closest('a');
    if(a&&el.contains(a)){ setLinkUrl(a.getAttribute('href')||''); }
    else setLinkUrl('');
    linkRange.current=(sel&&sel.rangeCount&&el.contains(sel.anchorNode))?sel.getRangeAt(0).cloneRange():null;
    setOpenId(openId==='link'?null:'link');
  };
  const applyLink=(close)=>{
    let url=(linkUrl||'').trim(); if(!url){ close(); return; }
    if(!/^(https?:|mailto:|tel:|#|\/)/i.test(url)) url='https://'+url;
    const el=focusEd(); if(!el){ close(); return; }
    const sel=window.getSelection();
    if(linkRange.current){ sel.removeAllRanges(); sel.addRange(linkRange.current); }
    if(!sel.rangeCount){ close(); return; }   // nothing to anchor to
    if(sel.isCollapsed){
      // No selection → drop the URL in as a linked chunk of text.
      const a=document.createElement('a'); a.href=url; a.textContent=url;
      a.target='_blank'; a.rel='noopener noreferrer';
      sel.getRangeAt(0).insertNode(a);
    }else{
      try{ document.execCommand('createLink',false,url); }catch(e){}
      el.querySelectorAll('a[href="'+url+'"]').forEach(x=>{ x.setAttribute('target','_blank'); x.setAttribute('rel','noopener noreferrer'); });
    }
    emit(); close();
  };

  const Tool=TBpTool, Div=TBpDiv;

  // Which block/font the caret currently sits in — computed when a menu opens, so
  // the menu can tick the active option without a global selectionchange listener.
  const curBlock=()=>{
    const el=editorRef.current, sel=window.getSelection();
    if(!el||!sel||!sel.rangeCount) return 'p';
    let n=sel.anchorNode; if(n&&n.nodeType===3) n=n.parentElement;
    while(n&&n!==el){ const t=n.tagName&&n.tagName.toLowerCase(); if(/^(p|h1|h2|h3|h4|h5|h6|blockquote|pre|li)$/.test(t||'')) return t; n=n.parentElement; }
    return 'p';
  };

  return(<div className="tb-pb-toolbar" ref={barRef}>
    <Tool title="Undo (Ctrl+Z)" onClick={()=>run('undo')}><TBIcon n="undo"/></Tool>
    <Tool title="Redo (Ctrl+Y)" onClick={()=>run('redo')}><TBIcon n="redo"/></Tool>
    <Div/>
    <TBpMenuBlock openId={openId} setOpenId={setOpenId} curBlock={curBlock} setBlock={setBlock}/>
    <TBpMenuFont openId={openId} setOpenId={setOpenId} setFont={setFont}/>
    <TBpMenuSize openId={openId} setOpenId={setOpenId} setSize={setSize}/>
    <Div/>
    <Tool title="Bold (Ctrl+B)" onClick={()=>run('bold')}><b>B</b></Tool>
    <Tool title="Italic (Ctrl+I)" onClick={()=>run('italic')}><i>I</i></Tool>
    <Tool title="Underline (Ctrl+U)" onClick={()=>run('underline')}><u>U</u></Tool>
    <Tool title="Strikethrough" onClick={()=>run('strikeThrough')}><s>S</s></Tool>
    <Tool title="Inline code" onClick={toggleCode}><span style={{fontFamily:'monospace',fontSize:12}}>{'<>'}</span></Tool>
    <Div/>
    <TBpMenuSwatch id="color" openId={openId} setOpenId={setOpenId} title="Text colour"
      label={<span style={{borderBottom:'3px solid var(--ac)',lineHeight:1,paddingBottom:1}}>A</span>}
      colors={TB_PB_TEXT_COLORS} onPick={setColor}/>
    <TBpMenuSwatch id="hl" openId={openId} setOpenId={setOpenId} title="Highlight"
      label={<span style={{background:'rgba(251,191,36,0.4)',borderRadius:2,padding:'0 2px',lineHeight:1}}>H</span>}
      colors={TB_PB_HL_COLORS} onPick={setHighlight} swatchBg={true}/>
    <Div/>
    <Tool title="Bulleted list" onClick={()=>run('insertUnorderedList')}><TBIcon n="list"/></Tool>
    <Tool title="Numbered list" onClick={()=>run('insertOrderedList')}><TBIcon n="listOrd"/></Tool>
    <Tool title="Decrease indent" onClick={()=>run('outdent',null,true)}><TBIcon n="outdent"/></Tool>
    <Tool title="Increase indent" onClick={()=>run('indent',null,true)}><TBIcon n="indent"/></Tool>
    <Div/>
    <div className="tb-pb-menuwrap">
      <button type="button" className={'tb-pb-tool'+(openId==='link'?' active':'')} title="Insert link"
        onMouseDown={e=>e.preventDefault()} onClick={openLink}><TBIcon n="link"/></button>
      {openId==='link'&&<div className="tb-pb-menu" onMouseDown={e=>e.preventDefault()}>
        <div className="tb-pb-linkrow">
          <input autoFocus value={linkUrl} placeholder="https://…" spellCheck={false}
            onChange={e=>setLinkUrl(e.target.value)}
            onKeyDown={e=>{ if(e.key==='Enter'){ e.preventDefault(); applyLink(()=>setOpenId(null)); } }}/>
          <button type="button" className="tb-pb-tool active" onMouseDown={e=>e.preventDefault()}
            onClick={()=>applyLink(()=>setOpenId(null))}>Add</button>
        </div>
      </div>}
    </div>
    <Tool title="Horizontal rule" onClick={()=>run('insertHorizontalRule')}>―</Tool>
    <Tool title="Clear formatting" onClick={()=>run('removeFormat')}><TBIcon n="eraser"/></Tool>
  </div>);
}

function TBpMenuBlock({openId,setOpenId,curBlock,setBlock}){
  const cur=openId==='block'?curBlock():null;
  return(<TBPbMenu id="block" openId={openId} setOpenId={setOpenId} title="Paragraph style" label="Style" width={170}>
