/* ── Journal Page ── */
/* ── Equity curve ────────────────────────────────────────────────────────────
   Cumulative realised P&L over time. One series, so there is no legend — the
   card title says what is plotted — and the reader gets the numbers three ways:
   the endpoint is direct-labelled, the crosshair reads out any point on hover or
   keyboard focus, and the table underneath holds every row without hovering.

   Colour follows the period's direction using TradeHub's own P&L pair, and it is
   never the only signal: the hero figure, the endpoint label and every tooltip
   carry a signed value, so the curve still reads without colour vision. */

const TB_RANGES = [
  { id: '1M',  label: '1M',  days: 30 },
  { id: '3M',  label: '3M',  days: 91 },
  { id: '6M',  label: '6M',  days: 182 },
  { id: 'YTD', label: 'YTD', days: null },
  { id: '1Y',  label: '1Y',  days: 365 },
  { id: 'ALL', label: 'All', days: null },
];

/* The date a trade lands on the curve: when it was closed. */
function tbTradeExitDate(trade){
  const sells = (trade.legs||[]).filter(l=>l.action==='SELL')
    .map(l=>new Date(l.datetime)).filter(d=>!isNaN(d.getTime()));
  if (sells.length) return new Date(Math.max(...sells.map(d=>d.getTime())));
  if (trade.date) { const d=new Date(trade.date); if(!isNaN(d.getTime())) return d; }
  return null;
}

/* Axis ticks on round numbers — 1/2/5 × 10^n covering the domain. */
function tbNiceTicks(lo, hi, count){
  if (!(hi>lo)) { const p=Math.abs(hi)||1; lo=hi-p; hi=hi+p; }
  const raw=(hi-lo)/Math.max(1,count);
  const mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=raw)||10*mag;
  const out=[];
  for(let v=Math.ceil(lo/step)*step; v<=hi+step*0.001; v+=step) out.push(Math.round(v*1e6)/1e6);
  return out;
}

function TBEquityCurve({trades}){
  const [range,setRange]=useState('ALL');
  const [hover,setHover]=useState(null);     // index into pts
  const [showTable,setShowTable]=useState(false);
  /* w = the card's own inner width, measured. Every size below is derived from
     THIS rather than the viewport: the card is the box the chart has to fit,
     and a viewport breakpoint can't see the page padding around it. */
  const [w,setW]=useState(0);
  const nodeRef=useRef(null);
  const roRef=useRef(null);

  /* A callback ref, not useRef + mount effect. The chart body mounts LATER than
     the component — trades load async, so the first render is the empty state —
     which meant the old mount-time effect observed a null node, never attached,
     and w stayed at its hard-coded initial guess for the life of the page. That
     single stale number was both bugs: on a phone the SVG kept drawing wider
     than the screen and ran off the edge, and on a wide monitor it stopped
     growing and sat stranded in the middle of the card. A callback ref fires on
     every mount/unmount of the node itself, so it cannot miss. */
  const attach=useCallback(node=>{
    if(roRef.current){ roRef.current.disconnect(); roRef.current=null; }
    nodeRef.current=node;
    if(!node) return;
    const measure=()=>{ const cw=node.clientWidth; if(cw>0) setW(cw); };
    measure();
    if(typeof ResizeObserver!=='undefined'){
      const ro=new ResizeObserver(measure); ro.observe(node); roRef.current=ro;
    }
  },[]);
  /* Fallback for browsers without ResizeObserver, plus observer cleanup. */
  useEffect(()=>{
    const onResize=()=>{ const n=nodeRef.current; if(n&&n.clientWidth>0) setW(n.clientWidth); };
    window.addEventListener('resize',onResize);
    return()=>{ window.removeEventListener('resize',onResize); if(roRef.current) roRef.current.disconnect(); };
  },[]);

  /* Closed trades with a P&L and a date, oldest first, cumulatively summed. */
  const all=useMemo(()=>{
    const rows=[];
    (trades||[]).forEach(t=>{
      const st=tbComputeTradeStats(t);
      if(st.status==='OPEN'||st.netPnL==null) return;
      const d=tbTradeExitDate(t); if(!d) return;
      rows.push({t:d.getTime(), pnl:st.netPnL, ticker:t.ticker||'—'});
    });
    rows.sort((a,b)=>a.t-b.t);
    let run=0;
    return rows.map(r=>({...r, equity:(run+=r.pnl)}));
  },[trades]);

  /* Windowing re-bases the curve so the y-axis reads "P&L over this period". */
  const pts=useMemo(()=>{
    if(!all.length) return [];
    if(range==='ALL') return all.map(r=>({...r, y:r.equity}));
    const now=Date.now();
    let from;
    if(range==='YTD'){ const d=new Date(); from=new Date(d.getFullYear(),0,1).getTime(); }
    else { const cfg=TB_RANGES.find(r=>r.id===range); from=now-(cfg?cfg.days:365)*86400000; }
    const inWin=all.filter(r=>r.t>=from);
    if(!inWin.length) return [];
    const before=all.filter(r=>r.t<from);
    const base=before.length?before[before.length-1].equity:0;
    return inWin.map(r=>({...r, y:r.equity-base}));
  },[all,range]);

  const net=pts.length?pts[pts.length-1].y:0;
  const col=net>=0?'var(--tbb)':'var(--tbr)';
  const rgb=net>=0?'164,185,134':'214,138,124';

  /* Geometry. Height includes the x-axis band so the card never nests a scroll.
     Everything scales off the measured width: a container query in arithmetic. */
  const compact=w<520;                       // phone-width CARD, not phone-width screen
  const ready=w>0;
  /* Height tracks width so the curve keeps a readable aspect ratio at any size,
     with a floor so it doesn't collapse on a phone and a ceiling so it doesn't
     become a billboard on a wide monitor. The ratio and the ceiling are both
     deliberately low: an equity curve is read for its SHAPE, and at 0.32/360 a
     maximised window turned one card into most of a screen of empty plot area,
     pushing the table and the rest of the Journal below the fold. */
  const H=Math.round(Math.min(compact?200:250,Math.max(compact?150:175,w*0.22)));
  const PT=14, PB=compact?22:28, PR=compact?12:18;
  const innerH=H-PT-PB;
  const ys=pts.map(p=>p.y);
  const lo=Math.min(0,...ys), hi=Math.max(0,...ys);
  /* Tick count follows the plot's height — fixed 4 crowded a short mobile chart. */
  const ticks=tbNiceTicks(lo,hi,Math.max(2,Math.min(6,Math.round(innerH/54))));
  const axisFS=compact?9.5:10;
  /* Abbreviate to $1.2k on a narrow card so the y gutter stays small. */
  const fmtTick=v=>{
    const a=Math.abs(v);
    const s=compact&&a>=1000
      ? (a/1000).toFixed(a>=10000?0:1).replace(/\.0$/,'')+'k'
      : a.toLocaleString('en-US',{maximumFractionDigits:0});
    return (v<0?'−':'')+'$'+s;
  };
  const tickLabels=ticks.map(fmtTick);
  /* Left gutter = widest tick label + breathing room. The old fixed 62px was
     simultaneously too wide on a phone and too narrow once P&L hit five digits. */
  const PL=Math.ceil(Math.max(compact?30:38,
    Math.max(0,...tickLabels.map(s=>s.length))*axisFS*0.62+14));
  const innerW=Math.max(40,w-PL-PR);
  const dLo=Math.min(lo,...ticks), dHi=Math.max(hi,...ticks);
  const span=(dHi-dLo)||1;
  const X=i=>pts.length<2?PL+innerW/2:PL+(i/(pts.length-1))*innerW;
  const Y=v=>PT+innerH-((v-dLo)/span)*innerH;

  /* Date ticks along the bottom: endpoints only on a narrow card, intermediate
     dates once there's room, so a wide chart stops being an unlabelled span. */
  const xIdx=[];
  if(pts.length){
    const n=Math.max(2,Math.min(6,Math.floor(innerW/(compact?170:190))+1));
    for(let k=0;k<n;k++){
      const i=Math.round((k/(n-1))*(pts.length-1));
      if(!xIdx.includes(i)) xIdx.push(i);
    }
  }

  const linePath=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
  const areaPath=pts.length
    ? linePath+' L '+X(pts.length-1).toFixed(1)+' '+Y(0).toFixed(1)+' L '+X(0).toFixed(1)+' '+Y(0).toFixed(1)+' Z'
    : '';

  const idxAt=(clientX,rect)=>{
    if(pts.length<2) return 0;
    const i=Math.round((((clientX-rect.left)-PL)/innerW)*(pts.length-1));
    return Math.max(0,Math.min(pts.length-1,i));
  };
  const onMove=e=>{
    if(!pts.length) return;
    setHover(idxAt(e.clientX,e.currentTarget.getBoundingClientRect()));
  };
  /* Touch scrubbing — a phone has no hover, so without this the crosshair and
     its readout were desktop-only. touchAction:'pan-y' keeps vertical scrolling
     working while a horizontal drag scrubs the curve. */
  const onTouch=e=>{
    if(!pts.length||!e.touches||!e.touches.length) return;
    setHover(idxAt(e.touches[0].clientX,e.currentTarget.getBoundingClientRect()));
  };
  const onKey=e=>{
    if(!pts.length) return;
    if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
      e.preventDefault();
      setHover(h=>{ const b=h==null?(e.key==='ArrowRight'?-1:pts.length):h;
        return Math.max(0,Math.min(pts.length-1,b+(e.key==='ArrowRight'?1:-1))); });
    } else if(e.key==='Escape') setHover(null);
  };

  const fmtDay=ms=>new Date(ms).toLocaleDateString('en-US',{month:'short',day:'numeric'});
  const hp=hover!=null?pts[hover]:null;

  return(<div className="tb-card" style={{padding:'16px clamp(12px,2.5vw,20px) 14px',overflow:'hidden'}}>
    <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',
                 gap:10,flexWrap:'wrap',marginBottom:14}}>
      <div style={{minWidth:0,flex:'1 1 auto'}}>
        <div style={{fontSize:15,fontWeight:800,color:'var(--tx)'}}>Equity Curve</div>
        <div style={{fontSize:12,color:'var(--txm)',marginTop:2}}>Cumulative realised P&amp;L</div>
      </div>
      {/* Range chips: wrap rather than overflow, and stay ≥28px tall for touch. */}
      <div style={{display:'flex',gap:4,flexWrap:'wrap',flex:'0 1 auto'}}>
        {TB_RANGES.map(r=>(
          <button key={r.id} onClick={()=>{setRange(r.id);setHover(null);}}
            aria-pressed={range===r.id}
            style={{background:'transparent',border:'1px solid '+(range===r.id?'var(--ac)':'var(--bd)'),
                    color:range===r.id?'var(--acs)':'var(--txm)',borderRadius:6,
                    padding:compact?'5px 9px':'4px 11px',minHeight:28,
                    fontSize:11,fontWeight:700,letterSpacing:.4,cursor:'pointer',transition:'all .15s'}}>{r.label}</button>
        ))}
      </div>
    </div>

    {/* Measured node. It renders in EVERY state — including empty and pre-load —
        so the width is already known by the time the chart itself appears. */}
    <div ref={attach} style={{width:'100%'}}>
    {!pts.length
      ? <div style={{padding:'44px 0',textAlign:'center',fontFamily:'var(--font-accent)',fontSize:14,color:'var(--txm)'}}>
          No closed trades in this range yet.
        </div>
      : (<>
        {/* Hero: the period's net, proportional figures, signed so colour is never alone. */}
        <div style={{display:'flex',alignItems:'baseline',gap:10,marginBottom:6,flexWrap:'wrap'}}>
          <span style={{fontSize:compact?24:30,fontWeight:700,letterSpacing:-.5,color:col}}>
            {(net>=0?'+':'−')+tbFmt$(Math.abs(net)).replace('$','$')}
          </span>
          <span style={{fontSize:12,color:'var(--txm)'}}>
            over {pts.length} closed trade{pts.length!==1?'s':''}
          </span>
        </div>

        {/* minHeight reserves the chart's space during the first measuring pass
            so the card doesn't jump once the SVG appears. */}
        <div style={{width:'100%',position:'relative',minHeight:H}}>
          {ready&&(<>
          <svg width={w} height={H} tabIndex={0} role="img"
               aria-label={'Equity curve, '+(net>=0?'up ':'down ')+tbFmt$(Math.abs(net))+' over '+pts.length+' closed trades'}
               onMouseMove={onMove} onMouseLeave={()=>setHover(null)} onKeyDown={onKey}
               onTouchStart={onTouch} onTouchMove={onTouch}
               style={{display:'block',width:'100%',maxWidth:'100%',outline:'none',touchAction:'pan-y'}}>
            <defs>
              <linearGradient id="tb-eq-fill" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%"   stopColor={'rgba('+rgb+',0.16)'}/>
                <stop offset="100%" stopColor={'rgba('+rgb+',0.01)'}/>
              </linearGradient>
            </defs>

            {/* Recessive hairline grid + y ticks (they carry what isn't direct-labelled). */}
            {ticks.map((t,ti)=>(
              <g key={t}>
                <line x1={PL} x2={PL+innerW} y1={Y(t)} y2={Y(t)} stroke="var(--bd)" strokeWidth="1"/>
                <text x={PL-8} y={Y(t)+4} textAnchor="end"
                      style={{fontSize:axisFS,fill:'var(--txm)',fontVariantNumeric:'tabular-nums'}}>
                  {tickLabels[ti]}
                </text>
              </g>
            ))}
            {/* Break-even reads a step stronger than the grid — polarity is the point. */}
            <line x1={PL} x2={PL+innerW} y1={Y(0)} y2={Y(0)} stroke="var(--bdl)" strokeWidth="1"/>

            <path d={areaPath} fill="url(#tb-eq-fill)"/>
            <path d={linePath} fill="none" stroke={col} strokeWidth="2"
                  strokeLinejoin="round" strokeLinecap="round"/>

            {/* Endpoint marker with a 2px surface ring so it survives crossing the line. */}
            <circle cx={X(pts.length-1)} cy={Y(pts[pts.length-1].y)} r={compact?5:4.5}
                    fill={col} stroke="var(--s1)" strokeWidth="2"/>

            {/* Crosshair snaps to the nearest trade — the reader aims at a date. */}
            {hp&&(<g>
              <line x1={X(hover)} x2={X(hover)} y1={PT} y2={PT+innerH} stroke="var(--bdl)" strokeWidth="1"/>
              <circle cx={X(hover)} cy={Y(hp.y)} r={compact?5:4.5} fill={col} stroke="var(--s1)" strokeWidth="2"/>
            </g>)}

            {/* Endpoint dates pin to the plot edges; any intermediate ticks sit
                on their own trade, centred. */}
            {xIdx.map((i,k)=>{
              const first=k===0, last=k===xIdx.length-1;
              const anchor=xIdx.length===1?'middle':(first?'start':(last?'end':'middle'));
              const x=xIdx.length===1?PL+innerW/2:(first?PL:(last?PL+innerW:X(i)));
              return(<text key={i} x={x} y={H-8} textAnchor={anchor}
                           style={{fontSize:axisFS,fill:'var(--txm)'}}>{fmtDay(pts[i].t)}</text>);
            })}
          </svg>

          {/* Value leads, label follows; the series is keyed with a stroke, not a box.
              The box is sized and placed against the MEASURED width, then flipped
              below the point when there's no room above — on a short mobile chart
              a fixed "always above" box got clipped by the top of the card. */}
          {hp&&(()=>{
            const TW=Math.min(168,Math.max(118,w-10));      // never wider than the card
            const TH=70;
            const left=Math.max(0,Math.min(w-TW,X(hover)-TW/2));
            const top=Y(hp.y)-TH-6>=0?Y(hp.y)-TH-6:Math.min(H-TH-2,Y(hp.y)+12);
            return(<div style={{position:'absolute',pointerEvents:'none',left,top,width:TW,
                   background:'var(--s2)',border:'1px solid var(--bdl)',borderRadius:8,
                   padding:'8px 10px',boxShadow:'0 8px 24px rgba(0,0,0,.5)'}}>
              <div style={{display:'flex',alignItems:'center',gap:7}}>
                <span style={{width:12,height:2,borderRadius:1,background:col,flexShrink:0}}/>
                <span style={{fontFamily:'IBM Plex Mono,monospace',fontSize:14,fontWeight:800,color:'var(--tx)'}}>
                  {(hp.y>=0?'+':'−')+tbFmt$(Math.abs(hp.y))}
                </span>
              </div>
              <div style={{fontSize:11,color:'var(--txm)',marginTop:3}}>
                {fmtDay(hp.t)} · {hp.ticker}
              </div>
              <div style={{fontSize:11,color:'var(--txm)'}}>
                trade {(hp.pnl>=0?'+':'−')+tbFmt$(Math.abs(hp.pnl))}
              </div>
            </div>);
          })()}
          </>)}
        </div>

        {/* Nothing is gated behind hover. */}
        <button onClick={()=>setShowTable(v=>!v)}
          style={{background:'transparent',border:'none',color:'var(--txm)',fontSize:11,fontWeight:600,
                  cursor:'pointer',padding:'8px 0 2px',minHeight:30,textDecoration:'underline',textUnderlineOffset:3}}>
          {showTable?'Hide table':'View as table'}
        </button>
        {/* Four short columns, so the table is capped rather than stretched: at
            full-window width a 100%-wide table pushed Date and Equity ~900px
            apart and the eye had to travel the whole card to read one row.
            Fixed layout + a max width keeps a row scannable in one fixation and
            the columns in a predictable place. overflowX still lets it scroll
            inside the card on a phone instead of widening it. */}
        {showTable&&(<div style={{maxHeight:compact?240:280,overflowY:'auto',overflowX:'auto',marginTop:8,
                                  WebkitOverflowScrolling:'touch'}}>
          <table style={{width:'100%',maxWidth:compact?'none':520,minWidth:compact?300:0,
                         tableLayout:'fixed',borderCollapse:'collapse',fontSize:12}}>
            <colgroup><col style={{width:'24%'}}/><col style={{width:'20%'}}/>
                      <col style={{width:'28%'}}/><col style={{width:'28%'}}/></colgroup>
            <thead><tr>{['Date','Symbol','Trade','Equity'].map(h=>(
              <th key={h} style={{padding:'6px 10px 6px 0',textAlign:h==='Date'||h==='Symbol'?'left':'right',
                    fontSize:10,fontWeight:800,color:'var(--txm)',textTransform:'uppercase',letterSpacing:1,
                    borderBottom:'1px solid var(--bd)',position:'sticky',top:0,background:'var(--s1)'}}>{h}</th>))}</tr></thead>
            <tbody>{pts.map((p,i)=>(
              <tr key={i} style={{borderBottom:'1px solid var(--bd)'}}>
                <td style={{padding:'5px 10px 5px 0',color:'var(--txm)',whiteSpace:'nowrap'}}>{fmtDay(p.t)}</td>
                <td style={{padding:'5px 10px 5px 0',color:'var(--txd)',whiteSpace:'nowrap',
                      overflow:'hidden',textOverflow:'ellipsis'}}>{p.ticker}</td>
                <td style={{padding:'5px 10px 5px 0',textAlign:'right',fontFamily:'IBM Plex Mono,monospace',
                      color:tbPnlCol(p.pnl),fontVariantNumeric:'tabular-nums',whiteSpace:'nowrap'}}>
                  {(p.pnl>=0?'+':'−')+tbFmt$(Math.abs(p.pnl))}
                </td>
                <td style={{padding:'5px 0',textAlign:'right',fontFamily:'IBM Plex Mono,monospace',
                      color:'var(--tx)',fontVariantNumeric:'tabular-nums',whiteSpace:'nowrap'}}>
                  {(p.y>=0?'+':'−')+tbFmt$(Math.abs(p.y))}
                </td>
              </tr>))}</tbody>
          </table>
        </div>)}
      </>)}
    </div>
  </div>);
}

function TBJournalPage(){
  const jHook=useTBJournal();
  const isMobile=useIsMobile();
  const [modal,setModal]=useState(null);
  const [search,setSearch]=useState('');
  const [filter,setFilter]=useState('ALL');
  const [sortCol,setSortCol]=useState('date');
  const [sortDir,setSortDir]=useState(-1);
  /* Job state lives in the store, never here — leaving the tab mid-sync and
     coming back must still show "Syncing…" and then the result. */
  const syncing=jHook.busy==='sync';
  const remerging=jHook.busy==='remerge';
  const csvImporting=jHook.busy==='import';
  const csvToast=(_tbJournalStore.msg&&Date.now()-_tbJournalStore.msgAt<TB_JMSG_TTL)?_tbJournalStore.msg:null;
  const csvInputRef=useRef(null);
  const [selectMode,setSelectMode]=useState(false);
  const [selected,setSelected]=useState(new Set());

  const toggleSelect=id=>setSelected(prev=>{const n=new Set(prev);n.has(id)?n.delete(id):n.add(id);return n;});
  const selectAll=()=>setSelected(new Set(filtered.map(t=>t.id)));
  const clearSelect=()=>{setSelected(new Set());setSelectMode(false);};
  const deleteSelected=async()=>{
    /* Snapshot both selected AND all filtered IDs at call time.
       If "Select All" was used, use filtered snapshot to avoid stale-Set race. */
    const ids=selected.size===filtered.length
      ? filtered.map(t=>t.id)   /* all-selected: use freshest filtered list */
      : [...selected];
    setSelectMode(false);
    setSelected(new Set());
    await jHook.delBulk(ids);
  };

  const filtered=useMemo(()=>{
    let t=[...jHook.trades];
    if(search.trim())t=t.filter(x=>(x.ticker||'').toLowerCase().includes(search.toLowerCase())||(x.notes||'').toLowerCase().includes(search.toLowerCase())||(x.setupType||'').toLowerCase().includes(search.toLowerCase()));
    if(filter!=='ALL')t=t.filter(x=>{const s=tbComputeTradeStats(x);if(filter==='OPEN')return s.status==='OPEN';if(filter==='WIN')return s.netPnL!=null&&s.netPnL>0;if(filter==='LOSS')return s.netPnL!=null&&s.netPnL<0;return true;});
    t.sort((a,b)=>{
      if(sortCol==='date'){const lastSell=tr=>{const sells=(tr.legs||[]).filter(l=>l.action==='SELL');const dts=sells.map(l=>new Date(l.datetime)).filter(d=>!isNaN(d));if(dts.length)return Math.max(...dts.map(d=>d.getTime()));return new Date((tr.legs?.[0]?.datetime||tr.date)||0).getTime();};return sortDir*(lastSell(a)-lastSell(b));}
      const va=a[sortCol]??0,vb=b[sortCol]??0;
      return typeof va==='string'?sortDir*va.localeCompare(vb||''):sortDir*((parseFloat(va)||0)-(parseFloat(vb)||0));
    });
    return t;
  },[jHook.trades,search,filter,sortCol,sortDir]);

  const toggleSort=k=>{if(sortCol===k){if(sortDir===1){setSortCol('date');setSortDir(-1);}else setSortDir(1);}else{setSortCol(k);setSortDir(-1);}};
  const arr=k=>sortCol===k?<TBIcon n={sortDir===-1?'arrowDown':'arrowUp'} size={11}/>:<TBIcon n="sort" size={11} style={{opacity:.45}}/>;
  const Th=({k,ch,r})=>(<th onClick={()=>toggleSort(k)} style={{padding:'9px 14px',fontSize:10,fontWeight:800,color:sortCol===k?'var(--ac)':'var(--txm)',textTransform:'uppercase',letterSpacing:1.5,cursor:'pointer',userSelect:'none',textAlign:r?'right':'left',whiteSpace:'nowrap',background:'var(--s2)',borderBottom:'1px solid var(--bd)'}}>{ch} <span style={{opacity:.5}}>{arr(k)}</span></th>);
  const SH=({ch,r})=>(<th style={{padding:'9px 14px',fontSize:10,fontWeight:800,color:'var(--txm)',textTransform:'uppercase',letterSpacing:1.5,textAlign:r?'right':'left',whiteSpace:'nowrap',background:'var(--s2)',borderBottom:'1px solid var(--bd)'}}>{ch}</th>);

  /* All three just kick the store's job and return — the job itself owns the
     button state and the result message, so navigating away mid-run is fine. */
  const doSync=()=>{jHook.sync();};

  const doRemerge=async()=>{
    if(!(await window.uiConfirm('Re-merge all Webull trades from their fills using FIFO grouping? Fixes split/mismatched trades. Manual & CSV trades are not touched.',{title:'Re-merge trades',okLabel:'Re-merge'})))return;
    jHook.rebuild();
  };

  const doImportCSV=async(e)=>{
    const file=e.target.files&&e.target.files[0];
    if(!file){return;}
    e.target.value=''; /* reset so same file can be re-selected */
    const text=await file.text();
    const result=await jHook.importCSV(text);
    if(result&&!result.ok&&!result.busy)_tbJournalStore.note('Import failed: '+(result.error||'unknown error'));
  };

  const doExportCSV=()=>{
    const trades=jHook.trades;
    if(!trades||!trades.length){_tbJournalStore.note('No trades to export.');return;}
    /* Helper: wrap cell in quotes, escape internal quotes */
    const cell=v=>{
      if(v==null||v===undefined||v==='')return'';
      const s=String(v).replace(/"/g,'""');
      return(s.includes(',')||s.includes('"')||s.includes('\n'))?`"${s}"`:s;
    };
    /* Determine max leg count across all trades for columnar layout */
    const maxLegs=Math.max(...trades.map(t=>(t.legs||[]).length),1);
    /* Build header row — static trade fields + per-leg columns */
    const legHdrs=Array.from({length:maxLegs},(_,i)=>[
      `Leg${i+1}_Action`,`Leg${i+1}_DateTime`,`Leg${i+1}_Qty`,`Leg${i+1}_Price`,`Leg${i+1}_Fee`
    ]).flat();
    const headers=[
      'TradeID','Date','Symbol','Market','Direction','Status','Source',
      'Buy_Qty','Avg_Entry','Avg_Exit','Entry_Total','Exit_Total',
      'Total_Fees','Hold_Time','Realized_PnL','PnL_Pct',
      'Setup_Type','Timeframe','Confidence','Target','Stop_Loss',
      'Tags','Notes',
      ...legHdrs
    ];
    const rows=[headers.join(',')];
    trades.forEach(t=>{
      const s=tbComputeTradeStats(t);
      const legs=t.legs||[];
      /* Format dates: prefer last SELL datetime for "Date", fallback to first BUY or t.date */
      const sells=legs.filter(l=>l.action==='SELL');
      const sellDates=sells.map(l=>new Date(l.datetime)).filter(d=>!isNaN(d.getTime()));
      const buys=legs.filter(l=>l.action==='BUY');
      const buyDates=buys.map(l=>new Date(l.datetime)).filter(d=>!isNaN(d.getTime()));
      const tradeDate=sellDates.length
        ?new Date(Math.max(...sellDates.map(d=>d.getTime())))
        :buyDates.length?buyDates[0]:(t.date?new Date(t.date):null);
      const fmtDate=d=>{if(!d||isNaN(d.getTime()))return'';const mm=String(d.getMonth()+1).padStart(2,'0');const dd=String(d.getDate()).padStart(2,'0');const hh=String(d.getHours()).padStart(2,'0');const min=String(d.getMinutes()).padStart(2,'0');return`${d.getFullYear()}-${mm}-${dd} ${hh}:${min}`;};
      const staticCols=[
        cell(t.id||''),
        cell(fmtDate(tradeDate)),
        cell(t.ticker||''),
        cell(t.market||'STOCK'),
        cell(t.direction||'LONG'),
        cell(s.status||''),
        cell(t.source||''),
        cell(s.buyQty!=null?Number(s.buyQty.toFixed(6)):''),
        cell(s.avgEntry?Number(s.avgEntry.toFixed(4)):''),
        cell(s.avgExit?Number(s.avgExit.toFixed(4)):''),
        cell(s.entryTotal?Number(s.entryTotal.toFixed(4)):''),
        cell(s.exitTotal?Number(s.exitTotal.toFixed(4)):''),
        cell(s.totalFees!=null?Number(s.totalFees.toFixed(4)):''),
        cell(s.holdTime||''),
        cell(s.netPnL!=null?Number(s.netPnL.toFixed(4)):''),
        cell(s.pnlPct!=null?Number(s.pnlPct.toFixed(4)):''),
        cell(t.setupType||''),
        cell(t.timeframe||''),
        cell(t.confidence!=null&&t.confidence!==0?t.confidence:''),
        cell(t.target||''),
        cell(t.stopLoss||''),
        cell((t.tags||[]).join('; ')),
        cell(t.notes||''),
      ];
      /* Per-leg columns, padded to maxLegs */
      const legCols=[];
      for(let i=0;i<maxLegs;i++){
        const l=legs[i];
        if(l){
          const ldt=l.datetime?fmtDate(new Date(l.datetime)):'';
          legCols.push(cell(l.action||''),cell(ldt),cell(l.qty!=null?l.qty:''),cell(l.price!=null?l.price:''),cell(l.fee!=null?l.fee:''));
        }else{
          legCols.push('','','','','');
        }
      }
      rows.push([...staticCols,...legCols].join(','));
    });
    const csv=rows.join('\r\n');
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    const now=new Date();
    const stamp=`${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`;
    a.href=url;a.download=`taskhub_trades_${stamp}.csv`;a.style.display='none';
    document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);document.body.removeChild(a);},500);
    _tbJournalStore.note(`Exported ${trades.length} trade${trades.length!==1?'s':''}`);
  };

  return(
    <div className="tb-fade-in" style={{display:'flex',flexDirection:'column',gap:16,padding:'16px clamp(10px,4vw,28px) 40px'}}>
      <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
        <div style={{flex:1,minWidth:140}}>
          <div style={{fontSize:20,fontWeight:800,color:'var(--tx)'}}>Journal</div>
          <div style={{fontSize:13,color:'var(--txm)'}}>{jHook.trades.length} trades{jHook.lastSync?` · Synced ${new Date(jHook.lastSync).toLocaleString([],{dateStyle:'short',timeStyle:'short'})}`:''}</div>
        </div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
        {!selectMode&&localStorage.getItem('td6_mainDash')==='tony'&&<button className="tb-btn-ghost" onClick={doSync} disabled={!!jHook.busy} style={{fontSize:13}}><><TBIcon n="refresh"/> {syncing?'Syncing…':'Webull Sync'}</></button>}
        {!selectMode&&localStorage.getItem('td6_mainDash')==='tony'&&<button className="tb-btn-ghost" onClick={doRemerge} disabled={!!jHook.busy} style={{fontSize:13}} title="Rebuild Webull trades from fills with correct FIFO grouping"><><TBIcon n="rotateCcw"/> {remerging?'Re-merging…':'Re-merge'}</></button>}
        {!selectMode&&<button className="tb-btn-ghost" onClick={()=>setModal('add')} style={{fontSize:13}}><TBIcon n="plus"/> Manual Trade</button>}
        {!selectMode&&<button className="tb-btn-ghost" onClick={()=>csvInputRef.current&&csvInputRef.current.click()} disabled={!!jHook.busy} style={{fontSize:13}}><><TBIcon n="fileIn"/> {csvImporting?'Importing…':'Import CSV'}</></button>}
        {!selectMode&&<button className="tb-btn-ghost" onClick={doExportCSV} disabled={!jHook.trades.length} style={{fontSize:13}}><TBIcon n="download"/> Export CSV</button>}
        {!selectMode&&<button className="tb-btn-ghost" onClick={()=>setSelectMode(true)} style={{fontSize:13}}><TBIcon n="check"/> Select</button>}
        {selectMode&&<span style={{fontSize:13,color:'var(--txm)',fontWeight:600}}>{selected.size} selected</span>}
        {selectMode&&<button className="tb-btn-ghost" onClick={selectAll} style={{fontSize:12}}>Select All</button>}
        {selectMode&&selected.size>0&&<button onClick={deleteSelected} style={{display:'inline-flex',alignItems:'center',gap:5,background:'rgba(214,138,124,0.12)',color:'var(--tbr)',border:'1.5px solid rgba(214,138,124,0.35)',borderRadius:100,padding:'7px 16px',fontSize:13,fontWeight:700,cursor:'pointer',display:'inline-flex',alignItems:'center',gap:6}}><TBIcon n="trash"/> Delete {selected.size}</button>}
        {selectMode&&<button className="tb-btn-ghost" onClick={clearSelect} style={{fontSize:12}}>Cancel</button>}
        <input ref={csvInputRef} type="file" accept=".csv,text/csv" style={{display:'none'}} onChange={doImportCSV}/>
        </div>
      </div>
      <TBJournalStats trades={jHook.trades} activeFilter={filter} onFilterChange={setFilter}/>
      <TBEquityCurve trades={jHook.trades}/>
      <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search symbol, notes, setup…" style={{background:'var(--s2)',border:'1px solid var(--bd)',borderRadius:8,color:'var(--tx)',fontSize:14,padding:'7px 14px',outline:'none',width:'min(230px,100%)',flex:1,minWidth:0}} onFocus={e=>e.target.style.borderColor='var(--ac)'} onBlur={e=>e.target.style.borderColor='var(--bd)'}/>
        <div style={{marginLeft:'auto',fontSize:13,color:'var(--txm)'}}>{filtered.length} trade{filtered.length!==1?'s':''}</div>
      </div>
      <div className="tb-card" style={{padding:0,overflow:'hidden'}}>

/* ── Realized P&L via FIFO over Webull filled-order history ──
   Worker /api/portfolio/summary account object has NO realizedPnL field
   (Webull balance endpoint never returns it), so derive it client-side by
   FIFO-matching SELLs against earliest BUYs per symbol. Returns null when
   there are no closed round-trips (so UI can fall back to '—'). */
function tbRealizedFromHistory(history){
  if(!Array.isArray(history)||!history.length)return null;
  const ev=history.map(h=>({
    sym:(h.symbol||h.ticker||'').toUpperCase(),
    side:(h.action||h.side||'').toUpperCase(),
    qty:parseFloat(h.filledQty??h.filled??h.qty)||0,
    price:parseFloat(h.avgFilledPrice??h.avgFill??h.avgPrice??h.price)||0,
    fee:parseFloat(h.totalCommission??h.commission??h.fee)||0,
    ts:new Date(h.filledAt||h.filledTime||h.tradeTime||h.orderTime||h.datetime||h.date||0).getTime()||0,
  })).filter(e=>e.sym&&e.qty>0&&(e.side==='BUY'||e.side==='SELL'));
  if(!ev.length)return null;
  ev.sort((a,b)=>a.ts-b.ts);
  const lots={}; let realized=0; let matched=false;
  for(const e of ev){
    if(!lots[e.sym])lots[e.sym]=[];
    if(e.side==='BUY'){lots[e.sym].push({qty:e.qty,price:e.price});realized-=e.fee;}
    else{
      let rem=e.qty;
      while(rem>0&&lots[e.sym].length){
        const lot=lots[e.sym][0];
        const m=Math.min(rem,lot.qty);
        realized+=(e.price-lot.price)*m; matched=true;
        lot.qty-=m; rem-=m;
        if(lot.qty<=1e-9)lots[e.sym].shift();
      }
      realized-=e.fee;
    }
  }
  return matched?realized:null;
}

/* ══ US Market Clock (NYSE/Nasdaq) ══════════════════════════════════════════
   Computed entirely client-side in true Eastern Time — a live open/closed clock
   shouldn't round-trip an API every second, and this keeps working even if the
   Webull token is expired. Holidays are COMPUTED from NYSE rules, so the
   calendar is correct for any year and never needs manual updating. ── */
// Holiday/half-day rules: nth-weekday-of-month, Easter computus for Good Friday,
// and Sat→Fri / Sun→Mon observance (New Year is NOT observed when it lands on a
// Saturday). Mirror of the same logic in workers/newshub-api/worker.js.
function tbMktDow(y,m,d){return new Date(Date.UTC(y,m-1,d)).getUTCDay();}
function tbMktNthDow(y,m,wd,n){let c=0;for(let d=1;d<=31;d++){if(tbMktDow(y,m,d)===wd&&++c===n)return d;}return null;}
function tbMktLastDow(y,m,wd){const dim=new Date(Date.UTC(y,m,0)).getUTCDate();for(let d=dim;d>=1;d--)if(tbMktDow(y,m,d)===wd)return d;}
function tbMktIso(y,m,d){return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;}
function tbMktEaster(Y){const a=Y%19,b=Math.floor(Y/100),c=Y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451);return [Math.floor((h+l-7*m+114)/31),((h+l-7*m+114)%31)+1];}
function tbMktObserve(y,m,d,isNY){const w=tbMktDow(y,m,d);if(w===6)return isNY?null:tbMktIso(y,m,d-1);if(w===0)return tbMktIso(y,m,d+1);return tbMktIso(y,m,d);}
function tbMktComputeYear(Y){
  const H={},HD={};
  const ny=tbMktObserve(Y,1,1,true); if(ny)H[ny]="New Year's Day";
  H[tbMktIso(Y,1,tbMktNthDow(Y,1,1,3))]='MLK Jr. Day';
  H[tbMktIso(Y,2,tbMktNthDow(Y,2,1,3))]="Presidents' Day";
  const [em,ed]=tbMktEaster(Y); const gf=new Date(Date.UTC(Y,em-1,ed)); gf.setUTCDate(gf.getUTCDate()-2);
  H[tbMktIso(gf.getUTCFullYear(),gf.getUTCMonth()+1,gf.getUTCDate())]='Good Friday';
  H[tbMktIso(Y,5,tbMktLastDow(Y,5,1))]='Memorial Day';
  if(Y>=2022)H[tbMktObserve(Y,6,19,false)]='Juneteenth';
  H[tbMktObserve(Y,7,4,false)]='Independence Day';
  H[tbMktIso(Y,9,tbMktNthDow(Y,9,1,1))]='Labor Day';
  const tg=tbMktNthDow(Y,11,4,4); H[tbMktIso(Y,11,tg)]='Thanksgiving Day';
  const xm=tbMktObserve(Y,12,25,false); H[xm]='Christmas Day';
  HD[tbMktIso(Y,11,tg+1)]='Day after Thanksgiving';
  const j4=tbMktDow(Y,7,4); if(j4>=2&&j4<=5)HD[tbMktIso(Y,7,3)]='Independence Day Eve';
  const d24=tbMktDow(Y,12,24); if(d24>=1&&d24<=5&&xm!==tbMktIso(Y,12,24))HD[tbMktIso(Y,12,24)]='Christmas Eve';
  return {H,HD};
}
const _tbMktHolCache={};
function tbMktHolYear(Y){return _tbMktHolCache[Y]||(_tbMktHolCache[Y]=tbMktComputeYear(Y));}
function tbMktHolidayName(ds){return tbMktHolYear(+ds.slice(0,4)).H[ds]||null;}
function tbMktHalfdayName(ds){return tbMktHolYear(+ds.slice(0,4)).HD[ds]||null;}

function tbMktDateAdd(s,n){const[Y,M,D]=s.split('-').map(Number);const d=new Date(Date.UTC(Y,M-1,D));d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function tbMktWeekday(s){const[Y,M,D]=s.split('-').map(Number);return new Date(Date.UTC(Y,M-1,D)).getUTCDay();} // 0=Sun..6=Sat
function tbMktIsTradingDay(s){const wd=tbMktWeekday(s);return wd!==0&&wd!==6&&!tbMktHolidayName(s);}
function tbMktNextTradingDay(s,incl){let d=incl?s:tbMktDateAdd(s,1);for(let i=0;i<14;i++){if(tbMktIsTradingDay(d))return d;d=tbMktDateAdd(d,1);}return d;}
// Wall-clock parts in America/New_York for a given Date.
function tbNyParts(date){const p=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(date).reduce((a,x)=>{a[x.type]=x.value;return a},{});let hh=+p.hour;if(hh===24)hh=0;return{dateStr:`${p.year}-${p.month}-${p.day}`,hh,mm:+p.minute,ss:+p.second};}
// UTC ms timestamp for a given NY wall-clock date+time (DST-safe).
function tbNyTs(dateStr,hh,mm){const[Y,M,D]=dateStr.split('-').map(Number);const guess=Date.UTC(Y,M-1,D,hh,mm,0);const p=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).formatToParts(new Date(guess)).reduce((a,x)=>{a[x.type]=x.value;return a},{});let hr=+p.hour;if(hr===24)hr=0;const asTz=Date.UTC(+p.year,+p.month-1,+p.day,hr,+p.minute);return guess-(asTz-guess);}
function tbMktState(now){
  const {dateStr,hh,mm}=tbNyParts(now);
  const t=hh*60+mm;
  const wd=tbMktWeekday(dateStr);
  const tradable=wd!==0&&wd!==6&&!tbMktHolidayName(dateStr);
  const half=tbMktHalfdayName(dateStr);
  const regClose=half?13*60:16*60;          // 1:00 or 4:00 PM ET
  const postEnd=half?17*60:20*60;            // extended session end
  let phase='closed';
  if(tradable){
    if(t<240)phase='closed';                 // before 4:00 AM
    else if(t<570)phase='pre';               // 4:00–9:30
    else if(t<regClose)phase='regular';      // 9:30–close
    else if(t<postEnd)phase='after';         // close–8:00 PM
    else phase='closed';
  }
  const nextOpenDate=(tradable&&t<570)?dateStr:tbMktNextTradingDay(dateStr,false);
  return {dateStr,t,phase,half,tradable,holiday:tbMktHolidayName(dateStr),regClose,postEnd,
    regOpenTs:tbNyTs(dateStr,9,30),
    regCloseTs:tbNyTs(dateStr,Math.floor(regClose/60),regClose%60),
    postEndTs:tbNyTs(dateStr,Math.floor(postEnd/60),postEnd%60),
    nextOpenTs:tbNyTs(nextOpenDate,9,30),nextOpenDate};
}
function tbCountdown(ms){if(ms<0)ms=0;const s=Math.floor(ms/1000);const d=Math.floor(s/86400);const h=Math.floor(s%86400/3600);const m=Math.floor(s%3600/60);const ss=s%60;if(d>0)return `${d}d ${h}h ${m}m`;if(h>0)return `${h}h ${m}m ${ss}s`;return `${m}m ${ss}s`;}
function tbMktDayLabel(dateStr){return new Date(dateStr+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});}
// Format a UTC timestamp in the VIEWER'S local timezone (auto-detected by the
// browser), so market times read e.g. "7:30 AM MST" in Colorado, "9:30 AM EDT" in NY.
function tbLocalTime(ts){return new Date(ts).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});}
function tbLocalTimeTz(ts){return new Date(ts).toLocaleTimeString([],{hour:'numeric',minute:'2-digit',timeZoneName:'short'});}

function TBMarketStatus({isMobile}){
  const [now,setNow]=useState(()=>new Date());
  useEffect(()=>{const id=setInterval(()=>setNow(new Date()),1000);return()=>clearInterval(id);},[]);
  const st=useMemo(()=>tbMktState(now),[now]);
  const PHASE={
    // Sage, not signal-green: the same soft green the rest of the suite uses for
    // "good", so the OPEN rail sits beside the gold instead of shouting over it.
    regular:{label:'OPEN',sub:'Regular Hours',tone:'#a4b986'},
    pre:    {label:'PRE-MARKET',sub:'Extended Hours',tone:'#a8c4e0'},
    after:  {label:'AFTER HOURS',sub:'Extended Hours',tone:'#8fa9c4'},
    closed: {label:'CLOSED',sub:st.holiday||(st.tradable?'Market Closed':'Weekend'),tone:'#8d8d94'},
  }[st.phase];
  let cdLabel,cdTs;
  if(st.phase==='regular'){cdLabel='Closes in';cdTs=st.regCloseTs;}
  else if(st.phase==='pre'){cdLabel='Opens in';cdTs=st.regOpenTs;}
  else if(st.phase==='after'){cdLabel='Extended closes in';cdTs=st.postEndTs;}
  else {cdLabel='Opens in';cdTs=st.nextOpenTs;}
  const cd=tbCountdown(cdTs-now.getTime());
  const hoursLine=st.tradable
    ? `Today · ${tbLocalTime(st.regOpenTs)} – ${tbLocalTimeTz(st.regCloseTs)}${st.half?' (early close)':''}`
    : `Opens ${tbMktDayLabel(st.nextOpenDate)} · ${tbLocalTimeTz(st.nextOpenTs)}`;
  // Computed on the fly for the current + next year (covers any month boundary).
  const yNow=+st.dateStr.slice(0,4);
  const upcoming=[yNow,yNow+1].flatMap(Y=>{const {H,HD}=tbMktHolYear(Y);return [
    ...Object.entries(H).map(([d,n])=>({d,n,half:false})),
    ...Object.entries(HD).map(([d,n])=>({d,n,half:true})),
  ];}).filter(x=>x.d>=st.dateStr).sort((a,b)=>a.d.localeCompare(b.d)).slice(0,3);

  return (<div className="tb-card" style={{padding:isMobile?'14px 16px':'16px 20px',borderLeft:`3px solid ${PHASE.tone}`}}>
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:12,flexWrap:'wrap'}}>
      <div style={{display:'flex',alignItems:'center',gap:11,minWidth:0}}>
        <span style={{width:11,height:11,borderRadius:'50%',background:PHASE.tone,flexShrink:0,boxShadow:`0 0 0 4px ${PHASE.tone}22`,animation:st.phase==='regular'?'tb-pulse 2s ease-in-out infinite':'none'}}/>
        <div style={{minWidth:0}}>
          <div style={{display:'flex',alignItems:'baseline',gap:8,flexWrap:'wrap'}}>
            <span style={{fontSize:18,fontWeight:900,letterSpacing:.5,color:PHASE.tone}}>{PHASE.label}</span>
            <span style={{fontSize:11,fontWeight:700,color:'var(--txm)',textTransform:'uppercase',letterSpacing:1}}>US Markets</span>
          </div>
          <div style={{fontSize:12,color:'var(--txm)',marginTop:1}}>{PHASE.sub}</div>
        </div>
      </div>
      <div style={{textAlign:isMobile?'left':'right'}}>
        <div style={{fontSize:10,fontWeight:800,color:'var(--txm)',textTransform:'uppercase',letterSpacing:1.2}}>{cdLabel}</div>
        <div style={{fontFamily:'IBM Plex Mono,monospace',fontSize:18,fontWeight:800,color:'var(--tx)'}}>{cd}</div>
      </div>
    </div>
    <div style={{fontSize:12,color:'var(--txd)',marginTop:10,paddingTop:10,borderTop:'1px solid var(--bd)'}}>{hoursLine}</div>
    {upcoming.length>0&&<div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:8}}>
      {upcoming.map(u=>(<div key={u.d} style={{display:'flex',alignItems:'center',gap:6,background:'var(--s2)',border:'1px solid var(--bd)',borderRadius:8,padding:'4px 9px'}}>
        <span style={{fontSize:11,fontWeight:800,color:'var(--txd)',fontFamily:'IBM Plex Mono,monospace'}}>{tbMktDayLabel(u.d)}</span>
        <span style={{fontSize:11,color:'var(--txm)'}}>{u.n}</span>
        <span style={{fontSize:8.5,fontWeight:800,letterSpacing:.3,textTransform:'uppercase',color:u.half?'#e0b57c':'#adadb2',background:(u.half?'#e0b57c':'#adadb2')+'1a',borderRadius:4,padding:'1px 5px'}}>{u.half?'½ day':'closed'}</span>
      </div>))}
    </div>}
  </div>);
}

/* ── Portfolio Page (Webull, Cloudflare) ── */
function TBPortfolioPage(){
  const {data,loading,error,lastFetch,refresh}=useTBPortfolio();
  const isMobile=useIsMobile();
  const acct=data?.account;const positions=data?.positions||[];const orders=data?.orders||[];const history=data?.history||[];const activities=data?.activities||[];const errs=data?.errors||{};
  const [tab,setTab]=useState('positions');

  const CWR_URL='https://tradeboard-api.av1.workers.dev';
  const [connecting,setConnecting]=useState(false);
  const [connectMsg,setConnectMsg]=useState('');
  const autoReconnectedRef=useRef(false);

  // ── Auto-reconnect ──────────────────────────────────────────────────────────
  // When the portfolio ends up offline, silently do what the Connect button does
  // (point at the Worker, confirm the token is live, re-pull) so Tony never has to
  // tap the button for a routine reconnect. Only when the token genuinely needs an
  // SMS re-verify (tokenStatus ≠ NORMAL) do we fall back to the manual screen. Runs
  // once per mount; retries transient drops are already handled inside refresh().
  useEffect(()=>{
    if(!(error&&!data)||autoReconnectedRef.current||connecting)return;
    autoReconnectedRef.current=true;
    (async()=>{
      try{localStorage.setItem('tb_api_base',CWR_URL);}catch(e){}
      try{
        const hr=await fetch(CWR_URL+'/api/health',{cache:'no-store'});
        const hj=await hr.json().catch(()=>({}));
        if(hj&&hj.tokenStatus==='NORMAL'){
          // Token is live — a full reload picks up a corrected Worker URL if the
          // in-memory base drifted; otherwise just re-pull in place. The reload is
          // gated to once per tab session so a blocked localStorage write (which
          // would leave TB_API_BASE stale) can never spin into a reload loop.
          if(TB_API_BASE!==CWR_URL&&!sessionStorage.getItem('tb_pf_autoreload')){
            try{sessionStorage.setItem('tb_pf_autoreload','1');}catch(e){}
            window.location.reload();return;
          }
          await refresh();
        }
      }catch(e){/* leave the manual screen up as a fallback */}
    })();
  },[error,data,connecting,refresh]);

  const handleConnect=async()=>{
    setConnecting(true);setConnectMsg('Setting Worker URL…');
    try{localStorage.setItem('tb_api_base',CWR_URL);}catch(e){}
    setConnectMsg('Checking connection…');
    await new Promise(r=>setTimeout(r,600));
    setConnectMsg('Checking Webull token…');
    try{
      const hr=await fetch(CWR_URL+'/api/health');
      const hj=await hr.json();
      if(hj.tokenStatus==='NORMAL'){
        setConnectMsg('Connected! Loading portfolio…');
        await new Promise(r=>setTimeout(r,800));
        setConnecting(false);setConnectMsg('');
        window.location.reload();
        return;
      }
      setConnectMsg('Token missing — creating new token…');
      const tr=await fetch(CWR_URL+'/api/portfolio/create-token',{method:'POST'});
      const tj=await tr.json();
      if(tj.ok){
        setConnectMsg('Token created! Open Webull app → Menu → Messages → OpenAPI Notifications → verify SMS code. Then tap Connect again.');
      } else {
        setConnectMsg('Token error: '+(tj.error||'unknown'));
      }
    }catch(e){
      setConnectMsg('Cannot reach Worker. Check that wrangler deploy has been run.');
    }
    setConnecting(false);
  };

  if(error&&!data){
    return(<div className="tb-fade-in" style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:isMobile?'32px 20px':'48px',textAlign:'center',gap:20,maxWidth:520,margin:'0 auto',width:'100%'}}>
      <TBIcon n="pieChart" size={44} style={{opacity:.3,marginBottom:4}}/>
      <div style={{fontFamily:'Manrope,system-ui,sans-serif',fontSize:isMobile?22:26,fontWeight:700,color:'var(--tx)'}}>Portfolio Offline</div>
      <div style={{fontSize:14,color:'var(--txm)',lineHeight:1.7}}>Tap the button below to automatically connect to your Webull account via Cloudflare.</div>
      {/* ── Big connect button ── */}
      <button onClick={handleConnect} disabled={connecting} style={{background:connecting?'var(--s3)':'var(--ac)',color:'#fff',border:'none',borderRadius:14,padding:'16px 40px',fontSize:17,fontWeight:800,cursor:connecting?'not-allowed':'pointer',width:'100%',maxWidth:340,transition:'all .2s',boxShadow:connecting?'none':'0 4px 20px rgba(224,184,116,0.4)',letterSpacing:.3}}>
        {connecting?<span><TBIcon n="refresh" size={15}/> Connecting…</span>:<span><TBIcon n="bolt" size={15}/> Connect to Webull</span>}
      </button>
      {/* Status message */}
      {connectMsg&&<div style={{fontSize:13,color:/^Connected!/.test(connectMsg)?'var(--tbb)':'var(--txd)',background:'var(--s2)',border:'1px solid var(--bd)',borderRadius:10,padding:'12px 16px',width:'100%',lineHeight:1.7,textAlign:'left'}}>{connectMsg}</div>}
      {/* Only show error + retry after user has attempted connect */}
      {connectMsg&&!/^Connected!/.test(connectMsg)&&<div style={{fontSize:11,color:'var(--tbe)',background:'rgba(212,122,106,0.06)',border:'1px solid rgba(212,122,106,0.15)',borderRadius:8,padding:'8px 14px',width:'100%',textAlign:'left',opacity:.8}}>{error}</div>}
    </div>);
  }

  const totalUnreal=positions.reduce((s,p)=>s+(p.unrealizedPnL||0),0);
  const totalMktVal=positions.reduce((s,p)=>s+(p.marketValue||0),0);
  const tabs=[{id:'positions',label:'Positions',count:positions.length},{id:'orders',label:'Open Orders',count:orders.length},{id:'history',label:'History',count:history.length},{id:'activity',label:'Activity',count:activities.length}];

  /* Per-section empty state. fetchSequential() reports a failed section in
     data.errors rather than failing the whole pull, so a Webull hiccup used to
     render as a confident "No open orders." — indistinguishable from a genuinely
     empty table. Show the reason when there is one. */
  const TableEmpty=({msg,err})=>(<div style={{padding:'40px',textAlign:'center',color:err?'var(--tbe)':'var(--txm)',fontStyle:"normal",fontFamily:"var(--font-accent)",fontSize:13}}>{err?`Webull fetch failed — ${err}`:msg}</div>);

  const StatCard=({label,value,sub,color})=>(<div className="tb-card" style={{padding:'14px 18px'}}>
    <div style={{fontSize:10,fontWeight:800,color:'var(--txm)',textTransform:'uppercase',letterSpacing:1.5,marginBottom:6}}>{label}</div>
    <div style={{fontFamily:'IBM Plex Mono,monospace',fontSize:20,fontWeight:800,color:color||'var(--tx)'}}>{value}</div>
    {sub&&<div style={{fontSize:10,color:'var(--txm)',marginTop:3}}>{sub}</div>}
  </div>);

  return(<div className="tb-fade-in" style={{display:'flex',flexDirection:'column',gap:18,padding:'16px clamp(10px,4vw,28px) 40px'}}>
    <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
      <div style={{flex:1}}><div style={{fontSize:20,fontWeight:800,color:'var(--tx)'}}>Portfolio</div>{lastFetch&&<div style={{fontSize:13,color:'var(--txm)'}}>Updated {lastFetch.toLocaleString([],{dateStyle:'short',timeStyle:'short'})}</div>}</div>
      {loading&&<span style={{fontSize:14,color:'var(--txm)',display:'flex',alignItems:'center',gap:5}}><span style={{display:'inline-block',animation:'tb-spin 1s linear infinite'}}>⟳</span>Refreshing…</span>}
      {error&&<div style={{fontSize:13,color:'var(--tbe)',background:'rgba(212,122,106,0.08)',border:'1px solid rgba(212,122,106,0.2)',borderRadius:8,padding:'4px 12px'}}>{error}</div>}
      <button className="tb-btn-ghost" onClick={refresh} disabled={loading} style={{fontSize:11}}><TBIcon n="refresh"/> Refresh</button>
    </div>
    <TBMarketStatus isMobile={isMobile}/>
    {acct&&(()=>{
      /* Webull field aliases — worker may return camelCase or snake_case variants */
      const p=v=>parseFloat(v)||0;
      /* Field names confirmed from live Webull API response */
      const dayPnL=p(acct.dayPnL??acct.dayPnl??acct.todayPnL);
      const realPnLWorker=p(acct.realizedPnL??acct.realizedPnl??acct.realized_pnl);
      /* Webull's own total_unrealized_profit_loss is the number shown in the app;
         summing the position rows is only the fallback when it omits the field. */
      const unrealAcct=p(acct.unrealizedPnL??acct.unrealized_pnl??acct.unrealizedPnl);
      const unreal=unrealAcct!==0?unrealAcct:totalUnreal;
      const realCalc=tbRealizedFromHistory(history);
      const realPnL=realPnLWorker!==0?realPnLWorker:(realCalc!=null?realCalc:0);
      const totalVal=p(acct.totalValue??acct.netLiquidation??acct.total_value);
      const cash=p(acct.cashBalance??acct.settledCash??acct.cash??acct.cash_balance);
      let bp=p(acct.buyingPower??acct.overnightBP??acct.buying_power??acct.usableCash??acct.usable_cash??acct.availableFunds??acct.available_funds);
      const bpRaw=bp;
      if(bp<=0||(totalVal>0&&bp>totalVal+0.01))bp=cash;
      if(bpRaw!==bp)console.warn('[TradeBoard] buyingPower from API looked wrong ('+bpRaw+'), showing settled cash instead ('+bp+')');
      return(<div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))',gap:12}} className="tb-stat-cards-grid">
        <StatCard label="Total Value" value={tbFmt$(totalVal)} sub={`${acct.accountType||acct.account_type||''} · ${acct.currency||'USD'}`}/>
        <StatCard label="Cash Balance" value={tbFmt$(cash)}/>
        <StatCard label="Buying Power" value={tbFmt$(bp)}/>
        <StatCard label="Day P&L" value={dayPnL!==0?tbFmt$(dayPnL):'—'} color={dayPnL!==0?tbPnlCol(dayPnL):'var(--txm)'} sub={dayPnL>0?'▲ Today':dayPnL<0?'▼ Today':'Today'}/>
        <StatCard label="Unrealized P&L" value={tbFmt$(unreal)} color={tbPnlCol(unreal)} sub={`${positions.length} position${positions.length===1?'':'s'}`}/>
        <StatCard label="Realized P&L" value={realPnL!==0?tbFmt$(realPnL):'—'} color={realPnL!==0?tbPnlCol(realPnL):'var(--txm)'} sub={realPnL!==0&&realPnLWorker===0?'FIFO from history':undefined}/>
      </div>);
    })()}
    {acct&&(()=>{
      /* Free Webull account fields the worker already fetches but never surfaced. */
      const extra=[
        /* Margin buying power — mirrors the three figures on Webull's account
           screen. Worker sends null (not 0) when Webull omits one, so an
           unavailable figure hides rather than showing a fake $0.00. */
        ['Intraday BP','intradayBP'],['Overnight BP','overnightBP'],['Options BP','optionsBP'],
        ['Market Value','marketValue'],['Settled Cash','settledCash'],['Unsettled Cash','unsettledCash'],
        ['Initial Margin','initialMargin'],['Maint. Margin','maintenanceMargin'],
        ['Excess Liquidity','excessLiquidity'],
      ].filter(([_,k])=>acct[k]!=null&&acct[k]!==''&&!isNaN(parseFloat(acct[k])));
      if(!extra.length)return null;
      return(<details className="tb-card" style={{padding:'0'}}>
        <summary style={{listStyle:'none',cursor:'pointer',padding:'13px 18px',display:'flex',alignItems:'center',justifyContent:'space-between',userSelect:'none'}}>
          <span style={{fontSize:11,fontWeight:800,color:'var(--txm)',textTransform:'uppercase',letterSpacing:1.5}}>Account Details</span>
          <span style={{fontSize:11,fontWeight:700,color:'var(--ac)'}}>{extra.length} more ›</span>
        </summary>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))',gap:1,background:'var(--bd)',borderTop:'1px solid var(--bd)'}}>
          {extra.map(([label,k])=>(<div key={k} style={{background:'var(--s1)',padding:'12px 18px'}}>
            <div style={{fontSize:10,fontWeight:800,color:'var(--txm)',textTransform:'uppercase',letterSpacing:1,marginBottom:4}}>{label}</div>
            <div style={{fontFamily:'IBM Plex Mono,monospace',fontSize:15,fontWeight:700,color:'var(--txd)'}}>{tbFmt$(parseFloat(acct[k]))}</div>
          </div>))}
        </div>
      </details>);
    })()}
    <div style={{display:'flex',gap:2,background:'var(--s2)',borderRadius:10,padding:3,width:'fit-content'}}>
      {tabs.map(t=>(<button key={t.id} onClick={()=>setTab(t.id)} style={{padding:'6px 16px',borderRadius:8,border:'none',background:tab===t.id?'var(--s3)':'transparent',color:tab===t.id?'var(--tx)':'var(--txm)',fontSize:12,fontWeight:tab===t.id?700:500,cursor:'pointer',transition:'all .15s'}}>{t.label}{t.count>0?` (${t.count})`:''}</button>))}
    </div>
    {tab==='positions'&&<div className="tb-card" style={{padding:0,overflow:'hidden'}}>
      {!positions.length?<TableEmpty msg="No open positions." err={errs.positions}/>:
      <div style={{overflowX:'auto'}}><table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
        {/* Avg Cost and Last mirror the two figures Webull shows on its own position
            row — the worker already fetches both (cost_price / last_price). */}
        <thead><tr>{['Symbol','Qty','Avg Cost','Last','Market Val','Unreal P&L','% P&L','Day %'].map(h=><th key={h} style={{padding:'9px 14px',fontSize:10,fontWeight:800,color:'var(--txm)',textTransform:'uppercase',letterSpacing:1.5,textAlign:h==='Symbol'?'left':'right',background:'var(--s2)',borderBottom:'1px solid var(--bd)',whiteSpace:'nowrap'}}>{h}</th>)}</tr></thead>
        <tbody>{positions.map((p,i)=>(<tr key={i} style={{borderBottom:'1px solid var(--bd)'}} onMouseEnter={e=>e.currentTarget.style.background='var(--s2)'} onMouseLeave={e=>e.currentTarget.style.background=''}>
          <td style={{padding:'11px 14px',fontFamily:'IBM Plex Mono,monospace',fontWeight:700,fontSize:15,color:'var(--tx)'}}>{p.ticker||p.symbol||'—'}</td>
          <td style={{padding:'11px 14px',textAlign:'right',fontFamily:'IBM Plex Mono,monospace',fontSize:14,color:'var(--txd)'}}>{tbFmtNum(p.shares)}</td>
          <td style={{padding:'11px 14px',textAlign:'right',fontFamily:'IBM Plex Mono,monospace',fontSize:14,color:'var(--txm)'}}>{p.avgCost?tbFmt$(p.avgCost):'—'}</td>
          <td style={{padding:'11px 14px',textAlign:'right',fontFamily:'IBM Plex Mono,monospace',fontSize:14,color:'var(--txd)'}}>{p.currentPrice?tbFmt$(p.currentPrice):'—'}</td>
          <td style={{padding:'11px 14px',textAlign:'right',fontFamily:'IBM Plex Mono,monospace',fontSize:14,color:'var(--txd)'}}>{tbFmt$(p.marketValue)}</td>
          <td style={{padding:'11px 14px',textAlign:'right',fontFamily:'IBM Plex Mono,monospace',fontSize:14,color:tbPnlCol(p.unrealizedPnL),fontWeight:700}}>{tbFmt$(p.unrealizedPnL)}</td>
          <td style={{padding:'11px 14px',textAlign:'right',fontFamily:'IBM Plex Mono,monospace',fontSize:14,color:tbPnlCol(p.unrealizedPct)}}>{tbFmtPct(p.unrealizedPct)}</td>
          <td style={{padding:'11px 14px',textAlign:'right',fontFamily:'IBM Plex Mono,monospace',fontSize:14,color:tbPnlCol(p.lastChangePct)}}>{tbFmtPct(p.lastChangePct)}</td>
        </tr>))}</tbody>
      </table></div>}
    </div>}
    {tab==='orders'&&<div className="tb-card" style={{padding:0,overflow:'hidden'}}>
      {!orders.length?<TableEmpty msg="No open orders." err={errs.orders}/>:
      <div style={{overflowX:'auto'}}><table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
        <thead><tr>{['Symbol','Action','Qty','Filled','Price','Type','TIF','Status','Placed'].map(h=><th key={h} style={{padding:'9px 12px',fontSize:10,fontWeight:800,color:'var(--txm)',textTransform:'uppercase',letterSpacing:1.5,textAlign:'left',background:'var(--s2)',borderBottom:'1px solid var(--bd)',whiteSpace:'nowrap'}}>{h}</th>)}</tr></thead>
        <tbody>{orders.map((o,i)=>{
          /* The worker (workers/tradeboard-api) passes Webull's own order shape
             through as ticker / side / price — NOT symbol / action / limitPrice.
             Reading the wrong three names left Symbol, Action and Price blank
             (Price fell through to "MKT" on every limit order). Webull names
             first, old aliases kept as fallbacks. */
          const sym   = o.ticker||o.symbol||'—';
          const side  = (o.side||o.action||'').toUpperCase();
          const qty   = o.qty??o.totalQty??o.quantity;
          const filled= o.filled??o.filledQty??0;
          /* Webull only sends limit_price on LIMIT / STOP-LIMIT orders; a stop
             order carries its trigger in stop_price, a market order has neither. */
          const limit = parseFloat(o.price??o.limitPrice)||0;
          const stop  = parseFloat(o.stopPrice??o.stop_price)||0;
          const priceCell = limit>0?tbFmt$(limit):stop>0?`${tbFmt$(stop)} stp`:'MKT';
          return(<tr key={o.orderId||o.clientOrderId||i} style={{borderBottom:'1px solid var(--bd)'}} onMouseEnter={e=>e.currentTarget.style.background='var(--s2)'} onMouseLeave={e=>e.currentTarget.style.background=''}>
            <td style={{padding:'9px 12px',fontFamily:'IBM Plex Mono,monospace',fontWeight:700,fontSize:15,color:'var(--tx)'}}>{sym}</td>
            <td style={{padding:'9px 12px',fontSize:12,fontWeight:700,color:side==='SELL'?'var(--tbr)':'var(--tbb)'}}>{side||'—'}</td>
            <td style={{padding:'9px 12px',textAlign:'right',fontFamily:'IBM Plex Mono,monospace',color:'var(--txd)',fontSize:12}}>{tbFmtNum(qty)}</td>
            <td style={{padding:'9px 12px',textAlign:'right',fontFamily:'IBM Plex Mono,monospace',color:'var(--txd)',fontSize:12}}>{tbFmtNum(filled)}</td>
            <td style={{padding:'9px 12px',textAlign:'right',fontFamily:'IBM Plex Mono,monospace',color:'var(--txd)',fontSize:12}}>{priceCell}</td>
            <td style={{padding:'9px 12px',fontSize:13,color:'var(--txd)'}}>{(o.orderType||o.order_type||'—').toUpperCase()}</td>
            <td style={{padding:'9px 12px',fontSize:12,color:'var(--txm)'}}>{o.tif||'—'}</td>
            {/* Webull sends raw enums (PARTIAL_FILLED) — drop the underscore. */}
            <td style={{padding:'9px 12px',fontSize:13,color:'var(--tbw)'}}>{(o.status||'—').replace(/_/g,' ')}</td>
            {/* An open order is defined by NOT being filled — show when it was placed. */}
            <td style={{padding:'9px 12px',fontSize:13,color:'var(--txm)',whiteSpace:'nowrap'}}>{tbFmtDate(o.createdAt||o.filledAt)}</td>
          </tr>);
        })}</tbody>
      </table></div>}
    </div>}
    {tab==='history'&&<div className="tb-card" style={{padding:0,overflow:'hidden'}}>
      {!history.length?<TableEmpty msg="No trade history available. Sync Webull to populate." err={errs.history}/>:
      <div style={{overflowX:'auto'}}><table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
        <thead><tr>{['Date','Symbol','Action','Qty','Avg Price','Total','Fees','Status'].map(h=><th key={h} style={{padding:'9px 12px',fontSize:10,fontWeight:800,color:'var(--txm)',textTransform:'uppercase',letterSpacing:1.5,textAlign:h==='Symbol'||h==='Action'||h==='Status'?'left':'right',background:'var(--s2)',borderBottom:'1px solid var(--bd)',whiteSpace:'nowrap'}}>{h}</th>)}</tr></thead>
        <tbody>{history.map((h,i)=>{
          const isBuy=(h.action||h.side||'').toUpperCase()==='BUY';
          const qty=h.filledQty??h.filled??h.qty??0;
          const price=h.avgFilledPrice??h.avgFill??h.avgPrice??h.price??0;
          /* Webull's own filled_amount when it sends one (it already accounts for
             multi-fill orders whose average price rounds); qty x price otherwise. */
          const total=(parseFloat(h.total??h.filledAmount)||0)||((parseFloat(qty)||0)*(parseFloat(price)||0));
          const fee=h.totalCommission??h.commission??h.fee??0;
          /* createdAt (Webull place_time_at) last so a cancelled/expired order —
             which never gets a fill time — still shows the day it was placed. */
          const dt=h.filledAt||h.filledTime||h.tradeTime||h.orderTime||h.datetime||h.date||h.createdAt;
          const st=(h.status||'').toUpperCase();
          return(<tr key={i} style={{borderBottom:'1px solid var(--bd)'}} onMouseEnter={e=>e.currentTarget.style.background='var(--s2)'} onMouseLeave={e=>e.currentTarget.style.background=''}>
            <td style={{padding:'9px 12px',fontSize:12,color:'var(--txm)',whiteSpace:'nowrap'}}>{dt?tbFmtDate(dt):'—'}</td>
            <td style={{padding:'9px 12px',fontFamily:'IBM Plex Mono,monospace',fontWeight:700,fontSize:14,color:'var(--tx)'}}>{h.symbol||h.ticker||'—'}</td>
            <td style={{padding:'9px 12px',fontSize:12,fontWeight:700,color:isBuy?'var(--tbb)':'var(--tbr)'}}>{(h.action||h.side||'—').toUpperCase()}</td>
            <td style={{padding:'9px 12px',textAlign:'right',fontFamily:'IBM Plex Mono,monospace',color:'var(--txd)',fontSize:12}}>{tbFmtNum(qty)||'—'}</td>
            <td style={{padding:'9px 12px',textAlign:'right',fontFamily:'IBM Plex Mono,monospace',color:'var(--txd)',fontSize:12}}>{price?tbFmt$(price):'—'}</td>
            <td style={{padding:'9px 12px',textAlign:'right',fontFamily:'IBM Plex Mono,monospace',color:'var(--txd)',fontSize:13,fontWeight:600}}>{total?tbFmt$(total):'—'}</td>
            <td style={{padding:'9px 12px',textAlign:'right',fontFamily:'IBM Plex Mono,monospace',color:'var(--txm)',fontSize:12}}>{fee!=null&&fee!==''?tbFmt$(fee):'—'}</td>
            {/* --txw was never defined, so this cell rendered with an invalid colour. */}
            <td style={{padding:'9px 12px',fontSize:12,color:st.includes('FILL')?'var(--tbb)':st?'var(--txm)':'var(--txd)'}}>{(h.status||'—').replace(/_/g,' ')}</td>
          </tr>);
        })}</tbody>
      </table></div>}
    </div>}
    {tab==='activity'&&<div className="tb-card" style={{padding:0,overflow:'hidden'}}>
      {/* The worker returns activities:[] unconditionally — Webull's OpenAPI has no
          account-activity endpoint, so this is a permanent gap, not an empty week.
          Say so rather than implying the account had no activity. */}
      {!activities.length?<TableEmpty msg="Webull's API doesn't expose account activity (deposits, dividends, fees) — trades are under History." err={errs.activities}/>:
      <div style={{overflowX:'auto'}}><table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
        <thead><tr>{['Date','Type','Symbol','Amount','Description'].map(h=><th key={h} style={{padding:'9px 12px',fontSize:10,fontWeight:800,color:'var(--txm)',textTransform:'uppercase',letterSpacing:1.5,textAlign:'left',background:'var(--s2)',borderBottom:'1px solid var(--bd)',whiteSpace:'nowrap'}}>{h}</th>)}</tr></thead>
        <tbody>{activities.map((a,i)=>{
          const dt=a.date||a.datetime||a.createdAt;
          return(<tr key={i} style={{borderBottom:'1px solid var(--bd)'}} onMouseEnter={e=>e.currentTarget.style.background='var(--s2)'} onMouseLeave={e=>e.currentTarget.style.background=''}>
            <td style={{padding:'9px 12px',fontSize:12,color:'var(--txm)',whiteSpace:'nowrap'}}>{dt?tbFmtDate(dt):'—'}</td>
            <td style={{padding:'9px 12px',fontSize:12,fontWeight:700,color:'var(--ac)'}}>{a.type||a.activityType||'—'}</td>
            <td style={{padding:'9px 12px',fontFamily:'IBM Plex Mono,monospace',fontWeight:700,fontSize:13,color:'var(--tx)'}}>{a.symbol||a.ticker||'—'}</td>
            <td style={{padding:'9px 12px',fontFamily:'IBM Plex Mono,monospace',fontSize:13,color:a.amount>=0?'var(--tbb)':'var(--tbr)',fontWeight:600}}>{a.amount!=null?tbFmt$(a.amount):'—'}</td>
            <td style={{padding:'9px 12px',fontSize:13,color:'var(--txd)'}}>{a.description||a.desc||'—'}</td>
          </tr>);
        })}</tbody>
      </table></div>}
    </div>}
  </div>);
}

/* ── Watchlist Editor ── (Control tab) — single shared ticker list that drives
   News fetch, report parsing, sector inference, and the catalysts calendar.
   Same UX the News settings panel used to have; now the one source of truth. */
function TBWatchlistEditor({watchlist=[],onChange,onToast}){
  const [tickerInput,setTickerInput]=React.useState('');
  // Bump on async AI-sector arrival so chips repaint from 'Diversified' → real sector.
  const [sectorTick,setSectorTick]=React.useState(0);
  React.useEffect(()=>{const h=()=>setSectorTick(x=>x+1);window.addEventListener('tb-sectors-updated',h);tbResolveSectors(watchlist);return()=>window.removeEventListener('tb-sectors-updated',h);},[watchlist]);
  const sectors=React.useMemo(()=>{const s=new Set();watchlist.forEach(t=>s.add(tbInferSector(t)));return [...s].sort();},[watchlist,sectorTick]);
  const normTicker=(raw)=>(raw||'').trim().toUpperCase().replace(/[^A-Z0-9.\-]/g,'').slice(0,6);
  /* Accepts one OR many tickers — split on commas/whitespace/brackets so a
     pasted list like "DRAM, SNDK, MU" or "[NVDA AMD]" all add at once. */
  const addTicker=(raw)=>{
    const parts=(raw||'').split(/[,\s\[\]]+/).map(normTicker).filter(Boolean);
    if(!parts.length)return;
    const next=[...watchlist];
    parts.forEach(t=>{if(!next.includes(t))next.push(t);});
    onChange(next.slice(0,40));
    setTickerInput('');
  };
  const removeTicker=(t)=>onChange(watchlist.filter(x=>x!==t));
  const resetTickers=()=>onChange(tbGetDefaultWatchlist());
  // Persist the CURRENT list as the new default (what "Reset to default" restores).
  const setAsDefault=()=>{if(!watchlist.length)return;tbSetDefaultWatchlist(watchlist);onToast&&onToast(`Saved ${watchlist.length} ticker${watchlist.length!==1?'s':''} as your default watchlist`,'✓');};
  const canAdd=(tickerInput||'').split(/[,\s\[\]]+/).map(normTicker).filter(Boolean).length>0;

  return(<div className="tb-card tb-wl-card" style={{padding:'clamp(16px,4vw,24px)',marginBottom:18,maxWidth:900,margin:'0 auto 18px',width:'100%',boxSizing:'border-box'}}>
    {/* Header — matches the Prompts header (big, white) */}
    <div style={{display:'flex',alignItems:'flex-start',gap:12,marginBottom:18,flexWrap:'wrap'}}>
      <div style={{flex:1,minWidth:180}}>
        <div style={{fontSize:20,fontWeight:800,color:'var(--tx)'}}>Watchlist</div>
        <div style={{fontSize:13,color:'var(--txm)',marginTop:2,lineHeight:1.5}}>{watchlist.length} ticker{watchlist.length!==1?'s':''} · drives News &amp; Catalysts</div>
      </div>
      <div style={{display:'flex',gap:8,flexShrink:0,flexWrap:'wrap'}}>
        <button onClick={setAsDefault} disabled={!watchlist.length} title="Save the current watchlist as your default — this is what Reset to default restores"
          style={{padding:'7px 14px',borderRadius:100,border:'1px solid var(--bd)',background:'transparent',color:'var(--txd)',fontSize:12,fontWeight:700,cursor:watchlist.length?'pointer':'default',opacity:watchlist.length?1:0.4,transition:'all .15s'}}
          onMouseEnter={e=>{if(!watchlist.length)return;e.currentTarget.style.borderColor='var(--ac)';e.currentTarget.style.color='var(--ac)';}}
          onMouseLeave={e=>{e.currentTarget.style.borderColor='var(--bd)';e.currentTarget.style.color='var(--txd)';}}><TBIcon n="star"/> Set current as default</button>
        <button onClick={resetTickers} title="Reset to default watchlist"
          style={{padding:'7px 14px',borderRadius:100,border:'1px solid var(--bd)',background:'transparent',color:'var(--txd)',fontSize:12,fontWeight:700,cursor:'pointer',transition:'all .15s'}}
          onMouseEnter={e=>{e.currentTarget.style.borderColor='var(--ac)';e.currentTarget.style.color='var(--ac)';}}
          onMouseLeave={e=>{e.currentTarget.style.borderColor='var(--bd)';e.currentTarget.style.color='var(--txd)';}}><TBIcon n="rotateCcw"/> Reset to default</button>
      </div>
    </div>

    {/* Add row — stacks on mobile, inline on desktop */}
    <div style={{display:'flex',gap:8,marginBottom:18,flexWrap:'wrap'}}>
      <input value={tickerInput}
        onChange={e=>setTickerInput(e.target.value.toUpperCase())}
        onKeyDown={e=>{if(e.key==='Enter'){e.preventDefault();addTicker(tickerInput);}}}
        placeholder="Add tickers — comma or space separated (e.g. NVDA, MU, AMD)"
        style={{flex:'1 1 240px',minWidth:0,fontFamily:"'IBM Plex Mono',monospace",fontSize:14,fontWeight:700,letterSpacing:0.5,padding:'11px 14px',background:'var(--s1)',border:'1px solid var(--bd)',borderRadius:10,color:'var(--tx)',outline:'none'}}/>
      <button className="tb-btn-primary" onClick={()=>addTicker(tickerInput)} disabled={!canAdd} style={{flex:'0 0 auto',fontSize:13,padding:'11px 20px',opacity:canAdd?1:0.4}}>+ Add</button>
    </div>

    {/* Ticker chips — bigger, more legible */}
    <div style={{display:'flex',flexWrap:'wrap',gap:8,marginBottom:22}}>
      {watchlist.length===0&&<span style={{fontSize:13,color:'var(--txm)',fontFamily:'var(--font-accent)'}}>No tickers — add some above or reset to default.</span>}
      {[...watchlist].sort().map(t=>(
        <span key={t} style={{display:'inline-flex',alignItems:'center',gap:8,padding:'7px 8px 7px 13px',borderRadius:10,border:'1px solid var(--bd)',background:'var(--s1)'}}>
          <span style={{fontFamily:"'IBM Plex Mono',monospace",fontSize:14,fontWeight:800,letterSpacing:0.5,color:'var(--tx)'}}>{t}</span>
          <span title="Sector" style={{fontSize:10,fontWeight:600,color:'var(--txm)',padding:'2px 7px',borderRadius:100,background:'var(--s2)',whiteSpace:'nowrap'}}>{tbInferSector(t)}</span>
          <span onClick={()=>removeTicker(t)} title={'Remove '+t} role="button" style={{cursor:'pointer',color:'var(--txm)',fontSize:16,lineHeight:1,padding:'0 4px',fontWeight:700,transition:'color .15s'}}
            onMouseEnter={ev=>ev.currentTarget.style.color='var(--tbr)'}
            onMouseLeave={ev=>ev.currentTarget.style.color='var(--txm)'}>×</span>
        </span>
      ))}
    </div>

    {/* Bracket list — the watchlist in [A, B, C] form with a one-tap copy. Kept in
        add-order (not sorted) so it mirrors exactly what you typed. */}
    <div style={{fontSize:11,fontWeight:800,textTransform:'uppercase',letterSpacing:1.5,color:'var(--txm)',marginBottom:10}}>Copy list</div>
    <div style={{display:'flex',alignItems:'stretch',gap:8,marginBottom:22,flexWrap:'wrap'}}>
      <div style={{flex:'1 1 240px',minWidth:0,fontFamily:"'IBM Plex Mono',monospace",fontSize:13,fontWeight:700,color:'var(--txd)',background:'var(--s1)',border:'1px solid var(--bd)',borderRadius:10,padding:'11px 14px',wordBreak:'break-word',lineHeight:1.6}}>
        {watchlist.length?('['+watchlist.join(', ')+']'):'[]'}
      </div>
      <button onClick={()=>{const s='['+watchlist.join(', ')+']';const done=()=>onToast&&onToast('Copied '+watchlist.length+' ticker'+(watchlist.length!==1?'s':''),'copy');try{navigator.clipboard.writeText(s).then(done).catch(()=>{const ta=document.createElement('textarea');ta.value=s;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);done();});}catch(e){}}}
        disabled={!watchlist.length}
        style={{flex:'0 0 auto',alignSelf:'flex-start',padding:'11px 20px',borderRadius:10,border:'1px solid var(--bd)',background:'transparent',color:'var(--txd)',fontSize:13,fontWeight:700,cursor:watchlist.length?'pointer':'default',opacity:watchlist.length?1:0.4,transition:'all .15s'}}
        onMouseEnter={e=>{if(!watchlist.length)return;e.currentTarget.style.borderColor='var(--ac)';e.currentTarget.style.color='var(--ac)';}}
        onMouseLeave={e=>{e.currentTarget.style.borderColor='var(--bd)';e.currentTarget.style.color='var(--txd)';}}><TBIcon n="copy"/> Copy</button>
    </div>

    {/* Derived sectors */}
    <div style={{fontSize:11,fontWeight:800,textTransform:'uppercase',letterSpacing:1.5,color:'var(--txm)',marginBottom:10}}>Auto-derived sectors</div>
    <div style={{display:'flex',flexWrap:'wrap',gap:7}}>
      {sectors.length===0&&<span style={{fontSize:13,color:'var(--txm)',fontFamily:'var(--font-accent)'}}>—</span>}
      {sectors.map(s=>(
        <span key={s} style={{fontSize:12,fontWeight:600,padding:'3px 9px',borderRadius:5,background:'transparent',border:'1px solid var(--bd)',color:'var(--txd)'}}>{s}</span>
      ))}
    </div>
  </div>);
}

/* ── Control Page ── watchlist editor + prompt manager in one place. */
function TBControlPage({prompts,onSavePrompts,onToast,watchlist,onSaveWatchlist}){
  return(<div style={{width:'100%'}}>
    <TBWatchlistEditor watchlist={watchlist} onChange={onSaveWatchlist} onToast={onToast}/>
    <TBPromptPage prompts={prompts} onSave={onSavePrompts} onToast={onToast}/>
  </div>);
}

/* ── Prompt Page ── */
function TBPromptPage({prompts,onSave,onToast}){
  const [selected,setSelected]=useState(0);
  const [editing,setEditing]=useState(false);
  const [editText,setEditText]=useState('');
  const [editName,setEditName]=useState('');
  const [newName,setNewName]=useState('');
  const [copied,setCopied]=useState(false);
  const [fbSaving,setFbSaving]=useState(false);

  /* `selected` is an index into an array this component doesn't own, so it can
     briefly point past the end — the parent's prompts prop lands a render after
     the click that grew it. Falling back to prompts[0] there is what put the
     PREVIOUS prompt's text in the editor of a brand-new one. */
  const cur=prompts[selected]||prompts[0];
  /* Load the selected prompt into the editor fields. Two guards, both about not
     clobbering text the user can see:
       · keyed on the prompt's ID, not the array's identity — every save (and
         every Firebase echo) hands us fresh objects for the same prompt, and
         re-syncing on those would wipe whatever is being typed;
       · never while the editor is open — the two ways in (Edit, and addPrompt)
         both set the fields themselves, so any sync during an edit could only
         be a transient array state overwriting real input. */
  const syncedId=useRef(null);
  useEffect(()=>{
    if(!cur)return;
    const id=cur.id||('#'+selected);
    if(syncedId.current===id)return;
    syncedId.current=id;
    if(editing)return;
    setEditText(cur.text||'');setEditName(cur.name||'');
  },[cur,selected,editing]);

  const copy=()=>{navigator.clipboard.writeText(cur.text).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),1500);});};

  const saveEdit=()=>{
    const updated=prompts.map((p,i)=>i===selected?{...p,text:editText,name:editName}:p);
    onSave(updated);
    if(window._fbSaveTBPrompts){setFbSaving(true);window._fbSaveTBPrompts(updated);setTimeout(()=>setFbSaving(false),1600);}
    setEditing(false);onToast('Prompt saved','check');
  };

  const [addingNew,setAddingNew]=useState(false);
  const addPrompt=()=>{
    const name=(newName.trim()||'New Prompt');
    const np={id:'p_'+Date.now(),name,text:''};
    const updated=[...prompts,np];
    onSave(updated);if(window._fbSaveTBPrompts)window._fbSaveTBPrompts(updated);
    /* Point the editor at the new prompt HERE instead of leaving it to the sync
       effect above. The parent owns the prompts array, so its prop can land a
       render behind this click, and until it does `cur` still resolves to the
       prompt we were on — which is how a fresh, blank prompt opened showing (and
       then saving over) the previous prompt's text. */
    syncedId.current=np.id;
    setSelected(updated.length-1);setEditText('');setEditName(name);
    setNewName('');setAddingNew(false);setEditing(true);
  };

  const [delConfirm,setDelConfirm]=useState(false);
  const deletePrompt=()=>{
    if(prompts.length<=1){onToast('Cannot delete last prompt','alert');return;}
    setDelConfirm(true);
  };
  const confirmDelete=()=>{
    const updated=prompts.filter((_,i)=>i!==selected);
    onSave(updated);if(window._fbSaveTBPrompts)window._fbSaveTBPrompts(updated);
    setSelected(Math.max(0,selected-1));
    setDelConfirm(false);
  };

  const promptAreaH=useRef(null);
  const resize=useRef(null);
  /* Resize targets the inner textarea or pre element — allows both expand AND compress */
  useEffect(()=>{
    const handle=resize.current;if(!handle)return;
    let startY=0,startH=0,dragging=false;
    const getInner=()=>promptAreaH.current?.querySelector('textarea,.tb-prompt-render');
    const down=e=>{
      const inner=getInner();if(!inner)return;
      e.preventDefault();dragging=true;
      startY=(e.touches?e.touches[0].clientY:e.clientY)||0;
      startH=inner.offsetHeight;
      document.addEventListener('mousemove',move);document.addEventListener('mouseup',up);
      document.addEventListener('touchmove',move,{passive:false});document.addEventListener('touchend',up);
    };
    const move=e=>{
      if(!dragging)return;
      if(e.cancelable)e.preventDefault();
      const inner=getInner();if(!inner)return;
      const y=(e.touches?e.touches[0].clientY:e.clientY)||0;
      const newH=Math.max(80,startH+(y-startY));
      inner.style.minHeight=newH+'px';inner.style.height=newH+'px';
    };
    const up=()=>{dragging=false;document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);document.removeEventListener('touchmove',move);document.removeEventListener('touchend',up);};
    handle.addEventListener('mousedown',down);handle.addEventListener('touchstart',down,{passive:false});
    return()=>{handle.removeEventListener('mousedown',down);handle.removeEventListener('touchstart',down);};
  },[]);

  /* ── Drag-to-reorder prompt chips (pointer events → works mouse + touch) ── */
  const arrMove=(arr,from,to)=>{const a=arr.slice();const [x]=a.splice(from,1);a.splice(to,0,x);return a;};
  const dragState=useRef(null);
  const chipRefs=useRef([]);
  const [dragIdx,setDragIdx]=useState(-1);
  const [overIdx,setOverIdx]=useState(-1);
  const onChipDown=(i,e)=>{
    dragState.current={from:i,pointerId:e.pointerId,startX:e.clientX,startY:e.clientY,moved:false};
    try{e.currentTarget.setPointerCapture(e.pointerId);}catch(_){}
  };
  const onChipMove=(e)=>{
    const ds=dragState.current;if(!ds)return;
