/* ── Page editor — contentEditable so typing and pasting share one surface ──
   Deliberately UNCONTROLLED: re-rendering innerHTML on every keystroke would
   reset the caret to the top of the document. React owns the initial html (and
   remote updates that land while unfocused); the DOM owns it while typing. */
function TBPlaybookEditor({page,onChange,onDelete,onBack,isMobile,onToast}){
  const ref=useRef(null);
  const isDaily=page.id===TB_PB_DAILY_ID;
  const [confirmDel,setConfirmDel]=useState(false);   // inline two-step, like the Journal's delete

  const syncEmpty=useCallback(()=>{
    const el=ref.current; if(!el) return;
    const empty=!el.textContent.trim() && !el.querySelector('img,table,hr');
    el.setAttribute('data-empty',empty?'1':'0');
  },[]);

  // What this device last wrote up. Anything matching it is our OWN edit echoing
  // back through state — never a remote change — so the DOM must be left alone.
  const lastEmitted=useRef(null);

  // Mount: seed the DOM once from the saved html.
  useEffect(()=>{
    const el=ref.current; if(!el) return;
    el.innerHTML=tbSanitizeHtml(page.body||'');
    lastEmitted.current=el.innerHTML;
    syncEmpty();
  },[page.id]);

  // Remote edit from another device: adopt it only when this device isn't the one
  // typing, so an incoming snapshot can never yank the caret mid-sentence. The
  // lastEmitted check matters beyond that: editing the TITLE re-renders with the
  // editor unfocused, and without it every title keystroke would re-parse and
  // re-assign the body's innerHTML, blowing away its native undo history.
  useEffect(()=>{
    const el=ref.current; if(!el) return;
    if(document.activeElement===el) return;
    if(page.body===lastEmitted.current) return;
    const next=tbSanitizeHtml(page.body||'');
    if(el.innerHTML!==next){ el.innerHTML=next; lastEmitted.current=next; syncEmpty(); }
  },[page.body,page.id]);

  const emit=useCallback(()=>{
    const el=ref.current; if(!el) return;
    syncEmpty();
    lastEmitted.current=el.innerHTML;
    onChange({...page,body:el.innerHTML,updatedAt:Date.now()});
  },[page,onChange,syncEmpty]);

  const onPaste=useCallback((e)=>{
    const dt=e.clipboardData; if(!dt) return;
    const html=dt.getData('text/html');
    const text=dt.getData('text/plain');
    let out='';
    // Rendered source (ChatGPT, a web page, Word) → keep its structure. dropColor:
    // foreign text colours are stripped so black-on-white can't land invisible here.
    if(html && html.trim() && !tbHtmlIsPlain(html)) out=tbSanitizeHtml(html,{dropColor:true});
    // Raw markdown text → render it. Anything else → in verbatim, unparsed.
    else if(text && text.trim()) out=tbSanitizeHtml(tbLooksLikeMd(text)?tbMdToHtml(text):tbTextToHtml(text),{dropColor:true});
    if(!out) return;
    e.preventDefault();
    // execCommand is deprecated but remains the only cross-browser way to insert
    // rich HTML at the caret with native undo support.
    document.execCommand('insertHTML',false,out);
    emit();
  },[emit]);

  // Enter inside a contentEditable div creates a <div> per line in Chromium;
  // <p> matches the markdown output and this doc's styling.
  useEffect(()=>{ try{ document.execCommand('defaultParagraphSeparator',false,'p'); }catch(e){} },[]);

  const copyMd=()=>{
    const md=tbHtmlToMd(ref.current?ref.current.innerHTML:page.body);
    // writeText rejects asynchronously (denied permission, unfocused document),
    // so the toast has to hang off the promise or it would always claim success.
    Promise.resolve()
      .then(()=>navigator.clipboard.writeText(md))
      .then(()=>onToast&&onToast('Markdown copied','copy'))
      .catch(()=>onToast&&onToast('Copy failed \u2014 clipboard blocked','alert'));
  };

  return(<div style={{display:'flex',flexDirection:'column',gap:14,minWidth:0}}>
    <div className="tb-pb-head" style={{display:'flex',flexDirection:'column'}}>
      <div style={{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
        {isMobile&&<button className="tb-btn-ghost" onClick={onBack} style={{padding:'6px 14px',fontSize:12}}>‹ Pages</button>}
        <input value={page.title||''} onChange={e=>onChange({...page,title:e.target.value,updatedAt:Date.now()})}
          placeholder="Page title" spellCheck={false}
          style={{flex:1,minWidth:120,background:'transparent',border:'none',borderBottom:'1px solid var(--bd)',color:'var(--tx)',
            fontFamily:"'Manrope',system-ui,-apple-system,sans-serif",fontSize:isMobile?19:23,fontWeight:700,padding:'6px 2px',outline:'none'}}/>
        {isDaily&&<span title="Trading Auto Launch shows this page before it opens anything"
          style={{fontSize:8.5,background:'rgba(164,185,134,0.18)',color:'var(--tbb)',border:'1px solid rgba(164,185,134,0.35)',
            borderRadius:4,padding:'3px 7px',fontWeight:800,letterSpacing:.6,whiteSpace:'nowrap'}}>AUTOLAUNCH</span>}
        <button className="tb-btn-ghost" onClick={copyMd} style={{padding:'6px 14px',fontSize:12}} title="Copy this page as Markdown"><TBIcon n="copy"/> Copy</button>
        {!isDaily&&(!confirmDel
          ?<button className="tb-btn-danger" onClick={()=>setConfirmDel(true)} style={{padding:'6px 14px',fontSize:12}}><TBIcon n="trash"/> Delete</button>
          :<div style={{display:'flex',gap:7,alignItems:'center'}}>
            <span style={{fontSize:12,color:'var(--tbe)',whiteSpace:'nowrap'}}>Delete page?</span>
            <button onClick={onDelete} style={{padding:'6px 14px',borderRadius:100,border:'none',background:'var(--tbr)',color:'#fff',fontWeight:700,fontSize:12,cursor:'pointer'}}>Yes</button>
            <button className="tb-btn-ghost" onClick={()=>setConfirmDel(false)} style={{padding:'6px 14px',fontSize:12}}>No</button>
          </div>)}
      </div>
      <TBPlaybookToolbar editorRef={ref} emit={emit}/>
    </div>

    <div className="tb-card" style={{padding:0,overflow:'hidden'}}>
      <div ref={ref} className="tb-pb-doc" contentEditable suppressContentEditableWarning
        data-placeholder="Type your notes, or paste from ChatGPT / a doc — formatting is preserved."
        onInput={emit} onPaste={onPaste} onBlur={emit}
        spellCheck={true}
        style={{minHeight:isMobile?300:420,padding:isMobile?'18px 16px':'26px 30px'}}/>
    </div>

    <div style={{fontSize:11,color:'var(--txm)',paddingLeft:2}}>
      {isDaily
        ? 'The Trading Auto Launch shows this page every trading morning and waits for you to confirm it before opening anything.'
        : 'Saves automatically. Paste keeps headings, bold, lists, tables, code and links.'}
    </div>
  </div>);
}

function TBPlaybookPage({pages,onSavePages,onToast}){
  const list=tbPbNormalize(pages);
  const [selId,setSelId]=useState(list[0].id);
  const [mobileEditing,setMobileEditing]=useState(false);
  const isMobile=useIsMobile();

  const sel=list.find(p=>p.id===selId)||list[0];

  const updatePage=useCallback((next)=>{
    onSavePages(tbPbNormalize(list.map(p=>p.id===next.id?next:p)));
  },[list,onSavePages]);

  const addPage=()=>{
    const p={id:tbPbNewId(),title:'Untitled page',body:'',createdAt:Date.now(),updatedAt:Date.now()};
    onSavePages(tbPbNormalize([...list,p]));
    setSelId(p.id); setMobileEditing(true);
    onToast&&onToast('Page added','＋');
  };
  const deletePage=(id)=>{
    if(id===TB_PB_DAILY_ID) return;                       // AutoLaunch depends on it
    const next=tbPbNormalize(list.filter(x=>x.id!==id));
    onSavePages(next);
    setSelId(next[0].id); setMobileEditing(false);
    onToast&&onToast('Page deleted','trash');
  };

  const sidebar=(<div className={isMobile?undefined:'tb-pb-side'} style={{display:'flex',flexDirection:'column',gap:6,minWidth:0}}>
    <div className="tb-section-label" style={{padding:'0 2px 6px'}}>Pages</div>
    {list.map(p=>(
      <button key={p.id} className={'tb-pb-item'+(p.id===selId&&!isMobile?' active':'')}
        onClick={()=>{setSelId(p.id);setMobileEditing(true);}}>
        <TBIcon n={p.id===TB_PB_DAILY_ID?'sun':'doc'} size={13} style={{opacity:.75}}/>
        <span style={{flex:1,minWidth:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.title||'Untitled page'}</span>
        {p.id===TB_PB_DAILY_ID&&<span style={{fontSize:7.5,background:'rgba(164,185,134,0.18)',color:'var(--tbb)',
          border:'1px solid rgba(164,185,134,0.35)',borderRadius:3,padding:'2px 5px',fontWeight:800,letterSpacing:.4}}>AUTO</span>}
      </button>
    ))}
    <button className="tb-btn-ghost" onClick={addPage} style={{marginTop:8,justifyContent:'center',padding:'8px 14px',fontSize:12.5}}>＋ New page</button>
  </div>);

  const editor=<TBPlaybookEditor key={sel.id} page={sel} onChange={updatePage} onDelete={()=>deletePage(sel.id)}
    onBack={()=>setMobileEditing(false)} isMobile={isMobile} onToast={onToast}/>;

  return(<div className="tb-fade-in" style={{display:'flex',flexDirection:'column',gap:8}}>
    <div style={{fontSize:20,fontWeight:800,color:'var(--tx)'}}>Playbook</div>
    {isMobile
      ? (mobileEditing?editor:sidebar)
      : <div style={{display:'grid',gridTemplateColumns:'240px 1fr',gap:22,alignItems:'start'}}>{sidebar}{editor}</div>}
  </div>);
}

function TBApp(){
  const [page,setPage]=useState('portfolio');
  const [navOrder,setNavOrder]=useState(tbLoadNavOrder);
  const onReorderNav=useCallback((ids)=>{
    setNavOrder(ids); tbSaveNavOrder(ids);
    if(window._fbSaveNavOrder) window._fbSaveNavOrder(ids);   // cross-device sync (best-effort)
  },[]);
  // Load nav order from Firebase on boot + apply live changes from other devices.
  useEffect(()=>{
    const apply=(ids)=>{ if(Array.isArray(ids)&&ids.length){ setNavOrder(ids); tbSaveNavOrder(ids); } };
    const onRemote=(e)=>apply(e.detail);
    window.addEventListener('fb-tb-navorder-remote',onRemote);
    const boot=async()=>{ try{ if(window._fbLoadTBDash){ const d=await window._fbLoadTBDash(); if(d&&Array.isArray(d.navOrder)) apply(d.navOrder); } }catch(_){} };
    if(window._fbReady) boot(); else window.addEventListener('fb-ready',boot,{once:true});
    return ()=>{ window.removeEventListener('fb-tb-navorder-remote',onRemote); window.removeEventListener('fb-ready',boot); };
  },[]);
  const [tabLockManage,setTabLockManage]=useState(null);
  const [prompts,setPrompts]=useState(tbLoadPromptsLocal);
  const [analysisCfg,setAnalysisCfg]=useState(tbLoadAnalysisCfg);
  const [watchlist,setWatchlist]=useState(tbLoadWatchlistLocal);
  const [playbook,setPlaybook]=useState(tbLoadPlaybookLocal);
  const [toast,setToast]=useState(null);
  const [fbLoaded,setFbLoaded]=useState(false);
  const [tbSyncStatus,setTbSyncStatus]=useState(''); // 'saving'|'saved'|'error'|''
  const [tbPortfolioOk,setTbPortfolioOk]=useState(false);

  /* Sync state machine — matches Tony's TaskHub behavior exactly:
     idle→saving→saved (visible 2.5s)→live (hidden). error stays until next save. */
  useEffect(()=>{
    let lastSavedAt=0, errorTimer=null;
    const onSaved=()=>{ lastSavedAt=Date.now(); if(errorTimer){clearTimeout(errorTimer);errorTimer=null;} setTbSyncStatus('saved'); };
    const onSaving=()=>setTbSyncStatus('saving');
    // Defer showing an error briefly. If a 'saved' lands within the window (a
    // concurrent write that DID succeed — e.g. report saved while a prompt bump
    // raced), the error is suppressed. Only a real, unrescued failure shows.
    const onError=()=>{
      if(Date.now()-lastSavedAt<1500) return;            // a success just happened → ignore
      if(errorTimer)clearTimeout(errorTimer);
      errorTimer=setTimeout(()=>{
        if(Date.now()-lastSavedAt<1500) return;          // success arrived during the wait
        setTbSyncStatus('error');
      },1600);
    };
    window.addEventListener('fb-tb-journal-saved',onSaved);
    window.addEventListener('fb-tb-prompts-saved',onSaved);
    window.addEventListener('fb-tb-news-saved',onSaved);
    window.addEventListener('fb-tb-analysis-saved',onSaved);
    window.addEventListener('fb-tb-watchlist-saved',onSaved);
    window.addEventListener('fb-tb-playbook-saved',onSaved);
    window.addEventListener('fb-tb-dash-saved',onSaved);
    window.addEventListener('fb-tb-marketcal-saved',onSaved);
    window.addEventListener('fb-tb-journal-error',onError);
    window.addEventListener('fb-tb-prompts-error',onError);
    window.addEventListener('fb-tb-news-error',onError);
    window.addEventListener('fb-tb-analysis-error',onError);
    window.addEventListener('fb-tb-watchlist-error',onError);
    window.addEventListener('fb-tb-playbook-error',onError);
    window.addEventListener('fb-tb-dash-error',onError);
    window.addEventListener('fb-tb-marketcal-error',onError);
    window.addEventListener('fb-tb-saving',onSaving);
    return()=>{
      if(errorTimer)clearTimeout(errorTimer);
      window.removeEventListener('fb-tb-journal-saved',onSaved);
      window.removeEventListener('fb-tb-prompts-saved',onSaved);
      window.removeEventListener('fb-tb-news-saved',onSaved);
      window.removeEventListener('fb-tb-analysis-saved',onSaved);
      window.removeEventListener('fb-tb-watchlist-saved',onSaved);
      window.removeEventListener('fb-tb-playbook-saved',onSaved);
      window.removeEventListener('fb-tb-dash-saved',onSaved);
      window.removeEventListener('fb-tb-marketcal-saved',onSaved);
      window.removeEventListener('fb-tb-journal-error',onError);
      window.removeEventListener('fb-tb-prompts-error',onError);
      window.removeEventListener('fb-tb-news-error',onError);
      window.removeEventListener('fb-tb-analysis-error',onError);
      window.removeEventListener('fb-tb-watchlist-error',onError);
      window.removeEventListener('fb-tb-playbook-error',onError);
      window.removeEventListener('fb-tb-dash-error',onError);
      window.removeEventListener('fb-tb-marketcal-error',onError);
      window.removeEventListener('fb-tb-saving',onSaving);
    };
  },[]);
  /* Auto-fade 'saved' → 'live' (hidden) after 2500ms — same as TaskHub */
  useEffect(()=>{if(tbSyncStatus==='saved'){const t=setTimeout(()=>setTbSyncStatus('live'),2500);return()=>clearTimeout(t);}},[tbSyncStatus]);

  /* Portfolio connected check — set by TBPortfolioPage via window callback */
  useEffect(()=>{
    window._tbSetPortfolioOk=(ok)=>setTbPortfolioOk(!!ok);
    return()=>{window._tbSetPortfolioOk=null;};
  },[]);

  /* ── Morning orchestrator: every morning at/after 6:00 AM local, make sure
     Catalysts, Portfolio, and the Journal Webull sync are ALL ready the moment
     TradeHub opens — no tab visit, no manual action. Runs at the APP level so it's
     independent of which tab is showing. A 5-min tick re-checks; each piece is
     guarded so it fires at most once per morning slot.
     ONE slot for all four pieces: the EVERY-DAY 6am local slot (Mon-Sun,
     holidays included — see tbLastMorningSlot). Catalysts, News, Portfolio and
     Journal therefore all refresh on every calendar day, so opening TradeHub on a
     Saturday shows Saturday's data instead of Friday's. News/Portfolio/Journal used
     to run on a trading-day slot, which meant their guards stayed satisfied from
     Friday all the way through the weekend and nothing refreshed until Monday.
     News is here at all because the worker cron pre-warms it at 6am but nothing
     pulled that build into the app until the News tab was opened — so the tab, not
     the morning, was what made the news appear (and kicked a fresh build whenever
     the pre-warm had lapsed).
     Cost note: the slot function is pure date math (free); each piece only touches
     the network the first time a new 6 AM slot is seen, then short-circuits on its
     per-slot guard until the next morning. The weekend runs are worker cache HITs
     off the daily cron (newshub is crons = ["0 12 * * *"], every day), so they cost
     nothing from the force-fresh budget. */
  useEffect(()=>{
    let stop=false, timer=null;
    const check=async()=>{
      if(stop)return;
      const daySlot=tbLastMorningSlot();                    // 6am local, EVERY day
      const slot=daySlot;                                   // …for every piece below

      // ── Catalysts: pull the morning calendar and publish it to Firebase so every
      //    device — TradeHub, Tony's TaskHub, Veda's TaskHub — shows it without
      //    anyone opening a tab or pressing a button. The gen-check skips work if
      //    another device already refreshed this slot, but "fresh" is not enough on
      //    its own: a calendar built this morning from an OLD ticker list is stale
      //    for anything added in Control since, so the watchlist signature has to
      //    match too — AND it has to actually contain earnings. A stored doc that
      //    was written this morning but lost its earnings dates is NOT done; it's
      //    the exact state we have to rebuild out of. ──
      if(daySlot && !_tbAutoForceInFlight && daySlot!==_tbLastCheckedSlot && window._fbLoadMarketCal && window._fbSaveMarketCal){
        try{
          const wl=tbLoadWatchlistLocal();
          const d=await window._fbLoadMarketCal();
          const gen=(d&&(d.generatedAt||d.savedAt))||0;
          // Only a doc that RECORDS its watchlist can be confirmed to match. A
          // legacy doc without one is left for tbSyncCatalystsToWatchlist to
          // rebuild — so _tbCatLastSyncedSig is set only on a confirmed match,
          // never here on the "can't tell" path, or that rebuild gets suppressed.
          const wlKnown=!!(d&&Array.isArray(d.watchlist));
          const wlMatches=!d||!wlKnown||tbCalWlSig(d.watchlist)===tbCalWlSig(wl);
          const today=tbLocalDate(0);
          const hasEarn=!d||tbCalEarnCount((d.events||[]).filter(e=>e&&e.date>=today))>0;
          if(gen>=daySlot&&wlMatches&&hasEarn){ _tbLastCheckedSlot=daySlot; if(wlKnown)_tbCatLastSyncedSig=tbCalWlSig(wl); }
          else{
            _tbAutoForceInFlight=true;
            // Runs through the SHARED builder, so the morning gets exactly what the
            // Force button gets — including its self-heal, which escalates to a real
            // fresh=1 rebuild the moment a build comes back without earnings. Start
            // non-fresh: the 6am cron already did the expensive rebuild and warmed
            // the worker cache, so a healthy morning is a free HIT and never touches
            // the daily force budget (shared with News). Only mark the slot done if
            // the build actually landed earnings — otherwise the next 5-min tick
            // retries instead of leaving the day on a half-empty calendar.
            const r=await tbRunCatBuild(wl,false);
            if(r&&r.ok&&r.builtEarnings){ _tbCatLastSyncedSig=tbCalWlSig(wl); _tbLastCheckedSlot=daySlot; }
          }
        }catch(e){}finally{ _tbAutoForceInFlight=false; }
      }

      // Everything below runs on the SAME every-day slot as Catalysts above: a
      // weekend still brings new headlines, a shifted forward calendar, and a
      // Webull account worth re-reading (settled fees, dividends, a position the
      // journal never reconciled). Each piece is per-slot guarded, so a quiet
      // Sunday costs one cheap cached call apiece and then short-circuits.
      if(!slot)return;

      // ── News: get the morning build INTO the app before the News tab is ever
      //    opened — the tab must never be what starts the build. The worker's own
      //    "push the finished build to Firebase" path does NOT work (App Check is
      //    enforced on Firestore, so worker REST writes 403 — see the note in
      //    workers/newshub-api/worker.js), so the browser has to do this pull:
      //      • Peek the worker cache — cacheOnly=1 is free, never builds, never
      //        takes the build lock. Built at/after this slot → publish it to
      //        Firebase and every device renders it instantly on open.
      //      • Nothing usable (6am cron failed, or its 6h cache TTL lapsed before
      //        this open) → kick ONE non-fresh build here, in the background at
      //        app open. Non-fresh = Finnhub-only, so it costs nothing from the
      //        daily force-fresh budget.
      //    The slot is only marked DONE once real events are published, so the
      //    5-min tick keeps peeking until the kicked build lands and publishes it —
      //    that's what makes the news show up on its own. _tbNewsBuildKickedAt
      //    stops those follow-up ticks from kicking a second build. ──
      try{
        const nKey='tb_morning_news_slot';
        if(parseInt(localStorage.getItem(nKey)||'0',10)<slot && window._fbLoadTBNews){
          const d=await window._fbLoadTBNews();
          const haveFresh=d&&(d.generatedAt||0)>=slot&&Array.isArray(d.events)&&d.events.length>0;
          if(haveFresh){ localStorage.setItem(nKey,String(slot)); }
          else{
            const tq='tickers='+encodeURIComponent(tbLoadWatchlistLocal().join(','));
            let warmed=null, staleHit=false;
            try{
              const r=await fetch(NH_WORKER_URL+'/news?cacheOnly=1&'+tq);
              if(r.ok){
                const j=await r.json().catch(()=>null);
                if(j&&!j._cacheMiss&&Array.isArray(j.events)&&j.events.length){
                  if((j.generatedAt||0)>=slot) warmed=j;
                  // Real news, but built BEFORE this morning: the cron didn't run
                  // (or its build failed). A cheap non-fresh kick can't help here —
                  // the worker would just serve this same doc straight back — so
                  // the morning rebuild has to bypass the cache with fresh=1.
                  else staleHit=true;
                }
              }
            }catch(e){}
            if(warmed){
              if(window._fbSaveTBNews){
                // Full-overwrite write — carry the saved filters through.
                const payload={events:warmed.events,generatedAt:warmed.generatedAt||Date.now()};
                if(d&&d.settings) payload.settings=d.settings;
                window._fbSaveTBNews(payload);
              }
              // Live-update the News tab if it's the one on screen (its own Firebase
              // listener ignores echoes of a write this device just made).
              window.dispatchEvent(new CustomEvent('tb-news-built',{detail:warmed}));
              localStorage.setItem(nKey,String(slot));   // done for this morning
            }else if(Date.now()-_tbNewsBuildKickedAt>10*60*1000){
              // Fire-and-forget build. Non-fresh (free) whenever it can actually
              // produce something; fresh=1 only to break past a pre-slot cached
              // doc — at most one of the 12 daily forces, and only on a morning
              // the cron already failed to deliver.
              fetch(NH_WORKER_URL+'/news?'+tq+(staleHit?'&fresh=1':'')).catch(()=>{});
              _tbNewsBuildKickedAt=Date.now();
              window.dispatchEvent(new CustomEvent('tb-news-building'));
              // Hand the build to the module-level news watcher (15s polls, capped),
              // which publishes the finished payload to Firebase itself. Waiting for
              // the next 5-min orchestrator tick instead meant a build that landed at
              // 6:02 wasn't shown until 6:05+ — and only the News TAB used to start
              // this watch, so with any other tab open nothing was polling at all.
              // It's the same watcher the tab joins, so this never double-polls.
              tbNewsWatchBuild(tbLoadWatchlistLocal(),(d&&d.generatedAt)||0);
              // NOT marked done — whichever of the two collects it, the next tick
              // sees the published doc and closes out the morning.
            }
          }
        }
      }catch(e){}

      // ── Portfolio: auto-load the Webull account (read-only, safe on any device) into
      //    the shared cache so the Portfolio tab is ready the moment it's opened. The
      //    Webull worker already holds the auth token, so this "auto-connects" without
      //    a manual Connect. Once per slot; only marked done on success. ──
      try{
        const pKey='tb_morning_portfolio_slot';
        if(parseInt(localStorage.getItem(pKey)||'0',10)<slot){
          const r=await fetch(`${TB_API_BASE}/api/portfolio/summary`);
          const j=await r.json().catch(()=>null);
          if(j&&j.ok){
            _tbPortfolioCache.data=j.data; _tbPortfolioCache.lastFetch=new Date(); _tbPortfolioCache.error=null; _tbPortfolioCache.fetched=true;
            if(window._tbSetPortfolioOk)window._tbSetPortfolioOk(true);
            window.dispatchEvent(new CustomEvent('tb-portfolio-refreshed'));   // update the tab if it's already open
            localStorage.setItem(pKey,String(slot));
          }
        }
      }catch(e){}

      // ── Journal: Webull sync (MAIN device only — cross-device syncs race and dupe).
      //    sync() records TB_SYNC_TS_KEY, so last-sync ≥ slot means this morning is done.
      //    Runs live if the Journal tab is open; otherwise the tab's own slot-gated
      //    auto-sync covers the first time it's opened this morning. ──
      try{
        if(localStorage.getItem('td6_mainDash')==='tony' && typeof window._tbJournalSync==='function'){
          const last=parseInt(localStorage.getItem(TB_SYNC_TS_KEY)||'0',10);
          if(last<slot) await window._tbJournalSync();
        }
      }catch(e){}
    };
    const start=()=>{check();timer=setInterval(check,5*60*1000);};
    if(window._fbReady)start();
    else window.addEventListener('fb-ready',start,{once:true});
    return()=>{stop=true;if(timer)clearInterval(timer);window.removeEventListener('fb-ready',start);};
  },[]);

  /* Load prompts + reports from Firebase on mount */
  useEffect(()=>{
    const doLoad=async()=>{
      if(window._fbLoadTBPrompts){
        const fp=await window._fbLoadTBPrompts();
        if(fp&&fp.length){setPrompts(fp);tbSavePromptsLocal(fp);}
      }
      if(window._fbLoadTBAnalysis){
        const fa=await window._fbLoadTBAnalysis();
        if(fa&&typeof fa==='object'){setAnalysisCfg(fa);try{localStorage.setItem(TB_ANALYSIS_KEY,JSON.stringify(fa));}catch{}}
      }
      if(window._fbLoadTBWatchlist){
        const fw=await window._fbLoadTBWatchlist();
        if(Array.isArray(fw)&&fw.length){setWatchlist(fw);tbSaveWatchlistLocal(fw);tbSetWatchlist(fw);}
      }
      /* Playbook. Nothing stored yet (first device / fresh account) → seed the
         Daily Reminder so AutoLaunch always has a page to show. The id is fixed,
         so two devices seeding at once converge instead of duplicating.
         A FAILED read (false) is left alone: seeding would write, and that write
         would clobber the real playbook over a transient network error. The live
         listener picks the pages up once the connection recovers. */
      if(window._fbLoadTBPlaybook){
        const fpb=await window._fbLoadTBPlaybook();
        if(fpb===false){ /* read failed — keep what's on this device, write nothing */ }
        else if(Array.isArray(fpb)&&fpb.length){ const n=tbPbNormalize(fpb); setPlaybook(n); tbSavePlaybookLocal(n); }
        else { const seed=tbPbNormalize(tbLoadPlaybookLocal()); setPlaybook(seed); tbSavePlaybookLocal(seed); if(window._fbSaveTBPlaybook) window._fbSaveTBPlaybook(seed); }
      }
      /* One-time: force every device to the new canonical default watchlist. */
      try{
        const seed=parseInt(localStorage.getItem(TB_WATCHLIST_SEED_KEY)||'0',10);
        if(seed<TB_WATCHLIST_SEED){
          const def=[...TB_WATCHLIST];
          setWatchlist(def);tbSaveWatchlistLocal(def);tbSetWatchlist(def);
          if(window._fbSaveTBWatchlist)window._fbSaveTBWatchlist(def);
          localStorage.setItem(TB_WATCHLIST_SEED_KEY,String(TB_WATCHLIST_SEED));
        }
      }catch(e){}

      setFbLoaded(true);
    };
    if(window._fbReady)doLoad();
    else{const h=()=>doLoad();window.addEventListener('fb-ready',h,{once:true});return()=>window.removeEventListener('fb-ready',h);}
  },[]);

  /* Live sync: apply remote prompts from other devices */
  useEffect(()=>{
    const onRemote=(e)=>{if(e.detail&&Array.isArray(e.detail)){setPrompts(e.detail);tbSavePromptsLocal(e.detail);}};
    window.addEventListener('fb-tb-prompts-remote',onRemote);
    return()=>window.removeEventListener('fb-tb-prompts-remote',onRemote);
  },[]);

  /* Live sync: apply remote analysis cfg from other devices */
  useEffect(()=>{
    const onRemote=(e)=>{if(e.detail&&typeof e.detail==='object'){setAnalysisCfg(e.detail);try{localStorage.setItem(TB_ANALYSIS_KEY,JSON.stringify(e.detail));}catch{}}}
    window.addEventListener('fb-tb-analysis-remote',onRemote);
    return()=>window.removeEventListener('fb-tb-analysis-remote',onRemote);
  },[]);

  /* Live sync: apply remote watchlist from other devices */
  useEffect(()=>{
    const onRemote=(e)=>{if(Array.isArray(e.detail)&&e.detail.length){setWatchlist(e.detail);tbSaveWatchlistLocal(e.detail);tbSetWatchlist(e.detail);}}
    window.addEventListener('fb-tb-watchlist-remote',onRemote);
    return()=>window.removeEventListener('fb-tb-watchlist-remote',onRemote);
  },[]);

  /* Live sync: apply remote playbook pages from other devices */
  useEffect(()=>{
    const onRemote=(e)=>{if(Array.isArray(e.detail)&&e.detail.length){const n=tbPbNormalize(e.detail);setPlaybook(n);tbSavePlaybookLocal(n);}}
    window.addEventListener('fb-tb-playbook-remote',onRemote);
    return()=>window.removeEventListener('fb-tb-playbook-remote',onRemote);
  },[]);

  /* Keep the parser's active watchlist in lockstep with state. */
  useEffect(()=>{tbSetWatchlist(watchlist);},[watchlist]);

  /* ── Watchlist edits propagate to Catalysts + News automatically ─────────────
     Editing the Control list already re-points every ON-DEMAND fetch at the new
     tickers, but nothing re-ran the two things that are built AHEAD of time, so a
     ticker you added just never got an earnings date pulled: the stored calendar
     still looked current (built this morning) and the morning news slot was already
     marked done, so both guards short-circuited until something forced a rebuild by
     hand. Re-check on every change — add OR remove, local edit or a sync from
     another device — and let the signature comparison decide whether it's real work.
     Debounced past pushWatchlistToWorkers' own 1.5s so the worker's cron list
     (wl:current) is already updated when the build goes out. */
  const _tbWlSyncSig=useRef(null);
  useEffect(()=>{
    if(!fbLoaded||!watchlist.length)return;
    const sig=tbCalWlSig(watchlist);
    if(_tbWlSyncSig.current===sig)return;
    const first=_tbWlSyncSig.current===null;
    _tbWlSyncSig.current=sig;
    const t=setTimeout(()=>{
      // Catalysts: rebuilds only when the stored calendar was built from a
      // different list (so this is a no-op on ordinary loads).
      tbSyncCatalystsToWatchlist(watchlist);
      // News is keyed by watchlist too — the worker caches per ticker-set, so a
      // changed list orphans this morning's warmed build. Clearing the per-morning
      // guard lets the orchestrator re-warm for the new list on its next tick
      // instead of leaving News a day behind the watchlist. Skipped on first load,
      // where nothing actually changed.
      if(!first){ try{ localStorage.removeItem('tb_morning_news_slot'); }catch(e){} }
    },4000);
    return()=>clearTimeout(t);
  },[watchlist,fbLoaded]);

  /* ── Push the Analysis-tab selection (prompt + searches + AI site) to the worker ──
     App-level (not inside the Analysis tab) so it stays in sync even when that tab
     is never opened. Trading Auto Launch GETs /analysis-config to open the AI site
     with this exact prompt (auto-submitted) and open each search. aiUrl is part of
     the payload so the morning launch follows the SAME destination the Analysis tab
     is set to, instead of always opening ChatGPT. Deduped so we only POST on real
     changes. */
  const _tbAnalysisPushSig=useRef(null);
  useEffect(()=>{
    const sel=(prompts.find(p=>p.id===analysisCfg.analysisPromptId)||prompts[0])||null;
    if(!sel||!sel.text)return;
    const searches=(Array.isArray(analysisCfg.searches)?analysisCfg.searches
      :[analysisCfg.searchQuery1,analysisCfg.searchQuery2]).map(s=>(s||'').trim()).filter(Boolean);
    const aiUrl=tbAiUrl(analysisCfg);
    const sig=(sel.name||'')+' '+sel.text+' | '+searches.join(' | ')+' | '+aiUrl;
    if(_tbAnalysisPushSig.current===sig)return;
    const push=()=>{fetch(TD_WORKER_URL+'/analysis-config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:sel.name||'Prompt',text:sel.text,searches,aiUrl})}).then(r=>{if(r.ok)_tbAnalysisPushSig.current=sig;}).catch(()=>{});};
    if(window._fbReady)push(); else window.addEventListener('fb-ready',push,{once:true});
  },[prompts,analysisCfg.analysisPromptId,analysisCfg.searches,analysisCfg.aiSite,analysisCfg.aiCustomUrl]);

  /* ── Push Playbook → Daily Reminder to the worker ─────────────────────────────
     Trading Auto Launch GETs /daily-reminder and makes you confirm it before it opens
     anything, so it must reflect the CURRENT page. Pages are authored as HTML;
     the launcher renders Markdown, so push a converted copy. Debounced (this runs
     on every keystroke) and deduped so we only POST on real changes.
     An empty page is never pushed — that would silently blank the morning gate. */
  const _tbReminderPushSig=useRef(null);
  useEffect(()=>{
    if(!fbLoaded)return;
    const p=(playbook||[]).find(x=>x.id===TB_PB_DAILY_ID);
    if(!p)return;
    const markdown=tbHtmlToMd(p.body||'');
    if(!markdown.trim())return;
    const title=(p.title||'Daily Reminder').trim();
    const sig=title+' | '+markdown;
    if(_tbReminderPushSig.current===sig)return;
    const t=setTimeout(()=>{
      const push=()=>{fetch(TD_WORKER_URL+'/daily-reminder',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({title,markdown})}).then(r=>{if(r.ok)_tbReminderPushSig.current=sig;}).catch(()=>{});};
      if(window._fbReady)push(); else window.addEventListener('fb-ready',push,{once:true});
    },1500);
    return()=>clearTimeout(t);
  },[playbook,fbLoaded]);

  const showToast=(msg,icon='check')=>{setToast({msg,icon,k:Date.now()});};

  const savePrompts=arr=>{setPrompts(arr);tbSavePromptsLocal(arr);};
  const saveAnalysisCfg=cfg=>{setAnalysisCfg(cfg);try{localStorage.setItem(TB_ANALYSIS_KEY,JSON.stringify(cfg));}catch{} if(window._fbSaveTBAnalysis)window._fbSaveTBAnalysis(cfg);};
  const saveWatchlist=arr=>{const wl=Array.isArray(arr)?arr:[];setWatchlist(wl);tbSaveWatchlistLocal(wl);tbSetWatchlist(wl);if(window._fbSaveTBWatchlist)window._fbSaveTBWatchlist(wl);};
  const savePlaybook=pages=>{const n=tbPbNormalize(pages);setPlaybook(n);tbSavePlaybookLocal(n);if(window._fbSaveTBPlaybook)window._fbSaveTBPlaybook(n);};




  // Keep the header lock-button icon in sync after React (re)renders.
  useEffect(()=>{ if(window._tbUpdateLockBtns) window._tbUpdateLockBtns(); });

  const pageMap={
    portfolio:<TBPortfolioPage/>,
    journal:  <TBJournalPage/>,
    playbook: <TBPlaybookPage pages={playbook} onSavePages={savePlaybook} onToast={showToast}/>,
    news:     <TBNewsPage watchlist={watchlist}/>,
    catalysts:<TBCatalystsPage watchlist={watchlist}/>,
    prompt:   <TBControlPage prompts={prompts} onSavePrompts={savePrompts} onToast={showToast} watchlist={watchlist} onSaveWatchlist={saveWatchlist}/>,
    analysis: <TBAnalysisPage cfg={analysisCfg} onSave={saveAnalysisCfg} prompts={prompts} onGoToPrompts={()=>setPage('prompt')}/>,
  };
  const curNav=TB_NAV.find(n=>n.id===page)||TB_NAV[0];

  return(<div style={{display:'flex',flexDirection:'column',height:'100%',overflow:'hidden',background:'var(--bg)'}}>
    <TBHeader page={page} onNav={setPage} syncStatus={tbSyncStatus} portfolioConnected={tbPortfolioOk} onManageTabLock={setTabLockManage} navOrder={navOrder} onReorderNav={onReorderNav}/>
    <TBMobileHeader page={page} syncStatus={tbSyncStatus} portfolioConnected={tbPortfolioOk} onNav={setPage} onManageTabLock={setTabLockManage} navOrder={navOrder} onReorderNav={onReorderNav}/>
    {/* Playbook pages are long documents, so this is the one tab that gets a real,
        draggable scrollbar — every other tab keeps the app's hidden bars. */}
    <div className={page==='playbook'?'tb-pb-scroll':undefined} style={{flex:1,overflowY:'auto',overflowX:'hidden',WebkitOverflowScrolling:'touch'}}>
      <div style={{maxWidth:2000,margin:'0 auto',width:'100%',padding:'18px clamp(12px,3vw,24px) calc(env(safe-area-inset-bottom,0px) + 60px)'}}>
        <TBTabGate tabId={page} tabLabel={curNav.label}>
          {pageMap[page]||pageMap.portfolio}
        </TBTabGate>
      </div>
    </div>
    {tabLockManage&&<TBTabLockManager tabId={tabLockManage.id} tabLabel={tabLockManage.label} onClose={()=>setTabLockManage(null)}/>}
    {toast&&<TBToast key={toast.k} message={toast.msg} icon={toast.icon} onClose={()=>setToast(null)}/>}
  </div>);
}

/* ── Mount to tradeboard-root ── */
const tbRoot=document.getElementById('tradeboard-root');
if(tbRoot){
  ReactDOM.createRoot(tbRoot).render(<TBApp/>);
}

})(); // end IIFE
</script>

<!-- ══════════════════════════════════════════════════════════════════════════
     App Lock — single-app gate for TradeHub. Mirrors index.html's applock:
       • Password stored in Cloudflare Worker KV (journal='applock', entryId='tony_tradehub_standalone')
       • Locked-state synced across ALL devices via Firebase (dashboards/applock)
       • Per-device unlock cached in localStorage (enter once per device)
       • Forgot password → emails hint to anthonypn99@gmail.com via Formspree
     entryId is DISTINCT from index.html's 'tony_tradehub' (the suite's TradeHub
     program-gate) so this standalone lock is independent: locking here does NOT
     lock the TradeHub entry in index's suite settings, and vice versa. Both still
     share the dashboards/applock doc but under separate keys, so each preserves
     the other's entry on write.
     ══════════════════════════════════════════════════════════════════════════ -->
<script>
(function(){
'use strict';

var AL_WORKER  = 'https://taskhub-reminders.av1.workers.dev';
var AL_JOURNAL = 'applock';
var AL_EMAIL   = 'anthonypn99@gmail.com';
var APPID      = 'tony_tradehub_standalone';
var AC         = '#e0b874';

function _el(id){ return document.getElementById(id); }

// ── STATE ──────────────────────────────────────────────────────────────────
var _alLocks = {};
try { _alLocks = JSON.parse(window.alDur.get('al_locks') || '{}'); } catch(e) {}
var _alPendingPush = false;

function alIsLocked()   { return !!_alLocks[APPID]; }
function alLockVersion(){ var e=_alLocks[APPID]; return (e&&e.v)||0; }
function alIsUnlocked() {
  if(!alIsLocked()) return true;
  var v = alLockVersion();
  var got = parseInt(window.alDur.get('al_unlockedv_' + APPID)||'0',10);
  if(v===0){ return window.alDur.get('al_unlocked_' + APPID)==='1' || got>0; }
  // Monotonic: this device is unlocked as long as it unlocked AT OR AFTER the
  // current password version. Only a genuine password change (newer version)
  // makes got<v and re-requires the password. Prevents spurious re-prompts from
  // stale/duplicate snapshots that report a merely-different (not newer) version.
  return got>0 && got>=v;
}
function alMarkUnlocked(){
  try{
    var v = alLockVersion();
    var prev = parseInt(window.alDur.get('al_unlockedv_' + APPID)||'0',10);
    // Record the highest version seen so a slow/stale version read can never
    // regress an already-valid unlock.
    var mark = Math.max(v||Date.now(), prev||0);
    window.alDur.set('al_unlockedv_' + APPID, String(mark));
    if(v===0) window.alDur.set('al_unlocked_' + APPID, '1');
  }catch(e){}
}
function alMarkLocked()  { try { window.alDur.remove('al_unlockedv_' + APPID); window.alDur.remove('al_unlocked_' + APPID); } catch(e){} }
function alMustBlock()   { return alIsLocked() && !alIsUnlocked(); }

function alSaveLocks(){
  try { window.alDur.set('al_locks', JSON.stringify(_alLocks)); } catch(e){}
  if (window._fbSaveAppLocks) { window._fbSaveAppLocks(_alLocks); _alPendingPush = false; }
  else { _alPendingPush = true; }
}
function alSetLock(version){ _alLocks[APPID] = { locked: true, v: version||Date.now() }; alSaveLocks(); }
function alRemoveLock(){ delete _alLocks[APPID]; alSaveLocks(); }

// Show / hide TradeHub content roots.
function alHideRoot(){ var r=_el('tradeboard-root'); if(r) r.style.display='none'; }
function alShowRoot(){ var r=_el('tradeboard-root'); if(r) r.style.display='flex'; }

// ── REMOTE LOCK CHANGES (from Firebase onSnapshot in the module above) ──────
// The shared dashboards/applock doc carries locks for EVERY app; we only care
// about TradeHub's entry but must preserve the rest so we never wipe them.
window._alApplyRemoteLocks = function(remoteLocks){
  remoteLocks = remoteLocks || {};
  // Re-locking is governed entirely by version comparison in alIsUnlocked()
  // (got>=v). If the password was genuinely changed (newer version) OR newly set
  // on a device that never unlocked, this device's recorded unlock is < newV and
  // it blocks automatically below via alMustBlock(). We deliberately do NOT wipe
  // the unlock record on a mere version DIFFERENCE — a stale/duplicate snapshot
  // reporting an older-or-equal version must never force a spurious re-prompt.
  _alLocks = {};
  Object.keys(remoteLocks).forEach(function(id){ var r=remoteLocks[id]; _alLocks[id] = { locked: true, v:(r&&r.v)||0 }; });
  try { window.alDur.set('al_locks', JSON.stringify(_alLocks)); } catch(e){}
  // SECURITY: if TradeHub just got locked remotely and isn't unlocked here, hide + prompt.
  if (alMustBlock()) { alHideRoot(); alShowOverlay('unlock'); }
  else if (!alIsLocked()) { alShowRoot(); if(_el('applock-overlay').style.display==='flex' && _alMode==='unlock'){ alHideOverlay(); } }
  alUpdateLockBtns();
};

// On Firebase ready: push any local lock set before init, then pull authoritative set.
function alOnFbReady(){
  if (!window._fbLoadAppLocks) return;
  if (_alPendingPush && window._fbSaveAppLocks) { window._fbSaveAppLocks(_alLocks); _alPendingPush=false; }
  window._fbLoadAppLocks().then(function(remote){
    if (remote) window._alApplyRemoteLocks(remote);
  });
}
window.addEventListener('fb-ready', alOnFbReady);
if (window._fbReady && window._fbLoadAppLocks) alOnFbReady();

// ── OVERLAY ─────────────────────────────────────────────────────────────────
var _alMode = 'unlock';
var _alAttempts = 0, _alCooldown = 0;
var _alRemoveBio = false;   // when true, a successful unlock removes TradeHub's biometric instead of unlocking

function alShake(){
  var box=_el('applock-box'); box.classList.remove('shake'); void box.offsetWidth;
  box.classList.add('shake'); setTimeout(function(){box.classList.remove('shake');},500);
}
function _alPwErr(msg){
  _el('applock-pw').classList.add('error'); _el('applock-pw').value='';
  _el('applock-err').textContent = _alAttempts>=5 ? 'Too many attempts. Wait 30s.' : msg;
  alShake(); setTimeout(function(){_el('applock-pw').classList.remove('error');},400);
}

function alShowOverlay(mode){
  _alMode = mode;
  _alRemoveBio = false;   // cleared on any normal open; alBioRemovePrompt re-sets it after
  _el('applock-err').textContent='';
  _el('applock-pw').value='';
  _el('applock-pw').classList.remove('error');
  _el('applock-title').textContent='TradeHub';
  _el('applock-title').style.color='';
  _el('applock-submit').style.background='transparent';
  _el('applock-submit').style.display='';
  var m=_el('al-menu-btns'); if(m) m.remove();
  if (mode==='setpw'){
    _el('applock-icon').innerHTML=KCI.shield;
    _el('applock-sub').textContent='Choose a password to lock TradeHub. Unlock once per device.';
    _el('applock-submit').textContent='Set Password';
    _el('applock-forgot').style.display='none'; _el('applock-cancel').style.display='';
  } else if (mode==='remove'){
    _el('applock-icon').innerHTML=KCI.unlock;
    _el('applock-sub').textContent='Enter password to remove the lock.';
    _el('applock-submit').textContent='Remove Lock';
    _el('applock-forgot').style.display=''; _el('applock-cancel').style.display='';
  } else if (mode==='changepw'){
    _el('applock-icon').innerHTML=KCI.key;
    _el('applock-sub').textContent='Enter your current password first.';
    _el('applock-submit').textContent='Verify & Continue';
    _el('applock-forgot').style.display=''; _el('applock-cancel').style.display='';
  } else {
    _el('applock-icon').innerHTML=KCI.lock;
    _el('applock-sub').textContent='Enter your password to open TradeHub.';
    _el('applock-submit').textContent='Unlock';
    _el('applock-forgot').style.display='';
    // No cancel escape when content is gated — you must unlock to view TradeHub.
    _el('applock-cancel').style.display = alMustBlock() ? 'none' : '';
  }
  // Reset link mirrors the "Forgot password?" link (hidden while setting a new password).
  if (_el('applock-reset')) _el('applock-reset').style.display = _el('applock-forgot').style.display;
  _el('applock-pw').style.display = '';   // restore in case a prior biometric prompt hid it
  _el('applock-overlay').style.display='flex';
  setTimeout(function(){_el('applock-pw').focus();},80);
  alBioRender(mode);
}
function alHideOverlay(){
  _el('applock-overlay').style.display='none';
  var m=_el('al-menu-btns'); if(m) m.remove();
  var bio=_el('applock-bio'); if(bio){ bio.innerHTML=''; bio.style.display='none'; }
  _alRemoveBio = false;
}

// ── BIOMETRICS (Face ID / Touch ID / fingerprint / Windows Hello) ──
// Primary unlock; password below always remains the fallback. Credential is keyed
// to TradeHub's APPID and bound to this device's secure biometric framework.
function alBioShowPw(show){
  _el('applock-pw').style.display = show ? '' : 'none';
  _el('applock-submit').style.display = show ? '' : 'none';
  _el('applock-forgot').style.display = show ? '' : 'none';
  if (_el('applock-reset')) _el('applock-reset').style.display = show ? '' : 'none';
  if (show) setTimeout(function(){ _el('applock-pw').focus(); }, 60);
}
function alBioRender(mode){
  var box=_el('applock-bio'); if(!box) return; box.innerHTML=''; box.style.display='none';
  if(!window.Bio || mode!=='unlock') return;
  window.Bio.available().then(function(avail){
    if(_alMode!=='unlock') return;
    if(!(avail && window.Bio.isRegistered('tradehub', APPID))) return;
    box.style.display='flex'; box.style.flexDirection='column'; box.style.gap='8px';
    var b=document.createElement('button');
    b.innerHTML=KCI.unlock+'<span>Unlock with '+window.Bio.label()+'</span>';
    b.style.cssText="border:1px solid rgba(224,184,116,.36);border-radius:6px;padding:14px 0;font-size:13.5px;font-weight:500;letter-spacing:.2px;cursor:pointer;font-family:'Inter',system-ui,-apple-system,sans-serif;width:100%;background:transparent;color:#e0b874;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:border-color .18s;";
    b.onclick=function(){ alBioUnlock(); };
    box.appendChild(b);
    var link=document.createElement('button');
    link.textContent='Use password instead';
    link.style.cssText='background:transparent;border:none;color:#adadb2;font-size:12px;text-decoration:underline;cursor:pointer;';
    link.onclick=function(){ alBioShowPw(true); link.style.display='none'; };
    box.appendChild(link);
    alBioShowPw(false);
  });
}
function alBioUnlock(){
  _el('applock-err').textContent='';
  if(!window.Bio) return;
  window.Bio.authenticate('tradehub', APPID).then(function(r){
    if(r.ok){
      if(_alRemoveBio){ alDoRemoveBio(); return; }
      alMarkUnlocked(); _alAttempts=0; alShowRoot(); alHideOverlay(); alUpdateLockBtns();
    }
    else if(r.error==='notregistered'){ alBioShowPw(true); }
    else { _el('applock-err').textContent='Biometric check failed — use your password.'; alBioShowPw(true); }
  });
}
// Verify identity (biometric OR password) before removing TradeHub's biometric.
function alBioRemovePrompt(){
  alShowOverlay('unlock');
  _alRemoveBio = true;
  _el('applock-icon').innerHTML=KCI.user;
  _el('applock-sub').textContent='Verify with '+window.Bio.label()+' or your password to remove biometrics from this device.';
}
function alDoRemoveBio(){
  _alRemoveBio = false;
  window.Bio.unregister('tradehub', APPID);
  alHideOverlay(); alUpdateLockBtns();
  window.uiAlert('Biometrics removed from this device.');
}
function alBioRegister(closeAfter){
  if(!window.Bio) return;
  window.Bio.register('tradehub', APPID, { rpName:'TradeHub', userName:'tradehub', displayName:'TradeHub' }).then(function(r){
    if(r.ok){ alMarkUnlocked(); if(closeAfter) alHideOverlay(); alUpdateLockBtns(); alert('Biometrics registered on this device. You can now unlock TradeHub with '+window.Bio.label()+'.'); }
    else if(r.error==='cancelled' || r.error==='NotAllowedError'){ /* user backed out */ }
    else alert('Could not register biometrics on this device.');
  });
}
function alMaybeOfferBio(){
  if(!window.Bio) return;
  window.Bio.available().then(function(avail){
    if(!avail || window.Bio.isRegistered('tradehub', APPID)) return;
    window.uiConfirm('Register '+window.Bio.label()+' to unlock TradeHub on this device? Your password still works as a fallback.', {title:'Register '+window.Bio.label(), okLabel:'Register'}).then(function(ok){ if(ok) alBioRegister(false); });
  });
}

// ── MANAGE MENU (triggered by the lock button) ──────────────────────────────
function alManage(){
  if (alIsLocked()) alShowManageMenu();
  else alShowOverlay('setpw');
}
window._tbManageLock = alManage;
window._tbAppIsLocked = function(){ try{ return alIsLocked(); }catch(e){ return false; } };

function alShowManageMenu(){
  var isUnlocked = alIsUnlocked();
  _el('applock-err').textContent='';
  var _mbio=_el('applock-bio'); if(_mbio){ _mbio.innerHTML=''; _mbio.style.display='none'; }
  _el('applock-pw').value='';
  _el('applock-pw').classList.remove('error');
  _el('applock-icon').innerHTML=KCI.lock;
  _el('applock-title').textContent='TradeHub';
  _el('applock-title').style.color='';
  _el('applock-submit').style.display='none';
  _el('applock-forgot').style.display='none';
  if (_el('applock-reset')) _el('applock-reset').style.display='none';
  _el('applock-cancel').style.display='';
  _el('applock-sub').textContent = isUnlocked ? 'TradeHub is locked. Manage:' : 'TradeHub is locked. Choose:';
  var existing=_el('al-menu-btns'); if(existing) existing.remove();
  var menu=document.createElement('div');
  menu.id='al-menu-btns';
  menu.style.cssText='display:flex;flex-direction:column;gap:8px;width:100%;';
  var s='border:1px solid #45454c;border-radius:6px;padding:12px 0;font-size:13.5px;font-weight:500;letter-spacing:.2px;cursor:pointer;font-family:\'Inter\',system-ui,-apple-system,sans-serif;width:100%;background:transparent;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:border-color .18s;';
  if (!isUnlocked){
    var ub=document.createElement('button');
    ub.innerHTML=KCI.unlock+'<span>Unlock this device</span>';
    ub.style.cssText=s+'color:#e0b874;border-color:rgba(224,184,116,.36);';
    ub.onclick=function(){ menu.remove(); _el('applock-submit').style.display=''; alShowOverlay('unlock'); };
    menu.appendChild(ub);
  }
  var cb=document.createElement('button');
  cb.innerHTML=KCI.key+'<span>Change password</span>';
  cb.style.cssText=s+'color:#f4f3f0;';
  cb.onclick=function(){ menu.remove(); _el('applock-submit').style.display=''; alShowOverlay('changepw'); };
  menu.appendChild(cb);
  // Register / remove biometrics (inserted above "Change password").
  if (window.Bio) window.Bio.available().then(function(avail){
    if(!avail) return;
    var bb=document.createElement('button');
    if(window.Bio.isRegistered('tradehub', APPID)){
      bb.innerHTML=KCI.user+'<span>Remove biometrics</span>';
      bb.style.cssText=s+'color:#adadb2;';
      bb.onclick=function(){ menu.remove(); _el('applock-submit').style.display=''; alBioRemovePrompt(); };
    } else {
      bb.innerHTML=KCI.user+'<span>Register '+window.Bio.label()+'</span>';
      bb.style.cssText=s+'color:#f4f3f0;';
      bb.onclick=function(){ menu.remove(); _el('applock-submit').style.display=''; alBioRegister(true); };
    }
    menu.insertBefore(bb, cb);
  });
  var rb=document.createElement('button');
  rb.innerHTML=KCI.trash+'<span>Remove lock</span>';
  rb.style.cssText=s+'color:#d68a7c;border-color:rgba(214,138,124,.3);';
  rb.onclick=function(){ menu.remove(); _el('applock-submit').style.display=''; alShowOverlay('remove'); };
  menu.appendChild(rb);
  // Menu lives in the form column, above the ruled footer that owns Cancel.
  var form=_el('applock-form')||_el('applock-cancel').parentNode;
  form.appendChild(menu);
  _el('applock-overlay').style.display='flex';
}

// ── SUBMIT ──────────────────────────────────────────────────────────────────
_el('applock-submit').addEventListener('click', async function(){
  var pw=_el('applock-pw').value.trim();
  if (!pw){ _el('applock-pw').classList.add('error'); _el('applock-err').textContent='Password required.'; return; }
  if (_alAttempts>=5){
    var wait=Math.ceil((_alCooldown-Date.now())/1000);
    if (wait>0){ _el('applock-err').textContent='Too many attempts. Wait '+wait+'s.'; return; }
    _alAttempts=0;
  }
  _el('applock-submit').disabled=true; _el('applock-submit').textContent='Checking…';
  try {
    if (_alMode==='setpw'){
      var hint=(await window.uiPrompt('Optional: enter a password hint for the recovery email. Leave blank to skip.',{title:'Password hint'}))||'';
      var r1=await fetch(AL_WORKER+'/auth/journal/set-lock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({journal:AL_JOURNAL,entryId:APPID,password:pw,hint:hint})});
      var d1=await r1.json();
      if (d1.ok){ alSetLock(); alMarkUnlocked(); alShowRoot(); alHideOverlay(); alUpdateLockBtns(); alMaybeOfferBio(); }
      else { _el('applock-err').textContent='Failed to set lock. Try again.'; }

    } else if (_alMode==='remove'){
      var r2=await fetch(AL_WORKER+'/auth/journal/remove-lock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({journal:AL_JOURNAL,entryId:APPID,password:pw})});
      var d2=await r2.json();
      if (d2.ok){ alRemoveLock(); alMarkLocked(); alShowRoot(); alHideOverlay(); alUpdateLockBtns(); }
      else { _alAttempts++; if(_alAttempts>=5)_alCooldown=Date.now()+30000; _alPwErr('Wrong password.'); }

    } else if (_alMode==='changepw'){
      var r3=await fetch(AL_WORKER+'/auth/journal/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({journal:AL_JOURNAL,entryId:APPID,password:pw})});
      var d3=await r3.json();
      if (d3.ok){
        var chg=await window.uiForm({ title:'Change password', okLabel:'Change password',
          fields:[ {name:'password',label:'New password',type:'password',required:true}, {name:'hint',label:'New password hint (optional)'} ] });
        var np=chg?chg.password:'';
        if (!np||!np.trim()){ _el('applock-err').textContent='New password empty — not changed.'; }
        else {
          var nh=(chg.hint)||'';
          var rem=await fetch(AL_WORKER+'/auth/journal/remove-lock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({journal:AL_JOURNAL,entryId:APPID,password:pw})});
          var remD=await rem.json();
          if (remD.ok){
            var set=await fetch(AL_WORKER+'/auth/journal/set-lock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({journal:AL_JOURNAL,entryId:APPID,password:np.trim(),hint:nh})});
            var setD=await set.json();
            if (setD.ok){ alSetLock(); alMarkUnlocked(); alShowRoot(); alHideOverlay(); alUpdateLockBtns(); alert('Password changed!'); }
            else { _el('applock-err').textContent='Failed to set new password.'; }
          } else { _el('applock-err').textContent='Error removing old lock. Try again.'; }
        }
      } else { _alAttempts++; if(_alAttempts>=5)_alCooldown=Date.now()+30000; _alPwErr('Wrong password.'); }

    } else { // unlock
      var r4=await fetch(AL_WORKER+'/auth/journal/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({journal:AL_JOURNAL,entryId:APPID,password:pw})});
      var d4=await r4.json();
      if (d4.ok){
        _alAttempts=0;
        if(_alRemoveBio){ alDoRemoveBio(); }
        else { alMarkUnlocked(); alShowRoot(); alHideOverlay(); alUpdateLockBtns(); }
      }
      else { _alAttempts++; if(_alAttempts>=5)_alCooldown=Date.now()+30000; _alPwErr('Wrong password.'); }
    }
  } catch(e){ _el('applock-err').textContent='Network error. Try again.'; }
  _el('applock-submit').disabled=false;
  _el('applock-submit').textContent={setpw:'Set Password',remove:'Remove Lock',changepw:'Verify & Continue'}[_alMode]||'Unlock';
});

_el('applock-pw').addEventListener('keydown', function(e){
  if (e.key==='Enter') _el('applock-submit').click();
  if (e.key==='Escape'){ _el('applock-err').textContent=''; _el('applock-pw').classList.remove('error'); }
});

_el('applock-cancel').addEventListener('click', function(){
  var m=_el('al-menu-btns'); if(m) m.remove();
  _el('applock-submit').style.display='';
  var mode=_alMode;
  alHideOverlay();
  // Security: backing out of an UNLOCK while gated keeps content hidden.
  if (mode==='unlock' && alMustBlock()) alHideRoot();
});

_el('applock-forgot').addEventListener('click', async function(){
  _el('applock-forgot').textContent='Sending…'; _el('applock-forgot').disabled=true;
  try {
    var hr=await fetch(AL_WORKER+'/auth/journal/hint',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({journal:AL_JOURNAL,entryId:APPID,appName:'TradeHub',label:'TradeHub'})});
    var hd=await hr.json();
    if (hd.noLock){ _el('applock-err').textContent='No lock on server. Try re-locking.'; _el('applock-forgot').disabled=false; _el('applock-forgot').textContent='Forgot password?'; return; }
    if (hd.ok){ _el('applock-forgot').textContent='Hint sent!'; setTimeout(function(){_el('applock-forgot').textContent='Forgot password?';_el('applock-forgot').disabled=false;},3000); }
    else { _el('applock-forgot').textContent='Failed — try again'; _el('applock-forgot').disabled=false; }
  } catch(e){ _el('applock-forgot').textContent='Failed — try again'; _el('applock-forgot').disabled=false; }
});

// Shared password-reset flow (emailed 6-char code → verify → set new password).
// opts: { worker, reqBody:{journal,entryId}|{profile}, email, appName, label, onSuccess }
window._pwReset = window._pwReset || async function(opts){
  function post(path, obj){ return fetch(opts.worker+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)}).then(function(r){return r.json();}); }
  var rq;
  try { rq = await post('/auth/reset/request', Object.assign({ appName: opts.appName, label: opts.label, owner: opts.owner }, opts.reqBody)); }
  catch(e){ alert('Network error while starting the reset. Check your connection and try again.'); return false; }
  if (rq && rq.noLock) { alert('There is no password set on the server for this item.'); return false; }
  if (rq && rq.error==='throttled') { alert('Too many reset emails have gone out just now. Wait a few minutes and try again.'); return false; }
  if (rq && rq.error==='email-failed') { alert('Could not send the reset email. Please try again in a moment.'); return false; }
  if (!rq || !rq.ok) { alert('Could not start the reset. Please try again.'); return false; }
  // The WORKER mails the code now; it is never returned here. That is what
  // stops a stranger from starting a reset and reading the code off the reply.
  var vals = await window.uiForm({
    title:'Reset password',
    message:'A 6-character code was emailed to '+(rq.to||opts.email)+'. Enter it below (check spam if you don\'t see it within a minute), then choose a new password.',
    okLabel:'Reset password',
    fields:[
      { name:'code', label:'Security code from email', placeholder:'6-character code', autocap:false, required:true },
      { name:'password', label:'New password', type:'password', required:true },
      { name:'hint', label:'New password hint (optional)' }
    ]
  });
  if (!vals) return false;
  var code = String(vals.code||'').trim();
  var np = String(vals.password||'').trim();
  var nh = vals.hint||'';
  if (!code) { await window.uiAlert('No code entered.'); return false; }
  if (!np) { await window.uiAlert('Password cannot be empty.'); return false; }
  var body = Object.assign({ code:code, password:np, hint:nh }, opts.reqBody);
  var cf;
  try { cf = await post('/auth/reset/confirm', body); }
  catch(e){ alert('Network error while confirming the reset. Please try again.'); return false; }
  if (cf && cf.ok) {
    if (opts.onSuccess) { try { opts.onSuccess(); } catch(e){} }
    alert('Password reset! It now syncs to all your devices. This device is unlocked; other devices will ask for the new password once.');
    return true;
  }
  if (cf && cf.error==='badcode') alert('That code is not correct.'+(cf.remaining!=null?(' '+cf.remaining+' attempt(s) left before it expires.'):''));
  else if (cf && cf.error==='expired') alert('That code has expired or was already used. Start the reset again to get a fresh code.');
  else if (cf && cf.error==='locked') alert('Too many incorrect attempts. Start the reset again to get a fresh code.');
  else alert('Reset failed. Please try again.');
  return false;
};

// TradeHub app-lock: reset password via emailed security code.
_el('applock-reset') && _el('applock-reset').addEventListener('click', async function(){
  var prev=_el('applock-reset').textContent; _el('applock-reset').textContent='Sending code…'; _el('applock-reset').disabled=true;
  await window._pwReset({
    worker:AL_WORKER,
    reqBody:{ journal:AL_JOURNAL, entryId:APPID },
    email:AL_EMAIL,
    form:'https://formspree.io/f/xeedkebo',
    appName:'TradeHub',
    label:'TradeHub',
    onSuccess:function(){ alSetLock(); alMarkUnlocked(); alShowRoot(); alHideOverlay(); alUpdateLockBtns(); }
  });
  _el('applock-reset').textContent=prev; _el('applock-reset').disabled=false;
});

// ── HEADER LOCK BUTTON STATE ────────────────────────────────────────────────
// The React headers render a button with id 'tb-lock-btn-desktop' / 'tb-lock-btn-mobile'.
function alUpdateLockBtns(){
  // React now renders the lock-icon emoji from window._tbAppIsLocked(); we only
  // notify React to re-render rather than setting textContent (which React would
  // overwrite, causing wrong state on mobile re-renders).
  try { if (typeof tabNotify === 'function') tabNotify(); } catch(e){}
}
window._tbUpdateLockBtns = alUpdateLockBtns;

// ── LOAD-TIME ENFORCEMENT ───────────────────────────────────────────────────
// If locked & not unlocked on this device, keep root hidden and prompt.
function alEnforce(){
  if (alMustBlock()){ alHideRoot(); if(_el('applock-overlay').style.display!=='flex') alShowOverlay('unlock'); }
  else { alShowRoot(); }
  alUpdateLockBtns();
}
// React mounts async; sweep a few times to catch the button + enforce the gate.
alEnforce();
setTimeout(alEnforce, 300);
setTimeout(function(){ alUpdateLockBtns(); alEnforce(); }, 800);
setTimeout(function(){ alUpdateLockBtns(); }, 2000);

// ════════════════════════════════════════════════════════════════════════════
// PER-TAB LOCKS — same password system (worker KV + Firebase + localStorage),
// just a different entryId per tab: 'tony_tradehub_tab_<tabId>'. Lets you lock
// individual tabs even when the whole program is unlocked. Exposed to React via
// window._tbTabLock so the TBTabGate component can gate page content.
// ════════════════════════════════════════════════════════════════════════════
var TAB_PREFIX = 'tony_tradehub_tab_';
function tabAppId(tabId){ return TAB_PREFIX + tabId; }
var _tabLockSubs = [];
function tabNotify(){ _tabLockSubs.forEach(function(cb){ try{cb();}catch(e){} }); }

function tabIsLocked(tabId){ return !!_alLocks[tabAppId(tabId)]; }
function tabLockVersion(tabId){ var e=_alLocks[tabAppId(tabId)]; return (e&&e.v)||0; }
function tabIsUnlocked(tabId){
  if(!tabIsLocked(tabId)) return true;
  var v = tabLockVersion(tabId);
  var got = parseInt(window.alDur.get('al_unlockedv_' + tabAppId(tabId))||'0',10);
  if(v===0){
    // Legacy lock with no version → unlock with the simple flag (or any recorded unlock).
    return window.alDur.get('al_unlocked_' + tabAppId(tabId))==='1' || got>0;
  }
  // Monotonic (mirrors alIsUnlocked): unlocked as long as this device unlocked at
  // or after the current password version. Only a genuine change re-requires it.
  return got>0 && got>=v;
}
function tabMustBlock(tabId){ return tabIsLocked(tabId) && !tabIsUnlocked(tabId); }
function tabMarkUnlocked(tabId){
  try{
    var v = tabLockVersion(tabId);
    var prev = parseInt(window.alDur.get('al_unlockedv_' + tabAppId(tabId))||'0',10);
    var mark = Math.max(v||Date.now(), prev||0);
    window.alDur.set('al_unlockedv_' + tabAppId(tabId), String(mark));
    if(v===0) window.alDur.set('al_unlocked_' + tabAppId(tabId), '1'); // legacy flag too
  }catch(e){}
}
function tabMarkLocked(tabId){ try{ window.alDur.remove('al_unlockedv_' + tabAppId(tabId)); window.alDur.remove('al_unlocked_' + tabAppId(tabId)); }catch(e){} }

function tabSaveLocks(){
  try { window.alDur.set('al_locks', JSON.stringify(_alLocks)); } catch(e){}
  if (window._fbSaveAppLocks) window._fbSaveAppLocks(_alLocks);
}
function tabSetLock(tabId, version){ _alLocks[tabAppId(tabId)] = { locked: true, v: version||Date.now() }; tabSaveLocks(); tabNotify(); }
function tabRemoveLock(tabId){ delete _alLocks[tabAppId(tabId)]; tabSaveLocks(); tabNotify(); }

// Worker calls for a given tab's password (mirror the whole-app flow exactly).
function tabVerify(tabId, pw){
  return fetch(AL_WORKER+'/auth/journal/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({journal:AL_JOURNAL,entryId:tabAppId(tabId),password:pw})}).then(function(r){return r.json();});
}
function tabSetPw(tabId, pw, hint){
  return fetch(AL_WORKER+'/auth/journal/set-lock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({journal:AL_JOURNAL,entryId:tabAppId(tabId),password:pw,hint:hint||''})}).then(function(r){return r.json();});
}
function tabRemovePw(tabId, pw){
  return fetch(AL_WORKER+'/auth/journal/remove-lock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({journal:AL_JOURNAL,entryId:tabAppId(tabId),password:pw})}).then(function(r){return r.json();});
}
function tabSendHint(tabId, tabLabel){
  // The worker mails the hint; the text never comes back to the page.
  return fetch(AL_WORKER+'/auth/journal/hint',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({journal:AL_JOURNAL,entryId:tabAppId(tabId),appName:'TradeHub',label:'tab "'+tabLabel+'"'})}).then(function(r){return r.json();}).then(function(hd){
    if (hd.noLock) return { noLock:true };
    return { sent: !!hd.ok };
  });
}

// When remote locks change, refresh React tab gates too.
var _origApply = window._alApplyRemoteLocks;
window._alApplyRemoteLocks = function(remoteLocks){
  // Detect tabs newly locked OR password-changed (version bumped) remotely →
  // require the (possibly new) password again on this device.
  remoteLocks = remoteLocks || {};
  // Re-locking is governed by version comparison in tabIsUnlocked() (got>=v), so
  // we no longer wipe a tab's unlock record on a mere version difference — that
  // caused spurious re-prompts. A genuine password change (newer version) or a
  // newly-set lock this device never unlocked will block automatically.
  if (_origApply) _origApply(remoteLocks);
  tabNotify();
};

window._tbTabLock = {
  isLocked: tabIsLocked,
  isUnlocked: tabIsUnlocked,
  mustBlock: tabMustBlock,
  markUnlocked: tabMarkUnlocked,
  markLocked: tabMarkLocked,
  setLock: tabSetLock,
  removeLock: tabRemoveLock,
  verify: tabVerify,
  setPw: tabSetPw,
  removePw: tabRemovePw,
  sendHint: tabSendHint,
  // Reset this tab's password via an emailed security code. Resolves true on success.
  resetPw: function(tabId, tabLabel){
    return window._pwReset({
      worker: AL_WORKER,
      reqBody: { journal: AL_JOURNAL, entryId: tabAppId(tabId) },
      email: AL_EMAIL,
      form: 'https://formspree.io/f/xeedkebo',
      appName: 'TradeHub',
      label: 'the "' + (tabLabel || 'tab') + '" tab',
      onSuccess: function(){ tabSetLock(tabId); tabMarkUnlocked(tabId); }
    });
  },
  onChange: function(cb){ _tabLockSubs.push(cb); return function(){ _tabLockSubs = _tabLockSubs.filter(function(f){return f!==cb;}); }; },
};

})();
</script>

<!-- ══ In-UI modal system (replaces native alert/confirm/prompt so dialogs live
        INSIDE the app and never vanish when the browser window loses focus) ══ -->
<script>
(function(){
  if (window.uiModal) return;
  var ACCENT = '#e0b874';
  var CSS =
    '#uim-overlay{position:fixed;inset:0;z-index:2147483000;display:none;align-items:center;justify-content:center;background:rgba(14,14,16,.66);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);padding:20px;box-sizing:border-box;}'
  + '#uim-overlay.show{display:flex;}'
  + '#uim-box{width:100%;max-width:370px;background:#2c2c31;border:1px solid #45454c;border-radius:9px;padding:26px 24px;box-shadow:0 30px 70px rgba(0,0,0,.48);box-sizing:border-box;font-family:\'Inter\',system-ui,-apple-system,sans-serif;animation:uimIn .16s ease;}'
  + '@keyframes uimIn{from{transform:translateY(8px) scale(.98);opacity:0}to{transform:none;opacity:1}}'
  + '#uim-title{font-family:\'Manrope\',system-ui,sans-serif;font-size:20px;font-weight:600;letter-spacing:-.2px;color:#f4f3f0;margin-bottom:8px;line-height:1.25;}'
  + '#uim-msg{font-size:13.5px;color:#adadb2;line-height:1.55;white-space:pre-wrap;margin-bottom:16px;}'
  + '.uim-field{display:block;margin-bottom:14px;}'
  + '.uim-label{display:block;font-size:10px;font-weight:500;letter-spacing:1.4px;text-transform:uppercase;color:#8d8d94;margin:0 0 7px;}'
  + '.uim-input{width:100%;box-sizing:border-box;background:#232327;border:1px solid #45454c;border-radius:6px;color:#f4f3f0;font-size:13.5px;font-weight:500;padding:10px 13px;outline:none;font-family:inherit;transition:border-color .18s;}'
  + '.uim-input:focus{border-color:#e0b874;}'
  + '#uim-err{font-size:12.5px;color:#d68a7c;font-weight:500;min-height:15px;margin-bottom:4px;}'
  + '#uim-btns{display:flex;gap:10px;margin-top:20px;justify-content:flex-end;}'
  + '#uim-btns button{border:1px solid #45454c;background:transparent;border-radius:6px;padding:9px 16px;font-size:11.5px;font-weight:500;letter-spacing:.8px;text-transform:uppercase;cursor:pointer;font-family:inherit;transition:border-color .18s,color .18s;}'
  + '#uim-cancel{color:#f4f3f0;}'
  + '#uim-cancel:hover{border-color:#adadb2;}';
  var queue=[], active=null;
  function el(id){ return document.getElementById(id); }
  function inject(){
    if (el('uim-overlay')) return;
    var st=document.createElement('style'); st.id='uim-style'; st.textContent=CSS; document.head.appendChild(st);
    var ov=document.createElement('div'); ov.id='uim-overlay';
    ov.innerHTML='<form id="uim-box" autocomplete="off">'
      +'<div id="uim-title"></div><div id="uim-msg"></div><div id="uim-fields"></div>'
      +'<div id="uim-err"></div>'
      +'<div id="uim-btns"><button type="button" id="uim-cancel"></button><button type="submit" id="uim-ok"></button></div></form>';
    document.body.appendChild(ov);
    el('uim-cancel').addEventListener('click', function(){ close(active&&active.kind==='confirm'?false:null); });
    el('uim-box').addEventListener('submit', function(e){ e.preventDefault(); submit(); });
    document.addEventListener('keydown', function(e){ if(active && e.key==='Escape'){ close(active.kind==='confirm'?false:null); } });
  }
  function render(cfg){
    inject(); active=cfg;
    el('uim-title').textContent=cfg.title||''; el('uim-title').style.display=cfg.title?'':'none';
    el('uim-msg').textContent=cfg.message||''; el('uim-msg').style.display=cfg.message?'':'none';
    var fw=el('uim-fields'); fw.innerHTML='';
    (cfg.fields||[]).forEach(function(f){
      var lab=document.createElement('label'); lab.className='uim-field';
      if(f.label){ var sp=document.createElement('span'); sp.className='uim-label'; sp.textContent=f.label; lab.appendChild(sp); }
      var inp=document.createElement('input'); inp.className='uim-input'; inp.type=f.type||'text';
      inp.value=(f.value!=null?f.value:''); if(f.placeholder) inp.placeholder=f.placeholder; inp.setAttribute('data-name',f.name);
      if(f.autocap===false){ inp.autocapitalize='off'; inp.setAttribute('autocorrect','off'); inp.spellcheck=false; }
      lab.appendChild(inp); fw.appendChild(lab);
    });
    el('uim-err').textContent='';
    var ok=el('uim-ok'), ca=el('uim-cancel');
    ok.textContent=cfg.okLabel||'OK';
    ok.style.background='transparent';
    ok.style.color=cfg.danger?'#d68a7c':'#e0b874';
    ok.style.borderColor=cfg.danger?'rgba(214,138,124,.45)':'rgba(224,184,116,.36)';
    ca.textContent=cfg.cancelLabel||'Cancel'; ca.style.display=(cfg.kind==='alert')?'none':'';
    el('uim-overlay').classList.add('show');
    setTimeout(function(){ var fi=fw.querySelector('input'); if(fi){ fi.focus(); try{fi.select();}catch(e){} } else ok.focus(); }, 40);
  }
  function collect(){ var o={}; var ins=el('uim-fields').querySelectorAll('input'); Array.prototype.forEach.call(ins,function(i){ o[i.getAttribute('data-name')]=i.value; }); return o; }
  function submit(){
    if(!active) return; var cfg=active;
    if(cfg.fields && cfg.fields.length){
      var vals=collect(), ins=el('uim-fields').querySelectorAll('input');
      for(var i=0;i<cfg.fields.length;i++){ var f=cfg.fields[i];
        if(f.required && !String(vals[f.name]||'').trim()){ el('uim-err').textContent=(f.label||'This field')+' is required.'; if(ins[i]) ins[i].focus(); return; } }
      close(cfg.kind==='prompt' ? String(vals[cfg.fields[0].name]) : vals);
    } else { close(cfg.kind==='confirm'?true:undefined); }
  }
  function close(result){
    var cfg=active; active=null;
    var ov=el('uim-overlay'); if(ov) ov.classList.remove('show');
    if(cfg && cfg.resolve) cfg.resolve(result);
    if(queue.length){ render(queue.shift()); }
  }
  function open(cfg){ return new Promise(function(res){ cfg.resolve=res; if(active) queue.push(cfg); else render(cfg); }); }
  window.uiModal=open;
  window.uiAlert=function(m,o){ o=o||{}; return open({kind:'alert',message:String(m==null?'':m),title:o.title,okLabel:o.okLabel||'OK'}); };
  window.uiConfirm=function(m,o){ o=o||{}; return open({kind:'confirm',message:String(m==null?'':m),title:o.title,okLabel:o.okLabel||'OK',cancelLabel:o.cancelLabel||'Cancel',danger:o.danger}); };
  window.uiPrompt=function(m,o){ o=o||{}; return open({kind:'prompt',message:String(m==null?'':m),title:o.title,okLabel:o.okLabel||'OK',cancelLabel:o.cancelLabel||'Cancel',
    fields:[{name:'value',type:o.password?'password':'text',value:(o.default!=null?o.default:(o.value!=null?o.value:'')),placeholder:o.placeholder||'',autocap:o.autocap}]}); };
  window.uiForm=function(cfg){ cfg=cfg||{}; return open({kind:'form',title:cfg.title,message:cfg.message,okLabel:cfg.okLabel||'Save',cancelLabel:cfg.cancelLabel||'Cancel',danger:cfg.danger,fields:cfg.fields||[]}); };
  try { window.alert=function(m){ window.uiAlert(m==null?'':String(m)); }; } catch(e){}
})();
</script>
