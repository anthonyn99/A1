<!-- ── Single-tab handoff ──────────────────────────────────────────────────────
     Keeps exactly one tab per program. TaskHub focuses an already-open tab by
     re-targeting its window name, but a name only resolves inside the browsing
     context group that created it — relaunch the TaskHub PWA and that group is
     gone, so the click lands here in a NEW tab while the old one still sits in
     the browser. That's the duplicate this script cleans up.

     The old tab cannot simply be raised instead: Chrome refuses to focus a
     background tab (WindowClient.focus() throws "Not allowed to focus a window"
     even from a real click — verified — the sole exception being a notification
     click). So the NEWEST tab wins and older ones step aside. Every tab
     announces itself on load; any tab showing the same page with an older birth
     stamp closes itself. You land on the program, duplicates never pile up.

     BroadcastChannel, not the service worker, because it reaches every
     same-origin tab regardless of browsing context group — exactly the boundary
     that defeats window names. (Cross-origin custom links can't take part;
     nothing we can run lives in those pages.)

     window.close() only succeeds in a script-opened tab. One typed in by hand or
     restored at browser start just stays — no worse than the old behaviour.
     An app with unsaved work can set window.__a1BlockTabHandoff = true to opt
     out of being closed. -->
<script>
(function(){
  if (typeof BroadcastChannel !== 'function') return;
  var PAGE = (location.pathname.split('/').pop() || 'index.html').toLowerCase();
  var BORN = Date.now() + Math.random();   // random breaks ties on same-ms opens
  var bc; try { bc = new BroadcastChannel('a1-single-tab'); } catch(e){ return; }
  function announce(){ try { bc.postMessage({ type:'claim', page:PAGE, born:BORN }); } catch(e){} }
  bc.onmessage = function(e){
    var d = e.data || {};
    if (!d || d.type !== 'claim' || d.page !== PAGE) return;
    if (d.born > BORN) {
      if (window.__a1BlockTabHandoff) return;
      try { window.close(); } catch(_){}
    } else {
      // An older tab only just started listening (it was still loading when we
      // announced) — re-announce so it learns we're here and steps aside.
      announce();
    }
  };
  announce();
})();
</script>

<!-- ══════════════ Biometric auth (WebAuthn / platform passkeys) ══════════════
     Shared, dependency-free helper. Primary auth = the device's own biometric
     (Face ID / Touch ID on iOS, fingerprint on Android/Samsung, Windows Hello on
     Windows) through the OS secure framework. The app NEVER sees or stores raw
     biometric data — WebAuthn returns only a public-key credential handle.
     Credentials are keyed per (app,id) so every app / tab keeps its own isolated
     credential; one credential can never satisfy another's unlock. -->
<script>
(function(){
  if (window.Bio) return;
  var NS = 'bio_cred_';
  function u8(buf){ return new Uint8Array(buf); }
  function b64u(buf){ var b=u8(buf),s=''; for(var i=0;i<b.length;i++) s+=String.fromCharCode(b[i]); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
  function unb64u(str){ str=String(str).replace(/-/g,'+').replace(/_/g,'/'); while(str.length%4) str+='='; var bin=atob(str),b=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i); return b.buffer; }
  function rand(n){ var a=new Uint8Array(n); crypto.getRandomValues(a); return a; }
  function keyOf(app,id){ return NS+app+'_'+id; }
  function supported(){ return !!(window.isSecureContext && window.PublicKeyCredential && navigator.credentials && navigator.credentials.create); }
  function available(){
    if(!supported()) return Promise.resolve(false);
    if(!PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable) return Promise.resolve(false);
    return PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable().then(function(v){return !!v;}).catch(function(){return false;});
  }
  function stored(app,id){ try{ return JSON.parse(localStorage.getItem(keyOf(app,id))||'null'); }catch(e){ return null; } }
  function isRegistered(app,id){ var r=stored(app,id); return !!(r&&r.id); }
  function unregister(app,id){ try{ localStorage.removeItem(keyOf(app,id)); }catch(e){} }
  function label(){
    var ua=navigator.userAgent||'';
    if(/iPhone|iPad|iPod/.test(ua)) return 'Face ID';
    if(/Android/.test(ua)) return 'fingerprint';
    if(/Windows/.test(ua)) return 'Windows Hello';
    if(/Mac/.test(ua)) return 'Touch ID';
    return 'biometrics';
  }
  function register(app,id,opts){
    opts=opts||{};
    if(!supported()) return Promise.resolve({ok:false,error:'unsupported'});
    return navigator.credentials.create({publicKey:{
      challenge: rand(32),
      rp:{ name: opts.rpName||document.title||'App', id: location.hostname||undefined },
      user:{ id: rand(16), name: opts.userName||(app+':'+id), displayName: opts.displayName||opts.userName||id },
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{ authenticatorAttachment:'platform', userVerification:'required', residentKey:'preferred' },
      timeout: 60000, attestation:'none'
    }}).then(function(cred){
      if(!cred) return {ok:false,error:'cancelled'};
      localStorage.setItem(keyOf(app,id), JSON.stringify({ id:b64u(cred.rawId), created:Date.now(), label:opts.displayName||opts.userName||id }));
      return {ok:true};
    }).catch(function(e){ return {ok:false, error:(e&&e.name)||'error', message:(e&&e.message)||'' }; });
  }
  function authenticate(app,id){
    if(!supported()) return Promise.resolve({ok:false,error:'unsupported'});
    var rec=stored(app,id);
    if(!rec||!rec.id) return Promise.resolve({ok:false,error:'notregistered'});
    return navigator.credentials.get({publicKey:{
      challenge: rand(32),
      allowCredentials:[{ type:'public-key', id: unb64u(rec.id) }],
      userVerification:'required', timeout:60000, rpId: location.hostname||undefined
    }}).then(function(asr){
      if(!asr) return {ok:false,error:'cancelled'};
      return {ok:true};
    }).catch(function(e){ return {ok:false, error:(e&&e.name)||'error', message:(e&&e.message)||'' }; });
  }
  window.Bio = { supported:supported, available:available, isRegistered:isRegistered, register:register, authenticate:authenticate, unregister:unregister, label:label };
})();
</script>

<script>
  /* DURABLE LOCK STORE — localStorage mirrored into a long-lived cookie.
     Why: the "unlocked once per device" record lived ONLY in localStorage, which
     Brave (Tony's desktop) and mobile PWABs evict aggressively — so a plain
     refresh/reopen silently dropped the unlock and re-prompted for the password.
     The cookie survives many of those evictions; on read we prefer localStorage
     and rehydrate it from the cookie when missing, so a device stays unlocked
     until the password genuinely changes or the section is manually re-locked.
     Defined here (before the gate and React) so every lock reader shares it. */
  (function(){
    if (window.alDur) return;
    var YEAR400 = 34560000; // seconds — browsers cap cookie lifetime near 400 days
    function ck(k){
      var m = document.cookie.match(new RegExp('(?:^|; )' + k.replace(/[.$?*|{}()\[\]\\\/+^-]/g,'\\$&') + '=([^;]*)'));
      return m ? decodeURIComponent(m[1]) : null;
    }
    function writeCookie(k,v){
      try { document.cookie = k + '=' + encodeURIComponent(v) + '; path=/; max-age=' + YEAR400 + '; SameSite=Lax'; } catch(e){}
    }
    window.alDur = {
      get: function(k){
        var v = null; try { v = localStorage.getItem(k); } catch(e){}
        if (v != null) {
          // Write-through: back-fill the cookie so a device already unlocked BEFORE
          // this durable layer existed becomes eviction-proof on its very first load.
          if (ck(k) == null) writeCookie(k, v);
          return v;
        }
        var c = ck(k);
        if (c != null) { try { localStorage.setItem(k, c); } catch(e){} }  // rehydrate
        return c;
      },
      set: function(k,v){
        try { localStorage.setItem(k, v); } catch(e){}
        writeCookie(k, v);
      },
      remove: function(k){
        try { localStorage.removeItem(k); } catch(e){}
        try { document.cookie = k + '=; path=/; max-age=0; SameSite=Lax'; } catch(e){}
      }
    };
  })();

  /* SECURITY GATE — runs BEFORE React mounts. If TradeHub is locked (per the
     durable lock cache shared with index.html) and this device hasn't unlocked
     it, hide the root so contents NEVER flash before the password. */
  (function(){
    var APPID = 'tony_tradehub_standalone';
    var locks = {};
    try { locks = JSON.parse(window.alDur.get('al_locks') || '{}'); } catch(e) {}
    var entry = locks[APPID];
    var isLocked = !!entry;
    var v = (entry && entry.v) || 0;
    var gotV = parseInt(window.alDur.get('al_unlockedv_' + APPID) || '0', 10);
    var isUnlocked = v === 0
      ? (window.alDur.get('al_unlocked_' + APPID) === '1' || gotV > 0)
      : (gotV > 0 && gotV >= v);
    if (isLocked && !isUnlocked) {
      var r = document.getElementById('tradeboard-root');
      if (r) r.style.display = 'none';
    }
  })();
</script>

<script>
  /* TradeHub has one theme. _syncAllThemes is kept because the rest of the
     suite still calls it when navigating between apps; all it does now is pin
     the page background, which also has to happen before React mounts. */
  window._syncAllThemes = function(){

      if (Array.isArray(data.tickers)) {
        window.dispatchEvent(new CustomEvent('fb-tb-watchlist-remote', { detail: data.tickers }));
      }
    });

    if (_tbPlaybookUnsub) { _tbPlaybookUnsub(); _tbPlaybookUnsub = null; }
    _tbPlaybookUnsub = onSnapshot(tbPlaybookDocRef, (snap) => {
      if (!snap.exists()) return;
      if (Date.now() - _tbPlaybookLastOwnSaveAt < 8000) return;
      const data = snap.data();
      if (Array.isArray(data.pages)) {
        window.dispatchEvent(new CustomEvent('fb-tb-playbook-remote', { detail: data.pages }));
      }
    });

    // ── AppLock locked-set sync — which apps are locked, shared across ALL devices.
    //    Same dashboards/applock doc the main suite (index.html) uses, so locking
    //    TradeHub here or there stays in sync everywhere. ──
    window._fbSaveAppLocks = (locksObj) => {
      clearTimeout(_tbAppLockSaveTimer);
      _tbAppLockSaveTimer = setTimeout(async () => {
        try {
          _tbAppLockLastOwnSaveAt = Date.now();
          await setDoc(tbAppLockDocRef, { locks: locksObj || {}, savedAt: Date.now() });
          _tbAppLockLastOwnSaveAt = Date.now();
        } catch(e) { console.warn('[AppLock] Firebase save failed:', e); }
      }, 400);
    };
    window._fbLoadAppLocks = async () => {
      try {
        const snap = await getDoc(tbAppLockDocRef);
        if (snap.exists()) { const d = snap.data(); return d.locks || {}; }
      } catch(e) { console.warn('[AppLock] Firebase load failed:', e); }
      return null;
    };
    if (_tbAppLockUnsub) { _tbAppLockUnsub(); _tbAppLockUnsub = null; }
    _tbAppLockUnsub = onSnapshot(tbAppLockDocRef, (snap) => {
      if (!snap.exists()) return;
      if (Date.now() - _tbAppLockLastOwnSaveAt < 2000) return;
      const d = snap.data();
      if (window._alApplyRemoteLocks) window._alApplyRemoteLocks(d.locks || {});
    }, (err) => { console.warn('[AppLock] onSnapshot error:', err); });

    window._fbReady = true;
    window.dispatchEvent(new CustomEvent("fb-ready"));
  }

  init();

  // ── Listener lifecycle: tear down on idle to avoid Firestore read spikes,
  //    restore on the next interaction (scoped to TradeHub's 4 docs only). ──
  let _hideTimer = null, _idleTimer = null;
  const HIDE_DELAY = 1000;            // 1s after tab hidden → teardown
  const IDLE_DELAY = 5 * 60 * 1000;   // 5min no interaction → teardown

  async function _teardown(){
    // Don't terminate Firestore while a TradeBoard build or Webull sync is in
    // flight. Builds take 60–120s; if the tab goes hidden mid-build (phone
    // screen off / app switch) the old teardown killed the client, so the
    // completion write rejected ("client already terminated") → a false
    // "Sync failed" even though the worker already had the report. Defer.
    if (window._tbBuildUntil && Date.now() < window._tbBuildUntil) {
      clearTimeout(_hideTimer); clearTimeout(_idleTimer);
      _hideTimer = null;
      _idleTimer = setTimeout(_teardown, 15000);
      return;
    }
    clearTimeout(_hideTimer); clearTimeout(_idleTimer);
    _hideTimer = null; _idleTimer = null;
    if (_tbJournalUnsub) { _tbJournalUnsub(); _tbJournalUnsub = null; }
    if (_tbPromptsUnsub) { _tbPromptsUnsub(); _tbPromptsUnsub = null; }
    if (_tbNewsUnsub)    { _tbNewsUnsub();    _tbNewsUnsub    = null; }
    if (_tbAnalysisUnsub){ _tbAnalysisUnsub();_tbAnalysisUnsub= null; }
    if (_tbWatchlistUnsub){ _tbWatchlistUnsub();_tbWatchlistUnsub= null; }
    if (_tbPlaybookUnsub){ _tbPlaybookUnsub();_tbPlaybookUnsub= null; }
    if (_tbAppLockUnsub) { _tbAppLockUnsub(); _tbAppLockUnsub = null; }
    try { await terminate(db); } catch(e) {}
    db = initializeFirestore(app, { localCache: memoryLocalCache() });
    window._fbReady = false; // force init() on next interaction
  }
  function _restore(){
    if (!window._fbReady) init();
    _startIdleTimer();
  }
  function _startIdleTimer(){
    clearTimeout(_idleTimer);
    _idleTimer = setTimeout(_teardown, IDLE_DELAY);
  }
  ['pointerdown','keydown','touchstart','wheel'].forEach(ev =>
    window.addEventListener(ev, () => { _restore(); }, { passive:true }));
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      _hideTimer = setTimeout(_teardown, HIDE_DELAY);
    } else {
      clearTimeout(_hideTimer); _hideTimer = null;
      _restore();
    }
  });
  _startIdleTimer();
</script>

/* ── Mobile hook ── */
function useIsMobile(breakpoint=768){
  const [mobile,setMobile]=useState(()=>window.innerWidth<=breakpoint);
  useEffect(()=>{
    const h=()=>setMobile(window.innerWidth<=breakpoint);
    window.addEventListener('resize',h,{passive:true});
    return()=>window.removeEventListener('resize',h);
  },[breakpoint]);
  return mobile;
}

/* ── Parser helpers (minimal reimplementation to avoid global collision) ── */
const TB_WATCHLIST=['DRAM','SNDK','MU','INTC','WDC','AMD','CRWD','BE','GOOGL','PLTR','NVDA','MRVL','CRDO','TSLA','SPCX','AAPL','MSFT','NET','SCCO','ERO','WMT','AMZN','BABA'];
// Active watchlist — the single shared list edited in the Control tab. Drives
// News fetch, report parsing, and sector inference. Defaults to TB_WATCHLIST
// until the user customizes it; TBApp keeps this in sync via tbSetWatchlist().
let TB_WL=[...TB_WATCHLIST];
function tbSetWatchlist(arr){TB_WL=(Array.isArray(arr)&&arr.length)?arr.slice():[...TB_WATCHLIST];pushWatchlistToWorkers(TB_WL);tbResolveSectors(TB_WL);}

// Push TB_WL to the workers so their CRON pre-builds + on-demand builds use the
// exact Control-tab list (News + Catalysts both read it). Debounced;
// fire-and-forget. This is what makes the Control watchlist universal.
let _wlPushTimer=null,_wlPushLast='';
function pushWatchlistToWorkers(tickers){
  if(!Array.isArray(tickers)||!tickers.length)return;
  const sig=tickers.join(',');
  if(sig===_wlPushLast)return;            // skip identical repeats (tbSetWatchlist fires often)
  if(_wlPushTimer)clearTimeout(_wlPushTimer);
  _wlPushTimer=setTimeout(()=>{
    _wlPushLast=sig;
    const opts={method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tickers}),keepalive:true};
    fetch('https://newshub-api.av1.workers.dev/watchlist',opts).catch(()=>{});
    fetch('https://trade-dashboard.av1.workers.dev/watchlist',opts).catch(()=>{});
  },1500);
}
function tbGetWatchlist(){return TB_WL;}
const TB_TICKER_SECTORS={DRAM:'AI/Semiconductor',MRVL:'Semiconductor',SPCX:'Space',SNDK:'Storage',MU:'Semiconductor',WDC:'Storage',INTC:'Semiconductor',AMD:'Semiconductor',LMT:'Defense',CRWD:'Cybersecurity',BE:'Clean Energy',GOOGL:'Tech/Mega-Cap',PLTR:'AI/Software',NVDA:'AI/Semiconductor',CRDO:'Semiconductor',TSLA:'EV/Auto',AAPL:'Tech/Mega-Cap',MSFT:'Tech/Mega-Cap',NET:'Cybersecurity',SCCO:'Copper/Mining',ERO:'Copper/Mining',WMT:'Retail',AMZN:'Tech/Retail',BABA:'China/Tech',LMND:'InsurTech',EXPE:'Travel',NVS:'Pharma',MS:'Financials',XOM:'Energy',CVX:'Energy',VLO:'Refining',CNQ:'Energy',COF:'Financials',FCX:'Copper/Mining',MMM:'Industrials',SMH:'Semiconductor',VMC:'Materials/Construction'};

// AI-derived sectors for tickers NOT in the static table above. Populated by
// tbResolveSectors() (calls the newshub /sectors endpoint, which classifies via
// Gemini and caches in KV), persisted to localStorage so chips render instantly
// on reload. This is what makes any newly-added ticker get a real sector without
// hardcoding it here. tbInferSector falls through static → AI cache → Diversified.
let TB_AI_SECTORS={};
try{const _s=localStorage.getItem('tb_ai_sectors');if(_s)TB_AI_SECTORS=JSON.parse(_s)||{};}catch(e){}
function tbInferSector(t){return TB_TICKER_SECTORS[t]||TB_AI_SECTORS[t]||'Diversified';}
// Re-render hook: components subscribe so chips/filters update when async AI
// sectors land. Decoupled via a window event so News + Control both refresh.
function tbNotifySectors(){try{window.dispatchEvent(new CustomEvent('tb-sectors-updated'));}catch(e){}}
// Resolve sectors for any tickers missing from BOTH the static map and the AI
// cache. Fire-and-forget; results merge into TB_AI_SECTORS + localStorage and
// trigger a re-render. De-duped so it won't re-ask for tickers already known.
let _sectorResolveInflight=new Set();
async function tbResolveSectors(tickers){
  if(!Array.isArray(tickers))return;
  const need=tickers.filter(t=>t&&!TB_TICKER_SECTORS[t]&&!TB_AI_SECTORS[t]&&!_sectorResolveInflight.has(t));
  if(!need.length)return;
  need.forEach(t=>_sectorResolveInflight.add(t));
  try{
    const r=await fetch('https://newshub-api.av1.workers.dev/sectors?tickers='+encodeURIComponent(need.join(',')));
    if(r.ok){
      const j=await r.json();
      const map=j&&j.sectors?j.sectors:{};
      let changed=false;
      for(const [t,s] of Object.entries(map)){if(s&&!TB_TICKER_SECTORS[t]&&TB_AI_SECTORS[t]!==s){TB_AI_SECTORS[t]=s;changed=true;}}
      if(changed){try{localStorage.setItem('tb_ai_sectors',JSON.stringify(TB_AI_SECTORS));}catch(e){}tbNotifySectors();}
    }
  }catch(e){/* offline / worker down — chips stay 'Diversified' until next add */}
  finally{need.forEach(t=>_sectorResolveInflight.delete(t));}
}

/* ── Markdown renderer ── */
function tbRenderMarkdown(text){
  if(!text)return[];
  const lines=text.split('\n');const nodes=[];let i=0;
  while(i<lines.length){
    const line=lines[i];
    if(/^### /.test(line)){nodes.push({type:'h3',text:line.replace(/^###\s*/,'')});i++;continue;}
    if(/^## /.test(line)){nodes.push({type:'h2',text:line.replace(/^##\s*/,'')});i++;continue;}
    if(/^# /.test(line)){nodes.push({type:'h1',text:line.replace(/^#\s*/,'')});i++;continue;}
    if(/^\*\*[^*]+\*\*\s*$/.test(line.trim())){nodes.push({type:'h3',text:line.trim().replace(/\*\*/g,'')});i++;continue;}
    if(/^---+$/.test(line.trim())){nodes.push({type:'hr'});i++;continue;}
    if(/^[\s]*[-•*○▪]\s/.test(line)){nodes.push({type:'li',text:line.replace(/^[\s]*[-•*○▪]\s*/,'')});i++;continue;}
    if(!line.trim()){i++;continue;}
    nodes.push({type:'p',text:line});i++;
  }
  return nodes;
}
function tbInlineFormat(text){return text.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/`([^`]+)`/g,'<code>$1</code>');}
function TBMarkdownBlock({text,style}){
  const nodes=tbRenderMarkdown(text);
  return(<div className="tb-md-block" style={style}>{nodes.map((n,i)=>{
    if(n.type==='hr')return<hr key={i}/>;
    if(n.type==='h1')return<h1 key={i} dangerouslySetInnerHTML={{__html:tbInlineFormat(n.text)}}/>;
    if(n.type==='h2')return<h2 key={i} dangerouslySetInnerHTML={{__html:tbInlineFormat(n.text)}}/>;
    if(n.type==='h3')return<h3 key={i} dangerouslySetInnerHTML={{__html:tbInlineFormat(n.text)}}/>;
    if(n.type==='li')return<div key={i} style={{display:'flex',gap:10,alignItems:'flex-start',marginBottom:5}}><span style={{color:'var(--ac)',flexShrink:0,marginTop:3,fontSize:12}}>▸</span><span dangerouslySetInnerHTML={{__html:tbInlineFormat(n.text)}} style={{fontSize:14,color:'var(--txd)',lineHeight:1.8,fontFamily:'Manrope,system-ui,sans-serif'}}/></div>;
    return<p key={i} dangerouslySetInnerHTML={{__html:tbInlineFormat(n.text)}}/>;
  })}</div>);
}

/* ── Toast ── */
function TBToast({message,icon='check',onClose}){
  useEffect(()=>{const t=setTimeout(onClose,2400);return()=>clearTimeout(t);},[]);
  return<div className="tb-toast"><TBIcon n={icon} size={15} style={{color:'var(--acs)'}}/>{message}</div>;
}

/* ── Background-job registry ─────────────────────────────────────────────────
   Every long-running job (Portfolio refresh, Webull sync, Re-merge, CSV import,
   News build, Catalyst build) registers itself here for the whole time it runs.
   Two reasons it lives at module level rather than in a component:
     • the job keeps running when the tab that started it unmounts, and
     • the nav can show WHICH tab is still working while you're on another one.
   React only ever mirrors this — nothing here depends on anything being mounted. */
const _tbJobs={
  active:{},                                   // tabId → label ('Syncing…', 'Building…')
  listeners:new Set(),
  sub(fn){this.listeners.add(fn);return()=>this.listeners.delete(fn);},
  emit(){this.listeners.forEach(fn=>{try{fn();}catch(e){}});},
  set(tabId,label){
    const next=label||'';
    if((this.active[tabId]||'')===next)return;
    if(next)this.active[tabId]=next; else delete this.active[tabId];
    this.holdFirestore();
    this.emit();
  },
  /* Firestore is torn down 1s after the app is hidden and 5min after the last
     interaction. That is exactly what happens when you kick a build and then
     switch apps — and a build whose client is terminated mid-flight can't write
     its result, so it lands on screen but never reaches Firebase or the other
     devices. _tbBuildUntil defers the teardown for as long as a job is running
     (the Webull sync has always done this; every job does now). */
  holdFirestore(){
    if(this.any())window._tbBuildUntil=Math.max(window._tbBuildUntil||0,Date.now()+6*60*1000);
    else if(!window._tbSyncInFlight)window._tbBuildUntil=0;
  },
  label(tabId){return this.active[tabId]||'';},
  busy(tabId){return !!this.active[tabId];},
  any(){return Object.keys(this.active).length>0;},
};
window._tbJobs=_tbJobs;
/* Re-render whatever uses it whenever a job starts or finishes. */
function useTBJobs(){
  const [,force]=useState(0);
  useEffect(()=>_tbJobs.sub(()=>force(v=>v+1)),[]);
  return _tbJobs;
}

/* ── Module-level JOURNAL store ──────────────────────────────────────────────
   The trade list and every job that mutates it (Webull sync, Re-merge, CSV
   import, the Firebase load) run against THIS, not against component state.
   They used to live entirely inside the hook, which meant leaving the Journal
   tab mid-sync unmounted the component — and React never even CALLS a
   setState(prev=>…) updater on an unmounted component, so the merge that
   dedupes the pulled Webull orders AND writes them to Firebase was dropped on
   the floor along with the spinner: the sync silently did nothing. Now the work
   lands here regardless of what is mounted, and a remounting tab just mirrors
   the store — including a still-running job's spinner and its result message. */
const _tbJournalStore={
  trades:[],
  loading:true,
  loaded:false,          // the Firebase load has completed once this page load
  busy:'',               // '' | 'sync' | 'remerge' | 'import'
  lastJobAt:0,           // when the last job finished — see tbLoadJournal
  msg:'', msgAt:0,       // last result message — survives a tab switch
  lastSync:parseInt(localStorage.getItem(TB_SYNC_TS_KEY)||'0',10)||null,
  listeners:new Set(),
  sub(fn){this.listeners.add(fn);return()=>this.listeners.delete(fn);},
  emit(){this.listeners.forEach(fn=>{try{fn();}catch(e){}});},
  /* Accepts a value or an updater, exactly like setState — so the job bodies
     below read as they always did while running outside React. */
  set(next){this.trades=(typeof next==='function'?next(this.trades):next)||[];this.emit();},
  setLoading(v){if(this.loading===!!v)return;this.loading=!!v;this.emit();},
  setBusy(kind,label){
    this.busy=kind||'';
    if(!kind)this.lastJobAt=Date.now();      // a job just wrote — see tbLoadJournal
    _tbJobs.set('journal',kind?(label||'Working…'):'');
    this.emit();
  },
  note(m){this.msg=m||'';this.msgAt=m?Date.now():0;this.emit();},
  bumpSync(ts){if(ts&&(!this.lastSync||ts>this.lastSync)){this.lastSync=ts;this.emit();}},
};
window._tbJournalStore=_tbJournalStore;   // console-visible, same as window._tbJobs
/* A result message is only worth showing for a short while after it lands, but
   long enough to still be there when you come back from another tab. */
const TB_JMSG_TTL=25000;

/* Firebase load — module-level and deduped, so a load that was in flight when
   the tab closed still lands in the store, and reopening the tab renders what's
   already there instead of blanking to "Loading…" while it re-reads.
   Still re-reads on every open (the Firestore listeners are torn down on idle, so
   a device that changed the journal while this one was asleep is only picked up
   here) — except right after one of our OWN jobs, whose write may still be in
   flight, where a server read would hand back the pre-write document. */
let _tbJournalLoadP=null;
function tbLoadJournal(force){
  const S=_tbJournalStore;
  if(_tbJournalLoadP)return _tbJournalLoadP;
  if(S.loaded&&!force)return Promise.resolve(S.trades);
  if(S.busy||(S.loaded&&Date.now()-S.lastJobAt<8000))return Promise.resolve(S.trades);
  /* Only show the loading state when there is nothing on screen yet. */
  if(!S.loaded||!S.trades.length)S.setLoading(true);
  _tbJournalLoadP=(async()=>{
    try{
      if(window._fbLoadTBJournal){
        const data=await window._fbLoadTBJournal();
        /* Never let a load overwrite a sync/import that finished while it was in
           flight — the store is already ahead of what Firebase handed back. */
        if(data&&Array.isArray(data)&&!S.busy)S.set(data);
      }
      S.loaded=true;
    }catch(e){console.warn('TB journal load error',e);}
    S.setLoading(false);
    _tbJournalLoadP=null;
    return S.trades;
  })();
  return _tbJournalLoadP;
}

/* ── Firebase-backed journal hook — a thin mirror of the store above ── */
function useTBJournal(){
  const S=_tbJournalStore;
  const [,forceRender]=useState(0);
  useEffect(()=>S.sub(()=>forceRender(v=>v+1)),[]);
  const trades=S.trades, loading=S.loading, syncing=S.busy==='sync', lastSync=S.lastSync;
  /* Aliases: the job bodies below are written as ordinary setState calls, but
     every one of them writes to the store, so they finish correctly even when
     this component is long gone. */
  const setTrades=useCallback(u=>S.set(u),[]);
  const setLoading=useCallback(v=>S.setLoading(v),[]);
  const setSyncing=useCallback(v=>S.setBusy(v?'sync':'',v?'Syncing…':''),[]);
  const setLastSync=useCallback(ts=>S.bumpSync(typeof ts==='function'?ts(S.lastSync):ts),[]);
  useEffect(()=>{
    const bump=ts=>{if(ts)setLastSync(prev=>(!prev||ts>prev)?ts:prev);};
    bump(window._tbLastSyncTs);
    const h=e=>bump(e.detail);
    window.addEventListener('tb-journal-sync-ts',h);
    return()=>window.removeEventListener('tb-journal-sync-ts',h);
  },[]);

  /* Load all trades from Firebase — kept on the returned API for callers that
     want an explicit re-read; tbLoadJournal decides whether one is warranted. */
  const load=useCallback(()=>tbLoadJournal(true),[]);

  useEffect(()=>{
    if(window._fbReady)tbLoadJournal(true);
    else{const h=()=>tbLoadJournal(true);window.addEventListener('fb-ready',h,{once:true});return()=>window.removeEventListener('fb-ready',h);}
  },[]);

  /* Live sync: apply remote journal changes from other devices.
     Also force a fresh server load if we haven't seen this savedAt before — this
     handles Firestore returning a stale local cache on mobile before the server
     write arrives, which caused Re-merge on desktop to not reflect on phone. */
  const lastSeenSavedAt=useRef(0);
  useEffect(()=>{
    const onRemote=(e)=>{
      if(!e.detail||!Array.isArray(e.detail))return;
      const incoming=e.detail;
      setTrades(incoming);
    };
    window.addEventListener('fb-tb-journal-remote',onRemote);
    return()=>window.removeEventListener('fb-tb-journal-remote',onRemote);
  },[load]);

  /* Webull auto-sync: pull from Cloudflare Worker, merge into state + Firebase.
     SELLs chain as new legs onto the most-recent open BUY entry for the same
     ticker instead of creating a separate top-level entry. */
  const sync=useCallback(async()=>{
    if(window._tbSyncInFlight||S.busy)return; // dedupe concurrent syncs (morning orchestrator + tab-mount auto-sync) and never race a re-merge/import
    window._tbSyncInFlight=true;
    setSyncing(true);
    window._tbBuildUntil=Date.now()+120000; // keep Firestore alive through sync write
    /* Result of the merge, reported through the store so the outcome is still
       waiting for you if the sync finished while you were on another tab. */
    let syncOk=false,syncNew=0;
    try{
      const r=await fetch(`${TB_API_BASE}/api/journal/sync?t=${Date.now()}`,{method:'POST',cache:'no-store'});
      const j=await r.json();
      console.log('[TradeBoard] journal/sync returned',Array.isArray(j.data)?j.data.length:0,'orders');
      if(j.ok&&Array.isArray(j.data)){

        setTrades(prev=>{
          /* Mutable map: entry id → entry (deep-copy legs so we can push) */
          const map=new Map(prev.map(t=>[t.id,{...t,legs:[...(t.legs||[])]}]));
          /* Dedup keys. Webull orders carry a _wbId; but worker IDs can drift
             between syncs, so we ALSO key every existing leg by a content
             fingerprint (ticker|action|minute|qty|price). A pull is skipped if
             EITHER its _wbId or its content already exists — this is what stops
             the every-sync re-duplication and pre-API orphan reappearance.
             Trade-off: two genuinely identical fills in the same minute (same
             qty+price+side) would collapse to one — vanishingly rare in practice. */
          const fpOf=(tk,l)=>{const p=n=>{const x=parseFloat(n);return isNaN(x)?0:x;};return (tk||'').toUpperCase()+'|'+(l.action||'')+'|'+String(l.datetime||'').slice(0,16)+'|'+p(l.qty)+'|'+p(l.price);};
          const absorbedWb=new Set();       /* 'wb:'+_wbId */
          const absorbedContent=new Set();  /* content fp of EVERY existing leg */
          map.forEach(entry=>{const tk=entry.ticker;(entry.legs||[]).forEach(l=>{if(l._wbId)absorbedWb.add('wb:'+l._wbId);absorbedContent.add(fpOf(tk,l));});});
          /* Find the most-recent OPEN entry for a ticker (buyQty > sellQty, not CLOSED) */
          const findOpenEntry=ticker=>{
            let best=null;
            map.forEach(entry=>{
              if((entry.ticker||'').toUpperCase()!==ticker.toUpperCase())return;
              const legs=entry.legs||[];
              const bq=legs.filter(l=>l.action==='BUY').reduce((s,l)=>s+(parseFloat(l.qty)||0),0);
              const sq=legs.filter(l=>l.action==='SELL').reduce((s,l)=>s+(parseFloat(l.qty)||0),0);
              if(bq>sq&&entry.status!=='CLOSED'){
                if(!best||(entry.createdAt||0)>(best.createdAt||0))best=entry;
              }
            });
            return best;
          };
          /* Process in chronological order so BUYs land before same-day SELLs */
          const wbTs=r=>r.filledAt||r.filledTime||r.tradeTime||r.orderTime||r.createTime||r.datetime||r.date||0;
          const sorted=[...j.data].sort((a,b)=>new Date(wbTs(a))-new Date(wbTs(b)));
          const toSave=new Map(); /* entry id → entry — collect all mutations, save once */


          sorted.forEach(raw=>{
            const wbId=String(raw.id||raw.orderId||raw.fillId||(raw.ticker+(raw.date||raw.datetime||raw.filledAt||'')));
            if(absorbedWb.has('wb:'+wbId))return;
            const action=(raw.side||raw.action||'BUY').toUpperCase();
            const ticker=(raw.ticker||raw.symbol||'').toUpperCase();
            /* ── Webull field aliases ─────────────────────────────────────────
               datetime: filledAt | filledTime | tradeTime | orderTime | createTime | date | datetime
               qty:      filled   | filledQty  | filledQuantity | leavesQuantity | qty
               price:    avgFilledPrice | avgFill | avgPrice | fillPrice | limitPrice | price
               fee:      totalCommission | commission | fee | charges
               ─────────────────────────────────────────────────────────────── */
            const rawDatetime=
              raw.date||raw.datetime||raw.filledAt||raw.filledTime||
              raw.tradeTime||raw.orderTime||raw.createTime||null;
            /* Webull timestamps can be epoch-ms numbers */
            const resolvedDatetime=rawDatetime
              ?( typeof rawDatetime==='number'
                  ? new Date(rawDatetime).toISOString()
                  : String(rawDatetime) )
              : new Date().toISOString();
            const rawQty=raw.qty??raw.filled??raw.filledQty??raw.filledQuantity??'';
            const rawPrice=raw.avgFill??raw.avgFilledPrice??raw.avgPrice??raw.price??raw.limitPrice??'';
            /* Webull API fee fields — covers all known variants from webull-api-client and custom workers:
               totalCommission (official), commission, fee, charges, secFee, tafFee,
               regulatory_fee, platform_fee, broker_fee, fees (object with .total),
               order_fee, trade_fee, transaction_fee */
            const rawFee=(()=>{
              /* commission confirmed as fee field; Webull is commission-free so =0.
               SEC/TAF regulatory fees are not included in this endpoint's data. */
            const candidates=[
                raw.commission,raw.totalCommission,raw.total_commission,
                raw.fee,raw.totalFee,raw.total_fee,
                raw.secFee,raw.tafFee,raw.commissionFee,
                raw.fees?.total??raw.fees,
                raw.charges,raw.brokerFee,raw.orderFee,
              ];
              for(const c of candidates){
                const n=parseFloat(c);
                if(c!==undefined&&c!==null&&c!==''&&!isNaN(n)&&n>0)return n;
              }
              return 0;
            })();

            const newLeg={
              id:tbUuid(),
              _wbId:wbId,
              action,
              datetime:tbToLocalDT(resolvedDatetime),
              qty:String(rawQty),
              price:String(rawPrice),
              fee:rawFee!==0?String(rawFee):'0',
            };
            absorbedWb.add('wb:'+wbId);
            /* Already present (any source / any prior sync)? Skip — no dup. */
            const _cfp=fpOf(ticker,newLeg);
            if(absorbedContent.has(_cfp))return;
            absorbedContent.add(_cfp);
            /* Position grouping: attach BOTH buys and sells to the current open
               position for this ticker. A position opens on the first buy while
               flat and stays open until cumulative SELL qty >= cumulative BUY qty.
               This lets scale-ins (extra buys) and scale-outs (partial sells)
               merge into ONE trade instead of fragmenting per order. */
            const open=findOpenEntry(ticker);
            if(open){
              open.legs=[...open.legs,newLeg];
              const bq=open.legs.filter(l=>l.action==='BUY').reduce((s,l)=>s+(parseFloat(l.qty)||0),0);
              const sq=open.legs.filter(l=>l.action==='SELL').reduce((s,l)=>s+(parseFloat(l.qty)||0),0);
              open.status=(bq>0&&sq>=bq)?'CLOSED':'OPEN';
              map.set(open.id,open);
              toSave.set(open.id,open);
              return;
            }
            /* No open position. A BUY opens a new one; a stray SELL with no
               matching long becomes its own closed entry. */
            const entryId=tbUuid();
            const entry={
              id:entryId,
              ticker,
              market:raw.market||raw.assetType||'STOCK',
              createdAt:new Date(resolvedDatetime).getTime()||Date.now(),
              source:'webull',
              legs:[newLeg],
              notes:'',
              status:action==='BUY'?'OPEN':'CLOSED',
            };
            map.set(entryId,entry);
            toSave.set(entryId,entry);
          });
          /* Reconcile the WHOLE journal: dedup + regroup all webull legs so the
             output is always clean, then atomically replace the Firebase doc so
             FB exactly matches local (drops any stale/duplicate docs from earlier
             broken syncs) and every device receives it in one snapshot. */
          const merged=[...map.values()];
          const {others,rebuilt}=tbReconcileWebull(merged);
          const finalTrades=[...others,...rebuilt].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
          const finalIds=new Set(finalTrades.map(t=>t.id));
          const staleIds=prev.map(t=>t.id).filter(id=>!finalIds.has(id));
          syncOk=true; syncNew=finalTrades.length-prev.length;
          if(window._fbReplaceTBTrades)window._fbReplaceTBTrades(staleIds,finalTrades);
          else if(window._fbSaveTBTradeBulk)window._fbSaveTBTradeBulk(finalTrades);
          return finalTrades;
        });
      }
    }catch(e){console.warn('TB Webull sync error (server may be offline)',e);S.note('Webull sync failed — server may be offline.');}
    /* Record sync timestamp in localStorage + Firebase so all devices know */
    const nowTs=Date.now();
    localStorage.setItem(TB_SYNC_TS_KEY,String(nowTs));
    window._tbLastSyncTs=nowTs; setLastSync(nowTs);
    if(window._fbSaveTBSyncMeta)window._fbSaveTBSyncMeta({lastWebullSync:nowTs});
    if(syncOk)S.note(syncNew>0?`Webull sync · ${syncNew} new trade${syncNew!==1?'s':''}`:'Webull sync · up to date');
    window._tbBuildUntil=0;
    window._tbSyncInFlight=false;
    setSyncing(false);
  },[]);

  /* Manual add — tagged source:'manual', saved to Firebase */
  const add=useCallback(async(fields)=>{
    const trade={...fields,id:fields.id||tbUuid(),createdAt:Date.now(),source:'manual'};
    setTrades(prev=>[trade,...prev]);
    if(window._fbSaveTBTrade)window._fbSaveTBTrade(trade);
    return{ok:true,data:trade};
  },[]);

  /* Edit — updates Firebase */
  const patch=useCallback(async(id,fields)=>{
    let updated=null;
    setTrades(prev=>prev.map(t=>{if(t.id!==id)return t;updated={...t,...fields,id};return updated;}));
    if(updated&&window._fbSaveTBTrade)window._fbSaveTBTrade(updated);
    return{ok:true,data:updated};
  },[]);

  /* Delete — removes from Firebase */
  const del=useCallback(async(id)=>{
    setTrades(prev=>prev.filter(t=>t.id!==id));
    if(window._fbDeleteTBTrade)window._fbDeleteTBTrade(id);
  },[]);

  /* Bulk delete — single state update so all IDs are removed atomically */
  const delBulk=useCallback(async(ids)=>{
    const idSet=new Set(ids);
    setTrades(prev=>prev.filter(t=>!idSet.has(t.id)));
    /* Fire all deletes in parallel */
    if(window._fbDeleteTBTrade)await Promise.all(ids.map(id=>window._fbDeleteTBTrade(id)));
  },[]);

  /* Re-merge: same reconciliation Webull Sync now runs — dedup + FIFO regroup of
     all webull legs. Manual/CSV trades untouched. Kept as a manual button for
     one-off cleanups, but routine syncs already self-heal. */
  const rebuild=useCallback(async()=>{
    if(S.busy)return{ok:false,busy:true};
    S.setBusy('remerge','Re-merging…');
    let removed=0,made=0,oldIds=[],rebuilt=[];
    try{
      setTrades(prev=>{
        const r=tbReconcileWebull(prev);
        rebuilt=r.rebuilt;oldIds=r.oldWebullIds;removed=oldIds.length;made=rebuilt.length;
        return [...r.others,...rebuilt].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
      });
      /* Persist atomically: one updateDoc drops stale webull docs AND writes the
         merged ones, so every device gets the cleaned journal in a single snapshot. */
      if(window._fbReplaceTBTrades){
        await window._fbReplaceTBTrades(oldIds,rebuilt);
      }else{
        if(window._fbDeleteTBTrade)await Promise.all(oldIds.map(id=>window._fbDeleteTBTrade(id)));
        if(window._fbSaveTBTradeBulk)await window._fbSaveTBTradeBulk(rebuilt);
      }
      S.note(`Re-merged into ${made} trade${made!==1?'s':''} (was ${removed})`);
      return{ok:true,removed,made};
    }catch(err){
      S.note('Re-merge error: '+(err&&err.message||'unknown'));
      return{ok:false,error:err};
    }finally{ S.setBusy(''); }
  },[]);

  /* Auto-sync: only runs on the "main" device (td6_mainDash==='tony') so phones
     never trigger an independent sync that races with desktop and causes dupes.
     Also exposes sync() at window level so the app-level morning orchestrator can
     kick a 6am Webull sync even while the Journal tab is open. */
  useEffect(()=>{
    window._tbJournalSync=sync;                      // let the morning orchestrator drive it
    if(localStorage.getItem('td6_mainDash')!=='tony')return; /* non-main: skip auto-sync */
    const doAutoSync=async()=>{
      try{
        const last=parseInt(localStorage.getItem(TB_SYNC_TS_KEY)||'0',10);
        const slot=tbLastMorningSlot();
        // Sync on the first Journal open each morning — EVERY calendar day, weekends
        // and holidays included (last sync predates today's 6am slot). The 24h
        // fallback only matters if the slot math ever returns 0. sync() records the
        // timestamp.
        if(slot ? last>=slot : (Date.now()-last<86400000)) return;
        await sync();
      }catch(e){console.warn('TB auto-sync failed',e);}
    };
    const tryOnce=()=>{if(!window._fbReady){window.addEventListener('fb-ready',tryOnce,{once:true});return;}doAutoSync();};
    tryOnce();
    /* No cleanup: sync() writes to the module-level store, not to this
       component, so it stays valid after the tab unmounts — and the morning
       orchestrator can keep driving it once the Journal tab has been opened. */
  },[sync]); // eslint-disable-line react-hooks/exhaustive-deps

  /* CSV import (Stonk Journal format) — dedup by ticker+date+entryPrice+qty */
  const importCSV=useCallback(async(csvText)=>{
    if(S.busy)return{ok:false,busy:true,error:'Another journal job is running'};
    S.setBusy('import','Importing…');
    try{ return await tbJournalImportCSV(csvText); }
    catch(err){ S.note('Import error: '+(err&&err.message||'unknown')); return{ok:false,error:err&&err.message}; }
    finally{ S.setBusy(''); }
  },[]);

  return{trades,loading,syncing,busy:S.busy,lastSync,load,sync,add,patch,del,delBulk,importCSV,rebuild};
}

/* CSV import (Stonk Journal format) — module level so a big import finishes even
   if you leave the Journal tab while it's running. Dedup by ticker+date+entryPrice+qty. */
async function tbJournalImportCSV(csvText){
  const S=_tbJournalStore;
  const setTrades=u=>S.set(u);
  /* ── parse ── */
  const parseMoney=s=>{if(!s)return 0;return parseFloat(String(s).replace(/[$,]/g,''))||0;};
  const lines=csvText.split('\n').map(l=>l.trim()).filter(Boolean);
  if(!lines.length)return{ok:false,error:'Empty file'};
  /* Parse CSV respecting quoted fields */
  const parseRow=line=>{const cols=[];let cur='',inQ=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){inQ=!inQ;}else if(c===','&&!inQ){cols.push(cur);cur='';}else cur+=c;}cols.push(cur);return cols;};
  const headers=parseRow(lines[0]).map(h=>h.trim().toLowerCase());
  const col=name=>{const i=headers.indexOf(name);return i>=0?i:-1;};
  const iDate=col('date'),iTime=col('time'),iSym=col('symbol'),iMkt=col('market');
  const iStatus=col('status'),iSide=col('side'),iQty=col('qty');
  const iEntry=col('entry'),iExit=col('exit'),iEntTot=col('ent tot'),iExtTot=col('ext tot');
  const iHold=col('hold'),iReturn=col('return'),iTags=col('tags'),iNotes=col('notes');

  const newEntries=[];
  for(let i=1;i<lines.length;i++){
    const row=parseRow(lines[i]);
    const g=idx=>idx>=0?(row[idx]||'').trim():'';
    const dateStr=g(iDate); /* M/D/YYYY — this is the SELL/close date in Stonk Journal */
    const timeStr=g(iTime)||'09:30';
    const symbol=(g(iSym)||'').toUpperCase();
    const market=g(iMkt)||'STOCK';
    const status=(g(iStatus)||'').toUpperCase(); /* WIN|LOSS */
    const side=(g(iSide)||'LONG').toUpperCase();
    const qty=parseFloat(g(iQty))||0;
    const entryPrice=parseMoney(g(iEntry));
    const exitPrice=parseMoney(g(iExit));
    const entTot=parseMoney(g(iEntTot))||entryPrice*qty;
    const extTot=parseMoney(g(iExtTot))||exitPrice*qty;
    const holdStr=g(iHold); /* "6 DAYS", "15 MIN", "1 DAY" etc */
    const netPnL=parseMoney(g(iReturn));
    const tags=g(iTags)?g(iTags).split(',').map(t=>t.trim()).filter(Boolean):[];
    const notes=g(iNotes)||'';
    if(!symbol||!dateStr)continue;

    /* CSV Date+Time = SELL date. Parse it first, then subtract hold to get buy date. */
    const parseHoldMs=h=>{if(!h||h==='-')return 0;const m=h.match(/(\d+)\s*(MIN|HR|DAY|DAYS|WEEK|WEEKS)/i);if(!m)return 0;const n=parseInt(m[1]);const u=(m[2]||'').toUpperCase();if(u==='MIN')return n*60000;if(u==='HR')return n*3600000;if(u==='DAY'||u==='DAYS')return n*86400000;if(u==='WEEK'||u==='WEEKS')return n*7*86400000;return 0;};
    const [mm,dd,yyyy]=(dateStr.split('/')||[]);
    const sellDT=yyyy?`${yyyy}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}T${timeStr}`:'';
    const sellMs=sellDT?new Date(sellDT).getTime():0;
    const holdMs=parseHoldMs(holdStr);
    /* Buy date = sell date minus hold duration. If no hold info, use same date. */
    const buyMs=sellMs&&holdMs?sellMs-holdMs:sellMs;
    const buyDT=buyMs?tbToLocalDT(buyMs):(sellDT||'');

    const buyLeg={id:tbUuid(),_csvImport:true,action:'BUY',datetime:buyDT,qty:String(qty),price:String(entryPrice),fee:'0'};
    const legs=[buyLeg];
    /* Always add SELL leg if we have an exit price */
    if(exitPrice>0){
      const sellLeg={id:tbUuid(),_csvImport:true,action:'SELL',datetime:sellDT,qty:String(qty),price:String(exitPrice),fee:'0'};
      legs.push(sellLeg);
    }
    const entryId=tbUuid();
    newEntries.push({
      id:entryId,
      ticker:symbol,
      market,
      createdAt:buyMs||Date.now(),
      source:'csv',
      legs,
      status:exitPrice>0?'CLOSED':'OPEN',
      netPnL:netPnL!==0?netPnL:null, /* use Stonk Journal's computed P&L */
      setupType:'',
      tags,
      notes,
      direction:side==='SHORT'?'SHORT':'LONG',
    });
  }
  if(!newEntries.length){S.note('No new trades (all duplicates)');return{ok:true,added:0,skipped:lines.length-1};}
  setTrades(prev=>[...newEntries,...prev].sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)));
  if(window._fbSaveTBTradeBulk)await window._fbSaveTBTradeBulk(newEntries);
  else if(window._fbSaveTBTrade)newEntries.forEach(e=>window._fbSaveTBTrade(e));
  S.note(`Imported ${newEntries.length} trade${newEntries.length!==1?'s':''}`);
  return{ok:true,added:newEntries.length,skipped:0};
}

function tbUuid(){return([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16));}

/* ── Group a flat, chronologically-sorted leg list for ONE ticker into position
   entries. A position opens on the first leg while flat and closes once cumulative
   SELL qty >= cumulative BUY qty (bq>0). Scale-ins/scale-outs stay in one entry.
   Original leg objects are reused so _wbId dedup keys survive a rebuild. ── */
function tbGroupLegsIntoPositions(ticker,legs,meta){
  const p=n=>{const x=parseFloat(n);return isNaN(x)?0:x;};
  const out=[];let cur=null,bq=0,sq=0;
  legs.forEach(leg=>{
    if(!cur){cur={id:tbUuid(),ticker,market:(meta&&meta.market)||'STOCK',createdAt:new Date(leg.datetime).getTime()||Date.now(),source:'webull',legs:[],notes:'',status:'OPEN'};bq=0;sq=0;}
    cur.legs.push(leg);
    if(leg.action==='SELL')sq+=p(leg.qty);else bq+=p(leg.qty);
    if(bq>0&&sq>=bq){cur.status='CLOSED';out.push(cur);cur=null;}
  });
  if(cur){cur.status='OPEN';out.push(cur);}
  return out;
}

/* ── Reconcile an entire trade list: leave manual/CSV trades alone; take ALL
   webull legs, dedup them (by _wbId, else content fingerprint), and regroup
   per ticker into clean FIFO positions. Returns the clean webull entries, the
   untouched others, and the ids of the old webull entries that were replaced.
   Used by BOTH Webull Sync and Re-merge so they always produce identical,
   duplicate-free output. ── */
function tbReconcileWebull(trades){
  const webull=trades.filter(t=>t.source==='webull');
  const others=trades.filter(t=>t.source!=='webull');
  const byTicker=new Map();const seen=new Set();
  webull.forEach(t=>{
    const tk=(t.ticker||'').toUpperCase();
    if(!byTicker.has(tk))byTicker.set(tk,{market:t.market||'STOCK',legs:[]});
    (t.legs||[]).forEach(l=>{
      const p=n=>{const x=parseFloat(n);return isNaN(x)?0:x;};
      const k=l._wbId?('wb:'+l._wbId):(tk+'|'+(l.action||'')+'|'+String(l.datetime||'').slice(0,16)+'|'+p(l.qty)+'|'+p(l.price));
      if(seen.has(k))return;seen.add(k);
      byTicker.get(tk).legs.push(l);
    });
  });
  const rebuilt=[];
  byTicker.forEach((v,tk)=>{
    const sorted=[...v.legs].sort((a,b)=>new Date(a.datetime)-new Date(b.datetime));
    tbGroupLegsIntoPositions(tk,sorted,{market:v.market}).forEach(e=>rebuilt.push(e));
  });
  return {others,rebuilt,oldWebullIds:webull.map(t=>t.id)};
}

/* ── Trade stats computer ── */
/* ── Normalize any datetime value → 'YYYY-MM-DDThh:mm' for datetime-local inputs ── */
function tbToLocalDT(raw){
  if(!raw)return '';
  const d=typeof raw==='number'?new Date(raw):new Date(raw);
  if(isNaN(d.getTime()))return typeof raw==='string'?raw.slice(0,16):'';
  // Format in local time (not UTC) so datetime-local input shows correctly
  const pad=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());
}

function tbComputeTradeStats(entry){
  const legs=entry.legs||[];
  const p=n=>{const x=parseFloat(n);return isNaN(x)?0:x;};
  if(!legs.length){
    const side=(entry.side||'BUY').toUpperCase();const qty=p(entry.qty);const avgFill=p(entry.avgFill);const gross=qty*avgFill;const isSell=side==='SELL';
    const status=entry.status||(isSell?'CLOSED':'OPEN');const netPnL=entry.netPnL!=null?entry.netPnL:null;
    return{status,entryTotal:isSell?0:gross,exitTotal:isSell?gross:0,avgEntry:isSell?0:avgFill,avgExit:isSell?avgFill:0,netPnL,pnlPct:null,holdTime:null,buyQty:isSell?0:qty};
  }
  const buys=legs.filter(l=>l.action==='BUY');const sells=legs.filter(l=>l.action==='SELL');
  const totalFees=legs.reduce((s,l)=>s+p(l.fee),0);
  const entryTotal=buys.reduce((s,l)=>s+p(l.price)*p(l.qty),0);const exitTotal=sells.reduce((s,l)=>s+p(l.price)*p(l.qty),0);
  const buyQty=buys.reduce((s,l)=>s+p(l.qty),0);const sellQty=sells.reduce((s,l)=>s+p(l.qty),0);
  const avgEntry=buyQty?entryTotal/buyQty:0;const avgExit=sellQty?exitTotal/sellQty:0;
  const hasExit=sells.length>0;const rawPnL=hasExit?exitTotal-entryTotal:null;
  const netPnL=entry.netPnL!=null?parseFloat(entry.netPnL):(rawPnL!=null?rawPnL-totalFees:null);
  const costBasis=entryTotal+totalFees;
  const pnlPct=costBasis>0&&netPnL!=null?(netPnL/costBasis)*100:null;
  let holdTime=null;
  const bd=buys.map(l=>new Date(l.datetime)).filter(d=>!isNaN(d.getTime()));
  const sd=sells.map(l=>new Date(l.datetime)).filter(d=>!isNaN(d.getTime()));
  if(bd.length&&sd.length){const diff=Math.max(...sd)-Math.min(...bd);const mins=Math.floor(diff/60000);holdTime=mins<60?`${mins} MIN`:mins<1440?`${Math.round(mins/60)} HR`:`${Math.round(mins/1440)} DAYS`;}
  const status=entry.status||(hasExit?'CLOSED':'OPEN');
  return{status,entryTotal,exitTotal,avgEntry,avgExit,netPnL,pnlPct,holdTime,buyQty,totalFees};
}

/* ── Portfolio store (Webull, Cloudflare) ────────────────────────────────────
   Module-level so the portfolio survives tab switches (component remounts) and
   is NOT re-fetched every time the tab is reopened. The IN-FLIGHT state lives
   here too: the retry loop below can run for several seconds, and it used to be
   driven by a component ref + component state, so leaving the tab mid-refresh
   lost the spinner and let a second refresh start on top of the first. Fetches
   once per page load; after that, revisiting the tab shows the last data. Manual
   Refresh (and a hard page reload) still pull fresh. */
let _tbPortfolioCache={data:null,lastFetch:null,error:null,fetched:false,loading:false,inFlight:null,
  listeners:new Set(),
  sub(fn){this.listeners.add(fn);return()=>this.listeners.delete(fn);},
  emit(){this.listeners.forEach(fn=>{try{fn();}catch(e){}});},
};
/* The refresh itself — module level, so it runs to completion (and lands in the
   cache above) no matter which tab you are looking at while it does. */
function tbRefreshPortfolio(opts){
  const C=_tbPortfolioCache;
  if(C.inFlight)return C.inFlight;          // guard: no concurrent fetches — join the running one
  C.loading=true; C.error=null; _tbJobs.set('portfolio','Refreshing…'); C.emit();
  C.inFlight=(async()=>{
    // Retry transient failures automatically so a single flaky response (Cloudflare
    // Worker cold-start 5xx, a 429, or a dropped connection) no longer surfaces an
    // "HTTP error" that forces a second manual Refresh. Only a real worker-level
    // rejection (j.ok===false, e.g. token missing) stops early — that's not transient.
    const MAX=(opts&&opts.tries)||4;
    let ok=false,lastErr='Cannot reach Webull API.';
    for(let attempt=0;attempt<MAX&&!ok;attempt++){
      try{
        const r=await fetch(`${TB_API_BASE}/api/portfolio/summary`,{cache:'no-store'});
        if(!r.ok){
          lastErr=`HTTP ${r.status}`;
          if((r.status>=500||r.status===429||r.status===408)&&attempt<MAX-1){await new Promise(res=>setTimeout(res,600*(attempt+1)));continue;}
          break; // 4xx (other than 408/429) is not going to fix itself on retry
        }
        const j=await r.json();
        if(j.ok){C.data=j.data;C.lastFetch=new Date();C.error=null;ok=true;break;}
        lastErr=j.error||'Portfolio error';break; // worker replied but rejected — not retryable
      }catch(e){
        lastErr=e.message||lastErr; // network drop / JSON parse fail → transient
        if(attempt<MAX-1){await new Promise(res=>setTimeout(res,600*(attempt+1)));continue;}
      }
    }
    if(ok){C.error=null;if(window._tbSetPortfolioOk)window._tbSetPortfolioOk(true);}
    else{C.error=lastErr;if(window._tbSetPortfolioOk)window._tbSetPortfolioOk(false);}
    C.loading=false;C.fetched=true;C.inFlight=null;
    _tbJobs.set('portfolio','');
    C.emit();
    return ok;
  })();
  return C.inFlight;
}
function useTBPortfolio(){
  const C=_tbPortfolioCache;
  const [,force]=useState(0);
  useEffect(()=>C.sub(()=>force(v=>v+1)),[]);
  const refresh=useCallback(opts=>tbRefreshPortfolio(opts),[]);
  // Fetch ONCE per page load. On later tab revisits we already have cached data,
  // so we just show it — no auto-refresh, no polling interval.
  useEffect(()=>{
    if(!C.fetched&&!C.inFlight)tbRefreshPortfolio();
  },[]); // eslint-disable-line react-hooks/exhaustive-deps
  // The app-level morning orchestrator pre-loads the portfolio into the shared cache
  // at 6am; reflect that here so an already-open Portfolio tab updates live.
  useEffect(()=>{
    const onRefreshed=()=>C.emit();
    window.addEventListener('tb-portfolio-refreshed',onRefreshed);
    return()=>window.removeEventListener('tb-portfolio-refreshed',onRefreshed);
  },[]);
  return{data:C.data,loading:C.loading,error:C.error,lastFetch:C.lastFetch,refresh};
}

/* ── Journal stats bar ── */
function TBJournalStats({trades,activeFilter,onFilterChange}){
  const s=useMemo(()=>{
    let wins=0,losses=0,open=0,wash=0,totalPnL=0,winSum=0,lossSum=0;
    trades.forEach(t=>{const st=tbComputeTradeStats(t);if(st.status==='OPEN'){open++;return;}if(st.netPnL==null)return;totalPnL+=st.netPnL;if(st.netPnL>0){wins++;winSum+=st.netPnL;}else if(st.netPnL<0){losses++;lossSum+=st.netPnL;}else wash++;});
    const total=wins+losses;
    return{wins,losses,open,wash,totalPnL,avgWin:wins?winSum/wins:0,avgLoss:losses?lossSum/losses:0,winRate:total?Math.round(wins/total*100):0};
  },[trades]);
  const C=({label,val,sub,col,fk})=>{const active=fk&&activeFilter===fk;return(<div onClick={fk?()=>onFilterChange&&onFilterChange(active?'ALL':fk):undefined} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:2,padding:'10px 18px',background:'transparent',borderRadius:10,border:active?'1px solid var(--ac)':'1px solid var(--bd)',minWidth:72,cursor:fk?'pointer':'default',transition:'all .15s'}}>
    <div style={{fontSize:11,color:active?'var(--ac)':'var(--txm)',fontWeight:800,textTransform:'uppercase',letterSpacing:1}}>{label}</div>
    <div style={{fontFamily:'IBM Plex Mono,monospace',fontSize:20,fontWeight:800,color:col||'var(--tx)'}}>{val}</div>
    {sub&&<div style={{fontSize:10,color:'var(--txm)'}}>{sub}</div>}
  </div>);};
  return(<div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
    <C label="Wins" val={s.wins} col="var(--tbb)" sub={`${s.winRate}%`} fk="WIN"/>
    <C label="Losses" val={s.losses} col="var(--tbr)" sub={s.losses?`${100-s.winRate}%`:'0%'} fk="LOSS"/>
    <C label="Open" val={s.open} col="var(--tbw)" fk="OPEN"/>
    <C label="Wash" val={s.wash} col="var(--txm)" fk="WASH"/>
    <C label="Avg W" val={s.avgWin?tbFmt$(s.avgWin):'—'} col="var(--tbb)"/>
    <C label="Avg L" val={s.avgLoss?tbFmt$(s.avgLoss):'—'} col="var(--tbr)"/>
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:2,padding:'10px 22px',background:(s.wins+s.losses)===0?'var(--s2)':s.totalPnL>0?'rgba(164,185,134,0.08)':s.totalPnL<0?'rgba(214,138,124,0.08)':'var(--s2)',borderRadius:10,border:`1px solid ${(s.wins+s.losses)===0?'var(--bd)':s.totalPnL>0?'rgba(164,185,134,0.25)':s.totalPnL<0?'rgba(214,138,124,0.25)':'var(--bd)'}`,minWidth:80}}>
      <div style={{fontSize:10,color:'var(--txm)',fontWeight:700,textTransform:'uppercase',letterSpacing:1}}>Net P&L</div>
      <div style={{fontFamily:'IBM Plex Mono,monospace',fontSize:18,fontWeight:800,color:(s.wins+s.losses)===0?'var(--txm)':tbPnlCol(s.totalPnL)}}>{(s.wins+s.losses)===0?'—':tbFmt$(s.totalPnL)}</div>
    </div>
  </div>);
}
