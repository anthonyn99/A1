    const dx=e.clientX-ds.startX,dy=e.clientY-ds.startY;
    if(!ds.moved&&(dx*dx+dy*dy)<49)return; // ~7px threshold before it's a drag
    ds.moved=true;if(dragIdx!==ds.from)setDragIdx(ds.from);
    let target=ds.from;
    for(let j=0;j<chipRefs.current.length;j++){
      const el=chipRefs.current[j];if(!el)continue;
      const r=el.getBoundingClientRect();
      if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom){target=j;break;}
    }
    if(target!==overIdx)setOverIdx(target);
  };
  const onChipUp=(e)=>{
    const ds=dragState.current;dragState.current=null;
    try{e.currentTarget.releasePointerCapture(ds&&ds.pointerId);}catch(_){}
    if(ds&&ds.moved){
      const from=ds.from,to=(overIdx>=0?overIdx:from);
      if(from!==to){
        const curId=(prompts[selected]||{}).id;
        const next=arrMove(prompts,from,to);
        onSave(next);if(window._fbSaveTBPrompts)window._fbSaveTBPrompts(next);
        const ni=next.findIndex(p=>p.id===curId);setSelected(ni>=0?ni:to);
      }
    }else if(ds){ setSelected(ds.from);setEditing(false);setAddingNew(false); }
    setDragIdx(-1);setOverIdx(-1);
  };
  const onChipCancel=()=>{dragState.current=null;setDragIdx(-1);setOverIdx(-1);};

  return(<div className="tb-fade-in tb-prompt-wrap tb-card" style={{display:'flex',flexDirection:'column',gap:16,padding:'clamp(16px,4vw,24px)',maxWidth:900,margin:'0 auto',width:'100%',boxSizing:'border-box'}}>
    <div style={{display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
      <div style={{flex:1}}><div style={{fontSize:20,fontWeight:800,color:'var(--tx)'}}>Prompts</div><div style={{fontSize:13,color:'var(--txm)'}}>{prompts.length} prompt{prompts.length!==1?'s':''} · used by Analysis &amp; TradeBoard</div></div>
      {fbSaving&&<span style={{fontSize:13,color:'var(--txm)',display:'inline-flex',alignItems:'center',gap:6}}><TBIcon n="refresh"/> Saving…</span>}
    </div>
    {/* Chips row: drag to reorder (mouse + touch), tap to select */}
    <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
      {prompts.map((p,i)=>{
        const isSel=i===selected,isDrag=i===dragIdx,isOver=i===overIdx&&dragIdx!==-1&&overIdx!==dragIdx;
        return(<button key={p.id||i}
          ref={el=>chipRefs.current[i]=el}
          onPointerDown={e=>onChipDown(i,e)} onPointerMove={onChipMove} onPointerUp={onChipUp} onPointerCancel={onChipCancel}
          style={{display:'inline-flex',alignItems:'center',gap:7,padding:'7px 16px',borderRadius:100,
            border:`1.5px solid ${(isOver||isSel)?'var(--ac)':'var(--bd)'}`,
            background:'transparent',
            color:isSel?'var(--ac)':'var(--tx)',fontSize:14,fontWeight:700,cursor:'grab',
            opacity:isDrag?0.45:1,transition:'opacity .12s,border-color .15s,box-shadow .15s',
            /* Selected and drop-target both read as a glow on the outline — the
               pill itself is never filled in. */
            boxShadow:isOver?'0 0 0 3px rgba(224,184,116,0.18)':isSel?'var(--gold-glow)':'none',
            touchAction:'none',userSelect:'none'}}>
          {p.name}
        </button>);
      })}
    </div>
    {/* New prompt — always on its own stable row */}
    {addingNew
      ?<div style={{display:'flex',gap:6,alignItems:'center'}}>
          <input autoFocus value={newName} onChange={e=>setNewName(e.target.value)}
            onKeyDown={e=>{if(e.key==='Enter')addPrompt();if(e.key==='Escape'){setAddingNew(false);setNewName('');}}}
            placeholder="Prompt name…"
            style={{background:'var(--s2)',border:'1.5px solid var(--ac)',borderRadius:8,color:'var(--tx)',fontSize:14,padding:'7px 12px',outline:'none',width:180}}/>
          <button className="tb-btn-primary" onClick={addPrompt} style={{fontSize:13,padding:'7px 14px'}}>Add</button>
          <button className="tb-btn-ghost" onClick={()=>{setAddingNew(false);setNewName('');}} style={{fontSize:13,padding:'7px 14px'}}><TBIcon n="x"/></button>
        </div>
      :<button onClick={()=>setAddingNew(true)} style={{padding:'7px 18px',borderRadius:100,border:'1.5px solid var(--ac)',background:'transparent',color:'var(--ac)',fontSize:13,fontWeight:700,cursor:'pointer',transition:'all .15s',width:'fit-content'}} onMouseEnter={e=>e.currentTarget.style.boxShadow='var(--gold-glow)'} onMouseLeave={e=>e.currentTarget.style.boxShadow='none'}>＋ New Prompt</button>
    }
    <div className="tb-card" style={{padding:0,overflow:'hidden'}}>
      <div style={{display:'flex',alignItems:'center',padding:'12px 18px',borderBottom:'1px solid var(--bd)',gap:10}}>
        {editing
          ?<input value={editName} onChange={e=>setEditName(e.target.value)} style={{fontFamily:'var(--font-accent)',fontSize:15,fontWeight:700,color:'var(--tx)',background:'transparent',border:'none',outline:'none',flex:1}}/>
          :<div style={{fontFamily:'var(--font-accent)',fontSize:15,fontWeight:700,color:'var(--tx)',flex:1}}>{cur?.name}</div>}
        <div style={{display:'flex',gap:8,flexShrink:0,flexWrap:'wrap'}}>
          {editing?(<><button className="tb-btn-primary" onClick={saveEdit} style={{fontSize:13}}>Save</button><button className="tb-btn-ghost" style={{fontSize:13}} onClick={()=>{setEditing(false);setEditText(cur.text);setEditName(cur.name);}} style={{fontSize:11}}>Cancel</button></>):(<><button className="tb-btn-ghost" onClick={copy} style={{fontSize:13}}>{copied?'✓ Copied!':'Copy'}</button><button className="tb-btn-ghost" onClick={()=>setEditing(true)} style={{fontSize:13}}>Edit</button>{prompts.length>1&&<button className="tb-btn-danger" onClick={deletePrompt} style={{fontSize:13}}>Delete</button>}</>)}
        </div>
      </div>
      {delConfirm&&ReactDOM.createPortal(
        <div onClick={()=>setDelConfirm(false)} style={{position:'fixed',inset:0,zIndex:22000,background:'rgba(0,0,0,0.6)',display:'flex',alignItems:'center',justifyContent:'center'}}>
          <div onClick={e=>e.stopPropagation()} style={{background:'var(--s1)',border:'1px solid var(--bdl)',borderRadius:14,padding:'28px 32px',maxWidth:380,width:'90%',boxShadow:'0 24px 60px rgba(0,0,0,0.5)'}}>
            <div style={{fontFamily:'Manrope,system-ui,sans-serif',fontSize:16,fontWeight:700,color:'var(--tbe)',marginBottom:10}}>Delete Prompt?</div>
            <div style={{fontSize:15,color:'var(--txd)',marginBottom:20,lineHeight:1.7}}>Delete <strong style={{color:'var(--tx)'}}>{prompts[selected]?.name}</strong>? This cannot be undone.</div>
            <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
              <button className="tb-btn-ghost" onClick={()=>setDelConfirm(false)} style={{fontSize:12}}>Cancel</button>
              <button className="tb-btn-danger" onClick={confirmDelete} style={{fontSize:12}}>Delete</button>
            </div>
          </div>
        </div>
      ,document.getElementById('tradeboard-root')||document.body)}
      <div ref={promptAreaH} style={{position:'relative',background:'var(--s2)'}}>
        {editing
          ?<textarea value={editText} onChange={e=>setEditText(e.target.value)} style={{width:'100%',display:'block',minHeight:240,maxHeight:500,overflowY:'auto',WebkitOverflowScrolling:'touch',background:'var(--s2)',border:'none',color:'var(--tx)',fontFamily:"'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif",fontSize:15,lineHeight:1.8,letterSpacing:'0.1px',padding:'20px 50px 20px 20px',outline:'none',resize:'none'}} autoFocus/>
          :<div className="tb-pb-doc tb-prompt-render" dangerouslySetInnerHTML={{__html:tbSanitizeHtml(tbMdToHtml(cur?.text||''),{dropColor:true})}} style={{wordBreak:'break-word',padding:'20px 50px 20px 20px',background:'var(--s2)',boxSizing:'border-box',minHeight:80,maxHeight:500,overflowY:'auto',WebkitOverflowScrolling:'touch'}}/>}
        <div ref={resize} style={{position:'absolute',bottom:0,right:0,width:40,height:40,cursor:'ns-resize',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--txm)',borderRadius:'0 0 12px 0',userSelect:'none',zIndex:2,touchAction:'none',transition:'color .15s,background .15s'}} onMouseEnter={e=>{e.currentTarget.style.color='var(--ac)';e.currentTarget.style.background='rgba(224,184,116,0.12)';}} onMouseLeave={e=>{e.currentTarget.style.color='var(--txm)';e.currentTarget.style.background='transparent';}}>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M15 1L1 15M15 8L8 15M15 15" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>
        </div>
      </div>
    </div>

  </div>);
}

/* ════════════════════════════════════════════════════════════════════════════
   trade-dashboard Cloudflare Worker. Support endpoints only now that MacroBoard
   is gone: /watchlist + /calendar (Catalysts), /analysis-config and
   /daily-reminder (both read by Trading Auto Launch).
   ════════════════════════════════════════════════════════════════════════════ */
const TD_WORKER_URL = "https://trade-dashboard.av1.workers.dev";
/* ── Shared prompt picker ──────────────────────────────────────────────────
   Prompts are owned solely by the Prompts tab. Analysis just PICKS which one
   to use. This chip row renders the Prompts-tab list and reports
   the chosen prompt id back up. No CRUD here — edit prompts in the Prompts tab. */
function TBPromptSelect({prompts,value,onChange,onGoToPrompts,onQuickLaunch}){
  /* Two gestures on one chip:
       one tap  → make this the ★ favourite (the prompt Launch Analysis sends)
       two taps → send THIS prompt on its own, right now.
     The favourite commit is held for TB_DBL_MS so a double tap doesn't also
     re-point the star, but the launch itself runs inside the second tap's own
     handler — window.open is only allowed inside the user gesture, never from a
     timer. Plain click events on purpose: a finger double-tap and a mouse
     double-click then take the identical path (touchAction:'manipulation' below
     kills the double-tap-to-zoom that would otherwise eat the second tap). */
  const TB_DBL_MS=380;
  const tap=React.useRef({id:null,at:0,timer:null});
  const [pending,setPending]=React.useState(null);
  React.useEffect(()=>()=>{if(tap.current.timer)clearTimeout(tap.current.timer);},[]);
  const clearTap=()=>{if(tap.current.timer){clearTimeout(tap.current.timer);tap.current.timer=null;}tap.current.id=null;setPending(null);};
  const onChipTap=(p)=>{
    const now=Date.now();
    if(tap.current.id===p.id&&(now-tap.current.at)<TB_DBL_MS){
      clearTap();
      if(onQuickLaunch)onQuickLaunch(p);
      return;
    }
    if(tap.current.timer)clearTimeout(tap.current.timer);
    tap.current.id=p.id;tap.current.at=now;
    setPending(p.id);   // light the outline immediately, commit the star late
    tap.current.timer=setTimeout(()=>{tap.current.timer=null;tap.current.id=null;setPending(null);onChange(p.id);},TB_DBL_MS);
  };
  const setFav=(p)=>{clearTap();onChange(p.id);};

  if(!prompts||prompts.length===0){
    return <div style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",borderRadius:9,border:"1px dashed var(--bd)",background:"var(--bgc)",color:"var(--txm)",fontSize:13}}>
      <span>No prompts yet.</span>
      {onGoToPrompts&&<button onClick={onGoToPrompts} style={{padding:"5px 12px",borderRadius:100,border:"1px solid var(--ac)",background:"transparent",color:"var(--ac)",fontSize:12,fontWeight:700,cursor:"pointer"}}>Open Prompts tab →</button>}
    </div>;
  }
  const effective=prompts.some(p=>p.id===value)?value:prompts[0]?.id;
  return <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
    {prompts.map(p=>{
      const on=p.id===effective;
      /* While a tap is pending the outline previews that chip; the ★ stays put
         until the tap commits, so a double-tap leaves the favourite untouched. */
      const lit=pending?p.id===pending:on;
      return(
      <span key={p.id} role="button" tabIndex={0}
        title={(onQuickLaunch?"Double-click to send this prompt now · ":"")+p.name}
        onClick={()=>onChipTap(p)}
        onKeyDown={e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();setFav(p);}}}
        style={{display:"inline-flex",alignItems:"center",borderRadius:100,
          border:`1.5px solid ${lit?"var(--ac)":"var(--bd)"}`,background:"transparent",
          boxShadow:lit?"0 0 8px rgba(224,184,116,0.34),0 0 0 1px rgba(224,184,116,0.14)":"none",
          cursor:"pointer",transition:"border-color .15s,box-shadow .15s,color .15s",maxWidth:250,
          touchAction:"manipulation",userSelect:"none",WebkitTapHighlightColor:"transparent",outline:"none"}}>
        {/* ★ = the prompt Launch Analysis (and the morning deploy) sends. Its own
            hit target, big enough for a fingertip, and it commits immediately. */}
        <span className={"tb-star-hit"+(on?" tb-star-on":"")} role="button" tabIndex={0}
          aria-label={"Use "+p.name+" for Launch Analysis"} title={"Use "+p.name+" for Launch Analysis"}
          onClick={e=>{e.stopPropagation();setFav(p);}}
          onKeyDown={e=>{if(e.key==="Enter"||e.key===" "){e.stopPropagation();e.preventDefault();setFav(p);}}}
          style={{display:"inline-flex",alignItems:"center",justifyContent:"center",flexShrink:0,
            marginLeft:3,borderRadius:100,color:on?"var(--ac)":"var(--txm)",cursor:"pointer",
            touchAction:"manipulation",transition:"color .15s"}}>
          <TBIcon n="star" size={13}/>
        </span>
        <span style={{padding:"6px 15px 6px 3px",color:lit?"var(--acs)":"var(--txd)",fontSize:13,fontWeight:700,
          whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{p.name}</span>
      </span>);})}
    {onGoToPrompts&&<button onClick={onGoToPrompts} title="Manage prompts" style={{padding:"6px 12px",borderRadius:100,border:"1px solid var(--bd)",background:"transparent",color:"var(--txm)",fontSize:12,fontWeight:700,cursor:"pointer",display:"inline-flex",alignItems:"center",gap:6}}><TBIcon n="pencil" size={12}/>Edit in Prompts</button>}
  </div>;
}

/* ════════════════════════════════════════════════════════════════════════════
   PER-TAB LOCK — React layer. Gates an individual tab's content behind the same
   password system (worker KV + Firebase + localStorage) used for the whole app.
   window._tbTabLock (defined in the applock script) does the actual work.
   ════════════════════════════════════════════════════════════════════════════ */
function useTabLockVersion(){
  const [,setV]=useState(0);
  useEffect(()=>{
    if(!window._tbTabLock) return;
    const off=window._tbTabLock.onChange(()=>setV(v=>v+1));
    return off;
  },[]);
}

/* Clean per-tab lock icons — shield-with-keyhole, distinct from the app padlock.
   Locked = filled shield + keyhole; Unlocked = outline shield with a tiny dash. */
function TBTabLockIcon({locked,size=15}){
  if(locked){
    return <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor" stroke="none">
      <path d="M12 2l7 3v6c0 4.4-3 8.3-7 9.5C8 19.3 5 15.4 5 11V5l7-3z"/>
      <circle cx="12" cy="11" r="1.7" fill="var(--bg)"/>
      <rect x="11.2" y="11.6" width="1.6" height="3.4" rx="0.8" fill="var(--bg)"/>
    </svg>;
  }
  return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
    <path d="M12 2l7 3v6c0 4.4-3 8.3-7 9.5C8 19.3 5 15.4 5 11V5l7-3z"/>
    <path d="M9.5 11.5h5"/>
  </svg>;
}

function TBTabLockPrompt({tabId,tabLabel,onUnlocked}){
  const [pw,setPw]=useState('');
  const [err,setErr]=useState('');
  const [busy,setBusy]=useState(false);
  const [hintMsg,setHintMsg]=useState('');
  // Biometrics: primary unlock when registered on this device; password stays as fallback.
  const [bioReady,setBioReady]=useState(false);
  // Password stays visible whether or not biometrics are registered — the OS
  // prompt only fires when the biometric button below is pressed.
  const [showPw,setShowPw]=useState(true);
  useEffect(()=>{
    let alive=true;
    if(window.Bio && window.Bio.isRegistered('tradehub-tab',tabId)){
      window.Bio.available().then(a=>{ if(alive&&a) setBioReady(true); });
    }
    return ()=>{alive=false;};
  },[tabId]);
  const bioUnlock=async()=>{
    setErr('');
    const r=await window.Bio.authenticate('tradehub-tab',tabId);
    if(r.ok){ window._tbTabLock.markUnlocked(tabId); onUnlocked(); }
    else if(r.error==='notregistered'){ setShowPw(true); setBioReady(false); }
    else { setErr('Biometric check failed — use your password.'); setShowPw(true); }
  };
  const submit=async()=>{
    const p=pw.trim(); if(!p){setErr('Password required.');return;}
    setBusy(true);setErr('');
    try{
      const d=await window._tbTabLock.verify(tabId,p);
      console.log('[TabLock] verify response for', tabId, ':', JSON.stringify(d));
      const ok = d && (d.ok===true || d.valid===true || d.success===true || d.match===true);
      console.log('[TabLock] verify ok?', ok);
      if(ok){
        window._tbTabLock.markUnlocked(tabId);
        console.log('[TabLock] after markUnlocked → mustBlock?', window._tbTabLock.mustBlock(tabId), '| isUnlocked?', window._tbTabLock.isUnlocked(tabId));
        onUnlocked();
      }
      else setErr(d&&d.error?('Error: '+d.error):'Wrong password.');
    }catch(e){ console.error('[TabLock] verify threw', e); setErr('Network error.'); }
    setBusy(false);
  };
  const forgot=async()=>{
    setHintMsg('Sending…');
    try{ const r=await window._tbTabLock.sendHint(tabId,tabLabel);
      setHintMsg(r.noLock?'No lock on server.':r.sent?'Hint sent to your email!':'Failed — try again.');
    }catch(e){ setHintMsg('Failed — try again.'); }
  };
  const [resetMsg,setResetMsg]=useState('');
  const reset=async()=>{
    setResetMsg('Sending code…');
    try{ const ok=await window._tbTabLock.resetPw(tabId,tabLabel);
      setResetMsg('');
      if(ok) onUnlocked();
    }catch(e){ setResetMsg(''); }
  };
  return <div className="tb-fade-in" style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:18,padding:'60px 20px',maxWidth:380,margin:'0 auto',textAlign:'center'}}>
    <TBIcon n="lock" size={34} style={{color:'var(--ac)'}}/>
    <div>
      <div style={{fontFamily:"'Manrope',system-ui,-apple-system,sans-serif",fontSize:22,fontWeight:700,color:'var(--tx)'}}>{tabLabel} is locked</div>
      <div style={{fontSize:13,color:'var(--txm)',marginTop:4,fontFamily:'var(--font-accent)'}}>Enter the password to open this tab.</div>
    </div>
    {bioReady&&<button onClick={bioUnlock} style={{background:'transparent',border:'1px solid var(--bd)',borderRadius:6,padding:'12px 0',fontSize:13.5,fontWeight:500,letterSpacing:.2,cursor:'pointer',display:'inline-flex',alignItems:'center',justifyContent:'center',gap:8,width:'100%',color:'var(--acs)',borderColor:'var(--acl)',padding:'14px 0',cursor:'pointer'}}><TBIcon n="unlock" size={15}/> Unlock with {window.Bio.label()}</button>}
    {showPw&&<input type="password" value={pw} autoFocus onChange={e=>{setPw(e.target.value);setErr('');}} onKeyDown={e=>{if(e.key==='Enter')submit();}}
      placeholder="Password" style={{width:'100%',background:'var(--s2)',border:`1px solid ${err?'var(--tbr)':'var(--bd)'}`,borderRadius:6,color:'var(--tx)',fontSize:15,fontWeight:500,padding:'14px 16px',textAlign:'center',letterSpacing:4,outline:'none',boxSizing:'border-box'}}/>}
    {err&&<div style={{fontSize:12,color:'var(--tbr)',fontWeight:700,minHeight:14}}>{err}</div>}
    {showPw&&<button onClick={submit} disabled={busy} style={{width:'100%',background:'var(--ac)',color:'#fff',border:'none',borderRadius:8,padding:'12px 0',fontSize:14,fontWeight:700,cursor:busy?'default':'pointer',opacity:busy?0.6:1}}>{busy?'Checking…':'Unlock'}</button>}
    {showPw&&<button onClick={forgot} style={{background:'transparent',border:'none',color:'var(--txm)',fontSize:12,cursor:'pointer',textDecoration:'underline'}}>{hintMsg||'Forgot password?'}</button>}
    {showPw&&<button onClick={reset} style={{background:'transparent',border:'none',color:'var(--txm)',fontSize:12,cursor:'pointer',textDecoration:'underline',marginTop:-8}}>{resetMsg||'Reset password via email'}</button>}
  </div>;
}

function TBTabGate({tabId,tabLabel,children}){
  useTabLockVersion();
  const [,force]=useState(0);
  const blocked = window._tbTabLock ? window._tbTabLock.mustBlock(tabId) : false;
  if(blocked){
    return <TBTabLockPrompt tabId={tabId} tabLabel={tabLabel} onUnlocked={()=>force(v=>v+1)}/>;
  }
  return children;
}

function TBTabLockManager({tabId,tabLabel,onClose}){
  useTabLockVersion();
  const isLocked = window._tbTabLock && window._tbTabLock.isLocked(tabId);
  const [mode,setMode]=useState(isLocked?'menu':'setpw');
  const [pw,setPw]=useState('');
  const [err,setErr]=useState('');
  const [busy,setBusy]=useState(false);
  // Biometrics: register/remove a device credential for this tab (password stays as fallback).
  const [bioAvail,setBioAvail]=useState(false);
  const [bioReg,setBioReg]=useState(window.Bio?window.Bio.isRegistered('tradehub-tab',tabId):false);
  useEffect(()=>{ let a=true; if(window.Bio) window.Bio.available().then(v=>{if(a)setBioAvail(!!v);}); return ()=>{a=false;}; },[]);
  const bioRegister=async()=>{
    const r=await window.Bio.register('tradehub-tab',tabId,{rpName:'TradeHub',userName:'tradehub-tab-'+tabId,displayName:tabLabel+' — TradeHub'});
    if(r.ok){ window._tbTabLock.markUnlocked(tabId); setBioReg(true); onClose(); }
    else if(!(r.error==='cancelled'||r.error==='NotAllowedError')) setErr('Could not register biometrics.');
  };
  // Removing biometrics requires re-verifying identity — biometric OR password.
  const bioVerifyRemove=async()=>{
    setErr('');
    const r=await window.Bio.authenticate('tradehub-tab',tabId);
    if(r.ok){ window.Bio.unregister('tradehub-tab',tabId); setBioReg(false); onClose(); }
    else if(!(r.error==='cancelled'||r.error==='NotAllowedError')) setErr('Biometric check failed — use your password.');
  };
  const act=async()=>{
    const p=pw.trim(); if(!p){setErr('Password required.');return;}
    setBusy(true);setErr('');
    try{
      if(mode==='setpw'){
        const hint=(await window.uiPrompt('Optional: password hint for the recovery email. Blank to skip.',{title:'Password hint'}))||'';
        const d=await window._tbTabLock.setPw(tabId,p,hint);
        console.log('[TabLock] set-lock response for', tabId, ':', JSON.stringify(d));
        const ok = d && (d.ok===true || d.success===true || d.set===true);
        if(ok){ window._tbTabLock.setLock(tabId); window._tbTabLock.markUnlocked(tabId);
          if(window.Bio && bioAvail && !window.Bio.isRegistered('tradehub-tab',tabId)){
            setBusy(false);
            const okReg=await window.uiConfirm('Register '+window.Bio.label()+' to unlock '+tabLabel+' on this device? Your password still works as a fallback.',{title:'Register '+window.Bio.label(),okLabel:'Register'});
            if(okReg){ await bioRegister(); return; }
          }
          onClose(); }
        else setErr(d&&d.error?('Error: '+d.error):'Failed to set lock.');
      } else if(mode==='remove'){
        const d=await window._tbTabLock.removePw(tabId,p);
        if(d.ok){ window._tbTabLock.removeLock(tabId); window._tbTabLock.markLocked(tabId); onClose(); }
        else setErr('Wrong password.');
      } else if(mode==='removebio'){
        const d=await window._tbTabLock.verify(tabId,p);
        const ok = d && (d.ok===true || d.valid===true || d.success===true || d.match===true);
        if(ok){ window.Bio.unregister('tradehub-tab',tabId); setBioReg(false); onClose(); }
        else setErr('Wrong password.');
      } else if(mode==='changepw'){
        const d=await window._tbTabLock.verify(tabId,p);
        if(d.ok){
          const chg=await window.uiForm({ title:'Change password', okLabel:'Change password',
            fields:[ {name:'password',label:'New password',type:'password',required:true}, {name:'hint',label:'New password hint (optional)'} ] });
          const np=chg?chg.password:'';
          if(np&&np.trim()){
            const nh=(chg.hint)||'';
            const rem=await window._tbTabLock.removePw(tabId,p);
            if(rem.ok){ const set=await window._tbTabLock.setPw(tabId,np.trim(),nh);
              if(set.ok){ window._tbTabLock.setLock(tabId); window._tbTabLock.markUnlocked(tabId); onClose(); }
              else setErr('Failed to set new password.'); }
            else setErr('Error removing old lock.');
          } else setErr('New password empty — not changed.');
        } else setErr('Wrong password.');
      }
    }catch(e){ setErr('Network error.'); }
    setBusy(false);
  };
  const titleByMode={setpw:'Lock '+tabLabel,remove:'Remove lock',changepw:'Change password',menu:tabLabel+' lock',removebio:'Remove biometrics'};
  const subByMode={setpw:'Choose a password to lock this tab. Unlock once per device.',remove:'Enter password to remove the lock.',changepw:'Enter current password first.',menu:'This tab is locked. Choose an action.',removebio:'Verify with '+(window.Bio?window.Bio.label():'biometrics')+' or your password to remove biometrics from this device.'};
  const iconByMode={setpw:'shield',remove:'unlock',changepw:'key',menu:'lock',removebio:'user'};
  return <div onClick={onClose} style={{position:'fixed',inset:0,zIndex:100000,background:'rgba(14,14,16,.66)',backdropFilter:'blur(5px)',display:'flex',alignItems:'center',justifyContent:'center',padding:16}}>
    <div onClick={e=>e.stopPropagation()} style={{background:'var(--s2)',border:'1px solid var(--bdl)',borderRadius:9,padding:'32px 26px',width:340,maxWidth:'90vw',display:'flex',flexDirection:'column',alignItems:'center',gap:16,boxShadow:'0 30px 70px rgba(0,0,0,.48)'}}>
      <TBIcon n={iconByMode[mode]} size={30} style={{color:'var(--ac)'}}/>
      <div style={{textAlign:'center'}}>
        <div style={{fontFamily:"'Manrope',system-ui,-apple-system,sans-serif",fontSize:22,fontWeight:600,letterSpacing:-.2,color:'var(--tx)'}}>{titleByMode[mode]}</div>
        <div style={{fontSize:12.5,color:'var(--txd)',marginTop:5,lineHeight:1.55}}>{subByMode[mode]}</div>
      </div>
      {mode==='menu'?(
        <div style={{display:'flex',flexDirection:'column',gap:8,width:'100%'}}>
          {bioAvail&&(bioReg
            ?<button onClick={()=>{setMode('removebio');setPw('');setErr('');}} style={{background:'transparent',border:'1px solid var(--bd)',borderRadius:6,padding:'12px 0',fontSize:13.5,fontWeight:500,letterSpacing:.2,cursor:'pointer',display:'inline-flex',alignItems:'center',justifyContent:'center',gap:8,color:'var(--txd)'}}><TBIcon n="user"/>Remove biometrics</button>
            :<button onClick={bioRegister} style={{background:'transparent',border:'1px solid var(--bd)',borderRadius:6,padding:'12px 0',fontSize:13.5,fontWeight:500,letterSpacing:.2,cursor:'pointer',display:'inline-flex',alignItems:'center',justifyContent:'center',gap:8,color:'var(--acs)',borderColor:'var(--acl)'}}><TBIcon n="user"/>Register {window.Bio.label()}</button>)}
          {/* Border matches the weight of the gold/red siblings — on --bd it read as
              a disabled row next to them. */}
          <button onClick={()=>{setMode('changepw');setPw('');setErr('');}} style={{background:'transparent',border:'1px solid var(--bd)',borderRadius:6,padding:'12px 0',fontSize:13.5,fontWeight:500,letterSpacing:.2,cursor:'pointer',display:'inline-flex',alignItems:'center',justifyContent:'center',gap:8,color:'var(--tx)',borderColor:'rgba(244,243,240,.36)'}}><TBIcon n="key"/>Change password</button>
          <button onClick={()=>{setMode('remove');setPw('');setErr('');}} style={{background:'transparent',border:'1px solid var(--bd)',borderRadius:6,padding:'12px 0',fontSize:13.5,fontWeight:500,letterSpacing:.2,cursor:'pointer',display:'inline-flex',alignItems:'center',justifyContent:'center',gap:8,color:'var(--tbr)',borderColor:'rgba(214,138,124,.3)'}}><TBIcon n="trash"/>Remove lock</button>
          <button onClick={onClose} style={{background:'transparent',color:'var(--txm)',border:'none',fontSize:13,cursor:'pointer',textDecoration:'underline',marginTop:2}}>Cancel</button>
        </div>
      ):(
        <div style={{width:'100%',display:'flex',flexDirection:'column',gap:10}}>
          {mode==='removebio'&&bioAvail&&<button onClick={bioVerifyRemove} style={{background:'transparent',border:'1px solid var(--bd)',borderRadius:6,padding:'12px 0',fontSize:13.5,fontWeight:500,letterSpacing:.2,cursor:'pointer',display:'inline-flex',alignItems:'center',justifyContent:'center',gap:8,width:'100%',color:'var(--acs)',borderColor:'var(--acl)'}}><TBIcon n="unlock"/>Use {window.Bio.label()}</button>}
          <input type="password" value={pw} autoFocus onChange={e=>{setPw(e.target.value);setErr('');}} onKeyDown={e=>{if(e.key==='Enter')act();}}
            placeholder="Password" style={{width:'100%',background:'var(--s2)',border:`1px solid ${err?'var(--tbr)':'var(--bd)'}`,borderRadius:6,color:'var(--tx)',fontSize:15,fontWeight:500,padding:'14px 16px',textAlign:'center',letterSpacing:4,outline:'none',boxSizing:'border-box'}}/>
          {err&&<div style={{fontSize:12.5,color:'var(--tbr)',fontWeight:500,textAlign:'center'}}>{err}</div>}
          <button onClick={act} disabled={busy} style={{background:'transparent',border:'1px solid var(--bd)',borderRadius:6,padding:'12px 0',fontSize:13.5,fontWeight:500,letterSpacing:.2,cursor:'pointer',display:'inline-flex',alignItems:'center',justifyContent:'center',gap:8,width:'100%',color:'var(--acs)',borderColor:'var(--acl)',cursor:busy?'default':'pointer',opacity:busy?0.5:1}}>{busy?'Working…':(mode==='setpw'?'Set Password':mode==='remove'?'Remove Lock':mode==='removebio'?'Remove biometrics':'Verify & Continue')}</button>
          <button onClick={onClose} style={{background:'transparent',color:'var(--txm)',border:'none',fontSize:13,cursor:'pointer',textDecoration:'underline'}}>Cancel</button>
        </div>
      )}
    </div>
  </div>;
}

/* ── Nav items ── */
const TB_NAV=[
  {id:'portfolio',label:'Portfolio',icon:'pieChart',badge:'LIVE'},
  {id:'journal',  label:'Journal',  icon:'doc'},
  {id:'catalysts',label:'Catalysts',icon:'calendar'},
  {id:'playbook', label:'Playbook', icon:'list'},
  {id:'prompt',   label:'Control',  icon:'command'},
  {id:'news',     label:'News',     icon:'sparkle'},
  {id:'analysis', label:'Analysis', icon:''},
];

/* ── Nav order (user-draggable) — persisted per-device + synced via Firebase ── */
const TB_NAV_ORDER_KEY='tb_nav_order_v1';
function tbLoadNavOrder(){
  try{ const r=localStorage.getItem(TB_NAV_ORDER_KEY); if(r){ const a=JSON.parse(r); if(Array.isArray(a)&&a.length) return a; } }catch{}
  return TB_NAV.map(n=>n.id);
}
function tbSaveNavOrder(order){ try{ localStorage.setItem(TB_NAV_ORDER_KEY, JSON.stringify(order)); }catch{} }
/* Merge a saved order with the canonical TB_NAV: honor saved order, append any NEW
   tabs at the end, drop ids that no longer exist. Returns nav item objects in order. */
function tbOrderedNav(order){
  const byId={}; TB_NAV.forEach(n=>byId[n.id]=n);
  const seen=new Set(); const out=[];
  (order||[]).forEach(id=>{ if(byId[id]&&!seen.has(id)){ out.push(byId[id]); seen.add(id); } });
  TB_NAV.forEach(n=>{ if(!seen.has(n.id)){ out.push(n); seen.add(n.id); } });
  return out;
}

/* ── Shared reorderable nav bar (desktop + mobile) ──────────────────────────
   • Desktop: click-drag a tab to reorder; a plain click still navigates.
   • Mobile/tablet: HOLD (~300ms long-press) to pick a tab up, then drag; a plain
     swipe still scrolls the header horizontally (native), and a tap navigates.
   Self-contained (Pointer Events), no libraries. Order changes bubble via onReorder. */
function TBNavBar({items,page,onNav,onReorder,variant}){
  const isDesktop=variant==='desktop';
  /* Which tabs have a job running right now — the dot next to a tab's label is
     the only way to tell that the sync/build you kicked before wandering off is
     still going. */
  const jobs=useTBJobs();
  const containerRef=useRef(null);
  const byId=useMemo(()=>{const m={};(items||[]).forEach(i=>m[i.id]=i);return m;},[items]);
  const [liveIds,setLiveIds]=useState(()=>(items||[]).map(i=>i.id));
  const liveIdsRef=useRef(liveIds);
  useEffect(()=>{ liveIdsRef.current=liveIds; },[liveIds]);
  const [dragId,setDragId]=useState(null);
  const draggingRef=useRef(false);
  const dragRef=useRef(null);        // {id,startX,startY,pointerType,pointerId,target}
  const timerRef=useRef(null);
  const justDraggedRef=useRef(false);

  // Adopt external order changes only when NOT mid-drag (don't fight the user).
  useEffect(()=>{ if(!draggingRef.current) setLiveIds((items||[]).map(i=>i.id)); },[items]);

  // Block native scroll ONLY while actively dragging, so plain swipes still scroll.
  useEffect(()=>{
    const el=containerRef.current; if(!el) return;
    const onTM=(ev)=>{ if(draggingRef.current) ev.preventDefault(); };
    el.addEventListener('touchmove',onTM,{passive:false});
    return ()=>el.removeEventListener('touchmove',onTM);
  },[]);

  const clearTimer=()=>{ if(timerRef.current){ clearTimeout(timerRef.current); timerRef.current=null; } };
  const beginDrag=()=>{
    const dr=dragRef.current; if(!dr) return;
    draggingRef.current=true; setDragId(dr.id);
    try{ dr.target&&dr.target.setPointerCapture&&dr.target.setPointerCapture(dr.pointerId); }catch(_){}
    try{ if(navigator.vibrate) navigator.vibrate(12); }catch(_){}
  };
  const reorderTo=(clientX)=>{
    const dr=dragRef.current, cont=containerRef.current; if(!dr||!cont) return;
    setLiveIds(prev=>{
      const without=prev.filter(x=>x!==dr.id);
      let insert=without.length;
      for(let k=0;k<without.length;k++){
        const el=cont.querySelector('[data-navid="'+without[k]+'"]'); if(!el) continue;
        const r=el.getBoundingClientRect();
        if(clientX < r.left + r.width/2){ insert=k; break; }
      }
      const next=without.slice(); next.splice(insert,0,dr.id);
      return next.join('|')===prev.join('|')?prev:next;
    });
  };
  const onPointerDown=(e,id)=>{
    if(e.button!=null && e.button!==0) return;      // left/primary only
    const pt=e.pointerType||'mouse';
    // Capture the values we need now — don't hold the (possibly-recycled) event.
    dragRef.current={id,startX:e.clientX,startY:e.clientY,pointerType:pt,pointerId:e.pointerId,target:e.currentTarget};
    clearTimer();
    if(pt!=='mouse'){                                // touch/pen → require a hold
      timerRef.current=setTimeout(()=>{
        timerRef.current=null;
        if(dragRef.current && dragRef.current.id===id && !draggingRef.current) beginDrag();
      },300);
    }
  };
  const onPointerMove=(e)=>{
    const dr=dragRef.current; if(!dr) return;
    if(!draggingRef.current){
      const dx=Math.abs(e.clientX-dr.startX), dy=Math.abs(e.clientY-dr.startY);
      if(dr.pointerType==='mouse'){ if(dx>5||dy>5) beginDrag(); }          // desktop: small move starts drag
      else if((dx>8||dy>8) && timerRef.current){ clearTimer(); dragRef.current=null; }  // touch moved before hold → let it scroll
      if(!draggingRef.current) return;
    }
    reorderTo(e.clientX);
  };
  const endDrag=()=>{
    clearTimer();
    const wasDragging=draggingRef.current;
    draggingRef.current=false; dragRef.current=null; setDragId(null);
    if(wasDragging){
      justDraggedRef.current=true;
      setTimeout(()=>{ justDraggedRef.current=false; },60);   // swallow the click that follows a drag
      if(onReorder && liveIdsRef.current) onReorder(liveIdsRef.current.slice());
    }
  };

  const renderBtn=(id)=>{
    const item=byId[id]; if(!item) return null;
    const isActive=page===item.id;
    const isDrag=dragId===item.id;
    const tabLocked=window._tbTabLock&&window._tbTabLock.isLocked(item.id);
    const jobLabel=jobs.label(item.id);
    const base = isDesktop
      ? {display:'flex',alignItems:'center',gap:7,padding:'0 16px',height:'100%',fontSize:12}
      : {flex:'0 0 auto',display:'flex',alignItems:'center',justifyContent:'center',gap:5,padding:'8px 16px',fontSize:12};
    return <button key={id} data-navid={id}
      onPointerDown={e=>onPointerDown(e,id)} onPointerMove={onPointerMove} onPointerUp={endDrag} onPointerCancel={endDrag}
      onClick={e=>{ if(justDraggedRef.current){ e.preventDefault(); e.stopPropagation(); return; } onNav(item.id); }}
      style={{...base,border:'none',borderBottom:`2px solid ${isActive?'var(--ac)':'transparent'}`,fontWeight:isActive?800:600,
        background:isDrag?'var(--s2)':'transparent',color:isActive?'var(--ac)':'var(--txd)',cursor:isDrag?'grabbing':'pointer',
        whiteSpace:'nowrap',transition:isDrag?'none':'background .15s,color .15s',transform:isDrag?'scale(1.05)':'none',
        boxShadow:isDrag?'0 6px 18px rgba(0,0,0,0.28)':'none',borderRadius:isDrag?8:0,zIndex:isDrag?5:'auto',opacity:isDrag?0.95:1,
        touchAction:'pan-x',userSelect:'none',WebkitUserSelect:'none',WebkitTouchCallout:'none'}}>
      {isDesktop&&item.icon?<TBIcon n={item.icon} size={13}/>:null}
      <span>{item.label}</span>
      {jobLabel?<span title={jobLabel} style={{width:6,height:6,borderRadius:'50%',background:'var(--ac)',flexShrink:0,
        boxShadow:'0 0 0 3px rgba(224,184,116,0.16)',animation:'tb-pulse 1.4s ease-in-out infinite'}}/>:null}
      {tabLocked?<TBIcon n="lock" size={isDesktop?11:10} style={{opacity:.75}}/>:null}
      {item.badge?<span style={{fontSize:isDesktop?8:7,background:'rgba(164,185,134,0.18)',color:'var(--tbb)',border:'1px solid rgba(164,185,134,0.35)',borderRadius:isDesktop?4:3,padding:'1px 5px',fontWeight:800,marginLeft:2}}>{item.badge}</span>:null}
    </button>;
  };

  const wrapStyle = isDesktop
    ? {display:'flex',alignItems:'stretch',height:42,gap:0,flex:1,overflowX:'auto',scrollbarWidth:'none',touchAction:dragId?'none':'pan-x'}
    : {display:'flex',alignItems:'stretch',borderTop:'1px solid var(--bd)',overflowX:'auto',WebkitOverflowScrolling:'touch',scrollbarWidth:'none',touchAction:dragId?'none':'pan-x'};

  return isDesktop
    ? <nav ref={containerRef} style={wrapStyle}>{liveIds.map(renderBtn)}</nav>
    : <div ref={containerRef} style={wrapStyle}>{liveIds.map(renderBtn)}</div>;
}

/* ── Shared Analysis URL helpers (used by the Launch Analysis button AND the
   app-level ?autoanalyze auto-run) ──────────────────────────────────────────── */
/* Resolve a search entry → URL: full URL passthrough, www. auto-scheme, else Google. */
function tbResolveUrl(query){
  const t=(query||'').trim();
  if(/^https?:\/\//i.test(t)) return t;
  if(/^www\./i.test(t)) return 'https://'+t;
  if(t.includes('.')&&!t.includes(' ')&&!t.includes('?')) return 'https://'+t;
  return 'https://www.google.com/search?q='+encodeURIComponent(t);
}
/* Plain ChatGPT URL. We deliberately do NOT use ?q=<prompt>: real prompts are long
   enough that the URL + ChatGPT's auth cookies overflow its header limit (HTTP 431).
   The prompt is copied to the clipboard instead — paste it with Ctrl+V. (The
   Trading Auto Launch submits automatically by pasting + Enter for you.) */
const TB_CHATGPT_URL='https://chatgpt.com/';

/* ── AI destination ─────────────────────────────────────────────────────────
   Where "Launch Analysis" sends the selected prompt. With the Vault extension
   installed the prompt is typed in and submitted for you (see the auto-submit
   block below); without it, the tab still opens with the prompt on your
   clipboard, exactly as before. `hosts` is what we match search entries against
   so the AI never opens twice. */
/* `qUrl` is the site's own prefill link — see tbPrefillUrl below for what it can
   and can't do. `sends` marks the one destination whose link actually runs the
   prompt instead of just typing it in. */
const TB_AI_SITES=[
  {id:'chatgpt',   label:'ChatGPT',    url:TB_CHATGPT_URL,                     hosts:['chatgpt.com','chat.openai.com'], qUrl:'https://chatgpt.com/?q='},
  /* `app` = open the native app when it's installed, instead of the site. Opt-in
     per destination and deliberately rare: it's here for Claude because claude.ai
     makes you sign in on the web, while the app is already signed in. Every other
     destination works fine logged-out (or is already logged in) in the browser,
     so they stay there — see tbOpenAi. */
  {id:'claude',    label:'Claude',     url:'https://claude.ai/new',            hosts:['claude.ai'],                     qUrl:'https://claude.ai/new?q=', app:'com.anthropic.claude'},
  {id:'gemini',    label:'Gemini',     url:'https://gemini.google.com/app',    hosts:['gemini.google.com'],             qUrl:'https://gemini.google.com/app?q='},
  {id:'perplexity',label:'Perplexity', url:'https://www.perplexity.ai/',       hosts:['perplexity.ai'],                 qUrl:'https://www.perplexity.ai/search?q=', sends:true},
  {id:'grok',      label:'Grok',       url:'https://grok.com/',                hosts:['grok.com'],                      qUrl:'https://grok.com/?q='},
  {id:'copilot',   label:'Copilot',    url:'https://copilot.microsoft.com/',   hosts:['copilot.microsoft.com'],         qUrl:'https://copilot.microsoft.com/?q='},
  {id:'deepseek',  label:'DeepSeek',   url:'https://chat.deepseek.com/',       hosts:['deepseek.com']},
  {id:'custom',    label:'Custom URL', url:'',                                 hosts:[]},
  {id:'none',      label:'None',       url:'',                                 hosts:[]},
];
function tbAiSite(cfg){const id=(cfg&&cfg.aiSite)||'chatgpt';return TB_AI_SITES.find(s=>s.id===id)||TB_AI_SITES[0];}
/* A custom destination may carry a {prompt} placeholder (see tbPrefillUrl). When
   we open that site WITHOUT prefilling it — prompt too long, or none picked — the
   template must not leak into the address bar, so drop whichever query parameter
   holds it and open the bare page. */
function tbStripPromptToken(u){
  if(!/\{prompt\}/i.test(u))return u;
  try{
    const url=new URL(u);
    [...url.searchParams.keys()].forEach(k=>{if(/\{prompt\}/i.test(url.searchParams.get(k)||''))url.searchParams.delete(k);});
    return url.toString().replace(/\{prompt\}/ig,'').replace(/[?&]+$/,'');
  }catch(e){return u.split(/[?#]/)[0];}
}
/* Resolved destination URL ('' = don't open an AI tab at all). */
function tbAiUrl(cfg){
  const s=tbAiSite(cfg);
  if(s.id==='none')return '';
  if(s.id==='custom'){const c=((cfg&&cfg.aiCustomUrl)||'').trim();return c?tbStripPromptToken(tbResolveUrl(c)):'';}
  return s.url;
}
/* ── Prefill link ── the only automatic handoff left when the Vault extension
   isn't there, which on mobile is always: Brave and Chrome on Android support no
   extensions at all, and iOS can't run ours either. A page still cannot type into
   another site, so we hand the AI its own ?q= link and let it do the typing.

   Two limits, both the AI's and not ours:
     · it PREFILLS, it does not send. OpenAI gated ChatGPT's auto-submit on the
       sec-fetch-site header in July 2025 and a link from here is cross-site by
       definition, so the prompt lands in the composer and you press send.
       Perplexity is the exception (`sends`) — its ?q= is a search URL, so it runs.
     · the prompt rides in the URL, and a long one plus the site's auth cookies
       overflows the server's request-line limit. That's the HTTP 431 that made us
       drop ?q= originally, and why anything over TB_PREFILL_MAX falls back to the
       clipboard instead of opening a link that 431s.
   Returns '' when prefill isn't possible, which every caller reads as "fall back". */
const TB_PREFILL_MAX=1800;
function tbPrefillUrl(cfg,text){
  const t=(text||'').trim(); if(!t)return '';
  const enc=encodeURIComponent(t);
  if(enc.length>TB_PREFILL_MAX)return '';
  const site=tbAiSite(cfg);
  /* A custom destination opts in by putting {prompt} where its own query goes. */
  if(site.id==='custom'){
    const c=((cfg&&cfg.aiCustomUrl)||'').trim();
    return /\{prompt\}/i.test(c)?tbResolveUrl(c).replace(/\{prompt\}/ig,enc):'';
  }
  return site.qUrl?site.qUrl+enc:'';
}
/* Does the destination type the prompt in for us on this device? */
function tbCanPrefill(cfg){const s=tbAiSite(cfg);return s.id==='custom'?/\{prompt\}/i.test(((cfg&&cfg.aiCustomUrl)||'')):!!s.qUrl;}

function tbHostOf(u){try{return new URL(u).hostname.replace(/^www\./,'').toLowerCase();}catch{return '';}}
/* True if a search entry resolves to the AI destination itself — those are
   skipped so the AI tab isn't opened a second time (unsubmitted). */
function tbIsAiUrl(u,cfg){
  const h=tbHostOf(u); if(!h)return false;
  const site=tbAiSite(cfg);
  const hosts=site.id==='custom'?[tbHostOf(tbAiUrl(cfg))].filter(Boolean):site.hosts;
  return hosts.some(x=>h===x||h.endsWith('.'+x));
}

/* ── Vault-extension bridge for auto-submit ─────────────────────────────────
   A page cannot type into another site — that's browser-wide cross-origin
   policy, and it's exactly why the Trading Auto Launch had to drive ChatGPT
   with OS keystrokes. The Vault extension can, so we hand it the prompt and it
   opens the tabs + pastes + sends (see Vault/vault-ai-prompt.js).

   The capability is probed on mount, NOT at click time: if the extension is
   missing we must fall back to window.open, and window.open only survives
   inside the click's own user gesture — there's no room to ask first and then
   decide. */
function tbAiPing(timeoutMs=1200){
  return new Promise(resolve=>{
    let done=false;
    const onMsg=(e)=>{
      if(e.source!==window)return;
      const d=e.data;
      if(!d||d.source!=='vault-extension'||d.action!=='aiLaunchPong')return;
      if(done)return;done=true;window.removeEventListener('message',onMsg);resolve(!!d.ok);
    };
    window.addEventListener('message',onMsg);
    try{window.postMessage({source:'tradehub-vault',action:'aiLaunchPing'},location.origin);}catch(e){}
    setTimeout(()=>{if(done)return;done=true;window.removeEventListener('message',onMsg);resolve(false);},timeoutMs);
  });
}
/* Ask the extension to run the whole launch. Returns true once it acks — the
   ack is what guarantees we don't also open the same tabs ourselves. */
function tbAiLaunch({aiUrl,text,searches}){
  return new Promise(resolve=>{
    let done=false;
    const onMsg=(e)=>{
      if(e.source!==window)return;
      const d=e.data;
      if(!d||d.source!=='vault-extension'||d.action!=='launchAnalysisAck')return;
      if(done)return;done=true;window.removeEventListener('message',onMsg);resolve(true);
    };
    window.addEventListener('message',onMsg);
    try{window.postMessage({source:'tradehub-vault',action:'launchAnalysis',aiUrl,text,searches},location.origin);}
    catch(e){}
    setTimeout(()=>{if(done)return;done=true;window.removeEventListener('message',onMsg);resolve(false);},1500);
  });
}

/* ── Opening things from Analysis ─────────────────────────────────────────────
   Two openers, deliberately pulling in opposite directions:

     tbOpenAi   — the AI destination. Almost always the browser; the native app
                  only for a destination that opts in with an `app` package,
                  which today is Claude alone, because claude.ai demands a login
                  on the web and the app is already signed in. ONE of the two,
                  never both.
     tbOpenTab  — your search tabs. Always the browser; a search hijacked into
                  the Google or X app wrecks the tab layout.

   Both hang off the same Android primitive. A page cannot ask "is this app
   installed?" — there's no such API, by design. But an intent: URI carrying
   S.browser_fallback_url makes ANDROID answer the question: it launches the app
   if one matches, and Chrome navigates to the fallback URL in the browser if none
   does. Point that at the AI's own package for app-first, or at a package that
   cannot exist for browser-only.

   The window is claimed inside the tap (the popup blocker needs the gesture), then
   the hop runs INSIDE that new tab, and both openers keep a timer there so no path
   can strand you on a blank tab. It has to be a timer, not a meta refresh — a meta
   refresh does not survive a failed scheme navigation (measured; the tab just sits
   on about:blank).

   iOS isn't scriptable this way: Universal Links already open an installed app on
   a plain navigation and fall back to Safari when it's missing, which is the
   behaviour we want anyway, so there we just navigate. */
const TB_IS_ANDROID=/Android/i.test((typeof navigator!=='undefined'&&navigator.userAgent)||'');
/* Long enough that a real device finishing its intent lookup wins the race,
   short enough that a browser which ignored the intent is not left blank. */
const TB_TAB_FALLBACK_MS=2000;
/* https://host/path?query  →  intent://host/path?query#Intent;…;end, aimed at the
   destination's own package. Empty unless this destination opted into its app
   (TB_AI_SITES.app) — a custom URL never does, since we can't know its package. */
function tbAppIntentUrl(cfg,url){
  const pkg=tbAiSite(cfg).app;
  if(!pkg||!TB_IS_ANDROID||!/^https:/i.test(url))return '';
  let tail='';
  try{const p=new URL(url);tail=p.host+p.pathname+p.search;}catch(e){return '';}
  return 'intent://'+tail+'#Intent;scheme=https;package='+pkg+';'
       + 'S.browser_fallback_url='+encodeURIComponent(url)+';end';
}
/* Open the AI: its app if you have it, its website if you don't.
   When the app takes over, the tab we opened would otherwise be left sitting on
   about:blank behind it — so the page watches for the tab going hidden, which is
   what happens the moment Android switches to the app, and closes itself. If
   nothing happens at all, the same timer falls through to the website. */
function tbOpenAi(cfg,url){
  const u=String(url||'');
  if(!u)return false;
  const intent=tbAppIntentUrl(cfg,u);
  /* Not an app destination (ChatGPT, Gemini, Grok, a custom URL …), or not
     Android at all: hand it to the browser-only opener. Doing a plain navigation
     here instead would let ChatGPT's app grab it back — the app blinks open, hands
     the tab back, and you're where you started. */
  if(!intent)return tbOpenTab(u);
  let w=null;
  try{w=window.open('','_blank');}catch(e){}
  if(!w){try{window.open(intent,'_blank','noopener');return true;}catch(e){return false;}}
  try{w.opener=null;}catch(e){}
  try{
    w.document.write('<!doctype html><html><head><meta charset="utf-8">'
      +'<title>Opening\u2026</title></head><body style="background:#1a1a1d">'
      +'<script>(function(){var u='+JSON.stringify(u)+',i='+JSON.stringify(intent)+',left=false;'
      /* A hidden TRANSITION is the tell that Android switched to the app. Testing
         document.hidden directly would misfire on a tab that merely opened in the
         background, and closing that tab would lose the launch entirely. */
      +'document.addEventListener("visibilitychange",function(){if(document.hidden)left=true;});'
      +'setTimeout(function(){'
      +'if(left){try{window.close();}catch(e){}}'   /* app has it — don't leave a tab */
      +'else{location.replace(u);}'                                  /* nothing took it — use the site */
      +'},'+TB_TAB_FALLBACK_MS+');'
      +'location.replace(i);})();<\/script>'
      +'</body></html>');
    w.document.close();
  }catch(e){
    try{w.location.replace(intent);}catch(_){}
  }
  return true;
}

function tbBrowserOnlyUrl(url){
  if(!TB_IS_ANDROID||!/^https?:/i.test(url))return url;
  return 'intent://open#Intent;scheme=tradehub-browser-only;package=app.tradehub.no.such.package;'
       + 'S.browser_fallback_url='+encodeURIComponent(url)+';end';
}
function tbOpenTab(url){
  const u=String(url||'');
  if(!u)return false;
  const nav=tbBrowserOnlyUrl(u);
  let w=null;
  try{w=window.open('','_blank');}catch(e){}
  /* Popup blocked, or a browser that won't hand back the handle. Still send the
     app-proof URL — on Android that's the whole point, and off it they're equal. */
  if(!w){try{window.open(nav,'_blank','noopener');return true;}catch(e){return false;}}
  try{w.opener=null;}catch(e){}
  try{
    w.document.write('<!doctype html><html><head><meta charset="utf-8">'
      +'<title>Opening\u2026</title></head><body style="background:#1a1a1d">'
      +'<script>(function(){var u='+JSON.stringify(u)+',i='+JSON.stringify(nav)+';'
      +'setTimeout(function(){location.replace(u);},'+TB_TAB_FALLBACK_MS+');'
      +'location.replace(i);})();<\/script>'
      +'</body></html>');
    w.document.close();
  }catch(e){
    /* No document access (shouldn't happen for a same-origin about:blank, but a
       stranded blank tab is the one outcome worth ruling out): go direct. */
    try{w.location.replace(nav);}catch(_){}
    try{setTimeout(()=>{try{if(w&&!w.closed&&w.location.href==='about:blank')w.location.replace(u);}catch(_){}},TB_TAB_FALLBACK_MS);}catch(_){}
  }
  return true;
}

/* Copy inside the click that asked for it. execCommand is deliberate: it needs
   no permission prompt and completes synchronously, so the surrounding user
   gesture — the one window.open depends on — is still live afterwards. The async
   API is fired too, as the modern fallback. Returns whether the sync copy took. */
function tbCopySync(text){
  let ok=false;
  try{
    const ta=document.createElement('textarea');
    ta.value=text;ta.setAttribute('readonly','');
    ta.style.cssText='position:absolute;left:-9999px;top:0;opacity:0;';
    document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,99999);
    ok=document.execCommand('copy');document.body.removeChild(ta);
  }catch(e){}
  if(navigator.clipboard) navigator.clipboard.writeText(text).catch(()=>{});
  return ok;
}

function TBAnalysisPage({cfg={},onSave,prompts=[],onGoToPrompts}){
  const isMobile=useIsMobile();
  const [editing,setEditing]=React.useState(false);
  const [results,setResults]=React.useState([]);/* [{icon,label,ok}] */

  const saveCfg=(c)=>{if(onSave)onSave(c);};

  // Normalize searches to an array. Migrates legacy searchQuery1/2 shape.
  const getSearches=(c)=>{
    if(Array.isArray(c.searches))return c.searches;
    const legacy=[c.searchQuery1,c.searchQuery2].filter(v=>v!=null);
    return legacy.length?legacy:[''];
  };
  const searches=getSearches(cfg);
  const [draft,setDraft]=React.useState(searches);
  React.useEffect(()=>{if(!editing)setDraft(getSearches(cfg));},[cfg,editing]);

  // Selected Prompts-tab prompt (falls back to first). Its text is what gets copied.
  const selPrompt=(prompts.find(p=>p.id===cfg.analysisPromptId)||prompts[0])||null;
  const selPromptText=selPrompt?selPrompt.text:'';

  const numIcon=(i)=>{const n=i+1;return (n>=1&&n<=20)?String.fromCharCode(0x2460+(n-1)):('#'+n);};

  const resolveUrl=tbResolveUrl;

  // Selected AI destination (ChatGPT by default — same as before this setting existed).
  const aiSite=tbAiSite(cfg);
  const aiUrl=tbAiUrl(cfg);
  const [aiCustomDraft,setAiCustomDraft]=React.useState(cfg.aiCustomUrl||'');
  React.useEffect(()=>{setAiCustomDraft(cfg.aiCustomUrl||'');},[cfg.aiCustomUrl]);
  const commitAiCustom=()=>{const v=(aiCustomDraft||'').trim();if(v!==(cfg.aiCustomUrl||''))saveCfg({...cfg,aiCustomUrl:v});};

  /* Is the Vault extension present AND new enough to auto-submit? Probed here,
     on mount, because the click handler has to decide synchronously (see
     tbAiPing). Re-probed when the tab regains focus, so installing the extension
     doesn't need a TradeHub reload. */
  const [autoSubmit,setAutoSubmit]=React.useState(false);
  React.useEffect(()=>{
    let alive=true;
    const probe=()=>{tbAiPing().then(ok=>{if(alive)setAutoSubmit(ok);});};
    probe();
    const onVis=()=>{if(!document.hidden)probe();};
    document.addEventListener('visibilitychange',onVis);
    return()=>{alive=false;document.removeEventListener('visibilitychange',onVis);};
  },[]);

  /* Warm up clipboard permission on mount so it's pre-granted before launch */
  React.useEffect(()=>{
    if(navigator.permissions) navigator.permissions.query({name:'clipboard-write'}).catch(()=>{});
  },[]);

  const activeSearches=searches.map(s=>(s||'').trim()).filter(Boolean);

  /* Web Share is the long-prompt escape hatch on a phone: no length limit and no
     manual paste — the sheet hands the text straight to the ChatGPT/Claude app.
     Offered as a button on the result pill rather than run automatically, because
     it needs its own tap to count as a user gesture and it only helps if the app
     is actually installed. */
  const canShare=typeof navigator!=='undefined'&&!!navigator.share;
  const sharePill=(text)=>({ok:true,icon:'upload',
    label:`Too long for a prefill link — it's on your clipboard`,
    btn:{label:'Send to app',onClick:()=>{try{navigator.share({text}).catch(()=>{});}catch(e){}}}});

  const handleLaunch=()=>{
    const res=[];
    /* ── Clipboard first, synchronously via execCommand (no permission prompt) ──
       Kept even on the auto-submit path: if a site redesign ever defeats the
       extension's composer detection, the prompt is still one Ctrl+V away. */
    let copied=false;
    if(selPromptText){
      const ok=tbCopySync(selPromptText);
      res.push(ok?{ok:true,icon:'command',label:`Prompt copied — ${selPrompt.name}`}:{ok:false,icon:'command',label:'Copy failed \u2014 try the Prompts copy button'});
      copied=ok;
    }

    /* Search URLs, in order, minus any that point at the AI destination itself. */
    const searchUrls=[];
    searches.forEach((q,i)=>{
      const t=(q||'').trim();if(!t)return;
      const u=resolveUrl(t);
      if(aiUrl&&tbIsAiUrl(u,cfg))return;   // don't open the AI twice
      searchUrls.push({u,i});
    });

    /* ── Auto-submit path (Vault extension installed) ─────────────────────────
       The extension opens the searches + the AI tab, brings the AI tab to the
       front, then types the prompt into its composer and sends it — the same end
       state the Trading Auto Launch reaches, without the OS-level keystrokes. */
    if(autoSubmit&&aiUrl&&selPromptText){
      tbAiLaunch({aiUrl,text:selPromptText,searches:searchUrls.map(s=>s.u)}).then(acked=>{
        if(acked)return;
        /* The extension went away between the probe and the click. Open the tabs
           ourselves — the prompt is already on the clipboard. (We're outside the
           click gesture here, so the browser may block these popups; the next
           launch re-probes and takes the manual path cleanly.) */
        searchUrls.forEach(({u})=>tbOpenTab(u));
        tbOpenAi(cfg,aiUrl);
        setResults(r=>[...r,{ok:false,icon:'sparkle',label:`${aiSite.label} opened — auto-submit unavailable, paste with Ctrl+V`}]);
      });
      res.push({ok:true,icon:'sparkle',label:`${aiSite.label} opening — prompt submitted for you`});
      searchUrls.forEach(({i})=>res.push({ok:true,icon:numIcon(i),label:`Search ${i+1} opened`}));
      setResults(res);
      return;
    }

    /* ── Manual path (no extension) — open the tabs; you paste once ───────────
       A web page can't type into or submit another site (browser security), and
       the prompt is too long for a ?q= URL (HTTP 431), so the clipboard is the
       handoff. Installing the Vault extension removes this step. */
    if(aiUrl&&selPromptText){
      const pre=tbPrefillUrl(cfg,selPromptText);
      tbOpenAi(cfg,pre||aiUrl);
      if(pre) res.push({ok:true,icon:'sparkle',label:(TB_IS_ANDROID&&aiSite.app)
        ?`${aiSite.label} opening — app if you have it, prompt copied for it`
        :aiSite.sends
          ?`${aiSite.label} opened — prompt sent`
          :`${aiSite.label} opened — prompt typed in, just hit send`});
      else{
        res.push({ok:copied,icon:'sparkle',label:copied?`${aiSite.label} opened — paste with Ctrl+V, then Enter`:`${aiSite.label} opened — copy the prompt from Prompts, then paste`});
        if(canShare&&copied&&tbCanPrefill(cfg)) res.push(sharePill(selPromptText));
      }
    }
    searchUrls.forEach(({u,i})=>{
      tbOpenTab(u);
      res.push({ok:true,icon:numIcon(i),label:`Search ${i+1} opened`});
    });
    setResults(res);
  };

  /* ── Quick launch ── double-click / double-tap a prompt chip to send just that
     prompt. Same destination and the same extension hand-off as Launch Analysis,
     minus the searches — the point is to deploy one prompt without opening the
     rest of the morning's tabs. Runs inside the tap that triggered it, so the
     clipboard write and the tab claim both keep their user gesture (tbOpenTab
     deliberately drops it again before the real navigation). */
  const handleQuickLaunch=(p)=>{
    const text=(p&&p.text)||'';
    const name=(p&&p.name)||'Prompt';
    if(!text){setResults([{ok:false,icon:'command',label:`${name} is empty — add text to it in Prompts`}]);return;}
    const copied=tbCopySync(text);
    if(!aiUrl){
      setResults([{ok:copied,icon:'command',label:copied?`Prompt copied — ${name}`:'Copy failed — try the Prompts copy button'},
                  {ok:false,icon:'sparkle',label:'No AI destination set — pick one above to send it there'}]);
      return;
    }
    if(autoSubmit){
      tbAiLaunch({aiUrl,text,searches:[]}).then(acked=>{
        if(acked)return;
        /* Extension vanished between the probe and the tap — open it
           ourselves; the prompt is already on the clipboard. */
        tbOpenAi(cfg,aiUrl);
        setResults(r=>[...r,{ok:false,icon:'sparkle',label:`${aiSite.label} opened — auto-submit unavailable, paste with Ctrl+V`}]);
      });
      setResults([{ok:true,icon:'bolt',label:`${name} → ${aiSite.label} — submitted for you`}]);
      return;
    }
    /* No extension (every phone, and any desktop without Vault): hand the AI its
       own prefill link so the prompt is already typed in on arrival. */
    const pre=tbPrefillUrl(cfg,text);
    tbOpenAi(cfg,pre||aiUrl);
    if(pre){
      setResults([{ok:true,icon:'bolt',label:(TB_IS_ANDROID&&aiSite.app)
        ?`${name} → ${aiSite.label} — app if you have it, prompt copied for it`
        :aiSite.sends
          ?`${name} → ${aiSite.label} — sent`
          :`${name} → ${aiSite.label} — typed in, just hit send`}]);
      return;
    }
    const out=[{ok:copied,icon:'bolt',label:copied
      ?`${name} → ${aiSite.label} opened — paste with Ctrl+V, then Enter`
      :`${aiSite.label} opened — copy ${name} from Prompts, then paste`}];
    if(canShare&&copied&&tbCanPrefill(cfg)) out.push(sharePill(text));
    setResults(out);
  };

  /* ── Quick prompt ── a one-off you type here instead of saving it to Prompts.
     It goes out through handleQuickLaunch, so the destination, the extension
     hand-off, the mobile prefill link and the clipboard fallback are all the
     same code the saved prompts use — nothing about sending is duplicated here.
     Kept in localStorage so a half-written prompt survives switching tabs; it is
     deliberately NOT synced, being scratch text rather than a saved prompt. */
  const QUICK_KEY='tb_quick_prompt';
  const [quickText,setQuickText]=React.useState(()=>{try{return localStorage.getItem(QUICK_KEY)||'';}catch(e){return '';}});
  const setQuick=(v)=>{setQuickText(v);try{localStorage.setItem(QUICK_KEY,v);}catch(e){}};
  const quickReady=!!quickText.trim();
  /* onClick, not onMouseDown: the tab-opening below only survives inside a real
     user gesture, and click is the one event a finger and a mouse both raise —
     the prompt chips send on click for exactly this reason. */
  const sendQuick=()=>{const t=quickText.trim();if(!t)return;handleQuickLaunch({text:t,name:'Quick prompt'});};

  /* The box is resized by our own grip rather than the browser's native corner:
     a UA resizer is ~15px square and effectively ungrabbable with a fingertip,
     and its size can't be changed from CSS. This one is a real touch target on a
     phone and behaves identically with a mouse. Height is remembered next to the
     draft text. */
  const QUICK_H_KEY='tb_quick_prompt_h', QUICK_H_MIN=70, QUICK_H_MAX=560;
  const [quickH,setQuickH]=React.useState(()=>{
    const n=parseInt((()=>{try{return localStorage.getItem(QUICK_H_KEY);}catch(e){return '';}})()||'',10);
    return (n>=QUICK_H_MIN&&n<=QUICK_H_MAX)?n:96;
  });
  const quickDrag=React.useRef(null);
  /* The height as of the last move, not as of the last render: a pointerup that
     lands in the same batch as its final pointermove would otherwise save the
     height from one move ago. */
  const quickHNow=React.useRef(quickH);
  const gripDown=(e)=>{
    e.preventDefault();
    quickDrag.current={y:e.clientY,h:quickH};
    try{e.currentTarget.setPointerCapture(e.pointerId);}catch(err){}
  };
  const gripMove=(e)=>{
    const d=quickDrag.current;if(!d)return;
    const next=Math.max(QUICK_H_MIN,Math.min(QUICK_H_MAX,Math.round(d.h+(e.clientY-d.y))));
    quickHNow.current=next;
    setQuickH(next);
  };
  const gripUp=()=>{
    if(!quickDrag.current)return;
    quickDrag.current=null;
    try{localStorage.setItem(QUICK_H_KEY,String(quickHNow.current));}catch(e){}
  };

  // Deploy the ENTIRE Trading Auto Launch (reminder gate → WeBull → TaskHub →
  // windows → AI site + searches). Because TradeHub is already open here, the native
  // launcher reuses THIS window; we just trigger it via its URL protocol and the
  // Python side does the rest.
  const handleDeploy=()=>{
    try{window.location.href=TB_AUTOLAUNCH_PROTOCOL;}catch(e){}
    setResults([{ok:true,icon:'rocket',label:'Deploying Trading Auto Launch — confirm the browser prompt if it appears'}]);
  };

  const isEmpty=!selPromptText&&activeSearches.length===0;

  // Edit-panel helpers (operate on draft array)
  const setSearchAt=(i,v)=>setDraft(d=>d.map((x,j)=>j===i?v:x));
  const addSearch=()=>setDraft(d=>[...d,'']);
  const removeSearch=(i)=>setDraft(d=>d.length<=1?['']:d.filter((_,j)=>j!==i));
  const moveSearch=(i,dir)=>setDraft(d=>{const j=i+dir;if(j<0||j>=d.length)return d;const n=[...d];[n[i],n[j]]=[n[j],n[i]];return n;});
  const saveSearches=()=>{
    const cleaned=draft.map(s=>(s||'').trim()).filter(Boolean);
    const next={...cfg,searches:cleaned};
    delete next.searchQuery1;delete next.searchQuery2; // drop legacy fields
    saveCfg(next);setEditing(false);setResults([]);
  };

  return(<div className="tb-fade-in" style={{display:'flex',flexDirection:'column',gap:0,padding:'32px clamp(12px,4vw,28px) 40px',maxWidth:680,margin:'0 auto',width:'100%'}}>
    {/* Header — white, consistent with other sections */}
    <div style={{fontSize:20,fontWeight:800,color:'var(--tx)',marginBottom:24}}>Analysis</div>

    {/* Prompt picker */}
    <div style={{marginBottom:20}}>
      <div style={{fontSize:10,fontWeight:800,textTransform:'uppercase',letterSpacing:1.5,color:'var(--txm)',marginBottom:8,display:'flex',alignItems:'center',gap:7}}><TBIcon n="command" size={12}/>Clipboard prompts</div>
      <TBPromptSelect prompts={prompts} value={cfg.analysisPromptId} onChange={id=>saveCfg({...cfg,analysisPromptId:id})} onGoToPrompts={onGoToPrompts} onQuickLaunch={handleQuickLaunch}/>
      <div style={{fontSize:11,color:'var(--txd)',marginTop:8,lineHeight:1.6}}>
        <b>Double-tap</b> a prompt to send just that one{aiSite.id==='none'?'':` to ${aiSite.label}`}, without the searches. The <b>★</b> picks what Launch Analysis and the morning deploy send.
      </div>
    </div>

    {/* Quick prompt — type one now; sent exactly like a saved prompt */}
    <div style={{marginBottom:20}}>
      <div style={{fontSize:10,fontWeight:800,textTransform:'uppercase',letterSpacing:1.5,color:'var(--txm)',marginBottom:8,display:'flex',alignItems:'center',gap:7}}><TBIcon n="pencil" size={12}/>Quick prompt</div>
      <div style={{display:'flex',flexDirection:'column',gap:10,padding:'14px 16px',borderRadius:8,border:'1px solid var(--bd)',background:'var(--bgc)'}}>
        <div style={{position:'relative'}}>
          <textarea value={quickText} onChange={e=>setQuick(e.target.value)}
            onKeyDown={e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();sendQuick();}}}
            placeholder="Type a one-off prompt…" spellCheck={true}
            style={{width:'100%',height:quickH,display:'block',background:'var(--bg)',border:'1px solid var(--bd)',borderRadius:6,color:'var(--tx)',
              fontSize:13,lineHeight:1.55,padding:'10px',paddingBottom:isMobile?24:14,boxSizing:'border-box',fontFamily:'inherit',resize:'none',outline:'none'}}
            onFocus={e=>e.target.style.borderColor='var(--ac)'} onBlur={e=>e.target.style.borderColor='var(--bd)'}/>
          {/* Drag grip — padding IS the hit target, so the diagonal stays small
              while the grabbable area is finger-sized on a phone. */}
          <span role="separator" aria-label="Drag to resize" title="Drag to resize"
            onPointerDown={gripDown} onPointerMove={gripMove} onPointerUp={gripUp} onPointerCancel={gripUp}
            style={{position:'absolute',right:1,bottom:1,display:'flex',alignItems:'flex-end',justifyContent:'flex-end',
              padding:isMobile?'14px 12px 8px 18px':'8px 6px 5px 10px',cursor:'ns-resize',touchAction:'none',
              color:'var(--txm)',opacity:.75,userSelect:'none',WebkitTapHighlightColor:'transparent'}}>
            <svg width={isMobile?16:12} height={isMobile?16:12} viewBox="0 0 12 12" fill="none"
              stroke="currentColor" strokeWidth="1.6" strokeLinecap="round">
              <path d="M11 5 5 11M11 9l-2 2"/>
            </svg>
          </span>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:12,flexWrap:'wrap'}}>
          <button onClick={sendQuick} disabled={!quickReady}
            style={{display:'inline-flex',alignItems:'center',gap:7,borderRadius:8,padding:'9px 18px',fontSize:13,fontWeight:800,
              border:quickReady?'none':'1.5px solid var(--bd)',background:quickReady?'var(--ac)':'transparent',
              color:quickReady?'#000':'var(--txd)',cursor:quickReady?'pointer':'not-allowed',opacity:quickReady?1:.5,
              transition:'all .15s',touchAction:'manipulation'}}>
            <TBIcon n="bolt" size={14}/> {aiSite.id==='none'?'Copy prompt':`Send to ${aiSite.label}`}
          </button>
          {quickReady&&<span style={{fontSize:11,color:'var(--txd)'}}>{quickText.trim().length.toLocaleString()} chars</span>}
          {quickReady&&<button onClick={()=>setQuick('')} title="Clear"
            style={{marginLeft:'auto',border:'none',background:'transparent',color:'var(--txm)',fontSize:12,fontWeight:700,cursor:'pointer',padding:'4px 2px'}}
            onMouseEnter={e=>e.currentTarget.style.color='var(--tbr)'} onMouseLeave={e=>e.currentTarget.style.color='var(--txm)'}>Clear</button>}
        </div>

/* ════════════════════════════════════════════════════════════════════════
   NEWSHUB — AI-curated watchlist news. Fetches from newshub-api Cloudflare
   Worker (async build + KV cache), syncs across devices via Firebase.
   ════════════════════════════════════════════════════════════════════════ */
const NH_WORKER_URL = 'https://newshub-api.av1.workers.dev';
// Default news watchlist — used until the user customizes it in News → Settings.
// Mirrors TB_WATCHLIST so first-run news matches the trade watchlist.
const NH_DEFAULT_TICKERS = [...TB_WATCHLIST];
const NH_DAILY_LIMIT = 12;     // must match worker DAILY_FRESH_LIMIT
const NH_MIN_INTERVAL = 5*60;  // must match worker MIN_FRESH_INTERVAL (seconds)
const NH_POLL_INTERVAL = 15000; // ms between polls while building
// Max poll attempts before giving up (so a build that never writes can't spin the
// UI forever). 16 × 15s = ~4 min — longer than any healthy build.
const NH_MAX_POLLS = 16;

/* ── Module-level NEWS build manager ─────────────────────────────────────────
   A worker build takes 30–90s. The spinner and the poller used to live inside
   TBNewsPage, so switching tabs unmounted the component and took both with it:
   "Building…" vanished, the poll timer was cleared by the unmount cleanup, and
   nobody was left to notice the build had landed — you had to hit Refresh or
   bounce the tab. Own the whole watch here instead (same shape as _tbCatBuild
   below): polling keeps running across tab switches, a remounting tab restores
   the spinner from `building`, and the finished build is published to Firebase
   from here so it lands even with the News tab closed. ── */
const _tbNewsBuild = {
  building:false,
  kicking:false,  // the request that STARTS a build, before polling takes over
  timer:null,
  polls:0,
  tickers:[],
  baseGen:0,      // generatedAt when the build was kicked — a poll is only DONE past this
  settings:null,  // mirror of the tab's filters; the Firebase write is a full overwrite
  last:null,      // most recent finished payload, adopted by a tab that remounts
  notice:'', noticeAt:0,   // last message, so a result that landed while you were away is still explained
  listeners:new Set(),
  sub(fn){ this.listeners.add(fn); return()=>this.listeners.delete(fn); },
  emit(evt){ this.listeners.forEach(fn=>{try{fn(evt);}catch(e){}}); },
  /* Nav badge: News is "working" from the moment the kick request goes out until
     the poller stops, so the dot is visible on whatever tab you switch to. */
  syncJob(){ _tbJobs.set('news',(this.building||this.kicking)?'Building…':''); },
  note(msg){ this.notice=msg||''; this.noticeAt=msg?Date.now():0; this.emit({type:'notice',message:this.notice}); },
  setKicking(v){ this.kicking=!!v; this.syncJob(); this.emit({type:v?'kick':'kickend'}); },
  stop(){ if(this.timer){clearTimeout(this.timer);this.timer=null;} this.polls=0; this.building=false; this.syncJob(); },
};
/* A notice older than this is stale context, not news — don't resurrect it on a
   tab that's being opened much later. */
const NH_NOTICE_TTL=5*60*1000;
async function tbNewsPoll(){
  const B=_tbNewsBuild;
  B.timer=null;
  try{
    // cacheOnly=1 is a pure PEEK — polling must NEVER kick another build, or a
    // failing build would re-kick itself forever once its lock expired.
    const r=await fetch(NH_WORKER_URL+'/news?cacheOnly=1&tickers='+encodeURIComponent(B.tickers.join(',')));
    // A bad response is a failed PEEK, not a failed build — keep polling (capped)
    // rather than abandoning a pipeline that's still running.
    const j=r.ok?await r.json().catch(()=>({})):{_cacheMiss:true};
    const gen=j.generatedAt||0;
    // Finished only when the cache holds a build NEWER than the one we started
    // from. A force-fresh leaves the PREVIOUS payload in KV until it overwrites
    // it at the very end, so "cache hit" alone proves nothing — without the
    // generatedAt check the first poll adopted the stale doc and called it done.
    if(!j._cacheMiss&&Array.isArray(j.events)&&gen>B.baseGen){
      B.stop();
      const payload={
        events:j.events,
        generatedAt:gen,
        degraded:!!j.degraded||(j.events.length>0&&j.events.every(e=>e.aiAnalyzed===false)),
      };
      B.last=payload;
      B.emit({type:'done',payload});   // paint first — the publish below can await
      // Publish from HERE, not from the tab — News may well be unmounted.
      if(window._fbSaveTBNews){
        let settings=B.settings;
        // Never write the doc without settings: setDoc is a full overwrite, so a
        // missing key would reset the user's saved filters.
        if(!settings&&window._fbLoadTBNews){
          try{ const d=await window._fbLoadTBNews(); settings=(d&&d.settings)||null; }catch(e){}
        }
        window._fbSaveTBNews(settings?{events:payload.events,generatedAt:payload.generatedAt,settings}
                                     :{events:payload.events,generatedAt:payload.generatedAt});
      }
      return;
    }
    if(++B.polls>=NH_MAX_POLLS){ B.stop(); B.emit({type:'timeout'}); return; }
    B.timer=setTimeout(tbNewsPoll,NH_POLL_INTERVAL);
  }catch(e){
    // A thrown fetch is a failed POLL, not a failed build — the pipeline is still
    // running on the worker. Killing the watch here meant one dropped request (a
    // sleeping laptop, a flaky second of wifi) abandoned a perfectly good Force
    // fresh and the finished build never landed. Count it and keep going; the
    // NH_MAX_POLLS cap still bounds the whole watch.
    if(++B.polls>=NH_MAX_POLLS){ B.stop(); B.emit({type:'timeout'}); return; }
    B.timer=setTimeout(tbNewsPoll,NH_POLL_INTERVAL);
  }
}
/* Start (or join) a watch on a build. baseGen is the generatedAt we're replacing
   — a poll only counts as DONE past it. It is seeded from a free cacheOnly PEEK
   rather than trusted from the caller: callers only know what THEY are showing,
   and when that was behind the cache (a blank tab over a failed 6am doc, say) the
   very first poll adopted the doc already sitting in KV and declared the build
   finished — instantly, with zero events, while the real build was still running. */
function tbNewsWatchBuild(tickers,baseGen){
  const B=_tbNewsBuild;
  if(B.building)return;                     // already watching one
  B.building=true;
  B.tickers=(tickers&&tickers.length)?tickers:NH_DEFAULT_TICKERS;
  B.baseGen=baseGen||0;
  B.polls=0;
  B.syncJob();
  B.emit({type:'start'});
  B.timer=setTimeout(tbNewsPoll,NH_POLL_INTERVAL);
  // Peek runs in parallel with the first 15s wait, so it never delays the watch.
  fetch(NH_WORKER_URL+'/news?cacheOnly=1&tickers='+encodeURIComponent(B.tickers.join(',')))
    .then(r=>r.ok?r.json():null)
    .then(j=>{ if(j&&B.building&&B.polls===0&&(j.generatedAt||0)>B.baseGen) B.baseGen=j.generatedAt; })
    .catch(()=>{});
}

/* A backgrounded tab gets its timers throttled (and a fully backgrounded PWA can
   have them frozen outright), so a poll scheduled 15s out can land minutes late —
   which looks exactly like "I left the app and the build never finished". Poll the
   moment the app is looked at again instead of waiting out a stretched timer. */
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible')return;
  const B=_tbNewsBuild;
  if(B.building&&B.timer){ clearTimeout(B.timer); B.timer=null; tbNewsPoll(); }
});

/* When the cheap path last auto-escalated to a force-fresh (see refresh()). The
   escalation is a real quota spend, so it is throttled: a watchlist that has
   genuinely no news would otherwise burn one of the 12 on every tab open. */
let _tbNewsEscalatedAt = 0;
const NH_ESCALATE_COOLDOWN = 30*60*1000;   // 30 min

const NH_TIER_META = {
  critical:  {label:'Critical',  c:'var(--tbr)'},
  major:     {label:'Major',     c:'var(--ac)'},
  important: {label:'Important', c:'var(--tbw)'},
  notable:   {label:'Notable',   c:'var(--txd)'},
  minor:     {label:'Minor',     c:'var(--txm)'},
};
const NH_SLABEL={bull:'Bullish',bear:'Bearish',neutral:'Neutral'};

function nhTimeAgo(ts){
  if(!ts)return '';
  const s=(Date.now()-ts)/1000;
  if(s<60)return 'now';
  if(s<3600)return Math.max(1,Math.round(s/60))+'m ago';
  if(s<86400)return Math.round(s/3600)+'h ago';
  return Math.round(s/86400)+'d ago';
}
function nhFmtScore(s){if(s==null||s===0)return '';return (s>0?'+':'')+(+s).toFixed(2);}
function nhFmtTime(sec){if(sec<=0)return 'now';if(sec<60)return sec+'s';return Math.ceil(sec/60)+'m';}
// Price-move helpers (Finnhub quote: dp = % change, c = current price).
function nhFmtPct(dp){if(dp==null||!isFinite(dp))return '';return (dp>0?'+':'')+(+dp).toFixed(2)+'%';}
function nhFmtPrice(c){if(c==null||!isFinite(c))return '';return '$'+(+c).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});}
function nhMoveColor(dp){if(dp==null||!isFinite(dp)||dp===0)return 'var(--txm)';return dp>0?'var(--tbb)':'var(--tbr)';}
// Events newer than this are tagged BREAKING so fresh catalysts stand out.
const NH_BREAKING_MS=30*60*1000; // 30 min
// US regular-session check (ET, Mon–Fri 9:30–16:00). Throttles quote polling —
// quotes barely move when the market is closed. Holidays aren't special-cased
// (worst case: a few wasted polls on a holiday). Fails open if Intl misbehaves.
function nhMarketOpen(){
  try{
