<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vault</title>
  <style>
    /* Keychain dark palette (from index.html #kc-root) */
    :root {
      --bg:#1a1a1d; --s1:#232327; --s2:#2c2c31; --s3:#2c2c31;
      --bd:#34343a; --bdl:#45454c; --tx:#f4f3f0; --txd:#adadb2;
      --txm:#8d8d94; --ac:#edc884; --shadow:rgba(0,0,0,.55);
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    html, body {
      margin:0; padding:0; background:var(--bg); color:var(--tx);
      font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    /* Resizable, size-persisting container. Drag the bottom-right corner to
       resize the popup; the size is saved and restored on next open. Chrome
       caps extension popups at 800x600, so we stay just under. */
    #app {
      width:344px; height:520px;
      min-width:300px; min-height:240px;
      max-width:780px; max-height:590px;
      display:flex; flex-direction:column; overflow:hidden;
    }
    /* header + tabs stay fixed; only #scroll scrolls */
    #scroll { flex:1; overflow-y:auto; overflow-x:hidden; }
    #scroll::-webkit-scrollbar { width:11px; }
    #scroll::-webkit-scrollbar-track { background:var(--s1); }
    #scroll::-webkit-scrollbar-thumb { background:#37373d; border-radius:6px; border:2px solid var(--bg); min-height:36px; }
    #scroll::-webkit-scrollbar-thumb:hover { background:var(--ac); }
    /* Big, obvious drag-to-resize grip in the bottom-right corner. */
    #resize-grip {
      position:fixed; right:0; bottom:0; width:22px; height:22px;
      z-index:30; cursor:nwse-resize; touch-action:none;
      color:var(--txm);
      border-bottom-right-radius:3px;
      background:linear-gradient(135deg, transparent 46%, var(--s3) 46%);
    }
    #resize-grip:hover { color:var(--ac); background:linear-gradient(135deg, transparent 44%, var(--s3) 44%); }
    #resize-grip svg { position:absolute; right:3px; bottom:3px; display:block; pointer-events:none; }

    /* ── Header ── */
    header {
      position:sticky; top:0; z-index:5;
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 16px 12px;
      background:var(--bg); border-bottom:1px solid var(--bd);
    }
    .logo { font-family:"Manrope",system-ui,sans-serif; font-size:22px; font-weight:750; letter-spacing:-.3px;
      background:linear-gradient(180deg,#f4d795 0%,#edc884 90%); -webkit-background-clip:text; background-clip:text;
      -webkit-text-fill-color:transparent; color:#edc884; }
    .logo .base, .logo .dot { color:inherit; }
    .sync {
      font-size:10px; font-weight:600; color:var(--txd);
      min-height:13px; margin-top:2px; white-space:nowrap;
    }
    .sync.saving { color:var(--ac); }
    .sync.error  { color:#d68a7c; }
    .gear {
      background:none; border:none; color:var(--txd);
      width:30px; height:30px; border-radius:8px; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      transition:background .15s,color .15s;
    }
    .gear:hover { background:var(--s2); color:var(--tx); }

    /* ── Tabs ── */
    .tabs { display:flex; gap:6px; padding:10px 16px 4px; }
    .tab {
      flex:1; background:transparent; border:1px solid var(--bd);
      color:var(--txd); font-size:10.5px; font-weight:500;
      letter-spacing:1.2px; text-transform:uppercase;
      padding:9px; border-radius:6px; cursor:pointer;
      transition:border-color .18s,color .18s;
    }
    .tab:hover { color:var(--tx); border-color:var(--txd); }
    .tab.active { background:transparent; color:#edc884; border-color:var(--ac); }

    .panel { padding:8px 16px 16px; }
    .hidden { display:none; }

    /* ── Group columns + cards ── */
    #groups { display:flex; gap:10px; align-items:flex-start; }
    .col { flex:1 1 0; min-width:0; }
    /* Accent sits along the TOP of the card, matching the Vault app's
       .kc-card — a ::before bar rather than a border, so it spans the full
       width inside the rounded corners. */
    .card {
      background:var(--s1); border:1px solid var(--bd);
      border-radius:9px; padding:11px 12px 10px; margin-bottom:10px;
      position:relative; overflow:hidden;
    }
    .card::before {
      content:''; position:absolute; top:0; left:0; right:0; height:2px;
      background:var(--card-accent,var(--ac)); opacity:.6;
    }
    .card-top {
      display:flex; align-items:center; justify-content:space-between;
      gap:8px; margin-bottom:8px;
    }
    /* Group name takes the card's own accent, as it does in the app. */
    .card-name {
      font-size:13px; font-weight:600; color:var(--card-accent,#edc884); min-width:0;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    }
    .open-group {
      flex-shrink:0; background:transparent; color:var(--txd);
      border:1px solid var(--bd); border-radius:6px; padding:5px 11px;
      font-size:11px; font-weight:500; letter-spacing:.3px;
      cursor:pointer; transition:border-color .18s,color .18s; white-space:nowrap;
    }
    .open-group:hover { color:var(--tx); border-color:var(--txd); }
    .open-group:active { transform:scale(.97); }
    .open-group:disabled { opacity:.35; cursor:not-allowed; }

    .link-row {
      display:flex; align-items:center; gap:8px;
      padding:5px 0; min-width:0;
    }
    .favicon {
      flex-shrink:0; width:16px; height:16px; border-radius:3px;
      object-fit:contain; background:var(--s3);
    }
    .link-name {
      flex:1; font-size:12px; color:var(--txd);
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    }
    .icon-btn {
      flex-shrink:0; background:transparent; border:1px solid var(--bd);
      color:var(--txd); border-radius:6px; padding:3px 9px;
      font-size:10.5px; font-weight:500; cursor:pointer; line-height:1.4;
      display:inline-flex; align-items:center; justify-content:center;
      transition:border-color .18s,color .18s;
    }
    .icon-btn:hover { color:var(--tx); border-color:var(--txd); }
    .icon-btn.visit:hover { color:#edc884; border-color:var(--ac); }
    .no-links { font-size:11px; color:var(--txm); padding:2px 0; }

    /* ── States ── */
    .placeholder, .empty {
      border:1px dashed var(--bd); border-radius:9px;
      padding:26px 16px; text-align:center;
      font-size:12px; color:var(--txd); line-height:1.7;
    }
    .placeholder .big { font-size:22px; display:block; margin-bottom:8px; }
    .empty { flex:1 1 100%; }
    .loading { text-align:center; color:var(--txm); font-size:12px; padding:30px 0; }

    /* ── Passwords panel ── */
    .pw-msg { text-align:center; color:var(--txd); font-size:12px; line-height:1.7; padding:26px 12px; border:1px dashed var(--bd); border-radius:9px; }
    .pw-msg.err { color:#d68a7c; }
    .pw-lock { text-align:center; padding:22px 8px; }
    .pw-lock-icon { line-height:0; color:var(--ac); }
    .pw-lock-icon svg { width:28px; height:28px; display:inline-block; }
    .pw-lock-title { font-size:17px; font-weight:600; color:var(--tx); margin:8px 0 4px; }
    .pw-lock-sub { font-size:11.5px; color:var(--txd); line-height:1.6; margin-bottom:14px; }
    .pw-input, .pw-search { width:100%; background:var(--s2); border:1px solid var(--bd); color:var(--tx); border-radius:6px; padding:10px 12px; font-size:13px; outline:none; transition:border-color .18s; }
    .pw-input:focus, .pw-search:focus { border-color:var(--ac); }
    .pw-input { margin-bottom:9px; }
    .pw-err { color:#d68a7c; font-size:11px; min-height:14px; margin-bottom:6px; }
    .pw-btn { width:100%; background:transparent; border:1px solid var(--bd); color:var(--tx); border-radius:6px; padding:11px; font-size:13px; font-weight:500; letter-spacing:.2px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:border-color .18s,color .18s; }
    .pw-btn:hover { border-color:var(--txd); }
    .pw-btn svg { display:block; width:15px; height:15px; flex-shrink:0; }
    .pw-btn.primary { background:transparent; color:#edc884; border-color:rgba(237,200,132,.36); }
    .pw-btn.primary:hover { border-color:var(--ac); }
    .pw-btn.primary:disabled { opacity:.5; cursor:not-allowed; }
    .pw-toolbar { display:flex; gap:6px; margin-bottom:10px; position:sticky; top:0; z-index:3; background:var(--bg); padding:8px 0; }
    .pw-icon { flex-shrink:0; background:transparent; border:1px solid var(--bd); color:var(--txd); width:30px; height:30px; border-radius:6px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; padding:0; transition:border-color .18s,color .18s; }
    .pw-icon svg { display:block; width:15px; height:15px; }
    .pw-icon:hover { color:#edc884; border-color:var(--ac); }
    .pw-list { display:flex; flex-direction:column; gap:6px; }
    .pw-section-h { font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.6px; color:var(--txm); margin:8px 2px 3px; }
    .pw-row { display:flex; align-items:center; gap:9px; background:var(--s1); border:1px solid var(--bd); border-radius:10px; padding:9px 10px; }
    .pw-row.match { border-color:var(--ac); }
    .pw-fav { flex-shrink:0; width:16px; height:16px; border-radius:3px; background:var(--s3); }
    .pw-main { flex:1; min-width:0; }
    .pw-title { font-size:12.5px; font-weight:500; color:var(--tx); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .pw-user { font-size:11px; color:var(--txd); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .pw-pw { font-size:11px; color:var(--txm); font-family:ui-monospace,monospace; }
    .pw-actions { display:flex; gap:3px; flex-shrink:0; }
    .pw-fill { background:var(--ac); color:#1a1a1d; border:none; border-radius:7px; padding:0 10px; height:30px; font-size:11px; font-weight:800; cursor:pointer; }
    .pw-fill:hover { filter:brightness(1.08); }

    /* ── Payments panel (Google Wallet–flavoured, same Keychain palette) ── */
    .pay-row { align-items:flex-start; }
    .pay-row.expired { opacity:.72; }
    .pay-mark { flex-shrink:0; width:34px; height:22px; display:flex; align-items:center; justify-content:center; margin-top:2px; }
    .pay-mark svg { width:34px; height:22px; display:block; }
    .pay-numline { display:flex; align-items:center; gap:7px; margin-top:2px; }
    .pay-num { font-size:11.5px; color:var(--txm); font-family:ui-monospace,monospace; letter-spacing:.4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .pay-num.shown { color:var(--ac); }
    .pay-exp { font-size:10px; font-weight:800; color:var(--txm); flex-shrink:0; font-variant-numeric:tabular-nums; }
    .pay-exp.warn { color:#edc884; }
    .pay-exp.bad { color:#d68a7c; }
    /* step-up auth sheet */
    .pay-overlay { position:fixed; inset:0; background:rgba(0,0,0,.66); display:flex; align-items:center; justify-content:center; z-index:40; padding:14px; }
    .pay-modal { background:var(--s1); border:1px solid var(--bdl); border-radius:13px; padding:16px; width:100%; max-width:300px; box-shadow:0 18px 50px var(--shadow); }
    .pay-modal-title { font-size:14px; font-weight:800; color:var(--tx); margin-bottom:4px; }
    .pay-modal-actions { display:flex; gap:6px; }
    .pay-modal-actions .pw-btn { margin:0; }
  </style>
</head>
<body>
 <div id="app">
  <header>
    <div>
      <div class="logo"><span class="base">V</span><span class="dot">ault</span></div>
      <div class="sync" id="sync"></div>
    </div>
    <button class="gear" id="gear" title="Open the Vault app">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <div class="tabs">
    <button class="tab active" id="tab-links" data-panel="links">Links</button>
    <button class="tab" id="tab-pw" data-panel="passwords">Passwords</button>
    <button class="tab" id="tab-pay" data-panel="payments">Payments</button>
  </div>

  <div id="scroll">
    <div class="panel" id="panel-links">
      <div class="loading" id="loading">Loading from Keychain…</div>
      <div id="groups"></div>
    </div>

    <div class="panel hidden" id="panel-passwords">
      <div class="loading">Loading…</div>
    </div>

    <div class="panel hidden" id="panel-payments">
      <div class="loading">Loading…</div>
    </div>
  </div>

  <div id="toast" style="position:fixed;bottom:14px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--s3);border:1px solid var(--bdl);color:var(--tx);font-size:12px;font-weight:600;padding:7px 14px;border-radius:8px;opacity:0;transition:all .2s;pointer-events:none;z-index:10;">Copied!</div>

  <div id="resize-grip" title="Drag to resize">
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
      <g stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
        <line x1="11" y1="3.5" x2="3.5" y2="11"/>
        <line x1="11" y1="7.5" x2="7.5" y2="11"/>
      </g>
    </svg>
  </div>
 </div>

  <script src="vault-icons.js"></script>
  <script src="vault-sync.js"></script>
  <script src="vault-crypto.js"></script>
  <script src="vault-pay.js"></script>
  <script src="vault-pw-core.js"></script>
  <script src="vault-pw.js"></script>
  <script src="vault-pay-panel.js"></script>
  <script src="popup.js"></script>
</body>
</html>
