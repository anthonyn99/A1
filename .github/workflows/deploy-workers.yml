name: Deploy Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'workers/**'
      - '.github/workflows/deploy-workers.yml'
  # Lets you trigger a manual run from the Actions tab if needed
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------
  # Detect which worker folder(s) changed in this push.
  # Each output is "true" only if files in that folder were touched.
  # ---------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      taskhub: ${{ steps.filter.outputs.taskhub }}
      tradeboard: ${{ steps.filter.outputs.tradeboard }}
      newshub: ${{ steps.filter.outputs.newshub }}
      warroom: ${{ steps.filter.outputs.warroom }}
      personalai: ${{ steps.filter.outputs.personalai }}
      studyosfiles: ${{ steps.filter.outputs.studyosfiles }}
      vaultfiles: ${{ steps.filter.outputs.vaultfiles }}
      keychainsync: ${{ steps.filter.outputs.keychainsync }}
      vaultpwsync: ${{ steps.filter.outputs.vaultpwsync }}
      insight: ${{ steps.filter.outputs.insight }}
      oneinbox: ${{ steps.filter.outputs.oneinbox }}
      tesla: ${{ steps.filter.outputs.tesla }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            taskhub:
              - 'workers/taskhub-reminders/**'
            tradeboard:
              - 'workers/tradeboard-api/**'
            newshub:
              - 'workers/newshub-api/**'
            warroom:
              - 'workers/warroom-api/**'
            personalai:
              - 'workers/personal-ai/**'
            studyosfiles:
              - 'workers/studyos-files/**'
            vaultfiles:
              - 'workers/vault-files/**'
            keychainsync:
              - 'workers/keychain-sync/**'
            vaultpwsync:
              - 'workers/vault-pw-sync/**'
            insight:
              - 'workers/insight-api/**'
            oneinbox:
              - 'workers/oneinbox-api/**'
            tesla:
              - 'workers/tesla-api/**'

  # ---------------------------------------------------------------
  # One deploy job per worker. Each runs ONLY if its folder changed.
  # If you ever want to force-deploy everything, run the workflow
  # manually from the Actions tab (workflow_dispatch) — see notes.
  # ---------------------------------------------------------------
  deploy-taskhub-reminders:
    needs: changes
    if: ${{ needs.changes.outputs.taskhub == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          # Pin the major version explicitly. Without this the action falls back
          # to its own bundled default (3.90.0), which is two majors behind and
          # warns "update to the latest version to prevent critical errors" on
          # every run. Same pin the V1 workflow already uses.
          wranglerVersion: "4"
          workingDirectory: workers/taskhub-reminders

  deploy-tradeboard-api:
    needs: changes
    if: ${{ needs.changes.outputs.tradeboard == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          wranglerVersion: "4"
          workingDirectory: workers/tradeboard-api

  deploy-newshub-api:
    needs: changes
    if: ${{ needs.changes.outputs.newshub == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          wranglerVersion: "4"
          workingDirectory: workers/newshub-api

  deploy-warroom-api:
    needs: changes
    if: ${{ needs.changes.outputs.warroom == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          wranglerVersion: "4"
          workingDirectory: workers/warroom-api

  deploy-personal-ai:
    needs: changes
    if: ${{ needs.changes.outputs.personalai == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          wranglerVersion: "4"
          workingDirectory: workers/personal-ai

  deploy-studyos-files:
    needs: changes
    if: ${{ needs.changes.outputs.studyosfiles == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          wranglerVersion: "4"
          workingDirectory: workers/studyos-files

  deploy-vault-files:
    needs: changes
    if: ${{ needs.changes.outputs.vaultfiles == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          wranglerVersion: "4"
          workingDirectory: workers/vault-files

  # Recovered 2026-07-03 from the live Cloudflare deployment — this worker had
  # no source in git before (deployed outside this repo). Now backed up + auto-deploys.
  deploy-keychain-sync:
    needs: changes
    if: ${{ needs.changes.outputs.keychainsync == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          wranglerVersion: "4"
          workingDirectory: workers/keychain-sync

  deploy-vault-pw-sync:
    needs: changes
    if: ${{ needs.changes.outputs.vaultpwsync == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          wranglerVersion: "4"
          workingDirectory: workers/vault-pw-sync

  # Insight (personal finance) — Plaid integration. Sandbox-only until the
  # app-lock gate is wired (INSIGHT_PLAN.md step 7). Secrets on first deploy:
  #   PLAID_CLIENT_ID, PLAID_SECRET_SANDBOX, PLAID_SECRET_PRODUCTION
  deploy-insight-api:
    needs: changes
    if: ${{ needs.changes.outputs.insight == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          wranglerVersion: "4"
          workingDirectory: workers/insight-api

  # OneInbox (oneinbox.html) — Gmail multi-account backend + Gemini
  # email parser. Holds the ONLY copy of the Gmail refresh tokens (in KV) and
  # every API key. Secrets required on first deploy:
  #   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, ONEINBOX_GEMINI_KEY, PUBSUB_TOKEN,
  #   FIREBASE_PROJECT_ID, FIREBASE_CLIENT_EMAIL, FIREBASE_PRIVATE_KEY
  deploy-oneinbox-api:
    needs: changes
    if: ${{ needs.changes.outputs.oneinbox == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          wranglerVersion: "4"
          workingDirectory: workers/oneinbox-api

  # Weather widget on both TaskHubs — KV-cached Open-Meteo proxy. No secrets.
  deploy-tesla-api:
    needs: changes
    if: ${{ needs.changes.outputs.tesla == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          wranglerVersion: "4"
          workingDirectory: workers/tesla-api

