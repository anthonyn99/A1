name = "studyos-files"
# Pinned because a second Cloudflare account exists on this login. Wrangler
# cannot choose between accounts in CI ("More than one account available but
# unable to select one in non-interactive mode") and every deploy fails until
# the account is named here. This is the account the workers actually live on.
account_id = "b9a33dd573c14d5f446516ea8b46285f"
main = "worker.js"
compatibility_date = "2025-06-01"

[vars]
WORKER_ORIGIN = "https://studyos-files.av1.workers.dev"

# ── KV namespace that holds the uploaded files ──────────────────────────────
# Create it ONCE, then paste its id below (the deploy fails until this is real):
#
#   wrangler kv namespace create FILES
#
# …or in the dashboard: Workers & Pages → KV → Create namespace ("studyos-files")
# then copy its ID here. KV (free Workers plan) = no credit card, 1 GB, 25 MB/file.
[[kv_namespaces]]
binding = "FILES"
id = "db15ea4183e84982baabf95bf974d933"
