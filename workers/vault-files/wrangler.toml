name = "vault-files"
# Pinned because a second Cloudflare account exists on this login. Wrangler
# cannot choose between accounts in CI ("More than one account available but
# unable to select one in non-interactive mode") and every deploy fails until
# the account is named here. This is the account the workers actually live on.
account_id = "b9a33dd573c14d5f446516ea8b46285f"
main = "worker.js"
compatibility_date = "2025-06-01"

[vars]
WORKER_ORIGIN = "https://vault-files.av1.workers.dev"

# ── Two separate KV namespaces: one per app (keeps their files isolated) ────
# Create them ONCE, then paste each id below (deploy fails until both are real):
#
#   wrangler kv namespace create KEYCHAIN
#   wrangler kv namespace create LINKS
#
# …or in the dashboard: Workers & Pages → KV → Create namespace (×2).
# KV (free Workers plan) = no credit card, 1 GB + 25 MB/file per namespace.
[[kv_namespaces]]
binding = "KEYCHAIN"
id = "368086aa79d34d8383ef85bd1e4f597b"

[[kv_namespaces]]
binding = "LINKS"
id = "43e7af9882894b5b82f34bb9b6f88719"
