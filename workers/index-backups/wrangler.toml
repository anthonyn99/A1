name = "index-backups"
# Pinned because a second Cloudflare account exists on this login. Wrangler
# cannot choose between accounts in CI ("More than one account available but
# unable to select one in non-interactive mode") and every deploy fails until
# the account is named here. This is the account the workers actually live on.
account_id = "b9a33dd573c14d5f446516ea8b46285f"
main = "worker.js"
compatibility_date = "2025-06-01"

[vars]
WORKER_ORIGIN = "https://index-backups.av1.workers.dev"

# Off-device sink for A1Backup. Every value stored here is AES-256-GCM
# ciphertext produced in the browser against a passphrase this Worker never
# sees, so a compromise leaks sizes and timestamps and nothing else.
#
# Created with:  wrangler kv namespace create A1_BACKUPS
# KV free plan: 1 GB total, 25 MB per value, ~1000 writes/day.
[[kv_namespaces]]
binding = "A1_BACKUPS"
id = "e6dd740c6e484fed867ce47714e67f19"
