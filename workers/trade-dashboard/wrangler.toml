name = "trade-dashboard"
# Pinned because a second Cloudflare account exists on this login. Wrangler
# cannot choose between accounts in CI ("More than one account available but
# unable to select one in non-interactive mode") and every deploy fails until
# the account is named here. This is the account the workers actually live on.
account_id = "b9a33dd573c14d5f446516ea8b46285f"
main = "worker.js"
compatibility_date = "2026-01-01"

# No cron. The weekday MacroBoard pre-build was the only scheduled job here and it
# was removed with the MacroBoard tab; every remaining route is request-driven.

[[kv_namespaces]]
binding = "TD_KV"
id = "897dc1bcd93d4a55ab67836639d3866b"

# Secrets: FINNHUB_KEY (earnings for /calendar).
# MACRO_GEMINI_KEY, GEMINI_KEY, NVIDIA_KEY, GROQ_KEY, FRED_KEY and STAGE_SECRET are
# no longer read — delete them with `wrangler secret delete <NAME>` when convenient.
