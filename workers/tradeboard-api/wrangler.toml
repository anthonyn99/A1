name = "tradeboard-api"
# Pinned because a second Cloudflare account exists on this login. Wrangler
# cannot choose between accounts in CI ("More than one account available but
# unable to select one in non-interactive mode") and every deploy fails until
# the account is named here. This is the account the workers actually live on.
account_id = "b9a33dd573c14d5f446516ea8b46285f"
main = "src/worker.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "TB_KV"
id = "74a9866ac7e944178287f647d76aaf26"
preview_id = "70fc5785592749d0ba5f49b9fe0f05b9"

# ── NO CRON ─────────────────────────────────────────────────────────────────
# A 12:30 UTC "Journal auto-sync" cron sat here until 2026-11-02, but this worker
# never exported a scheduled() handler, so it fired daily and ran nothing. The
# Journal syncs when TradeHub opens (its 6 AM local morning slot, /journal/sync).
# The empty list is deliberate: leaving [triggers] out would keep the old cron
# live on Cloudflare; `crons = []` makes the deploy delete it.
[triggers]
crons = []

# Secrets (wrangler secret put <NAME>):
#   wrangler secret put WEBULL_APP_KEY
#   wrangler secret put WEBULL_APP_SECRET
