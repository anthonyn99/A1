name = "tradeboard-api"
# Pinned because a second Cloudflare account exists on this login. Wrangler
# cannot choose between accounts in CI ("More than one account available but
# unable to select one in non-interactive mode") and every deploy fails until
# the account is named here. This is the account the workers actually live on.
account_id = "b9a33dd573c14d5f446516ea8b46285f"
main = "src/worker.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "TB_KV"
id = "74a9866ac7e944178287f647d76aaf26"
preview_id = "70fc5785592749d0ba5f49b9fe0f05b9"

# ── CRON: Journal auto-sync 6:30 AM Mountain = 12:30 UTC (summer/MDT). ──────
# Pulls latest filled Webull orders + patches missing fees into KV EVERY day,
# weekends and market holidays included — TradeHub's morning orchestrator now
# refreshes on an every-calendar-day 6am slot, so the KV behind it has to be warm
# on a Saturday too (fees/dividends settle after the session, and a Sunday open
# should never be reading Friday's snapshot).
# Journal is ready when you open TradeHub — no manual sync needed.
# DST note: winter (MST) 12:30 UTC = 5:30 AM MT; change 12 -> 13 in November.
[triggers]
crons = ["30 12 * * *"]

# Secrets (wrangler secret put <NAME>):
#   wrangler secret put WEBULL_APP_KEY
#   wrangler secret put WEBULL_APP_SECRET
