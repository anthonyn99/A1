name = "taskhub-reminders"
# Pinned because a second Cloudflare account exists on this login. Wrangler
# cannot choose between accounts in CI ("More than one account available but
# unable to select one in non-interactive mode") and every deploy fails until
# the account is named here. This is the account the workers actually live on.
account_id = "b9a33dd573c14d5f446516ea8b46285f"
main = "worker.js"
compatibility_date = "2024-01-01"

[triggers]
crons = ["* * * * *"]

[observability]
enabled = false

[observability.logs]
enabled = false
invocation_logs = true

[[kv_namespaces]]
binding = "TOKEN_CACHE"
id = "b51e916cf3bf4f37ad146af5ca031575"

# Service binding for the OneInbox piggyback (this worker's cron drives
# oneinbox-api's /cron — see scheduled()). A binding is the supported way to
# call another Worker on the same account: it dispatches in-process, needs no
# public round-trip, doesn't spend a subrequest against the public URL, and is
# not subject to the same-account workers.dev fetch quirks that can silently
# swallow a plain fetch(). The URL fetch is kept as a fallback in code so the
# piggyback still works if the binding is ever missing.
[[services]]
binding = "ONEINBOX"
service = "oneinbox-api"

# Secrets (set via `wrangler secret put <NAME>` — never commit values):
#   FIREBASE_PROJECT_ID     — already set
#   FIREBASE_CLIENT_EMAIL   — already set
#   FIREBASE_PRIVATE_KEY    — already set
#   AUTH_SETUP_KEY          — a strong random string you choose; required to call /auth/profile/setup
#   GMAIL_SENDER            — optional; the Gmail address to send recovery emails from
#                             (requires domain delegation on service account)
#                             if not set, forgot-password falls back to Formspree
