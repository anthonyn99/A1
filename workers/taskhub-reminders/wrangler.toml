name = "taskhub-reminders"
# Pinned because a second Cloudflare account exists on this login. Wrangler
# cannot choose between accounts in CI ("More than one account available but
# unable to select one in non-interactive mode") and every deploy fails until
# the account is named here. This is the account the workers actually live on.
account_id = "b9a33dd573c14d5f446516ea8b46285f"
main = "worker.js"
compatibility_date = "2024-01-01"

[triggers]
crons = ["* * * * *"]

[observability]
enabled = false

[observability.logs]
enabled = false
invocation_logs = true

[[kv_namespaces]]
binding = "TOKEN_CACHE"
id = "b51e916cf3bf4f37ad146af5ca031575"

# Service binding for the OneInbox piggyback (this worker's cron drives
# oneinbox-api's /cron — see scheduled()). A binding is the supported way to
# call another Worker on the same account: it dispatches in-process, needs no
# public round-trip, doesn't spend a subrequest against the public URL, and is
# not subject to the same-account workers.dev fetch quirks that can silently
# swallow a plain fetch(). The URL fetch is kept as a fallback in code so the
# piggyback still works if the binding is ever missing.
[[services]]
binding = "ONEINBOX"
service = "oneinbox-api"

# StudyOS pipeline drain (upgrade spec P-1). studyos-ai has no cron trigger of
# its own — this every-minute tick is what moves its job queue. Same binding
# reasoning as ONEINBOX above: a plain same-account fetch() can be dropped.
#
# ⚠️ COMMENTED OUT UNTIL studyos-ai IS ACTUALLY DEPLOYED.
#
# A service binding is resolved by Cloudflare AT DEPLOY TIME, and studyos-ai
# does not exist on the account yet — its own wrangler.toml deliberately leaves
# the JOBS namespace commented out pending a `wrangler kv namespace create`
# from an authenticated shell. So this block did not merely fail to work: it
# made `wrangler deploy` REJECT taskhub-reminders outright, and every push
# touching this folder failed from 2026-09-11 06:16 onward.
#
# That is a far bigger blast radius than one unfinished feature. This worker
# carries the whole suite's auth: app locks, password hints and reset codes.
# The recovery-email fix sat committed-but-undeployed behind exactly this, so
# reset codes went on silently not arriving while the code that fixed them was
# already in main.
#
# scheduled() already handles the binding being absent — it falls back to
# fetching https://studyos-ai.av1.workers.dev/cron, which 404s today and logs a
# warning, costing nothing that the binding was delivering anyway.
#
# TO RE-ENABLE: deploy studyos-ai first (create its JOBS namespace, set
# ANTHROPIC_API_KEY, let its own deploy job run green), THEN uncomment.
# tests/worker-deploy.test.js fails if this is uncommented while studyos-ai is
# still undeployable.
#
# [[services]]
# binding = "STUDYOSAI"
# service = "studyos-ai"

# Secrets (set via `wrangler secret put <NAME>` — never commit values):
#   FIREBASE_PROJECT_ID     — already set
#   FIREBASE_CLIENT_EMAIL   — already set
#   FIREBASE_PRIVATE_KEY    — already set
#   AUTH_SETUP_KEY          — a strong random string you choose; required to call /auth/profile/setup
#   GMAIL_SENDER            — optional; the Gmail address to send recovery emails from
#                             (requires domain delegation on service account)
#                             if not set, forgot-password falls back to Formspree
