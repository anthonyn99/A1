name = "keychain-sync"
# Pinned because a second Cloudflare account exists on this login. Wrangler
# cannot choose between accounts in CI ("More than one account available but
# unable to select one in non-interactive mode") and every deploy fails until
# the account is named here. This is the account the workers actually live on.
account_id = "b9a33dd573c14d5f446516ea8b46285f"
main = "worker.js"
compatibility_date = "2024-01-01"

[observability]
enabled = false

# Reuses the same KV namespace as taskhub-reminders purely to cache the
# short-lived Google access token (key "gat"). Sharing is safe — different key.
[[kv_namespaces]]
binding = "TOKEN_CACHE"
id = "b51e916cf3bf4f37ad146af5ca031575"

# Secrets (set via `wrangler secret put <NAME>` — never commit values):
#   FIREBASE_PROJECT_ID    — task-dashboard-d2b53   (same as taskhub-reminders)
#   FIREBASE_CLIENT_EMAIL  — service-account email  (same as taskhub-reminders)
#   FIREBASE_PRIVATE_KEY   — service-account private key (same as taskhub-reminders)
#   VAULT_KEY              — shared secret the Vault extension sends in X-Vault-Key
#   LINKS_KEY              — OPTIONAL. Separate key for the /links route (Veda's
#                            Launcher extension). Unset ⇒ /links accepts
#                            VAULT_KEY, so Launcher works with no extra setup.
