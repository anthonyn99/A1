name = "newshub-api"
# Pinned because a second Cloudflare account exists on this login. Wrangler
# cannot choose between accounts in CI ("More than one account available but
# unable to select one in non-interactive mode") and every deploy fails until
# the account is named here. This is the account the workers actually live on.
account_id = "b9a33dd573c14d5f446516ea8b46285f"
main = "worker.js"
compatibility_date = "2025-06-01"

# Pre-warm so data is built for the user opening TradeHub on any device. ONE daily cron
# at 12:00 UTC = builds BEGIN at 06:00 MDT (summer) / 05:00 MST (winter) Mountain time.
# A single UTC cron can't track DST to keep the same local time both seasons, and the
# account is capped at 5 cron triggers total, so two-per-worker (one per offset) isn't
# an option.
# Fires every day, and scheduled() pre-warms BOTH News and Catalysts on every run
# (Mon-Sun, not holiday-gated): world/company news doesn't stop on market holidays,
# and the forward earnings/macro dates shift daily while the client only ever shows
# the forward 30-day window. Catalysts is warmed daily so that opening TradeHub any
# morning at/after 6 finds the full calendar — earnings dates included — already
# built, with nothing left for the browser to do but publish it to Firebase.
[triggers]
crons = ["0 12 * * *"]

[[kv_namespaces]]
binding = "NEWSHUB_CACHE"
id = "dc67fb750dcc4858a8fcff9367b549e9"

[vars]
WORKER_ORIGIN = "https://newshub-api.av1.workers.dev"

# Secrets: GEMINI_KEY, NVIDIA_API_KEY, FINNHUB_KEY, MARKETAUX_KEY,
# STOCKDATA_KEY, ALPHAVANTAGE_KEY, POLYGON_KEY, TIINGO_KEY, STAGE_SECRET.
