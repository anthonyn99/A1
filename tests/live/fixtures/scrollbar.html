<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scrollbar fixture</title>
<style>
  body { margin: 0; background: #1a1a1d; color: #ddd; font: 14px sans-serif; }
  .tall { height: 3000px; }
  #box { width: 300px; height: 200px; overflow: auto; border: 0; }
  #box .in { height: 1200px; }
  #drawer { position: fixed; top: 0; right: 0; width: 260px; height: 300px; overflow-y: auto; z-index: 80; background: #222; }
  #drawer .in { height: 1500px; }
  #own { width: 300px; height: 200px; overflow: auto; }
  #own .in { height: 1200px; }
</style>
<script src="../../../scrollbar.js"></script>
</head>
<body>
  <div id="box"><div class="in"></div></div>
  <div id="own" data-native-scroll><div class="in"></div></div>
  <div id="drawer"><div class="in"></div></div>
  <div class="tall"></div>
</body>
</html>
