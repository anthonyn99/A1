<!-- Single-tab handoff: the newest tab of a program wins and older ones close
     (full rationale in tradehub.html; same code as mylist.html). Opt out with
     window.__a1BlockTabHandoff = true. -->
<script>
(function(){
  if (typeof BroadcastChannel !== 'function') return;
  var PAGE = (location.pathname.split('/').pop() || 'index.html').toLowerCase();
  var BORN = Date.now() + Math.random();   // random breaks ties on same-ms opens
  var bc; try { bc = new BroadcastChannel('a1-single-tab'); } catch(e){ return; }
  function announce(){ try { bc.postMessage({ type:'claim', page:PAGE, born:BORN }); } catch(e){} }
  bc.onmessage = function(e){
    var d = e.data || {};
    if (!d || d.type !== 'claim' || d.page !== PAGE) return;
    if (d.born > BORN) {
      if (window.__a1BlockTabHandoff) return;
      try { window.close(); } catch(_){}
    } else {
      announce();   // older tab was still loading when we announced; retell it
    }
  };
  announce();
})();
</script>

<script id="storage-guard">
/* A browser that blocks site storage (Veda's Brave) makes every touch of
   localStorage/sessionStorage throw. Swap in memory stores so everything works
   for the session; the page says nothing will be remembered (MAGI's shim). */
(function () {
  function mem() {
    var m = new Map();
    return {
      getItem: function (k) { k = String(k); return m.has(k) ? m.get(k) : null; },
      setItem: function (k, v) { m.set(String(k), String(v)); },
      removeItem: function (k) { m.delete(String(k)); },
      clear: function () { m.clear(); },
      key: function (i) { return Array.from(m.keys())[i] || null; },
      get length() { return m.size; }
    };
  }
  window.SHRUTI_STORAGE_BLOCKED = false;
  ['localStorage', 'sessionStorage'].forEach(function (name) {
    try { window[name].getItem('shruti.probe'); } catch (e) {
      window.SHRUTI_STORAGE_BLOCKED = true;
      try { Object.defineProperty(window, name, { value: mem(), configurable: true, writable: true }); } catch (e2) {}
    }
  });
})();
</script>
<script id="profile-resolve">
/* Who is here, decided before first paint (MAGI's order): this tab's explicit
   pick, ?profile= (a pick that had to survive a reload without storage), this
   device's favourite, whoever was here last. None of those: the picker.
   A switch reloads the page, so every key below is one person's from the start. */
(function () {
  var PROFILES = {
    tony: { label: 'Tony', doc: 'shruti', color: '#c0aeea' },
    veda: { label: 'Veda', doc: 'shruti_veda', color: '#A892B0' }
  };
  function g(store, k) { try { return window[store].getItem(k); } catch (e) { return null; } }
  var q = null; try { q = new URL(location.href).searchParams.get('profile'); } catch (e) {}
  var cand = [g('sessionStorage', 'shruti.pick'), q, g('localStorage', 'shruti.favProfile'), g('localStorage', 'shruti.lastProfile')];
  var p = null;
  for (var i = 0; i < cand.length; i++) if (cand[i] && PROFILES[cand[i]]) { p = cand[i]; break; }
  window.SHRUTI_PROFILES = PROFILES;
  window.SHRUTI_PROFILE = p;
  window.SHRUTI_GID = p ? p + '_shruti' : null;
})();
</script>
