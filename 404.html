<!doctype html>
<!-- GitHub Pages serves this page for any address that has no file.
     A page whose address changed (docs/layout.md) is forwarded from its old
     address (bookmarks, home-screen icons, saved links in TaskHub, LifeHub
     and Vault) at once, keeping the query and the hash (#tb=… hand-offs,
     ?profile=…).
     A page that moves adds one line to MOVED. Nothing else belongs here. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>A1</title>
<script>
(function () {
  // old path (below the site root, lower case) -> new path
  var MOVED = {
    // Program pages live at the top (A1's root, V1's top) since 2026-11-03;
    // these are the folder addresses they had for a few hours that day, and
    // older ones.
    'magi/magi.html': 'magi.html',
    'mylist/mylist.html': 'mylist.html',
    'shield/shield.html': 'shield.html',
    'backup/backup-restore.html': 'backup-restore.html',
    'backup/backup-export.html': 'backup-export.html',
    'shruti/shruti.html': 'shruti.html',
    'wellness.html': 'V1/wellness.html',
    'v1/wellness/wellness.html': 'V1/wellness.html',
    'v1/studyos/studyos.html': 'V1/studyos.html',
    'v1/tradeboard/tradeboard.html': 'V1/tradeboard.html',
    'v1/finance/finance.html': 'V1/finance.html'
  };
  var p = location.pathname;
  // The site root: /A1/ on GitHub Pages, / on a local server.
  var m = /^(.*?\/A1\/)(.*)$/i.exec(p) || /^(\/)(.*)$/.exec(p);
  var to = m && MOVED[decodeURIComponent(m[2]).toLowerCase()];
  if (to) { location.replace(m[1] + to + location.search + location.hash); return; }
  window.__a1Missing = true;
})();
</script>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1B1C1E; color: #c9c9cf;
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { text-align: center; padding: 24px 16px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 6px; color: #e8e8ec; }
  a { color: #c0aeea; }
</style>
</head>
<body>
<main hidden id="nf">
  <h1>Nothing lives at this address</h1>
  <p>It may have moved. <a id="home" href="/A1/">Open TaskHub</a></p>
</main>
<script>
  if (window.__a1Missing) {
    var m = /^(.*?\/A1\/)/i.exec(location.pathname);
    document.getElementById('home').href = m ? m[1] : '/';
    document.getElementById('nf').hidden = false;
  }
</script>
</body>
</html>
