<!doctype html>
<!-- GitHub Pages serves this page for any address that has no file.
     Every A1 program lives in its own folder since 2026-11-03 (docs/layout.md);
     their old addresses (bookmarks, home-screen icons, the installed Shield
     agent, saved links in TaskHub and Vault) land here and are forwarded at
     once, keeping the query and the hash (#tb=… hand-offs, ?profile=…).
     A page that moves adds one line to MOVED. Nothing else belongs here. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>A1</title>
<script>
(function () {
  // old path (below the site root, lower case) -> new path
  var MOVED = {
    'magi.html': 'magi/magi.html',
    'mylist.html': 'MyList/mylist.html',
    'shield.html': 'Shield/shield.html',
    'backup-restore.html': 'Backup/backup-restore.html',
    'backup-export.html': 'Backup/backup-export.html',
    'wellness.html': 'V1/Wellness/wellness.html',
    'v1/wellness.html': 'V1/Wellness/wellness.html',
    'v1/studyos.html': 'V1/StudyOS/studyos.html'
  };
  var p = location.pathname;
  // The site root: /A1/ on GitHub Pages, / on a local server.
  var m = /^(.*?\/A1\/)(.*)$/i.exec(p) || /^(\/)(.*)$/.exec(p);
  var to = m && MOVED[decodeURIComponent(m[2]).toLowerCase()];
  if (to) { location.replace(m[1] + to + location.search + location.hash); return; }
  window.__a1Missing = true;
})();
</script>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1B1C1E; color: #c9c9cf;
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { text-align: center; padding: 24px 16px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 6px; color: #e8e8ec; }
  a { color: #c0aeea; }
</style>
</head>
<body>
<main hidden id="nf">
  <h1>Nothing lives at this address</h1>
  <p>It may have moved. <a id="home" href="/A1/">Open TaskHub</a></p>
</main>
<script>
  if (window.__a1Missing) {
    var m = /^(.*?\/A1\/)/i.exec(location.pathname);
    document.getElementById('home').href = m ? m[1] : '/';
    document.getElementById('nf').hidden = false;
  }
</script>
</body>
</html>
