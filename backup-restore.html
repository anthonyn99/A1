<title>Restore TaskHub</title>
<!-- Restore a TaskHub from its encrypted backups, or undo a restore. Opened from
     TaskHub → Settings → Backup → Restore (?profile=tony|veda picks the tab).

     WHERE THE BACKUPS COME FROM
       1. The index-backups worker: every device's last 14 snapshots, read with
          this page's App Check token. Nobody has to pull anything first.
       2. This browser's own vault (last 72h), when it holds the passphrase.
       3. The repo copy in Index Backups/, only if the worker can't be reached.
     Each person's devices use their own passphrase; every snapshot holds BOTH
     TaskHubs, so either passphrase can restore either one. A typed passphrase
     stays in memory only.

     WHAT A RESTORE WRITES (only after Restore is pressed and confirmed)
       dashboards/<doc>_prerestore  {at, kind, doc: the state before, from, mode}
       dashboards/<doc>_restored    {at, doc: the state written}
       dashboards/<doc>             the restored state, with a fresh savedAt
     Undo reads those two back and three-way merges (backup-merge.js), so edits
     made after the restore survive the undo. An undo is itself a restore, so it
     can be undone (redo). Does not run TaskHub, so no stale local copy here can
     write back over the result. -->

// ── States of one TaskHub: distinct documents, keyed by their savedAt ───────
const STATES = { main: new Map(), vedasdash: new Map() };
const LOADING = { main: null, vedasdash: null };
const PROG = { main: null, vedasdash: null };
const LIVE = {}, PRE = {}, RESTORED = {}, LIVEKEYS = {};

function keysOf(d) {
  const s = new Set();
  const add = (w, a) => { if (Array.isArray(a)) a.forEach((x, i) => s.add(w + '|' + (x && x.id != null ? x.id : i))); };
  LISTS.forEach((f) => add(f, (d || {})[f]));
  const data = (d || {}).data || {};
  Object.keys(data).forEach((k) => add('data/' + k, data[k]));
  return s;
}
function liveMinDay(name) {
  const ks = Object.keys((LIVE[name] || {}).data || {}).sort();
  return ks[0] || '';
}
// How many of a backup's items this TaskHub no longer has. Days older than the
// live doc's oldest day were archived (they live in the sidecars), not lost.
function statsFor(name, st) {
  const live = LIVEKEYS[name] || new Set(), min = liveMinDay(name), keys = keysOf(st.doc);
  let back = 0;
  keys.forEach((k) => {
    if (live.has(k)) return;
    const m = /^data\/([^|]+)\|/.exec(k);
    if (m && m[1] < min) return;
    back++;
  });
  st.items = keys.size; st.back = back;
  st.same = st.doc.savedAt === (LIVE[name] || {}).savedAt;
}
function setLive(name, d) {
  LIVE[name] = d || {};
  LIVEKEYS[name] = keysOf(LIVE[name]);
  STATES[name].forEach((st) => statsFor(name, st));
  PLANS.clear();
}

function loadStates(name) {
  if (LOADING[name]) return LOADING[name];
  const seen = new Set(), hs = [];
  SNAPS.slice().sort((a, b) => b.at - a.at).forEach((s) => {
    const h = s.hashes[name];
    if (h && !seen.has(h)) { seen.add(h); hs.push(h); }
  });
  let n = 0;
  PROG[name] = { n: 0, of: hs.length };
  let paint = 0;
  LOADING[name] = pool(hs, 4, async (h) => {
    try {
      const d = await getObj(h);
      if (d && typeof d.savedAt === 'number') {
        const devs = SNAPS.filter((s) => s.hashes[name] === h);
        const prev = STATES[name].get(d.savedAt);
        const st = prev || { doc: d, devices: new Set(), captured: Infinity };
        devs.forEach((s) => { st.devices.add(s.device); st.captured = Math.min(st.captured, s.at); });
        if (!prev) { statsFor(name, st); STATES[name].set(d.savedAt, st); }
      }
    } catch (e) { /* one unreadable copy never blocks the rest */ }
    PROG[name].n = ++n;
    if (name === CUR && Date.now() - paint > 250) { paint = Date.now(); render(); }
  }).then(() => { PROG[name] = null; if (name === CUR) render(); });
  return LOADING[name];
}

// ── Selection and plan ──────────────────────────────────────────────────────
const SEL = { main: null, vedasdash: null };       // savedAt | 'undo'
const MODE = { main: 'merge', vedasdash: 'merge' };
const PLANS = new Map();
let DONE = null;                                   // { name, kind } after a write

function sorted(name) { return [...STATES[name].values()].sort((a, b) => b.doc.savedAt - a.doc.savedAt); }

// A1BackupMerge.pickBase, with each version's item map built once instead of
// once per comparison: the same answer, fast enough to re-plan on every tap.
const MAPS = new WeakMap();
function itemMap(d) {
  if (MAPS.has(d)) return MAPS.get(d);
  const o = new Map(), norm = A1BackupMerge._norm;
  const add = (w, a) => { if (Array.isArray(a)) a.forEach((x, i) => o.set(w + '|' + ((x && x.id != null ? String(x.id) : null) || i), norm(x))); };
  LISTS.forEach((f) => add(f, (d || {})[f]));
  const data = (d || {}).data || {};
  Object.keys(data).forEach((k) => add('data/' + k, data[k]));
  MAPS.set(d, o);
  return o;
}
function pickBase(cands, live) {
  const lm = itemMap(live);
  let best = null, bestD = Infinity;
  for (const c of cands) {
    const cm = itemMap(c);
    let n = 0;
    cm.forEach((v, k) => { if (lm.get(k) !== v) n++; });
    lm.forEach((v, k) => { if (!cm.has(k)) n++; });
    if (n < bestD) { bestD = n; best = c; }
  }
  return { base: best, distance: bestD };
}

function planFor(name, st, mode) {
  const k = name + '|' + st.doc.savedAt + '|' + mode + '|' + (LIVE[name] || {}).savedAt;
  if (PLANS.has(k)) return PLANS.get(k);
  const older = sorted(name).filter((s) => s.doc.savedAt < st.doc.savedAt).map((s) => s.doc);
  const pb = pickBase(older, LIVE[name]);
  const r = mode === 'exact' ? A1BackupMerge.rollbackDoc(pb.base || {}, st.doc, LIVE[name])
                             : A1BackupMerge.mergeDoc(pb.base || {}, st.doc, LIVE[name]);
  const out = { doc: r.doc, report: r.report, base: pb.base };
  PLANS.set(k, out);

}
// Undo = three-way merge from the state the restore wrote back to the state
// before it, so whatever was done after the restore stays. Without the record
// of what was written (restores made before 2026-10-19), it is an exact copy.
function undoPlan(name) {

  if (PLANS.has(k)) return PLANS.get(k);
  const base = RESTORED[name] && RESTORED[name].at === pre.at ? RESTORED[name].doc : null;
  const r = base ? A1BackupMerge.mergeDoc(base, pre.doc, live) : A1BackupMerge.rollbackDoc({}, pre.doc, live);
  const out = { doc: r.doc, report: r.report, exact: !base, since: base ? live.savedAt !== base.savedAt : live.savedAt !== pre.restoredSavedAt };
  PLANS.set(k, out);
  return out;
}

}

async function commit(w) {
  // Someone edited since this page read it: re-plan against the new state and
  // let the person look again, rather than write a plan made for an old one.
  const now = await readDoc(w.name) || {};
  if ((now.savedAt || 0) !== (LIVE[w.name].savedAt || 0)) {
    setLive(w.name, now);
    render();
    throw new Error(DOCS[w.name] + '’s TaskHub changed while this page was open. The preview is updated: check it and press again.');
  }
  const at = Date.now();
  const out = Object.assign({}, w.doc, { savedAt: at });
  delete out.rev;
  const pre = Object.assign({ at, kind: w.kind, doc: LIVE[w.name], restoredSavedAt: at, by: HERE || null }, w.meta);
  await setDoc(ref(w.name + '_prerestore'), pre);
  await setDoc(ref(w.name + '_restored'), { at, doc: out });
  // TaskHub's versioned save (index.html, _casWrite): the doc and its head move
  // together, one version past the head, and only if the head is still on the
  // version this page read. Otherwise every TaskHub would skip this as older.
  const rev = await runTransaction(db, async (tx) => {
    const h = await tx.get(ref(w.name + '_head'));
    const cur = h.exists() ? (h.data().rev || 0) : 0;
    if (h.exists() && cur !== (LIVE[w.name].rev || 0)) return null;
    tx.set(ref(w.name), Object.assign({}, out, { rev: cur + 1 }));
    tx.set(ref(w.name + '_head'), { rev: cur + 1, savedAt: at, by: 'restore' });
    return cur + 1;
  });
  if (rev == null) {
    setLive(w.name, await readDoc(w.name) || {});
    render();
    throw new Error(DOCS[w.name] + '’s TaskHub changed while this page was open. The preview is updated: check it and press again.');
  }
  out.rev = rev;
  RESTORED[w.name] = { at, doc: out };
  PRE[w.name] = pre;
  setLive(w.name, out);
}

$('go').onclick = async () => {
  const w = WORK;
  if (!w) return;
  const ok = await confirmDlg(w.label, w.ask + '\n\n' + (w.kind === 'undo' ? 'The restored state is kept, so you can redo it.' : 'What it holds now is kept, so you can undo this.'), w.label);
  if (!ok) return;
  $('go').disabled = true;
  say('Writing…', 'busy');
  try {
    await commit(w);
    DONE = { name: w.name, kind: w.kind };
    SEL[w.name] = null; NOPICK[w.name] = true;
    say('');
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    window.__restored = Date.now();
  } catch (e) {
    say(String(e && e.message || e) + (/changed while/.test(String(e && e.message)) ? '' : '\nNothing was changed.'), 'bad');
    $('go').disabled = false;
  }
};

// ── Opening ─────────────────────────────────────────────────────────────────
async function open(pass) {
  say('Opening backups…', 'busy');
  $('passcard').hidden = true;
  DEC = pass ? (env) => A1Backup._internals.decryptEnvWith(env, pass) : A1Backup._internals.decryptEnv;
  SNAPS = []; LOADERS.clear(); OBJ.clear(); PLANS.clear();
  for (const n of Object.keys(DOCS)) { STATES[n] = new Map(); LOADING[n] = null; PROG[n] = null; SEL[n] = null; }
  try {
    await signInAnonymously(getAuth(app));
    let opened = 0, workerErr = null;
    try { opened += await fromWorker(); } catch (e) { workerErr = e; }
    if (!pass) { try { opened += (await fromVault()) ? 1 : 0; } catch (e) {} }
    if (workerErr) { try { opened += await fromRepo(); } catch (e) {} }
    if (!SNAPS.length) {
      $('passcard').hidden = false;
      $('pw').focus();
      return say(workerErr && !opened ? 'Could not reach the backups (' + (workerErr.message || workerErr) + '). Check the connection and reload.'
        : pass ? 'That passphrase did not open any backup. Check it, or try the other person’s.'
               : 'This browser’s saved passphrase did not open any backup. Type one below.', 'bad');
    }
    say('Reading ' + DOCS[CUR] + '’s TaskHub…', 'busy');
    const [m, v, pm, pv, rm, rv] = await Promise.all(['main', 'vedasdash', 'main_prerestore', 'vedasdash_prerestore', 'main_restored', 'vedasdash_restored'].map(readDoc));
    setLive('main', m); setLive('vedasdash', v);
    PRE.main = pm; PRE.vedasdash = pv; RESTORED.main = rm; RESTORED.vedasdash = rv;
    $('otherpass').hidden = !!pass;
    $('main').hidden = false;
    say(workerErr ? 'The backup server could not be reached, so only older copies are listed.' : '', workerErr ? 'bad' : 'ok');
    render();
    loadStates(CUR).then(() => { for (const n of Object.keys(DOCS)) loadStates(n); });
  } catch (e) {
    say('Could not open the backups: ' + (e && e.message || e), 'bad');
  }
}

document.querySelectorAll('#tabs button').forEach((b) => b.addEventListener('click', () => {
  if (CUR === b.dataset.doc) return;
  CUR = b.dataset.doc;
  try { history.replaceState(null, '', '?' + new URLSearchParams(Object.assign(Object.fromEntries(qs), { profile: CUR === 'vedasdash' ? 'veda' : 'tony' }))); } catch (e) {}
  if (!$('main').hidden) loadStates(CUR);
  render();
}));
$('back').addEventListener('click', (e) => {
  // Came from TaskHub: go back to it rather than stacking a second copy.
  if (history.length > 1 && /index\.html|\/A1\/?$|\/$/.test(document.referrer)) { e.preventDefault(); history.back(); }
});
$('otherbtn').onclick = () => { $('passcard').hidden = false; $('pw').focus(); };
$('pf').onsubmit = (e) => {
  e.preventDefault();
  const pw = $('pw'), pass = pw.value;
  pw.value = '';
  if (pass) open(pass);
};

render();
if (A1Backup.isSetUp()) open(null);
else { say(''); $('passcard').hidden = false; }
</script>
