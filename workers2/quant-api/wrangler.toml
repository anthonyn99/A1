name = "quant-api"
# TradeHub Quant's worker (A1-Priv docs/TradeHub/quant-plan.md). Deploys to
# Cloudflare "My Account 2" (av1-2.workers.dev) via
# .github/workflows/deploy-workers2.yml; no account_id here on purpose.
main = "worker.js"
compatibility_date = "2026-01-01"

# NO KV, on purpose: KV writes (1,000 a day per account) are the limit that has
# bitten this suite before. Everything this worker stores is in D1.
[[d1_databases]]
binding = "DB"
database_name = "quant"
database_id = "25323b25-f012-4320-85f3-2f1de7a0881c"
migrations_dir = "migrations"

# The alert check (lib/alerts.js, Phase 14): every minute. Outside the New York
# session (04:00 to 20:00 on a trading day), only standing push retries run.
# Account 2's other workers have no cron (checked
# 2026-11-16), so this is 1 of its 5 slots.
[triggers]
crons = ["* * * * *"]

# Secrets (wrangler secret put <NAME>, with CLOUDFLARE_ACCOUNT_ID = account 2):
#   ALLOWED_KEYS   comma-separated SHA-256 hex of the Orca keys that may call
#                  this worker. Unset = every request but /health is refused.
#   FINNHUB_KEY    market data (the same service newshub-api uses on account 1)
#   GROQ_KEY       Neo Quant's fast AI lane, and its hearing (Groq Whisper, lib/hear.js)
# Read by the data gateway when set (each source is skipped without its key):
#   ALPACA_KEY, ALPACA_SECRET   Alpaca PAPER key (the paper account TradeHub trades in, lib/paper.js; also the worker's
#                               market data; never handed to the page)
#   ALPACA_DATA_KEY, ALPACA_DATA_SECRET  a separate, EMPTY Alpaca paper account's key: the only Alpaca key
#                               /stream-keys hands to the page (Batch 4 T0)
#   WEBULL_PAPER_KEY, WEBULL_PAPER_SECRET  Webull OpenAPI paperTrade app (sandbox only; Batch 4 T0/T1)
#   PUBLIC_KEY                  Public.com API secret (PUBLIC_ACCOUNT_ID optional)
#   TIINGO_KEY                  the second source for daily history
#   ALPHAVANTAGE_KEY            the dossier's second source for price targets (at most 20 calls a day)
#   GEMINI_KEY                  Neo Quant's specialist (search, images, long reads; lib/gemini.js)
# Neo Quant's other fast-lane providers, each skipped without its key (lib/ai.js):
#   CEREBRAS_KEY, OPENROUTER_KEY, MISTRAL_KEY, GITHUB_MODELS_KEY, NVIDIA_KEY
#   HEAR_SECRET                 the key quant-hear (account 3) expects; the same value is set there
#   PUSH_SECRET                 the alert check's key to taskhub-reminders /quant-push (account 1);
#                               the same value is QUANT_PUSH_SECRET there

# Neo Quant's hearing backup: Workers AI Whisper on account 3 (A1 workers3/quant-hear),
# so this worker needs no `AI` binding (that would also add Workers AI chat to the answer chain).
[vars]
HEAR_URL = "https://quant-hear.anthony-account-3.workers.dev"
# Where the alerts are pushed from (TaskHub's reminders worker: Tony's devices only).
PUSH_URL = "https://taskhub-reminders.av1.workers.dev"
