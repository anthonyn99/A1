name = "index-backups"
# Deploys to Cloudflare "My Account 2" (av1-2.workers.dev) via
# .github/workflows/deploy-workers2.yml. NO account_id here on purpose -- the
# workflow supplies it from CF_ACCOUNT_ID_2, so a worker cannot be pointed at
# the wrong account by editing its own config.
main = "worker.js"
compatibility_date = "2025-06-01"

[vars]
WORKER_ORIGIN = "https://index-backups.av1-2.workers.dev"

# Off-device sink for A1Backup. Every value stored here is AES-256-GCM
# ciphertext produced in the browser against a passphrase this Worker never
# sees, so a compromise leaks sizes and timestamps and nothing else.
#
# KV free plan: 1 GB total, 25 MB per value, 1000 writes/day PER ACCOUNT. This
# worker is on account 2 precisely because it was the fastest-growing writer on
# account 1 (0 -> ~105 writes/day within a week of shipping, scaling with the
# number of devices backing up).
# ── KV on ACCOUNT 2 ─────────────────────────────────────────────────────────
# `kv:<TITLE>` is a PLACEHOLDER, not an id. A KV namespace lives in exactly one
# account, so the account-1 id this worker used before the move is meaningless
# here. workers2/kv-provision.mjs resolves the title against account 2 (creating
# it on first deploy) and writes the real id into this file inside the CI
# checkout — see .github/workflows/deploy-workers2.yml. Nothing is committed.
[[kv_namespaces]]
binding = "A1_BACKUPS"
id = "kv:A1_BACKUPS"

# ── Secrets — PER ACCOUNT. Cloudflare secrets do not move with a worker, so
#    this one had to be re-set after the account-2 migration:
#      CLOUDFLARE_ACCOUNT_ID=<account 2 id> npx wrangler secret put PULL_SECRET
#    PULL_SECRET authorises READ-ONLY pulls by tools/pull-backups.mjs, which has
#    no browser to mint an App Check token with. Writes still require App Check.
#    The value is the one in .a1b-pull-secret (gitignored) — unchanged by the
#    move, so the local pull tool keeps working once it is set here.
